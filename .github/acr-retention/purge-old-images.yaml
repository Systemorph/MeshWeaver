version: v1.1.0
# 🚨 ONE task, TWO steps. Do NOT merge the filter lists into a single `acr purge`.
#
# The two lists are NOT symmetric and the difference is load-bearing:
#   * mw-plugin-test  is unique to the FIRST step — the CI tester, republished many times a day.
#   * memex-portal    is unique to the SECOND    — the PRODUCTION portal image.
# 🚨 BOTH STEPS NOW CARRY THE SAME `--ago 30d` (see the window note below; until 2026-09-13 the
# first was `--ago 7d --keep 10`). They stay SEPARATE anyway: a union-merge would silently retune
# one of them the next time either window moves, and memex-portal is pinned on the OTHER axis
# (committed tags in the deployment overlays, Memex#141), which the pinned-digest guard cannot see —
# exactly how Memex#122's victim was pinned, where purging a pinned tag took the public brand site
# down for ~11 h and nothing alerted.
#
# 🚨 memex-website is DELIBERATELY absent from every filter (Memex#122, 2026-08-26). Its only tag is a
# pinned `v1` that nothing rebuilds, so `--ago 30d` deleted the entire repository.
#
# 🚨 TWO tests before adding any repository to either step:
#   1. If this tag were deleted tonight, would anything RECREATE it?           (Memex#122)
#   2. Does anything PIN a digest of it?                                        (#3438)
# Test 2 is the one mw-plugin-test passes on test 1 and fails in practice: it republishes constantly,
# and `--keep 10` counts NEWER BUILDS, so frequent republishing is what DESTROYS a pin rather than
# protecting it. Every satellite pins the tester and portal by digest for WEEKS at a time
# (Doc/Architecture/ModuleBuildArchitecture) — the retention window and the intended pin lifetime are
# in direct contradiction, and nothing but the lock reconciles them.
#
# 🚨 Raising --ago / --keep is NOT a fix: it moves the cliff. A pin left stable for a quarter walks
# off the new one just the same. The window below is NOT offered as pin protection — the lock is —
# it is the decided policy the other two stores already enforce, stated here so that re-enabling
# this task cannot silently apply a window nobody chose.
#
# 🚨 THE WINDOW IS 30 DAYS BY AGE WITH NO BUILD-COUNT QUOTA, AND THAT IS A DECISION, NOT A TUNING.
# #3842, quoted in #3438's body and in #3859's acceptance list: *retain unreferenced continuous
# artifacts for at least 30 days by age, without a build-count quota*. #3843 clamped
# `PrebuiltBundleRetention` to it, #3846 clamped `AssemblyCacheRetention` to it, and #3843's own
# body records that the registry was left out: *"The ACR task record and live cloud cleanup are
# unchanged."* This step was the third store and the one nobody asserted — it carried
# `--ago 7d --keep 10` over five continuously-republished repositories, `memex-portal-ai` among
# them, which is the image BOTH production portals run.
#
# `--keep` is gone rather than raised. It counts NEWER BUILDS, so a repository republished many
# times a day ages its own manifests out in hours regardless of `--ago` — which is #3438's root
# cause stated as a flag, not a second-order concern.
#
# 🚨 THE RECORD IS AHEAD OF THE REGISTRY HERE, ON PURPOSE, AND tasks.json DECLARES IT under
# `recordAheadOfRegistry`. The live task is DISABLED (paused, Memex#219) and still carries
# `--ago 7d --keep 10`; `acr-retention-tasks.sh apply` is what pushes this file onto it, so this
# is the window a re-enable would install. Do NOT "fix" the drift by running
# `acr-retention-tasks.sh record` — that overwrites this file FROM the live task and silently
# restores the 7-day quota window. `lock-pinned-digests.py --check-retention-record` then reds,
# on every pull request, which is how that mistake is caught.
#
# PROTECTION IS THE MANIFEST LOCK, not this policy. Live pinned digests carry
# `--delete-enabled false`; `acr purge` skips locked manifests by default and neither step passes
# `--include-locked`. Locking a digest is what makes a pin survive; this file only decides what is
# eligible in the first place. Lock a digest BEFORE it is pinned, and release it when the pin moves.
# Current locks (2026-09-06, the 3.0.0-ci.7917 wave):
#   mw-plugin-test@sha256:642f686f…   memex-portal-ai@sha256:31aab07d…
#
# Both steps share one 3600 s task budget.
#
# Doc: Doc/Architecture/PinnedImageRetention. Incidents: Memex#122, MeshWeaver#3438 (Education,
# Manufacturing and SocialMedia CI down simultaneously 2026-09-05T15:29Z on a purged tester digest).
steps:
  - cmd: acr purge --filter 'mw-plugin-test:.*' --filter 'memex-migration:.*' --filter 'memex-portal-ai:.*' --filter 'memex-portal-next:.*' --filter 'memex-bake:.*' --ago 30d --untagged
    disableWorkingDirectoryOverride: true
    timeout: 3600
  - cmd: acr purge --filter 'memex-portal:.*' --ago 30d --untagged
    disableWorkingDirectoryOverride: true
    timeout: 3600
