# Dependabot version updates — the ECOSYSTEM half of dependency maintenance.
# (The PLATFORM half — plugin repos tracking this repo's version line — is the mesh-native
# update agent on the registry instance, not Dependabot; see the modularization program.)
#
# Grouping: minor+patch bumps arrive as ONE weekly PR per ecosystem so the update tax is a
# review, not a storm; majors and security fixes arrive individually. Every PR rides the full
# CI gate (Release -warnaserror, NuGetAudit, the test shards, the Clients workflow), so the
# merge bar is the same green-only bar as any change.
version: 2
updates:
  # .NET — central package management: every version lives in /Directory.Packages.props.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # JS clients — one update config over all workspaces; grouped the same way.
  - package-ecosystem: npm
    directories:
      - "/clients/react"
      - "/clients/grpc-web"
      - "/clients/typescript"
      - "/clients/portal-next"
      - "/clients/react-native"
      - "/clients/portal"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Majors grouped too — the first weekly run opened 20 individual major PRs (TS 7, vite 8,
      # @types/node 26, react 19, …), each burning a full CI cycle + a Copilot review. One majors
      # PR per wave keeps the review meaningful and the CI bill bounded.
      npm-major:
        applies-to: version-updates
        update-types: [major]
    ignore:
      # react-native's 0.x "minors" are breaking platform jumps coupled to the Expo SDK
      # (0.76→0.86 requires React 19): the first wave's group PR broke npm ci on exactly this.
      # RN (and react-native-web, which tracks it) upgrade DELIBERATELY with the Expo SDK.
      - dependency-name: react-native
      - dependency-name: react-native-web

  # Python SDK.
  - package-ecosystem: pip
    directory: "/clients/python"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5

  # Actions pins across all workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      actions-all:
        applies-to: version-updates
        update-types: [major, minor, patch]

  # The portal-ai base image (Node + CLI + Playwright layers).
  - package-ecosystem: docker
    directory: "/deploy/base-images/portal-ai"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
