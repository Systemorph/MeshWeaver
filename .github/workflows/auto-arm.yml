# Arm auto-merge on every non-draft PR, so a PR that goes green LANDS.
#
# 🚨 This does not weaken a single gate. Auto-merge waits for exactly the required contexts
# branch protection already demands; it removes only the human round-trip between "green" and
# "merged". The failure it fixes is the one measured on 2026-09-01: core had SIX PRs sitting
# CLEAN and unarmed with an empty merge queue — nothing was failing, nothing was blocked, and
# nothing was landing either. A green PR nobody arms is indistinguishable from a red one.
#
# 🚨 THIS FILE IS THE FLEET'S ONLY COPY OF THE ARM LANE. It runs directly here on
# `pull_request_target`, and every OTHER repo in the fleet reaches it through `workflow_call` with
# a caller that forwards the App credential and nothing else. (Deliberately no list of repo names
# here: an enumeration in a comment is a copy of the fleet roster and would drift exactly the way
# the copies below did. `gh search code --owner Systemorph "auto-arm.yml@"` answers who calls it.)
# The repos are NOT identical — core runs a merge queue and the others do not — so the arm step
# handles both shapes rather than the file forking per repo.
#
# It used to be hand-copied into every one of them, and the copies DRIFTED exactly as AGENTS.md
# warns a copy-pasted lane does. Measured 2026-09-02 — the numbers below are a record of that
# measurement, not a live count: core had already been moved to a minted App token (below) while
# every satellite copy was still arming with `secrets.GITHUB_TOKEN`, so every satellite was living
# the #2916 outage this file's header documents, silently. MeshWeaver.Reinsurance's `main` had not
# seen a `push`-event run since 09:11Z despite PRs merging all afternoon. On top of that, only
# .Crm carried the "landed:" read-back fix below, and several copies had no `timeout-minutes` at
# all — four distinct variants of a file whose header claimed all copies were identical. One lane,
# called from everywhere, cannot drift.
#
# 🚨 The `workflow_call` secrets are named `MESHWEAVER_APP_ID` / `MESHWEAVER_APP_PRIVATE_KEY` — the
# SAME names as the repository secrets the direct `pull_request_target` trigger reads. That is
# deliberate: `secrets.MESHWEAVER_APP_ID` then resolves correctly in BOTH modes (the repo secret
# when this workflow is triggered here, the forwarded value when it is called), so the body needs
# no `||` fallback and there is no second name to get wrong. A caller passes them explicitly —
# never `secrets: inherit`, which would hand this lane every secret the calling repo owns.
#
# Deliberately NOT here:
#   * no `if: ${{ vars.X != '' }}` — invariant #3; a skipped job renders like a passed one.
#   * drafts are skipped, which is the ONE opt-out. Mark a PR draft and it will not be armed;
#     that is the intended way to say "not ready", rather than withholding the arm.
#   * forks are skipped: arming a PR from a fork would let an outside branch merge itself the
#     moment the required set passes.
#
# 🚨🚨 THE ARM CREDENTIAL IS LEAD, NOT TRIM — it decides whether main's push lanes run at all.
# This lane armed with `secrets.GITHUB_TOKEN` for six hours on 2026-09-01, and the consequence was
# measured on #2916: GitHub performs an auto-merge as the identity that ARMED it, so the merge
# landed as `github-actions[bot]` — and a push created with `GITHUB_TOKEN` deliberately does not
# trigger workflow runs. main's HEAD therefore got NO `push`-event run of anything:
#
#   8cc1cc6e  merged by rbuergi (human)   Build and Test ✅  Chart Gate ✅  Hosting Operator ✅
#   19628536  merged by github-actions[bot]                 (nothing)
#   b3e6ae65  merged by github-actions[bot]                 (nothing)
#   04d25efa  merged by github-actions[bot]                 (nothing)
#   dc6c5a45  merged by github-actions[bot]                 (nothing)
#
# No push run ⇒ no `Consolidate test results` on main's HEAD ⇒ `main-cd`'s readiness gate reads
# `absent/none` and waits, on every tick, forever ⇒ NOTHING IS EVER PROMOTED and every
# self-updating install stays on the previous image. Four commits' worth of delivery was lost
# before anyone noticed, because the reconciler cannot tell "CI has not run YET" from "CI will
# NEVER run" — both read `absent/none`. That is the AGENTS.md skip-trapdoor one level down: a
# SUPPRESSED TRIGGER renders exactly like a slow one.
#
# So the arm runs on a minted GitHub App installation token, whose merges are ordinary pushes that
# trigger everything. Never put `secrets.GITHUB_TOKEN` back here — see
# `ArmedMergeMustTriggerMainsPushLanesGuard`, which fails the build if anyone does.
name: Arm auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  # The satellites' entry point. A caller keeps the SAME `pull_request_target` trigger and one job
  # that `uses:` this file — so `github.event` inside is the caller's pull-request event, and
  # `github.repository` / `github.event.repository.name` are the CALLING repository, which is what
  # the mint scopes to and what `gh pr merge` is pointed at. Nothing below needs to know whether it
  # is running here or there.
  workflow_call:
    secrets:
      MESHWEAVER_APP_ID:
        description: >-
          App id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet.
          Required: an arm performed with secrets.GITHUB_TOKEN merges as github-actions[bot], whose
          push triggers no workflows at all (#2916).
        required: true
      MESHWEAVER_APP_PRIVATE_KEY:
        description: >-
          That App's private key (PEM). Source of truth is Key Vault Systemorph/github-app-privatekey.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: Arm auto-merge on this PR
    runs-on: ubuntu-latest
    # 🚨 Job-level, not workflow-level, and that is load-bearing now that this file is also called.
    # A concurrency group is per-repository, and a CALLER run and the job it dispatches into this
    # workflow are two separate holders of it: if both named `auto-arm-<n>` the inner job would
    # queue behind the caller run that is waiting for it, and the lane would deadlock until the
    # cap fired. Declared on the job, the group is held once per run in either mode. Callers must
    # therefore NOT add a `concurrency:` block of their own — this one already covers them.
    concurrency:
      group: auto-arm-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Four API calls and a mint — the same shape as arm-credential.yml, capped the same way. The
    # fleet ceiling is 45 (check-workflow-timeouts.py); a lane whose whole job is to call gh three
    # times has no business sitting on a billed runner for three quarters of an hour because a
    # socket hung. This cap now applies to every repo that calls this lane.
    timeout-minutes: 10
    # A draft is the opt-out, and a fork must never arm itself. Both are properties of the
    # event, not configuration — there is no variable here to forget to set.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # No `if:` on any step that DECIDES anything below. The assert, the mint and the arm run
      # unconditionally: they assert and fail, they do not choose whether to run. The ONE exemption
      # is on the job, and it is a property of the EVENT (draft, fork), never a question about
      # whether a credential happens to be set — invariant #3.
      #
      # The single `if:` further down is on a step that only PRINTS, and it is conditioned on a
      # failure having already happened. A diagnostic that can turn nothing green is not a
      # trapdoor — the distinction that matters is whether an `if:` can make a gate not run, and
      # that one cannot.
      - name: The App credential, or a red run naming what to provision
        env:
          MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$MESHWEAVER_APP_ID" ]          || missing+=("secrets.MESHWEAVER_APP_ID           app id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet")
          [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::auto-arm cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "App credential present."

      # 🚨 `gh pr merge --auto` is the `enablePullRequestAutoMerge` GraphQL mutation, so the token
      # needs `Pull requests: write`; the merge it later performs needs `Contents: write`. Both are
      # requested explicitly, so an installation that is missing either fails HERE — loudly, on a
      # step whose name says what it wanted — rather than degrading to a token that arms fine and
      # then merges in a way that starts no CI. There is deliberately no fallback: falling back to
      # `secrets.GITHUB_TOKEN` is precisely the outage this file's header documents.
      # 🚨 `continue-on-error` — the ONE in this file, and the reason is that arming is an
      # ACTION, not a GATE. AGENTS.md forbids this on a step that fetches a gate's input, because
      # a verification that silently does not run is indistinguishable from one that passed. That
      # hazard does not exist here: this job asserts NOTHING about the pull request. Every required
      # context still runs, `Consolidate test results` still decides, and a PR that cannot be armed
      # is merged by a human — the outcome is a lost convenience, not a lost check.
      #
      # What it buys is signal. A missing grant is a property of the REPOSITORY, identical on every
      # PR at once, so failing here painted a red that was the same on all of them — a check whose
      # value never varies carries no information about any PR, and a wall of permanent red is how
      # a real red stops being read. The assertion still exists and is still RED; it moved to
      # `arm-credential.yml`, which asks the repo-scoped question in the one place it is actionable.
      #
      # 🚨 That split is load-bearing: the tolerance below is only safe while that lane exists.
      # `ArmedMergeMustTriggerMainsPushLanesGuard.ToleratingAFailedMintRequiresARepoScopedAssertion`
      # fails the build if this `continue-on-error` outlives it.
      - name: Mint an installation token whose merges actually trigger workflows
        id: arm-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # PRESENT is not GRANTED. The mint fails with a bare "not permitted" when the App is
      # installed but lacks one of the two permissions, and that message names neither the App nor
      # the grant — so say it here, where a reader lands.
      #
      # 🚨 This is a WARNING, not an error, and the distinction is the point. The honest per-PR
      # outcome of a missing grant is "this PR was not armed" — degraded automation, not a fault in
      # the branch. Reporting it as a failure of the pull request is a false statement about the
      # pull request, and it was being made on every one of them simultaneously.
      - name: Say why nothing was armed, if the mint could not get the grant
        if: steps.arm-token.outcome == 'failure'
        run: |
          echo "::warning::auto-merge was NOT armed on this PR — the meshweaver-cloud App could not"
          echo "::warning::mint a token with Contents:write + PullRequests:write. Merge this PR by hand."
          {
            echo "### Auto-merge not armed"
            echo
            echo "The \`meshweaver-cloud\` App must carry **both** \`Contents: write\` and"
            echo "\`Pull requests: write\`. It currently cannot mint one with both, so this PR was"
            echo "left unarmed and needs a human merge once it is green."
            echo
            echo '```'
            echo "gh api orgs/${{ github.repository_owner }}/installations \\"
            echo "  --jq '.installations[] | \"\(.app_slug) \(.permissions|tojson)\"'"
            echo '```'
            echo
            echo "Grant *Pull requests: Read and write* in the App's settings, then **accept** the"
            echo "new permission on the org installation — a requested-but-unaccepted permission is"
            echo "not granted. \`arm-credential.yml\` is the lane that stays red until that is done."
          } >> "$GITHUB_STEP_SUMMARY"

      # Conditioned on the MINT's outcome, never on whether a secret "looks set" — the shape
      # AGENTS.md forbids. Without a token there is nothing to arm with; running gh anyway would
      # fall back to the runner's default credential, which is the #2916 outage exactly.
      - name: Arm it
        if: steps.arm-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Already armed is the common case on `synchronize` and is NOT a failure.
          if gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null' | grep -qx true; then
            echo "already armed — nothing to do"; exit 0
          fi
          # A merged/closed PR races us on `synchronize`; treat it as done, not as an error.
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then echo "PR is $state — nothing to arm"; exit 0; fi
          # Two repo shapes, one file. A merge QUEUE owns the merge strategy (core's is
          # SQUASH), so `--merge` is redundant there and some gh versions REJECT the
          # combination outright; on a repo with no queue, gh refuses to arm at all unless a
          # method is named. So name the method, then fall back to letting the queue decide.
          if out=$(gh pr merge "$PR" --repo "$REPO" --merge --auto 2>&1); then
            echo "arm requested (--merge): ${out:-ok}"
          elif out=$(gh pr merge "$PR" --repo "$REPO" --auto 2>&1); then
            echo "arm requested (strategy left to the merge queue): ${out:-ok}"
          else
            # 🚨 Failing to arm must be VISIBLE. It is not fatal to the PR — a human can still
            # merge it — but a silent failure here recreates exactly the state this exists to
            # fix: a green PR that never lands, with nothing saying why.
            echo "::warning::could not arm auto-merge on #$PR — $out"
            exit 0
          fi
          # Read it back. An exit code of 0 is the command's opinion; this is the evidence.
          if gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null' | grep -qx true; then
            echo "armed: #$PR will merge when the required contexts pass"
          elif [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" != "OPEN" ]; then
            # 🚨 Arming a PR with nothing left to wait for MERGES IT ON THE SPOT, so there is no
            # auto-merge request to read back. That is the lane working, not failing. Measured
            # on MeshWeaver.Crm#43: "arm requested (--merge): ok" followed by an immediate merge,
            # which the first draft of this read-back reported as 'is Allow auto-merge enabled?'
            # — a warning blaming a setting that was never off. The whole design leans on this
            # warning meaning something, so it must never cry wolf.
            echo "landed: #$PR had nothing left to wait for and merged immediately"
          else
            echo "::warning::auto-merge still not set on #$PR after a clean arm — is 'Allow auto-merge' enabled on $REPO?"
          fi
