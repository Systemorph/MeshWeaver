# Auto-merge lane — it DISARMS on a push (policy review-then-suites), and ARMS exactly one kind of
# pull request: a GENERATED-ONLY one by the generated-files App, which owes no review (the second job,
# `arm-generated`, at the bottom of this file). Every other arm is the control plane's decision.
#
# 🚨🚨 ARMING MOVED TO THE CONTROL PLANE. Arming auto-merge is a DECISION — "this head was reviewed
# and every finding answered, and the required checks are green" — and the decision belongs to the
# control instance's PR steward (MeshWeaver.Plugins `PrBabysitter` / `PrArming`, App `systemorph-com`),
# which already reads the review state and the answered-findings verdict for every pull request in the
# fleet. Before the move this lane armed every non-draft pull request on open, push and undraft —
# BEFORE the automatic review had landed on the new head. Where that review is comment-only and nothing required waits for it
# (MeshWeaver.Plugins), #2549, #2643/#2647 and Memex#641 merged with unanswered findings or no
# review at all, and agents disarmed by hand after every push (Plugins #2791, twice in an hour).
# The predicate the control plane applies is `check-review-answered.py --arm-gate` (the reference
# implementation, with its self-test); see Doc/Architecture/ReviewFindingsAnswered → "The arm gate".
#
# 🚨 WHAT IS LEFT HERE, AND WHY IT STAYS A WORKFLOW: a push invalidates the review, but GitHub keeps
# auto-merge armed across a push by anyone with write access. A pull request the control plane armed
# on a reviewed head would otherwise merge the NEXT, unreviewed head the moment the required
# contexts pass. The disarm must be immediate — a reaction to the `synchronize` event itself, not a
# control-plane cadence that a fast CI can outrun — so it stays on the event, here. The control
# plane re-arms once the new head is reviewed and answered (and arms with `expectedHeadOid`, so an
# arm racing a push is refused by GitHub rather than landing on the wrong head).
#
# 🚨 THIS FILE IS THE FLEET'S ONLY COPY OF THE LANE. It runs directly here on
# `pull_request_target`, and every OTHER repo in the fleet reaches it through `workflow_call` with
# a caller that forwards the App credential and nothing else. The callers did not change when the
# arming moved: they still forward `[opened, reopened, ready_for_review, synchronize]`, and the job
# below simply runs on `synchronize` only. (Deliberately no list of repo names here:
# `gh search code --owner Systemorph "auto-arm.yml@"` answers who calls it.)
#
# 🚨 The `workflow_call` secrets are named `MESHWEAVER_APP_ID` / `MESHWEAVER_APP_PRIVATE_KEY` — the
# SAME names as the repository secrets the direct `pull_request_target` trigger reads, so
# `secrets.MESHWEAVER_APP_ID` resolves correctly in BOTH modes. A caller passes them explicitly —
# never `secrets: inherit`, which would hand this lane every secret the calling repo owns.
#
# 🚨🚨 THE ARM CREDENTIAL IS LEAD, NOT TRIM — it decides whether main's push lanes run at all.
# This lane armed with `secrets.GITHUB_TOKEN` for six hours on 2026-09-01, and the consequence was
# measured on #2916: GitHub performs an auto-merge as the identity that ARMED it, so the merge
# landed as `github-actions[bot]` — and a push created with `GITHUB_TOKEN` deliberately does not
# trigger workflow runs. main's HEAD therefore got NO `push`-event run of anything:
#
#   8cc1cc6e  merged by rbuergi (human)   Build and Test ✅  Chart Gate ✅  Hosting Operator ✅
#   19628536  merged by github-actions[bot]                 (nothing)
#   b3e6ae65  merged by github-actions[bot]                 (nothing)
#   04d25efa  merged by github-actions[bot]                 (nothing)
#   dc6c5a45  merged by github-actions[bot]                 (nothing)
#
# No push run ⇒ no `Consolidate test results` on main's HEAD ⇒ `main-cd`'s readiness gate reads
# `absent/none` and waits, on every tick, forever ⇒ NOTHING IS EVER PROMOTED and every
# self-updating install stays on the previous image. Four commits' worth of delivery was lost
# before anyone noticed, because the reconciler cannot tell "CI has not run YET" from "CI will
# NEVER run" — both read `absent/none`. That is the AGENTS.md skip-trapdoor one level down: a
# SUPPRESSED TRIGGER renders exactly like a slow one.
#
# That is why every token this lane uses is a minted GitHub App installation token — and why the
# control plane arms with its App (`systemorph-com`), never a default token. Never put `secrets.GITHUB_TOKEN` back here — see
# `ArmedMergeMustTriggerMainsPushLanesGuard`, which fails the build if anyone does.
name: Disarm auto-merge on push

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  # The satellites' entry point. A caller keeps the SAME `pull_request_target` trigger and one job
  # that `uses:` this file — so `github.event` inside is the caller's pull-request event, and
  # `github.repository` / `github.event.repository.name` are the CALLING repository.
  workflow_call:
    secrets:
      MESHWEAVER_APP_ID:
        description: >-
          App id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet.
        required: true
      MESHWEAVER_APP_PRIVATE_KEY:
        description: >-
          That App's private key (PEM). Source of truth is Key Vault Systemorph/github-app-privatekey.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: Disarm auto-merge on an unreviewed push
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    # Job-level, not workflow-level: a CALLER run and the job it dispatches into this workflow are
    # two holders of a per-repository group, and a workflow-level group would deadlock the inner
    # job behind its own caller. Callers must NOT add a `concurrency:` block of their own.
    concurrency:
      group: auto-arm-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    # Only a PUSH invalidates a review, so only `synchronize` has anything to do; the other forwarded
    # actions skip. Forks are NOT skipped: a maintainer can arm a reviewed fork PR by hand, and
    # GitHub keeps that arm across the contributor's next push. This `pull_request_target` job runs
    # only the trusted base workflow and checks out no fork code, so disarming a fork PR is safe.
    if: github.event.action == 'synchronize'
    steps:
      - name: The App credential, or a red run naming what to provision
        env:
          MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$MESHWEAVER_APP_ID" ]          || missing+=("secrets.MESHWEAVER_APP_ID           app id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet")
          [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the disarm lane cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "App credential present."

      # 🚨 NO `continue-on-error`. Disarming is a SAFETY action: a disarm that silently does not
      # happen lets an unreviewed head merge on a reviewed head's arm. So a mint that cannot get
      # `Pull requests: write` is a RED run on the push that needed it, never a warning.
      # (`arm-credential.yml` still asserts the same credential on a schedule, against the repository.)
      - name: Mint an installation token that may take the arm off
        id: arm-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # 🚨 A PUSH INVALIDATES THE REVIEW. Read with REST; `--disable-auto` is the GraphQL mutation,
      # which has no REST form. Read back afterwards: an exit code is the command's opinion, the
      # pull request's `auto_merge` field is the evidence.
      - name: Disarm on a push the review has not seen yet
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          armed=$(gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null')
          if [ "$armed" != "true" ]; then
            echo "not armed — nothing to take off"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --disable-auto
          still=$(gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null')
          if [ "$still" = "true" ]; then
            echo "::error::auto-merge is still armed on #$PR after --disable-auto — an unreviewed head may merge; take it off by hand"
            exit 1
          fi
          echo "Disarmed #$PR: the new head has not been reviewed yet; the control plane re-arms it once it is reviewed and every finding is answered." >> "$GITHUB_STEP_SUMMARY"
          echo "disarmed #$PR"

  # 🚨 THE ONE ARM A WORKFLOW MAY TAKE: a GENERATED-ONLY pull request by the generated-files App
  # (`settle-locks`' manifest.lock settles, `stamp-floors`' floor stamps). Such a pull request owes NO
  # review — `check-review-answered.py`'s `generated_only` rule, the same one the stage gate and the
  # required `Automatic review answered` verdict already apply — so arming it decides nothing a review
  # would have decided, and the required checks still gate the merge. It used to be armed only by the
  # control plane's model-driven PR steward (`Hosting:PrBabysitter:Enabled`), which is switched off
  # fleet-wide; MeshWeaver.Plugins #3236 then sat green and unarmed for ~10.5 h and Plugins published
  # nothing for ~13.5 h until a person merged it. This job is the deterministic, non-model executor.
  #
  # Every other pull request stays the control plane's decision. The predicate decides on PROVENANCE
  # (author and every commit the App, every changed file a lock or a floor-only `index.json` line, the
  # file and commit listings read IN FULL, the head unmoved across the reads, open, not a draft, a
  # branch of this repository, onto the default branch) and answers `false` on any doubt; a failed
  # read is a RED run that armed nothing. The job-level `if:` is only a pre-filter so a person's pull
  # request never even starts it — the predicate is what decides.
  #
  # It runs AFTER the disarm (`needs: arm`): on a push the arm comes off first, then — only if the NEW
  # head is still generated-only — goes back on, pinned to that head (`--match-head-commit`), so an
  # arm can never carry over onto a head the predicate did not see.
  arm-generated:
    name: Arm a generated-only pull request (no review owed)
    needs: arm
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: auto-arm-generated-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.arm.result != 'failure' && github.event.pull_request.user.login == 'meshweaver-cloud[bot]' }}
    steps:
      - name: The App credential, or a red run naming what to provision
        env:
          MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$MESHWEAVER_APP_ID" ]          || missing+=("secrets.MESHWEAVER_APP_ID           app id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet")
          [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the generated-only arm cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "App credential present."

      # The App token, never GITHUB_TOKEN: GitHub performs an auto-merge as the identity that ARMED it,
      # and a merge made with GITHUB_TOKEN starts no push-event run on the default branch (#2916).
      - name: Mint an installation token that may arm
        id: arm-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The predicate is the platform's, read from the platform's default branch over anonymous git
      # (no REST budget) — never a copy, and never a file from the pull request's own tree.
      - name: Fetch the platform's review-answered predicate
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --no-checkout https://github.com/Systemorph/MeshWeaver.git "$RUNNER_TEMP/mw-core"
          git -C "$RUNNER_TEMP/mw-core" show HEAD:.github/scripts/check-review-answered.py > "$RUNNER_TEMP/check-review-answered.py"
          head -c 400 "$RUNNER_TEMP/check-review-answered.py" | grep -q "check-review-answered" \
            || { echo "::error::the fetched check-review-answered.py does not look like the predicate"; exit 1; }
          python3 "$RUNNER_TEMP/check-review-answered.py" --self-test > "$RUNNER_TEMP/self-test.log" \
            || { cat "$RUNNER_TEMP/self-test.log"; echo "::error::the predicate's self-test failed — nothing is armed on an unproven predicate"; exit 1; }
          echo "predicate: $(git -C "$RUNNER_TEMP/mw-core" rev-parse HEAD), self-test green"

      - name: Is this head generated-only?
        id: classify
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$REPO" --pr "$PR" --arm-generated

      # Read back afterwards: the pull request's `auto_merge` (or `merged`) field is the evidence, not
      # the command's exit code. `--match-head-commit` makes GitHub refuse an arm onto any other head.
      - name: Arm it, pinned to the head the predicate read
        if: steps.classify.outputs.arm == 'true'
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.classify.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the predicate said arm but named no head sha"; exit 1; }
          gh pr merge "$PR" --repo "$REPO" --auto --merge --match-head-commit "$HEAD_SHA"
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.auto_merge != null) \(.merged) \(.head.sha)"')
          read -r armed merged head <<< "$state"
          if [ "$merged" != "true" ] && { [ "$armed" != "true" ] || [ "$head" != "$HEAD_SHA" ]; }; then
            echo "::error::#$PR is not armed on $HEAD_SHA after the arm (auto_merge armed=$armed, head=$head)"
            exit 1
          fi
          echo "Armed #$PR on ${HEAD_SHA:0:10} (generated-only; the required checks gate the merge)." >> "$GITHUB_STEP_SUMMARY"
          echo "armed=$armed merged=$merged head=${head:0:10}"
