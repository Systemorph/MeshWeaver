name: Build follow — stream a standing build host's stage log

# ♻️ REUSABLE (workflow_call) — ONE job per stage that a repository's heavy leg has moved to a
# standing build host (MeshWeaver.Plugins `Hosting/StandingBuildHosts` §4.2; platform reference
# Doc/Architecture/BuildHosts). The job computes NOTHING: it follows the stage log the operations
# instance keeps for this run, prints it line by line (compiler errors and failed tests as
# annotations on the PR), and exits with the STAGE's FINAL verdict (once the run is terminal).
#
# 🚨 A REUSABLE CALL RENAMES THE CONTEXT. Called from job `modules-follow`, this job publishes
# `modules-follow / <stage>` — NOT the `modules` context a repository's protection may require. Keep
# the old context with a SHIM job carrying the old name that asserts the follow job's result
# (Doc/Architecture/RenamingARequiredCheck):
#
#   modules-follow:
#     uses: Systemorph/MeshWeaver/.github/workflows/build-follow.yml@main
#     permissions: { contents: read, id-token: write }
#     with:
#       api-url: ${{ vars.MW_BUILD_API }}        # https://<operations instance>/api/builds
#       stage: modules
#       sha: ${{ github.event.pull_request.head.sha || github.sha }}
#   modules:                                     # the REQUIRED context, still published by name
#     name: modules
#     needs: [modules-follow]
#     if: ${{ !cancelled() }}
#     runs-on: ubuntu-latest
#     timeout-minutes: 5
#     steps:
#       - run: '[ "${{ needs.modules-follow.result }}" = success ] || { echo "::error::build/modules did not succeed on the host"; exit 1; }'
#
# 🚨 The CALLER must grant `id-token: write` (a reusable workflow can only narrow its caller's
# grant; check-workflow-permission-pairing.py holds callers to it). The OIDC token IS the
# credential: the endpoint verifies it against GitHub's JWKS and answers only for the repository and
# sha its claims name. No secret is read here, so the lane runs identically on a fork's PR.
#
# 🛡️ NO SKIP-TRAPDOOR: no `continue-on-error:`, no input-shaped `if:`. A missing api-url is RED,
# named; a timeout is RED; an unreadable endpoint is RED; only the stage's own `succeeded` is green
# (build-follow.py, whose --self-test runs first and must pass).

on:
  workflow_call:
    inputs:
      api-url:
        description: The operations instance's build API base, e.g. https://control.example.com/api/builds.
        required: true
        type: string
      stage:
        description: The stage to follow, as the repository's .github/build-stages.json names it (e.g. modules; its check name build/modules — build-<channel>/modules off latest — is accepted). The aggregate check (build / build-<channel>) is not a stage and is refused.
        required: true
        type: string
      repo:
        description: The bare repository name the run is keyed by. Empty = this repository.
        required: false
        type: string
        default: ''
      sha:
        description: >-
          The commit the run is keyed by — the PR HEAD, never the merge commit. Callers pass
          github.event.pull_request.head.sha, falling back to github.sha; empty means exactly that
          (read from the caller's event). The endpoint binds the OIDC token to the run by its `run_id`, so the
          token's own `sha` claim (on pull_request: the merge commit) does not have to match.
        required: false
        type: string
        default: ''
      channel:
        description: The release channel whose host runs the stage (latest | stable).
        required: false
        type: string
        default: latest
      timeout-minutes:
        description: >-
          How long to wait for the RUN to be terminal. At most 43: the job is hard-cut at 45 minutes,
          and the follower must reach its own verdict first. A run may be longer (its budget is the
          host's, up to 720 min): at the window's end a stage whose verdict is in exits with it, with a
          warning that the stage's Check Run is the authority; a stage still pending is RED.
        required: false
        type: number
        default: 43
      audience:
        description: The OIDC audience (the instance's Hosting:Builds:OidcAudience). Empty = the api-url's origin.
        required: false
        type: string
        default: ''
      probe:
        description: A probe run's id (the claim's `probe`); empty for an ordinary run.
        required: false
        type: string
        default: ''
      scripts-ref:
        description: The Systemorph/MeshWeaver ref build-follow.py is fetched at (the lane's own vintage).
        required: false
        type: string
        default: main

jobs:
  follow:
    name: ${{ inputs.stage }}
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write      # the run's OIDC token is the bearer the build API verifies
    steps:
      # The platform files this job reads come over git, not REST (Doc/Architecture/CiRestBudget).
      - uses: Systemorph/MeshWeaver/.github/actions/core-file@main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch build-follow.py at the lane's scripts ref
        env:
          SCRIPTS_REF: ${{ inputs.scripts-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref is empty — build-follow.py has no ref to be fetched at"; exit 1; }
          "$RUNNER_TEMP/mw-core-file" "$SCRIPTS_REF" ".github/scripts/build-follow.py" > "$RUNNER_TEMP/build-follow.py"
          [ -s "$RUNNER_TEMP/build-follow.py" ] || { echo "::error::fetched an EMPTY build-follow.py at $SCRIPTS_REF"; exit 1; }
      - name: The follower can say no (self-test)
        run: python3 "$RUNNER_TEMP/build-follow.py" --self-test
      - name: Follow ${{ inputs.stage }} on build-${{ inputs.channel }}
        env:
          API_URL: ${{ inputs.api-url }}
          STAGE: ${{ inputs.stage }}
          REPO: ${{ inputs.repo }}
          # The PR HEAD (on pull_request github.sha is the merge commit); the caller's event.
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          CHANNEL: ${{ inputs.channel }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
          AUDIENCE: ${{ inputs.audience }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          [ -n "${API_URL:-}" ] || { echo "::error::api-url is empty — set the caller's build API variable (e.g. vars.MW_BUILD_API); there is no host to follow"; exit 1; }
          python3 "$RUNNER_TEMP/build-follow.py" --api-url "$API_URL" --stage "$STAGE" \
            --repo "$REPO" --sha "$SHA" --channel "$CHANNEL" --timeout-minutes "$TIMEOUT" --audience "$AUDIENCE" --probe "$PROBE"
