name: Build host — stage a host-executed run's modules for the publish lane

# ♻️ REUSABLE (workflow_call) — H9 of the standing build hosts (Doc/Architecture/BuildHosts;
# MeshWeaver.Plugins Hosting/StandingBuildHosts §2, §7a). When a run's module bundles were built on
# a standing build host, the bytes are in the shared CI artifact store and the instance holds their
# RECEIPTS. This lane reads them (`GET {api}/{repo}/{sha}/artifacts?channel=`, the run's GitHub OIDC
# token — the same gate as the stage log), fetches every object with core's ci-artifact-store.py,
# verifies each against its receipt's sha256 and size, and uploads them as
# `module-publication-<lane>-host` — the shape the module pack lane stages. The caller then runs the
# UNCHANGED node-repo-module-publish.yml, which collects `module-publication-<lane>-*`:
#
#   host-publication:
#     uses: Systemorph/MeshWeaver/.github/workflows/build-host-publication.yml@main
#     permissions: { contents: read, id-token: write }
#     with:
#       api-url: ${{ vars.MW_BUILD_API }}
#       lane: ${{ needs.select.outputs.lane }}
#       artifact-store: ${{ needs.select.outputs.artifact-store }}
#       artifact-store-id: ${{ needs.select.outputs.artifact-store-id }}
#   publish:
#     needs: [host-publication, …]
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-module-publish.yml@main
#
# 🚨 A SEPARATE LANE ON PURPOSE: it needs `id-token: write`, and a reusable workflow's permissions
# are a hard requirement on EVERY caller (check-workflow-permission-pairing.py). Adding it to the
# publish lane would break every existing caller at startup; a caller opts in here instead.
# 🛡️ No skip-trapdoor: a run with no receipts, a hash or size mismatch, or an unreadable endpoint
# is RED (build-artifacts-fetch.py, whose --self-test runs first).
# 🏗️ THE HOST GRAPH (H7, Doc/Architecture/BuildHosts §5). Called with the host-graph contract —
# `executor`, `selected` and `declared`, all read from ONE node-repo-module-pack.yml call — this lane
# is the publisher's source, and emits exactly the outputs the publisher reads from a pack call
# (`lane`, `selected`, `declared`):
#
#   modules:            # node-repo-module-pack.yml with publish-mode: staged and an `executor:`
#   host-publication:
#     needs: [modules, <every job the executor expression reads>]
#     if: <the pack call's `publish:` condition, verbatim — optionally behind EXACTLY the prefix
#          `!cancelled() && !failure() && `, as its publisher may (policy
#          publisher-tolerates-upstream-skips); a skipped pack call then leaves `lane` empty and
#          this lane red, never a silent pass>
#     uses: Systemorph/MeshWeaver/.github/workflows/build-host-publication.yml@main
#     permissions: { contents: read, id-token: write }
#     with:
#       executor: <the pack call's executor, verbatim>
#       api-url: ${{ vars.MW_BUILD_API }}
#       stage: modules
#       lane: ${{ needs.modules.outputs.lane }}
#       selected: ${{ needs.modules.outputs.selected }}
#       declared: ${{ needs.modules.outputs.declared }}
#       artifact-store: …
#       artifact-store-id: …
#   publish:
#     needs: [host-publication, …]
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-module-publish.yml@main
#     with:
#       lane: ${{ needs.host-publication.outputs.lane }}
#       selected: ${{ needs.host-publication.outputs.selected }}
#       modules: ${{ needs.host-publication.outputs.declared }}
#
# With `executor: actions` this lane is a NO-OP SUCCESS that hands the pack call's outputs through
# (the pack legs staged the bytes) — never a skip: a skipped ancestor skips the publisher
# (actions/runner#2205), and a run that should publish would publish nothing. With `executor: host`
# it fetches the receipts, runs the PUBLISHER'S OWN check over the records (`module-publication.py
# publish --check-only`: one record per selected module, stamped with this lane, naming the bytes by
# sha256 and the framework identity read back off them), and only then stages them and emits its
# outputs. The selection is the pack call's `select`, never read off the host's records: a
# selection derived from what the host staged would accept whatever the host staged.
# `module-publication.py check-callers` (run by node-repo-validate.yml) holds this wiring statically.
# Called with the original contract (no `selected`/`declared`), the lane behaves exactly as before.
# The `file:` store spec is the one this lane can read without a cloud login (the runners' shared
# share); an `azblob:` store needs an ambient `az` login the caller provides on the same runner.

on:
  workflow_call:
    inputs:
      executor:
        description: >-
          WHO BUILT THE BUNDLES (H7): `host` (the default, and this lane's original behaviour: fetch the
          host's receipts) or `actions` (the pack call's own legs built and staged them; this lane only
          hands the pack call's outputs through, and needs `declared`). Pass the pack call's
          `executor` verbatim. Any other value is RED.
          `host-forced` (policy build-server-routes-all-ci, SHADOW until parity) runs exactly as `actions`.
        required: false
        type: string
        default: host
      selected:
        description: >-
          The pack call's `selected` output (needs.<pack>.outputs.selected), handed through as this
          lane's `selected` once the fetched records passed the publisher's check against it.
        required: false
        type: string
        default: ''
      declared:
        description: >-
          The pack call's `declared` output (needs.<pack>.outputs.declared). Non-empty turns on the
          host-graph contract (see the header): the records are checked before anything is staged, and
          the outputs are emitted.
        required: false
        type: string
        default: ''
      api-url:
        description: The operations instance's build API base, e.g. https://control.example.com/api/builds.
        required: true
        type: string
      lane:
        description: The publication lane key (`module-publication-<lane>-*` is what the publish lane collects).
        required: true
        type: string
      artifact-store:
        description: The CI artifact store spec the host uploaded to (e.g. file:/ci-artifacts).
        required: true
        type: string
      artifact-store-id:
        description: >-
          The store identity the run resolved (resolve-artifact-store's `store-id`). REQUIRED: every
          get and the final upload are bound to it (--expect-store-id), so bytes never cross stores.
        required: true
        type: string
      sha:
        description: >-
          The commit the run is keyed by — the PR HEAD or the trunk commit. Empty means
          github.event.pull_request.head.sha, falling back to github.sha.
        required: false
        type: string
        default: ''
      channel:
        description: The release channel whose host ran the build. Only `latest` publishes.
        required: false
        type: string
        default: latest
      stage:
        description: Only this stage's receipts (empty = every stage's).
        required: false
        type: string
        default: ''
      audience:
        description: The OIDC audience. Empty = the api-url's origin.
        required: false
        type: string
        default: ''
      scripts-ref:
        description: The Systemorph/MeshWeaver ref the scripts are fetched at (the lane's own vintage).
        required: false
        type: string
        default: main
    outputs:
      lane:
        description: >-
          The pack call's lane key, emitted only after the staged set passed the publisher's check
          (with `executor: actions`, handed through). The publisher's `lane`.
        value: ${{ jobs.stage.outputs.lane }}
      selected:
        description: The pack call's selection, handed through after the check. The publisher's `selected`.
        value: ${{ jobs.stage.outputs.selected }}
      declared:
        description: The pack call's declared matrix, handed through after the check. The publisher's `modules`.
        value: ${{ jobs.stage.outputs.declared }}
      staged:
        description: >-
          `true` when this lane staged `module-publication-<lane>-host`; `false` with `executor:
          actions` (the pack legs staged) or a zero selection (nothing was owed).
        value: ${{ jobs.stage.outputs.staged }}

jobs:
  stage:
    name: Stage the host-executed run's modules
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # the run's OIDC token is the bearer the build API verifies
    outputs:
      lane: ${{ steps.out.outputs.lane }}
      selected: ${{ steps.out.outputs.selected }}
      declared: ${{ steps.out.outputs.declared }}
      staged: ${{ steps.mode.outputs.fetch }}
    steps:
      # 🛡️ One step decides, out loud, and an unreadable executor is RED, never a fall-through to
      # either arm: `actions` would stage nothing on a host run, `host` would fetch receipts no host
      # made. A zero selection under the host-graph contract is the one positive "nothing was owed".
      - name: Who built the bundles, and is anything owed
        id: mode
        env:
          EXECUTOR: ${{ inputs.executor }}
          SELECTED: ${{ inputs.selected }}
          DECLARED: ${{ inputs.declared }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          [ -n "${LANE:-}" ] || { echo "::error::lane is empty — every staged record carries the lane of the pack call that produced it, and artifacts are RUN-WIDE; without it a sibling call's bytes could answer this publication"; exit 1; }
          case "$EXECUTOR" in
            # `host-forced` (policy build-server-routes-all-ci, SHADOW until parity): the pack call's own
            # legs ran on Actions and staged the bytes, so it is the `actions` arm.
            actions|host-forced)
              [ -n "${DECLARED:-}" ] || { echo "::error::executor '$EXECUTOR' is the host-graph contract's no-op arm and needs the pack call's 'declared' output — the original contract only ever fetches from a host"; exit 1; }
              echo "fetch=false" >> "$GITHUB_OUTPUT"
              echo "executor: $EXECUTOR — the pack call's own legs built and staged the bytes; handing its outputs through, fetching nothing." ;;
            host)
              if [ -n "${DECLARED:-}" ] && [ -z "$(printf '%s' "${SELECTED:-}" | tr -d '[:space:]')" ]; then
                echo "fetch=false" >> "$GITHUB_OUTPUT"
                echo "executor: host — the pack call SELECTED zero modules, so the host owed none; nothing to fetch or stage (the publisher accounts for an empty selection by name)."
              else
                echo "fetch=true" >> "$GITHUB_OUTPUT"
                echo "executor: host — fetching the host run's receipts for lane $LANE."
              fi ;;
            *) echo "::error title=Build executor::executor '$EXECUTOR' is neither 'actions' nor 'host' — refusing to guess who built the bundles"; exit 1 ;;
          esac
      - uses: Systemorph/MeshWeaver/.github/actions/core-file@main
        if: steps.mode.outputs.fetch == 'true'
      - uses: actions/setup-python@v7
        if: steps.mode.outputs.fetch == 'true'
        with:
          python-version: "3.12"
      - name: Fetch the lane's scripts at its scripts ref
        if: steps.mode.outputs.fetch == 'true'
        env:
          SCRIPTS_REF: ${{ inputs.scripts-ref }}
          DECLARED: ${{ inputs.declared }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref is empty"; exit 1; }
          mkdir -p "$RUNNER_TEMP/s"
          files=(build-artifacts-fetch.py build-follow.py ci-artifact-store.py)
          # The host-graph contract runs the publisher's own check, so it needs the publisher's script.
          [ -z "${DECLARED:-}" ] || files+=(module-publication.py)
          for f in "${files[@]}"; do
            "$RUNNER_TEMP/mw-core-file" "$SCRIPTS_REF" ".github/scripts/$f" > "$RUNNER_TEMP/s/$f"
            [ -s "$RUNNER_TEMP/s/$f" ] || { echo "::error::fetched an EMPTY $f at $SCRIPTS_REF"; exit 1; }
          done
      - name: The fetch can say no (self-test)
        if: steps.mode.outputs.fetch == 'true'
        run: python3 "$RUNNER_TEMP/s/build-artifacts-fetch.py" --self-test
      - name: Fetch every receipt's object and verify it against the receipt
        if: steps.mode.outputs.fetch == 'true'
        env:
          API_URL: ${{ inputs.api-url }}
          STORE: ${{ inputs.artifact-store }}
          STORE_ID: ${{ inputs.artifact-store-id }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          CHANNEL: ${{ inputs.channel }}
          STAGE: ${{ inputs.stage }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          [ -n "${API_URL:-}" ] || { echo "::error::api-url is empty — there is no build API to read receipts from"; exit 1; }
          [ -n "${STORE_ID:-}" ] || { echo "::error::artifact-store-id is empty — pass the store-id the run resolved (resolve-artifact-store); an unbound fetch could read another store"; exit 1; }
          [ "$CHANNEL" = latest ] || { echo "::error::only a run on the latest channel publishes (channel '$CHANNEL')"; exit 1; }
          python3 "$RUNNER_TEMP/s/build-artifacts-fetch.py" --api-url "$API_URL" --store "$STORE" \
            --expect-store-id "$STORE_ID" --sha "$SHA" --channel "$CHANNEL" --stage "$STAGE" \
            --audience "$AUDIENCE" --out "$RUNNER_TEMP/staged"
      # 🚨 THE PUBLISHER'S OWN CHECK, before one byte is staged (host-graph contract only): exactly one
      # record per SELECTED module, stamped with THIS lane, naming its bytes by sha256, the framework
      # identity read back off those bytes. The same function the publish lane runs — so a host set
      # the publisher would refuse is red here, where it was fetched, and the outputs below are never
      # emitted over it.
      - name: The host's records answer the pack call's selection (the publisher's check, no POST)
        if: steps.mode.outputs.fetch == 'true' && inputs.declared != ''
        env:
          LANE: ${{ inputs.lane }}
          SELECTED: ${{ inputs.selected }}
          DECLARED: ${{ inputs.declared }}
        run: |
          set -euo pipefail
          head -c 400 "$RUNNER_TEMP/s/module-publication.py" | grep -q "module-publication" || { echo "::error::the fetched module-publication.py does not look like the publication gate"; exit 1; }
          # The self-test exercises the YAML caller checks; setup-python alone carries no PyYAML.
          # Same bootstrap as node-repo-module-publish.yml.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
          python3 "$RUNNER_TEMP/s/module-publication.py" --self-test
          # Receipts are keyed by repo/sha/stage, not lane: when two pack calls share a host stage this
          # fetch holds BOTH calls' records. Set the sibling's aside by name (never a record with no
          # lane — the check refuses that); completeness is still judged against THIS call's selection.
          python3 "$RUNNER_TEMP/s/module-publication.py" partition \
            --staged "$RUNNER_TEMP/staged" --lane "$LANE" --aside "$RUNNER_TEMP/other-lanes"
          printf '%s' "$DECLARED" > "$RUNNER_TEMP/declared.json"
          python3 "$RUNNER_TEMP/s/module-publication.py" publish --check-only \
            --staged "$RUNNER_TEMP/staged" --lane "$LANE" \
            --declared "@$RUNNER_TEMP/declared.json" --selected "$SELECTED"
      - name: Stage them for the publish lane
        if: steps.mode.outputs.fetch == 'true'
        uses: Systemorph/MeshWeaver/.github/actions/upload-artifact@main
        with:
          store: ${{ inputs.artifact-store }}
          expected-store-id: ${{ inputs.artifact-store-id }}
          name: module-publication-${{ inputs.lane }}-host
          path: ${{ runner.temp }}/staged
          retention-days: 1
          if-no-files-found: error
      # Emitted LAST, under the default rule: a failed check above leaves this job red and these
      # outputs unset, so the publisher (which needs this job) never runs on a set that failed.
      - name: Hand the pack call's lane and selection to the publisher
        id: out
        env:
          LANE: ${{ inputs.lane }}
          SELECTED: ${{ inputs.selected }}
          DECLARED: ${{ inputs.declared }}
        run: |
          set -euo pipefail
          delim="mw_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "lane=$LANE"
            echo "selected=$(printf '%s' "$SELECTED" | tr '\n' ' ')"
            echo "declared<<$delim"
            printf '%s\n' "$DECLARED"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "lane=$LANE; selected: ${SELECTED:-<none>}"
