name: Chart Drift

# Does the CLUSTER run what the chart describes?
#
# The scheduled caller for deploy/aks/scripts/check-chart-drift.sh. That script was written on
# 2026-08-13 to detect exactly the class of failure that took memex.meshweaver.cloud down the next
# day — and `git grep` across .github, deploy and tools found NO caller. It had never run once.
#
# 🛡️ THIS WORKFLOW MAY NOT SKIP. AGENTS.md → "A gate NEVER tests its own inputs": GitHub paints a
# skipped job with the same grey tick as a passed one, so a drift check that quietly declines when
# a credential is missing reports "no drift" on no evidence — strictly worse than not existing,
# because it also tells you the cluster is fine. Hence:
#
#   * `preflight` asserts EVERY external input and fails RED naming exactly what to provision.
#     It never asks "is the input present?" in order to decide whether to run.
#   * `drift` runs `needs: [preflight]` with NO input-shaped `if:` and NO `continue-on-error:`.
#   * check-chart-drift.sh itself treats an unreadable cluster as FAILURE, never as "no drift",
#     and refuses to report success unless it actually compared a minimum number of fields.
#
# ⚠️ EXPECT THIS WORKFLOW TO BE RED UNTIL TWO THINGS ARE PROVISIONED. That is the design, not a
# defect: the honest report of "drift detection is not wired up" is a failing check that names the
# missing pieces, not a green one that checked nothing.
#
#   1. [DONE 2026-08-17] AKS command access for the CI identity. This item was written from an
#      ASSUMPTION — that the AZURE_* OIDC identity had ACR rights only — and the assumption was
#      wrong. The app registration behind secrets.AZURE_CLIENT_ID ALREADY holds "Azure Kubernetes
#      Service Cluster Admin Role" scoped to the cluster, which includes
#      `Microsoft.ContainerService/managedClusters/runCommand/action`. No role assignment needed.
#      Re-check with:  az role assignment list --scope $(az aks show -g <rg> -n <cluster> \
#                        --query id -o tsv) -o table
#
#   2. [DONE 2026-08-17] A SECRET-FREE per-env values file, committed. check-chart-drift.sh refuses
#      to render with chart defaults — comparing against a chart nobody deployed produces confident
#      nonsense — so it needs each environment's real overlay, and those lived only on operators'
#      disks. Now committed to the PRIVATE Systemorph/Memex repo (2cd3eee) as
#      `deployments/aks/<ns>/values.<release>.public.yaml`, captured from the live releases with
#      `helm get values <release> -n <ns> -o yaml`.
#
#      🚨 REGENERATING THEM: build the file as an ALLOW-LIST — copy ONLY the `config`, `ingress`,
#      `persistence`, `image`, `replicas`, `resources` sections. This paragraph used to say
#      "everything under config:/persistence:/keda:/probes:/ingress:; nothing under secrets:", and
#      that DENY-LIST rule is UNSAFE: `pgbackrest.azure.accountKey` is a live Azure storage account
#      key and it sits OUTSIDE the `secrets:` block, so following the old instruction would have
#      committed a working credential to git permanently. Drop `parameters:` and `pgbackrest:`
#      wholesale — neither feeds the two objects this check compares. Scan the result for
#      secret-shaped AND high-entropy values before committing; the only legitimate `secret`-ish
#      match is `ingress.secretName`, a Kubernetes object name.
#
#      Regenerate after any deliberate helm change, or the gate compares against a stale intent.
#
#   3. [DONE] Read access to Systemorph/Memex, as a GitHub App installation token minted per run
#      (secrets.MESHWEAVER_APP_ID + MESHWEAVER_APP_PRIVATE_KEY, the org's `meshweaver-cloud` App).
#
#      🚨 This step used to read "a fine-grained read-only PAT ... a PAT cannot be minted through
#      the API or CLI, so this step is necessarily manual". The first half is true and the second
#      does not follow: an App INSTALLATION token is mintable, and the org already had an App
#      installed with access to this repo. The PAT route was tried and it rotted precisely as PATs
#      do — provisioned 2026-08-17, HTTP 401 "Bad credentials" on all nine runs after, so the check
#      never ran once (#1709). A stored PAT has no owner, no expiry anyone watches, and fails in a
#      way indistinguishable from a scope problem. The installation token is minted fresh each run
#      and scoped to `repositories: Memex` with `permission-contents: read`, which is narrower than
#      the PAT it replaces. Rotation has ONE home: Key Vault `Systemorph/github-app-privatekey`.
#
#      Still true, and still worth saying: do NOT substitute the broad `GH_PAT` (it widens what this
#      job can reach for no benefit), and do NOT move the overlays into this public repo to dodge
#      the credential — that would publish the deployment inventory.
#
# Drift found by a run that completes is reported red, with each divergence classified
# CLUSTER-ONLY / CHART-ONLY / DIFFERS.
#
# 🔒 WHICH ENVIRONMENTS EXIST IS NOT PUBLIC. This workflow used to carry the namespace list and the
# cluster/resource-group names inline — deployment identities, in a public repo, describing an
# estate the overlays were deliberately moved OUT of this repo to protect (item 3 above says as
# much: "do NOT move the overlays into this public repo — that would publish the deployment
# inventory"; the matrix published the inventory anyway). They now live beside the deployments they
# name, in `deployments/aks/envs.json` in $DEPLOY_REPO, and `discover` reads the matrix from there.
# Adding or retiring an environment is a one-line change THERE and needs no change here.
#
# ⚠️ EXPECT THE FIRST COMPLETING RUN TO BE VERY RED, legitimately. A local run of
# check-chart-drift.sh against ns memex on 2026-08-17 compared 149 fields and found 121
# divergences — the accumulated backlog of `kubectl patch`-applied config the chart has never heard
# of (AzureFoundry/ModelTier routing, probe initialDelaySeconds, replicas 2-vs-1), plus the one
# that bites hardest: ConfigMap Authentication__Microsoft__ClientId is still
# `CHANGE_ME_aad_application_client_id` in the chart, so a `helm upgrade` today would overwrite
# working auth with the placeholder. That backlog is the finding, not a defect in the gate.

on:
  schedule:
    # 06:15 UTC daily — before the working day, after the nightly self-update poll has settled.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # The cluster, the resource group and the environment list all come from
  # $DEPLOY_REPO's deployments/aks/envs.json — see the header. Only the repo name is
  # here, and a repository name is not a deployment identity.
  DEPLOY_REPO: Systemorph/Memex

jobs:
  preflight:
    name: Assert the inputs exist
    runs-on: ubuntu-latest
    steps:
      # No `if:` anywhere in this job. It asserts and fails; it does not decide whether to run.
      - name: Every external input, or a red build naming what to provision
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID        OIDC app registration for azure/login")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID        the Systemorph AAD tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID  the subscription holding the AKS cluster")
          [ -n "$MESHWEAVER_APP_ID" ]     || missing+=("secrets.MESHWEAVER_APP_ID          app id of the org GitHub App that reads $DEPLOY_REPO, where the per-env values.<env>.public.yaml overlays live")
          [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::chart-drift cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."

      # 🚨 PRESENT is not VALID, and this gate learned that the hard way (2026-08-17): the
      # secret above was provisioned, the check on this page went GREEN — and all three drift
      # jobs then died at `actions/checkout` with "Bad credentials". A non-empty string passed
      # an emptiness test while being worthless, so the job reported "all external inputs are
      # present" having proven nothing about the only input that had just changed. That is
      # precisely the "a gate NEVER tests its own inputs" failure this workflow's header warns
      # about, one level in: we checked that a value EXISTS instead of that it WORKS.
      #
      # So assert the capability the drift job actually needs — reading $DEPLOY_REPO — against
      # the real API, and name what each rejection means, because the three causes are
      # indistinguishable from the checkout error and take very different fixes. Read-only, one
      # request, no `if:`, no continue-on-error: it fails RED like everything else here.
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read

      - name: The token can actually READ the deploy repo
        env:
          DEPLOY_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          # 🚨 `|| code=000` is not defensive noise. `run:` steps are `bash -e`, so a curl that
          # fails at the TRANSPORT level (DNS, TLS, connection refused) makes this assignment
          # non-zero and kills the step right here — before the case block, i.e. before the one
          # thing this step exists to print. The job would still fail closed, but with a bare
          # curl error instead of the sentence naming what to provision, which is the whole
          # point of the probe (Copilot review, #1774). The timeouts are the other half: an
          # unbounded probe against a slow API hangs until the JOB timeout, turning a 10-second
          # answer into a 20-minute one.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DEPLOY_REPO") || code=000
          case "$code" in
            200)
              echo "The minted installation token reads $DEPLOY_REPO (HTTP 200)." ;;
            401)
              echo "::error::The minted installation token is rejected (HTTP 401, Bad credentials)."
              echo "  The mint step succeeded, so the App id and key are a matching pair — but the"
              echo "  token GitHub returned is not being accepted. This is the one outcome that"
              echo "  should be impossible here; treat it as a GitHub-side fault and re-run. If it"
              echo "  persists, confirm the App has not been deleted out from under the install."
              exit 1 ;;
            403)
              echo "::error::The minted installation token is refused (HTTP 403)."
              echo "  The App is installed but suspended, or its installation permissions were"
              echo "  narrowed below Contents: Read. Check the App's installation on the Systemorph"
              echo "  org and re-approve the permissions it requests."
              exit 1 ;;
            404)
              echo "::error::The token authenticates but cannot see $DEPLOY_REPO (HTTP 404)."
              echo "  GitHub returns 404 rather than 403 for a repository a token may not read, so this"
              echo "  is a SCOPE problem: the App's installation no longer includes $DEPLOY_REPO. Add"
              echo "  the repository to the installation — no other permission is needed."
              exit 1 ;;
            000)
              echo "::error::Could not reach api.github.com to probe $DEPLOY_REPO (no HTTP response)."
              echo "  Transport failure — DNS, TLS, a refused connection, or the 30 s cap. This says"
              echo "  NOTHING about the token: it may be perfectly good. Re-run once the network or"
              echo "  api.github.com is answering. Failing closed anyway, because a gate that cannot"
              echo "  reach its subject has not checked it."
              exit 1 ;;
            5*)
              echo "::error::api.github.com returned HTTP $code probing $DEPLOY_REPO."
              echo "  That is GitHub failing, not the token — check https://www.githubstatus.com and"
              echo "  re-run when the incident clears. Failing closed: indeterminate is not a pass."
              exit 1 ;;
            *)
              echo "::error::Unexpected HTTP $code probing $DEPLOY_REPO with the minted token."
              echo "  Treating as FAILURE: an indeterminate answer must never read as a working token."
              exit 1 ;;
          esac

  discover:
    name: Read the environment list
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.envs.outputs.matrix }}
      aks_cluster: ${{ steps.envs.outputs.aks_cluster }}
      aks_resource_group: ${{ steps.envs.outputs.aks_resource_group }}
    steps:
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read
      - name: Check out the deployment repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ steps.deploy-token.outputs.token }}
          path: deploy-repo
      # No `if:`, no `continue-on-error:` — same rule as preflight, and for a sharper reason. An
      # empty or unreadable manifest yields an empty matrix, and an empty matrix SKIPS every drift
      # job while the workflow reports success. That is the exact "checked nothing, looks green"
      # failure this file's header exists to prevent, so a manifest that does not parse into at
      # least one environment is a hard failure here.
      - name: Build the matrix from deployments/aks/envs.json
        id: envs
        run: |
          MANIFEST=deploy-repo/deployments/aks/envs.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::deployments/aks/envs.json is missing in $DEPLOY_REPO."
            echo "  It lists the environments this check covers and the cluster they run on:"
            echo '      {"cluster":{"resourceGroup":"...","name":"..."},'
            echo '       "environments":[{"ns":"...","release":"..."}]}'
            echo "  Without it this workflow does not know what exists, and a run that checked"
            echo "  nothing must never report no drift."
            exit 1
          fi
          python3 - "$MANIFEST" <<'EOF'
          import json, os, sys
          try:
              m = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"::error::envs.json is not valid JSON: {e}")
              sys.exit(1)
          envs = m.get("environments") or []
          cluster = m.get("cluster") or {}
          name, rg = cluster.get("name"), cluster.get("resourceGroup")
          bad = []
          if not envs:
              bad.append("environments[] is missing or empty")
          for i, e in enumerate(envs):
              if not isinstance(e, dict) or not e.get("ns") or not e.get("release"):
                  bad.append(f"environments[{i}] needs both 'ns' and 'release'")
          if not name:
              bad.append("cluster.name is missing")
          if not rg:
              bad.append("cluster.resourceGroup is missing")
          if bad:
              print("::error::envs.json is unusable:")
              for b in bad:
                  print(f"  \u2022 {b}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(envs) + "\n")
              out.write("aks_cluster=" + name + "\n")
              out.write("aks_resource_group=" + rg + "\n")
          print(f"{len(envs)} environment(s): " + ", ".join(e["ns"] for e in envs))
          EOF

  drift:
    name: ${{ matrix.env.ns }}
    needs: [preflight, discover]
    runs-on: ubuntu-latest
    env:
      AKS_CLUSTER: ${{ needs.discover.outputs.aks_cluster }}
      AKS_RESOURCE_GROUP: ${{ needs.discover.outputs.aks_resource_group }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read
      - name: Check out the per-env overlays
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ steps.deploy-token.outputs.token }}
          path: deploy-repo
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # PyYAML is third-party — the script's compare phase imports it. Installed explicitly rather
      # than relied on from the runner image; the script's preflight asserts it either way.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compare ${{ matrix.env.ns }} against the rendered chart
        run: |
          ENV_DIR="deploy-repo/deployments/aks/${{ matrix.env.ns }}"
          VALUES="$ENV_DIR/values.${{ matrix.env.release }}.public.yaml"
          if [ ! -f "$VALUES" ]; then
            echo "::error::$VALUES is missing. Commit the SECRET-FREE half of this environment's"
            echo "  helm overlay there, captured with:"
            echo "      helm get values ${{ matrix.env.release }} -n ${{ matrix.env.ns }} -o yaml"
            echo "  🚨 Copy it as an ALLOW-LIST — ONLY these top-level sections:"
            echo "      config, ingress, persistence, image, replicas, resources"
            echo "  Do NOT use the deny-list 'everything except secrets:'. pgbackrest.azure.accountKey"
            echo "  is a live Azure storage account key and it sits OUTSIDE the secrets: block, so a"
            echo "  deny-list commits a working credential to git permanently. Drop parameters: and"
            echo "  pgbackrest: wholesale — neither feeds the ConfigMap or Deployment compared here."
            echo "  Scan for secret-shaped AND high-entropy values before committing; the only"
            echo "  legitimate 'secret'-ish match is ingress.secretName, a Kubernetes object name."
            echo "  Rendering with chart defaults instead would compare the cluster against a chart"
            echo "  nobody deployed, so this is a failure, not a fallback."
            exit 1
          fi
          PATCH_ARG=""
          [ -f "$ENV_DIR/portal-patch.json" ] && PATCH_ARG="--expect-patch $ENV_DIR/portal-patch.json"
          deploy/aks/scripts/check-chart-drift.sh \
            -n "${{ matrix.env.ns }}" -r "${{ matrix.env.release }}" \
            --via aks-invoke -g "$AKS_RESOURCE_GROUP" --aks "$AKS_CLUSTER" \
            -f deploy/helm/values.yaml -f "$VALUES" $PATCH_ARG
