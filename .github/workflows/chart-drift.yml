name: Chart Drift

# Does the CLUSTER run what the chart describes?
#
# The scheduled caller for deploy/aks/scripts/check-chart-drift.sh. That script was written on
# 2026-08-13 to detect exactly the class of failure that took memex.meshweaver.cloud down the next
# day — and `git grep` across .github, deploy and tools found NO caller. It had never run once.
#
# 🛡️ THIS WORKFLOW MAY NOT SKIP. AGENTS.md → "A gate NEVER tests its own inputs": GitHub paints a
# skipped job with the same grey tick as a passed one, so a drift check that quietly declines when
# a credential is missing reports "no drift" on no evidence — strictly worse than not existing,
# because it also tells you the cluster is fine. Hence:
#
#   * `preflight` asserts EVERY external input and fails RED naming exactly what to provision.
#     It never asks "is the input present?" in order to decide whether to run.
#   * `drift` runs `needs: [preflight]` with NO input-shaped `if:` and NO `continue-on-error:`.
#   * check-chart-drift.sh itself treats an unreadable cluster as FAILURE, never as "no drift",
#     and refuses to report success unless it actually compared a minimum number of fields.
#
# ⚠️ EXPECT THIS WORKFLOW TO BE RED UNTIL TWO THINGS ARE PROVISIONED. That is the design, not a
# defect: the honest report of "drift detection is not wired up" is a failing check that names the
# missing pieces, not a green one that checked nothing.
#
#   1. [DONE 2026-08-17] AKS command access for the CI identity. This item was written from an
#      ASSUMPTION — that the AZURE_* OIDC identity had ACR rights only — and the assumption was
#      wrong. The app registration behind secrets.AZURE_CLIENT_ID ALREADY holds "Azure Kubernetes
#      Service Cluster Admin Role" scoped to the cluster, which includes
#      `Microsoft.ContainerService/managedClusters/runCommand/action`. No role assignment needed.
#      Re-check with:  az role assignment list --scope $(az aks show -g <rg> -n <cluster> \
#                        --query id -o tsv) -o table
#
#   2. [DONE 2026-08-17] A SECRET-FREE per-env values file, committed. check-chart-drift.sh refuses
#      to render with chart defaults — comparing against a chart nobody deployed produces confident
#      nonsense — so it needs each environment's real overlay, and those lived only on operators'
#      disks. Now committed to the PRIVATE Systemorph/Memex repo (2cd3eee) as
#      `deployments/aks/<ns>/values.<release>.public.yaml`, captured from the live releases with
#      `helm get values <release> -n <ns> -o yaml`.
#
#      🚨 REGENERATING THEM: build the file as an ALLOW-LIST — copy ONLY the `config`, `ingress`,
#      `persistence`, `image`, `replicas`, `resources` sections. This paragraph used to say
#      "everything under config:/persistence:/keda:/probes:/ingress:; nothing under secrets:", and
#      that DENY-LIST rule is UNSAFE: `pgbackrest.azure.accountKey` is a live Azure storage account
#      key and it sits OUTSIDE the `secrets:` block, so following the old instruction would have
#      committed a working credential to git permanently. Drop `parameters:` and `pgbackrest:`
#      wholesale — neither feeds the two objects this check compares. Scan the result for
#      secret-shaped AND high-entropy values before committing; the only legitimate `secret`-ish
#      match is `ingress.secretName`, a Kubernetes object name.
#
#      Regenerate after any deliberate helm change, or the gate compares against a stale intent.
#
#   3. [DONE] Read access to Systemorph/Memex, as a GitHub App installation token minted per run
#      (secrets.FLEET_READER_APP_ID + FLEET_READER_APP_PRIVATE_KEY, the org's READ-ONLY `fleet-reader`
#      App — moved off `meshweaver-cloud` because Memex is leaving that App's installation (decided
#      2026-09-11):
#      a mint naming a repository the installation does not reach FAILS, so this read must use an
#      App that is installed on Memex and can only read).
#
#      🚨 This step used to read "a fine-grained read-only PAT ... a PAT cannot be minted through
#      the API or CLI, so this step is necessarily manual". The first half is true and the second
#      does not follow: an App INSTALLATION token is mintable, and the org already had an App
#      installed with access to this repo. The PAT route was tried and it rotted precisely as PATs
#      do — provisioned 2026-08-17, HTTP 401 "Bad credentials" on all nine runs after, so the check
#      never ran once (#1709). A stored PAT has no owner, no expiry anyone watches, and fails in a
#      way indistinguishable from a scope problem. The installation token is minted fresh each run
#      and scoped to `repositories: Memex` with `permission-contents: read`, which is narrower than
#      the PAT it replaces. Rotation has ONE home: the fleet-reader App's key.
#
#      Still true, and still worth saying: do NOT substitute the broad `GH_PAT` (it widens what this
#      job can reach for no benefit), and do NOT move the overlays into this public repo to dodge
#      the credential — that would publish the deployment inventory.
#
# Drift found by a run that completes is reported red, with each divergence classified
# CLUSTER-ONLY / CHART-ONLY / DIFFERS.
#
# 🔒 WHICH ENVIRONMENTS EXIST IS NOT PUBLIC. This workflow used to carry the namespace list and the
# cluster/resource-group names inline — deployment identities, in a public repo, describing an
# estate the overlays were deliberately moved OUT of this repo to protect (item 3 above says as
# much: "do NOT move the overlays into this public repo — that would publish the deployment
# inventory"; the matrix published the inventory anyway). They now live beside the deployments they
# name, in `deployments/aks/envs.json` in $DEPLOY_REPO, and `discover` reads the matrix from there.
# Adding or retiring an environment is a one-line change THERE and needs no change here.
#
# 🚨 THE WORKFLOW WAS NOT AT FAULT AND IT STILL PRODUCED NOTHING FOR 34 DAYS (MeshWeaver#4640).
# 39 runs from 2026-08-15 to 2026-09-17, 39 failures, ZERO verdicts. #1709 fixed the first cause (a
# stored PAT that authenticated as nothing) and was closed; the NEXT cause took over silently, and
# with the ticket closed nothing pointed at it. Twelve more days of red went unread. That is the
# real lesson here and it is not about helm: A PERMANENTLY-RED CHECK CARRIES NO INFORMATION, and
# the artefact that made the state visible had been retired. The `report` job at the bottom of this
# file is the answer — one tracking issue, updated in place, closed when the fleet is in sync.
#
# The second cause was structural, not a bug. A record-driven deploy renders from THREE value
# sources; this check may hold TWO (the third is the Key Vault half — secrets), and from that
# subset the chart correctly REFUSES to render (#3780). The render therefore moved to
# deploy/aks/scripts/chart-drift-render.py, which supplies a render-only placeholder for exactly
# that input and PROVES on every run that no compared object depends on it. Read that file's
# header before changing anything about the render; its negative controls run on every pull request
# through chart-gate.yml, so it can no longer go quietly blind.
#
# ⚠️ EXPECT THIS TO BE RED, legitimately — and now for the right reason. First verdict ever
# produced, 2026-09-18, running this workflow's exact command line against both namespaces:
#
#     memex        19 divergence(s) across 209 compared fields: 15 SHADOWS, 1 CHART-ONLY, 3 DIFFERS
#     memex-cloud  29 divergence(s) across 233 compared fields: 29 SHADOWS
#
# (For scale: a local run against ns memex on 2026-08-17 compared 149 fields and found 121
# divergences. The backlog has largely been cleared since; what is left is triaged by class in
# MeshWeaver#2355 and in src/MeshWeaver.Documentation/Data/Architecture/ChartDriftSemantics.md.)
#
# 🚨 AND THE FIRST VERDICT IMMEDIATELY FOUND SOMETHING NOBODY KNEW: on BOTH production namespaces
# the NodeType bake readiness gate — the one instrument AGENTS.md names as what stops a bad roll —
# is not in force, for two DIFFERENT reasons, neither visible in any committed source.
#   * memex-cloud: ConfigMap `PreWarm__GateReadiness=true`, inline env `false`. An inline env
#     overrides envFrom, so the gate is OFF on the pod while every committed source says ON.
#   * memex: the gate is armed on both sides, and the live startupProbe was hand-moved to `/ready`
#     while the chart and the record say `/health`. `/ready` does not run the `nodetype_bake`
#     check, so the gate is armed and has no reader.
# Both are recorded in MeshWeaver#4640; do not let a later reader take this comment as the current
# state — it is the reading that made the case, not a standing claim.
#
# 🔒 WHAT A COMPLETED RUN PUBLISHES, since this repository is PUBLIC and its Actions logs are too.
# The comparator prints NO value of any kind: not an inline-env's, not a Secret's, and — since
# MeshWeaver#4685 — not a ConfigMap's either. It used to print both sides of a ConfigMap finding on
# the ground that a ConfigMap is non-secret by definition (measured on the first real run, the whole
# disclosure was one value, `'Job'`), but the ConfigMap is rendered from the record's `config:`,
# which is exactly the deployment inventory the paragraph above refuses to publish, and the surface
# was data-dependent (a `DIFFERS ConfigMap MEMEX_HOST` would have printed a production FQDN). A
# ConfigMap finding now names the key and each side's LENGTH, never the bytes; the `report` job
# below carries COUNTS ONLY for the same reason.
#
# 🚨 A WARNING THAT USED TO SIT HERE WAS WRONG, AND IT IS THE REASON THIS PARAGRAPH IS DATED. It
# read: "ConfigMap Authentication__Microsoft__ClientId is still `CHANGE_ME_aad_application_client_id`
# in the chart, so a `helm upgrade` today would overwrite working auth with the placeholder." Both
# halves are false and each was falsifiable from the day it was written:
#   * `Authentication__Microsoft__ClientId` is COMPARED and it AGREES. Verified 2026-09-04 on the
#     live ConfigMaps: both namespaces carry a 36-character GUID, not the 35-character placeholder,
#     and each overlay states its own real client id, which layers over the chart default — so
#     nothing renders the placeholder in the first place. The claim is "compared and equal", not
#     "not compared": the same run emitted four `DIFFERS ConfigMap` findings, so the comparison
#     could have failed on this key and did not.
#   * A `helm upgrade` does not overwrite a live value with a rendered one anyway — measured, see
#     check-chart-drift.sh's header. The whole "a deploy would destroy this" model was wrong.
#
# 🚨 AND THE CORRECTION ITSELF WENT STALE IN ONE DAY. This paragraph used to say "NO run has EVER
# reported an `Authentication__` finding (2026-08-26, 09-02, 09-03)". The 2026-09-04 run reports
# FIVE — `CLUSTER-ONLY ConfigMap Authentication__DevAdminUsers` and `Authentication__Google__ClientId`
# on both namespaces, plus `Authentication__LinkedIn__ClientId` on memex. Nothing drifted: the
# first-run-setup change made those keys conditional (`if`) where they had been emitted
# unconditionally with `| default ""`, so the render stopped carrying a key the live ConfigMap still
# holds at zero length. Measured cause, not a hypothesis: the live ConfigMaps have not been written
# since 2026-08-30 (memex) / 2026-08-29 (memex-cloud) — `managedFields`, and helm revisions 28/21.
# The finding is real and correctly classified; the value being empty is what makes it harmless.
# A "no run has ever" clause in a gate's header is a standing claim about future runs, so it dates
# the moment the chart changes — prefer the mechanism to the tally.
#
# Left in place as a correction rather than deleted: this file's own warning is what #2355 was
# triaged against for a week, and an un-measured hazard in a gate's header propagates as fact.

on:
  schedule:
    # 06:15 UTC daily — before the working day, after the nightly self-update poll has settled.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # The cluster, the resource group and the environment list all come from
  # $DEPLOY_REPO's deployments/aks/envs.json — see the header. Only the repo name is
  # here, and a repository name is not a deployment identity.
  DEPLOY_REPO: Systemorph/Memex

jobs:
  preflight:
    name: Assert the inputs exist
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No `if:` anywhere in this job. It asserts and fails; it does not decide whether to run.
      - name: Every external input, or a red build naming what to provision
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FLEET_READER_APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
          FLEET_READER_APP_PRIVATE_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID        OIDC app registration for azure/login")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID        the Systemorph AAD tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID  the subscription holding the AKS cluster")
          [ -n "$FLEET_READER_APP_ID" ]     || missing+=("secrets.FLEET_READER_APP_ID          app id of the org's READ-ONLY fleet-reader GitHub App (Contents, Metadata, Pull requests: read), which reads $DEPLOY_REPO, where the per-env values.<env>.public.yaml overlays live — set it in BOTH the Actions and the Dependabot secret stores (gh secret set NAME --repo Systemorph/MeshWeaver, then again with --app dependabot)")
          [ -n "$FLEET_READER_APP_PRIVATE_KEY" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY  that App's private key (PEM), in BOTH stores like the id. NOT meshweaver-cloud's key: that App holds write and is not installed on Memex")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::chart-drift cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."

      # 🚨 PRESENT is not VALID, and this gate learned that the hard way (2026-08-17): the
      # secret above was provisioned, the check on this page went GREEN — and all three drift
      # jobs then died at `actions/checkout` with "Bad credentials". A non-empty string passed
      # an emptiness test while being worthless, so the job reported "all external inputs are
      # present" having proven nothing about the only input that had just changed. That is
      # precisely the "a gate NEVER tests its own inputs" failure this workflow's header warns
      # about, one level in: we checked that a value EXISTS instead of that it WORKS.
      #
      # So assert the capability the drift job actually needs — reading $DEPLOY_REPO — against
      # the real API, and name what each rejection means, because the three causes are
      # indistinguishable from the checkout error and take very different fixes. Read-only, one
      # request, no `if:`, no continue-on-error: it fails RED like everything else here.
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read

      - name: The token can actually READ the deploy repo
        env:
          DEPLOY_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          # 🚨 `|| code=000` is not defensive noise. `run:` steps are `bash -e`, so a curl that
          # fails at the TRANSPORT level (DNS, TLS, connection refused) makes this assignment
          # non-zero and kills the step right here — before the case block, i.e. before the one
          # thing this step exists to print. The job would still fail closed, but with a bare
          # curl error instead of the sentence naming what to provision, which is the whole
          # point of the probe (Copilot review, #1774). The timeouts are the other half: an
          # unbounded probe against a slow API hangs until the JOB timeout, turning a 10-second
          # answer into a 20-minute one.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DEPLOY_REPO") || code=000
          case "$code" in
            200)
              echo "The minted installation token reads $DEPLOY_REPO (HTTP 200)." ;;
            401)
              echo "::error::The minted installation token is rejected (HTTP 401, Bad credentials)."
              echo "  The mint step succeeded, so the App id and key are a matching pair — but the"
              echo "  token GitHub returned is not being accepted. This is the one outcome that"
              echo "  should be impossible here; treat it as a GitHub-side fault and re-run. If it"
              echo "  persists, confirm the App has not been deleted out from under the install."
              exit 1 ;;
            403)
              echo "::error::The minted installation token is refused (HTTP 403)."
              echo "  The App is installed but suspended, or its installation permissions were"
              echo "  narrowed below Contents: Read. Check the App's installation on the Systemorph"
              echo "  org and re-approve the permissions it requests."
              exit 1 ;;
            404)
              echo "::error::The token authenticates but cannot see $DEPLOY_REPO (HTTP 404)."
              echo "  GitHub returns 404 rather than 403 for a repository a token may not read, so this"
              echo "  is a SCOPE problem: the App's installation no longer includes $DEPLOY_REPO. Add"
              echo "  the repository to the installation — no other permission is needed."
              exit 1 ;;
            000)
              echo "::error::Could not reach api.github.com to probe $DEPLOY_REPO (no HTTP response)."
              echo "  Transport failure — DNS, TLS, a refused connection, or the 30 s cap. This says"
              echo "  NOTHING about the token: it may be perfectly good. Re-run once the network or"
              echo "  api.github.com is answering. Failing closed anyway, because a gate that cannot"
              echo "  reach its subject has not checked it."
              exit 1 ;;
            5*)
              echo "::error::api.github.com returned HTTP $code probing $DEPLOY_REPO."
              echo "  That is GitHub failing, not the token — check https://www.githubstatus.com and"
              echo "  re-run when the incident clears. Failing closed: indeterminate is not a pass."
              exit 1 ;;
            *)
              echo "::error::Unexpected HTTP $code probing $DEPLOY_REPO with the minted token."
              echo "  Treating as FAILURE: an indeterminate answer must never read as a working token."
              exit 1 ;;
          esac

  discover:
    name: Read the environment list
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.envs.outputs.matrix }}
      aks_cluster: ${{ steps.envs.outputs.aks_cluster }}
      aks_resource_group: ${{ steps.envs.outputs.aks_resource_group }}
    steps:
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read
      - name: Check out the deployment repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ steps.deploy-token.outputs.token }}
          path: deploy-repo
      # No `if:`, no `continue-on-error:` — same rule as preflight, and for a sharper reason. An
      # empty or unreadable manifest yields an empty matrix, and an empty matrix SKIPS every drift
      # job while the workflow reports success. That is the exact "checked nothing, looks green"
      # failure this file's header exists to prevent, so a manifest that does not parse into at
      # least one environment is a hard failure here.
      - name: Build the matrix from deployments/aks/envs.json
        id: envs
        run: |
          MANIFEST=deploy-repo/deployments/aks/envs.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::deployments/aks/envs.json is missing in $DEPLOY_REPO."
            echo "  It lists the environments this check covers and the cluster they run on:"
            echo '      {"cluster":{"resourceGroup":"...","name":"..."},'
            echo '       "environments":[{"ns":"...","release":"..."}]}'
            echo "  Without it this workflow does not know what exists, and a run that checked"
            echo "  nothing must never report no drift."
            exit 1
          fi
          python3 - "$MANIFEST" <<'EOF'
          import json, os, sys
          try:
              m = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"::error::envs.json is not valid JSON: {e}")
              sys.exit(1)
          envs = m.get("environments") or []
          cluster = m.get("cluster") or {}
          name, rg = cluster.get("name"), cluster.get("resourceGroup")
          bad = []
          if not envs:
              bad.append("environments[] is missing or empty")
          for i, e in enumerate(envs):
              if not isinstance(e, dict) or not e.get("ns") or not e.get("release"):
                  bad.append(f"environments[{i}] needs both 'ns' and 'release'")
          if not name:
              bad.append("cluster.name is missing")
          if not rg:
              bad.append("cluster.resourceGroup is missing")
          if bad:
              print("::error::envs.json is unusable:")
              for b in bad:
                  print(f"  \u2022 {b}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(envs) + "\n")
              out.write("aks_cluster=" + name + "\n")
              out.write("aks_resource_group=" + rg + "\n")
          print(f"{len(envs)} environment(s): " + ", ".join(e["ns"] for e in envs))
          EOF

  drift:
    name: ${{ matrix.env.ns }}
    needs: [preflight, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AKS_CLUSTER: ${{ needs.discover.outputs.aks_cluster }}
      AKS_RESOURCE_GROUP: ${{ needs.discover.outputs.aks_resource_group }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT.
      # A PAT was the original design and it rotted exactly as PATs do: provisioned 2026-08-17,
      # HTTP 401 on every run after (#1709). An installation token cannot rot — it is minted fresh
      # here, expires in an hour, and is scoped to the one repository named below.
      - name: Mint an installation token for the deploy repo
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: Memex
          permission-contents: read
      - name: Check out the per-env overlays
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ steps.deploy-token.outputs.token }}
          path: deploy-repo
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # PyYAML is third-party — the script's compare phase imports it. Installed explicitly rather
      # than relied on from the runner image; the script's preflight asserts it either way.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compare ${{ matrix.env.ns }} against the rendered chart
        run: |
          ENV_DIR="deploy-repo/deployments/aks/${{ matrix.env.ns }}"
          VALUES="$ENV_DIR/values.${{ matrix.env.release }}.public.yaml"
          if [ ! -f "$VALUES" ]; then
            echo "::error::$VALUES is missing. Commit the SECRET-FREE half of this environment's"
            echo "  helm overlay there, captured with:"
            echo "      helm get values ${{ matrix.env.release }} -n ${{ matrix.env.ns }} -o yaml"
            echo "  🚨 Copy it as an ALLOW-LIST — ONLY these top-level sections:"
            echo "      config, ingress, persistence, image, replicas, resources"
            echo "  Do NOT use the deny-list 'everything except secrets:'. pgbackrest.azure.accountKey"
            echo "  is a live Azure storage account key and it sits OUTSIDE the secrets: block, so a"
            echo "  deny-list commits a working credential to git permanently. Drop parameters: and"
            echo "  pgbackrest: wholesale — neither feeds the ConfigMap or Deployment compared here."
            echo "  Scan for secret-shaped AND high-entropy values before committing; the only"
            echo "  legitimate 'secret'-ish match is ingress.secretName, a Kubernetes object name."
            echo "  Rendering with chart defaults instead would compare the cluster against a chart"
            echo "  nobody deployed, so this is a failure, not a fallback."
            exit 1
          fi
          # 🚨 SAY WHICH MODE THIS RUN TOOK. An env's deploy.sh applies portal-patch.json AFTER
          # `helm upgrade`, and --expect-patch is what makes those envFrom additions count as
          # DECLARED rather than as drift. When the file is absent, reporting them is the
          # deliberate fail-loud choice check-chart-drift.sh's header defends ("reporting an
          # expected difference is a nuisance; hiding an unexpected one is the bug this script
          # exists to prevent") — this block does not change that. What it fixes is that the
          # branch used to be SILENT, so a reader of "31 divergence(s)" could not tell whether
          # expected post-helm patches were among the 31, and two environments' counts could not
          # be known to be comparable. Note the contrast with the missing-values case above,
          # which already fails loudly and names what to do.
          PATCH_ARG=""
          if [ -f "$ENV_DIR/portal-patch.json" ]; then
            PATCH_ARG="--expect-patch $ENV_DIR/portal-patch.json"
            echo "Post-helm patch DECLARED: $ENV_DIR/portal-patch.json — its envFrom additions"
            echo "  count as declared, not as drift."
          else
            echo "::notice::No $ENV_DIR/portal-patch.json — this environment declares no post-helm"
            echo "  patch, so any addition an env's deploy.sh applies AFTER helm upgrade is reported"
            echo "  as drift below. That is deliberate (fail loud), not a fallback — but it means a"
            echo "  divergence count from this environment is NOT comparable with one from an"
            echo "  environment that does declare a patch. Commit the patch file if this env has one."
          fi
          # `tee` keeps the log exactly as it was while giving the reporter below something to read.
          #
          # 🚨 TWO traps in three lines, and they pull in opposite directions.
          #   * PIPESTATUS, not `$?`: piping into tee makes the exit status tee's, so a drifted
          #     namespace would report SUCCESS — the exact false-pass AGENTS.md lists by name.
          #   * `set -e` (the default for a `run:` step) combined with `set -o pipefail` would be
          #     WORSE than no fix: the step would die ON the pipe, before the verdict is extracted,
          #     so the run that FOUND drift would be the one that published no verdict. errexit is
          #     therefore lifted across the pipeline only, and the status is carried by hand.
          set +e
          deploy/aks/scripts/check-chart-drift.sh \
            -n "${{ matrix.env.ns }}" -r "${{ matrix.env.release }}" \
            --via aks-invoke -g "$AKS_RESOURCE_GROUP" --aks "$AKS_CLUSTER" \
            -f deploy/helm/values.yaml -f "$VALUES" $PATCH_ARG 2>&1 | tee "$RUNNER_TEMP/drift.log"
          rc=${PIPESTATUS[0]}
          set -e
          # 🔒 COUNTS ONLY. This file is in a PUBLIC repository and the tracking issue this feeds is
          # public too, so the artifact carries the comparator's one-line tally and NOTHING else —
          # no key names, no values. The detail stays in the run log, where it already is.
          {
            grep -m1 -E '^[0-9]+ divergence\(s\) across [0-9]+ compared fields' "$RUNNER_TEMP/drift.log" \
              || grep -m1 -E '^No drift: [0-9]+ fields compared' "$RUNNER_TEMP/drift.log" \
              || echo "no verdict — the check did not get far enough to compare anything"
          } > "$RUNNER_TEMP/verdict.txt"
          exit "$rc"

      # `!cancelled()`: the verdict is wanted precisely when the step above went red, which is every
      # run that finds drift. It is not an input-shaped `if:` — it makes this step run MORE often,
      # never less, and it cannot render a tick without executing.
      - name: Keep the one-line verdict for the tracking issue
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: chart-drift-verdict-${{ matrix.env.ns }}
          path: ${{ runner.temp }}/verdict.txt
          if-no-files-found: ignore

  # 📌 WHY A TRACKING ISSUE and not just a red run — the lesson of MeshWeaver#4640, and the same
  # answer Systemorph/Memex#95 already reached for `deploy-drift.yml`, whose header points at THIS
  # workflow for the cluster-vs-chart half. A scheduled workflow's failure is visible only to
  # whoever opens the Actions tab. "There is drift" and "drift detection is not running" are both
  # STANDING STATES, not events, and a standing state needs an artefact that survives somebody
  # closing a ticket: this one ran red 39 times in 34 days with nobody reading it, and the artefact
  # that would have said so had been retired with #1709.
  #
  # 🚨 THIS IS A REPORTER, NOT A GATE, and the distinction is load-bearing. The verdict is the
  # `drift` job; this job publishes it. So it carries an `if:` (it must run when `drift` FAILED) and
  # it must never be able to turn a red run green — it cannot, because the drift jobs have already
  # failed by the time it starts and nothing here touches their conclusion. `!cancelled()` rather
  # than `always()`: a cancelled run measured nothing, and writing a report for it would publish a
  # state nobody established.
  report:
    name: Publish the standing state
    needs: [preflight, discover, drift]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: chart-drift-verdict-*
          path: verdicts
        # ⚠️ The ONE `continue-on-error:` in this file, and the test is the usual one: what does a
        # failure here hide? Nothing. The artifacts are absent exactly when `drift` never produced
        # them — and THAT case is detected below from the job RESULTS, not from the files. The gate
        # never reads its own input from an optional artifact; this is not the gate.
        continue-on-error: true
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESULT_PRE: ${{ needs.preflight.result }}
          RESULT_DISCOVER: ${{ needs.discover.result }}
          RESULT_DRIFT: ${{ needs.drift.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- chart-drift-sentinel -->"
        run: |
          set -euo pipefail

          # Counts only — see the 🔒 note in the drift job. Each file is one line; the directory
          # name carries the namespace, which is already public in this job matrix's own job names.
          DETAIL=""
          for f in verdicts/chart-drift-verdict-*/verdict.txt; do
            [ -f "$f" ] || continue
            ns="$(basename "$(dirname "$f")")"; ns="${ns#chart-drift-verdict-}"
            DETAIL="${DETAIL}${ns}: $(head -1 "$f")"$'\n'
          done
          [ -n "$DETAIL" ] || DETAIL="(no verdict produced by any environment)"$'\n'

          if [ "$RESULT_PRE" = "success" ] && [ "$RESULT_DISCOVER" = "success" ] \
             && [ "$RESULT_DRIFT" = "success" ]; then
            STATE=green
            TITLE="Chart drift: every environment matches the rendered chart"
          elif [ "$RESULT_PRE" = "success" ] && [ "$RESULT_DISCOVER" = "success" ] \
               && [ "$RESULT_DRIFT" = "failure" ]; then
            STATE=drift
            TITLE="Chart drift: the cluster does not match the chart"
          else
            # 🚨 "The detector did not run" must be as loud as "there is drift" — an unrun detector
            # reporting nothing is the original bug, and it is the state this workflow was actually
            # in for 34 days. A skipped dependency does not fail an `if: !cancelled()` job by
            # itself, so it is detected here from the RESULTS rather than assumed away.
            STATE=unknown
            TITLE="Chart drift: the detector could not run — drift state is UNKNOWN"
            DETAIL="job results: preflight=${RESULT_PRE} discover=${RESULT_DISCOVER} drift=${RESULT_DRIFT}"$'\n'"${DETAIL}"
          fi

          # shellcheck disable=SC2016  # the backticks are literal markdown for the issue body, not
          # a command substitution; single quotes are what keeps them literal. Suppressed narrowly.
          BODY=$(printf '%s\n\n**State: %s** — last checked %s ([run](%s)).\n\n```\n%s```\n\nCounts only, deliberately: this repository is public, so the per-key detail stays in the run log rather than in an issue body (MeshWeaver#4640).\n\n---\nMaintained automatically by `.github/workflows/chart-drift.yml`. Updated in place on every run and closed automatically when every environment matches; it reopens on the next divergence. Do not edit the body — edit the workflow.\n' \
            "$MARKER" "$STATE" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUN_URL" "$DETAIL")

          # ONE issue, ever — found by the marker in its body, across BOTH states so a returning
          # divergence reopens the original rather than minting a new one each night. Deliberately
          # not `--search`: GitHub's issue search index lags a freshly-created issue by seconds to
          # minutes, so a search-based lookup would miss its own issue on the next run and open a
          # duplicate every day. A plain listing is exact and immediate.
          FOUND=$(gh issue list --repo "$REPO" --state all --limit 200 \
                    --json number,state,body \
                    --jq "map(select(.body != null and (.body | contains(\"$MARKER\")))) | .[0] // empty")
          NUM=$(printf '%s' "$FOUND" | jq -r '.number // empty')
          ISSUE_STATE=$(printf '%s' "$FOUND" | jq -r '.state // empty')

          if [ "$STATE" = "green" ]; then
            if [ -n "$NUM" ] && [ "$ISSUE_STATE" = "OPEN" ]; then
              gh issue edit "$NUM" --repo "$REPO" --title "$TITLE" --body "$BODY"
              gh issue close "$NUM" --repo "$REPO" \
                --comment "Every environment matches the rendered chart as of $RUN_URL — closing. It reopens automatically on the next divergence."
              echo "closed #$NUM"
            else
              echo "In sync, and no tracking issue open. Nothing to do."
            fi
            exit 0
          fi

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$REPO" --title "$TITLE" --body "$BODY"
            [ "$ISSUE_STATE" = "OPEN" ] || gh issue reopen "$NUM" --repo "$REPO"
            echo "updated #$NUM (was $ISSUE_STATE)"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
