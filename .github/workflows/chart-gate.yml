name: Chart Gate

# Does the deployment chart describe a shape that can actually work?
#
# 🚨 WHY THIS WORKFLOW EXISTS. On 2026-08-14 memex.meshweaver.cloud served every request from ONE
# pod, so any pod loss was a multi-minute 503 — and the chart in git had described that
# impossibility for a month, unchallenged by any build:
#
#   deploy/aks/values.aks.yaml      keda.enabled: true, keda.minReplicas: 2, replicas.portal: 2
#   templates/…/scaledobject.yaml   minReplicaCount: 2        ← asks for two pods
#   templates/…/pdb.yaml            maxUnavailable: 1         ← budgets for two pods
#   templates/…/deployment.yaml     replicas: 1  HARD-CODED   ← renders one pod
#
# `replicas.portal: 2` was consumed by NOTHING. helm renders that set without complaint, because
# helm validates syntax, not sense. Nothing else in CI opens the chart at all.
#
# 🚨 …AND THE SAME DEFECT IN THE CONFIGMAP, four times over. "A values key consumed by nothing" is
# not a one-off: SelfUpdate__PollInterval (#1778), SelfUpdate__MinRollInterval (#1780/#1925) and
# Modules__Root (#1925) were each set in values files and templated nowhere, inert for weeks while
# reading as configured. #2210 is its expensive form — the GitHub App identity was committed to the
# per-env overlay one section off, under `config.memex_migration`, which the portal ConfigMap never
# reads; every deploy therefore rendered those portal keys "" and helm's three-way merge applied
# the blanking as a DELETION of the live values. GitSync and plugin-registry pulls were down
# fleet-wide on 2026-08-25. `check-values-are-read.sh` is that invariant, asserted from the files
# alone; it takes values paths, so the private deployment repo runs the identical check on its
# overlays before a deploy, where the mis-nesting actually happened.
#
# 🛡️ NO SKIP-TRAPDOOR (AGENTS.md → "A gate NEVER tests its own inputs"). Every input this job reads
# is in this repository — the chart and the tracked values files. There is no secret, no cluster,
# no network, and therefore NO condition under which the job may decline to run and still render a
# tick. It carries no `continue-on-error:` and no input-shaped `if:`, it is not filtered by path
# (a path filter turns "unrelated PR" into a skipped run, which is the same grey tick again), and
# the script asserts a minimum number of rendered combinations before it may report success.
#
# 🔭 WHAT THIS CANNOT SEE, and what covers it instead. This gate compares the chart against ITSELF.
# It cannot tell you whether the CLUSTER runs what the chart describes — the live memex-cloud
# PodDisruptionBudget was a hand-applied `minAvailable: 2` the chart never produced, and its
# ScaledObject carried `autoscaling.keda.sh/paused-replicas: "1"`, an annotation no chart has heard
# of. That is deploy/aks/scripts/check-chart-drift.sh, which needs cluster credentials and the
# private per-env values and so cannot be a pull-request gate; see chart-drift.yml for how it is
# scheduled, and DeploymentAKS.md for running it by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One live run per ref: a newer push to the same PR branch cancels the run it supersedes; main and
# the merge queue never cancel (each main push is its own group, keyed on the commit).
concurrency:
  group: chart-gate-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  invariants:
    name: Chart invariants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # PyYAML is third-party. It ships on today's hosted runners, so nothing would fail today —
      # which is precisely the reason to install it explicitly: a gate whose dependency is satisfied
      # by luck of the runner image starts failing on an image bump, for a reason unrelated to the
      # chart it is guarding. The script's preflight also asserts it, so a missing module names
      # itself instead of surfacing as a traceback.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Render every values combination and assert it is self-consistent
        run: deploy/aks/scripts/check-chart-invariants.sh

      # The other direction: the step above asks whether the RENDER is coherent, this one asks
      # whether every key the VALUES set survives into it at all. A key the chart does not
      # template reaches no container and helm reports success — #1778, #1780, #1925 each shipped
      # that way, and #2210 was its expensive form: the GitHub App identity committed one section
      # off, rendering the portal keys "" so a deploy DELETED the live values fleet-wide.
      #
      # `!cancelled()` rather than nothing: a failure in the step above must not hide this one's
      # findings, so a red pull request names everything wrong with the chart in a single run
      # instead of one thing per push. It is not an input-shaped `if:` — it makes this step run
      # MORE often, never less, and it cannot render a tick without executing.
      - name: Assert every config key a values file sets is read by a template
        if: ${{ !cancelled() }}
        run: deploy/aks/scripts/check-values-are-read.sh

      # The drift COMPARATOR's own logic. check-chart-drift.sh decides which divergences are
      # live-wrong (COLLIDES, SHADOWS — an inline env: entry that silently kills a ConfigMap value)
      # and which are hygiene, but it only ever runs against the PRIVATE production cluster on a
      # nightly schedule. So a regression in that classification could previously be found only by
      # a human noticing the nightly report had gone quiet — the same blind spot the drift checker
      # exists to close, one level up. This runs the comparator against committed fixtures: no
      # cluster, no credentials, and a clean case that fails if it ever stops classifying at all.
      - name: Assert the chart-drift comparator classifies each divergence correctly
        if: ${{ !cancelled() }}
        run: deploy/aks/scripts/test-chart-drift-compare.sh

      - name: Assert observability installation refuses ephemeral or unverified storage
        if: ${{ !cancelled() }}
        run: python3 deploy/aks/scripts/test-observability-storage.py

      # The observability-values CHECKER's own logic, with helm and docker stubbed — so it runs
      # here, offline, rather than in the job that reaches the network. Same reason as the
      # chart-drift comparator above: a gate that has quietly lost the ability to fail reports a
      # tick nobody re-examines, and this one has already done it once. The first version of that
      # checker passed a deliberately mis-nested `ingestor:` key, because loki-stack merges
      # `loki.config` through verbatim and the unknown key reached the render intact — it could not
      # fail for the very component #3773 was about. These cases are that regression, pinned.
      - name: Assert the observability values checker still classifies each defect
        if: ${{ !cancelled() }}
        run: python3 deploy/aks/scripts/test-observability-values.py

  # The three pieces of shell behind Doc/Architecture/PluginBundlesInTheRegistry — the publisher
  # (.github/scripts/push-bundle-publication.sh), the `bundle-fetch` init container's script and
  # docker_auth's ext_auth hook (deploy/helm/files/) — EXECUTED against the real distribution and
  # docker_auth images with the ConfigMap THIS chart renders, and a stub of memex's key→token
  # exchange. Without this the first execution of an edit to any of them is a production publish,
  # a portal booting on a half-fetched shelf, or a registry that lets a plan-scoped licence pull a
  # whole publication. It lives here rather than in the workflow-shell job because it needs the
  # rendered chart (helm) beside docker; both are asserted by the harness's preflight, which fails
  # RED naming what is missing. ORAS is installed from a pinned release (version + sha256).
  #
  # 🛡️ NO SKIP-TRAPDOOR: every input is in this repository or pinned by digest/checksum; no
  # secret, no cluster; no `continue-on-error:`, no input-shaped `if:`, no path filter.
  # The observability stack's values, checked the only two ways that can actually fail.
  #
  # 🚨 WHY IT IS A SEPARATE JOB. `Chart invariants` above states, as a property worth keeping true,
  # that every input it reads is in this repository — no secret, no cluster, NO NETWORK. This check
  # fetches a third-party chart (grafana/loki-stack) and a container image, so folding it in there
  # would quietly falsify that header. It gets its own job and states its own dependencies instead.
  #
  # 🚨 WHAT IT GUARDS. On 2026-09-09 a drain of loki-0 took every namespace's log history with it
  # (#3773): `persistence.enabled` preserves flushed chunks, and nothing was enabling the ingester
  # WAL that covers the rest. The WAL keys are set now — but this same values file already
  # documents, in prose, a key that is set-able and INERT (`promtail.config.wal` renders to
  # nothing, because the deprecated loki-stack chart does not template it). A prose warning about
  # silently-dropped keys is exactly the thing that should be executable, so that the next one
  # fails RED in the pull request that adds it instead of reading as coverage for weeks.
  #
  # Two checks, because the components fail in OPPOSITE directions and neither is sufficient alone:
  #   • promtail — its chart builds config from named fields and drops the rest, so the RENDER
  #     check catches it.
  #   • loki — its chart merges `config` through VERBATIM, so the render check is vacuous there: a
  #     typo'd `ingestor:` arrives in the render intact and passes. Only `loki -verify-config`
  #     knows it is not a field. Measured 2026-09-09, both directions, on this exact typo.
  #
  # 🛡️ NO SKIP-TRAPDOOR: helm missing, PyYAML missing, docker missing or not running, the chart
  # unfetchable, the render empty, or too few leaves examined are each RED and name themselves.
  # No `continue-on-error:`, no input-shaped `if:`, no path filter.
  observability-values:
    name: Observability values (rendered + binary-validated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Assert every observability config key survives the render, and Loki accepts it
        run: deploy/aks/scripts/check-observability-values.sh

  bundle-registry:
    name: Bundle registry scripts (executed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Execute the publisher, the init container's fetch and the edge authorization
        run: python3 .github/scripts/test-bundle-registry.py
