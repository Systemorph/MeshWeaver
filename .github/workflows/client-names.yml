name: No client names

# The build side of the confidentiality check, callable from every repository in the fleet.
#
# WHO is a client is decided by the CRM, and the CRM is never read from a build (maintainer,
# 2026-09-28: "build system should not have access to crm"). This job holds NO terms: it sends the
# added lines (with file:line) to the instance that owns the CRM, as the build's own service user,
# and reads back pass/fail with masked positions (`client#n`). The matcher, the aliases, the
# deployment identifiers and the verdicts all stay on that instance (`Governance/NameCheck`).
#
# 🚨 FAIL CLOSED: no secret, an unreachable endpoint, a refused token, a timeout or a `NotChecked`
# answer FAILS the job. A private repository passes `report-only: true` to be warned instead.
#
# Secrets (org level): NAME_CHECK_URL — base URL of the CRM-owning instance; NAME_CHECK_TOKEN —
# the `mw_` token of a service user whose ONLY grant is create + read on `Governance/NameChecks`.

on:
  workflow_call:
    inputs:
      report-only:
        description: "Warn instead of failing (private repositories)."
        type: boolean
        default: false
      unchecked:
        description: "What 'not checked' does: fail (public repositories) or warn (a hit still fails)."
        type: string
        default: fail
      paths:
        description: "Newline-separated git pathspecs to check (':(exclude)x' excludes). Empty = the whole change."
        type: string
        default: ""
      script-ref:
        description: "REVIEWED ref of Systemorph/MeshWeaver to take the checker from — never the change under review."
        type: string
        default: main
    secrets:
      NAME_CHECK_URL:
        required: false
      NAME_CHECK_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # 🚨 The change's OWN checker is unreviewed code, so its self-test runs in a job of its own: no
  # secret, no workspace and no runner shared with the job that hands the reviewed checker the token.
  # Run inside that job, it could rewrite the reviewed checker on disk before the next step ran it
  # with NAME_CHECK_TOKEN. A GitHub-hosted runner (not MW_RUNNER) is a fresh VM per job, so nothing
  # it leaves behind reaches another job.
  own-checker-self-test:
    name: "No client names: this change's checker proves itself (no secret)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts/check-client-names.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Prove this change's own checker (fake instance, synthetic term)
      if: ${{ hashFiles('.github/scripts/check-client-names.py') != '' }}
      run: python3 .github/scripts/check-client-names.py --self-test

  client-names:
    name: "No client names"
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 0 }
    - name: Take the checker from the platform repository
      uses: actions/checkout@v7
      with:
        repository: Systemorph/MeshWeaver
        ref: ${{ inputs.script-ref }}
        path: .client-names-checker
        # Full history (blobs on demand) so the next step can PROVE the ref is reviewed.
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: .github/scripts/check-client-names.py
        sparse-checkout-cone-mode: false
    # 🚨 WHICH checker runs with the secrets. "Reviewed" is MECHANICAL, never the input's word for it:
    # the checker runs only from a commit on the platform repository's `main` (merged, hence reviewed).
    # `script-ref` (the default `main`, or the pull request's BASE in the platform repository) is
    # honoured only when its commit is an ancestor of `main`; anything else (a `refs/pull/N/head`, a
    # feature branch, a stacked pull request's base) takes `main`'s checker instead, with a notice.
    # The change under review could otherwise rewrite the checker to exit 0, or to read the token, and
    # still report green; a change to the checker is exercised by its own `--self-test`, which needs
    # no secret.
    # The ONE fallback: while `main` itself carries no checker (only before the change that introduces
    # it has landed), the platform repository runs that change's own copy. That window grants nothing
    # new: secrets never reach a fork's pull request, and a branch pushed to this repository can
    # already edit the workflows that hold the secrets. Once the checker is on `main` the branch is
    # unreachable.
    - name: Choose the reviewed checker
      id: checker
      env:
        OWN: .github/scripts/check-client-names.py
        REPO_DIR: .client-names-checker
        REL: .github/scripts/check-client-names.py
        REF: ${{ inputs.script-ref }}
      run: |
        set -euo pipefail
        head=$(git -C "$REPO_DIR" rev-parse HEAD)
        main=$(git -C "$REPO_DIR" rev-parse refs/remotes/origin/main)
        if git -C "$REPO_DIR" merge-base --is-ancestor "$head" "$main"; then
          echo "Checker: Systemorph/MeshWeaver@${REF} (${head:0:10}), which is on main."
        else
          echo "::notice::Systemorph/MeshWeaver@${REF} (${head:0:10}) is not on main, so it is not reviewed. The checker is taken from main (${main:0:10}) instead."
          git -C "$REPO_DIR" checkout --quiet --detach "$main"
        fi
        if [ -f "$REPO_DIR/$REL" ]; then
          echo "path=$REPO_DIR/$REL" >> "$GITHUB_OUTPUT"
        elif [ "$GITHUB_REPOSITORY" = "Systemorph/MeshWeaver" ] && [ -f "$OWN" ] \
             && ! git -C "$REPO_DIR" cat-file -e "$main:$REL" 2>/dev/null; then
          echo "path=$OWN" >> "$GITHUB_OUTPUT"
          echo "::notice::Systemorph/MeshWeaver main carries no check-client-names.py yet. This is the change that introduces it, so its own copy runs."
        else
          echo "::error::No check-client-names.py at the reviewed Systemorph/MeshWeaver commit $(git -C "$REPO_DIR" rev-parse --short HEAD). The confidentiality check cannot run."
          exit 1
        fi
    - name: Prove the checker fails closed (fake instance, synthetic term)
      env:
        CHECKER: ${{ steps.checker.outputs.path }}
      run: python3 "$CHECKER" --self-test
    - name: No client names in what this change adds
      env:
        CHECKER: ${{ steps.checker.outputs.path }}
        NAME_CHECK_URL: ${{ secrets.NAME_CHECK_URL }}
        NAME_CHECK_TOKEN: ${{ secrets.NAME_CHECK_TOKEN }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        REPORT_ONLY: ${{ inputs.report-only }}
        PATHS: ${{ inputs.paths }}
        UNCHECKED: ${{ inputs.unchecked }}
      run: |
        set -euo pipefail
        args=(--unchecked "${UNCHECKED:-fail}")
        if [ "$REPORT_ONLY" = "true" ]; then args+=(--report-only); fi
        while IFS= read -r p; do if [ -n "$p" ]; then args+=(--path "$p"); fi; done <<< "${PATHS:-}"
        # A push whose `before` is all zeros (a new branch) or unknown checks the whole tree.
        if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          args+=(--base "$BASE_SHA")
        fi
        python3 "$CHECKER" "${args[@]}"
