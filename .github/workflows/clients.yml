name: Clients

# CI for the foreign-language client packages under clients/. The .NET solution CI does not cover
# these, so typecheck + test them here on any PR that touches them.
#
# 🚨 EVERY npm step is `npm ci`, never `npm install`, and every client package commits its
# package-lock.json. `npm install` re-resolves the declared RANGES, so a caret dependency could
# pull a release published minutes ago and turn this workflow red repo-wide with nobody having
# changed a line — the build was simply not reproducible.
#
# That is not hypothetical. On 2026-08-11 at 17:19Z Microsoft published
# @fluentui/react-components 9.74.6, which rewrote its exports map and DROPPED the "node" condition
# that had been steering Node to the CommonJS build. Node/vitest then resolved the ESM build, which
# pulls @fluentui/react-icons' lib/index.js — whose relative specifiers are EXTENSIONLESS
# (`export * from './icons/chunk-0'`), invalid under Node ESM. Within 20 minutes every branch and
# main were failing with `Cannot find module '@fluentui/react-icons/lib/icons/chunk-0'` in 23 of 34
# suites. The ONE job that stayed green was portal-next — the only client that already had a
# committed lockfile and already ran `npm ci`. That is the whole argument for this rule.
#
# Consequence to respect: a package.json dependency edit MUST come with its regenerated lockfile,
# or `npm ci` fails the job (by design — that is the drift guard, not an inconvenience).
#
# 🚨 The trigger must list every INPUT these jobs read, not just the tree they live in.
# Several jobs deliberately reach ACROSS into src/ — the server is the single place a string, a
# control mapping or a wire contract is authored, and the client copies are checked against it:
#
#   src/MeshWeaver.Messaging.Hub/Localization/**        → clients/react/src/i18n/localize.test.ts
#                                                         (byte-identical catalog drift guard)
#   src/MeshWeaver.Messaging.Contract/Localization/     → the same test scrapes Locales.Supported
#     Locales.cs
#   src/MeshWeaver.Blazor/BlazorViewRegistry.cs         → clients/react/src/render/parity.test.ts
#                                                         + clients/react-native/src/parity.test.ts
#                                                         (control/skin vocabulary is DERIVED from it)
#   src/MeshWeaver.Hosting.Grpc/Protos/**               → the canonical mesh.proto the python,
#                                                         grpc-web and typescript clients generate from
#   src/MeshWeaver.Mesh.Contract/CreateNodeRequest.cs   → clients/grpc-web/src/wireContract.test.ts
#   src/MeshWeaver.Mesh.Contract/MeshNode.cs              (the C# records the SDKs' wire.ts field
#   src/MeshWeaver.Mesh.Contract/MeshNodeReference.cs     names are checked against — a rename here
#   src/MeshWeaver.Data.Contract/Messages.cs              must turn the client red, because the hub
#   src/MeshWeaver.Data.Contract/PatchDataRequest.cs      DROPS an unmatched member silently)
#   memex/Memex.Portal.Shared/Api/MeshApiEndpoints.cs   → clients/grpc-web/src/restContract.test.ts
#   memex/Memex.LocalMesh/LocalMeshApiEndpoints.cs        (BOTH backends must serve every /api/mesh
#                                                         verb the client SDK posts to — an unmapped
#                                                         one answers the SPA fallback with a 200)
#
# Filtering on "clients/**" alone made every one of those guards blind to the side that actually
# changes: a server-only PR adds a key (or a control, or a proto field), CI stays green because
# nothing under clients/ moved, and the gap sits LATENT until some unrelated PR happens to touch the
# client tree and inherits a red it did not cause. That is not hypothetical — it is issue #964:
# c34bd01e6 and 18b3e2ee3 each added localization keys with ZERO files under clients/, both merged
# green, and the 5 resulting orphan keys survived on main until this change. Keeping the trigger
# aligned with the jobs' real inputs puts the cost back on the PR that created it.
#
# clients/react/src/ciTrigger.test.ts fails if a client test grows a NEW cross-tree read this list
# does not cover, so the trigger and the tests' real inputs cannot drift apart again.
#
# The two lists are spelled out rather than shared through a YAML anchor — the Actions workflow
# parser does not expand anchors/aliases. That same test asserts they stay identical.
on:
  pull_request:
    paths:
      - "clients/**"
      - ".github/workflows/clients.yml"
      - "src/MeshWeaver.Messaging.Hub/Localization/**"
      - "src/MeshWeaver.Messaging.Contract/Localization/Locales.cs"
      - "src/MeshWeaver.Blazor/BlazorViewRegistry.cs"
      - "src/MeshWeaver.Hosting.Grpc/Protos/**"
      - "src/MeshWeaver.Mesh.Contract/CreateNodeRequest.cs"
      - "src/MeshWeaver.Mesh.Contract/MeshNode.cs"
      - "src/MeshWeaver.Mesh.Contract/MeshNodeReference.cs"
      - "src/MeshWeaver.Data.Contract/Messages.cs"
      - "src/MeshWeaver.Data.Contract/PatchDataRequest.cs"
      - "memex/Memex.Portal.Shared/Api/MeshApiEndpoints.cs"
      - "memex/Memex.LocalMesh/LocalMeshApiEndpoints.cs"
  push:
    branches: [main]
    paths:
      - "clients/**"
      - ".github/workflows/clients.yml"
      - "src/MeshWeaver.Messaging.Hub/Localization/**"
      - "src/MeshWeaver.Messaging.Contract/Localization/Locales.cs"
      - "src/MeshWeaver.Blazor/BlazorViewRegistry.cs"
      - "src/MeshWeaver.Hosting.Grpc/Protos/**"
      - "src/MeshWeaver.Mesh.Contract/CreateNodeRequest.cs"
      - "src/MeshWeaver.Mesh.Contract/MeshNode.cs"
      - "src/MeshWeaver.Mesh.Contract/MeshNodeReference.cs"
      - "src/MeshWeaver.Data.Contract/Messages.cs"
      - "src/MeshWeaver.Data.Contract/PatchDataRequest.cs"
      - "memex/Memex.Portal.Shared/Api/MeshApiEndpoints.cs"
      - "memex/Memex.LocalMesh/LocalMeshApiEndpoints.cs"

jobs:
  react:
    name: "@meshweaver/react (typecheck + test + build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test # vitest: renderer core, control gallery, ThreadChat (live thread-node stream), Blazor-parity ratchet
      - run: npm run build # the publishable lib (tsconfig.lib.json) must stay green, not just the test graph

  python-sdk:
    name: "meshweaver (Python test)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bash scripts/gen_proto.sh # generate stubs from the canonical mesh.proto
      - run: pytest -q

  node-sdk:
    name: "@meshweaver/client (typecheck)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22, not 20: the worker's runtime type-stripper (amaro — see package.json's _amaro_note)
          # declares engines node>=22, and Node 20 went end-of-life 2026-04-30.
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test # node --test: the js/ts Code-node execution core (type stripping → vm → REPL value)

  grpc-web:
    name: "@meshweaver/client-web (typecheck + test)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/grpc-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck # runs buf generate (from the canonical mesh.proto) then tsc
      - run: npm test # vitest: envelope round-trip, in-memory Connect/Deliver correlation & demux, thread ops (startThread/submitMessage wire shapes)

  react-native:
    name: "RN connector (typecheck + test)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The aliased renderer source (../react/src) needs its own deps (react) resolvable.
      - name: Install renderer deps
        working-directory: clients/react
        run: npm ci --no-audit --no-fund
      # The live path source-aliases @meshweaver/client-web (../grpc-web/src) — install its deps and
      # generate src/gen so RN's tsc can follow the alias.
      - name: Install + generate grpc-web client
        working-directory: clients/grpc-web
        run: npm ci --no-audit --no-fund && npm run gen
      # Every package the typecheck and the render test need (react-native, react,
      # react-test-renderer, @types/*, expo-av, vitest, typescript) is ALREADY declared in
      # package.json, so the old `--no-save <explicit list>` form pinned nothing extra and installed
      # the same 979-package tree anyway.
      # 🚨 It also CRASHED npm: `package.json` grew an `overrides` block in 457ad8dd3 (the Dependabot
      # sweep), and npm 10 — what Node 20 ships, i.e. this runner — dies resolving overrides during a
      # `--no-save` install with "Cannot read properties of null (reading 'edgesOut')". npm 11 does
      # not, which is why it reproduced only in CI. `npm ci` does no resolution at all — it replays
      # the committed lock — so that failure mode is gone for good.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # Headless render of the sample area + the speech pipeline (transcription client, push-to-talk→submit).
      - run: npx vitest run

  portal:
    name: "Portal example (typecheck + build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The aliased renderer source (../react/src) needs its own deps (react, @fluentui) resolvable.
      - name: Install renderer deps
        working-directory: clients/react
        run: npm ci --no-audit --no-fund
      # The live mode source-aliases @meshweaver/client-web (../grpc-web/src) — install its deps and
      # generate src/gen so the portal's tsc + vite can follow the alias.
      - name: Install + generate grpc-web client
        working-directory: clients/grpc-web
        run: npm ci --no-audit --no-fund && npm run gen
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit # vite build transpiles without type-checking — check types explicitly
      - run: npm run build

  portal-next:
    name: "Portal-next (typecheck + test + build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile's node:22-alpine — build the app on the runtime it ships on.
          node-version: 22
      # vitest.config.ts source-aliases the renderer (../react/src); its own deps must resolve.
      - name: Install renderer deps
        working-directory: clients/react
        run: npm ci --no-audit --no-fund
      # next.config.mjs + vitest.config.ts alias @meshweaver/client-web to ../grpc-web/src, whose
      # src/gen is GENERATED (gitignored) from the canonical mesh.proto — without it the build fails
      # with "Can't resolve './gen/mesh_pb'".
      - name: Install + generate grpc-web client
        working-directory: clients/grpc-web
        run: npm ci --no-audit --no-fund && npm run gen
      # `npm ci` (not install) — it is what the Dockerfile runs; drift between package.json and the
      # lock fails here rather than in the image build.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck # next build skips type-checking by design (see next.config.mjs)
      - run: npm test # vitest: server snapshot, SSR shell, token mint, redirect decision, mesh paths
      - run: npm run build # the standalone production bundle the Docker image ships

  rn-web-e2e:
    name: "RN web (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The source-linked renderer core (../react/src) needs its own deps resolvable during the web export.
      - name: Install renderer deps
        working-directory: clients/react
        run: npm ci --no-audit --no-fund
      # metro.config.js aliases @meshweaver/client-web to ../grpc-web/src — install its deps and
      # generate src/gen so the web export can bundle the live client.
      - name: Install + generate grpc-web client
        working-directory: clients/grpc-web
        run: npm ci --no-audit --no-fund && npm run gen
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e # expo export --platform web → serve dist/ → drive headless Chromium
