name: Clients

# CI for the foreign-language client packages under clients/. The .NET solution CI does not cover
# these, so typecheck + test them here on any PR that touches them.
#
# 🚨 EVERY npm step is `npm ci`, never `npm install`, and every client package commits its
# package-lock.json. `npm install` re-resolves the declared RANGES, so a caret dependency could
# pull a release published minutes ago and turn this workflow red repo-wide with nobody having
# changed a line — the build was simply not reproducible.
#
# That is not hypothetical. On 2026-08-11 at 17:19Z Microsoft published
# @fluentui/react-components 9.74.6, which rewrote its exports map and DROPPED the "node" condition
# that had been steering Node to the CommonJS build. Node/vitest then resolved the ESM build, which
# pulls @fluentui/react-icons' lib/index.js — whose relative specifiers are EXTENSIONLESS
# (`export * from './icons/chunk-0'`), invalid under Node ESM. Within 20 minutes every branch and
# main were failing with `Cannot find module '@fluentui/react-icons/lib/icons/chunk-0'` in 23 of 34
# suites. The ONE job that stayed green was portal-next — the only client that already had a
# committed lockfile and already ran `npm ci`. That is the whole argument for this rule.
#
# Consequence to respect: a package.json dependency edit MUST come with its regenerated lockfile,
# or `npm ci` fails the job (by design — that is the drift guard, not an inconvenience).
#
# 🚨 The trigger must list every INPUT these jobs read, not just the tree they live in.
#
# THIS LIST WAS MUCH LONGER, and most of it is now WRONG rather than merely unused. `044a85618`
# ("The GUI leaves the platform: the view packs and the web clients", 2026-08-25) moved the web
# clients to MeshWeaver.Plugins. `clients/` holds only `python/` and `voice-gateway/`, one job
# survives (`python-sdk`), and EVERY test the old inventory named is gone from this repo:
#
#     clients/react/src/i18n/localize.test.ts        clients/grpc-web/src/wireContract.test.ts
#     clients/react/src/render/parity.test.ts        clients/grpc-web/src/restContract.test.ts
#     clients/react/src/ciTrigger.test.ts            clients/portal-next/e2e
#
# So the nine cross-tree `src/**` and `memex/**` paths spun this workflow on every server-side edit
# to a contract whose client-side check had ALREADY LEFT — a trigger that fires reliably and can
# verify nothing. That reads exactly like coverage from the outside, which is the failure mode the
# paragraph below was written about, one turn of the wheel later.
#
# What remains genuinely cross-tree is the PROTOS: `python-sdk` runs `scripts/gen_proto.sh` and
# generates from `src/MeshWeaver.Mesh.Contract/Protos/**`, so a proto edit must still trigger it.
#
# 🚨 `ciTrigger.test.ts` — the guard that kept this list honest by failing when a client test
# grew a cross-tree read the trigger did not cover — went with the move. Until an equivalent exists
# for the surviving clients, this list is maintained BY HAND and will rot again. If you add a
# cross-tree read to `clients/python`, add its path here yourself.
#
# 🚨 `clients/voice-gateway` HAS NO JOB HERE — this workflow runs `python-sdk` and nothing
# else, so a voice-gateway change triggers a run that does not test it. Adding a path for it would
# make that worse, not better: the run would go green having verified nothing about the thing that
# changed, which is precisely the "fires reliably, checks nothing" state this comment block exists
# to record. If voice-gateway needs CI, it needs a JOB first, and its inputs listed second.
#
# The original rationale, still correct and still the reason the protos path is listed:
# filtering on "clients/**" alone made every cross-tree guard blind to the side that actually
# changes — a server-only PR adds a key or a proto field, CI stays green because nothing under
# clients/ moved, and the gap sits LATENT until an unrelated PR inherits a red it did not cause.
# That is issue #964: c34bd01e6 and 18b3e2ee3 each added localization keys with ZERO files under
# clients/, both merged green, and the 5 orphan keys survived on main until it was fixed.
#
# The two lists are spelled out rather than shared through a YAML anchor — the Actions workflow
# parser does not expand anchors/aliases.
on:
  pull_request:
    paths:
      - "clients/**"
      - ".github/workflows/clients.yml"
      - "src/MeshWeaver.Mesh.Contract/Protos/**"
  push:
    branches: [main]
    paths:
      - "clients/**"
      - ".github/workflows/clients.yml"
      - "src/MeshWeaver.Mesh.Contract/Protos/**"

jobs:
  python-sdk:
    name: "meshweaver (Python test)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bash scripts/gen_proto.sh # generate stubs from the canonical mesh.proto
      - run: pytest -q

