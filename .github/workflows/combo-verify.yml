# ─────────────────────────────────────────────────────────────────────────────────────────────
# COMBO VERIFICATION — the PRODUCER half of the combo gate (issue #3544).
#
# `ComboVerificationGate` on every portal consults `Admin/UpdatePolicy` → `content.comboVerifications`
# before it applies a self-update, and asks the question an artifact cannot answer: *may THIS
# instance roll to that image, given the modules it actually runs?* Producing a verdict needs
# docker, a materialisation root and repo credentials a portal pod does not have, so the producer
# is off-cluster BY DESIGN — `tools/MeshWeaver.ComboVerifier` (`mw-combo-verify`).
#
# 🚨 Until this workflow, that producer was wired to NOTHING. Measured 2026-09-07: zero references
# to `mw-combo-verify` anywhere under `.github/` in this repo or MeshWeaver.Plugins; the only
# `IComboGateRunner` in either repo was a test fake; `Admin/UpdatePolicy.comboVerifications` was
# `[]` on memex-cloud. So every roll in the fleet ran UNVERIFIED — the portal said so in its own
# log ("nothing has checked whether that image can serve the modules this instance runs") and
# applied the update anyway. The gate built to prevent a MissingMethodException-at-boot roll was
# never once consulted with data.
#
# 🚨 WHY THIS IS ITS OWN WORKFLOW AND NOT A JOB IN main-cd.yml. A verify job fails RED until
# each instance accepts this run's identity (its declared build-principal audience and its
# Admin/_BuildPrincipal node — Doc/Architecture/ComboGateWiring), which is the correct state and the whole
# point of the no-skip-trapdoor rule — but a red inside main-cd would sit on the workflow that
# publishes the fleet's images and would be read as "delivery failed". Here the red says exactly
# what it is, and image delivery is untouched.
#
# 🚨 WHICH INSTANCES IT COVERS IS DERIVED, NEVER LISTED (#3848). The roster came out of
# `vars.COMBO_VERIFY_INSTANCES` — a hand-maintained JSON array, which is the pin #3842 rules out and
# which fails in the direction nobody can see: an installation added to the fleet is simply absent,
# so the lane goes green having verified everyone it was told about and nobody it was not. Measured
# 2026-09-15, the value that variable was specified with named TWO installations while the fleet's
# overlays declared THREE live ones. `.github/scripts/derive-combo-instances.py` now reads the same
# `Hosting__Deployment` + `ingress.host` pair `lock-pinned-digests.py`'s AXIS 3 reads, through that
# script's own extractor, and refuses — loudly — any derivation that would come back empty.
#
# 🚨 THE ROSTER NEVER CROSSES A JOB BOUNDARY — ONLY SLOT NUMBERS DO (#3848). The roster names
# installations a client estate keeps private; the private roster registers those names as log
# masks; and the runner DROPS any job output that contains a masked value ("Skip output
# 'instances' since it may contain secret") — as a WARNING, inside a preflight that then concludes
# SUCCESS. Measured 2026-10-10 over the eight newest post-CD runs: `instances` and `sources` were
# dropped, `count` (6) passed, `fromJSON('')` could not expand the matrix, and NOT ONE per-instance
# job was ever created — preflight=success, verify=failure, no instance contacted, no reason
# printed. So the preflight hands over three values that carry no name at all — `slots`
# (`[0,1,…]`), `count` and a salted `digest` — and each verify job derives the roster again with
# the same script, takes the row at its slot, and refuses unless count and digest match the
# preflight's. Job names and artifact names carry the SLOT, never the name: neither is masked.
# The `verdict` job then counts the per-instance jobs this run actually created and reds unless
# that number, and the number that succeeded, both equal the preflight's count.
#
# 🚨 NO SKIP TRAPDOORS. There is no `continue-on-error:` on any input step and no `if:` anywhere
# that asks whether a secret or variable is set. GitHub paints a skipped job the same colour as a
# passed one, so "the gate never ran" and "the gate passed" would become indistinguishable. The
# ONE condition in this file is on the EVENT (did CD actually succeed, i.e. is there a candidate at
# all), byte-identical in intent to main-cd's own. And because a `needs:`-failure SKIPS the verify
# job, the `verdict` job below runs `if: always()` and fails EXPLICITLY on anything that is not a
# success — a skip cannot read green.
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: Combo verification (candidate × instance)

on:
  workflow_run:
    workflows: ["Continuous Delivery (main)"]
    types: [completed]
    # 🚨 REQUIRED, and not decoration. workflow_run fires on completions from EVERY branch, and this
    # workflow keeps one concurrency group — GitHub holds exactly one pending run per group, so an
    # off-branch arrival evicts the on-branch run waiting behind it. Measured on main-cd.yml
    # (2026-09-02): six consecutive CD runs cancelled, nothing promoted for four hours, every
    # dashboard green. WorkflowRunTriggerBranchFilterGuard fails this file without it.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel: a run that is mid-`docker run` inside a candidate image has already spent the
  # expensive part, and a cancelled verification lands no verdict at all.
  group: combo-verify
  cancel-in-progress: false

env:
  ACR: meshweaver.azurecr.io
  # The fleet runs amd64. A verdict is about ONE architecture — a run pinned to the wrong one is
  # NotVerifiable at best and a lie at worst (measured: the same combo and tag reads Green unpinned
  # on an arm64 host and NotVerifiable pinned to linux/amd64, because the emulated tester dies 139).
  PLATFORM: linux/amd64
  # Comfortably under the job's timeout-minutes, so the tool's own budget fires FIRST and says what
  # did not complete. The tool defaults to 45 minutes, which is exactly the fleet's hard job cap —
  # i.e. the default can only ever be pre-empted by the runner, with no diagnosis.
  GATE_TIMEOUT: "1500"

jobs:
  preflight:
    name: "Assert the inputs exist"
    # 🚨 The ONE sanctioned condition, and it is a check on the EVENT: when CD did not succeed there
    # is no candidate to verify against. It is NEVER a check on whether a secret is set.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # An emptiness sweep, a checkout, one token mint, one recursive git tree per repository the
    # fleet-reader App reaches (~34 on 2026-09-15) and a file read per deployment overlay (12).
    # Seconds in practice; the fleet cap is 45 and nothing here has any business approaching it.
    timeout-minutes: 15
    # 🚨 THREE VALUES, NONE OF WHICH CAN CONTAIN A NAME (#3848) — and that is the whole property.
    # The runner drops any job output containing a masked value, and the roster and the source map
    # both contain names the private roster masks. `slots` is `[0,1,…,count-1]`, `count` is a
    # number, `digest` is a salted sha256 written as single digits joined by underscores — a shape
    # no identifier and no numeric secret can be a substring of. `check-combo-verify.py` refuses
    # any other output here.
    outputs:
      slots: ${{ steps.roster.outputs.slots }}
      count: ${{ steps.roster.outputs.count }}
      digest: ${{ steps.roster.outputs.digest }}
    steps:
      # STEP ONE OF TWO ASSERTIONS, and the split is not cosmetic. This one asks whether the inputs
      # that come from OUTSIDE the tree exist at all; it runs FIRST, before the checkout and before
      # the token mint, so an unprovisioned `FLEET_READER_*` reds here naming the secret instead of
      # inside `create-github-app-token` wearing "invalid app id" — the shape that makes a
      # provisioning task read as a workflow bug. The per-INSTANCE half cannot run yet: which
      # instances exist is derived two steps below, not declared.
      #
      # 🚨 WHAT IS ASSERTED HERE IS EXACTLY WHAT IS NEEDED TO REACH THE DERIVATION, AND NOTHING
      # ELSE. The per-instance credential maps that used to be asserted in `roster` no longer exist
      # (#3848: each instance is reached as this run's own OIDC identity); the module-source map is
      # derived from deployment records, not configured here.
      # Measured over this workflow's whole history: because they were asserted HERE, every run died
      # one step above the derivation and the derivation had NEVER ONCE EXECUTED in CI — so the
      # lane's red named absent inputs while the state that has to change first (whatever the
      # derivation says about the fleet's installations) was invisible to every reader of every run.
      #
      # 🚨 AND THE RULE IS "NEEDED TO REACH THE DERIVATION", NOT "IRREVERSIBLE TO PROVISION". That
      # distinction is the whole correction: an earlier attempt moved only the two credential MAPS
      # (an `mwi_` key is issued-never-recovered, an `mw_` admin token is minted per instance — both
      # SPENT rather than fetched, so demanding them before the roster exists spends them against a
      # roster that may not derive) and kept `COMBO_VERIFY_SOURCES` here on the reasoning that it is
      # plain data, free to provision and free to correct. Measured on the first run that reached
      # this step afterwards: the preflight still died HERE, naming `vars.COMBO_VERIFY_SOURCES` and
      # nothing else. That mapping is now derived from each deployment record's `pluginRepos`, so
      # there is no external source-map input to assert. Any remaining unprovisioned input here
      # defeats the reorder — only `AZURE_*` and `FLEET_READER_*` pass the reachability test.
      #
      # This is NOT a skip-trapdoor and nothing here became conditional: no `if:` asks whether a
      # secret is set, no step carries `continue-on-error:`, and the roster is still asserted
      # unconditionally in the same `preflight` job. `check-combo-verify.py` executes both blocks' real shell over the scenarios
      # below and fails if either stops being able to say no.
      - name: Every external input, or a red build naming what to provision
        id: assert
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FLEET_READER_APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
          FLEET_READER_APP_PRIVATE_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AZURE_CLIENT_ID:-}" ]       || missing+=("secrets.AZURE_CLIENT_ID          OIDC app registration for azure/login (already provisioned for main-cd)")
          [ -n "${AZURE_TENANT_ID:-}" ]       || missing+=("secrets.AZURE_TENANT_ID          the Systemorph AAD tenant (already provisioned for main-cd)")
          [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID    the subscription holding ACR meshweaver (already provisioned for main-cd)")
          [ -n "${FLEET_READER_APP_ID:-}" ]     || missing+=("secrets.FLEET_READER_APP_ID        app id of the org's READ-ONLY fleet-reader GitHub App (Contents, Metadata, Pull requests: read), whose installation token reads the module repositories AND the deployment overlays this lane derives its roster from — set it in BOTH the Actions and the Dependabot secret stores (gh secret set NAME --repo Systemorph/MeshWeaver, then again with --app dependabot)")
          [ -n "${FLEET_READER_APP_PRIVATE_KEY:-}" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY  that App's private key (PEM), in BOTH stores like the id. NOT meshweaver-cloud's key: that App holds write and is not installed on Memex")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Combo verification cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            echo "Until then EVERY self-update in the fleet rolls UNVERIFIED (issue #3544): the" >&2
            echo "portal's combo gate has no verdict to consult and applies the update anyway." >&2
            exit 1
          fi
          echo "Every external input is present."

      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      # Cross-repo reads are an installation token minted per run, never a stored PAT. The READ-ONLY
      # `fleet-reader` App — the same one lock-pinned-digests.yml derives its AXIS 3 roster with, and
      # the same one the verify job already uses for the module sources. Doc/Architecture/GitHubAppCredentials.
      - name: Mint an installation token for the fleet
        id: fleet-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # 🚨 THE ROSTER IS DERIVED, NOT DECLARED (#3848). It used to be `vars.COMBO_VERIFY_INSTANCES`
      # — a hand-maintained JSON array, i.e. the pin #3842 rules out — and it was already one
      # installation short of the fleet on the day it was specified. The script reads the same two
      # overlay keys `lock-pinned-digests.py`'s AXIS 3 reads (`Hosting__Deployment` + `ingress.host`)
      # THROUGH THAT SCRIPT'S OWN EXTRACTOR, so the set this lane verifies and the set the nightly
      # lock protects cannot disagree; `.github/acr-retention/instances.json` is the only thing that
      # removes an installation, and only by declaring it retired/not-installed with a reason.
      # It exits 1 on ANY derivation that would come back empty — an unreadable repository, an
      # ambiguous declaration, or a genuinely empty fleet — because an empty matrix skips the verify
      # job and GitHub paints a skipped job the same colour as a passed one. No `continue-on-error:`.
      - name: The instances the fleet's deployment overlays declare
        id: derive
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          # A client estate's roster lines are private — see lock-pinned-digests.py PRIVATE_ROSTER_ENV.
          MW_ACR_PRIVATE_ROSTER: ${{ secrets.ACR_RETENTION_PRIVATE_ROSTER }}
          # The HMAC key of the roster digest — any high-entropy secret BOTH jobs receive identically.
          # The preflight already asserts this one. It is used as key material only, never printed.
          MW_COMBO_DIGEST_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/derive-combo-instances.py --discover

      # STEP TWO OF TWO. The roster now exists, so this asks whether it is a real, non-empty roster
      # and whether the source map derived from DeploymentContent.PluginRepos reached this step
      # intact. 🚨 There is NO credential to assert any more (#3848): the verify job authenticates to
      # each instance as THIS RUN — a GitHub Actions OIDC token minted per call, audience = the
      # instance's base URL — which the instance resolves to its Admin/_BuildPrincipal node. What
      # used to be two hand-issued secret maps (an mwi_ key and a global-admin mw_ token per
      # instance, neither readable back) is now provisioning ON the instance, and a missing half
      # surfaces in the verify job as a 401 whose message names both halves for that instance.
      - name: Every derived instance and its registry sources
        id: roster
        env:
          # STEP outputs, read inside the job that produced them — where a masked value is masked,
          # not dropped. Neither may be re-published as a JOB output (see `outputs:` above).
          INSTANCES: ${{ steps.derive.outputs.instances }}
          SOURCES: ${{ steps.derive.outputs.sources }}
          DIGEST: ${{ steps.derive.outputs.digest }}
        run: |
          set -euo pipefail
          # DERIVED is not VALID, and an absent output is not an empty fleet. A malformed or empty
          # roster would produce an EMPTY matrix, and an empty matrix skips the verify job — which
          # GitHub paints green. Assert the shape here; the step above already refuses to emit one.
          if ! jq -e 'type == "array" and length > 0' >/dev/null <<<"${INSTANCES:-}"; then
            echo "::error::the derived instance roster is not a non-empty JSON array: '${INSTANCES:-}'."
            echo "  It is DERIVED from the fleet's deployment overlays, so there is no variable to" >&2
            echo "  provision: read the step above, which names the repository or declaration that" >&2
            echo "  produced nothing. An empty roster is refused rather than verified, because an" >&2
            echo "  empty matrix skips the verify job and a skipped job is painted green." >&2
            exit 1
          fi
          if ! jq -e 'all(.[]; has("name") and has("baseUrl"))' >/dev/null <<<"$INSTANCES"; then
            echo "::error::every derived instance needs a name and a baseUrl: $INSTANCES"
            exit 1
          fi
          if [ -z "${SOURCES:-}" ]; then
            echo "::error::the deployment records derived no registry sources. The verifier needs the" >&2
            echo "  source-name to module-repository mapping from DeploymentContent.PluginRepos;" >&2
            echo "  refusing to verify with an empty or missing source list." >&2
            exit 1
          fi

          if ! [[ "${DIGEST:-}" =~ ^[0-9](_[0-9]){77}$ ]]; then
            echo "::error::the derivation emitted no roster digest. Each verify job re-derives the" >&2
            echo "  roster and is held to this value; without it a verify job could land its verdict" >&2
            echo "  on a different installation than the one counted here. Refusing to hand over." >&2
            exit 1
          fi

          # 🚨 WHAT IS HANDED TO THE NEXT JOB CARRIES NO NAME (#3848). Not the roster and not the
          # source map: the runner drops a job output that contains a masked value, and both do.
          # `slots` is one opaque position per instance; the verify job at slot N re-derives the
          # roster and takes row N.
          count=$(jq -r 'length' <<<"$INSTANCES")
          slots=$(jq -c '[range(0; length)]' <<<"$INSTANCES")
          if [ "$(jq -r 'length' <<<"$slots")" != "$count" ] || [ "$count" -lt 1 ]; then
            echo "::error::built $(jq -r 'length' <<<"$slots") matrix slot(s) for $count instance(s); refusing to hand over a matrix that is not one slot per instance."
            exit 1
          fi
          {
            echo "slots=$slots"
            echo "count=$count"
            echo "digest=$DIGEST"
          } >>"$GITHUB_OUTPUT"
          echo "Roster and sources derived; $count instance(s) will be verified in $count slot(s), each as this run's own identity."

  verify:
    # 🚨 THE SLOT, NEVER THE NAME (#3848). A job's name is not masked, and this repository's runs
    # are public — a client estate's installation name must not appear in one. The job's own log
    # says which installation the slot resolved to (masked there when it is a private one), and the
    # `verdict` job counts jobs by this exact name, so change both together.
    name: "Verify instance slot ${{ matrix.slot }} against its roll target"
    # 🚨 `needs: preflight` and NOTHING else gating it. No `if:` — the preflight either asserted
    # every input or went red; this job never asks a second time.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.preflight.outputs.slots) }}
    steps:
      - uses: actions/checkout@v7

      - name: Token for the deployment overlays and the module repositories
        id: repo-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: Systemorph
          # Read-only, STATED rather than inherited: this job reads the deployment overlays (to
          # resolve its slot) and the module sources, and writes nothing to GitHub. The read-only
          # fleet-reader App cannot grant more anyway; this line keeps a later-widened App from
          # widening this token.
          permission-contents: read

      # 🚨 WHICH INSTALLATION THIS SLOT IS, RE-DERIVED HERE (#3848). The roster cannot be handed
      # over — a job output containing a masked name is dropped — so this job derives it with the
      # same script the preflight ran and takes the row at its slot. The script refuses (exit 1)
      # unless it derives the preflight's COUNT and the preflight's DIGEST, so a fleet that changed
      # between the two jobs is a red naming the drift and never a verdict landed on a different
      # installation than the one counted. It registers the private roster's masks before it prints
      # anything, and writes INSTANCE_NAME / BASE_URL / SOURCES to $GITHUB_ENV for the steps below.
      # No `continue-on-error:` and no `if:` — a slot that cannot be resolved is a red verify job.
      - name: "Which installation slot ${{ matrix.slot }} is"
        env:
          GH_TOKEN: ${{ steps.repo-token.outputs.token }}
          # A client estate's roster lines are private — see lock-pinned-digests.py PRIVATE_ROSTER_ENV.
          MW_ACR_PRIVATE_ROSTER: ${{ secrets.ACR_RETENTION_PRIVATE_ROSTER }}
          # The HMAC key of the roster digest — any high-entropy secret BOTH jobs receive identically.
          # The preflight already asserts this one. It is used as key material only, never printed.
          MW_COMBO_DIGEST_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          SLOT: ${{ matrix.slot }}
          EXPECT_COUNT: ${{ needs.preflight.outputs.count }}
          EXPECT_DIGEST: ${{ needs.preflight.outputs.digest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/derive-combo-instances.py --discover \
            --slot "$SLOT" --expect-count "$EXPECT_COUNT" --expect-digest "$EXPECT_DIGEST"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          bash .github/scripts/acr-login.sh

      - name: Build the verifier
        run: dotnet build tools/MeshWeaver.ComboVerifier/MeshWeaver.ComboVerifier.csproj -c Release

      - name: "Verify, and LAND the verdict on the installation at slot ${{ matrix.slot }}"
        env:
          # INSTANCE_NAME, BASE_URL and SOURCES come from $GITHUB_ENV — written by the slot step
          # above, inside this job. They are asserted here rather than assumed: `${VAR:?}` reds
          # naming the variable if that step ever stops writing one.
          ARTIFACT_TAG: slot-${{ matrix.slot }}
          GITHUB_TOKEN: ${{ steps.repo-token.outputs.token }}
          WORK_ROOT: ${{ runner.temp }}/combo
        run: |
          set -euo pipefail
          : "${INSTANCE_NAME:?the slot step resolved no installation name}"
          : "${BASE_URL:?the slot step resolved no base URL}"
          : "${SOURCES:?the slot step resolved no registry sources}"
          : "${INSTANCE_PRIVATE:?the slot step did not say whether this row is a private one}"
          # 🚨 No credential is passed: the lander mints this run's own OIDC token per call
          # (the workflow holds `id-token: write`), audience = BASE_URL.
          bash .github/scripts/combo-verify-instance.sh

      # 🚨 NAMED BY SLOT, files included (#3848): an artifact's name and the file names inside it
      # are not masked, and a public repository's artifacts can be downloaded.
      #
      # 🚨 AND NEVER FOR A PRIVATE ROW. `combo.json` is an installation's module list — a client
      # estate's inventory — and this repository is public. The slot step writes INSTANCE_PRIVATE,
      # and the upload happens only when it is literally `false`: unset, empty or anything else
      # uploads nothing, so the condition fails CLOSED. This is not an input-shaped `if:` on a
      # gate — it withholds a diagnostic, and the job's verdict is decided before it. For a private
      # row the lander prints the verdict and counts only; the full verdict is on the instance.
      - name: Keep the work root of a failed verification
        if: failure() && env.INSTANCE_PRIVATE == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: combo-work-slot-${{ matrix.slot }}
          path: |
            combo-slot-${{ matrix.slot }}.json
            combo-verdict-slot-${{ matrix.slot }}.json
          if-no-files-found: ignore

  verdict:
    name: "Combo verification ran, or said why not"
    # 🚨 THE ANTI-SKIP JOB. `needs:` a failed preflight SKIPS `verify`, and GitHub paints a skipped
    # job the same colour as a passed one. This job runs whatever happened and fails EXPLICITLY on
    # anything that is not a success, so the run's conclusion can never say "verified" about a
    # verification that did not happen. It also prints THE DENOMINATOR — how many instances were
    # supposed to be verified — because a zero nobody can read is indistinguishable from a pass.
    if: always()
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` is what lets this job COUNT the per-instance jobs the run created (below).
    # Job-level permissions replace the workflow's, and this job needs nothing else: it checks out
    # nothing and mints no token.
    permissions:
      actions: read
    # 🚨 `result == 'success'` is NOT "verified" on this job, and the reporter below depends on the
    # difference. This job exits 0 for TWO different facts: a real verification, and "no candidate"
    # (the triggering CD published nothing, so there was nothing to check). Collapsing them is the
    # exact defect the job's own body refuses three lines down — and it would make `combo-green`
    # CLOSE a standing `ci-combo-unverified` alert on a run that verified nothing.
    outputs:
      verified: ${{ steps.verdict.outputs.verified }}
    steps:
      # 🚨 THE NUMERATOR, MEASURED — NOT INFERRED FROM `needs.verify.result` (#3848). That result is
      # ONE word for the whole matrix: it cannot tell "six jobs ran and one failed" from "the matrix
      # never expanded and no job exists", and it reads `success` over however many jobs the matrix
      # happened to create. So this asks the run itself which per-instance jobs it has, by the exact
      # name the `verify` job declares, and the step below holds both numbers to the preflight's
      # count. No `continue-on-error:`: if the run cannot be read, this job is red and says so.
      - name: Count the per-instance jobs this run created
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name | test("^Verify instance slot [0-9]+ against its roll target$")) | (.conclusion // "none")' \
            >verify-jobs.txt
          started=$(awk 'END { print NR + 0 }' verify-jobs.txt)
          passed=$(awk '$0 == "success" { n++ } END { print n + 0 }' verify-jobs.txt)
          {
            echo "started=$started"
            echo "passed=$passed"
          } >>"$GITHUB_OUTPUT"
          echo "This run created $started per-instance verify job(s); $passed concluded success."

      - name: The verdict, and it can fail
        id: verdict
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          VERIFY: ${{ needs.verify.result }}
          COUNT: ${{ needs.preflight.outputs.count }}
          STARTED: ${{ steps.jobs.outputs.started }}
          PASSED: ${{ steps.jobs.outputs.passed }}
          # The trigger's own conclusion, so "no candidate" can be told from "inputs missing".
          TRIGGER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'dispatch' }}
        run: |
          set -euo pipefail
          echo "preflight=$PREFLIGHT verify=$VERIFY instances=${COUNT:-0} verify-jobs=${STARTED:-?} verify-jobs-succeeded=${PASSED:-?}"
          {
            echo "## Combo verification"
            echo
            echo "- preflight: \`$PREFLIGHT\`"
            echo "- verify: \`$VERIFY\` over \`${COUNT:-0}\` instance(s)"
            echo "- per-instance jobs created: \`${STARTED:-?}\`, succeeded: \`${PASSED:-?}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          # The count step always writes both; an absent one means it did not run, and a verdict
          # with no numerator is not a verdict.
          if ! [[ "${STARTED:-}" =~ ^[0-9]+$ && "${PASSED:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::the per-instance job count is missing (started='${STARTED:-}', succeeded='${PASSED:-}'). The step that counts this run's verify jobs produced nothing, so nothing here can say how many instances were verified."
            exit 1
          fi

          # 🚨 THREE outcomes, not two. `skipped` and `failure` are different facts and used to
          # share one message — the exact collapse this gate exists to prevent, committed by the
          # gate itself. Measured 2026-09-07: 17 of the last 30 CD runs were CANCELLED by the
          # one-pending-slot rule, so the preflight's event condition skipped it and this job red
          # 6 times out of 6 on main, each time telling the reader to "read the preflight job for
          # the exact list" of a job that never ran. A gate that cries wolf on routine traffic
          # trains people to ignore it, and then the real red is invisible too.
          if [ "$PREFLIGHT" = "skipped" ] && [ "$TRIGGER" != "success" ]; then
            echo "No candidate: the triggering CD run concluded '$TRIGGER', so it published nothing to verify."
            {
              echo
              echo "**No candidate.** The triggering CD run concluded \`$TRIGGER\`, so there is"
              echo "nothing to verify. This is not an unverified roll — no roll was produced."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "verified=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREFLIGHT" = "skipped" ]; then
            echo "::error::the preflight was SKIPPED although the triggering CD concluded '$TRIGGER'. A candidate exists and nothing checked it — that is the skip-trapdoor this gate exists to refuse (#3544)."
            exit 1
          fi
          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::the preflight FAILED, so NO instance was verified and every roll in the fleet is still UNVERIFIED (#3544). Read the preflight job: it either names the inputs to provision, or names the repository/declaration whose deployment overlays the instance roster could not be derived from."
            exit 1
          fi
          # 🚨 THE EMPTY MATRIX, NAMED (#3848). The preflight succeeded and counted instances, and
          # the run holds a different number of per-instance jobs — measured as ZERO on every
          # post-CD run from 2026-10-09 to 2026-10-10, because the matrix input was a job output
          # the runner had dropped. Before this arm the only word printed was `verify=failure`,
          # which reads as "an instance refused the candidate" about a run that contacted nobody.
          if [ "$STARTED" -ne "${COUNT:-0}" ]; then
            if [ "$STARTED" -eq 0 ]; then
              echo "::error::the preflight derived ${COUNT:-0} instance(s) and this run created NO per-instance verify job: the matrix did not expand, so NO instance was contacted and every roll is still UNVERIFIED (#3544). The matrix is built from the preflight's 'slots' output — read the preflight job's log for a 'Skip output' warning (the runner drops a job output that contains a masked value, #3848) or an output that is not a JSON array."
            else
              echo "::error::the preflight derived ${COUNT:-0} instance(s) and this run created $STARTED per-instance verify job(s). The matrix does not cover the roster, so at least one instance was never contacted; a partial verification is not a verification."
            fi
            exit 1
          fi
          if [ "$VERIFY" != "success" ]; then
            echo "::error::combo verification did not succeed for every instance (result: $VERIFY; $PASSED of $STARTED per-instance job(s) succeeded). A candidate a live instance cannot take is not delivered; read the per-instance jobs for the module that failed."
            exit 1
          fi
          # 🚨 THE LAST BACKSTOP, AND IT SURVIVED THE MOVE TO A DERIVED ROSTER ON PURPOSE (#3848).
          # The derivation refuses to emit an empty roster and the preflight refuses to accept one,
          # so reaching here with zero would mean BOTH of those stopped working — which is exactly
          # when a gate must still be able to fail. A derived zero and a declared zero paint the
          # same green, and neither is a verification.
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::the preflight passed but named ZERO instances — that is a vacuous green, not a verification."
            exit 1
          fi
          # …and `verify=success` is held to the same denominator: every job the matrix created
          # must itself have concluded success, and there must be exactly COUNT of them.
          if [ "$PASSED" -ne "$COUNT" ]; then
            echo "::error::the verify matrix reads success, but only $PASSED of $COUNT per-instance job(s) concluded success. Refusing to call that verified."
            exit 1
          fi
          echo "verified=true" >>"$GITHUB_OUTPUT"
          echo "Every derived instance ($PASSED of $COUNT) has a landed combo verdict for its roll target."

  # ── The audience (#4395) ────────────────────────────────────────────────────────────────────────
  #
  # 🚨 THIS LANE'S RED USED TO LAND IN AN EMPTY ROOM. `combo-verify` triggers on `workflow_run` and
  # `workflow_dispatch` only, so no pull request, no reviewer and no required-check list is attached
  # to any of its runs: every verdict above — including "every roll in the fleet is still
  # UNVERIFIED" — went into the Actions history and nowhere else. That is the twin of a
  # skip-trapdoor, and the fleet has already paid for it once: `node-repo-platform-ref-bump.yml` had
  # every other property the rule demands and had still NEVER ONCE SUCCEEDED (#3568,
  # MeshWeaver.Plugins#1462), because red-on-a-trigger-with-no-PR is red nobody reads.
  #
  # 🚨 BRANCHING ON THE VERDICT'S RESULT, NOT ON `if: failure()`. A failure-only reporter never
  # CLEARS a stale alert, and an alert that is no longer true is how the next real one gets skimmed
  # past — the same defect one level out. Two jobs, one per outcome, exactly as every satellite's
  # `ci-red`/`ci-green` pair is wired.
  #
  # 🚨 ITS OWN LABEL, `ci-combo-unverified`. The ledger finds, appends, reopens and closes by label
  # AND title AND its ownership mark, so a lane sharing `ci-main-red` with a repo's main build would
  # let either close the other's story. (`ci-failure` is refused by the script outright — that is
  # main-cd.yml's delivery alert.)
  #
  # 🚨 THE UNPROVISIONED RED IS IN SCOPE, DELIBERATELY. #3848 records that this lane's inputs are not
  # provisioned, so today the preflight fails whenever a candidate exists and this reporter will file.
  # That is the point: an unprovisioned verification lane is a real, unfixed condition, and it is
  # currently invisible — which is the whole of #4395. It produces ONE issue with dated entries, not
  # one issue per run. If the entry cadence proves noisy, the remedy is to PROVISION the lane
  # (#3848), never to silence the reporter; a reporter that suppresses the condition it exists to
  # announce is the silence it was built to end.
  #
  # No `continue-on-error:` and no input-shaped `if:` on either job: an alerting path that swallows
  # its own failure re-creates the silence one level up.
  combo-red:
    name: "The combo verdict has an audience: one issue, one signed event"
    needs: [verdict]
    if: always() && needs.verdict.result == 'failure'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: Systemorph/MeshWeaver/.github/workflows/node-repo-ci-failure.yml@main
    with:
      outcome: failure
      run: ${{ github.run_id }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ github.sha }}
      event: ${{ github.event_name }}
      label: ci-combo-unverified
      issue-title: "ci-combo-unverified: the fleet's rolls are not combo-verified"
      control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
      scripts-ref: main
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}

  # 🚨 GATED ON `verified`, NOT ON `result`. The verdict exits 0 both when it verified everything
  # and when there was NO CANDIDATE — and closing a standing "the fleet's rolls are not
  # combo-verified" alert on a run that verified nothing is the same false clear this whole change
  # exists to stop. Only a real landed verification clears the ledger.
  combo-green:
    name: "Combo verification landed: close the ledger"
    needs: [verdict]
    if: always() && needs.verdict.result == 'success' && needs.verdict.outputs.verified == 'true'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: Systemorph/MeshWeaver/.github/workflows/node-repo-ci-failure.yml@main
    with:
      outcome: success
      run: ${{ github.run_id }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ github.sha }}
      event: ${{ github.event_name }}
      label: ci-combo-unverified
      issue-title: "ci-combo-unverified: the fleet's rolls are not combo-verified"
      control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
      scripts-ref: main
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
