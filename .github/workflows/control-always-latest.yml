# control-always-latest — policy `control-always-latest` (register: Doc/Architecture/PolicyNotProse;
# design: Doc/Architecture/PlatformAndModuleDeploy).
#
#   "control will always be on latest platform and will always update to latest modules."
#
# THE PLATFORM HALF, alarmed here. `main-cd`'s `Deploy control first` job gives the control instance
# (`.github/control-instance.json`) EVERY accepted platform build in the run that built it. This
# workflow reads, on a schedule, whether control actually RUNS the newest build it was given:
#
#   * control's running core commit — its PUBLIC `/api/version` (no credential is sent to it);
#   * every promoted set whose `Deploy control first` job SUCCEEDED, newest first, and when — back to
#     the first one control contains, because the lag clock starts at the FIRST build control missed
#     (a clock on the newest build is reset by every build and never fires) — the promotion
#     records and job timestamps of `main-cd` (this repository's own token);
#   * containment by ANCESTRY (GitHub compare), never by timestamps or version strings.
#
# 🚨 PER LINE (MeshWeaver#8197, policy `major-lines-run-separately`). Ancestry means something only
# ALONG one line: a `main3` cherry-pick does not contain its `main` original, so a reading over
# `main`'s builds called a control on the newest v3 build "behind" the pre-split ancestor it was
# cherry-picked from. Control is compared ONLY with builds of the line its record's `updatePattern`
# names — the record (`.github/control-instance.json` → `record`, read with the read-only
# fleet-reader App) gives the major, and the declared line of that major (`.github/delivery-lines.json`,
# each line's major read from its own Directory.Build.props) gives the branch. Nothing is hard-coded:
# when the record moves to `4.*`, the reading follows `main` with it.
#
# Behind past `platformLagBoundMinutes` → RED, and the ONE open `control-lag` issue gets a comment
# naming control's commit, the newest build, and the first build it missed and how long ago. Converging inside the
# bound is said, not red. A control whose running build cannot be read is RED too — an instance that
# cannot say what it runs cannot be shown to be latest. Control ON the newest build but with `/health`
# not 200 is RED as well: the arming offers the fleet nothing from an unhealthy control, so that state
# blocks every later roll. Green closes the issue.
#
# THE MODULE HALF is alarmed on the control instance itself (MeshWeaver.Plugins Hosting
# `FleetTarget.ControlBreaches`, filed as a `fleet-behind-target` triage item): it needs the
# instance's own installed-vs-served module versions, which only its inventory report carries.
#
# Not a gate on anything: no other workflow needs it, and its red never touches a delivery verdict.
# It is the alarm that makes "control first" a property that is checked, not one that is hoped for.
name: control-always-latest

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # main-cd's promotion records and job timestamps
  issues: write     # the one `control-lag` issue

concurrency:
  group: control-always-latest
  cancel-in-progress: false

jobs:
  platform:
    name: "Control runs the newest platform build it was given (policy control-always-latest)"
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The declaration of which instance is control lives BESIDE the scripts, not under them —
          # without it `control-lag` refuses (RED), so it is checked out explicitly. So do the
          # declared delivery lines control's line is derived from (MeshWeaver#8197).
          sparse-checkout: |
            .github/scripts
            .github/control-instance.json
            .github/delivery-lines.json
            scripts/check-issue-taxonomy.py
          sparse-checkout-cone-mode: false
      - name: "The decision can say no (self-test)"
        run: python3 .github/scripts/arm-promoted-set.py --self-test
      # WHERE control's record is declared is read from the declaration ONCE, and both the token's
      # scope and the read below use it — never a repository name written a second time here.
      - name: Where is control's record declared?
        id: record
        run: |
          set -euo pipefail
          repo=$(jq -er '.record.repository' .github/control-instance.json)
          path=$(jq -er '.record.path' .github/control-instance.json)
          owner=${repo%%/*}
          name=${repo#*/}
          [ "$owner" = "$GITHUB_REPOSITORY_OWNER" ] && [ -n "$name" ] && [ "$name" != "$repo" ] \
            || { echo "::error::.github/control-instance.json record.repository '$repo' is not '<$GITHUB_REPOSITORY_OWNER>/<repository>' — the fleet-reader App is installed on $GITHUB_REPOSITORY_OWNER only"; exit 1; }
          { echo "owner=$owner"; echo "name=$name"; echo "repo=$repo"; echo "path=$path"; } >> "$GITHUB_OUTPUT"
      # Control's record lives in the estate's private deployments repository; the READ-ONLY
      # fleet-reader App (Contents: read) reads it — minted per run, never a stored PAT
      # (Doc/Architecture/GitHubAppCredentials), scoped to exactly the declared repository. A
      # missing grant fails HERE, naming it.
      - name: Mint a read token for control's record
        id: record-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: ${{ steps.record.outputs.owner }}
          repositories: ${{ steps.record.outputs.name }}
          permission-contents: read
      - name: Read control's record (its updatePattern names the line control follows)
        env:
          GH_TOKEN: ${{ steps.record-token.outputs.token }}
          REPO: ${{ steps.record.outputs.repo }}
          RECORD_PATH: ${{ steps.record.outputs.path }}
        run: |
          set -euo pipefail
          repo=$REPO
          path=$RECORD_PATH
          gh api "repos/$repo/contents/$path" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/control-record.json" \
            || { echo "::error::the fleet-reader token (scoped to $repo, contents: read) could not read $repo:$path — check the App's installation on $repo and the declared path"; exit 1; }
          jq -e '.content.updatePattern | strings' "$RUNNER_TEMP/control-record.json" \
            || { echo "::error::$repo:$path carries no content.updatePattern — which line control follows is declared there"; exit 1; }
      - name: Is control on the newest platform build of ITS line?
        id: lag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/arm-promoted-set.py control-lag --control-record "$RUNNER_TEMP/control-record.json"
      - name: File, append to, or close the control-lag issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.lag.outputs.state }}
          SENTENCE: ${{ steps.lag.outputs.sentence }}
        run: |
          set -euo pipefail
          [ -n "${STATE:-}" ] || { echo "::error::the control-lag reading produced no state — refusing to call that green"; exit 1; }
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label control-lag --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          case "$STATE" in
            ok)
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ [run ${GITHUB_RUN_ID}](${RUN_URL}): ${SENTENCE}. Closing."
                gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
              fi
              echo "control is on the newest platform build"
              ;;
            converging)
              echo "::notice title=Control converging::${SENTENCE}"
              ;;
            *)
              gh label create control-lag --repo "$GITHUB_REPOSITORY" \
                --description "Policy control-always-latest: control does not run the newest platform build" \
                --color B60205 --force || echo "::warning::could not ensure the control-lag label (continuing — the issue is the alarm, not the label)"
              body="🚨 [run ${GITHUB_RUN_ID}](${RUN_URL}) — policy \`control-always-latest\`: ${SENTENCE}.

          Control is declared in \`.github/control-instance.json\`. Read, in order: did \`main-cd\`'s **Deploy control first** job tag \`memex-control:<version>\`; did that job's **Hand the build to control's roll lane** step store a VERIFIED \`self-update-available\` at the control plane (a 200 is NOT a roll: the router drops an announcement whose \`deployment\` names no record that plane holds — does it hold \`Deployments/control\`?); did the \`Roll\` run on the control instance (\`Hosting/InstanceAction\`, and whether it parked at an approval — the control record carries no \`rollGate\`); did the migration Job complete. This issue closes itself on the first reading that finds control on the newest build."
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
              else
                # 🏷️ The sentinel states its own TYPE and SEVERITY (Doc/Architecture/IssueTaxonomy): a bug
                # without a sev: is invisible to the release gate. sev:M — control lags the fleet, a
                # secondary path; the portals themselves still roll. `ensure` creates a missing taxonomy
                # label and refuses an incomplete classification, so a missing label is RED here, never dropped.
                taxonomy=$(python3 scripts/check-issue-taxonomy.py ensure --repo "$GITHUB_REPOSITORY" --label bug --label sev:M)
                gh issue create --repo "$GITHUB_REPOSITORY" --title "control-always-latest: control is behind the newest platform build" \
                  --label control-lag --label "$taxonomy" --body "$body"
              fi
              echo "::error title=control-always-latest::${SENTENCE}"
              exit 1
              ;;
          esac

  # No `if:` anywhere in this job. It asserts, it does not decide whether to assert: a missing
  # credential is RED naming what to provision, never a skipped (green-looking) reading.
  preflight:
    name: Preflight (fleet-reader credential for control's record)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every external input, or a red run naming what to provision
        env:
          FLEET_READER_APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
          FLEET_READER_APP_PRIVATE_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$FLEET_READER_APP_ID" ] || missing+=("secrets.FLEET_READER_APP_ID           app id of the org's READ-ONLY fleet-reader GitHub App (Contents, Metadata, Pull requests: read); it reads control's record, whose updatePattern names the line control follows")
          [ -n "$FLEET_READER_APP_PRIVATE_KEY" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY  that App's private key (PEM). NOT meshweaver-cloud's key: that App holds write and is not installed on Memex")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::control-always-latest cannot read control's line — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."
