name: Dependent suites

# 🚨 A CORE PULL REQUEST THAT TOUCHES PUBLIC SURFACE RUNS THE DEPENDENT'S SUITES — HERE, NOW,
# AGAINST ITS OWN MERGE COMMIT — instead of finding out in another repository hours later.
#
# WHY (MeshWeaver#3103, six shapes and counting). Core's CI does not build MeshWeaver.Plugins, and
# MeshWeaver.Plugins builds its `src/` — the compiled modules AND the moved platform suites — against
# core at the commit its `platform-ref` job resolves. So a core change that breaks that build surfaces
# nowhere on the core pull request; it lands on EVERY Plugins pull request at once, and the people
# who see the red are never the people who caused it. Measured 2026-09-02: core #3137 deleted two
# public static readonly fields of a type that stayed; `MeshWeaver.Auth.Test` failed CS0117;
# `Portal hosts (shard 0)` was red on every Plugins pull request for three hours with "the moved
# suites did not build — nothing was tested". The `Cross-repo pair (public surface)` gate could not
# see it (it detected removed TYPES; #3103 §3 taught it members), and the four shapes before it — an
# added overload breaking a `<see cref>`, a JSON field renamed, a comment parsed as a schema, an
# i18n value — no detector can see at all. The structural answer the issue names is the one thing
# that covers all of them: COMPILE AND RUN THE DEPENDENT'S SUITE.
#
# HOW. This job is the DISPATCHER; the RECEIVER is the `core-pr-suites` event in
# MeshWeaver.Plugins/.github/workflows/ci.yml.
#   1. `check-type-forwards.py --surface-json` (the pair gate's own detector, self-tested first)
#      says whether this pull request changes the public declaration set — a type or member removed
#      or added. Docs-only, test-only and private-implementation changes dispatch NOTHING and say so.
#   2. A GitHub App installation token scoped to MeshWeaver.Plugins sends `repository_dispatch`
#      with {core_repo, core_pr, core_sha (this run's MERGE commit), head_sha, core_run_id}.
#   3. The receiver resolves its `platform-ref` to `core_sha` instead of main, runs `portal-hosts`
#      exactly as it does for its own pull requests, and records the verdict as a marker ref
#      `refs/dependent-suites/<core_run_id>` in ITS OWN repository — a root commit whose message is
#      the verdict JSON. It writes nothing into this repository: the App the fleet holds carries
#      `contents: write` + `pull_requests: write` and NOT `checks: write` (measured 2026-09-03 via
#      /orgs/Systemorph/installations), and a dependent that can post checks on core is a
#      cross-repo WRITE a compromised dependent could use to green-wash a core pull request. Pulling
#      the fact keeps the direction: core reads, the dependent is read.
#   4. This job polls that ref (contents: READ on the dependent — the same class of read the pair
#      gate and shared-rules make, ledgered in PlatformNeverDependsOnPluginsGuard.ApiReadLedger) and
#      finishes with the dependent's conclusion. So the core pull request carries ONE context,
#      `Dependent suites (MeshWeaver.Plugins)`, green only when the dependent's suites passed against
#      THIS pull request's merge commit.
#
# 🚨 IT NEVER PASSES ON SILENCE. No receiver on the dependent's default branch → RED before
# dispatching, naming the missing receiver. Dispatched but no verdict within WAIT_MINUTES → RED
# ("the dependent did not answer"). A verdict for a different run, sha or pull request → RED. The
# only green is a verdict that says `success` for exactly this run's merge commit.
#
# 🚨 NO SKIP-TRAPDOOR. The secrets are asserted RED by name. The one exemption is on the EVENT —
# a fork pull request or dependabot, where GitHub withholds org secrets by design — spelled exactly
# as the pair gate spells it. A manual `workflow_dispatch` takes a pull request NUMBER of this repo
# and runs the same path against `refs/pull/<n>/merge`, so the wiring is testable on demand.
#
# NOT REQUIRED YET. To require it: Settings → Rules → main → required status checks → add
# `Dependent suites (MeshWeaver.Plugins)`; because the job skips on fork pull requests, either keep
# it non-required or make it a `needs:` of `Consolidate test results` with an explicit fail step,
# the way `cross-repo-pair` is wired in dotnet-test.yml. Doc/Architecture/CrossRepoPairGate § "The
# dependent's suites run from the core pull request" carries the contract and the measurements.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      core_pr:
        description: 'Pull request number in THIS repository; the dependent builds against refs/pull/<n>/merge'
        required: true
        type: string

# One live run per pull request: a superseded push cancels the in-flight wait (the dependent's
# already-dispatched run finishes on its own and records a verdict nobody reads — bounded waste,
# and the newer push gets its own dispatch). A manual run keys on the number it was given.
concurrency:
  group: dependent-suites-${{ github.event.pull_request.number || inputs.core_pr }}
  cancel-in-progress: true

env:
  DEPENDENT_REPO: Systemorph/MeshWeaver.Plugins
  DEPENDENT_EVENT: core-pr-suites
  VERDICT_REF_PREFIX: dependent-suites
  # "true": dispatch when the public declaration set CHANGED (a type or member added OR removed).
  # "false": dispatch on REMOVALS only. Measured 2026-09-03 over main~25 → main: 21 of 25 merges
  # touch a src/*.cs, 11 change the public declaration set, 1 (#3137) removes from it. The added
  # side is what #2678's `<see cref>` break (issue shape 1) would have needed.
  DISPATCH_ON_ADDITIONS: "true"
  # The dependent's portal-host shards take 25-30 minutes; its own jobs are capped at 45. Below
  # this job's cap so the verdict here is this job's own sentence, never a runner kill.
  WAIT_MINUTES: "40"

jobs:
  plugins:
    name: "Dependent suites (MeshWeaver.Plugins)"
    # THE exemption, on the EVENT and nowhere else (see the header). A manual run is always eligible.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The detector compares the pull request's head against its merge base, so history is
          # needed. On pull_request the default ref IS refs/pull/<n>/merge; a manual run names it.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.core_pr) || '' }}

      - name: Assert the dispatch credential, or fail naming what to provision
        env:
          APP_ID: ${{ secrets.DEPENDENT_DISPATCH_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APP_ID" ]      || missing+=("secrets.DEPENDENT_DISPATCH_APP_ID           app id of the org's meshweaver-cloud GitHub App (installed org-wide; notify-dependents.yml uses the same pair)")
          [ -n "$PRIVATE_KEY" ] || missing+=("secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The dependent's suites cannot be dispatched — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "Credential inputs are present (reach is proven below, not assumed)."

      - name: Resolve the pull request, its merge commit and its head
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || inputs.core_pr }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::'$NUMBER' is not a pull request number."; exit 1; }
          merge_sha=$(git rev-parse HEAD)
          # refs/pull/<n>/merge is a synthetic MERGE commit: ^1 is the base branch as merged, ^2 is
          # the pull request's head. A checkout without two parents is not the merge ref at all.
          if ! head_sha=$(git rev-parse --verify -q HEAD^2); then
            echo "::error::HEAD ($merge_sha) has no second parent — this is not refs/pull/$NUMBER/merge. On a pull_request event that means the merge ref was not checked out; on a manual run, that pull request has no merge commit (closed, or conflicting with its base)."
            exit 1
          fi
          base_tip=$(git rev-parse HEAD^1)
          merge_base=$(git merge-base "$base_tip" "$head_sha")
          {
            echo "number=$NUMBER"
            echo "merge_sha=$merge_sha"
            echo "head_sha=$head_sha"
            echo "merge_base=$merge_base"
            echo "run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
          echo "pull request #$NUMBER ($EVENT): head $head_sha, merge commit $merge_sha, merge base $merge_base"

      # Both self-tests run FIRST and fail the job — an unproven detector decides nothing here.
      - name: "Prove the surface detector is not vacuous (self-test)"
        run: python3 scripts/check-type-forwards.py --self-test

      - name: Does this pull request change the public declaration set?
        id: decide
        env:
          MERGE_BASE: ${{ steps.pr.outputs.merge_base }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The pull request's OWN change (head vs merge base), so a public type somebody else
          # removed on main while this one was open is not read as this one's doing — the same
          # reasoning as the two gates in dotnet-test.yml.
          python3 scripts/check-type-forwards.py --base "$MERGE_BASE" --head "$HEAD_SHA" --surface-json "$RUNNER_TEMP/surface.json"
          python3 - "$RUNNER_TEMP/surface.json" "$DISPATCH_ON_ADDITIONS" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          on_additions = sys.argv[2] == "true"
          # The CONTROL ARM: a scan that read nothing must never decide "nothing changed".
          if report.get("publicTypesAtBase", 0) < 500 or report.get("publicMembersAtBase", 0) < 3000:
              print(f"::error::the surface report saw {report.get('publicTypesAtBase')} public types / "
                    f"{report.get('publicMembersAtBase')} public members at the merge base — src/ declares "
                    "~1800 / ~11000. The detector examined the wrong tree; refusing to decide on it.", file=sys.stderr)
              sys.exit(1)
          removed, added = report.get("removed", []), report.get("added", [])
          dispatch = bool(removed) or (on_additions and bool(added))
          print(f"dispatch={'true' if dispatch else 'false'}")
          print(f"removed={len(removed)}")
          print(f"added={len(added)}")
          PY

      - name: Nothing to dispatch — say so
        if: steps.decide.outputs.dispatch != 'true'
        env:
          REMOVED: ${{ steps.decide.outputs.removed }}
          ADDED: ${{ steps.decide.outputs.added }}
        run: |
          set -euo pipefail
          echo "::notice title=Dependent suites not dispatched::This pull request removes $REMOVED and adds $ADDED public declaration(s) under src/ — below the dispatch trigger (DISPATCH_ON_ADDITIONS=$DISPATCH_ON_ADDITIONS). MeshWeaver.Plugins was not asked to build against it."
          {
            echo "### Dependent suites (MeshWeaver.Plugins) — not dispatched"
            echo
            echo "This pull request removes **$REMOVED** and adds **$ADDED** public type(s)/member(s) under \`src/\`."
            echo "A change that alters no public declaration cannot stop the dependent compiling, so its suites were not run."
            echo "To run them anyway: Actions → Dependent suites → Run workflow → this pull request's number."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint an installation token scoped to the dependent
        if: steps.decide.outputs.dispatch == 'true'
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: MeshWeaver.Plugins
          # `repository_dispatch` needs contents: write on the RECEIVER; reading the verdict ref
          # needs contents: read. Nothing here can write to THIS repository.
          permission-contents: write

      # PRESENT is not VALID, and a repo with no receiver ACCEPTS a dispatch (204) and runs nothing —
      # so both are proven before anything is sent, or the wait below would be 40 minutes of
      # silence ending in a red that names the wrong cause.
      - name: The token reaches the dependent, and the dependent declares a receiver
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DEPENDENT_REPO") || code=000
          case "$code" in
            200) echo "  ok   $DEPENDENT_REPO is readable with the minted token" ;;
            401) echo "::error::$DEPENDENT_REPO -> 401: the App token is invalid or expired."; exit 1 ;;
            403) echo "::error::$DEPENDENT_REPO -> 403: the token is valid but lacks contents on this repo, or is rate-limited."; exit 1 ;;
            404) echo "::error::$DEPENDENT_REPO -> 404: the App is not installed on this repo (GitHub reports an invisible private repo as 404, not 403)."; exit 1 ;;
            000) echo "::error::could not reach api.github.com."; exit 1 ;;
            *)   echo "::error::$DEPENDENT_REPO -> HTTP $code."; exit 1 ;;
          esac
          default_branch=$(jq -r .default_branch "$RUNNER_TEMP/repo.json")
          # 🚨 RAW, not `.content | base64 -d` — GNU base64 rejects GitHub's wrapped payload, and every
          # probe then fails silently (notify-dependents.yml, run 33276934253).
          if ! gh api "repos/$DEPENDENT_REPO/contents/.github/workflows/ci.yml?ref=$default_branch" \
                 -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/dependent-ci.yml"; then
            echo "::error::could not read $DEPENDENT_REPO/.github/workflows/ci.yml on '$default_branch' — the receiver's presence cannot be established, so nothing is dispatched."
            exit 1
          fi
          if ! grep -q "$DEPENDENT_EVENT" "$RUNNER_TEMP/dependent-ci.yml"; then
            echo "::error::$DEPENDENT_REPO/.github/workflows/ci.yml on '$default_branch' declares no '$DEPENDENT_EVENT' receiver (repository_dispatch runs the DEFAULT branch's workflow). A dispatch would be accepted and run nothing, so this job fails now rather than after $WAIT_MINUTES minutes of silence. Land the receiver in MeshWeaver.Plugins first."
            exit 1
          fi
          echo "  ok   $DEPENDENT_REPO/.github/workflows/ci.yml@$default_branch declares '$DEPENDENT_EVENT'"

      - name: Dispatch the dependent's suites against this pull request's merge commit
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ steps.pr.outputs.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REMOVED: ${{ steps.decide.outputs.removed }}
          ADDED: ${{ steps.decide.outputs.added }}
        run: |
          set -euo pipefail
          payload=$(jq -cn \
            --arg repo "$GITHUB_REPOSITORY" --arg pr "$NUMBER" --arg core_sha "$MERGE_SHA" \
            --arg head_sha "$HEAD_SHA" --arg run_id "$RUN_ID" --arg run_url "$RUN_URL" \
            --arg removed "$REMOVED" --arg added "$ADDED" \
            '{core_repo:$repo, core_pr:($pr|tonumber), core_sha:$core_sha, head_sha:$head_sha,
              core_run_id:$run_id, core_run_url:$run_url,
              surface:{removed:($removed|tonumber), added:($added|tonumber)}}')
          echo "payload: $payload"
          jq -cn --arg t "$DEPENDENT_EVENT" --argjson p "$payload" '{event_type:$t, client_payload:$p}' \
            | gh api -X POST "repos/$DEPENDENT_REPO/dispatches" --input -
          echo "dispatched '$DEPENDENT_EVENT' → $DEPENDENT_REPO for pull request #$NUMBER (merge commit $MERGE_SHA, correlation $RUN_ID)"

      - name: Wait for the dependent's verdict — and never pass on silence
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ steps.pr.outputs.run_id }}
        run: |
          set -euo pipefail
          ref="$VERDICT_REF_PREFIX/$RUN_ID"
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          echo "polling refs/$ref in $DEPENDENT_REPO every 60 s until $(date -u -d "@$deadline" +%H:%M:%SZ)"
          message=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -sS -o "$RUNNER_TEMP/ref.json" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$DEPENDENT_REPO/git/ref/$ref") || code=000
            case "$code" in
              200)
                commit=$(jq -r .object.sha "$RUNNER_TEMP/ref.json")
                message=$(gh api "repos/$DEPENDENT_REPO/git/commits/$commit" --jq .message)
                break ;;
              404|000) sleep 60 ;;
              *) echo "::error::reading refs/$ref answered HTTP $code — the verdict cannot be read, so nothing here can pass."; cat "$RUNNER_TEMP/ref.json"; exit 1 ;;
            esac
          done
          if [ -z "$message" ]; then
            echo "::error title=The dependent did not answer::$DEPENDENT_REPO recorded no verdict at refs/$ref within $WAIT_MINUTES minutes. Either its run for this dispatch did not finish (open the Actions tab there: event repository_dispatch, type $DEPENDENT_EVENT), or the receiver did not write the ref. Silence is not a pass."
            exit 1
          fi
          echo "verdict: $message"
          printf '%s' "$message" > "$RUNNER_TEMP/verdict.json"
          python3 - "$RUNNER_TEMP/verdict.json" "$GITHUB_REPOSITORY" "$NUMBER" "$MERGE_SHA" "$HEAD_SHA" "$RUN_ID" "$DEPENDENT_REPO" <<'PY'
          import json, os, sys
          path, repo, number, merge_sha, head_sha, run_id, dependent = sys.argv[1:8]
          try:
              v = json.load(open(path))
          except Exception as ex:  # noqa: BLE001 — any unreadable verdict is a failure, and says so
              print(f"::error::the verdict commit message is not JSON ({ex}) — refusing to read it as a pass.")
              sys.exit(1)
          expected = {"core_repo": repo, "core_pr": int(number), "core_sha": merge_sha,
                      "head_sha": head_sha, "core_run_id": run_id}
          wrong = {k: (v.get(k), e) for k, e in expected.items() if v.get(k) != e}
          if wrong:
              print("::error::the verdict is about a DIFFERENT dispatch — refusing it:")
              for k, (got, exp) in wrong.items():
                  print(f"::error::  {k}: verdict says {got!r}, this run is {exp!r}")
              sys.exit(1)
          conclusion = v.get("conclusion")
          url = v.get("run_url", "")
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if conclusion == "success":
              print(f"::notice title=Dependent suites passed::{dependent} built and ran its suites against merge commit {merge_sha[:9]} — {url}")
              summary.write(f"### Dependent suites (MeshWeaver.Plugins) — passed\n\n{dependent} built its `src/` and ran the portal-host shards against this pull request's merge commit `{merge_sha[:9]}`: **success**. [Run]({url})\n")
              sys.exit(0)
          print(f"::error title=Dependent suites failed::{dependent} concluded '{conclusion}' against merge commit {merge_sha[:9]} (portal-hosts={v.get('portal_hosts')}, platform-ref={v.get('platform_ref')}). Open the run: {url}")
          summary.write(f"### Dependent suites (MeshWeaver.Plugins) — FAILED\n\n{dependent} concluded **{conclusion}** against this pull request's merge commit `{merge_sha[:9]}` (portal-hosts=`{v.get('portal_hosts')}`, platform-ref=`{v.get('platform_ref')}`). [Run]({url})\n\nThis pull request would red every {dependent} pull request the moment it merged (#3103). Fix the break here, or land the dependent's half first and declare it with `Pairs-with:`.\n")
          sys.exit(1)
          PY
