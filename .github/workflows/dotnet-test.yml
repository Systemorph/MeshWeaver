# This workflow builds the solution ONCE, then runs the test suite across
# parallel shards that consume the prebuilt output, and finally consolidates
# every shard's results in a single collector job.
#
#   precheck ──▶ build ──▶ test (matrix shard 0..5) ──▶ collect-results
#
# Why this shape (vs. the old "every shard restores+builds the whole solution"):
#   * The 50+ project solution is compiled exactly once; shards start from the
#     packaged TEST BIN outputs, never recompile, so a shard can only fail for
#     a real test reason (or genuine infra failure), not a flaky build.
#   * Shards run each test project's NATIVE xUnit v3 host (`dotnet <Name>.dll`)
#     instead of `dotnet test --no-build`: no per-project MSBuild evaluation
#     (seconds × ~45 projects), no obj/ or NuGet cache needed in the artifact
#     (the tarball shrank from bin+obj+.nuget-of-everything to test bins only),
#     and the host's exit code faithfully reports catastrophic failures that
#     vstest used to mask (see the exit-marker gate below).
#   * Results are published from ONE collector job → a single "Test Results"
#     check is the pass/fail gate, instead of separate per-shard checks.
#
# Gates (a shard/run is red when ANY fires):
#   1. trx parse — any <UnitTestResult outcome="Failed"> across shards.
#   2. exit markers — any per-project `[CI] <name> exit=N` with N != 0. This is
#      what catches a test host that CRASHES after streaming green results
#      (SIGABRT/FailFast → exit 134 with an all-green trx: the 2026-07 masked
#      Persistence.Test memory-watchdog abort), an 8m wall-clock kill (124/137),
#      and xunit catastrophic failures ("There is no currently active test",
#      teardown ObjectDisposedException) that leave no failed trx entry.
#
# ─────────────── GREEN-TREE REUSE (why main isn't re-tested) ───────────────
# A PR run does NOT test the branch — GitHub builds `refs/pull/N/merge`, i.e. the
# branch ALREADY MERGED with main's tip. When that PR then merges and main hasn't
# moved in between, the commit pushed to main has the IDENTICAL TREE to the one
# just tested green: re-running the whole suite tests the same bytes a second time,
# adds ~22 min to the merge→deploy path (main-cd gates on this workflow), and gives
# flakes a second roll of the dice that can red main and stall the self-update.
#
# So a green run records the TREE it tested as a marker ref:
#
#     refs/ci-green/<tree-sha>/<unix-epoch>
#
# and `precheck` short-circuits build+test when the tree it is about to test
# already carries a fresh marker. Keyed on the TREE, not the commit, so it is
# merge-strategy agnostic — merge, squash and rebase all produce the same tree
# when the base hasn't moved.
#
# Fail-safe by construction: if main moved between the PR run and the merge, the
# merged tree differs, no marker exists, and the full suite runs. There is no way
# to skip a tree that was not actually tested green.
#
# Guards on the marker (all must hold before one is written / honoured):
#   * Written ONLY when build AND every shard job succeeded — not merely when the
#     collector's own gates passed. A shard that infra-fails drops its artifacts
#     entirely, which the trx/exit-marker gates cannot see (nothing to parse).
#   * TTL (CI_GREEN_TTL_SECONDS, 24 h): inputs OUTSIDE the tree drift — a fresh
#     NuGetAudit advisory reds restore repo-wide, the runner's SDK patch moves. A
#     day-old green is evidence; a week-old green is a guess.
#   * `workflow_dispatch` never reuses — a manual run means "actually run it".
#
# `collect-results` runs on BOTH paths (reuse and full), so it is the stable
# required-status-check for the branch ruleset. Do NOT require "Build solution
# (once)" or a shard job: those are legitimately skipped on the reuse path, and a
# skipped required check blocks the merge. Keeping the collector job alive is also
# what keeps the run's conclusion `success` (a run whose jobs ALL skip can conclude
# `skipped`) — main-cd's `workflow_run.conclusion == 'success'` gate depends on it.

name: MeshWeaver Build and Test

# ──────────── EVERY PR, WHATEVER ITS BASE — including a STACKED one ────────────
# 🚨 The `pull_request` trigger deliberately carries NO `branches:` filter. Do not
# re-add one. It used to say `branches: [ "main" ]`, and the consequence (#1401) was
# that a PR based on ANOTHER PR's branch — a stacked PR, which is the recommended way
# to split a large change into reviewable pieces — never ran this suite at all.
#
# The failure mode is the dangerous half: an ABSENT check looks like nothing to wait
# for. There is no "skipped", no pending, no marker of any kind — a stacked PR renders
# as a short, all-green check list, visually IDENTICAL to one that ran the full suite
# and passed. #1398 → #1399 → #1400 were split exactly as intended and two of the three
# reached `MERGEABLE/CLEAN` with zero runs in their entire history.
#
# Three things make that state stickier than it looks, all confirmed on those PRs:
#   * GitHub retargets a child PR to `main` only when the parent's branch is DELETED
#     on merge. Branch deletion is off here, so a child keeps pointing at a merged
#     branch indefinitely — "it gets tested later, just out of order" is not real.
#     Left alone, a stacked PR was never tested at ANY point, including at merge.
#   * `gh pr edit --base main` fires `pull_request.edited`, which is NOT in the default
#     type set (opened/synchronize/reopened). The base changed, the checks stayed
#     absent, and the PR still read CLEAN. Only close+reopen ever queued a run.
#   * The `main pr protection` ruleset is scoped to `~DEFAULT_BRANCH`, so a PR whose
#     base is not `main` is outside it: the `Consolidate test results` required check
#     is not required there, and its absence therefore does not even block the merge.
# So the pre-fix state had no signal at all: nothing ran, nothing was pending, nothing
# was required. Running unconditionally is what turns that silence back into evidence.
#
# What a stacked run tests: GitHub builds `refs/pull/N/merge`, i.e. the branch merged
# with ITS BASE. For a stacked PR that base is the parent's branch, so the run tests
# the layer's own diff on top of the parent — real coverage of the code being reviewed.
# That is the same "tested against a base that is not main's tip" posture the ruleset
# already sanctions repo-wide (`strict_required_status_checks_policy: false`).
#
# Cost is small and bounded, because the green-tree reuse below is keyed on the TREE:
# when the parent merges and main lands the identical tree, `precheck` finds the marker
# the stacked run wrote and skips build+test. A stacked series pays for one full suite
# per layer, not two.
#
# `push:` stays `main`-only on purpose — a full suite on every feature-branch push
# would double every PR's cost for no extra evidence (the PR run already covers it).
on:
  push:
    branches: [ "main" ]
  pull_request:      # ← NO `branches:` filter. See the block above (#1401) before adding one.
  workflow_dispatch:

# A force-push to a PR branch obsoletes the in-flight run — cancel it instead of
# finishing a build of dead code (runner minutes + queue latency for 8 jobs/run).
# Runs on main (and manual dispatches) are never grouped/cancelled: every main
# push must produce its own complete run because main-cd + the self-update gate
# key off it (group = run_id ⇒ each run is its own group).
concurrency:
  group: build-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# publish-unit-test-result-action runs per shard AND in the collector — both need
# checks: write to create check-runs and pull-requests: write to comment.
# contents: write is for the `refs/ci-green/*` marker refs ONLY (push + prune); a
# fork PR's read-only token makes that step fail, which is why it is best-effort.
permissions:
  contents: write
  checks: write
  pull-requests: write
  # `clients-gate` lists the Clients workflow's runs for this commit — see that job.
  actions: read

env:
  # How long a green tree stays evidence. Beyond this the marker is ignored (and
  # the full suite runs) because non-tree inputs — NuGet advisories, runner SDK
  # patch level — have had time to move under it.
  CI_GREEN_TTL_SECONDS: 86400      # 24 h
  # Marker refs older than this are deleted, so `git ls-remote refs/ci-green/*`
  # stays a handful of lines rather than an unbounded ref namespace.
  CI_GREEN_PRUNE_SECONDS: 1209600  # 14 d
  # How many shard jobs the `test` matrix has. STATICALLY known, which is the whole
  # point: `collect-results` compares the number of shards that REPORTED against this
  # number, rather than inferring coverage from whatever artifacts happened to arrive.
  # 🚨 Keep in sync with the `test` job's `matrix.shard` list and the build job's
  # SHARD_TOTAL. A mismatch is loud (the assertion fails), never silent.
  CI_SHARD_TOTAL: 6

jobs:
  # 🚨 No `jlumbroso/free-disk-space` in any job — do not re-add it. Removed 2026-08-09 after
  # measuring what the runner actually has. From the reclaim step's OWN "BEFORE CLEAN-UP" line
  # on run 31306383220 (and identically on every CD job):
  #
  #     /dev/root  145G  58G used  88G available  40% /
  #
  # It then spent ~71 s in `build` and ~53 s in EVERY shard reclaiming ~15 GiB, to go from 88G
  # free to ~103G free. Nothing here comes close to needing that: the whole test-bin tarball set
  # is ~3.3 GB and the pgvector image is a couple more. The "default ~14 GB" the old comments
  # guarded against is simply not what hosted runners ship any more.
  #
  # Cost of keeping it: ~71 s on the critical path in `build`, plus ~53 s on the long-pole shard,
  # plus ~5 min of runner time per run across the six shards — to free space that was never scarce.
  # If a job ever genuinely fills the disk it fails loudly with ENOSPC; reclaim selectively THEN,
  # against a measurement, rather than pre-emptively everywhere.
  #
  # ──────────────────────────── PRECHECK ───────────────────────────
  # Is the tree we are about to test ALREADY green? See the green-tree-reuse
  # section in the file header for why this exists and why it is safe.
  #
  # Cost when it misses: one ~15 s job (checkout + one ls-remote) in front of a
  # ~22 min suite. Cost when it hits: the whole suite, skipped.
  precheck:
    name: "Check for an already-green tree"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
      tree: ${{ steps.probe.outputs.tree }}
      marker: ${{ steps.probe.outputs.marker }}
      # PROVENANCE (#1491): the run that ACTUALLY executed the suite on this tree. A green
      # produced by reuse is honest about the bytes but says nothing about which run gathered
      # the evidence — and "last green main run" is then not the same thing as "last main run
      # that executed the tests", which is exactly how a red got attributed to the wrong PR.
      # Empty for markers written before this was recorded.
      marker_run: ${{ steps.probe.outputs.marker_run }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Only HEAD's tree matters; the marker push in collect-results needs
        # nothing deeper either (it points the ref at github.sha).
        fetch-depth: 1
    - name: "Probe refs/ci-green for this tree"
      id: probe
      run: |
        set -euo pipefail
        # On a pull_request run this is the tree of refs/pull/N/merge — the branch
        # already merged with main — which is exactly the tree that lands on main
        # if nothing else merges first.
        tree=$(git rev-parse 'HEAD^{tree}')
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        echo "Tree under test: $tree"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch — always runs the full suite."
          echo "Manual dispatch: full suite (green-tree reuse disabled)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Newest marker for this tree, if any. Grep locally as well as passing the
        # prefix: never let a server-side pattern match a ref for a DIFFERENT tree.
        #
        # Marker leaf is `<epoch>` (legacy) or `<epoch>-<run_id>` (carries provenance,
        # #1491). Both are accepted; sorting is on the epoch field only.
        newest=$(git ls-remote origin "refs/ci-green/$tree/*" 2>/dev/null \
                 | awk '{print $2}' \
                 | grep -E "^refs/ci-green/$tree/[0-9]+(-[0-9]+)?$" \
                 | sed 's|.*/||' | sort -t- -k1,1n | tail -1 || true)

        if [ -z "$newest" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No green marker for this tree — running the full suite."
          exit 0
        fi

        epoch="${newest%%-*}"
        marker_run=""
        case "$newest" in (*-*) marker_run="${newest#*-}";; esac

        age=$(( $(date +%s) - epoch ))
        if [ "$age" -gt "${CI_GREEN_TTL_SECONDS}" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Marker is ${age}s old (TTL ${CI_GREEN_TTL_SECONDS}s) — stale, running the full suite."
          exit 0
        fi

        {
          echo "skip=true"
          echo "marker=refs/ci-green/$tree/$newest"
          echo "marker_run=$marker_run"
        } >> "$GITHUB_OUTPUT"
        echo "Tree already green ${age}s ago — reusing that result."
        # 🚨 Name the run that ACTUALLY executed the suite (#1491). Without this, a reader
        # of the run list cannot tell a green that gathered evidence from a green that
        # inherited it — and taking the bisect window from the latter points at the wrong PR.
        if [ -n "$marker_run" ]; then
          provenance="[run ${marker_run}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${marker_run})"
          echo "The suite was actually executed by run ${marker_run}."
        else
          provenance="_unrecorded (marker predates provenance recording)_"
        fi
        {
          echo "### ✅ Reusing an already-green result"
          echo
          echo "This commit's tree \`$tree\` was tested green **${age}s ago** and nothing in it has changed since, so build + test are skipped."
          echo
          echo "- Marker: \`refs/ci-green/$tree/$newest\`"
          echo "- Evidence gathered by: ${provenance}"
          echo "- TTL: \`${CI_GREEN_TTL_SECONDS}s\`"
          echo
          echo "> This run **did not execute the suite**. If something later goes red, the bisect"
          echo "> window starts at the last main run that ACTUALLY ran the tests — not at this commit."
        } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────── PREFLIGHT ───────────────────────────
  # ONE place that asserts every CI INPUT this workflow needs from outside the tree
  # (repo secrets and variables). It exists so that no gate downstream ever has to
  # defend itself against a missing input.
  #
  # 🚨 THE BUG CLASS IT REMOVES — "skip-trapdoors". The shape it replaces was a
  # per-gate `continue-on-error:` plus an "is the secret set?" branch, which turns an
  # unprovisioned credential into a SKIPPED job — and GitHub renders a skipped job
  # with the same grey/green tick as a passed one. "The gate never ran" and "the gate
  # passed" become indistinguishable, and a required check that passes on no evidence
  # is worse than a flaky one.
  #
  # That is not theoretical, and the cost has already been paid. The cross-repo plugin
  # gate below sat inert-and-green from the day it was added — its checkout failed for
  # want of a credential, `continue-on-error` rewrote that failure to `success`, and the
  # compile step skipped. So #683's deletion of `AiSettingsNodeType.AddSkillSource`
  # merged UNVERIFIED while the plugins repo's `Store/Plugin/Source/Localizer.cs` still
  # called it. The break surfaced only when the mesh recompiled `Store/Plugin` in
  # production: CS0117, and since every plugin declares `requires: Store`, every
  # `nodeType:Store/Plugin` partition (Edu, Agent, Skill, Essentials, Collaboration,
  # DataModelling, Feedback, Instances, Publish) fell back to the compilation-error
  # overlay. A separate `AddTracking` deletion broke `SocialMedia/Post` the same way.
  # `Store` is in VITAL_MODULES precisely so an armed gate would have failed #683.
  #
  # The contract, in three lines:
  #   * a missing input is a RED job naming exactly what to provision — never a skip;
  #   * gates then run UNCONDITIONALLY. No gate may test its own inputs.
  #   * the ONE legitimate exemption — a fork PR cannot read org secrets — is expressed
  #     HERE, once, as a FORK check. Never as a "the secret is empty" check: at the job
  #     level those two are indistinguishable, and only one of them is safe.
  #
  # Adding an input? Add a line to `missing` below and nothing else.
  preflight:
    name: "Required CI inputs"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - name: "Assert every required secret / variable is present"
      env:
        PLUGINS_REPO_SSH_KEY: ${{ secrets.PLUGINS_REPO_SSH_KEY }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        # The sanctioned exemptions — both expressed as EVENT/ACTOR properties, never as
        # "is the secret set?" probes (the trapdoor shape this job exists to close).
        # 1) Fork PRs: GitHub withholds org secrets from fork runs BY DESIGN.
        if [ "${IS_FORK:-}" = "true" ]; then
          echo "Fork PR — org secrets are withheld by design; the gates that need them do not run."
          echo "Fork PR: secret-dependent gates are not applicable." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # 2) Dependabot PRs: dependabot-actor runs read the SEPARATE Dependabot secrets store,
        #    not Actions secrets — so Actions secrets are absent BY DESIGN, exactly like forks.
        #    The plugins gate carries the same actor check at its job level; the push-to-main
        #    run after merge HAS the secret and runs the gate, so a dependency bump that breaks
        #    the plugins compile reddens main immediately rather than shipping silently.
        #    To arm the gate ON dependabot PRs too, provision PLUGINS_REPO_SSH_KEY under
        #    Settings -> Secrets and variables -> DEPENDABOT and delete this exemption.
        if [ "${ACTOR:-}" = "dependabot[bot]" ]; then
          echo "Dependabot PR — Actions secrets are withheld by design (separate Dependabot store); the gates that need them do not run."
          echo "Dependabot PR: secret-dependent gates are not applicable." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        missing=()
        [ -n "${PLUGINS_REPO_SSH_KEY:-}" ] || missing+=("PLUGINS_REPO_SSH_KEY (secret) — private half of the read-only deploy key on Systemorph/MeshWeaver.Plugins. Used by the 'Plugins compile against this PR' gate to check that repo out.")
        if [ "${#missing[@]}" -ne 0 ]; then
          for m in "${missing[@]}"; do
            echo "::error title=Missing required CI input::$m"
          done
          {
            echo "### ❌ Missing required CI input(s)"
            echo
            for m in "${missing[@]}"; do echo "- $m"; done
            echo
            echo "Provision them under **Settings → Secrets and variables → Actions**, then re-run."
            echo "This job fails rather than letting the gates that need them skip: a skipped gate is"
            echo "indistinguishable from a passing one, which is how an unarmed gate ships a regression."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "All required CI inputs are present."

  # ───────────────────────────── BUILD ─────────────────────────────
  # Compile the whole solution exactly once and package every TEST project's
  # bin output (self-contained: CopyLocal puts each test's full dependency
  # closure + fixtures in its own bin) into one tarball the shards consume.
  #
  # No `dotnet workload restore`: the 2026-07-12 CI logs prove it installs
  # NOTHING ("No workloads installed for this feature band … Successfully
  # updated workload(s): .") and burned ~75 s per job updating advertising
  # manifests. No project in the graph requires a workload; if one ever does,
  # the build step here fails loudly and the restore comes back — with a cache.
  #
  # No mesh-local `#r` pack step: the baked feed was removed from the portal
  # image in #395 (the scope generator ships with the platform and runs
  # in-process — pinned by BuiltInScopeGeneratorTest; legacy
  # `#r "nuget:MeshWeaver.BusinessRules.Generator"` directives are filtered out
  # of the NuGet resolve set at compile). Nothing in the test suite resolves
  # from dist/packages anymore, so packing it was pure waste.
  build:
    name: "Build solution (once)"
    needs: precheck
    # Skipped ONLY when this exact tree is already green (see the file header). `test`
    # needs `build`, so it skips with it; `collect-results` is if:always() and
    # reports the reused result.
    #
    # 🚨 `!cancelled()` is what makes the skip FAIL-OPEN. A `needs` job that ends
    # cancelled — the probe waiting 15 min for a runner and being killed with zero
    # steps executed, main 2026-08-06 — skips every dependent REGARDLESS of this `if`,
    # unless the condition contains always()/!cancelled(). That silently skipped the
    # build and all six shards, and the run still reported a green required check.
    # With !cancelled(), an unanswerable probe means "we don't know" ⇒ TEST IT; only a
    # genuine workflow cancellation (where !cancelled() is false) still stops the run.
    if: ${{ !cancelled() && needs.precheck.outputs.skip != 'true' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # Merge precondition (a): build green with warnings-as-errors (ReleaseStrategy.md → "Merge
      # preconditions"). The compiler-warning burn-down (release-governance step A2) is DONE and
      # TreatWarningsAsErrors=true is set centrally in Directory.Build.props; -warnaserror here makes
      # the gate explicit at the CI build step. NuGet restore advisories (NU19xx vulnerabilities) stay
      # warnings (WarningsNotAsErrors in Directory.Build.props) — handled via dependency overrides.
      run: dotnet build --no-restore -c Release -p:CIRun=true -warnaserror
    - name: Package test outputs (one tarball per shard)
      env:
        SHARD_TOTAL: 6
      run: |
        set -euo pipefail
        # ── Why PER SHARD and not one tarball for everyone ──────────────────
        # The single 3.3 GB artifact was downloaded by all 6 shards — 20 GB of
        # transfer per run, and the artifact service's throughput varies ~10x
        # run to run (measured 35 s … 318 s for the same bytes). That download
        # WAS the shard imbalance: on run 30903428924 the long-pole shard spent
        # 318 s downloading and a perfectly ordinary 370 s testing, while the
        # fastest shard downloaded the same bytes in 35 s.
        #
        # Packing per shard costs the same compression work (same bytes, split
        # six ways) plus the cross-shard dedupe we give up, and it turns a 3.3 GB
        # download into ~1/6 of one.
        #
        # Only the TEST projects' bin trees travel. Each test bin is
        # self-contained (dependency closure + TestData fixtures copied in — e.g.
        # AI.Test's CopyFakeCli target puts FakeCli under its OWN bin), and the
        # native xUnit v3 hosts need no obj/, no src/samples bins, and no NuGet
        # global-packages folder (runtime NuGet-resolver tests declare themselves
        # network-based and restore into the default cache).
        #
        # 🚨 The SAME script decides the assignment here and in the test job. If
        # they ever diverged, a shard would run a project whose bin it never
        # downloaded.
        for ((i=0; i<SHARD_TOTAL; i++)); do
          SHARD_INDEX=$i .github/scripts/shard-assign.sh \
            | while read -r entry; do
                # A split project arrives as `<csproj>#<part>/<parts>`. Strip the suffix: the
                # SAME bin has to travel to every shard running one of its parts.
                csproj="${entry%%#*}"
                d="$(dirname "$csproj")/bin"
                # A project that produced no output (helper with nothing to
                # build) simply contributes nothing to its shard's tarball.
                [ -d "$d" ] && echo "$d"
              done | sort -u > ".build-paths-$i.txt"
          # 🚨 Shard 0 additionally carries the PLUGIN TESTER — the ONE non-test bin that
          # travels. tools/MeshWeaver.PluginTester (mw-plugin-test.dll) is a TOOL, so the
          # test-project sweep above never picks it up; but the plugin-gate job reuses THIS
          # artifact instead of rebuilding, and that reuse is exactly what keeps the gate
          # inside its 12-minute budget. While the gate sat unarmed the omission was
          # invisible — the FIRST armed run died on "mw-plugin-test.dll not in the build
          # output — the gate cannot run", having tested nothing, which is the very shape
          # that job exists to prevent. The run loop iterates shard-assign.sh's project
          # list (not the extracted tree), so this extra bin is inert for the tests.
          # Missing here is a BUILD fault, not a tolerable absence: the solution builds
          # this project, so fail loudly rather than ship an artifact the gate cannot use.
          if [ "$i" -eq 0 ]; then
            if [ ! -d tools/MeshWeaver.PluginTester/bin ]; then
              echo "::error::tools/MeshWeaver.PluginTester/bin is missing — the plugin gate would have nothing to run."
              exit 1
            fi
            echo tools/MeshWeaver.PluginTester/bin >> ".build-paths-$i.txt"
          fi
          # zstd -T0 = all cores. --long=27 (128 MiB match window) dedupes ACROSS
          # files: the self-contained test bins each carry near-identical copies
          # of the same framework + MeshWeaver DLLs, which the default 8 MiB
          # window can't see. The EXTRACT side must pass --long=27 too, or zstd
          # refuses with a window-size error.
          # 🚨 An empty path list would produce an empty tarball, and a shard that
          # extracts nothing finds no <Name>.dll — which the run loop would classify
          # as "helper project, nothing to run", exit=0, GREEN. A whole suite could
          # pass having executed zero tests. Fail here instead.
          if [ ! -s ".build-paths-$i.txt" ]; then
            echo "::error::shard $i got no bin trees to pack — shard-assign.sh failed or the build produced no test output."
            exit 1
          fi
          tar -I 'zstd -T0 --long=27' -cf "build-output-$i.tar.zst" -T ".build-paths-$i.txt"
          echo "shard $i: $(wc -l < ".build-paths-$i.txt") bin trees, $(du -h "build-output-$i.tar.zst" | cut -f1)"
        done
    # One artifact per shard. Six near-identical steps because a step cannot be
    # generated in a loop — keep them in sync with SHARD_TOTAL above and with the
    # test job's matrix.
    - name: "Upload artifact: shard 0"
      uses: actions/upload-artifact@v7
      with: { name: build-output-0, path: build-output-0.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 1"
      uses: actions/upload-artifact@v7
      with: { name: build-output-1, path: build-output-1.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 2"
      uses: actions/upload-artifact@v7
      with: { name: build-output-2, path: build-output-2.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 3"
      uses: actions/upload-artifact@v7
      with: { name: build-output-3, path: build-output-3.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 4"
      uses: actions/upload-artifact@v7
      with: { name: build-output-4, path: build-output-4.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 5"
      uses: actions/upload-artifact@v7
      with: { name: build-output-5, path: build-output-5.tar.zst, retention-days: 1, compression-level: 0 }

  # ───────────────────────────── TEST ──────────────────────────────
  # Matrix-sharded: the ~45 test projects are split across SHARD_TOTAL parallel
  # runners by MEASURED weight (greedy LPT — see the Run Tests step). Each shard
  # downloads the prebuilt test bins and runs each project's native xUnit v3
  # host — NO restore, NO build, NO MSBuild.
  test:
    name: "Run tests (shard ${{ matrix.shard }})"
    needs: build
    # HARD CAP on a shard. Each project already has its own `timeout 8m` below, but that
    # only bounds a project that is RUNNING — it cannot bound a shard that wedges between
    # projects. 20 min is ~1.5x the slowest observed shard (14m36s) with the rebalanced
    # weights, so a shard that hits this is stuck, not slow.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling shards when one fails — we want every shard's
      # results so the PR shows the full failure picture, not just the first.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: "Download artifact: this shard's build output"
      uses: actions/download-artifact@v8
      with:
        # Only THIS shard's test bins (~1/6 of the output). The old single
        # 3.3 GB artifact was pulled by every shard and its 35–318 s transfer
        # variance, not the tests, decided which shard was the long pole.
        name: build-output-${{ matrix.shard }}
    - name: Extract build output
      run: |
        set -euo pipefail
        # --long=27 matches the pack side (window > 8 MiB default; required to decode).
        tar -I 'zstd --long=27' -xf "build-output-${{ matrix.shard }}.tar.zst"
        rm -f "build-output-${{ matrix.shard }}.tar.zst"
        df -h / | tail -1 | awk '{print "disk after extract: " $4 " free of " $2}'
    # ── Acquire the Testcontainers images BEFORE the tests, as infrastructure ──
    # 🚨 This step exists so a Docker Hub outage can never again masquerade as a
    # mass TEST failure. Every PostgreSql fixture is a COLLECTION fixture, so when
    # the image cannot be pulled, `InitializeAsync` throws and xUnit reports the
    # failure against every test in the collection: run 31137723323 shard 5 logged
    # 412 [FAIL]s, all of them the identical
    #   DockerApiException: Get "https://registry-1.docker.io/v2/": context deadline exceeded
    # and NOT ONE a real defect. That shape is actively harmful — it reds the merge
    # gate with a plausible-looking access-control failure list that cannot be
    # reproduced locally (where the image is already in the local store), and it
    # cost a full debugging session chasing tests that were never broken.
    #
    # Pulling here instead makes the dependency explicit and the diagnosis instant:
    # the registry is a THIRD-PARTY fetch, so it gets bounded retries with backoff
    # (a transient blip is not a code defect and must not be reported as one), and
    # if it still cannot be fetched the shard fails HERE with an unambiguous infra
    # error instead of 412 phantom test results.
    #
    # Testcontainers then finds the image in the local store and starts it without
    # touching the network. Keep this list in sync with the fixtures — grep for
    # `new PostgreSqlBuilder(` / `.WithImage(`.
    - name: "Pre-pull Testcontainers images (infra, not a test)"
      run: |
        set -uo pipefail
        # Only the images the fixtures name explicitly. Testcontainers' OTHER
        # implicit Docker Hub pull — the ryuk resource reaper — is not listed
        # because it is DISABLED for CI instead (see TESTCONTAINERS_RYUK_DISABLED
        # on the next step): the runner VM is discarded wholesale after the job,
        # so there is nothing for a reaper to reap, and not pulling it removes a
        # second registry dependency rather than adding a second thing to retry.
        # Its tag is also a function of the Testcontainers package version, so
        # pinning it here would silently rot.
        images="pgvector/pgvector:pg17"
        rc=0
        for img in $images; do
          ok=0
          for attempt in 1 2 3 4 5; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "$img: already in the local store"; ok=1; break
            fi
            if docker pull --quiet "$img"; then
              echo "$img: pulled on attempt $attempt"; ok=1; break
            fi
            # Backoff: 5s, 10s, 20s, 40s. Docker Hub blips are seconds-to-minutes.
            delay=$((5 * 2 ** (attempt - 1)))
            echo "$img: pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep $delay
          done
          if [ $ok -eq 0 ]; then
            echo "::error::could not pull $img after 5 attempts — this is a REGISTRY/INFRA failure, not a test failure. Do not chase the tests that would have reported it."
            rc=1
          fi
        done
        exit $rc
    # ── Acquire the headless browser BEFORE the tests, as infrastructure ──────
    # 🚨 Since #1230 the PDF export IS a headless browser: the document model was replaced
    # by CSS Paged Media printed by Chromium, so every PDF test — the renderer's own, and the
    # export-script round trips in the Monolith / Orleans / Security suites — needs one. This
    # step provisions the EXACT build the portal image ships (same Playwright version, same
    # `--only-shell` Chromium), so CI cannot pass on a browser production does not have, nor
    # fail on one it does.
    #
    # Same reasoning as the Testcontainers pre-pull above: making the dependency explicit
    # means a CDN blip fails HERE with an unambiguous infra error instead of surfacing as a
    # pile of plausible-looking PDF test failures. NO `continue-on-error` and no
    # input-shaped `if:` — a browser this step failed to install must redden the shard, not
    # silently leave the tests asserting the "no browser here" branch and calling it green.
    #
    # Keep PLAYWRIGHT_VERSION in step with deploy/base-images/portal-ai/Dockerfile.
    - name: "Provision the headless browser (infra, not a test)"
      env:
        PLAYWRIGHT_VERSION: 1.62.1
        PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      run: |
        set -euo pipefail
        sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
        sudo chown "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
        ok=0
        for attempt in 1 2 3; do
          if npx --yes "playwright-core@${PLAYWRIGHT_VERSION}" install --with-deps --only-shell chromium; then
            ok=1; break
          fi
          delay=$((10 * attempt))
          echo "browser install attempt $attempt failed; retrying in ${delay}s" >&2
          sleep $delay
        done
        if [ $ok -eq 0 ]; then
          echo "::error::could not install the headless browser after 3 attempts — this is an INFRA failure, not a test failure."
          exit 1
        fi
        # The binary is named differently per platform (see the Dockerfile); match both so this
        # keeps working if the runner architecture ever changes.
        BROWSER="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \
          \( -name headless_shell -o -name chrome-headless-shell \) | head -n 1)"
        if [ -z "$BROWSER" ]; then
          echo "::error::the browser installed but no headless-shell binary was found under $PLAYWRIGHT_BROWSERS_PATH"
          find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3
          exit 1
        fi
        "$BROWSER" --version
        # 🚨 Give the browser back its SANDBOX. Ubuntu 23.10+ (this runner is 24.04) restricts
        # unprivileged user namespaces through AppArmor — and an unprivileged user namespace is
        # exactly what Chromium's namespace sandbox is built from. Without this the browser
        # aborts with "No usable sandbox!" and every PDF test fails with a rendering error that
        # looks like a defect in the export. Note the direction: this ENABLES a security
        # mechanism. The alternative — passing --no-sandbox in CI — would have CI exercise a
        # weaker configuration than a properly configured host runs, which is precisely the
        # divergence this step exists to remove. The knob is checked for existence because a
        # kernel without it has no such restriction to lift.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        # Prove it can actually PRINT here, not merely that it installed. This is the property
        # every PDF test depends on, and asserting it in the infra step turns an environment
        # problem into one unambiguous failure instead of a scattering of plausible-looking
        # test failures across four shards (which is exactly how this was found).
        # `timeout` is mandatory, not belt-and-braces: --print-to-pdf contracts to WRITE the PDF,
        # not to exit afterwards (the renderer waits on the file, not on the process, for exactly
        # this reason). An unbounded smoke print would hang the shard instead of failing it.
        printf '<!doctype html><title>smoke</title><p>smoke</p>' > /tmp/mw-smoke.html
        timeout 60 "$BROWSER" --headless=new --disable-gpu --disable-dev-shm-usage \
          --no-pdf-header-footer --user-data-dir=/tmp/mw-smoke-profile \
          --print-to-pdf=/tmp/mw-smoke.pdf file:///tmp/mw-smoke.html 2>/tmp/mw-smoke.err || true
        if [ ! -s /tmp/mw-smoke.pdf ]; then
          echo "::error::the headless browser installed but cannot print a PDF on this runner — this is an INFRA failure, not a test failure."
          cat /tmp/mw-smoke.err >&2 || true
          exit 1
        fi
        echo "browser smoke print OK ($(wc -c < /tmp/mw-smoke.pdf) bytes)"
        # First entry in PixelRenderingOptions.EnvironmentVariables, so the renderer's probe
        # resolves this exact binary rather than whatever browser the runner image happens to
        # carry.
        echo "MESHWEAVER_CHROMIUM_PATH=$BROWSER" >> "$GITHUB_ENV"
    - name: Run Tests
      env:
        # The runner VM is destroyed after the job, so Testcontainers' resource
        # reaper has nothing to reap — disabling it removes an implicit Docker Hub
        # pull (one more thing that can fail the shard from outside our code).
        TESTCONTAINERS_RYUK_DISABLED: true
        DOTNET_ENVIRONMENT: Development
        Logging__LogLevel__Default: Warning
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_TOTAL: 6
        # Native-crash diagnosability (SIGSEGV/SIGABRT of a test host): the runtime
        # writes a mini core dump before dying, collected into the shard artifact.
        # First seen: FutuRe.Test exit=139 on the first native-host run — not
        # reproducible on macOS-arm64 or linux-arm64 locally, so the dump is the
        # only window into the runner-only crash.
        DOTNET_DbgEnableMiniDump: 1
        DOTNET_DbgMiniDumpType: 2
        DOTNET_DbgMiniDumpName: /tmp/coredumps/%e-%p.dmp
      run: |
        # EVERY test project runs — no exclusion list (see .github/scripts/shard-assign.sh).
        # PostgreSql and Cosmos come up via Testcontainers using pre-installed Docker,
        # Orleans via in-proc TestCluster, Acme/FutuRe via dynamic Code-piece compilation.
        #
        # set +e so a crashed/aborted test host doesn't terminate the loop — we
        # want EVERY project to attempt to run, then the exit-marker gate below
        # fails the shard on anything non-zero.
        set +e
        : > test/test-results.log
        mkdir -p /tmp/coredumps

        # ── Shard assignment ────────────────────────────────────────────────
        # 🚨 The SAME script the build job used to decide what went into THIS
        # shard's artifact. Duplicating the logic here (as two inline copies of
        # the weight table + LPT loop) would let the two silently diverge, and a
        # shard would try to run a project whose bin it never downloaded.
        mapfile -t selected < <(.github/scripts/shard-assign.sh)
        # `set +e` is in force above, so a broken script would leave `selected`
        # empty and the shard would run NOTHING and report green. Fail loudly.
        if [ "${#selected[@]}" -eq 0 ]; then
          echo "::error::shard-assign.sh produced no projects for shard $SHARD_INDEX/$SHARD_TOTAL — refusing to report a green shard that ran nothing."
          exit 1
        fi
        echo "Shard $SHARD_INDEX/$SHARD_TOTAL runs ${#selected[@]} projects"

        # ── Run each assigned project's native xUnit v3 host ─────────────────
        for entry in "${selected[@]}"; do
          # A heavyweight may be SPLIT across shards, arriving as `<csproj>#<part>/<parts>`.
          # Each part runs in its own process on its own runner, so the halves share
          # nothing — no ports, no containers, no state. maxParallelThreads:1 is
          # per-process and is unaffected.
          csproj="${entry%%#*}"
          partspec="${entry#*#}"
          if [ "$partspec" = "$entry" ]; then part=1; parts=1; else
            part="${partspec%%/*}"; parts="${partspec##*/}"
          fi
          name=$(basename "$csproj" .csproj)
          label="$name"
          [ "$parts" -gt 1 ] && label="$name (part $part/$parts)"
          dir=$(dirname "$csproj")/bin/Release/net10.0
          # Helper projects (TestDomain, Hub.Fixture, AI.Test.FakeCli) ship no
          # xunit.v3 host — nothing to run. Recorded so the log shows they were
          # consciously skipped, not lost.
          # 🚨 Distinguish the two "nothing to run" cases. A missing bin TREE means this
          # shard's artifact never carried the project (packaging or assignment
          # mismatch) — reporting exit=0 there would let a shard read GREEN having run
          # nothing. Only a present bin with no xunit host is a genuine helper project.
          if [ ! -d "$(dirname "$csproj")/bin" ]; then
            echo "::error::$name: bin tree absent — this shard's artifact did not contain it (build/test shard-assign mismatch)."
            echo "[CI] $name exit=97 MISSING_BIN (artifact did not contain this project)" >> test/test-results.log
            continue
          fi
          if [ ! -f "$dir/$name.dll" ] || [ ! -f "$dir/xunit.v3.core.dll" ]; then
            echo "[CI] $name exit=0 (helper project — no xUnit v3 test host)" >> test/test-results.log
            continue
          fi
          echo "::group::$name"
          # `timeout 8m`: per-project wall-clock cap — the hang backstop (a
          # fixture-init or between-class hang has no in-process watchdog).
          # Sized to the slowest legitimate project + headroom: AI.Test measures
          # ~190 s locally post-fix (was 460 s before the hidden-failure +
          # LookupCompilationError-timeout fixes), ≈5.5 min at the observed
          # ~1.7× CI/local ratio. A kill here surfaces as exit=124/137 and
          # fails the shard via the marker gate — never silently (under the old
          # trx-only gate, AI.Test was killed at the cap and read GREEN on
          # every run).
          # CWD = the project's bin dir, exactly like `dotnet test` ran the
          # host: appsettings.json + xunit.runner.json + TestData resolve there.
          mkdir -p "$dir/TestResults"
          # For a split project, enumerate the assembly's classes and take every Nth from
          # the SORTED list. Deterministic, and self-maintaining: a newly added test class
          # is distributed automatically without anyone editing the weight table.
          classargs=()
          trxname="$name"
          if [ "$parts" -gt 1 ]; then
            mapfile -t allclasses < <( cd "$dir" && dotnet "$name.dll" -list classes 2>/dev/null \
              | grep -E "^[A-Za-z_][A-Za-z0-9_.]*$" | sort )
            if [ "${#allclasses[@]}" -eq 0 ]; then
              echo "::error::$label: could not enumerate test classes — refusing to run a partial shard silently."
              echo "[CI] $name exit=96 NO_CLASSES (class enumeration failed for a split project)" >> test/test-results.log
              continue
            fi
            for ((ci=part-1; ci<${#allclasses[@]}; ci+=parts)); do
              classargs+=(-class "${allclasses[$ci]}")
            done
            trxname="$name.part$part"
            echo "$label: ${#classargs[@]} of ${#allclasses[@]} classes"
          fi
          ( cd "$dir" && timeout --signal=TERM --kill-after=30s 8m \
              dotnet "$name.dll" -trx "TestResults/$trxname.trx" "${classargs[@]}" )
          rc=$?
          # ── Classify the host's exit code ─────────────────────────────────
          # 🚨 xUnit v3's native host returns THE COUNT OF FAILING TESTS as its
          # exit code. So an ordinary "one assertion failed" run exits 1 — which
          # the old two-branch classifier lumped in with genuine crashes and the
          # downstream gates then announced as "a test host exited non-zero
          # (failure, crash, or timeout kill)". #1242 was filed on exactly that
          # phrasing: nine shard steps read as dying hosts when every one was a
          # plain, single, named assertion failure from a host that ran to
          # completion and printed its summary.
          #
          # The trx is the discriminator. Compare rc against the number of
          # Failed results the host actually recorded:
          #   rc == trx-failed-count  → plain test failures (the common case)
          #   rc != trx-failed-count  → the host exited for a reason the trx
          #                             cannot explain: it crashed AFTER
          #                             streaming green results, or died before
          #                             writing its results at all. THAT is the
          #                             case the exit-marker gate exists for.
          # Signal deaths and wall-clock kills are named outright, since their
          # codes are fixed and can never be a failure count in practice.
          trxfile="$dir/TestResults/$trxname.trx"
          trxfails=0
          if [ -f "$trxfile" ]; then
            trxfails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"' "$trxfile" | wc -l | tr -d ' ')
          fi
          case "$rc" in
            0)
              marker="[CI] $name exit=0" ;;
            124|137)
              marker="[CI] $label exit=$rc TIMEOUT (8m wall-clock cap hit — likely fixture/init hang)" ;;
            132) marker="[CI] $label exit=$rc SIGNAL SIGILL (host died on a signal, not an assertion)" ;;
            134) marker="[CI] $label exit=$rc SIGNAL SIGABRT (host died on a signal, not an assertion)" ;;
            135) marker="[CI] $label exit=$rc SIGNAL SIGBUS (host died on a signal, not an assertion)" ;;
            139) marker="[CI] $label exit=$rc SIGNAL SIGSEGV (host died on a signal, not an assertion)" ;;
            *)
              if [ "$rc" = "$trxfails" ]; then
                marker="[CI] $name exit=$rc TESTFAIL ($trxfails failing test(s) recorded in trx — xunit v3 exits with the failure count; the host completed normally)"
              elif [ ! -f "$trxfile" ]; then
                marker="[CI] $label exit=$rc MASKED (no trx written — the host died before recording any result)"
              else
                marker="[CI] $label exit=$rc MASKED (trx records $trxfails failing test(s), which does not explain exit=$rc — host crashed after streaming results)"
              fi ;;
          esac
          echo "$marker"
          echo "$marker" >> test/test-results.log
          echo "::endgroup::"
        done
        exit 0
    - name: Collect test logs for artifact
      if: always()
      run: |
        mkdir -p collected-logs
        # ── Symbols for any host that died on a SIGNAL ──────────────────────────
        # A core dump without symbols answers "it segfaulted" and almost nothing
        # else: gdb/lldb cannot name a single frame, so the fault site stays
        # unknown and every hypothesis stays unfalsifiable. That is exactly where
        # the 2026-08-04 FutuRe SIGSEGV investigation ran out of road — the dump
        # was collected, but nothing to symbolise it against.
        #
        # Only for projects whose marker shows a signal death (exit=13x), because
        # a test bin is ~100-800 MB and we must not pay that on every green run.
        # dll + pdb only (no runtimeconfig/deps/content) keeps it to the managed
        # symbols a stack walk actually needs. Also record the runtime patch the
        # dump was produced by — the matching DAC is what makes SOS work at all.
        while read -r sigproj; do
          [ -z "$sigproj" ] && continue
          bindir=$(find test -type d -path "*/$sigproj/bin/Release/net10.0" | head -1)
          [ -z "$bindir" ] && continue
          echo "Collecting symbols for signal-killed $sigproj from $bindir"
          mkdir -p "collected-logs/symbols-$sigproj"
          find "$bindir" -maxdepth 1 \( -name '*.dll' -o -name '*.pdb' \) \
            -exec cp {} "collected-logs/symbols-$sigproj/" \; 2>/dev/null || true
          dotnet --list-runtimes > "collected-logs/symbols-$sigproj/_runtimes.txt" 2>/dev/null || true
        done < <(grep -oE '\[CI\] [A-Za-z0-9._]+ exit=13[0-9]' test/test-results.log 2>/dev/null \
                 | awk '{print $2}' | sort -u)
        # Find all test-logs directories and collect their contents without renaming
        find . -path "*/bin/*/test-logs/*.log" -type f -exec cp {} collected-logs/ \; 2>/dev/null || true
        # The MonolithMeshTestBase phase trace + dispose trace live in the
        # process tempdir (Path.GetTempPath() == /tmp on the runner). They
        # carry the per-class INIT_MEM / DISPOSE_MEM lines that pinpoint
        # which test class drives a shard's memory growth. Copy with rename so
        # they don't collide.
        if [ -f /tmp/meshweaver-test-trace.log ]; then
          cp /tmp/meshweaver-test-trace.log collected-logs/_meshweaver-test-trace.log
        fi
        # Per-class INIT → DISPOSE memory delta summary (one line per test instance):
        # managed=… rss=… rssAnon=… unmanaged=… shared=0|1
        # rssAnon (Linux only) is where the Autofac Reflection.Emit factory pin lives;
        # unmanaged = rss − managed is the portable approximation. Grep this file to
        # find the worst leakers without wading through the full per-event trace.
        if [ -f /tmp/meshweaver-memory-delta.log ]; then
          cp /tmp/meshweaver-memory-delta.log collected-logs/_meshweaver-memory-delta.log
        fi
        # Native-crash mini dumps (DOTNET_DbgEnableMiniDump) — present only when a
        # test host died on a signal; the exit-marker gate reds the shard, this is
        # the forensic payload.
        if compgen -G '/tmp/coredumps/*.dmp' > /dev/null; then
          cp /tmp/coredumps/*.dmp collected-logs/
        fi
    - name: "Upload artifact: shard test results"
      uses: actions/upload-artifact@v7
      if: always()
      with:
        # Unique per shard so the parallel matrix legs don't clobber each
        # other; collect-results downloads them all by the testResults-shard* glob.
        name: testResults-shard${{ matrix.shard }}
        path: |
          test/**/*.trx
          test/test-results.log
          collected-logs/
        compression-level: 9
        retention-days: 15
    # ── Per-shard surfacing: publish THIS shard's results as soon as it
    #    finishes, so you don't wait for the slowest sibling + the collector to
    #    see shard 0's outcome. The collect-results job re-consolidates all
    #    shards into one check at the end.
    - name: Summarize test failures (this shard)
      if: always()
      run: |
        echo "### Failed tests — shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
        any=0
        for trx in $(find test -name '*.trx' 2>/dev/null | sort); do
          fails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"[^>]*>' "$trx" \
                  | grep -oE 'testName="[^"]*"' \
                  | sed -E 's/testName="([^"]*)"/\1/' | sort -u)
          if [ -n "$fails" ]; then
            any=1
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "::error title=Test failed (shard ${{ matrix.shard }})::$t"
              echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$fails"
          fi
        done
        if [ "$any" = "0" ]; then
          echo "_No failed tests in trx for shard ${{ matrix.shard }} (a crashed/killed host fails via the exit-marker gate below)._" >> "$GITHUB_STEP_SUMMARY"
        else
          # 🚨 GATE (TRX-based, reporter-independent): fail the shard on any test
          # failure recorded in the trx. The Publish step below is a best-effort
          # reporter whose GitHub-API call can be rate-limited (429 when shards
          # publish concurrently); a throttled reporter must NEVER be the pass/fail
          # gate. This trx grep + the exit-marker gate below own the gate.
          echo "::error::Shard ${{ matrix.shard }}: failing tests in trx — failing the shard."
          exit 1
        fi
    - name: Publish Test Results (this shard)
      uses: EnricoMi/publish-unit-test-result-action@v2.24.0
      if: always()
      # Best-effort reporter ONLY — the TRX-summarize step above is the gate.
      # action_fail removed + continue-on-error so a GitHub-API 429 (concurrent
      # shard publishes) can't fail the build; test failures fail via the trx gate.
      continue-on-error: true
      with:
        # Per-shard check so the matrix legs don't clobber each other's
        # check-run; distinct from the collector's "Test Results" check.
        check_name: "Test Results (shard ${{ matrix.shard }})"
        files: |
          test/**/*.trx
    - name: Fail on non-zero project exit (this shard)
      # A test host that ABORTS mid-run (SIGABRT/FailFast → exit 134) streams
      # green results for every COMPLETED test and then dies: the trx shows zero
      # failures while in-flight + not-yet-run tests silently VANISH from the
      # count. Same for an 8m wall-clock kill (124/137) and for xunit
      # catastrophic failures that exit 1 with an all-green trx. The
      # per-project exit markers are the only faithful record — gate on them.
      # Each marker is already CLASSIFIED (TESTFAIL / TIMEOUT / SIGNAL / MASKED)
      # by the run step, so the marker text says which of those actually
      # happened — do not re-editorialise it here.
      # Last step so the artifact upload + per-shard publish above already ran.
      if: always()
      run: |
        bad=$(grep -E 'exit=[1-9]' test/test-results.log || true)
        if [ -n "$bad" ]; then
          echo "::error::Shard ${{ matrix.shard }}: a test host exited non-zero — see the classification on each marker below (TESTFAIL = ordinary failing tests, TIMEOUT/SIGNAL/MASKED = the host itself died):"
          echo "$bad"
          exit 1
        fi

  # ──────────────────────── COLLECT RESULTS ────────────────────────
  # Single fan-in: pull every shard's results and produce ONE consolidated
  # "Test Results" check plus a combined step summary. This job is the run's
  # pass/fail gate for tests + crashed hosts. (A shard job that infra-fails reds
  # the run on its own — GitHub's run conclusion is failure if ANY job fails,
  # regardless of this always() collector's own conclusion.)
  # ── Cross-repo API gate: do the PLUGINS still compile against THIS PR's framework? ──
  #
  # 🚨 The bug class this exists for: plugin node source is Roslyn-compiled AT RUNTIME against
  # this assembly, from a DIFFERENT REPO. So deleting a public member here is invisible to every
  # check we had — a repo-local grep says "no callers", and the plugins repo's own CI compiles
  # against a PUBLISHED image (MW_TEST_IMAGE, refreshed only by main-cd), so it keeps passing
  # until that tag is rebuilt. Both repos stay green, the break lands in whatever deployment
  # builds from source first, and the plugins repo then goes red REPO-WIDE for a change it never
  # made. That is exactly how AiSettingsNodeType.AddSkillSource was deleted with a live caller in
  # Store/Plugin/Source/Localizer.cs: Store failed to compile, and since nearly every module
  # depends on Store, every plugin root node fell back to an untyped overlay — after burning a
  # 60s settle timeout PER PACKAGE.
  #
  # The gate runs the SAME tester the plugins repo runs (tools/MeshWeaver.PluginTester, shipped
  # in the platform image as mw-plugin-test) — import each node repo into a fresh in-process
  # mesh, assert every NodeType reaches CompilationStatus.Ok, renders, and its `Tests` area runs
  # green — but against the framework THIS PR just built, not a published tag. It reuses shard
  # 0's build output, so it costs a download and the tester run, not a rebuild.
  plugin-gate:
    name: "Plugins compile against this PR"
    # `preflight` is what guarantees the credential exists, so nothing in this job needs to
    # check for it. If preflight fails, this job skips — and `collect-results` turns that skip
    # into a RED required check (see its "Fail if a required CI input is missing" step).
    needs: [preflight, build]
    # The ONE legitimate reason this gate does not run: a fork PR has no access to the private
    # plugins repo (nor to any org secret). A fork cannot break the private repo's consumers in
    # a way this run could prove either way. Expressed as a FORK check — never as a
    # "is the credential set?" check, which is the same shape with none of the safety.
    if: needs.build.result == 'success' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # ⏱️ WALL-CLOCK: this job depends on `build` — the SAME dependency the test shards have — so it
    # runs CONCURRENTLY with them, not after. Total run time is max(slowest shard, this), so while
    # the gate stays under a shard it costs the PR nothing. That is why it is scoped to two modules
    # and reuses shard 0's artifact instead of rebuilding: both choices exist to keep it under that
    # bar. The timeout is deliberately well below the shard job's 20 min — if the gate ever becomes
    # the long pole it should fail and be re-scoped, not silently stretch every PR.
    timeout-minutes: 12
    # The failing CHECK and the node(s) it failed on, lifted verbatim from the tester's verdict
    # line, so the required check downstream can name the real cause instead of guessing one.
    # Empty whenever the gate died before producing a verdict (checkout fault, missing tester) —
    # consumers must degrade to "see the job", never to an invented cause.
    outputs:
      failure: ${{ steps.gate.outputs.failure }}
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: "Download artifact: build output (shard 0)"
      uses: actions/download-artifact@v8
      with:
        name: build-output-0
    - name: Extract build output
      run: |
        set -euo pipefail
        tar -I 'zstd --long=27' -xf build-output-0.tar.zst
        rm -f build-output-0.tar.zst
    # 🚨 NO `continue-on-error` HERE, EVER. This job only runs on a non-fork (see the job `if`),
    # and `preflight` has already proven the deploy key is present — so on this path the checkout
    # succeeding is a PRECONDITION, not a hope. A failure now means the key was revoked, replaced,
    # or lost its access: a CONFIGURATION FAULT, and configuration faults must be loud. The shape
    # this replaces (`continue-on-error` + `if: steps.plugins.outcome == 'success'` on the compile,
    # plus an "is the credential set?" probe) turned every such fault into a GREEN job that tested
    # nothing — and it did, on every run, from the day the gate was added until the key was
    # provisioned. See the preflight job for the full account.
    #
    # 🚨 A READ-ONLY DEPLOY KEY, deliberately — not a PAT and not the org's GitHub App.
    # This gate needs exactly one capability: read Systemorph/MeshWeaver.Plugins. A deploy key
    # grants precisely that and nothing else, so a secret readable by every workflow run in this
    # repo cannot be turned into anything wider. The alternatives were both worse:
    #   • a fine-grained PAT is minimal too, but it is minted against a PERSON, inherits their
    #     account's lifecycle, and EXPIRES — a gate that silently disarms when someone's token
    #     lapses is the failure shape this whole job exists to prevent;
    #   • the org's `meshweaver-cloud` App is installed on ALL repos with write scopes (it drives
    #     self-update and the issues/PR/webhook integrations), so putting its private key here
    #     would let any workflow — including one added by a PR — mint org-wide write tokens.
    # Rotate/revoke by deleting the key on the plugins repo (Settings → Deploy keys) and
    # replacing PLUGINS_REPO_SSH_KEY here; nothing else depends on it.
    - name: Check out MeshWeaver.Plugins
      uses: actions/checkout@v7
      with:
        repository: Systemorph/MeshWeaver.Plugins
        ref: main
        path: plugins-repo
        ssh-key: ${{ secrets.PLUGINS_REPO_SSH_KEY }}
        fetch-depth: 1
    - name: "Compile + run the VITAL plugins against this PR"
      id: gate
      env:
        # 🚨 The vital organs only — NOT the whole repo. This gate sits in the PR critical path,
        # so it buys the most breakage-detection per minute rather than maximum coverage:
        #   Store      — EVERY plugin declares `requires: Store` and compiles against
        #                Store/Plugin/Source (`shared=@Store/Plugin/Source`). If Store's types
        #                break, every plugin root node in the mesh falls back to an untyped
        #                overlay. It is the single choke point through which a framework API
        #                change reaches all of them.
        #   Essentials — the default skills and agents every installation gets.
        # The full-repo sweep still runs in the PLUGINS repo's own CI (which narrows by affected
        # module) and on main-cd's refreshed mw-plugin-test image. Widen this list only if a
        # module turns out to be a second choke point; each addition costs PR wall-clock.
        VITAL_MODULES: "Store Essentials"
      run: |
        set -euo pipefail
        TESTER="$(find . -path '*/MeshWeaver.PluginTester/bin/*/mw-plugin-test.dll' | head -1)"
        if [ -z "$TESTER" ]; then
          echo "::error::mw-plugin-test.dll not in the build output — the gate cannot run."
          exit 1
        fi
        # The tester gates every package it DISCOVERS under the root, so the staged tree IS the
        # filter — the same mechanism the plugins repo uses to narrow to affected modules.
        STAGE="${RUNNER_TEMP:-/tmp}/vital"
        mkdir -p "$STAGE"
        for m in $VITAL_MODULES; do
          if [ ! -d "$GITHUB_WORKSPACE/plugins-repo/$m" ]; then
            echo "::error::vital module '$m' is not in the plugins checkout — the gate would silently test less than it claims."
            exit 1
          fi
          cp -R "$GITHUB_WORKSPACE/plugins-repo/$m" "$STAGE/"
        done
        cp "$GITHUB_WORKSPACE/plugins-repo/plugin-gate.allow" "$STAGE/" 2>/dev/null || true
        echo "gating: $VITAL_MODULES"
        # plugin-gate.allow is the plugins repo's known-debt ratchet: listed failures are
        # tolerated, NEW failures fail this PR. Same one-way contract the plugins CI uses, so the
        # two gates cannot disagree about what is acceptable.
        #
        # 🚨 The run is TEED, not swallowed: the log still streams to the job, and the copy is read
        # afterwards for the tester's verdict line. `if !` (not `set +e`) so `set -e` stays armed
        # for everything else, and PIPESTATUS[0] is the TESTER's code — tee always exits 0.
        log="${RUNNER_TEMP:-/tmp}/plugin-gate.log"
        status=0
        if ! time dotnet "$TESTER" "$STAGE" --allow "$STAGE/plugin-gate.allow" 2>&1 | tee "$log"; then
          status="${PIPESTATUS[0]}"
          # tee always exits 0, so a non-zero pipeline with a zero head means tee itself failed.
          if [ "$status" = "0" ]; then status=1; fi
        fi
        # The tester's verdict line IS the message — `GATE FAILED — tests: Store/Catalog — 1 new
        # failure(s), …` (GateReport.FailedPrefix). Lifted verbatim: nothing here re-derives or
        # re-words a cause, which is exactly how this job came to annotate a `tests` failure as
        # "does not compile — a public API changed" and send investigators to diff public
        # signatures that were fine (#1077).
        verdict="$(grep -m1 -- '^GATE FAILED' "$log" || true)"
        # Multi-line-safe even though the verdict is one line: a bare KEY=VALUE with an unexpected
        # newline would corrupt every later output in the file.
        {
          echo "failure<<GATE_EOF"
          echo "$verdict"
          echo "GATE_EOF"
        } >> "$GITHUB_OUTPUT"
        if [ "$status" != "0" ]; then
          if [ -n "$verdict" ]; then
            echo "::error::$verdict"
          else
            # No verdict = the gate died before judging anything (missing tester, install fault,
            # crash). Say THAT — an unexplained failure is cheaper than a wrong explanation.
            echo "::error::The plugins gate failed before it produced a verdict — no check was judged. See this job's log."
          fi
          exit "$status"
        fi

  # ────────────────────────── CLIENTS GATE ──────────────────────────
  # Folds the `Clients` workflow's verdict into the repo's ONE required status check (#1568).
  #
  # 🚨 WHY THIS EXISTS. On 2026-08-14 PR #1555 merged with the ENTIRE Clients workflow red —
  # all seven jobs, including `Portal-next (typecheck + test + build)`. Nothing blocked it,
  # because `Consolidate test results` is the only required check and it is green independently
  # of Clients. The consequence was not confined to the clients: `main-cd`'s portal-next leg
  # runs the very same `npm run build`, it died in ~1.1 s on every CD run afterwards, and
  # `promote` is all-or-nothing — so CD published NOTHING for ~1 h. Every self-updating install
  # stayed on the old image and a production 42P18 fix was stranded. The signal existed and was
  # advisory; a workflow whose failure can stop image publication has to be a merge gate.
  #
  # 🚨 WHY NOT SIMPLY MARK `Clients` REQUIRED. It is path-filtered (clients/** plus the
  # cross-tree inputs its guards read), so on a server-only PR it never runs — and a required
  # check that is legitimately skipped blocks merges FOREVER. That is exactly why this repo
  # keeps `Build solution (once)` and the shards out of the required set. So the gate is this
  # always-runs job, which REPORTS the filtered workflow's result.
  #
  # 🚨 "Clients did not run" is a fact about the DIFF, not missing evidence. Zero runs means the
  # path filter did not match, i.e. this PR changes none of the inputs those jobs read — the
  # clients tree under test is byte-identical to the base's. That is categorically different
  # from the skip-trapdoor AGENTS.md rules out (an `if:` asking whether a SECRET is set, where
  # "the gate never ran" and "the gate passed" become indistinguishable). This job always runs,
  # always reports, and never tests its own inputs.
  clients-gate:
    name: "Clients workflow verdict"
    runs-on: ubuntu-latest
    # Generous relative to the Clients workflow's own wall-clock (its long pole is the
    # Playwright job at a few minutes) and well under the .NET suite's ~22 min, so this never
    # becomes the critical path. Hitting it means Clients is WEDGED — which must be red, not
    # waited out.
    timeout-minutes: 25
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
    - name: "Resolve the Clients workflow's conclusion for this commit"
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        # On a pull_request run, github.sha is the merge commit — the Clients workflow runs on
        # the PR's HEAD, so that is the sha its runs are keyed by.
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -uo pipefail
        api="repos/${{ github.repository }}/actions/workflows/clients.yml/runs?head_sha=${HEAD_SHA}&per_page=100"
        # 🚨 "Zero runs" is only meaningful once GitHub has had time to CREATE the run. Both
        # workflows fire on the same event, so an immediate zero would be a race, and reading
        # it as "the path filter did not match" would silently re-open the very hole this gate
        # closes. So a zero is only believed after this grace period of consecutive zeros.
        ZERO_GRACE_SECONDS=180
        started=$(date +%s)
        # Poll: Clients starts on the same event and normally finishes long before the .NET
        # suite, but the two are not ordered.
        for _ in $(seq 1 60); do
          json=$(gh api "$api" 2>/dev/null || echo '{"total_count":0,"workflow_runs":[]}')
          total=$(echo "$json" | jq -r '.total_count // 0')
          if [ "$total" = "0" ] && [ $(( $(date +%s) - started )) -lt "$ZERO_GRACE_SECONDS" ]; then
            echo "No Clients run for ${HEAD_SHA} yet — within the ${ZERO_GRACE_SECONDS}s creation grace period, waiting."
            sleep 20
            continue
          fi
          if [ "$total" = "0" ]; then
            echo "verdict=not-applicable" >> "$GITHUB_OUTPUT"
            echo "The Clients workflow did not run for ${HEAD_SHA}: this diff touches none of its path filters, so the client tree under test is unchanged from the base."
            {
              echo "### ➖ Clients: not applicable"
              echo
              echo "No \`Clients\` run for \`${HEAD_SHA}\` — this PR changes none of the paths that workflow watches."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Newest run for this sha (a re-run adds another).
          status=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .status')
          conclusion=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .conclusion // ""')
          url=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .html_url')
          if [ "$status" = "completed" ]; then
            echo "Clients run concluded: ${conclusion} (${url})"
            echo "verdict=${conclusion}" >> "$GITHUB_OUTPUT"
            if [ "$conclusion" = "success" ] || [ "$conclusion" = "skipped" ]; then
              {
                echo "### ✅ Clients: ${conclusion}"
                echo
                echo "[Clients run](${url})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::The Clients workflow concluded '${conclusion}' for this commit — see ${url}. Its Portal-next job builds the same tree main-cd's portal-next image leg builds, and CD's promote is all-or-nothing: merging this red stops ALL image publication."
            {
              echo "### ❌ Clients: ${conclusion}"
              echo
              echo "[Clients run](${url}) failed. \`main-cd\`'s portal-next leg runs the same build, and"
              echo "\`promote\` publishes only when every leg succeeds — so merging this stops image"
              echo "publication for the whole repo, not just the clients."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sleep 20
        done
        echo "::error::The Clients workflow for ${HEAD_SHA} has not completed within this job's budget — it is wedged. Refusing to report a verdict on an unfinished run."
        exit 1

  doc-gate:
    name: "Doc content compiles and runs"
    # Unlike plugin-gate this needs no credential and no fork guard: the content under test IS
    # this repo's own src/MeshWeaver.Documentation/Data, checked out with the PR. The job exists
    # because that content is Roslyn-compiled at RUNTIME in the portal and invisible to
    # `dotnet build` (the csproj embeds Data/** and explicitly removes its .cs from compilation)
    # — without this job, the doc tree's node sources and NodeType configuration lambdas ship
    # untested, and two of the four Doc NodeTypes had never been compiled by anything.
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Same wall-clock contract as plugin-gate: depends on `build` like the shards, so it runs
    # CONCURRENTLY with them; while it stays under the slowest shard it costs the PR nothing.
    timeout-minutes: 12
    outputs:
      failure: ${{ steps.gate.outputs.failure }}
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: "Download artifact: build output (shard 0)"
      uses: actions/download-artifact@v8
      with:
        name: build-output-0
    - name: Extract build output
      run: |
        set -euo pipefail
        tar -I 'zstd --long=27' -xf build-output-0.tar.zst
        rm -f build-output-0.tar.zst
    - name: "Compile + run the Doc content against this PR"
      id: gate
      run: |
        set -euo pipefail
        TESTER="$(find . -path '*/MeshWeaver.PluginTester/bin/*/mw-plugin-test.dll' | head -1)"
        if [ -z "$TESTER" ]; then
          echo "::error::mw-plugin-test.dll not in the build output — the doc gate cannot run."
          exit 1
        fi
        # Stage src/MeshWeaver.Documentation/Data as a package root named Doc/. The tree has no
        # index.json of its own (index.md is the partition's root PAGE, and committing a JSON
        # root would ship a duplicate root node in the embedded partition), so the root is
        # synthesized here and index.md is dropped from the STAGE only — shipped content is
        # untouched. NodeFileMapper then maps Doc/DataMesh/SocialMedia/Post.json et al. to the
        # exact namespaces the files themselves declare, so the gate compiles the tree under
        # its canonical paths.
        STAGE="${RUNNER_TEMP:-/tmp}/doc"
        mkdir -p "$STAGE/Doc"
        cp -R src/MeshWeaver.Documentation/Data/. "$STAGE/Doc/"
        rm -f "$STAGE/Doc/index.md"
        printf '%s' '{"$type":"MeshNode","id":"Doc","path":"Doc","mainNode":"Doc","name":"MeshWeaver Documentation","nodeType":"Space","state":"Active"}' > "$STAGE/Doc/index.json"
        # .github/doc-gate.allow is THIS repo's known-debt ratchet for doc content: listed
        # failures are tolerated, NEW failures fail the PR, and a listed check that starts
        # passing fails the PR until its line is removed — the list can only shrink.
        log="${RUNNER_TEMP:-/tmp}/doc-gate.log"
        status=0
        if ! time dotnet "$TESTER" "$STAGE" --allow .github/doc-gate.allow 2>&1 | tee "$log"; then
          status="${PIPESTATUS[0]}"
          # tee always exits 0, so a non-zero pipeline with a zero head means tee itself failed.
          if [ "$status" = "0" ]; then status=1; fi
        fi
        verdict="$(grep -m1 -- '^GATE FAILED' "$log" || true)"
        # ── Second stage: the samples trees — the "12k lines of C# no build ever type-checks"
        # from AGENTS.md. Same tester, same mechanics; .github/samples-gate.allow is its own
        # one-way debt ratchet (seeded with the 8 cross-NodeType source defects the first run
        # surfaced — a listed entry that starts passing fails the run until removed).
        SSTAGE="${RUNNER_TEMP:-/tmp}/samples"
        bash .github/scripts/stage-samples-gate.sh samples/Graph/Data "$SSTAGE"
        slog="${RUNNER_TEMP:-/tmp}/samples-gate.log"
        sstatus=0
        if ! time dotnet "$TESTER" "$SSTAGE" --allow .github/samples-gate.allow 2>&1 | tee "$slog"; then
          sstatus="${PIPESTATUS[0]}"
          if [ "$sstatus" = "0" ]; then sstatus=1; fi
        fi
        sverdict="$(grep -m1 -- '^GATE FAILED' "$slog" || true)"
        combined="$(printf '%s\n%s' "$verdict" "$sverdict" | grep . | head -1 || true)"
        {
          echo "failure<<GATE_EOF"
          echo "$combined"
          echo "GATE_EOF"
        } >> "$GITHUB_OUTPUT"
        if [ "$status" != "0" ] || [ "$sstatus" != "0" ]; then
          [ -n "$verdict" ] && echo "::error::Doc stage: $verdict"
          [ -n "$sverdict" ] && echo "::error::Samples stage: $sverdict"
          if [ -z "$combined" ]; then
            echo "::error::The content gate failed before it produced a verdict — no check was judged. See this job's log."
          fi
          exit 1
        fi

  licence-gate:
    name: "Dependency licences"
    # MeshWeaver ships dual-licensed Apache-2.0 / MIT. A copyleft (AGPL/GPL/LGPL) or
    # pay-to-use dependency is a licensing DEFECT — and it is invisible to every other
    # check we run: one `<PackageVersion>` line adds it, the compiler is happy, and the
    # tests are happy. #1230 (QuestPDF, pay-to-use above a revenue threshold) and a dead
    # AGPL `itext7` declaration both sat in the tree unnoticed until a manual audit.
    #
    # 🚨 NO `continue-on-error`, and NO input-shaped `if:`. This gate reads only the repo
    # and the public NuGet feed — it needs no secret, so it has no legitimate reason to be
    # skipped and no fork exemption. It runs on every PR including forks.
    needs: [precheck]
    # Mirrors `build`: the ONLY thing that skips this is the already-green-tree
    # optimisation, which means this exact tree already passed this exact gate.
    if: ${{ !cancelled() && needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # ⏱️ Depends only on `precheck`, so it runs CONCURRENTLY with the build and the test
    # shards and costs the PR no wall-clock. It restores (not builds) the solution, which
    # is what produces the project.assets.json graph it reads.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # The gate resolves licences from the RESTORED graph — direct and transitive — because a
    # copyleft dependency that arrives transitively binds us exactly as hard as a declared one.
    # No `continue-on-error`: if the restore fails, the gate has no evidence, and a gate that
    # passes on absent evidence is worse than no gate (the script fails closed on this too).
    # Same invocation as the `build` job's restore step, so the graph this gate reads is the
    # same graph CI actually builds and ships.
    - name: Restore (produces the dependency graph the gate reads)
      run: dotnet restore
    - name: Check dependency licences
      run: python3 .github/scripts/check-licenses.py --report

  collect-results:
    name: "Consolidate test results"
    # plugin-gate is a NEEDS so this required check cannot go green while the plugins are
    # broken by this PR — that is the whole point of the gate (see its step below). preflight
    # is a NEEDS for the same reason one level up: this job is the repo's ONLY required status
    # check, so anything that must block a merge has to be able to fail it. licence-gate is a
    # NEEDS on the same principle: a licensing defect must be able to block a merge.
    # clients-gate is a NEEDS on the same principle as plugin-gate/doc-gate/licence-gate: a red
    # Clients workflow can stop ALL image publication (#1568), so it must be able to fail the
    # repo's only required status check.
    needs: [precheck, preflight, build, test, plugin-gate, doc-gate, licence-gate, clients-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
    # Needed for the marker push/prune steps below: gives us a git repo whose
    # `origin` carries the run's credentials, and puts github.sha's object in it.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    # ── Reuse path: build+test skipped because the tree is already green ──
    # This job still runs (and succeeds), so it is the stable required check and
    # it keeps the run's conclusion `success` for main-cd's workflow_run gate.
    - name: "Reused: tree already green"
      if: needs.precheck.outputs.skip == 'true'
      env:
        MARKER_RUN: ${{ needs.precheck.outputs.marker_run }}
      run: |
        echo "Tree ${{ needs.precheck.outputs.tree }} was already tested green (${{ needs.precheck.outputs.marker }}) — build + test skipped."
        # 🚨 #1491: state WHOSE evidence this green is. A reused green is sound about the
        # bytes and silent about the run — and that silence is what made a red land on an
        # unrelated PR's commit with a bisect window that excluded the real cause.
        if [ -n "${MARKER_RUN:-}" ]; then
          echo "Evidence gathered by run ${MARKER_RUN} — THIS run executed no tests."
          provenance="[run ${MARKER_RUN}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${MARKER_RUN})"
        else
          provenance="_unrecorded (marker predates provenance recording)_"
        fi
        {
          echo "### ✅ Test suite reused"
          echo
          echo "Tree \`${{ needs.precheck.outputs.tree }}\` was already tested green — build and test were skipped."
          echo "Marker: \`${{ needs.precheck.outputs.marker }}\`"
          echo "Evidence gathered by: ${provenance}"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Download all shard results
      if: needs.precheck.outputs.skip != 'true'
      uses: actions/download-artifact@v8
      with:
        # No merge-multiple: keep each shard under its own dir so same-named
        # files (test-results.log) from different shards don't overwrite.
        pattern: testResults-shard*
        path: all-results
    - name: Summarize test failures
      # Parse every shard's trx and echo each failed test as an ::error::
      # annotation + into the job step summary, so failing tests are visible
      # directly on THIS job without opening the published check.
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        echo "### Failed tests (all shards)" >> "$GITHUB_STEP_SUMMARY"
        any=0
        for trx in $(find all-results -name '*.trx' 2>/dev/null | sort); do
          # testName on each UnitTestResult element whose outcome is Failed.
          fails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"[^>]*>' "$trx" \
                  | grep -oE 'testName="[^"]*"' \
                  | sed -E 's/testName="([^"]*)"/\1/' | sort -u)
          if [ -n "$fails" ]; then
            any=1
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "::error title=Test failed::$t"
              echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$fails"
          fi
        done
        # 🚨 EVIDENCE GATE: "no failures" is only green if tests actually RAN. With zero
        # trx anywhere, this step used to exit 0 — so a run in which the probe was
        # starved, build skipped and no shard executed still published a SUCCESSFUL
        # required check. A required check that passes on no evidence is worse than a
        # flaky one: it lets an untested tree merge and ship.
        trx_count=$(find all-results -name '*.trx' 2>/dev/null | wc -l | tr -d ' ')
        if [ "$trx_count" = "0" ]; then
          echo "::error::No test results found in any shard — the suite did not run, so this run proves nothing. Failing (the reuse path is the ONLY sanctioned way to skip tests)."
          {
            echo "### ❌ No test evidence"
            echo
            echo "Zero \`.trx\` files across all shards, and this was not a green-tree reuse."
            echo "The suite did not execute — refusing to report success."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$any" = "0" ]; then
          echo "_No failed tests in ${trx_count} trx file(s) (a crashed/killed host fails via the exit-marker gate below)._" >> "$GITHUB_STEP_SUMMARY"
          echo "No failed tests found in trx across all shards (${trx_count} result files)."
        else
          # 🚨 GATE (TRX-based, reporter-independent): the consolidated run pass/fail
          # gate. Fail on any test failure across shards, independent of the Publish
          # step's GitHub-API health (429-immune).
          echo "::error::Failing tests in trx across shards — failing the run."
          exit 1
        fi
    # 🚨 COVERAGE GATE — "no failures" is not "everything ran" (#1472).
    #
    # On 2026-08-14 a GitHub codeload outage made setup-dotnet's tarball unfetchable and
    # SHARD 0 NEVER RAN. The five surviving shards produced trx with no failures, the
    # evidence gate above saw a non-zero trx count, and `Consolidate test results` — the
    # repo's ONLY required status check — reported SUCCESS. `mergeStateStatus` was merely
    # UNSTABLE, which does not block. A PR could have merged on five sixths of the suite
    # with nothing in the required signal saying so.
    #
    # "The shard produced no results because it never started" and "the shard produced no
    # failures" are DIFFERENT INPUTS, and counting failures cannot tell them apart. So this
    # step counts REPORTERS against the statically-known matrix size instead of inferring
    # coverage from what arrived.
    #
    # 🚨 Two ways to get this wrong, both of which reproduce the defect one level up, and
    # neither of which is used here:
    #   * an `if:` that skips the assertion when a shard artifact is absent — GitHub renders
    #     a skipped job with the same tick as a passed one;
    #   * `continue-on-error` on the step that fetches the shard results.
    # The only condition on this step is the reuse path, which is a RUN MODE (no shard was
    # expected to run at all), not a property of the evidence.
    - name: "Every shard must have reported"
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        set -uo pipefail
        expected="${CI_SHARD_TOTAL}"
        # download-artifact keeps each artifact under its own directory (no merge-multiple),
        # so one directory == one shard that uploaded results.
        reported=$(find all-results -mindepth 1 -maxdepth 1 -type d -name 'testResults-shard*' 2>/dev/null | wc -l | tr -d ' ')
        echo "Shards reported: ${reported}/${expected}"
        if [ "$reported" -eq "$expected" ]; then
          echo "_All ${expected} shards reported._" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Name the missing ones so the run says WHICH sixth of the suite is unaccounted for.
        missing=()
        for ((i=0; i<expected; i++)); do
          [ -d "all-results/testResults-shard$i" ] || missing+=("$i")
        done
        echo "::error::Only ${reported} of ${expected} shards reported results — shard(s) ${missing[*]} produced nothing. A shard that never ran is an UNVERIFIABLE outcome, not a passing one; refusing to report success on a partially-executed suite."
        {
          echo "### ❌ Incomplete test coverage"
          echo
          echo "Only **${reported} of ${expected}** shards reported results. Missing: \`${missing[*]}\`."
          echo
          echo "A shard that never started produces no failures — which is not the same evidence as"
          echo "a shard that ran and found none. Check the missing shard job(s) for an infrastructure"
          echo "failure (runner/download/setup), then re-run them: an infra failure with the same input"
          echo "is the sanctioned re-run case."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    # Defence in depth for the same defect from the other side: a shard job that FAILED to
    # start, was cancelled, or died before uploading leaves the matrix result non-success.
    # `needs:` alone cannot express that under `if: always()`.
    - name: "Fail if any shard job did not succeed"
      if: always() && needs.precheck.outputs.skip != 'true' && needs.test.result != 'success'
      run: |
        echo "::error::The test matrix concluded '${{ needs.test.result }}' — at least one shard did not succeed. See the shard jobs; this run does not cover the whole suite."
        exit 1

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.24.0
      if: always() && needs.precheck.outputs.skip != 'true'
      # Best-effort reporter ONLY (reporting, not gating) — the TRX-summarize step
      # above is the gate. action_fail removed + continue-on-error so a throttled
      # GitHub-API publish (429) can't fail the run; failures fail via the trx gate.
      continue-on-error: true
      with:
        # One consolidated check across all shards (reporting only now).
        check_name: "Test Results"
        files: |
          all-results/**/*.trx
    - name: Fail on non-zero project exit (all shards)
      # Defense-in-depth re-check of every shard's exit markers (each shard
      # already gates its own). A host that crashed after streaming green
      # results, or was killed at the 8m cap, appears ONLY here — the trx gate
      # above cannot see it (completed tests all read Passed; the rest vanish).
      # Markers carry their classification (TESTFAIL / TIMEOUT / SIGNAL /
      # MASKED); only the non-TESTFAIL ones are hosts that actually died.
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        bad=$(find all-results -name 'test-results.log' -exec cat {} \; \
              | grep -E 'exit=[1-9]' || true)
        if [ -n "$bad" ]; then
          echo "::error::A test host exited non-zero — see the classification on each marker below (TESTFAIL = ordinary failing tests, TIMEOUT/SIGNAL/MASKED = the host died mid-run and only completed results were published):"
          echo "$bad"
          exit 1
        fi

    # ─────────────────── RECORD THE GREEN TREE ────────────────────
    # Only reached when every gate above passed AND every upstream job actually
    # SUCCEEDED. The job-result condition is not redundant with the gates: a shard
    # that infra-fails (runner dies, artifact upload lost) leaves NOTHING for the
    # trx/exit-marker gates to parse, so they pass on the surviving shards' green
    # results. Marking that tree green would let a genuinely untested tree skip
    # its main run.
    - name: "Record green tree"
      if: >-
        needs.precheck.outputs.skip != 'true' &&
        needs.build.result == 'success' &&
        needs.test.result == 'success'
      # Best-effort: a fork PR's read-only GITHUB_TOKEN cannot push the marker.
      # Losing a marker only costs a redundant run — never correctness.
      continue-on-error: true
      run: |
        set -euo pipefail
        tree="${{ needs.precheck.outputs.tree }}"
        # 🚨 The leaf carries PROVENANCE (#1491): `<epoch>-<run_id>`, so a later run that
        # REUSES this marker can name the run that actually gathered the evidence instead of
        # leaving the reader to infer it from a run list that cannot distinguish the two
        # kinds of green. Readers split on the first `-`; a bare `<epoch>` (legacy) still parses.
        ref="refs/ci-green/$tree/$(date +%s)-${{ github.run_id }}"
        # github.sha is this run's commit — the merge commit on a pull_request run,
        # which is exactly the commit whose tree we tested. Marker refs live
        # outside refs/heads and refs/tags: invisible in the branch/tag UI, and
        # they trigger no workflow (a GITHUB_TOKEN push never does anyway).
        git push origin "${{ github.sha }}:$ref"
        echo "Recorded green tree: $ref"
        echo "Green tree recorded: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

    # ── RECORD THE LAST MAIN COMMIT WHOSE TESTS ACTUALLY RAN ──────────────────────────────
    # The other half of #1491. `refs/ci-green` is keyed by TREE, so it can say "these bytes
    # passed" but never "main was verified at this commit" — and the bisect window a human (or
    # an agent) reaches for is `git log <last-green>..<red>`, taken from the run list. On
    # 2026-08-14 that window contained exactly one PR, and it was the wrong one: the preceding
    # main run had REUSED a marker, so main's tip had never been tested as a whole, and the
    # regression came from the change set BEFORE the one the window named.
    #
    # This ref is written only when the suite genuinely executed AND passed on main, so the
    # newest one is, by construction, the last main commit whose tests actually ran.
    - name: "Record executed-and-green main commit"
      if: >-
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.precheck.outputs.skip != 'true' &&
        needs.build.result == 'success' &&
        needs.test.result == 'success'
      # Same rationale as the marker push: losing one costs a less precise bisect hint, never
      # correctness.
      continue-on-error: true
      run: |
        set -euo pipefail
        ref="refs/ci-executed/main/$(date +%s)-${{ github.run_id }}"
        git push origin "${{ github.sha }}:$ref"
        echo "Recorded executed-and-green main commit ${{ github.sha }} at $ref"

    # Keep the marker namespace small. Anything past the prune horizon is long
    # past the TTL — it can never be honoured again, it only slows the ls-remote.
    - name: "Prune stale green markers"
      if: always() && needs.precheck.outputs.skip != 'true'
      continue-on-error: true
      run: |
        set -euo pipefail
        now=$(date +%s)
        refspecs=()
        while read -r _sha ref; do
          [ -z "${ref:-}" ] && continue
          leaf="${ref##*/}"
          # Leaf is `<epoch>` (legacy) or `<epoch>-<run_id>` (#1491) — take the epoch field.
          epoch="${leaf%%-*}"
          case "$epoch" in (*[!0-9]*|'') continue;; esac
          if [ $(( now - epoch )) -gt "${CI_GREEN_PRUNE_SECONDS}" ]; then
            refspecs+=(":$ref")
          fi
        done < <(git ls-remote origin 'refs/ci-green/*' 'refs/ci-executed/*' 2>/dev/null || true)
        if [ "${#refspecs[@]}" -eq 0 ]; then
          echo "No stale markers to prune."
          exit 0
        fi
        echo "Pruning ${#refspecs[@]} stale marker(s)."
        git push origin "${refspecs[@]}"

    # ── The cross-repo gate decides this check too ──────────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough: this job runs with `if: always()`, so a failed dependency
    # does not fail it — it would report success while the plugins are broken, which is precisely
    # the silent-green failure the gate exists to end.
    # 🚨 NAME THE PHASE THAT FAILED — never a guessed cause. The gate judges three checks per node
    # (compile / render / tests) and its verdict line says which one failed on which node; this
    # step relays that line verbatim. The message it replaced asserted ONE cause for all three:
    #
    #     "MeshWeaver.Plugins does not compile against this PR … A public API change here breaks
    #      plugin node source that is Roslyn-compiled at runtime"
    #
    # …which is the most expensive wrong lead available. A public-API break here genuinely DOES
    # break that repo — plugin node source is Roslyn-compiled from mesh content, so a repo-local
    # `rg` can never prove a deletion safe (that is how `AddSkillSource` broke 8 NodeTypes). So the
    # claim reads as authoritative and sends the investigator to diff public signatures. On
    # 2026-08-10 it did exactly that for a `Store/Catalog` verdict of `compile=Ok render=ok
    # tests=FAILED`, on PR #1043 whose whole diff was MessageService.cs plus two test files
    # (issue #1077). Keep the API sentence CONDITIONAL on the phase actually being `compile`.
    - name: Fail if the plugin gate failed
      if: needs.plugin-gate.result == 'failure'
      env:
        # Empty when the gate produced no verdict (it died before judging), and — depending on how
        # GitHub propagates a failed job's outputs — possibly empty even when it did. Both degrade
        # to "see the job", which is true either way.
        GATE_VERDICT: ${{ needs.plugin-gate.outputs.failure }}
      run: |
        set -uo pipefail
        verdict="$(printf '%s' "${GATE_VERDICT}" | head -1)"
        if [ -n "$verdict" ]; then
          echo "::error::The plugins gate failed: ${verdict} — see the 'Plugins compile against this PR' job."
        else
          echo "::error::The plugins gate failed — see the 'Plugins compile against this PR' job for the failing check (compile / render / tests) and the node(s) it failed on."
        fi
        case "$verdict" in
          *compile:*)
            echo "::error::A failing 'compile' check means a public API change here broke plugin node source that is Roslyn-compiled at runtime from the plugins repo."
            ;;
        esac
        exit 1

    # ── …and the doc-content gate decides it too ────────────────────────────────────────────
    # 🚨 Same lesson as the plugin-gate step above: `needs:` alone is NOT enough under
    # `if: always()` — a failed doc-gate must explicitly turn the repo's only required check RED.
    - name: Fail if the doc gate failed
      if: needs.doc-gate.result == 'failure'
      env:
        # Empty when the gate produced no verdict (it died before judging). Degrades to
        # "see the job", which is true either way.
        GATE_VERDICT: ${{ needs.doc-gate.outputs.failure }}
      run: |
        set -uo pipefail
        verdict="$(printf '%s' "${GATE_VERDICT}" | head -1)"
        if [ -n "$verdict" ]; then
          echo "::error::The doc gate failed: ${verdict} — see the 'Doc content compiles and runs' job."
        else
          echo "::error::The doc gate failed — see the 'Doc content compiles and runs' job for the failing check (install / compile / render / tests) and the node(s) it failed on."
        fi
        exit 1

    # ── …and a licensing defect decides it too ──────────────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough under `if: always()` — same lesson as the step above. A
    # dependency licence that is incompatible with shipping under Apache-2.0 / MIT must be able
    # to turn the repo's ONLY required status check RED, or the gate is decorative.
    - name: Fail if the licence gate failed
      if: needs.licence-gate.result == 'failure'
      run: |
        echo "::error::A dependency licence is incompatible with shipping MeshWeaver under Apache-2.0 / MIT — see the 'Dependency licences' job for the offending package(s) and their licence."
        echo "::error::Fix it by removing the package or replacing it with a permissively-licensed one. Do NOT add it to EXCEPTIONS unless the upstream licence genuinely IS permissive and only the package metadata is missing."
        exit 1

    # ── …and a missing CI INPUT decides it too ──────────────────────────────────────────────
    # 🚨 Closing the last skip-trapdoor. A preflight failure SKIPS plugin-gate (a skipped `needs`
    # skips its dependents), and this job's `always()` would otherwise report that as a pass —
    # "Consolidate test results" is the repo's only required status check, so an unprovisioned
    # credential would once again read as a green merge-ready PR while the cross-repo gate
    # tested nothing. Same lesson as the step above: `needs:` alone is NOT enough under always().
    # ── …and a red Clients workflow decides it too ──────────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough under `if: always()` — same lesson as the steps above.
    # This is the merge gate #1555 did not have: its Portal-next job was red, naming the exact
    # build main-cd would later run, and it was advisory.
    - name: Fail if the clients gate failed
      if: needs.clients-gate.result != 'success'
      run: |
        echo "::error::The Clients workflow verdict is '${{ needs.clients-gate.outputs.verdict }}' (gate job: ${{ needs.clients-gate.result }}) — see the 'Clients workflow verdict' job. main-cd's portal-next image leg runs the same build, and its promote step is all-or-nothing, so merging this would stop ALL image publication."
        exit 1

    - name: Fail if a required CI input is missing
      if: needs.preflight.result != 'success'
      run: |
        echo "::error::A required CI input is missing or the preflight could not run — see the 'Required CI inputs' job. Gates that depend on it did not run, so this run proves nothing about them."
        exit 1

    # ── STATE THE BISECT WINDOW ON A RED ────────────────────────────────────────────────────
    # #1491's diagnostic half. The natural first move on a red main is
    # `git log <last-green>..<red>` — and taking "last green" from the run list is WRONG when
    # the preceding run reused a marker, because that run concluded success without executing
    # anything. The window it yields can exclude the change set that actually broke the tree.
    #
    # `refs/ci-executed/main/*` records only main commits whose suite genuinely RAN and passed,
    # so the newest one IS the correct left edge. Stating it here means the window is read, not
    # reconstructed. Never fails the run: it is a diagnostic on an already-red run, and a
    # missing hint must not mask the failure that prompted it.
    - name: "State the bisect window"
      if: failure()
      continue-on-error: true
      run: |
        set -uo pipefail
        last=$(git ls-remote origin 'refs/ci-executed/main/*' 2>/dev/null \
               | sed -E 's|^([0-9a-f]+)[[:space:]]+refs/ci-executed/main/([0-9]+)(-([0-9]+))?$|\2 \1 \4|' \
               | grep -E '^[0-9]+ ' | sort -n | tail -1 || true)
        {
          echo "### 🔎 Bisect window"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -z "$last" ]; then
          echo "No refs/ci-executed/main marker yet — the window cannot be stated from evidence." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        sha=$(echo "$last" | awk '{print $2}')
        run=$(echo "$last" | awk '{print $3}')
        {
          echo "Last main commit whose tests **actually executed** and passed: \`${sha}\`"
          [ -n "$run" ] && echo "(run [${run}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${run}))"
          echo
          echo "So the window to bisect is:"
          echo
          echo '```'
          echo "git log ${sha}..${{ github.sha }}"
          echo '```'
          echo
          echo "> 🚨 This is deliberately NOT \"the last main run that concluded success\". A run that"
          echo "> reuses an already-green tree marker reports success **without executing the suite**,"
          echo "> so the window taken from the run list can exclude the change set that actually broke it."
        } >> "$GITHUB_STEP_SUMMARY"
