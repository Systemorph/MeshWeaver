# This workflow builds the solution ONCE, then runs the test suite across
# parallel shards that consume the prebuilt output, and finally consolidates
# every shard's results in a single collector job.
#
#   precheck ──▶ build ──▶ test (matrix shard 0..5) ──▶ collect-results
#
# Why this shape (vs. the old "every shard restores+builds the whole solution"):
#   * The 50+ project solution is compiled exactly once; shards start from the
#     packaged TEST BIN outputs, never recompile, so a shard can only fail for
#     a real test reason (or genuine infra failure), not a flaky build.
#   * Shards run each test project's NATIVE xUnit v3 host (`dotnet <Name>.dll`)
#     instead of `dotnet test --no-build`: no per-project MSBuild evaluation
#     (seconds × ~45 projects), no obj/ or NuGet cache needed in the artifact
#     (the tarball shrank from bin+obj+.nuget-of-everything to test bins only),
#     and the host's exit code faithfully reports catastrophic failures that
#     vstest used to mask (see the exit-marker gate below).
#   * Results are published from ONE collector job → a single "Test Results"
#     check is the pass/fail gate, instead of separate per-shard checks.
#
# Gates (a shard/run is red when ANY fires):
#   1. trx parse — any <UnitTestResult outcome="Failed"> across shards.
#   2. exit markers — any per-project `[CI] <name> exit=N` with N != 0. This is
#      what catches a test host that CRASHES after streaming green results
#      (SIGABRT/FailFast → exit 134 with an all-green trx: the 2026-07 masked
#      Persistence.Test memory-watchdog abort), an 8m wall-clock kill (124/137),
#      and xunit catastrophic failures ("There is no currently active test",
#      teardown ObjectDisposedException) that leave no failed trx entry.
#
# ─────────────── GREEN-TREE REUSE (why main isn't re-tested) ───────────────
# A PR run does NOT test the branch — GitHub builds `refs/pull/N/merge`, i.e. the
# branch ALREADY MERGED with main's tip. When that PR then merges and main hasn't
# moved in between, the commit pushed to main has the IDENTICAL TREE to the one
# just tested green: re-running the whole suite tests the same bytes a second time,
# adds ~22 min to the merge→deploy path (main-cd gates on this workflow), and gives
# flakes a second roll of the dice that can red main and stall the self-update.
#
# So a green run records the TREE it tested as a marker ref:
#
#     refs/ci-green/<tree-sha>/<unix-epoch>
#
# and `precheck` short-circuits build+test when the tree it is about to test
# already carries a fresh marker. Keyed on the TREE, not the commit, so it is
# merge-strategy agnostic — merge, squash and rebase all produce the same tree
# when the base hasn't moved.
#
# Fail-safe by construction: if main moved between the PR run and the merge, the
# merged tree differs, no marker exists, and the full suite runs. There is no way
# to skip a tree that was not actually tested green.
#
# Guards on the marker (all must hold before one is written / honoured):
#   * Written ONLY when build AND every shard job succeeded — not merely when the
#     collector's own gates passed. A shard that infra-fails drops its artifacts
#     entirely, which the trx/exit-marker gates cannot see (nothing to parse).
#   * TTL (CI_GREEN_TTL_SECONDS, 24 h): inputs OUTSIDE the tree drift — a fresh
#     NuGetAudit advisory reds restore repo-wide, the runner's SDK patch moves. A
#     day-old green is evidence; a week-old green is a guess.
#   * `workflow_dispatch` never reuses — a manual run means "actually run it".
#
# `collect-results` runs on BOTH paths (reuse and full), so it is the stable
# required-status-check for the branch ruleset. Do NOT require "Build solution
# (once)" or a shard job: those are legitimately skipped on the reuse path, and a
# skipped required check blocks the merge. Keeping the collector job alive is also
# what keeps the run's conclusion `success` (a run whose jobs ALL skip can conclude
# `skipped`) — main-cd's `workflow_run.conclusion == 'success'` gate depends on it.

name: MeshWeaver Build and Test

# ──────────── EVERY PR, WHATEVER ITS BASE — including a STACKED one ────────────
# 🚨 The `pull_request` trigger deliberately carries NO `branches:` filter. Do not
# re-add one. It used to say `branches: [ "main" ]`, and the consequence (#1401) was
# that a PR based on ANOTHER PR's branch — a stacked PR, which is the recommended way
# to split a large change into reviewable pieces — never ran this suite at all.
#
# The failure mode is the dangerous half: an ABSENT check looks like nothing to wait
# for. There is no "skipped", no pending, no marker of any kind — a stacked PR renders
# as a short, all-green check list, visually IDENTICAL to one that ran the full suite
# and passed. #1398 → #1399 → #1400 were split exactly as intended and two of the three
# reached `MERGEABLE/CLEAN` with zero runs in their entire history.
#
# Three things make that state stickier than it looks, all confirmed on those PRs:
#   * GitHub retargets a child PR to `main` only when the parent's branch is DELETED
#     on merge. Branch deletion is off here, so a child keeps pointing at a merged
#     branch indefinitely — "it gets tested later, just out of order" is not real.
#     Left alone, a stacked PR was never tested at ANY point, including at merge.
#   * `gh pr edit --base main` fires `pull_request.edited`, which is NOT in the default
#     type set (opened/synchronize/reopened). The base changed, the checks stayed
#     absent, and the PR still read CLEAN. Only close+reopen ever queued a run.
#   * The `main pr protection` ruleset is scoped to `~DEFAULT_BRANCH`, so a PR whose
#     base is not `main` is outside it: the `Consolidate test results` required check
#     is not required there, and its absence therefore does not even block the merge.
# So the pre-fix state had no signal at all: nothing ran, nothing was pending, nothing
# was required. Running unconditionally is what turns that silence back into evidence.
#
# What a stacked run tests: GitHub builds `refs/pull/N/merge`, i.e. the branch merged
# with ITS BASE. For a stacked PR that base is the parent's branch, so the run tests
# the layer's own diff on top of the parent — real coverage of the code being reviewed.
# That is the same "tested against a base that is not main's tip" posture the ruleset
# already sanctions repo-wide (`strict_required_status_checks_policy: false`).
#
# Cost is small and bounded, because the green-tree reuse below is keyed on the TREE:
# when the parent merges and main lands the identical tree, `precheck` finds the marker
# the stacked run wrote and skips build+test. A stacked series pays for one full suite
# per layer, not two.
#
# `push:` stays `main`-only on purpose — a full suite on every feature-branch push
# would double every PR's cost for no extra evidence (the PR run already covers it).
on:
  push:
    branches: [ "main" ]
  pull_request:      # ← NO `branches:` filter. See the block above (#1401) before adding one.
  # 🚨 THE MERGE QUEUE CANNOT WORK WITHOUT THIS TRIGGER, and its absence does not look like a
  # missing trigger — it looks like a PR that queues and then sits there. The queue builds a
  # temporary `gh-readonly-queue/main/…` ref and waits for the REQUIRED CONTEXT (`Consolidate test
  # results`) to report on it; a workflow that never fires on `merge_group` reports nothing, so the
  # entry waits out its timeout and is ejected, with no failing check to point at.
  #
  # Why a queue at all (#2412): with `strict: false` every PR is tested against the main it
  # branched from, so a burst of merges lands a COMBINATION no run ever compiled. Measured twice —
  # `CS0246: MeshOperations` on 2026-08-26, and on 2026-08-30 a new guard (#2782) plus an
  # independently-landed gate primitive (#2792) that were each green alone and red together, which
  # held main red for five consecutive runs and reddened a documentation-only PR. A queue builds
  # each entry on top of the entries ahead of it, so the combination is compiled BEFORE it lands.
  #
  # This repo is PUBLIC, so the queue is available on the org's plan (private repos need
  # Enterprise Cloud — MeshWeaver.Plugins carries the same trigger dormant for that reason).
  # Enable it in the `main pr protection` ruleset ONLY after this trigger is on main.
  merge_group:
  workflow_dispatch:

# A force-push to a PR branch obsoletes the in-flight run — cancel it instead of
# finishing a build of dead code (runner minutes + queue latency for 8 jobs/run).
#
# ── main is grouped and cancels too, since 2026-08-26 ────────────────────────
# It did not used to be: `group` was `run_id` for pushes, so every main push got its
# own group and nothing ever superseded anything. During a merge marathon that is
# almost pure waste. MEASURED over a 3.6 h window on 2026-08-25: 19 of 21 main runs
# were obsolete before they finished — merges landed 1–120 SECONDS apart, each
# spawning a full ~70-runner-minute suite against a commit the next merge had already
# replaced. ≈1,199 runner-minutes, ~28% of ALL demand in that window, spent testing
# superseded trees. The org is on the Team plan (60 concurrent hosted jobs) and that
# day's volume doubled to 1,092 workflow runs, so the ceiling was genuinely binding:
# the same queue that costs 3 s on a quiet day cost 25 MINUTES that day. This demand
# is the single largest thing we can remove.
#
# 🚨 Why this is safe for DELIVERY, which is what the old comment was protecting:
#   * The newest run is NEVER the one cancelled — `cancel-in-progress` cancels the
#     older members of the group. main's tip therefore always runs to completion, and
#     the tip is exactly what main-cd's reconciler resolves and gates on.
#   * main-cd no longer depends on a per-commit `workflow_run`: its hourly reconciler
#     (`cron: 23 * * * *`) asks whether main's TIP has a complete image set and
#     publishes when it does not, gated on `Consolidate test results` being green on
#     that commit. Publication is batched anyway (CD_BATCH_WINDOW_MINUTES), so a
#     superseded commit was never going to get its own image.
#   * A cancelled run writes no `refs/ci-green` marker — correct, because the tree it
#     would vouch for is one no future run will ever test again.
#
# 🚨 What it COSTS, deliberately accepted (maintainer, 2026-08-26): BISECT RESOLUTION.
# A red main tip now covers every commit in that merge batch rather than one commit,
# because the intermediate merge commits are no longer independently tested. Each PR
# was still tested as `refs/pull/N/merge` before merging, so what goes untested is
# specifically the INTERACTION between PRs that merged within seconds of each other —
# which is real, and is what a red tip then has to be bisected for by hand
# (`gh workflow run "MeshWeaver Build and Test" --ref <sha>` on a candidate commit).
# If that trade ever stops being worth it, the revert is exactly these two lines:
#     group: build-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#
# workflow_dispatch stays UNGROUPED (`run_id`, no cancel): a manual dispatch is a
# deliberate act — usually the hand-bisect above — and must never be cancelled by an
# unrelated push landing on main.
concurrency:
  # PR runs group by `refs/pull/N/merge`; a manual dispatch gets its own group; and a push to
  # `main` groups by its own COMMIT. Kept on ONE line: in a folded (`>-`) scalar, continuation
  # lines indented deeper than the first are preserved literally rather than folded, so a
  # "tidier" multi-line version silently changes the string rather than just its layout.
  #
  # 🚨 MAIN GROUPS BY SHA, NOT BY REF — `cancel-in-progress: false` was NOT enough (#2412 was
  # incomplete). GitHub keeps exactly ONE PENDING run per concurrency group: `false` protects the
  # run that is already EXECUTING, but a third arrival still EVICTS the queued one, and an evicted
  # run reports `cancelled` having never run a step. Grouping every main commit under one ref
  # therefore reintroduced both failures the note below exists to prevent, silently.
  #
  # Measured 2026-08-30 (one merge burst, and `run_started_at` == `created_at` even while a run
  # is only queued, which is what makes this read as "cancelled mid-run"):
  #   dca02bdd7 queued 11:42:10 → cancelled 11:53:02, 1s after dfdd2d01c was created
  #   57de73c45 queued 11:54:57 → cancelled 12:08:54, 2s after 637ee3921 was created
  #   637ee3921 queued 12:08:52 → cancelled 12:09:16, 1s after 0c584a2d5 was created
  # Three landed commits untested, and CD published nothing for any of them: ACR's newest image
  # stayed several commits behind while three CD runs reported green with every job `skipped`.
  #
  # A per-SHA group cannot contend with anything, so every commit that lands on main gets its own
  # full run — which is precisely the cost the note below says is deliberately accepted.
  group: build-test-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  # 🚨 NEVER cancel a run on `main` (#2412). Superseding is safe on a PR branch — the later
  # push tests a strict successor of what was cancelled, and that is where #2316's ~28% of
  # runner demand is saved. On `main` it is neither safe nor recoverable, for two reasons:
  #
  #  1. **Nothing then builds the combination that landed.** With `strict: false` each PR is
  #     tested against the main it branched from, so the MERGED tree is first compiled by the
  #     main run itself. Cancel that and a semantic conflict between two independently-green
  #     PRs ships unbuilt — which is exactly how `CS0246: MeshOperations` reached main on
  #     2026-08-26, from five merges inside fifteen seconds.
  #  2. **Nothing publishes.** `main-cd.yml` gates delivery on the required check
  #     `Consolidate test results` reaching `success` FOR THAT SHA. A cancelled run does fire
  #     `workflow_run` (`types: [completed]` includes cancelled), so CD wakes up and finds no
  #     success to act on. A burst of merges therefore publishes nothing at all, and the tail
  #     is left to the hourly reconciler.
  #
  # Measured the day this was written: main's five consecutive runs between 20:28 and 20:38
  # were ALL `cancelled`, each by the next merge. The cost of this line is one full run per
  # merge to main; that is the price of every landed commit being both tested and shippable.
  #
  # 🚨 This line is now the BELT, not the braces: with main grouped by SHA above, no two main runs
  # ever share a group, so there is nothing for it to cancel. It stays because it is the statement
  # of intent, and because it still governs any future ref that groups by name.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

# publish-unit-test-result-action runs per shard AND in the collector — both need
# checks: write to create check-runs and pull-requests: write to comment.
# contents: write is for the `refs/ci-green/*` marker refs ONLY (push + prune); a
# fork PR's read-only token makes that step fail, which is why it is best-effort.
permissions:
  contents: write
  checks: write
  pull-requests: write
  # `clients-gate` lists the Clients workflow's runs for this commit — see that job.
  actions: read

env:
  # How long a green tree stays evidence. Beyond this the marker is ignored (and
  # the full suite runs) because non-tree inputs — NuGet advisories, runner SDK
  # patch level — have had time to move under it.
  CI_GREEN_TTL_SECONDS: 86400      # 24 h
  # Marker refs older than this are deleted, so `git ls-remote refs/ci-green/*`
  # stays a handful of lines rather than an unbounded ref namespace.
  CI_GREEN_PRUNE_SECONDS: 1209600  # 14 d
  # How many shard jobs the `test` matrix has. STATICALLY known, which is the whole
  # point: `collect-results` compares the number of shards that REPORTED against this
  # number, rather than inferring coverage from whatever artifacts happened to arrive.
  # 🚨 Keep in sync with the `test` job's `matrix.shard` list and the build job's
  # SHARD_TOTAL. A mismatch is loud (the assertion fails), never silent.
  CI_SHARD_TOTAL: 6

jobs:
  # 🚨 No `jlumbroso/free-disk-space` in any job — do not re-add it. Removed 2026-08-09 after
  # measuring what the runner actually has. From the reclaim step's OWN "BEFORE CLEAN-UP" line
  # on run 31306383220 (and identically on every CD job):
  #
  #     /dev/root  145G  58G used  88G available  40% /
  #
  # It then spent ~71 s in `build` and ~53 s in EVERY shard reclaiming ~15 GiB, to go from 88G
  # free to ~103G free. Nothing here comes close to needing that: the whole test-bin tarball set
  # is ~3.3 GB and the pgvector image is a couple more. The "default ~14 GB" the old comments
  # guarded against is simply not what hosted runners ship any more.
  #
  # Cost of keeping it: ~71 s on the critical path in `build`, plus ~53 s on the long-pole shard,
  # plus ~5 min of runner time per run across the six shards — to free space that was never scarce.
  # If a job ever genuinely fills the disk it fails loudly with ENOSPC; reclaim selectively THEN,
  # against a measurement, rather than pre-emptively everywhere.
  #
  # ──────────────────────────── PRECHECK ───────────────────────────
  # Is the tree we are about to test ALREADY green? See the green-tree-reuse
  # section in the file header for why this exists and why it is safe.
  #
  # Cost when it misses: one ~15 s job (checkout + one ls-remote) in front of a
  # ~22 min suite. Cost when it hits: the whole suite, skipped.
  record-signatures:
    name: "Public surface (binary compatibility)"
    timeout-minutes: 8
    runs-on: ubuntu-latest
    # 🚨 Runs on PRs only, and deliberately does NOT depend on precheck: this is a DIFF gate, so
    # a tree that is already green elsewhere still has to answer "is this change binary-breaking
    # for a consumer compiled earlier?" — a question no repo-local suite can answer.
    # A merge_group entry HAS a base — main, by construction (the queue ref is main plus the
    # entries ahead of this one) — so both diff gates keep holding inside the queue rather than
    # going quiet exactly where the merge actually happens.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
    - uses: actions/checkout@v7
      with:
        # The gate compares HEAD against the merge base, so the base commit must be present.
        fetch-depth: 0
    - name: "Prove the record gate is not vacuous"
      run: python3 scripts/check-record-signatures.py --self-test
    - name: "Refuse a binary-breaking primary-constructor change"
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=200 origin "${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}"
        # 🚨 The MERGE BASE, not the base branch tip — same reasoning as the type-move gate below.
        # This step disagreed with its own script until #2398: check-record-signatures.py's
        # docstring says it compares "the merge base against the working tree", while the step
        # handed it `origin/<base_ref>`.
        #
        # The half that was wrong is NOT the file list — that uses the three-dot
        # `git diff --name-only {base}...HEAD`, which resolves the merge base itself. It is the
        # BEFORE CONTENT: `git show {base}:{file}` reads the literal ref, so with the tip, a record
        # whose primary constructor changed on main while this PR is open gets compared against
        # THAT change rather than against what this PR branched from — and the PR reads as
        # reverting it. A red on somebody else's commit, on a gate whose whole value is that people
        # believe it. Passing the merge-base SHA fixes both halves consistently (`sha...HEAD`
        # degenerates to `sha`, since it is an ancestor of HEAD).
        base=$(git merge-base "origin/${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}" HEAD)
        echo "Comparing against merge base $base"
        python3 scripts/check-record-signatures.py --base "$base"
    # The OTHER half of the same class (#2370): a public TYPE moving assemblies, which no repo-local
    # build can see. `landed-modules-gate` used to compile the plugins repo's module SOURCE against
    # this PR and went GREEN on exactly this break — the module that is already published binds a
    # TypeRef, not a `using` — and it is gone besides (see the note above `clients-gate`).
    #
    # 🚨 NO `--sibling` HERE, DELIBERATELY (#2398). The script can resolve a type that left this
    # repo entirely into "moved to MeshWeaver.Plugins" vs "deleted" when handed a sibling checkout,
    # and that is a maintainer/local affordance, not a CI one: this repo is PUBLIC and
    # MeshWeaver.Plugins is PRIVATE, so the checkout needs a secret on a `pull_request` gate — in a
    # workflow that today has NO secret and NO preflight job (both deliberate; see "No preflight job
    # right now" above), and reinstating the input means reinstating preflight. It would also make
    # this gate's verdict depend on ANOTHER repo's moving HEAD, so the same diff could go red or
    # green with no change of its own. Without the flag the gate is the CONSERVATIVE one: it reports
    # every departure and fails, and the flag can only ever relax that.
    - name: "Prove the type-move gate is not vacuous"
      run: python3 scripts/check-type-forwards.py --self-test
    - name: "Refuse a public type moving assemblies without a forwarder"
      run: |
        set -euo pipefail
        # Already fetched above for the record gate; repeated explicitly so the steps can be reordered.
        git fetch --no-tags --depth=200 origin "${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}"
        # 🚨 The MERGE BASE, not the base branch tip. This is a diff question, and a public type that
        # moves on main while this PR is open reads, against the tip, as THIS PR moving it back — a
        # red on somebody else's change. Four such moves landed on main in one day (#2398), so this
        # is the difference between a gate people believe and one they learn to allow-list past.
        base=$(git merge-base "origin/${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}" HEAD)
        echo "Comparing against merge base $base"
        python3 scripts/check-type-forwards.py --base "$base"

  precheck:
    name: "Check for an already-green tree"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
      tree: ${{ steps.probe.outputs.tree }}
      marker: ${{ steps.probe.outputs.marker }}
      # PROVENANCE (#1491): the run that ACTUALLY executed the suite on this tree. A green
      # produced by reuse is honest about the bytes but says nothing about which run gathered
      # the evidence — and "last green main run" is then not the same thing as "last main run
      # that executed the tests", which is exactly how a red got attributed to the wrong PR.
      # Empty for markers written before this was recorded.
      marker_run: ${{ steps.probe.outputs.marker_run }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Only HEAD's tree matters; the marker push in collect-results needs
        # nothing deeper either (it points the ref at github.sha).
        fetch-depth: 1
    - name: "Probe refs/ci-green for this tree"
      id: probe
      run: |
        set -euo pipefail
        # On a pull_request run this is the tree of refs/pull/N/merge — the branch
        # already merged with main — which is exactly the tree that lands on main
        # if nothing else merges first.
        tree=$(git rev-parse 'HEAD^{tree}')
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        echo "Tree under test: $tree"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch — always runs the full suite."
          echo "Manual dispatch: full suite (green-tree reuse disabled)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Newest marker for this tree, if any. Grep locally as well as passing the
        # prefix: never let a server-side pattern match a ref for a DIFFERENT tree.
        #
        # Marker leaf is `<epoch>` (legacy) or `<epoch>-<run_id>` (carries provenance,
        # #1491). Both are accepted; sorting is on the epoch field only.
        newest=$(git ls-remote origin "refs/ci-green/$tree/*" \
                 | awk '{print $2}' \
                 | grep -E "^refs/ci-green/$tree/[0-9]+(-[0-9]+)?$" \
                 | sed 's|.*/||' | sort -t- -k1,1n | tail -1 || true)

        if [ -z "$newest" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No green marker for this tree — running the full suite."
          exit 0
        fi

        epoch="${newest%%-*}"
        marker_run=""
        case "$newest" in (*-*) marker_run="${newest#*-}";; esac

        age=$(( $(date +%s) - epoch ))
        if [ "$age" -gt "${CI_GREEN_TTL_SECONDS}" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Marker is ${age}s old (TTL ${CI_GREEN_TTL_SECONDS}s) — stale, running the full suite."
          exit 0
        fi

        {
          echo "skip=true"
          echo "marker=refs/ci-green/$tree/$newest"
          echo "marker_run=$marker_run"
        } >> "$GITHUB_OUTPUT"
        echo "Tree already green ${age}s ago — reusing that result."
        # 🚨 Name the run that ACTUALLY executed the suite (#1491). Without this, a reader
        # of the run list cannot tell a green that gathered evidence from a green that
        # inherited it — and taking the bisect window from the latter points at the wrong PR.
        if [ -n "$marker_run" ]; then
          provenance="[run ${marker_run}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${marker_run})"
          echo "The suite was actually executed by run ${marker_run}."
        else
          provenance="_unrecorded (marker predates provenance recording)_"
        fi
        {
          echo "### ✅ Reusing an already-green result"
          echo
          echo "This commit's tree \`$tree\` was tested green **${age}s ago** and nothing in it has changed since, so build + test are skipped."
          echo
          echo "- Marker: \`refs/ci-green/$tree/$newest\`"
          echo "- Evidence gathered by: ${provenance}"
          echo "- TTL: \`${CI_GREEN_TTL_SECONDS}s\`"
          echo
          echo "> This run **did not execute the suite**. If something later goes red, the bisect"
          echo "> window starts at the last main run that ACTUALLY ran the tests — not at this commit."
        } >> "$GITHUB_STEP_SUMMARY"

  # ── No preflight JOB — the assertion lives in the two gates that have an input ─────────
  #
  # AGENTS.md requires that every CI input coming from OUTSIDE the tree (secrets, repo variables)
  # is ASSERTED and fails RED naming what to provision — so that a gate can never skip on a
  # missing input and look identical to one that passed.
  #
  # This workflow had NO such input for a while: its only assertion was PLUGINS_REPO_SSH_KEY, the
  # deploy key the plugin gates used to check out MeshWeaver.Plugins, and those gates are gone
  # (core builds the image and runs its OWN tests; plugins are built by the plugin repo). Keeping
  # a preflight job with an empty `missing` array would have been strictly worse than deleting it
  # — a job that asserts nothing and always passes IS the green-on-zero-evidence shape the rule
  # exists to prevent.
  #
  # 🚨 TWO gates have an external input again — `shared-rules` and `cross-repo-pair`, both of
  # which read the FLEET through a GitHub App installation token — and each carries the assertion
  # ITSELF, as its first step, rather than through a shared preflight job:
  #
  #   * each fails RED naming exactly which secret to provision, so a missing credential can
  #     never render a tick;
  #   * each then PROVES the token can perform the read it needs (present is not valid), so a
  #     provisioned-but-dead credential cannot pass either;
  #   * each runs unconditionally, with the exemption written on the EVENT and nowhere else;
  #   * each is a `needs:` of `collect-results` WITH an explicit fail step, so a skipped or
  #     cancelled verdict fails the required check rather than reading as passed.
  #
  # That is the rule's substance held in two places instead of one. A shared `preflight` job would
  # centralise the `missing` array — worth doing if a THIRD credentialed gate appears here — but
  # it would not add a single assertion that is not already made, and moving the credential proof
  # away from the gate that needs it is how a proof and its subject drift apart.

  build:
    name: "Build solution (once)"
    needs: precheck
    # Skipped ONLY when this exact tree is already green (see the file header). `test`
    # needs `build`, so it skips with it; `collect-results` is if:always() and
    # reports the reused result.
    #
    # 🚨 `!cancelled()` is what makes the skip FAIL-OPEN. A `needs` job that ends
    # cancelled — the probe waiting 15 min for a runner and being killed with zero
    # steps executed, main 2026-08-06 — skips every dependent REGARDLESS of this `if`,
    # unless the condition contains always()/!cancelled(). That silently skipped the
    # build and all six shards, and the run still reported a green required check.
    # With !cancelled(), an unanswerable probe means "we don't know" ⇒ TEST IT; only a
    # genuine workflow cancellation (where !cancelled() is false) still stops the run.
    if: ${{ !cancelled() && needs.precheck.outputs.skip != 'true' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # Merge precondition (a): build green with warnings-as-errors (ReleaseStrategy.md → "Merge
      # preconditions"). The compiler-warning burn-down (release-governance step A2) is DONE and
      # TreatWarningsAsErrors=true is set centrally in Directory.Build.props; -warnaserror here makes
      # the gate explicit at the CI build step. NuGet restore advisories (NU19xx vulnerabilities) stay
      # warnings (WarningsNotAsErrors in Directory.Build.props) — handled via dependency overrides.
      run: dotnet build --no-restore -c Release -p:CIRun=true -warnaserror
    - name: "Every test project is in the solution"
      # 🚨 shard-assign.sh globs `find test -name '*.csproj'`, but the build builds
      # MeshWeaver.slnx. A test project missing from the solution is therefore ASSIGNED to a
      # shard and never BUILT: it produces no bin, contributes nothing to the tarball, and its
      # tests run nowhere — the "absence of evidence" shape this workflow exists to refuse.
      # Static, deterministic, and it names the offender instead of letting it surface as a
      # packaging exit code. Found by PR #2966, which added two.
      run: |
        set -euo pipefail
        missing=$(comm -23 \
          <(find test -name '*.csproj' ! -path '*/bin/*' | sort) \
          <(grep -oE 'test/[^"]+\.csproj' MeshWeaver.slnx | sort))
        if [ -n "$missing" ]; then
          echo "::error::these test projects are not in MeshWeaver.slnx, so they are never built and their tests never run:"
          echo "$missing" | while read -r m; do echo "::error::  $m"; done
          exit 1
        fi
        echo "All $(find test -name '*.csproj' ! -path '*/bin/*' | wc -l | tr -d ' ') test projects are solution members."
    - name: Package test outputs (one tarball per shard)
      env:
        SHARD_TOTAL: 6
      run: |
        set -euo pipefail
        # ── Why PER SHARD and not one tarball for everyone ──────────────────
        # The single 3.3 GB artifact was downloaded by all 6 shards — 20 GB of
        # transfer per run, and the artifact service's throughput varies ~10x
        # run to run (measured 35 s … 318 s for the same bytes). That download
        # WAS the shard imbalance: on run 30903428924 the long-pole shard spent
        # 318 s downloading and a perfectly ordinary 370 s testing, while the
        # fastest shard downloaded the same bytes in 35 s.
        #
        # Packing per shard costs the same compression work (same bytes, split
        # six ways) plus the cross-shard dedupe we give up, and it turns a 3.3 GB
        # download into ~1/6 of one.
        #
        # Only the TEST projects' bin trees travel. Each test bin is
        # self-contained (dependency closure + TestData fixtures copied in — e.g.
        # AI.Test's CopyFakeCli target puts FakeCli under its OWN bin), and the
        # native xUnit v3 hosts need no obj/, no src/samples bins, and no NuGet
        # global-packages folder (runtime NuGet-resolver tests declare themselves
        # network-based and restore into the default cache).
        #
        # 🚨 The SAME script decides the assignment here and in the test job. If
        # they ever diverged, a shard would run a project whose bin it never
        # downloaded.
        for ((i=0; i<SHARD_TOTAL; i++)); do
          SHARD_INDEX=$i .github/scripts/shard-assign.sh \
            | while read -r entry; do
                # A split project arrives as `<csproj>#<part>/<parts>`. Strip the suffix: the
                # SAME bin has to travel to every shard running one of its parts.
                csproj="${entry%%#*}"
                d="$(dirname "$csproj")/bin"
                # A project that produced no output (helper with nothing to
                # build) simply contributes nothing to its shard's tarball.
                #
                # 🚨 `if`, NOT `[ -d "$d" ] && echo "$d"`. A `while` loop's exit status is
                # that of its LAST iteration, so under `set -e` the && form killed this
                # whole step — bare `Process completed with exit code 1`, no message —
                # whenever the last project ASSIGNED to a shard happened to have no bin.
                # The empty-list guard below never got to speak, so the real cause (a test
                # project absent from MeshWeaver.slnx, hence never built) surfaced four
                # steps away as "No test results found in any shard — the suite did not
                # run". Measured on PR #2966. The tolerance is deliberate; the exit-status
                # poisoning was not.
                if [ -d "$d" ]; then echo "$d"; fi
              done | sort -u > ".build-paths-$i.txt"
          # 🚨 Shard 0 additionally carries the PLUGIN TESTER — the ONE non-test bin that
          # travels. tools/MeshWeaver.PluginTester (mw-plugin-test.dll) is a TOOL, so the
          # test-project sweep above never picks it up; but the plugin-gate job reuses THIS
          # artifact instead of rebuilding, and that reuse is exactly what keeps the gate
          # inside its 12-minute budget. While the gate sat unarmed the omission was
          # invisible — the FIRST armed run died on "mw-plugin-test.dll not in the build
          # output — the gate cannot run", having tested nothing, which is the very shape
          # that job exists to prevent. The run loop iterates shard-assign.sh's project
          # list (not the extracted tree), so this extra bin is inert for the tests.
          # Missing here is a BUILD fault, not a tolerable absence: the solution builds
          # this project, so fail loudly rather than ship an artifact the gate cannot use.
          if [ "$i" -eq 0 ]; then
            if [ ! -d tools/MeshWeaver.PluginTester/bin ]; then
              echo "::error::tools/MeshWeaver.PluginTester/bin is missing — the plugin gate would have nothing to run."
              exit 1
            fi
            echo tools/MeshWeaver.PluginTester/bin >> ".build-paths-$i.txt"
          fi
          # zstd -T0 = all cores. --long=27 (128 MiB match window) dedupes ACROSS
          # files: the self-contained test bins each carry near-identical copies
          # of the same framework + MeshWeaver DLLs, which the default 8 MiB
          # window can't see. The EXTRACT side must pass --long=27 too, or zstd
          # refuses with a window-size error.
          # 🚨 An empty path list would produce an empty tarball, and a shard that
          # extracts nothing finds no <Name>.dll — which the run loop would classify
          # as "helper project, nothing to run", exit=0, GREEN. A whole suite could
          # pass having executed zero tests. Fail here instead.
          if [ ! -s ".build-paths-$i.txt" ]; then
            echo "::error::shard $i got no bin trees to pack — shard-assign.sh failed or the build produced no test output."
            exit 1
          fi
          tar -I 'zstd -T0 --long=27' -cf "build-output-$i.tar.zst" -T ".build-paths-$i.txt"
          echo "shard $i: $(wc -l < ".build-paths-$i.txt") bin trees, $(du -h "build-output-$i.tar.zst" | cut -f1)"
        done
    # One artifact per shard. Six near-identical steps because a step cannot be
    # generated in a loop — keep them in sync with SHARD_TOTAL above and with the
    # test job's matrix.
    - name: "Upload artifact: shard 0"
      uses: actions/upload-artifact@v7
      with: { name: build-output-0, path: build-output-0.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 1"
      uses: actions/upload-artifact@v7
      with: { name: build-output-1, path: build-output-1.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 2"
      uses: actions/upload-artifact@v7
      with: { name: build-output-2, path: build-output-2.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 3"
      uses: actions/upload-artifact@v7
      with: { name: build-output-3, path: build-output-3.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 4"
      uses: actions/upload-artifact@v7
      with: { name: build-output-4, path: build-output-4.tar.zst, retention-days: 1, compression-level: 0 }
    - name: "Upload artifact: shard 5"
      uses: actions/upload-artifact@v7
      with: { name: build-output-5, path: build-output-5.tar.zst, retention-days: 1, compression-level: 0 }

  # ───────────────────────────── TEST ──────────────────────────────
  # Matrix-sharded: the ~45 test projects are split across SHARD_TOTAL parallel
  # runners by MEASURED weight (greedy LPT — see the Run Tests step). Each shard
  # downloads the prebuilt test bins and runs each project's native xUnit v3
  # host — NO restore, NO build, NO MSBuild.
  test:
    name: "Run tests (shard ${{ matrix.shard }})"
    needs: build
    # HARD CAP on a shard. Each project already has its own `timeout 8m` below, but that
    # only bounds a project that is RUNNING — it cannot bound a shard that wedges between
    # projects. 20 min is ~1.5x the slowest observed shard (14m36s) with the rebalanced
    # weights, so a shard that hits this is stuck, not slow.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling shards when one fails — we want every shard's
      # results so the PR shows the full failure picture, not just the first.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: "Download artifact: this shard's build output"
      uses: actions/download-artifact@v8
      with:
        # Only THIS shard's test bins (~1/6 of the output). The old single
        # 3.3 GB artifact was pulled by every shard and its 35–318 s transfer
        # variance, not the tests, decided which shard was the long pole.
        name: build-output-${{ matrix.shard }}
    - name: Extract build output
      run: |
        set -euo pipefail
        # --long=27 matches the pack side (window > 8 MiB default; required to decode).
        tar -I 'zstd --long=27' -xf "build-output-${{ matrix.shard }}.tar.zst"
        rm -f "build-output-${{ matrix.shard }}.tar.zst"
        df -h / | tail -1 | awk '{print "disk after extract: " $4 " free of " $2}'
    # ── Acquire the Testcontainers images BEFORE the tests, as infrastructure ──
    # 🚨 This step exists so a Docker Hub outage can never again masquerade as a
    # mass TEST failure. Every PostgreSql fixture is a COLLECTION fixture, so when
    # the image cannot be pulled, `InitializeAsync` throws and xUnit reports the
    # failure against every test in the collection: run 31137723323 shard 5 logged
    # 412 [FAIL]s, all of them the identical
    #   DockerApiException: Get "https://registry-1.docker.io/v2/": context deadline exceeded
    # and NOT ONE a real defect. That shape is actively harmful — it reds the merge
    # gate with a plausible-looking access-control failure list that cannot be
    # reproduced locally (where the image is already in the local store), and it
    # cost a full debugging session chasing tests that were never broken.
    #
    # Pulling here instead makes the dependency explicit and the diagnosis instant:
    # the registry is a THIRD-PARTY fetch, so it gets bounded retries with backoff
    # (a transient blip is not a code defect and must not be reported as one), and
    # if it still cannot be fetched the shard fails HERE with an unambiguous infra
    # error instead of 412 phantom test results.
    #
    # Testcontainers then finds the image in the local store and starts it without
    # touching the network. Keep this list in sync with the fixtures — grep for
    # `new PostgreSqlBuilder(` / `.WithImage(`.
    - name: "Pre-pull Testcontainers images (infra, not a test)"
      run: |
        set -uo pipefail
        # Only the images the fixtures name explicitly. Testcontainers' OTHER
        # implicit Docker Hub pull — the ryuk resource reaper — is not listed
        # because it is DISABLED for CI instead (see TESTCONTAINERS_RYUK_DISABLED
        # on the next step): the runner VM is discarded wholesale after the job,
        # so there is nothing for a reaper to reap, and not pulling it removes a
        # second registry dependency rather than adding a second thing to retry.
        # Its tag is also a function of the Testcontainers package version, so
        # pinning it here would silently rot.
        images="pgvector/pgvector:pg17"
        rc=0
        for img in $images; do
          ok=0
          for attempt in 1 2 3 4 5; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "$img: already in the local store"; ok=1; break
            fi
            if docker pull --quiet "$img"; then
              echo "$img: pulled on attempt $attempt"; ok=1; break
            fi
            # Backoff: 5s, 10s, 20s, 40s. Docker Hub blips are seconds-to-minutes.
            delay=$((5 * 2 ** (attempt - 1)))
            echo "$img: pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep $delay
          done
          if [ $ok -eq 0 ]; then
            echo "::error::could not pull $img after 5 attempts — this is a REGISTRY/INFRA failure, not a test failure. Do not chase the tests that would have reported it."
            rc=1
          fi
        done
        exit $rc
    # ── Acquire the headless browser BEFORE the tests, as infrastructure ──────
    # 🚨 Since #1230 the PDF export IS a headless browser: the document model was replaced
    # by CSS Paged Media printed by Chromium, so every PDF test — the renderer's own, and the
    # export-script round trips in the Monolith / Orleans / Security suites — needs one. This
    # step provisions the EXACT build the portal image ships (same Playwright version, same
    # `--only-shell` Chromium), so CI cannot pass on a browser production does not have, nor
    # fail on one it does.
    #
    # Same reasoning as the Testcontainers pre-pull above: making the dependency explicit
    # means a CDN blip fails HERE with an unambiguous infra error instead of surfacing as a
    # pile of plausible-looking PDF test failures. NO `continue-on-error` and no
    # input-shaped `if:` — a browser this step failed to install must redden the shard, not
    # silently leave the tests asserting the "no browser here" branch and calling it green.
    #
    # 🚨 EVERY ATTEMPT IS TIME-BOUNDED, because the retry loop below defends against the
    # download FAILING and a stalled CDN does not fail — it hangs. Observed on PR #1808
    # (run 32071216434, shard 0): `npx playwright-core install` sat for the shard's whole
    # 20-minute `timeout-minutes` budget, was killed with the job, and was still alive at
    # cleanup ("Terminate orphan process: npm exec playwright-core@1.62.1 install"). Because
    # the command never returned, `ok` stayed 0, no retry ever ran, and the step's own INFRA
    # error never printed. The shard executed ZERO tests — no `test-results.log`, no `.trx` —
    # so `Consolidate test results` failed on missing results and the run reported CANCELLED:
    # a shape that reads like a test problem and names nothing.
    #
    # 🚨🚨 …AND A TIMED-OUT ATTEMPT MUST REAP THE ROOT `apt-get` IT ORPHANS, or every retry is
    # blocked by its own predecessor's corpse. This is what made the bound above insufficient
    # (run 32172921218, shard 2 — the timings are the log's own):
    #
    #   19:09:18  `install --with-deps` shells out to apt-get; `apt-get update` stalls on
    #             azure.archive.ubuntu.com (`Ign:` × 4 rounds); last output 19:09:56
    #   19:12:13  attempt 1 hits the 180 s bound and is killed
    #   19:12:26  attempt 2: E: Could not get lock /var/lib/apt/lists/lock … process 3061 (apt-get)
    #   19:12:48  attempt 3: E: Could not get lock /var/lib/apt/lists/lock … process 3061 (apt-get)
    #   19:13:19  ::error:: could not install the headless browser after 3 attempts
    #
    # The SAME pid both times: attempts 2 and 3 did not lose a race to the runner image's
    # background apt, they lost it to OURS, which outlived the kill and held the lock for the
    # rest of the step. Three attempts against a holder that cannot exit inside the job is not
    # a retry loop, it is the same failure three times — and no larger `APT_LOCK_WAIT` reaches
    # it either, because the thing being waited for is already dead upstream of its own lock.
    #
    # 🚨 NO PROCESS-GROUP TRICK FIXES THIS — measured, because every plausible one LOOKS like it
    # does. `timeout` ALREADY kills the group: it `setpgid(0,0)`s itself and on expiry
    # `kill(0, sig)`s the whole group (that is precisely what `--foreground` switches OFF), so
    # `setsid` + `kill -- -$pgid` adds nothing it does not already do. And the orphan IS in that
    # group — a faithful local reproduction (ubuntu:24.04, node 22, playwright-core 1.62.1, a
    # blackholed apt mirror to stall `apt-get update`) shows `timeout` at pgid 15 and the
    # surviving `apt-get` at pgid 15. It survives anyway:
    #
    #     kill: (15) - Operation not permitted
    #
    # The blocker is PRIVILEGE, not topology. Playwright shells out through `sudo`, so its
    # apt-get runs as ROOT while this step runs as the unprivileged `runner`; `kill(2)` silently
    # skips the group members the caller may not signal. Anything that signals from this uid —
    # setsid, a trap, an explicit group kill — hits the same EPERM and leaves the orphan exactly
    # where it was. The reap therefore goes through `sudo`, which is what `reap_our_apt` does.
    #
    # It kills only what THIS attempt started (snapshot the pids before, diff after) and only
    # `apt`/`apt-get`, never `dpkg` or `unattended-upgr`: killing the runner's own background
    # upgrade, or a dpkg mid-transaction, would leave the package database half-configured and
    # break the very install being retried. Those two are WAITED for instead.
    #
    # 🚨 THE APT WORK IS ITS OWN PHASE, so a lock fight cannot cost us the browser at all. Under
    # `install --with-deps` the apt-get runs FIRST and the download second — which is why all
    # three attempts above died before one byte of Chromium was fetched, and the shard ended up
    # with no browser for a reason that had nothing to do with the browser. Downloading first,
    # with no apt anywhere in that path, banks the artefact; phase 2 is then one narrow job
    # whose failure names itself instead of hiding inside "could not install the browser".
    #
    # 🚨 ONE BUDGET FOR THE WHOLE STEP, so the arithmetic cannot rot — it already had. The bounds
    # used to be sized against a hand-multiplied worst case (`3 × (60 s wait + 180 s attempt +
    # 30 s kill grace) + 30 s backoff ≈ 14 min`), and #1858 then raised the wait to 240 s, taking
    # that same sum to `3 × (240 + 180 + 30) + 30 = 23 min` — PAST the shard's 20-minute
    # `timeout-minutes`, i.e. silently back to a step that can eat the whole job. That is the
    # exact failure this comment block was written to prevent, reintroduced by editing one term.
    # `BROWSER_STEP_BUDGET` is now the single number: every wait and every attempt is clamped to
    # what is LEFT of it — including the shared `wait-for-apt.sh` (#1855), which is called with the
    # capped budget rather than the raw one — so no combination of inner bounds can exceed it. Worst case for the
    # whole step = the budget + one `--kill-after` grace + the 60 s smoke print ≈ 9.5 min, and a
    # whole GREEN shard takes 6m23s today (run 32175994386, shard 0: 19:40:40 → 19:47:03), so
    # even the worst case leaves the tests their room inside the 20-minute cap. A healthy run of
    # this step takes ~70 s (same job: 4 s download, 58 s apt).
    #
    # NOTE `--with-deps` STAYS, and the reason is measured rather than assumed. On `ubuntu-24.04`
    # every shared library Chromium links against is already in the image — libnss3, libgbm1,
    # libatk1.0-0t64, libatk-bridge2.0-0t64, libatspi2.0-0t64, libcups2t64, libdrm2, libcairo2,
    # libpango-1.0-0, libxkbcommon0, libxcomposite1, libxdamage1, libxrandr2, libasound2t64 …
    # all report "is already the newest version" — so what the flag actually installs is NINE
    # FONT packages: fonts-freefont-ttf, fonts-ipafont-gothic, fonts-tlwg-loma-otf, fonts-unifont,
    # fonts-wqy-zenhei and xfonts-{cyrillic,encodings,scalable,utils}. Dropping it would remove
    # the apt dependency and this whole failure class, and the browser would still RUN — but
    # `deploy/base-images/portal-ai/Dockerfile` installs those same faces with the same flag, so
    # CI would print its PDFs with a font set production does not have and non-Latin text would
    # render differently here than in the product, silently. That is the precise divergence this
    # step exists to remove. So: keep the flag, and fix the orphan.
    #
    # (`timeout` exists on the Linux runners; the AGENTS.md warning about it is specific to the
    # macOS dev host.)
    #
    # Keep PLAYWRIGHT_VERSION in step with deploy/base-images/portal-ai/Dockerfile.
    - name: "Provision the headless browser (infra, not a test)"
      env:
        PLAYWRIGHT_VERSION: 1.62.1
        PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        # 🚨 The step's ONE ceiling. Every wait and attempt below is clamped to what is left of
        # it, so the two bounds under it can be tuned without anyone re-deriving a worst case.
        BROWSER_STEP_BUDGET: 480
        BROWSER_INSTALL_TIMEOUT: 180
        # 240 → 120. #1858 sized this to outlast a stuck holder, but the holder it was actually
        # outlasting was OUR OWN orphan (see above) — which is now reaped instead of waited on,
        # in ~0 s. What is left to wait for is the runner image's background apt, which is what
        # the wait was written for: a routine unattended-upgrades run is seconds, not minutes.
        APT_LOCK_WAIT: 120
      run: |
        set -euo pipefail
        sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
        sudo chown "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
        # Let apt wait on the DPKG FRONTEND lock itself, since an external wait closes only part
        # of the race: the background apt takes and releases its locks once per source, so a wait
        # can return in a release gap and the apt-get playwright spawns loses the very next
        # acquisition (run 32165453521, shard 5, twice in a row). `DPkg::Lock::Timeout` reaches
        # the invocations npx spawns, which no external wait can wrap (#1855).
        #
        # 🚨 …but it does NOT cover `/var/lib/apt/lists/lock`, which is the lock this step keeps
        # failing on. Measured on apt 2.8.3, holder present in both cases:
        #     lists lock,    with and without the option  →  "Could not get lock", 0s
        #     frontend lock, without → 0s   ·   with "12" → waited 12s
        # So #1855's "removing the window entirely" holds for the dpkg frontend lock only. The
        # lists-lock case is the one the REAP below exists for; do not read this line as covering
        # it. Kept because the frontend half is real.
        #
        # 🚨 120, not 300: the value is a wait apt will actually sit through, so it must be
        # SMALLER than the per-attempt bound. At 300 an apt blocked on the frontend lock is still
        # waiting when `timeout` kills the attempt — the diagnostic is lost and a fresh orphan is
        # created, turning a clean "Could not get lock" into another silent hang.
        echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99ci-lock-timeout >/dev/null

        deadline=$(( $(date +%s) + BROWSER_STEP_BUDGET ))
        # Seconds left in the step's budget; never negative.
        left() { local r; r=$(( deadline - $(date +%s) )); [ "$r" -gt 0 ] && echo "$r" || echo 0; }
        # min(requested, remaining) — no inner bound can outlive the ceiling.
        capped() { local b; b="$(left)"; [ "$1" -lt "$b" ] && echo "$1" || echo "$b"; }

        # The apt processes this step can legitimately have started, and so may kill — by exact
        # process name. `dpkg` and `unattended-upgr` are deliberately ABSENT: we never spawn the
        # latter, and hard-killing either can leave the package database needing
        # `dpkg --configure -a`. Those two are waited for (wait-for-apt.sh), never reaped.
        # 🚨 `|| :` is load-bearing: `pgrep` exits 1 when NOTHING matches, and under
        # `set -euo pipefail` a bare `before="$(apt_killable)"` would then abort the step with no
        # message at all — an idle runner would look like an infra failure that named nothing.
        apt_killable() { pgrep -x 'apt-get|apt' 2>/dev/null | sort -n | tr '\n' ' ' || :; }

        # 🚨 THE REAP — see the block above. Kills the apt processes THIS attempt started and
        # `timeout`'s own group kill could not touch, through `sudo`, because they are root.
        reap_our_apt() {
          local before=" $1 " p ours="" live="" waited=0
          for p in $(apt_killable); do
            case "$before" in *" $p "*) ;; *) ours="$ours $p" ;; esac
          done
          ours="${ours# }"
          [ -n "$ours" ] || return 0
          echo "::warning::the killed browser install orphaned apt (pid $ours) — it holds /var/lib/apt/lists/lock and would fail every retry with 'Could not get lock'. Terminating it." >&2
          # shellcheck disable=SC2086
          sudo kill -TERM $ours 2>/dev/null || true
          while [ "$waited" -lt 15 ]; do
            live=""
            for p in $ours; do
              if sudo kill -0 "$p" 2>/dev/null; then live="$live $p"; fi
            done
            if [ -z "$live" ]; then
              echo "orphaned apt reaped after ${waited}s" >&2
              return 0
            fi
            sleep 1
            waited=$(( waited + 1 ))
          done
          echo "::warning::orphaned apt (pid${live}) ignored SIGTERM for 15s — sending SIGKILL" >&2
          # shellcheck disable=SC2086
          sudo kill -KILL $live 2>/dev/null || true
          sleep 2
          return 0
        }

        # `install` is idempotent, so phase 2 re-runs it purely for its apt half: the browser is
        # already on disk by then and only the dependency install actually does anything.
        install_browser() {
          local budget rc=0
          budget="$(capped "$BROWSER_INSTALL_TIMEOUT")"
          [ "$budget" -gt 0 ] || return 125    # 125 = the step's budget is spent
          timeout --signal=TERM --kill-after=30 "$budget" \
            npx --yes "playwright-core@${PLAYWRIGHT_VERSION}" install "$@" --only-shell chromium || rc=$?
          return $rc
        }

        # 124 is `timeout`'s own "the command was still running" code (137 if it needed SIGKILL) —
        # call it out, because a STALL and a FAILED download want different follow-up (CDN/runner
        # network vs a bad version pin), and the two are indistinguishable once both read as
        # "attempt failed".
        classify() {
          case "$1" in
            125) echo "::warning::$2 attempt $3 skipped — the step's ${BROWSER_STEP_BUDGET}s budget is spent" >&2 ;;
            124|137) echo "::warning::$2 attempt $3 HUNG (no completion within the bound) and was killed — treating as a failed attempt" >&2 ;;
            *) echo "$2 attempt $3 failed (exit $1); retrying" >&2 ;;
          esac
        }

        # ── Phase 1: the browser binary, straight from the CDN. No apt in this path at all. ──
        ok=0
        for attempt in 1 2 3; do
          rc=0; install_browser || rc=$?
          if [ $rc -eq 0 ]; then ok=1; break; fi
          classify "$rc" "browser download" "$attempt"
          [ $rc -ne 125 ] || break
          delay=$(( 10 * attempt ))
          [ "$(left)" -gt "$delay" ] || break
          echo "retrying in ${delay}s ($(left)s of the step budget left)" >&2
          sleep "$delay"
        done
        if [ $ok -eq 0 ]; then
          echo "::error::could not download the headless browser within ${BROWSER_STEP_BUDGET}s — this is a CDN/INFRA failure, not a test failure."
          exit 1
        fi

        # ── Phase 2: the system packages `--with-deps` installs. The ONLY apt in this step. ──
        deps_ok=0
        for attempt in 1 2 3; do
          # ONE implementation of the wait, shared with clients.yml (#1855) — two copies of it are
          # what let #1858 fix this file while the identical `flock` no-op stayed in clients.yml.
          # $GITHUB_WORKSPACE, not a relative path: the clients job runs with a working-directory
          # where `.github/…` does not exist. Clamped to the step budget like everything else.
          "$GITHUB_WORKSPACE/.github/scripts/wait-for-apt.sh" "$(capped "$APT_LOCK_WAIT")"
          before="$(apt_killable)"
          rc=0; install_browser --with-deps || rc=$?
          if [ $rc -eq 0 ]; then deps_ok=1; break; fi
          # Only after a KILL can we have orphaned anything; an attempt that returned on its own
          # (exit 100 "could not get lock") left nothing of ours behind, and reaping then could
          # only hit a background apt that happened to start inside our window.
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then reap_our_apt "$before"; fi
          classify "$rc" "browser dependency install" "$attempt"
          [ $rc -ne 125 ] || break
          delay=$(( 10 * attempt ))
          [ "$(left)" -gt "$delay" ] || break
          echo "retrying in ${delay}s ($(left)s of the step budget left)" >&2
          sleep "$delay"
        done
        # 🚨 A FAILED DEPENDENCY INSTALL IS NOT A FAILED STEP. `--with-deps` is a MEANS to a
        # capability — "this runner can launch Chromium and print a PDF" — and that capability is
        # PROVEN directly forty lines below, by launching it and printing one. Exiting here fails
        # on the proxy while the evidence sits further down, and on GitHub's ubuntu-24.04 image the
        # libraries are usually already present, so the proxy is wrong in the common case.
        #
        # This was not a theoretical trade-off: apt contention on the hosted runners failed this
        # step six times in one morning across `main` and three PRs, and because `Consolidate test
        # results` is the repo's ONE required check, every one of those blocked every merge. The
        # browser downloaded fine each time.
        #
        # If the libraries really are missing, the smoke print below fails and the step still
        # fails — carrying this warning as its context. Strictly no loss of safety: the gate moves
        # from "did apt run?" to "does the browser work?", which is the question the tests ask.
        if [ $deps_ok -eq 0 ]; then
          echo "::warning::the system packages '--with-deps' installs could not be applied within ${BROWSER_STEP_BUDGET}s (APT/INFRA). Continuing: the smoke print below decides, because it measures the capability directly."
          deps_note="the '--with-deps' install did NOT complete on this runner, so a missing system library is the likely cause. "
        else
          deps_note=""
        fi
        # The binary is named differently per platform (see the Dockerfile); match both so this
        # keeps working if the runner architecture ever changes.
        BROWSER="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \
          \( -name headless_shell -o -name chrome-headless-shell \) | head -n 1)"
        if [ -z "$BROWSER" ]; then
          echo "::error::the browser installed but no headless-shell binary was found under $PLAYWRIGHT_BROWSERS_PATH"
          find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3
          exit 1
        fi
        "$BROWSER" --version
        # 🚨 Give the browser back its SANDBOX. Ubuntu 23.10+ (this runner is 24.04) restricts
        # unprivileged user namespaces through AppArmor — and an unprivileged user namespace is
        # exactly what Chromium's namespace sandbox is built from. Without this the browser
        # aborts with "No usable sandbox!" and every PDF test fails with a rendering error that
        # looks like a defect in the export. Note the direction: this ENABLES a security
        # mechanism. The alternative — passing --no-sandbox in CI — would have CI exercise a
        # weaker configuration than a properly configured host runs, which is precisely the
        # divergence this step exists to remove. The knob is checked for existence because a
        # kernel without it has no such restriction to lift.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        # Prove it can actually PRINT here, not merely that it installed. This is the property
        # every PDF test depends on, and asserting it in the infra step turns an environment
        # problem into one unambiguous failure instead of a scattering of plausible-looking
        # test failures across four shards (which is exactly how this was found).
        # `timeout` is mandatory, not belt-and-braces: --print-to-pdf contracts to WRITE the PDF,
        # not to exit afterwards (the renderer waits on the file, not on the process, for exactly
        # this reason). An unbounded smoke print would hang the shard instead of failing it.
        printf '<!doctype html><title>smoke</title><p>smoke</p>' > /tmp/mw-smoke.html
        timeout 60 "$BROWSER" --headless=new --disable-gpu --disable-dev-shm-usage \
          --no-pdf-header-footer --user-data-dir=/tmp/mw-smoke-profile \
          --print-to-pdf=/tmp/mw-smoke.pdf file:///tmp/mw-smoke.html 2>/tmp/mw-smoke.err || true
        if [ ! -s /tmp/mw-smoke.pdf ]; then
          echo "::error::the headless browser cannot print a PDF on this runner — ${deps_note}this is an INFRA failure, not a test failure."
          cat /tmp/mw-smoke.err >&2 || true
          exit 1
        fi
        echo "browser smoke print OK ($(wc -c < /tmp/mw-smoke.pdf) bytes)"
        # First entry in PixelRenderingOptions.EnvironmentVariables, so the renderer's probe
        # resolves this exact binary rather than whatever browser the runner image happens to
        # carry.
        echo "MESHWEAVER_CHROMIUM_PATH=$BROWSER" >> "$GITHUB_ENV"
    - name: Run Tests
      env:
        # The runner VM is destroyed after the job, so Testcontainers' resource
        # reaper has nothing to reap — disabling it removes an implicit Docker Hub
        # pull (one more thing that can fail the shard from outside our code).
        TESTCONTAINERS_RYUK_DISABLED: true
        DOTNET_ENVIRONMENT: Development
        Logging__LogLevel__Default: Warning
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_TOTAL: 6
        # Native-crash diagnosability (SIGSEGV/SIGABRT of a test host): the runtime
        # writes a mini core dump before dying, collected into the shard artifact.
        # First seen: FutuRe.Test exit=139 on the first native-host run — not
        # reproducible on macOS-arm64 or linux-arm64 locally, so the dump is the
        # only window into the runner-only crash.
        DOTNET_DbgEnableMiniDump: 1
        DOTNET_DbgMiniDumpType: 2
        DOTNET_DbgMiniDumpName: /tmp/coredumps/%e-%p.dmp
      run: |
        # EVERY test project runs — no exclusion list (see .github/scripts/shard-assign.sh).
        # PostgreSql and Cosmos come up via Testcontainers using pre-installed Docker,
        # Orleans via in-proc TestCluster, Acme/FutuRe via dynamic Code-piece compilation.
        #
        # set +e so a crashed/aborted test host doesn't terminate the loop — we
        # want EVERY project to attempt to run, then the exit-marker gate below
        # fails the shard on anything non-zero.
        set +e
        : > test/test-results.log
        # Truncated, not appended: a stale file would let the drift report below describe
        # units this shard never ran.
        : > test/measured-weights.tsv
        mkdir -p /tmp/coredumps

        # ── Shard assignment ────────────────────────────────────────────────
        # 🚨 The SAME script the build job used to decide what went into THIS
        # shard's artifact. Duplicating the logic here (as two inline copies of
        # the weight table + LPT loop) would let the two silently diverge, and a
        # shard would try to run a project whose bin it never downloaded.
        mapfile -t selected < <(.github/scripts/shard-assign.sh)
        # `set +e` is in force above, so a broken script would leave `selected`
        # empty and the shard would run NOTHING and report green. Fail loudly.
        if [ "${#selected[@]}" -eq 0 ]; then
          echo "::error::shard-assign.sh produced no projects for shard $SHARD_INDEX/$SHARD_TOTAL — refusing to report a green shard that ran nothing."
          exit 1
        fi
        echo "Shard $SHARD_INDEX/$SHARD_TOTAL runs ${#selected[@]} projects"

        # ── Run each assigned project's native xUnit v3 host ─────────────────
        for entry in "${selected[@]}"; do
          # A heavyweight may be SPLIT across shards, arriving as `<csproj>#<part>/<parts>`.
          # Each part runs in its own process on its own runner, so the halves share
          # nothing — no ports, no containers, no state. maxParallelThreads:1 is
          # per-process and is unaffected.
          csproj="${entry%%#*}"
          partspec="${entry#*#}"
          if [ "$partspec" = "$entry" ]; then part=1; parts=1; else
            part="${partspec%%/*}"; parts="${partspec##*/}"
          fi
          name=$(basename "$csproj" .csproj)
          label="$name"
          [ "$parts" -gt 1 ] && label="$name (part $part/$parts)"
          dir=$(dirname "$csproj")/bin/Release/net10.0
          # Helper projects (TestDomain, Hub.Fixture, AI.Test.FakeCli) ship no
          # xunit.v3 host — nothing to run. Recorded so the log shows they were
          # consciously skipped, not lost.
          # 🚨 Distinguish the two "nothing to run" cases. A missing bin TREE means this
          # shard's artifact never carried the project (packaging or assignment
          # mismatch) — reporting exit=0 there would let a shard read GREEN having run
          # nothing. Only a present bin with no xunit host is a genuine helper project.
          if [ ! -d "$(dirname "$csproj")/bin" ]; then
            echo "::error::$name: bin tree absent — this shard's artifact did not contain it (build/test shard-assign mismatch)."
            echo "[CI] $name exit=97 MISSING_BIN (artifact did not contain this project)" >> test/test-results.log
            # Same reason as the crash recorder below: a project that produced NO verdict must
            # not be invisible to every trx reader. It has no bin dir, so the result goes beside
            # the csproj where the artifact glob (test/**/*.trx) still picks it up.
            mkdir -p "$(dirname "$csproj")/TestResults"
            if ! python3 .github/scripts/record-host-crash.py \
              "$(dirname "$csproj")/TestResults/$name.trx" "$name" 97 \
              "MISSING_BIN: this shard's artifact did not contain the project, so it never ran. Build/test shard-assign mismatch."; then
              echo "::error::$name: could not record MISSING_BIN into a trx — this project stays invisible to every trx reader."
              echo "[CI] $name exit=95 CRASH_RECORD_FAILED (MISSING_BIN could not be written into a trx — read the marker above, not the trx)" >> test/test-results.log
            fi
            continue
          fi
          if [ ! -f "$dir/$name.dll" ] || [ ! -f "$dir/xunit.v3.core.dll" ]; then
            echo "[CI] $name exit=0 (helper project — no xUnit v3 test host)" >> test/test-results.log
            continue
          fi
          echo "::group::$name"
          # `timeout 8m`: per-project wall-clock cap — the hang backstop (a
          # fixture-init or between-class hang has no in-process watchdog).
          # Sized to the slowest legitimate project + headroom: AI.Test measures
          # ~190 s locally post-fix (was 460 s before the hidden-failure +
          # LookupCompilationError-timeout fixes), ≈5.5 min at the observed
          # ~1.7× CI/local ratio. A kill here surfaces as exit=124/137 and
          # fails the shard via the marker gate — never silently (under the old
          # trx-only gate, AI.Test was killed at the cap and read GREEN on
          # every run).
          # CWD = the project's bin dir, exactly like `dotnet test` ran the
          # host: appsettings.json + xunit.runner.json + TestData resolve there.
          mkdir -p "$dir/TestResults"
          # For a split project, enumerate the assembly's classes and take every Nth from
          # the SORTED list. Deterministic, and self-maintaining: a newly added test class
          # is distributed automatically without anyone editing the weight table.
          classargs=()
          trxname="$name"
          if [ "$parts" -gt 1 ]; then
            mapfile -t allclasses < <( cd "$dir" && dotnet "$name.dll" -list classes 2>/dev/null \
              | grep -E "^[A-Za-z_][A-Za-z0-9_.]*$" | sort )
            if [ "${#allclasses[@]}" -eq 0 ]; then
              echo "::error::$label: could not enumerate test classes — refusing to run a partial shard silently."
              echo "[CI] $name exit=96 NO_CLASSES (class enumeration failed for a split project)" >> test/test-results.log
              if ! python3 .github/scripts/record-host-crash.py \
                "$dir/TestResults/$name.part$part.trx" "$label" 96 \
                "NO_CLASSES: class enumeration failed for a split project, so this part ran nothing."; then
                echo "::error::$label: could not record NO_CLASSES into a trx — this part stays invisible to every trx reader."
                echo "[CI] $name exit=95 CRASH_RECORD_FAILED (NO_CLASSES could not be written into a trx — read the marker above, not the trx)" >> test/test-results.log
              fi
              continue
            fi
            for ((ci=part-1; ci<${#allclasses[@]}; ci+=parts)); do
              classargs+=(-class "${allclasses[$ci]}")
            done
            trxname="$name.part$part"
            echo "$label: ${#classargs[@]} of ${#allclasses[@]} classes"
          fi
          started=$SECONDS
          # The run is not dark (maintainer, 2026-08-30: "we are completely in the dark in the test
          # runs"): a timestamped line says which host starts now, -showLiveOutput streams the test
          # bases' TEST START / TEST END lines as they happen instead of holding them for the file,
          # and -longRunning names any test still running after 60s WHILE it runs — so a wedge is
          # readable in the job log before the 8m cap kills the host.
          echo "[CI] $(date -u +%H:%M:%S) ▶ $label starting (${#classargs[@]} class arg(s))"
          ( cd "$dir" && timeout --signal=TERM --kill-after=30s 8m \
              dotnet "$name.dll" -trx "TestResults/$trxname.trx" -showLiveOutput -longRunning 60 "${classargs[@]}" )
          rc=$?
          # Wall-clock for THIS unit. This is the number shard-assign.sh's weight table is
          # made of, so record it rather than making the next person reconstruct it from
          # log timestamps — a table nobody can cheaply re-measure is a table that rots,
          # and the 2026-08-04 one rotted for three weeks at ~170 s of long pole per run.
          elapsed=$(( SECONDS - started ))
          printf '%s\t%s\n' "$entry" "$elapsed" >> test/measured-weights.tsv
          # ── Classify the host's exit code ─────────────────────────────────
          # 🚨 xUnit v3's native host returns THE COUNT OF FAILING TESTS as its
          # exit code. So an ordinary "one assertion failed" run exits 1 — which
          # the old two-branch classifier lumped in with genuine crashes and the
          # downstream gates then announced as "a test host exited non-zero
          # (failure, crash, or timeout kill)". #1242 was filed on exactly that
          # phrasing: nine shard steps read as dying hosts when every one was a
          # plain, single, named assertion failure from a host that ran to
          # completion and printed its summary.
          #
          # The trx is the discriminator. Compare rc against the number of
          # Failed results the host actually recorded:
          #   rc == trx-failed-count  → plain test failures (the common case)
          #   rc != trx-failed-count  → the host exited for a reason the trx
          #                             cannot explain: it crashed AFTER
          #                             streaming green results, or died before
          #                             writing its results at all. THAT is the
          #                             case the exit-marker gate exists for.
          # Signal deaths and wall-clock kills are named outright, since their
          # codes are fixed and can never be a failure count in practice.
          trxfile="$dir/TestResults/$trxname.trx"
          trxfails=0
          if [ -f "$trxfile" ]; then
            trxfails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"' "$trxfile" | wc -l | tr -d ' ')
          fi
          # `crash` is set for every outcome in which the host did NOT complete. It is the
          # single switch that decides whether the crash gets written INTO the trx below —
          # deliberately one variable rather than a call per branch, so a new exit code added
          # to this case cannot be given a marker without also being given a trx result.
          crash=""
          case "$rc" in
            0)
              marker="[CI] $name exit=0" ;;
            124|137)
              marker="[CI] $label exit=$rc TIMEOUT (8m wall-clock cap hit — likely fixture/init hang)"
              crash="TIMEOUT: killed at the 8m wall-clock cap — a fixture/init hang, not a test failure. The last TEST_START without a matching TEST_END in collected-logs/_meshweaver-test-trace.log names the test it was stuck in." ;;
            132) marker="[CI] $label exit=$rc SIGNAL SIGILL (host died on a signal, not an assertion)"
              crash="SIGNAL SIGILL: the host died on a signal, not an assertion." ;;
            134) marker="[CI] $label exit=$rc SIGNAL SIGABRT (host died on a signal, not an assertion)"
              crash="SIGNAL SIGABRT: the host died on a signal, not an assertion (FailFast / abort)." ;;
            135) marker="[CI] $label exit=$rc SIGNAL SIGBUS (host died on a signal, not an assertion)"
              crash="SIGNAL SIGBUS: the host died on a signal, not an assertion." ;;
            139) marker="[CI] $label exit=$rc SIGNAL SIGSEGV (host died on a signal, not an assertion)"
              crash="SIGNAL SIGSEGV: the host died on a signal, not an assertion — see #613 (use-after-unload of a collectible ALC). A mini dump is in collected-logs/." ;;
            *)
              # 🚨 xUnit v3 exits 1 for ANY number of failures — NOT with the failure count. The
              # earlier rule `rc == trxfails` held only for the one-failure case by coincidence:
              # on main 81f8869d5 (2026-08-30) Hosting.Monolith.Test printed its normal summary
              # `Total: 331, Failed: 2` and exited 1, and this branch called it a host crash
              # ("MASKED … host crashed after streaming results") and wrote a synthetic
              # HOST_CRASHED over two ordinary flakes. A host that recorded failures and exited
              # below the signal range (128+) completed normally: that is TESTFAIL. A crash is a
              # signal exit (handled above), no trx at all, or a non-zero exit with NOTHING
              # recorded as failed — never a healthy summary with rc<128.
              if [ -f "$trxfile" ] && [ "${trxfails:-0}" -gt 0 ] && [ "$rc" -lt 128 ]; then
                marker="[CI] $name exit=$rc TESTFAIL ($trxfails failing test(s) recorded in trx; xUnit v3 exits 1 for any failure; the host completed normally)"
              elif [ ! -f "$trxfile" ]; then
                marker="[CI] $label exit=$rc MASKED (no trx written — the host died before recording any result)"
                crash="MASKED: exit=$rc with no trx — the host died before recording any result."
              else
                marker="[CI] $label exit=$rc MASKED (trx records $trxfails failing test(s), which does not explain exit=$rc — host crashed after streaming results)"
                crash="MASKED: exit=$rc, but the trx records only $trxfails failing test(s) — that does not explain the exit code, so the host crashed AFTER streaming results."
              fi ;;
          esac
          # ── The crash becomes a FAILED RESULT in the trx ────────────────────
          # 🚨 Not a seventh place that re-checks the exit marker — the point is that pass/fail
          # evidence and liveness evidence stop being two channels. Every reporter downstream
          # (the trx gate, this shard's summary, the per-shard and consolidated GitHub checks)
          # reads the trx and ONLY the trx; a host that streamed three green results and then
          # took a SIGSEGV therefore had all four of them announce "3 passed" over a dead
          # process. That is what MeshWeaver.Content.Test's exit=139 did (#2495). Writing the
          # crash into the file they all parse is what makes a pass over a crash unstateable,
          # including by a reporter added later that nobody remembers to teach.
          if [ -n "$crash" ]; then
            mkdir -p "$(dirname "$trxfile")"
            if ! python3 .github/scripts/record-host-crash.py "$trxfile" "$name" "$rc" "$crash"; then
              echo "::error::$label: could not record the host crash into $trxfile — the trx still reports only what the host streamed."
              echo "[CI] $name exit=95 CRASH_RECORD_FAILED (the crash could not be written into the trx — read the marker above, not the trx)" >> test/test-results.log
            fi
          fi
          echo "$marker elapsed=${elapsed}s"
          echo "$marker elapsed=${elapsed}s" >> test/test-results.log
          echo "::endgroup::"
        done

        # ── Weight-table drift report (SUMMARY ONLY — never a gate) ──────────
        # 🚨 Deliberately not a failing check. A shard that ran green must never go red
        # because a project got slower; that would make an ordinary perf change look like
        # a test failure. But drift must not be SILENT either: the LPT loop balances the
        # NUMBERS in the table, so when they stop matching the clock it still reports six
        # perfectly even shards while one runner sits on the long pole. The only symptom
        # is a slow run nobody attributes to the table, and that is exactly how the
        # 2026-08-04 weights rotted for three weeks at ~170 s of long pole per run.
        #
        # The table comes from shard-assign.sh --print-weights — the SAME table the
        # assignment uses, read ONCE. Never inline a second copy here.
        if [ -s test/measured-weights.tsv ]; then
          .github/scripts/shard-assign.sh --print-weights > /tmp/weight-table.txt 2>/dev/null || : > /tmp/weight-table.txt
          {
            echo "### ⏱️ Shard ${SHARD_INDEX} — measured vs. weight table"
            echo
            echo "| unit | table | measured | drift |"
            echo "|---|--:|--:|--:|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r entry secs; do
            [ -z "${entry:-}" ] && continue
            csproj="${entry%%#*}"
            nm="$(basename "$csproj" .csproj)"
            pspec="${entry#*#}"
            if [ "$pspec" = "$entry" ]; then np=1; unit="$nm"; else
              np="${pspec##*/}"; unit="$nm (part ${pspec%%/*}/${np})"
            fi
            # Whole-project weight from the table; a part carries 1/np of it.
            tw=$(awk -v n="$nm" '$2 == n { print $1; exit }' /tmp/weight-table.txt)
            if [ -n "${tw:-}" ] && [ "$np" -gt 0 ] && [ "$tw" -gt 0 ]; then
              expect=$(( tw / np ))
              [ "$expect" -lt 1 ] && expect=1
              d=$(( (secs - expect) * 100 / expect ))
              delta=$(( secs - expect )); abs=${delta#-}; absd=${d#-}
              # Worth re-measuring only when the drift is BOTH proportionally and
              # absolutely large — a 1 s project doubling to 2 s is noise, not drift.
              flag=""
              if [ "$absd" -ge 25 ] && [ "$abs" -gt 30 ]; then flag=" ⚠️"; fi
              echo "| \`${unit}\` | ${expect}s | ${secs}s | ${d}%${flag} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`${unit}\` | _unlisted_ | ${secs}s | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < test/measured-weights.tsv
          {
            echo
            echo "> ⚠️ = re-measure this entry in \`.github/scripts/shard-assign.sh\` (drift ≥25% and >30 s)."
            echo "> Table weights are wall-clock seconds for the WHOLE project; a split unit shows its share."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0
    - name: Collect test logs for artifact
      if: always()
      run: |
        mkdir -p collected-logs
        # ── Symbols for any host that died on a SIGNAL ──────────────────────────
        # A core dump without symbols answers "it segfaulted" and almost nothing
        # else: gdb/lldb cannot name a single frame, so the fault site stays
        # unknown and every hypothesis stays unfalsifiable. That is exactly where
        # the 2026-08-04 FutuRe SIGSEGV investigation ran out of road — the dump
        # was collected, but nothing to symbolise it against.
        #
        # Only for projects whose marker shows a signal death (exit=13x), because
        # a test bin is ~100-800 MB and we must not pay that on every green run.
        # dll + pdb only (no runtimeconfig/deps/content) keeps it to the managed
        # symbols a stack walk actually needs. Also record the runtime patch the
        # dump was produced by — the matching DAC is what makes SOS work at all.
        while read -r sigproj; do
          [ -z "$sigproj" ] && continue
          bindir=$(find test -type d -path "*/$sigproj/bin/Release/net10.0" | head -1)
          [ -z "$bindir" ] && continue
          echo "Collecting symbols for signal-killed $sigproj from $bindir"
          mkdir -p "collected-logs/symbols-$sigproj"
          find "$bindir" -maxdepth 1 \( -name '*.dll' -o -name '*.pdb' \) \
            -exec cp {} "collected-logs/symbols-$sigproj/" \; 2>/dev/null || true
          dotnet --list-runtimes > "collected-logs/symbols-$sigproj/_runtimes.txt" 2>/dev/null || true
        done < <(grep -oE '\[CI\] [A-Za-z0-9._]+ exit=13[0-9]' test/test-results.log 2>/dev/null \
                 | awk '{print $2}' | sort -u)
        # Find all test-logs directories and collect their contents without renaming
        find . -path "*/bin/*/test-logs/*.log" -type f -exec cp {} collected-logs/ \; 2>/dev/null || true
        # The MonolithMeshTestBase phase trace + dispose trace live in the
        # process tempdir (Path.GetTempPath() == /tmp on the runner). They
        # carry the per-class INIT_MEM / DISPOSE_MEM lines that pinpoint
        # which test class drives a shard's memory growth. Copy with rename so
        # they don't collide.
        if [ -f /tmp/meshweaver-test-trace.log ]; then
          cp /tmp/meshweaver-test-trace.log collected-logs/_meshweaver-test-trace.log
        fi
        # Per-class INIT → DISPOSE memory delta summary (one line per test instance):
        # managed=… rss=… rssAnon=… unmanaged=… shared=0|1
        # rssAnon (Linux only) is where the Autofac Reflection.Emit factory pin lives;
        # unmanaged = rss − managed is the portable approximation. Grep this file to
        # find the worst leakers without wading through the full per-event trace.
        if [ -f /tmp/meshweaver-memory-delta.log ]; then
          cp /tmp/meshweaver-memory-delta.log collected-logs/_meshweaver-memory-delta.log
        fi
        # Native-crash mini dumps (DOTNET_DbgEnableMiniDump) — present only when a
        # test host died on a signal; the exit-marker gate reds the shard, this is
        # the forensic payload.
        if compgen -G '/tmp/coredumps/*.dmp' > /dev/null; then
          cp /tmp/coredumps/*.dmp collected-logs/
        fi
    - name: "Upload artifact: shard test results"
      uses: actions/upload-artifact@v7
      if: always()
      with:
        # Unique per shard so the parallel matrix legs don't clobber each
        # other; collect-results downloads them all by the testResults-shard* glob.
        name: testResults-shard${{ matrix.shard }}
        path: |
          test/**/*.trx
          test/test-results.log
          collected-logs/
        compression-level: 9
        retention-days: 15
    # 🚨 AFTER the upload on purpose: this step can RED the shard, and the logs it reds on are the
    #    evidence. Uploading first means the artifact exists whichever way the gate goes.
    #
    #    What it catches is silent by construction. A content type not registered on the hub that
    #    READS it does not throw — the `$type` will not resolve, the value degrades to a raw
    #    JsonElement, and everything downstream reads it as absent: an `is MyType` check misses, a
    #    view renders empty, a reactive wait never completes. The message-payload equivalent is
    #    loud ("type 'X' is not registered in this hub's TypeRegistry", with a NACK); the content
    #    equivalent is a warning nothing was reading.
    #
    #    🚨 The warning became load-bearing on 2026-09-02. `MessageService.Post` used to log via
    #    `JsonSerializer.Serialize(ret, …)`, and that serialize registered every posted payload
    #    type as a side effect (ObjectPolymorphicConverter.Write → GetOrAddType). #3056 removed it
    #    — correctly; logging must not register types — and with the net gone, everything that had
    #    relied on "registered because it was once posted" surfaces here. It surfaced the same day
    #    as a validator that silently stopped validating.
    - name: "Gate: no content degraded to an untyped JsonElement"
      if: always()
      run: bash .github/scripts/check-untyped-content.sh collected-logs
    # ── Per-shard surfacing: publish THIS shard's results as soon as it
    #    finishes, so you don't wait for the slowest sibling + the collector to
    #    see shard 0's outcome. The collect-results job re-consolidates all
    #    shards into one check at the end.
    - name: Summarize test failures (this shard)
      if: always()
      run: |
        echo "### Failed tests — shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
        any=0
        for trx in $(find test -name '*.trx' 2>/dev/null | sort); do
          fails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"[^>]*>' "$trx" \
                  | grep -oE 'testName="[^"]*"' \
                  | sed -E 's/testName="([^"]*)"/\1/' | sort -u)
          if [ -n "$fails" ]; then
            any=1
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "::error title=Test failed (shard ${{ matrix.shard }})::$t"
              echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$fails"
          fi
        done
        if [ "$any" = "0" ]; then
          echo "_No failed tests in trx for shard ${{ matrix.shard }}. A crashed/killed host is NOT covered by this silence: since #2495 it is written INTO the trx as a \`<project>.HOST_CRASHED\` failure by .github/scripts/record-host-crash.py, so it would be listed above; the exit-marker gate below is the second, independent check._" >> "$GITHUB_STEP_SUMMARY"
        else
          # 🚨 GATE (TRX-based, reporter-independent): fail the shard on any test
          # failure recorded in the trx. The Publish step below is a best-effort
          # reporter whose GitHub-API call can be rate-limited (429 when shards
          # publish concurrently); a throttled reporter must NEVER be the pass/fail
          # gate. This trx grep + the exit-marker gate below own the gate.
          echo "::error::Shard ${{ matrix.shard }}: failing tests in trx — failing the shard."
          exit 1
        fi
    - name: Publish Test Results (this shard)
      uses: EnricoMi/publish-unit-test-result-action@v2.24.0
      if: always()
      # Best-effort reporter ONLY — the TRX-summarize step above is the gate.
      # action_fail removed + continue-on-error so a GitHub-API 429 (concurrent
      # shard publishes) can't fail the build; test failures fail via the trx gate.
      continue-on-error: true
      with:
        # Per-shard check so the matrix legs don't clobber each other's
        # check-run; distinct from the collector's "Test Results" check.
        check_name: "Test Results (shard ${{ matrix.shard }})"
        files: |
          test/**/*.trx
    - name: Fail on non-zero project exit (this shard)
      # A test host that ABORTS mid-run (SIGABRT/FailFast → exit 134) streams
      # green results for every COMPLETED test and then dies: the trx shows zero
      # failures while in-flight + not-yet-run tests silently VANISH from the
      # count. Same for an 8m wall-clock kill (124/137) and for xunit
      # catastrophic failures that exit 1 with an all-green trx. The
      # per-project exit markers are the only faithful record — gate on them.
      # Each marker is already CLASSIFIED (TESTFAIL / TIMEOUT / SIGNAL / MASKED)
      # by the run step, so the marker text says which of those actually
      # happened — do not re-editorialise it here.
      # Last step so the artifact upload + per-shard publish above already ran.
      if: always()
      run: |
        bad=$(grep -E 'exit=[1-9]' test/test-results.log || true)
        if [ -n "$bad" ]; then
          echo "::error::Shard ${{ matrix.shard }}: a test host exited non-zero — see the classification on each marker below (TESTFAIL = ordinary failing tests, TIMEOUT/SIGNAL/MASKED = the host itself died):"
          echo "$bad"
          exit 1
        fi

  # ──────────────────────── COLLECT RESULTS ────────────────────────
  # Single fan-in: pull every shard's results and produce ONE consolidated
  # "Test Results" check plus a combined step summary. This job is the run's
  # pass/fail gate for tests + crashed hosts. (A shard job that infra-fails reds
  # the run on its own — GitHub's run conclusion is failure if ANY job fails,
  # regardless of this always() collector's own conclusion.)
  # ── Where the plugin gates went (and what must exist before this is safe) ──────────────
  #
  # `plugin-gate` ("plugins build, test and bake against this PR") and `landed-modules-gate`
  # ("build every landed module against this PR") USED TO LIVE HERE. They are gone because core
  # builds the image and runs its OWN tests — it does not compile, test or bake plugins. Plugins
  # are built in the repository that owns them, against the image core just published.
  #
  # 🚨 Do not restore them casually, and do not delete this note: it is the only remaining record
  # of the bug class they covered. Plugin node source is Roslyn-compiled AT RUNTIME against this
  # assembly, FROM A DIFFERENT REPO. Deleting a public member here is therefore invisible to every
  # repo-local check — a grep says "no callers" — and the plugins repo's own CI compiled against a
  # PUBLISHED image, so it kept passing until that tag was rebuilt. Both repos stayed green and the
  # break landed in whatever deployment built from source first. That is exactly how
  # `AiSettingsNodeType.AddSkillSource` was deleted with a live caller in
  # `Store/Plugin/Source/Localizer.cs`: Store failed to compile, and since nearly every module
  # depends on Store, every plugin root node fell back to an untyped overlay — after burning a 60s
  # settle timeout PER PACKAGE.
  #
  # 🚨 WHAT REPLACES IT — and it is a PRECONDITION, not a follow-up. The protocol is: core notifies
  # memex that a new image exists; plugins are subscribed, are notified, and build AGAINST THAT
  # IMAGE; they notify memex of the packages and versions produced. That closes the same hole, and
  # closes it better — the old gate tested a PR's framework against plugin source, while the new
  # arrangement tests every plugin against the framework that actually shipped.
  #
  # But it only closes it once the notify-and-build loop exists. Until plugins build against the
  # NEW image rather than a published tag, deleting a public member here is detected by nothing
  # until someone rebuilds by hand. See /Doc/Architecture/BuildServer.

  clients-gate:
    name: "Clients workflow verdict"
    runs-on: ubuntu-latest
    # Generous relative to the Clients workflow's own wall-clock (its long pole is the
    # Playwright job at a few minutes) and well under the .NET suite's ~22 min, so this never
    # becomes the critical path. Hitting it means Clients is WEDGED — which must be red, not
    # waited out.
    timeout-minutes: 25
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
    - name: "Resolve the Clients workflow's conclusion for this commit"
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        # On a pull_request run, github.sha is the merge commit — the Clients workflow runs on
        # the PR's HEAD, so that is the sha its runs are keyed by.
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -uo pipefail
        api="repos/${{ github.repository }}/actions/workflows/clients.yml/runs?head_sha=${HEAD_SHA}&per_page=100"
        # 🚨 "Zero runs" is only meaningful once GitHub has had time to CREATE the run. Both
        # workflows fire on the same event, so an immediate zero would be a race, and reading
        # it as "the path filter did not match" would silently re-open the very hole this gate
        # closes. So a zero is only believed after this grace period of consecutive zeros.
        ZERO_GRACE_SECONDS=180
        started=$(date +%s)
        # 🚨 A FAILED QUERY IS NOT A ZERO. An auth error, a rate limit or a network blip must never
        # collapse into "no runs exist" — that would make this gate pass on no evidence, which is
        # precisely the trapdoor it was written to close (and the reason `gh api ... || echo
        # '{"total_count":0}'` is NOT what this does). The two are tracked separately: a fetch error
        # is retried inside the poll, and if the query never succeeds the job goes RED rather than
        # reporting a verdict it never obtained.
        fetched=0
        lastError=""
        # Poll: Clients starts on the same event and normally finishes long before the .NET
        # suite, but the two are not ordered.
        for _ in $(seq 1 60); do
          if ! json=$(gh api "$api" 2>"$RUNNER_TEMP/clients-gate.err"); then
            lastError=$(tr '\n' ' ' < "$RUNNER_TEMP/clients-gate.err" | cut -c1-400)
            echo "Could not query the Clients workflow runs (retrying): ${lastError}"
            sleep 20
            continue
          fi
          fetched=1
          total=$(echo "$json" | jq -r '.total_count // 0')
          if [ "$total" = "0" ] && [ $(( $(date +%s) - started )) -lt "$ZERO_GRACE_SECONDS" ]; then
            echo "No Clients run for ${HEAD_SHA} yet — within the ${ZERO_GRACE_SECONDS}s creation grace period, waiting."
            sleep 20
            continue
          fi
          if [ "$total" = "0" ]; then
            echo "verdict=not-applicable" >> "$GITHUB_OUTPUT"
            echo "The Clients workflow did not run for ${HEAD_SHA}: this diff touches none of its path filters, so the client tree under test is unchanged from the base."
            {
              echo "### ➖ Clients: not applicable"
              echo
              echo "No \`Clients\` run for \`${HEAD_SHA}\` — this PR changes none of the paths that workflow watches."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Newest run for this sha (a re-run adds another).
          status=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .status')
          conclusion=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .conclusion // ""')
          url=$(echo "$json" | jq -r '[.workflow_runs[]] | sort_by(.run_number) | last | .html_url')
          if [ "$status" = "completed" ]; then
            echo "Clients run concluded: ${conclusion} (${url})"
            echo "verdict=${conclusion}" >> "$GITHUB_OUTPUT"
            if [ "$conclusion" = "success" ] || [ "$conclusion" = "skipped" ]; then
              {
                echo "### ✅ Clients: ${conclusion}"
                echo
                echo "[Clients run](${url})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::The Clients workflow concluded '${conclusion}' for this commit — see ${url}. Its Portal-next job builds the same tree main-cd's portal-next image leg builds, and CD's promote is all-or-nothing: merging this red stops ALL image publication."
            {
              echo "### ❌ Clients: ${conclusion}"
              echo
              echo "[Clients run](${url}) failed. \`main-cd\`'s portal-next leg runs the same build, and"
              echo "\`promote\` publishes only when every leg succeeds — so merging this stops image"
              echo "publication for the whole repo, not just the clients."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sleep 20
        done
        if [ "$fetched" = "0" ]; then
          echo "::error::Could not query the Clients workflow runs for ${HEAD_SHA} even once — last error: ${lastError}. This job reports the Clients verdict into the required check, so an unobtainable verdict is a RED, never a pass: a gate that cannot read its subject has no evidence at all."
          {
            echo "### ❌ Clients: verdict unobtainable"
            echo
            echo "Every attempt to query the \`Clients\` workflow runs for \`${HEAD_SHA}\` failed."
            echo "Last error: \`${lastError}\`"
            echo
            echo "This is deliberately a failure and not a pass — \"could not fetch\" is not \"no runs exist\"."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "::error::The Clients workflow for ${HEAD_SHA} has not completed within this job's budget — it is wedged. Refusing to report a verdict on an unfinished run."
        exit 1

  doc-gate:
    name: "Doc content compiles and runs"
    # Unlike plugin-gate this needs no credential and no fork guard: the content under test IS
    # this repo's own src/MeshWeaver.Documentation/Data, checked out with the PR. The job exists
    # because that content is Roslyn-compiled at RUNTIME in the portal and invisible to
    # `dotnet build` (the csproj embeds Data/** and explicitly removes its .cs from compilation)
    # — without this job, the doc tree's node sources and NodeType configuration lambdas ship
    # untested, and two of the four Doc NodeTypes had never been compiled by anything.
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Same wall-clock contract as plugin-gate: depends on `build` like the shards, so it runs
    # CONCURRENTLY with them; while it stays under the slowest shard it costs the PR nothing.
    timeout-minutes: 12
    outputs:
      failure: ${{ steps.gate.outputs.failure }}
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: "Download artifact: build output (shard 0)"
      uses: actions/download-artifact@v8
      with:
        name: build-output-0
    - name: Extract build output
      run: |
        set -euo pipefail
        tar -I 'zstd --long=27' -xf build-output-0.tar.zst
        rm -f build-output-0.tar.zst
    # 🚨 The bake here is a SMOKE TEST of the bake stage, NOT a delivery lane (#1725). It costs
    # almost nothing and it makes a bake-stage regression fail on the PR that causes it rather than
    # in CD.
    #
    # 🚨 Since #2064 it runs as TWO STEPS — `compile … --output` then the gate with `--seed` — the
    # same split main-cd's publish-bake makes, held in .github/scripts/bake-then-gate.sh so the two
    # lanes cannot drift. The PR lane used to bake THROUGH A MESH (one fused `--bake-output` run
    # that stood up an in-process mesh and let the mesh compile every NodeType), which is the thing
    # #1763 removed from CD and #2064 removes from here. It also makes this gate strictly stronger:
    # what renders, and what runs the `Tests` areas, is now the assembly the bake produced rather
    # than a private recompile of the same sources that nothing ever ships.
    #
    # What it deliberately no longer does is FEED the portals. Until #1725 this job's bundles were
    # uploaded as `baked-assemblies-<identity>` and published to portal storage by main-cd. That can
    # never work: the framework identity is derived from the exact binaries a host ships, and this
    # job's binaries are a DIFFERENT compilation from the ones in the shipped image. Measured on
    # commit babb3bc, same source, same runner path: every implementation assembly's MVID differs
    # between the two (Data/Layout/AI/Utils included), and 4 of the 37 canonical REFERENCE
    # assemblies differ too (Graph, Hosting, Kernel, Markdown.Collaboration) — so the two hosts
    # resolved `sd0d0daa…` and `s377941f…` for one commit, and no pod could ever adopt what this run
    # baked. The platform's own bake now runs INSIDE the shipped image (main-cd's `publish-bake`),
    # exactly as every satellite repo's does. See Doc/Architecture/CiContentBake.
    - name: "Compile + run the Doc content against this PR"
      id: gate
      run: |
        set -euo pipefail
        TESTER="$(find . -path '*/MeshWeaver.PluginTester/bin/*/mw-plugin-test.dll' | head -1)"
        if [ -z "$TESTER" ]; then
          echo "::error::mw-plugin-test.dll not in the build output — the doc gate cannot run."
          exit 1
        fi
        BAKE="${RUNNER_TEMP:-/tmp}/bake"
        # Stage src/MeshWeaver.Documentation/Data as a package root named Doc/. The staging lives
        # in a script because main-cd's publish-bake stages the SAME tree for the in-image bake —
        # the bake must publish exactly what this gate judged, so the two cannot have separate
        # copies of the staging rules.
        STAGE="${RUNNER_TEMP:-/tmp}/doc"
        bash .github/scripts/stage-doc-gate.sh src/MeshWeaver.Documentation/Data "$STAGE"
        # .github/doc-gate.allow is THIS repo's known-debt ratchet for doc content: listed
        # failures are tolerated, NEW failures fail the PR, and a listed check that starts
        # passing fails the PR until its line is removed — the list can only shrink.
        #
        # ONE bake directory PER TREE. A shared directory would let the doc gate's `--seed` see the
        # samples bundles (and the reverse), and the "declared ∩ installed" postcondition would then
        # be satisfied by bundles the run under judgement never installed.
        log="${RUNNER_TEMP:-/tmp}/doc-gate.log"
        status=0
        bash .github/scripts/bake-then-gate.sh "$TESTER" "$STAGE" "$BAKE/doc" \
          .github/doc-gate.allow "$GITHUB_SHA" "${RUNNER_TEMP:-/tmp}/doc-gate" || status=$?
        verdict="$(grep -m1 -- '^GATE FAILED' "$log" || true)"
        # ── Second stage: the samples trees — the "12k lines of C# no build ever type-checks"
        # from AGENTS.md. Same tester, same mechanics; .github/samples-gate.allow is its own
        # one-way debt ratchet (a listed entry that starts passing fails the run until removed).
        SSTAGE="${RUNNER_TEMP:-/tmp}/samples"
        bash .github/scripts/stage-samples-gate.sh samples/Graph/Data "$SSTAGE"
        slog="${RUNNER_TEMP:-/tmp}/samples-gate.log"
        sstatus=0
        bash .github/scripts/bake-then-gate.sh "$TESTER" "$SSTAGE" "$BAKE/samples" \
          .github/samples-gate.allow "$GITHUB_SHA" "${RUNNER_TEMP:-/tmp}/samples-gate" || sstatus=$?
        sverdict="$(grep -m1 -- '^GATE FAILED' "$slog" || true)"
        combined="$(printf '%s\n%s' "$verdict" "$sverdict" | grep . | head -1 || true)"
        {
          echo "failure<<GATE_EOF"
          echo "$combined"
          echo "GATE_EOF"
        } >> "$GITHUB_OUTPUT"
        if [ "$status" != "0" ] || [ "$sstatus" != "0" ]; then
          [ -n "$verdict" ] && echo "::error::Doc stage: $verdict"
          [ -n "$sverdict" ] && echo "::error::Samples stage: $sverdict"
          if [ -z "$combined" ]; then
            echo "::error::The content gate failed before it produced a verdict — no check was judged. See this job's log."
          fi
          exit 1
        fi
    # A green gate that produced no bake identity is a bake-stage REGRESSION — fail RED (no
    # continue-on-error, no "is the file there?" skip: the gate above already proved the tester ran
    # green, so the identity file is a POSTcondition). This is the whole point of keeping the bake
    # on the PR lane: the bake stage breaks HERE, on the PR that breaks it, instead of in CD after
    # the merge. bake-then-gate.sh already asserts each tree's own identity and bundles; this step
    # additionally cross-checks the TWO trees against each other and publishes the summary.
    - name: "Bake summary + identity"
      run: |
        set -euo pipefail
        mvid_file="${RUNNER_TEMP:-/tmp}/bake/doc/framework-mvid.txt"
        smvid_file="${RUNNER_TEMP:-/tmp}/bake/samples/framework-mvid.txt"
        if [ ! -s "$mvid_file" ] || [ ! -s "$smvid_file" ]; then
          echo "::error::the content gate ran green but one of its bakes wrote no identity ($mvid_file / $smvid_file) — the bake stage regressed."
          exit 1
        fi
        # Both trees are baked by the SAME binary in the SAME job, so a difference here is not a
        # cosmetic mismatch — it means one of the two resolved a framework identity the other did
        # not, and bundles keyed to it would be declined by every consumer that adopts the other.
        if [ "$(cat "$mvid_file")" != "$(cat "$smvid_file")" ]; then
          echo "::error::the doc and samples bakes resolved DIFFERENT framework identities ($(cat "$mvid_file") vs $(cat "$smvid_file")) — one of them is keyed to an identity no consumer of the other resolves."
          exit 1
        fi
        {
          echo "### 🧪 Bake stage exercised (framework $(cat "$mvid_file")) — NOT published"
          echo
          echo "This identity is this job's own build; the portals adopt the bake main-cd takes"
          echo "inside the shipped image. See Doc/Architecture/CiContentBake."
          echo
          echo '```'
          grep -h '^bake: ' "${RUNNER_TEMP:-/tmp}/doc-gate-bake.log" "${RUNNER_TEMP:-/tmp}/samples-gate-bake.log" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    # 🚨 NO artifact upload — deliberately, since #1725. These bundles are keyed to THIS job's
    # binaries, which no shipped image ever contains, so an uploaded `baked-assemblies-<identity>`
    # was adoptable by nothing: main-cd published it under an identity no pod resolves and every
    # pod kept Roslyn-compiling ~80 platform types at boot (64.8 s warm-up, compiled=80
    # alreadyBaked=4). An artifact that looks like delivery and delivers nothing is worse than no
    # artifact — it is what made that regression invisible for a whole release train. The bundles
    # pods actually adopt are baked by main-cd INSIDE the shipped image.

  licence-gate:
    name: "Dependency licences"
    # MeshWeaver ships dual-licensed Apache-2.0 / MIT. A copyleft (AGPL/GPL/LGPL) or
    # pay-to-use dependency is a licensing DEFECT — and it is invisible to every other
    # check we run: one `<PackageVersion>` line adds it, the compiler is happy, and the
    # tests are happy. #1230 (QuestPDF, pay-to-use above a revenue threshold) and a dead
    # AGPL `itext7` declaration both sat in the tree unnoticed until a manual audit.
    #
    # 🚨 NO `continue-on-error`, and NO input-shaped `if:`. This gate reads only the repo
    # and the public NuGet feed — it needs no secret, so it has no legitimate reason to be
    # skipped and no fork exemption. It runs on every PR including forks.
    needs: [precheck]
    # Mirrors `build`: the ONLY thing that skips this is the already-green-tree
    # optimisation, which means this exact tree already passed this exact gate.
    if: ${{ !cancelled() && needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # ⏱️ Depends only on `precheck`, so it runs CONCURRENTLY with the build and the test
    # shards and costs the PR no wall-clock. It restores (not builds) the solution, which
    # is what produces the project.assets.json graph it reads.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # The gate resolves licences from the RESTORED graph — direct and transitive — because a
    # copyleft dependency that arrives transitively binds us exactly as hard as a declared one.
    # No `continue-on-error`: if the restore fails, the gate has no evidence, and a gate that
    # passes on absent evidence is worse than no gate (the script fails closed on this too).
    # Same invocation as the `build` job's restore step, so the graph this gate reads is the
    # same graph CI actually builds and ships.
    - name: Restore (produces the dependency graph the gate reads)
      run: dotnet restore
    - name: Check dependency licences
      run: python3 .github/scripts/check-licenses.py --report

  workflow-shell:
    name: "CI's own shell"
    # 🚨 THE GAP THIS CLOSES: `main-cd.yml` is 2000 lines of shell that decides what is built,
    # published and rolled to the fleet — and NOTHING opened it. It fires on `workflow_run`,
    # `schedule` and `workflow_dispatch`; never on `pull_request`. So an edit to it merged on the
    # strength of being valid YAML, and its first execution was in production, on a cron.
    #
    # What that cost, measured (#2642, trap written up in #2643): a bake-only reconcile carried
    #
    #     tags=$(az acr manifest list-metadata … \
    #              --query "[?contains(tags, '${SHORT_SHA}')].tags[]" -o tsv 2>/dev/null || true)
    #
    # `contains(null, …)` THROWS on the 16 untagged manifests in that repository, jmespath aborts
    # the whole query, az exits non-zero, `2>/dev/null || true` swallows it — and the step then
    # accused a HEALTHY component: "promote's Phase C never armed a release for this sha".
    # NINE consecutive scheduled runs, ~33 hours, and the step had never once succeeded in its
    # life. An error that names the wrong culprit is worse than a silent failure; it is a silent
    # failure with directions attached.
    #
    # 🛡️ NO SKIP-TRAPDOOR. Every input is in this repository — no secret, no cluster, no registry
    # — so there is no condition under which this may decline to run and still render a tick:
    #   * no `needs:`, so nothing upstream can skip it (not even the green-tree reuse path — this
    #     job is seconds, and the reuse optimisation exists for a 70-runner-minute suite);
    #   * no input-shaped `if:`, because GitHub renders a skipped job with the same tick as a
    #     passed one;
    #   * no path filter, which is that same defect from the other side (an unrelated PR would
    #     "pass" by not running);
    #   * no `continue-on-error`;
    #   * the tools it needs are ASSERTED, and a missing one fails RED rather than quietly
    #     reducing the gate to the checks it happened to be able to run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }

    # jmespath is PINNED, and the pin is the fidelity claim: it is the engine the azure-cli
    # itself evaluates `--query` with, so "this query throws on a null field" is reproduced here
    # rather than asserted about. A venv keeps it off the runner's externally-managed python.
    - name: Assert the tools this gate needs
      run: |
        set -euo pipefail
        command -v shellcheck >/dev/null || { echo "::error::shellcheck is not on this runner"; exit 1; }
        shellcheck --version | head -2
        python3 -m venv "$RUNNER_TEMP/wfshell"
        "$RUNNER_TEMP/wfshell/bin/pip" install --quiet --disable-pip-version-check \
          'jmespath==1.0.1' 'PyYAML==6.0.2'
        echo "$RUNNER_TEMP/wfshell/bin" >> "$GITHUB_PATH"

    # 🚨 Run the self-test FIRST, and let it fail the job. An unproven gate is no gate: every
    # check below must be shown to FIRE on its defect and stay SILENT on its fix before its
    # verdict on the real tree means anything. (Same posture as `affected-modules.py --self-test`
    # in MeshWeaver.Plugins.)
    - name: "Prove the gate is non-vacuous (self-test)"
      run: python3 .github/scripts/check-workflow-shell.py --self-test

    # 🚨 This repo's .github/scripts/compile-check.py is the CANONICAL NodeType gate: every node
    # repo's lane fetches it from here at the pinned platform ref and runs it instead of its own
    # copy (node-repo-compile-check.yml). So a defect in its import-scope parser reds satellites
    # that never changed a line — as one did: it matched `using static X.Y.Type;` but captured
    # only `X.Y.Type`, re-emitting `global using X.Y.Type;` and failing CS0138 on source the mesh
    # compiles. It ran here unproven because nothing invoked it. It is proven now.
    - name: "NodeType import-scope parser can fail (self-test)"
      run: python3 .github/scripts/compile-check.py --self-test

    # The gate host every node-repo bake and gate RUNS AS since MeshWeaver#3022 — the portal's /app
    # with the tester CLI beside it (compose-gate-host.sh, fetched by the reusable lanes at their
    # platform-ref). Its rules are load-bearing (the portal's bytes win, the tester's deps.json and
    # manifest never ride), so the script proves it enforces them on every platform PR.
    - name: "The gate host composes by its rules and refuses a partial one (self-test)"
      run: bash .github/scripts/compose-gate-host.sh --self-test

    # 🚨 Every job in every workflow carries a LITERAL `timeout-minutes` <= 45 (maintainer, 2026-09-02:
    # "hard cut CI runs after 45min — we pay all this"). GitHub's default is 360; one uncapped job in
    # the module-pack lane held a runner for six hours per run across 19 concurrent Plugins runs and
    # blocked every required check behind it. Self-test first — an unproven gate is no gate.
    - name: "Every job is capped at 45 minutes — the gate can fail (self-test)"
      run: python3 .github/scripts/check-workflow-timeouts.py --self-test
    - name: "Every job is capped at 45 minutes"
      run: python3 .github/scripts/check-workflow-timeouts.py --root .

    # The merge-queue steward (merge-queue-steward.yml) decides whether a DEQUEUED pull request is
    # re-queued or left out; a wrong row in its table re-queues on nothing or rejects a flake. The
    # steward runs this same self-test before every real decision, but that lane only fires on a
    # dequeue — so a classifier regression would otherwise merge on a branch that never queued.
    - name: "The merge-queue steward's decision table holds (self-test)"
      run: python3 .github/scripts/merge-queue-steward.py --self-test

    - name: "Gate the shell CI itself runs"
      run: python3 .github/scripts/check-workflow-shell.py

    # Deliverable that needs no credential: EXECUTE main-cd's release-version recovery — the step
    # that never once succeeded — against a fixture shaped like the live registry (2101 manifests,
    # 16 of them untagged). The step is EXTRACTED from main-cd.yml by its `id:`, never copied, and
    # the harness fails red if it cannot find it or if the step stopped making the call being
    # stubbed. A copy passes while the real thing rots.
    - name: "Execute main-cd's decision steps against fixtures"
      run: python3 .github/scripts/test-cd-steps.py
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}

  shared-rules:
    name: "AGENTS.md shared rule blocks"
    # 🚨 THE GAP THIS CLOSES (MeshWeaver.Plugins#705): every repo's CLAUDE.md is a one-line
    # `@AGENTS.md` include, so AGENTS.md is not reference material someone consults when they
    # remember to — it is the instruction file loaded into every agent's context, in that repo,
    # on every session. Seven repos carry overlapping copies of the same rules, held together by
    # prose ("everything there applies here unchanged") and by hand-carrying each edit. Nothing
    # compared them.
    #
    # The worked example is four days old. On 2026-08-30 a maintainer directive ("always conserve
    # work products") was rolled to all seven repos as seven separate PRs — core#2732,
    # Plugins#954, Education#236, Reinsurance#122, SocialMedia#111, Manufacturing#34, Memex#149.
    # Had one been missed, or had one drifted the week after, nothing in the estate would have
    # said so; agents in that repo would simply have been operating under a different rule.
    #
    # 🌐 WHY THE SWEEP RUNS HERE AND COVERS EVERYONE, rather than each repo checking itself.
    # A per-repo self-check CANNOT detect the missed-repo case, structurally: a repo with no pull
    # request never runs its own gate, so "six of the seven were updated" and "all seven were
    # updated" produce identical evidence. Only a sweep that reads every repo from one place can
    # tell those apart. It runs in core because core owns the shared CI and is the platform hub;
    # it is also the schedule's home (shared-rules.yml) so a drift is caught even in a week when
    # nobody opens a pull request anywhere.
    #
    # ⚖️ THE CONSEQUENCE, CHOSEN DELIBERATELY: this reads the SATELLITES' default branches, so a
    # drift merged in a satellite turns this red and blocks core merges until it is fixed there.
    # That is the same coupling the i18n mirror guard already carries (a Plugins PR stays red
    # until the core catalogue lands) and it is the point rather than a side effect — a rule that
    # differs between repos means agents behave differently between repos, which is precisely
    # what must not merge. The remedy is always a one-PR fix in the repo the error NAMES; there
    # is no bypass, and adding one would make this gate decorative.
    #
    # 🛡️ NO SKIP-TRAPDOOR. Six of the seven repos are private, so this gate genuinely needs a
    # credential — which is exactly the situation AGENTS.md → "A gate NEVER tests its own inputs"
    # is about, because GitHub paints a skipped job with the same tick as a passed one. So:
    #   * the credential is ASSERTED and the job fails RED naming what to provision — it never
    #     asks "is the secret set?" in order to decide whether to run;
    #   * PRESENT is not VALID (chart-drift learned this on 2026-08-17: a provisioned-but-dead
    #     PAT passed an emptiness test and every run after died at checkout), so the token is
    #     PROVEN to read every repo before the comparison is trusted;
    #   * the checker's own self-test runs FIRST and fails the job — an unproven gate is no gate;
    #   * no `continue-on-error:` anywhere, and no path filter (an unrelated PR would otherwise
    #     "pass" by not running);
    #   * the checker fails closed on every unreadable input, including its own manifest.
    # The exemption is expressed on the EVENT, never on the secret. There are TWO events where
    # GitHub withholds the credential by design, and the rule is the same for both: the job
    # genuinely cannot run, so it must not pretend to.
    #
    #   * a pull request from a FORK — no access to any secret;
    #   * a pull request opened by DEPENDABOT — its runs read the separate `dependabot` secrets
    #     scope, so repository secrets resolve EMPTY.
    #
    # 🚨 Dependabot was the missing half, and it did not look like a missing exemption: a
    # dependabot branch lives in THIS repo, so `head.repo.fork` is false, the job ran, the
    # credential assertion fired exactly as designed, and the gate went red naming two secrets
    # that are in fact provisioned. Because this gate is REQUIRED, that made every dependabot PR
    # permanently unmergeable — #2870 and #2871 were both sitting on it. A gate failing for a
    # reason no pull request can fix is as useless as one that skips.
    #
    # 🚨 And this is NOT a skip-trapdoor, for a reason specific to this workflow: it also triggers
    # on `merge_group`, where the credential IS available. So an exempted PR still has its shared
    # rule blocks checked — on the queue's temporary ref, with the token minted, BEFORE the merge
    # lands. The exemption moves WHERE the gate runs, never WHETHER it runs.
    #
    # `collect-results` mirrors this same event predicate rather than inventing a second one.
    if: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with: { fetch-depth: 1 }

    - name: Assert the cross-repo read credential, or fail naming what to provision
      env:
        MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
        MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
      run: |
        missing=()
        [ -n "$MESHWEAVER_APP_ID" ] || missing+=("secrets.MESHWEAVER_APP_ID            app id of the org's meshweaver-cloud GitHub App, which is installed on every repo in the fleet")
        [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY   that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::The shared-rule gate cannot read the fleet — provision the following, then re-run:"
          for m in "${missing[@]}"; do echo "  • $m"; done
          exit 1
        fi
        echo "Credential inputs are present (validity is proven below, not assumed)."

    # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT:
    # a PAT has no owner, no expiry anyone watches, and fails indistinguishably from a scope
    # problem (#1709). Scoped to contents:read on exactly the repos in the register.
    - name: Mint an installation token for the fleet
      id: fleet-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.MESHWEAVER_APP_ID }}
        private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        owner: Systemorph
        repositories: >-
          MeshWeaver,MeshWeaver.Plugins,MeshWeaver.Education,MeshWeaver.Reinsurance,MeshWeaver.SocialMedia,MeshWeaver.Manufacturing,Memex
        permission-contents: read

    # PRESENT is not VALID. Prove the capability this gate actually needs — reading each repo —
    # against the real API, and name what a rejection means, because 401/403/404 take very
    # different fixes and a private repo the token cannot see reports 404, not 403.
    - name: The token can actually READ every repo in the register
      env:
        FLEET_TOKEN: ${{ steps.fleet-token.outputs.token }}
      run: |
        set -uo pipefail
        # 🚨 Read the register into a variable FIRST and assert it. `for repo in $(...)` would
        # iterate ZERO times if that command failed — the loop would simply end, `bad` would
        # still be 0, and the step would report every repo readable having contacted none of
        # them. That is this gate's own defect turned on itself, so the list is proven
        # non-empty before anything is looped over and counted after.
        repos=$(python3 -c "import json;print(' '.join(json.load(open('.github/shared-rules.json'))['repos']))") \
          || { echo "::error::Could not read the repo register from .github/shared-rules.json."; exit 1; }
        [ -n "$repos" ] || { echo "::error::.github/shared-rules.json lists no repos — nothing to compare."; exit 1; }
        bad=0
        seen=0
        for repo in $repos; do
          seen=$((seen+1))
          # `|| code=000` is not noise: `run:` is bash -e, so a TRANSPORT failure (DNS, TLS,
          # connection refused) would kill the step before the case block — i.e. before the one
          # sentence this probe exists to print.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $FLEET_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/contents/AGENTS.md") || code=000
          case "$code" in
            200) echo "  ok   $repo" ;;
            401) echo "::error::$repo -> 401: the App token is invalid or expired."; bad=1 ;;
            403) echo "::error::$repo -> 403: the token is valid but lacks contents:read here, or is rate-limited."; bad=1 ;;
            404) echo "::error::$repo -> 404: no AGENTS.md, or the App is not installed on this repo (GitHub reports an invisible private repo as 404, not 403)."; bad=1 ;;
            000) echo "::error::$repo -> could not reach api.github.com."; bad=1 ;;
            *)   echo "::error::$repo -> HTTP $code."; bad=1 ;;
          esac
        done
        [ "$bad" = "0" ] || { echo "::error::The gate cannot read the whole fleet, so it cannot report on it. Refusing to pass on partial evidence."; exit 1; }
        [ "$seen" -ge 2 ] || { echo "::error::The probe examined only $seen repo(s) — the register did not expand. Refusing to report success."; exit 1; }

    # 🚨 The self-test runs FIRST and fails the job. Every case below must be shown to FIRE on
    # its defect and stay SILENT on its fix before the verdict on the real fleet means anything.
    # Same posture as check-workflow-shell.py and MeshWeaver.Plugins' affected-modules.py.
    - name: "Prove the gate is non-vacuous (self-test)"
      run: python3 .github/scripts/check-shared-rules.py --self-test

    # `--local` for THIS repo so the pull request is judged on the tree it proposes rather than
    # on the branch it will replace. It is not a skip: core's copy still has to be present,
    # well-formed and identical to what the register requires.
    - name: "Every shared rule block is identical across the fleet"
      env:
        GITHUB_TOKEN: ${{ steps.fleet-token.outputs.token }}
      run: |
        python3 .github/scripts/check-shared-rules.py \
          --local Systemorph/MeshWeaver=AGENTS.md

  cross-repo-pair:
    name: "Cross-repo pair (public surface)"
    # 🚨 THE GAP THIS CLOSES (#2689): when a change spans this repo and a plugin repo, nothing made
    # the two halves land together — and the half that lands FIRST decides whether somebody else's
    # trunk goes red. #2678 ("the node-surface views leave the platform for a module") merged HERE,
    # deleting nine public view classes from MeshWeaver.Graph, while its plugin half
    # (MeshWeaver.Plugins#904) was still open. Eight MeshWeaver.AI.Test cases failed with
    # "No renderer is registered for area `Content`", which failed the MeshWeaver.AI bundle, which
    # failed BOTH of that repo's required compile gates: every open pull request there went red,
    # and its main was red from 17:20 to the fix, on a change none of them made. Four more shapes
    # are recorded on #2689. The expensive part is always the same — the people who see the red are
    # never the people who caused it.
    #
    # ORDERING IS THE WHOLE INVARIANT: the deleting half must land LAST.
    #
    # 🚨 NO SKIP-TRAPDOOR, and the trigger is what keeps it honest:
    #   * the DETECTOR is check-type-forwards.py, reused rather than reimplemented — its own
    #     self-tests run first and fail this job, and its report carries `publicTypesAtBase` so
    #     "this diff removed nothing" cannot be confused with "the scan read nothing" (the pair
    #     script refuses a base tree below 500 public types; src/ declares 1832 today);
    #   * no path filter — an unrelated pull request would otherwise "pass" by not running;
    #   * no `continue-on-error:` anywhere, and no `if:` that asks whether a secret is set;
    #   * the credential is ASSERTED and PROVEN to read the fleet's pull requests before any
    #     verdict is trusted (present is not valid — chart-drift learned that on 2026-08-17);
    #   * the exemption is on the EVENT and nowhere else, in the two cases where GitHub withholds
    #     the credential by design (a fork pull request, and dependabot's separate secret scope),
    #     plus `pull_request` itself, because this gate's second input is the pull-request BODY and
    #     a merge_group event does not carry one. A pull request cannot reach the queue without
    #     this job having been green, since it is a `needs:` of the required check.
    #
    # 🛡️ THIS IS NOT A CHECKOUT. It resolves a pull-request NUMBER the author declared, through the
    # API, under a GitHub App installation token: no plugin source enters core's build and
    # `dotnet build` here still needs no sibling on disk. That is exactly the line
    # PlatformNeverDependsOnPluginsGuard draws, and the line `shared-rules` below already sits on
    # the permitted side of. Both are inventoried in Doc/Architecture/RepositoryDependencyDirection
    # § C and asserted by that guard's API-read ledger.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        # The detector compares HEAD against the merge base, so the base commit must be present.
        fetch-depth: 0

    - name: Assert the cross-repo read credential, or fail naming what to provision
      env:
        MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
        MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
      run: |
        missing=()
        [ -n "$MESHWEAVER_APP_ID" ] || missing+=("secrets.MESHWEAVER_APP_ID            app id of the org's meshweaver-cloud GitHub App, which is installed on every repo in the fleet")
        [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY   that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::The cross-repo pair gate cannot resolve a declared counterpart — provision the following, then re-run:"
          for m in "${missing[@]}"; do echo "  • $m"; done
          exit 1
        fi
        echo "Credential inputs are present (validity is proven below, not assumed)."

    # Same posture as `shared-rules`: an App installation token minted per run, never a stored PAT.
    # `pull-requests: read` is the ONE extra capability this gate needs over that one, and it is
    # read-only on the sibling repos in the register — it cannot write anything anywhere.
    - name: Mint an installation token for the fleet
      id: fleet-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.MESHWEAVER_APP_ID }}
        private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        owner: Systemorph
        repositories: >-
          MeshWeaver,MeshWeaver.Plugins,MeshWeaver.Education,MeshWeaver.Reinsurance,MeshWeaver.SocialMedia,MeshWeaver.Manufacturing,Memex
        permission-contents: read
        permission-pull-requests: read

    # PRESENT is not VALID. Prove the capability this gate actually needs — LISTING PULL REQUESTS
    # on each sibling — against the real API before any verdict is trusted, and name what each
    # rejection means, because 401/403/404 take very different fixes and a private repo the token
    # cannot see reports 404, not 403.
    - name: The token can actually read PULL REQUESTS on every sibling
      env:
        FLEET_TOKEN: ${{ steps.fleet-token.outputs.token }}
      run: |
        set -uo pipefail
        # 🚨 Read the register into a variable FIRST and assert it. `for repo in $(...)` would
        # iterate ZERO times if that command failed — the loop would simply end and the step would
        # report every repo readable having contacted none of them.
        repos=$(python3 -c "import json;print(' '.join(r for r in json.load(open('.github/shared-rules.json'))['repos'] if r != 'Systemorph/MeshWeaver'))") \
          || { echo "::error::Could not read the repo register from .github/shared-rules.json."; exit 1; }
        [ -n "$repos" ] || { echo "::error::.github/shared-rules.json lists no sibling repos — no declaration could be validated against it."; exit 1; }
        bad=0
        seen=0
        for repo in $repos; do
          seen=$((seen+1))
          # `|| code=000` is not noise: `run:` is bash -e, so a TRANSPORT failure would kill the
          # step before the case block — i.e. before the one sentence this probe exists to print.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $FLEET_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/pulls?per_page=1") || code=000
          case "$code" in
            200) echo "  ok   $repo" ;;
            401) echo "::error::$repo -> 401: the App token is invalid or expired."; bad=1 ;;
            403) echo "::error::$repo -> 403: the token is valid but lacks pull-requests:read here, or is rate-limited."; bad=1 ;;
            404) echo "::error::$repo -> 404: the App is not installed on this repo (GitHub reports an invisible private repo as 404, not 403)."; bad=1 ;;
            000) echo "::error::$repo -> could not reach api.github.com."; bad=1 ;;
            *)   echo "::error::$repo -> HTTP $code."; bad=1 ;;
          esac
        done
        [ "$bad" = "0" ] || { echo "::error::The gate cannot read the fleet's pull requests, so it cannot report on a declared counterpart. Refusing to pass on partial evidence."; exit 1; }
        [ "$seen" -ge 2 ] || { echo "::error::The probe examined only $seen repo(s) — the register did not expand. Refusing to report success."; exit 1; }

    # 🚨 Both self-tests run FIRST and fail the job. The detector's cases prove it still reports a
    # departure, a forwarded move and a whole assembly leaving; the gate's cases prove it fires on
    # an undeclared removal, an open counterpart, a counterpart merged into a FEATURE branch, an
    # unparseable declaration and a starved surface report — and stays silent on an ordinary diff
    # and on a landed pair. An unproven gate is no gate.
    - name: "Prove the surface detector is not vacuous (self-test)"
      run: python3 scripts/check-type-forwards.py --self-test
    - name: "Prove the pair gate is not vacuous (self-test)"
      run: python3 scripts/check-cross-repo-pair.py --self-test

    # A pull-request body is attacker-controlled text: it goes to a FILE through the environment,
    # never interpolated into a shell command.
    - name: Capture the pull-request body
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.md"
        echo "Pull-request body: $(wc -c < "$RUNNER_TEMP/pr-body.md") bytes."

    - name: "Report the public surface this diff removes"
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
        # 🚨 The MERGE BASE, not the base branch tip — the same reasoning as the two gates in
        # "Public surface (binary compatibility)". Against the tip, a public type somebody else
        # removed on main while this pull request is open reads as THIS pull request removing it,
        # and the gate would demand a counterpart for a change it did not make.
        base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        echo "Comparing against merge base $base"
        python3 scripts/check-type-forwards.py --base "$base" --surface-json "$RUNNER_TEMP/surface.json"

    - name: "Every declared cross-repo counterpart has already landed"
      env:
        GITHUB_TOKEN: ${{ steps.fleet-token.outputs.token }}
      run: |
        set -euo pipefail
        python3 scripts/check-cross-repo-pair.py \
          --surface-json "$RUNNER_TEMP/surface.json" \
          --pr-body-file "$RUNNER_TEMP/pr-body.md"

  collect-results:
    name: "Consolidate test results"
    # plugin-gate is a NEEDS so this required check cannot go green while the plugins are
    # broken by this PR — that is the whole point of the gate (see its step below). preflight
    # is a NEEDS for the same reason one level up: this job is the repo's ONLY required status
    # check, so anything that must block a merge has to be able to fail it. licence-gate is a
    # NEEDS on the same principle: a licensing defect must be able to block a merge.
    # clients-gate is a NEEDS on the same principle as plugin-gate/doc-gate/licence-gate: a red
    # Clients workflow can stop ALL image publication (#1568), so it must be able to fail the
    # repo's only required status check.
    # workflow-shell is a NEEDS on the same principle, applied to CI's own shell: main-cd.yml is
    # not exercised by ANY pull-request check, so until #2642 an edit to the pipeline that decides
    # what ships merged on YAML validity alone — and one such edit spent nine scheduled runs and
    # ~33 hours blaming a healthy component for its own swallowed crash. A gate on that shell that
    # could go red while the PR merged anyway would be decorative in exactly the same way.
    # record-signatures is a NEEDS on the same principle, and it is the one that had been
    # missing: it carries BOTH binary-compatibility gates (public record primary constructors,
    # and public types moving assembly without a TypeForwardedTo). #2283 moved four public types
    # out of MeshWeaver.AI and shipped a TypeLoadException to production on EVERY MCP tool call
    # (#2370) — a module's IL binds a NAME, so no source build can see it. The gate for exactly
    # that now exists and is proven live, but until this line it could go RED while the PR merged
    # anyway. A gate whose verdict nothing reads is decorative.
    # shared-rules is a NEEDS on the same principle, applied to the instruction files themselves:
    # every repo's CLAUDE.md is a one-line `@AGENTS.md` include, so a rule block that differs
    # between repos means agents BEHAVE differently between repos — silently, on every session,
    # in a file no build or test reads. MeshWeaver.Plugins#705 measured the divergence; nothing
    # could see it. A gate whose verdict nothing reads is decorative, so it hangs off the repo's
    # one required check like every other gate here.
    # cross-repo-pair is a NEEDS on the same principle, applied ACROSS the repository boundary:
    # the failure it gates lands in a DIFFERENT repository, on unrelated pull requests, minutes to
    # hours after the merge that causes it (#2689 records five incidents). Nothing on the causing
    # pull request goes red, so if this gate could not fail the required check it would be a
    # notification rather than a gate — and a notification is what the fleet already had.
    needs: [precheck, build, test, doc-gate, licence-gate, clients-gate, record-signatures, workflow-shell, shared-rules, cross-repo-pair]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    # Needed for the marker push/prune steps below: gives us a git repo whose
    # `origin` carries the run's credentials, and puts github.sha's object in it.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    # ── Reuse path: build+test skipped because the tree is already green ──
    # This job still runs (and succeeds), so it is the stable required check and
    # it keeps the run's conclusion `success` for main-cd's workflow_run gate.
    - name: "Reused: tree already green"
      if: needs.precheck.outputs.skip == 'true'
      env:
        MARKER_RUN: ${{ needs.precheck.outputs.marker_run }}
      run: |
        echo "Tree ${{ needs.precheck.outputs.tree }} was already tested green (${{ needs.precheck.outputs.marker }}) — build + test skipped."
        # 🚨 #1491: state WHOSE evidence this green is. A reused green is sound about the
        # bytes and silent about the run — and that silence is what made a red land on an
        # unrelated PR's commit with a bisect window that excluded the real cause.
        if [ -n "${MARKER_RUN:-}" ]; then
          echo "Evidence gathered by run ${MARKER_RUN} — THIS run executed no tests."
          provenance="[run ${MARKER_RUN}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${MARKER_RUN})"
        else
          provenance="_unrecorded (marker predates provenance recording)_"
        fi
        {
          echo "### ✅ Test suite reused"
          echo
          echo "Tree \`${{ needs.precheck.outputs.tree }}\` was already tested green — build and test were skipped."
          echo "Marker: \`${{ needs.precheck.outputs.marker }}\`"
          echo "Evidence gathered by: ${provenance}"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Download all shard results
      if: needs.precheck.outputs.skip != 'true'
      uses: actions/download-artifact@v8
      with:
        # No merge-multiple: keep each shard under its own dir so same-named
        # files (test-results.log) from different shards don't overwrite.
        pattern: testResults-shard*
        path: all-results
    - name: Summarize test failures
      # Parse every shard's trx and echo each failed test as an ::error::
      # annotation + into the job step summary, so failing tests are visible
      # directly on THIS job without opening the published check.
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        echo "### Failed tests (all shards)" >> "$GITHUB_STEP_SUMMARY"
        any=0
        for trx in $(find all-results -name '*.trx' 2>/dev/null | sort); do
          # testName on each UnitTestResult element whose outcome is Failed.
          fails=$(grep -oE '<UnitTestResult[^>]*outcome="Failed"[^>]*>' "$trx" \
                  | grep -oE 'testName="[^"]*"' \
                  | sed -E 's/testName="([^"]*)"/\1/' | sort -u)
          if [ -n "$fails" ]; then
            any=1
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "::error title=Test failed::$t"
              echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$fails"
          fi
        done
        # 🚨 EVIDENCE GATE: "no failures" is only green if tests actually RAN. With zero
        # trx anywhere, this step used to exit 0 — so a run in which the probe was
        # starved, build skipped and no shard executed still published a SUCCESSFUL
        # required check. A required check that passes on no evidence is worse than a
        # flaky one: it lets an untested tree merge and ship.
        trx_count=$(find all-results -name '*.trx' 2>/dev/null | wc -l | tr -d ' ')
        if [ "$trx_count" = "0" ]; then
          echo "::error::No test results found in any shard — the suite did not run, so this run proves nothing. Failing (the reuse path is the ONLY sanctioned way to skip tests)."
          {
            echo "### ❌ No test evidence"
            echo
            echo "Zero \`.trx\` files across all shards, and this was not a green-tree reuse."
            echo "The suite did not execute — refusing to report success."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$any" = "0" ]; then
          echo "_No failed tests in ${trx_count} trx file(s). A crashed/killed host is NOT covered by this silence: since #2495 it is written INTO the trx as a \`<project>.HOST_CRASHED\` failure, so it would be listed above; the exit-marker gate below is the second, independent check._" >> "$GITHUB_STEP_SUMMARY"
          echo "No failed tests found in trx across all shards (${trx_count} result files)."
        else
          # 🚨 GATE (TRX-based, reporter-independent): the consolidated run pass/fail
          # gate. Fail on any test failure across shards, independent of the Publish
          # step's GitHub-API health (429-immune).
          echo "::error::Failing tests in trx across shards — failing the run."
          exit 1
        fi
    # 🚨 COVERAGE GATE — "no failures" is not "everything ran" (#1472).
    #
    # On 2026-08-14 a GitHub codeload outage made setup-dotnet's tarball unfetchable and
    # SHARD 0 NEVER RAN. The five surviving shards produced trx with no failures, the
    # evidence gate above saw a non-zero trx count, and `Consolidate test results` — the
    # repo's ONLY required status check — reported SUCCESS. `mergeStateStatus` was merely
    # UNSTABLE, which does not block. A PR could have merged on five sixths of the suite
    # with nothing in the required signal saying so.
    #
    # "The shard produced no results because it never started" and "the shard produced no
    # failures" are DIFFERENT INPUTS, and counting failures cannot tell them apart. So this
    # step counts REPORTERS against the statically-known matrix size instead of inferring
    # coverage from what arrived.
    #
    # 🚨 Two ways to get this wrong, both of which reproduce the defect one level up, and
    # neither of which is used here:
    #   * an `if:` that skips the assertion when a shard artifact is absent — GitHub renders
    #     a skipped job with the same tick as a passed one;
    #   * `continue-on-error` on the step that fetches the shard results.
    # The only condition on this step is the reuse path, which is a RUN MODE (no shard was
    # expected to run at all), not a property of the evidence.
    - name: "Every shard must have reported"
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        set -uo pipefail
        expected="${CI_SHARD_TOTAL}"
        # download-artifact keeps each artifact under its own directory (no merge-multiple),
        # so one directory == one shard that uploaded results.
        reported=$(find all-results -mindepth 1 -maxdepth 1 -type d -name 'testResults-shard*' 2>/dev/null | wc -l | tr -d ' ')
        echo "Shards reported: ${reported}/${expected}"
        if [ "$reported" -eq "$expected" ]; then
          echo "_All ${expected} shards reported._" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Name the missing ones so the run says WHICH sixth of the suite is unaccounted for.
        missing=()
        for ((i=0; i<expected; i++)); do
          [ -d "all-results/testResults-shard$i" ] || missing+=("$i")
        done
        echo "::error::Only ${reported} of ${expected} shards reported results — shard(s) ${missing[*]} produced nothing. A shard that never ran is an UNVERIFIABLE outcome, not a passing one; refusing to report success on a partially-executed suite."
        {
          echo "### ❌ Incomplete test coverage"
          echo
          echo "Only **${reported} of ${expected}** shards reported results. Missing: \`${missing[*]}\`."
          echo
          echo "A shard that never started produces no failures — which is not the same evidence as"
          echo "a shard that ran and found none. Check the missing shard job(s) for an infrastructure"
          echo "failure (runner/download/setup), then re-run them: an infra failure with the same input"
          echo "is the sanctioned re-run case."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    # Defence in depth for the same defect from the other side: a shard job that FAILED to
    # start, was cancelled, or died before uploading leaves the matrix result non-success.
    # `needs:` alone cannot express that under `if: always()`.
    - name: "Fail if any shard job did not succeed"
      if: always() && needs.precheck.outputs.skip != 'true' && needs.test.result != 'success'
      run: |
        echo "::error::The test matrix concluded '${{ needs.test.result }}' — at least one shard did not succeed. See the shard jobs; this run does not cover the whole suite."
        exit 1

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.24.0
      if: always() && needs.precheck.outputs.skip != 'true'
      # Best-effort reporter ONLY (reporting, not gating) — the TRX-summarize step
      # above is the gate. action_fail removed + continue-on-error so a throttled
      # GitHub-API publish (429) can't fail the run; failures fail via the trx gate.
      continue-on-error: true
      with:
        # One consolidated check across all shards (reporting only now).
        check_name: "Test Results"
        files: |
          all-results/**/*.trx
    - name: Fail on non-zero project exit (all shards)
      # Defense-in-depth re-check of every shard's exit markers (each shard
      # already gates its own). A host that crashed after streaming green
      # results, or was killed at the 8m cap, appears ONLY here — the trx gate
      # above cannot see it (completed tests all read Passed; the rest vanish).
      # Markers carry their classification (TESTFAIL / TIMEOUT / SIGNAL /
      # MASKED); only the non-TESTFAIL ones are hosts that actually died.
      if: always() && needs.precheck.outputs.skip != 'true'
      run: |
        bad=$(find all-results -name 'test-results.log' -exec cat {} \; \
              | grep -E 'exit=[1-9]' || true)
        if [ -n "$bad" ]; then
          echo "::error::A test host exited non-zero — see the classification on each marker below (TESTFAIL = ordinary failing tests, TIMEOUT/SIGNAL/MASKED = the host died mid-run and only completed results were published):"
          echo "$bad"
          exit 1
        fi

    # ─────────────────── RECORD THE GREEN TREE ────────────────────
    # Only reached when every gate above passed AND every upstream job actually
    # SUCCEEDED. The job-result condition is not redundant with the gates: a shard
    # that infra-fails (runner dies, artifact upload lost) leaves NOTHING for the
    # trx/exit-marker gates to parse, so they pass on the surviving shards' green
    # results. Marking that tree green would let a genuinely untested tree skip
    # its main run.
    - name: "Record green tree"
      if: >-
        needs.precheck.outputs.skip != 'true' &&
        needs.build.result == 'success' &&
        needs.test.result == 'success'
      # Best-effort: a fork PR's read-only GITHUB_TOKEN cannot push the marker.
      # Losing a marker only costs a redundant run — never correctness.
      continue-on-error: true
      run: |
        set -euo pipefail
        tree="${{ needs.precheck.outputs.tree }}"
        # 🚨 The leaf carries PROVENANCE (#1491): `<epoch>-<run_id>`, so a later run that
        # REUSES this marker can name the run that actually gathered the evidence instead of
        # leaving the reader to infer it from a run list that cannot distinguish the two
        # kinds of green. Readers split on the first `-`; a bare `<epoch>` (legacy) still parses.
        ref="refs/ci-green/$tree/$(date +%s)-${{ github.run_id }}"
        # github.sha is this run's commit — the merge commit on a pull_request run,
        # which is exactly the commit whose tree we tested. Marker refs live
        # outside refs/heads and refs/tags: invisible in the branch/tag UI, and
        # they trigger no workflow (a GITHUB_TOKEN push never does anyway).
        git push origin "${{ github.sha }}:$ref"
        echo "Recorded green tree: $ref"
        echo "Green tree recorded: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

    # ── RECORD THE LAST MAIN COMMIT WHOSE TESTS ACTUALLY RAN ──────────────────────────────
    # The other half of #1491. `refs/ci-green` is keyed by TREE, so it can say "these bytes
    # passed" but never "main was verified at this commit" — and the bisect window a human (or
    # an agent) reaches for is `git log <last-green>..<red>`, taken from the run list. On
    # 2026-08-14 that window contained exactly one PR, and it was the wrong one: the preceding
    # main run had REUSED a marker, so main's tip had never been tested as a whole, and the
    # regression came from the change set BEFORE the one the window named.
    #
    # This ref is written only when the suite genuinely executed AND passed on main, so the
    # newest one is, by construction, the last main commit whose tests actually ran.
    - name: "Record executed-and-green main commit"
      if: >-
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.precheck.outputs.skip != 'true' &&
        needs.build.result == 'success' &&
        needs.test.result == 'success'
      # Same rationale as the marker push: losing one costs a less precise bisect hint, never
      # correctness.
      continue-on-error: true
      run: |
        set -euo pipefail
        ref="refs/ci-executed/main/$(date +%s)-${{ github.run_id }}"
        git push origin "${{ github.sha }}:$ref"
        echo "Recorded executed-and-green main commit ${{ github.sha }} at $ref"

    # Keep the marker namespace small. Anything past the prune horizon is long
    # past the TTL — it can never be honoured again, it only slows the ls-remote.
    - name: "Prune stale green markers"
      if: always() && needs.precheck.outputs.skip != 'true'
      continue-on-error: true
      run: |
        set -euo pipefail
        now=$(date +%s)
        refspecs=()
        while read -r _sha ref; do
          [ -z "${ref:-}" ] && continue
          leaf="${ref##*/}"
          # Leaf is `<epoch>` (legacy) or `<epoch>-<run_id>` (#1491) — take the epoch field.
          epoch="${leaf%%-*}"
          case "$epoch" in (*[!0-9]*|'') continue;; esac
          if [ $(( now - epoch )) -gt "${CI_GREEN_PRUNE_SECONDS}" ]; then
            refspecs+=(":$ref")
          fi
        done < <(git ls-remote origin 'refs/ci-green/*' 'refs/ci-executed/*' || true)
        if [ "${#refspecs[@]}" -eq 0 ]; then
          echo "No stale markers to prune."
          exit 0
        fi
        echo "Pruning ${#refspecs[@]} stale marker(s)."
        git push origin "${refspecs[@]}"

    # `!= 'success'` rather than `== 'failure'` (2026-09-02 fleet audit, finding A5): a gate that
    # was SKIPPED or CANCELLED produced no verdict, and no verdict must never read as passed — this
    # is the repo's ONLY required check. The one legitimate skip is the reuse path (the tree was
    # already tested green, so `build` — and with it `doc-gate` — did not run); it is exempted on
    # precheck's own output, never on the gate's result.
    - name: Fail if the doc gate failed
      if: needs.precheck.outputs.skip != 'true' && needs.doc-gate.result != 'success'
      env:
        # Empty when the gate produced no verdict (it died before judging). Degrades to
        # "see the job", which is true either way.
        GATE_VERDICT: ${{ needs.doc-gate.outputs.failure }}
      run: |
        set -uo pipefail
        verdict="$(printf '%s' "${GATE_VERDICT}" | head -1)"
        if [ -n "$verdict" ]; then
          echo "::error::The doc gate failed: ${verdict} — see the 'Doc content compiles and runs' job."
        else
          echo "::error::The doc gate failed — see the 'Doc content compiles and runs' job for the failing check (install / compile / render / tests) and the node(s) it failed on."
        fi
        exit 1

    # ── …and a licensing defect decides it too ──────────────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough under `if: always()` — same lesson as the step above. A
    # dependency licence that is incompatible with shipping under Apache-2.0 / MIT must be able
    # to turn the repo's ONLY required status check RED, or the gate is decorative.
    - name: Fail if the licence gate failed
      # Same shape as the doc gate: skipped/cancelled is not a pass; the reuse path is the one exemption.
      if: needs.precheck.outputs.skip != 'true' && needs.licence-gate.result != 'success'
      run: |
        echo "::error::A dependency licence is incompatible with shipping MeshWeaver under Apache-2.0 / MIT — see the 'Dependency licences' job for the offending package(s) and their licence."
        echo "::error::Fix it by removing the package or replacing it with a permissively-licensed one. Do NOT add it to EXCEPTIONS unless the upstream licence genuinely IS permissive and only the package metadata is missing."
        exit 1

    # ── …and a BINARY-COMPATIBILITY break decides it too ────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough under `if: always()` — same lesson as the steps above, and
    # this is the case that already cost a production incident. A source build answers source
    # compatibility; an already-published module binds a NAME in its IL. So a public type that
    # moves assembly, or a public record whose primary constructor changes shape, breaks every
    # module built before the change while every compile in the repo stays green.
    - name: Fail if the binary-compatibility gate failed
      # The gate itself runs only on pull_request / merge_group (it diffs against a base), so the
      # exemption is written on the EVENT — the same predicate the gate carries — never on its result.
      if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.record-signatures.result != 'success'
      run: |
        echo "::error::A public surface changed in a way that breaks ALREADY-PUBLISHED modules — see the 'Public surface (binary compatibility)' job for the exact types."
        echo "::error::A moved public type needs [assembly: TypeForwardedTo] left behind in its ORIGINAL assembly (a forwarder keeps one type identity; a shim mints a second and reintroduces the is/as trap-door). A forwarder cannot rename, so the type keeps its original name."
        echo "::error::Do NOT satisfy this by rebuilding the consumer: the point is that modules ALREADY shipped bind the old name. If a forwarder is impossible (it would need a reference cycle), the move has to be reverted or the whole set republished atomically — see #2398."
        exit 1

    # ── …and a red Clients workflow decides it too ──────────────────────────────────────────
    # 🚨 `needs:` alone is NOT enough under `if: always()` — same lesson as the steps above.
    # This is the merge gate #1555 did not have: its Portal-next job was red, naming the exact
    # build main-cd would later run, and it was advisory.
    - name: Fail if CI's own shell gate failed
      # `!= 'success'` rather than `== 'failure'`: a gate that was skipped or cancelled has
      # produced no verdict, and "no verdict" must never read as "passed".
      if: needs.workflow-shell.result != 'success'
      run: |
        echo "::error::The 'CI's own shell' gate concluded '${{ needs.workflow-shell.result }}' — see that job. It shellchecks every workflow \`run:\` block, refuses a captured command substitution that swallows BOTH stderr and its exit status (the #2642 shape: a failed call becomes an empty answer that is then read as authoritative), refuses an az \`--query\` that throws on a null field, and EXECUTES main-cd's release-version recovery against a fixture. main-cd.yml is exercised by no other check on this PR."
        exit 1

    # `!= 'success'` rather than `== 'failure'`, for the same reason as the gate above: a job
    # that was skipped or cancelled produced no verdict, and no verdict must never read as
    # passed. The fork and dependabot clauses are the SAME event predicate the gate itself
    # carries — in both, GitHub withholds the credential by design, so the job genuinely does not
    # run. Written on the event and never on the secret, and kept identical to the gate's own
    # `if:` so the two can never disagree about who is exempt. The merge_group run enforces it
    # with credentials before anything lands.
    - name: Fail if the shared rule blocks drifted
      if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' && needs.shared-rules.result != 'success'
      run: |
        echo "::error::The 'AGENTS.md shared rule blocks' gate concluded '${{ needs.shared-rules.result }}' — see that job, which names the repo and the exact drift. Every repo's CLAUDE.md is a one-line @AGENTS.md include, so a block that differs between repos means agents follow different instructions in each of them. The register is .github/shared-rules.json; the rationale is Doc/Architecture/SharedRuleBlocks. The fix is always a pull request in the repo the error names — never a bypass here."
        exit 1

    # ── …and an UNLANDED CROSS-REPO COUNTERPART decides it too ──────────────────────────────
    # `!= 'success'` rather than `== 'failure'`, for the same reason as the gates above: a job
    # that was skipped or cancelled produced no verdict, and no verdict must never read as passed.
    # The event predicate is kept IDENTICAL to the gate's own `if:` so the two can never disagree
    # about who is exempt — `pull_request` because the gate's second input is the pull-request
    # BODY, and fork/dependabot because GitHub withholds the credential by design in both.
    - name: Fail if a cross-repo counterpart has not landed
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' && needs.cross-repo-pair.result != 'success'
      run: |
        echo "::error::The 'Cross-repo pair (public surface)' gate concluded '${{ needs.cross-repo-pair.result }}' — see that job, which names the public types this diff removes from src/ and the state of every declared counterpart."
        echo "::error::This pull request removes public surface, which can red a plugin repo's trunk hours later on pull requests that did not make the change (#2689). Declare the counterpart in the PR BODY as 'Pairs-with: Systemorph/MeshWeaver.Plugins#904', or 'Pairs-with: none — <reason>' when no other repository is affected."
        echo "::error::ORDERING IS THE INVARIANT: the deleting half lands LAST. Merge the counterpart into its repo's default branch first, then re-run. Rationale: Doc/Architecture/CrossRepoPairGate."
        exit 1

    - name: Fail if the clients gate failed
      if: needs.clients-gate.result != 'success'
      run: |
        echo "::error::The Clients workflow verdict is '${{ needs.clients-gate.outputs.verdict }}' (gate job: ${{ needs.clients-gate.result }}) — see the 'Clients workflow verdict' job. The clients tree is now just the Python SDK (the GUI clients moved to MeshWeaver.Plugins, MeshWeaver#2169), so a red verdict is a real SDK regression rather than the image-publication stopper it used to be."
        exit 1

    # ── STATE THE BISECT WINDOW ON A RED ────────────────────────────────────────────────────
    # #1491's diagnostic half. The natural first move on a red main is
    # `git log <last-green>..<red>` — and taking "last green" from the run list is WRONG when
    # the preceding run reused a marker, because that run concluded success without executing
    # anything. The window it yields can exclude the change set that actually broke the tree.
    #
    # `refs/ci-executed/main/*` records only main commits whose suite genuinely RAN and passed,
    # so the newest one IS the correct left edge. Stating it here means the window is read, not
    # reconstructed. Never fails the run: it is a diagnostic on an already-red run, and a
    # missing hint must not mask the failure that prompted it.
    - name: "State the bisect window"
      if: failure()
      continue-on-error: true
      run: |
        set -uo pipefail
        last=$(git ls-remote origin 'refs/ci-executed/main/*' \
               | sed -E 's|^([0-9a-f]+)[[:space:]]+refs/ci-executed/main/([0-9]+)(-([0-9]+))?$|\2 \1 \4|' \
               | grep -E '^[0-9]+ ' | sort -n | tail -1 || true)
        {
          echo "### 🔎 Bisect window"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -z "$last" ]; then
          echo "No refs/ci-executed/main marker yet — the window cannot be stated from evidence." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        sha=$(echo "$last" | awk '{print $2}')
        run=$(echo "$last" | awk '{print $3}')
        {
          echo "Last main commit whose tests **actually executed** and passed: \`${sha}\`"
          [ -n "$run" ] && echo "(run [${run}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${run}))"
          echo
          echo "So the window to bisect is:"
          echo
          echo '```'
          echo "git log ${sha}..${{ github.sha }}"
          echo '```'
          echo
          echo "> 🚨 This is deliberately NOT \"the last main run that concluded success\". A run that"
          echo "> reuses an already-green tree marker reports success **without executing the suite**,"
          echo "> so the window taken from the run list can exclude the change set that actually broke it."
        } >> "$GITHUB_STEP_SUMMARY"