name: Hosting Operator

# The operator scripts are the executable half of instance lifecycle — they create namespaces,
# drop databases and delete DNS records — and nothing in CI opened them until now.
#
# 🚨 WHAT THIS GATE CAN AND CANNOT PROVE, stated here so a green tick is not read as more than it is.
# These scripts drive az/kubectl/helm/psql against a live Azure estate; a runner has none of those,
# and mocking them would only assert that the mocks agree with themselves. So this proves the layer
# where the dangerous bugs actually live — argument handling, the REFUSALS that stand in front of
# every destructive act, the ::hosting:: contract the mesh parses, and run.sh's ordering — and it
# proves the image still builds. Whether `az network dns record-set a add-record` behaves as
# expected is settled by the first real provision, which is why the rollout is staged.
#
# 🛡️ NO SKIP-TRAPDOOR (AGENTS.md → "A gate NEVER tests its own inputs"). Every input is in this
# repository. There is no secret, no cluster and no registry, so there is no condition under which
# this may decline to run and still render a tick: no `continue-on-error`, no input-shaped `if:`,
# and no path filter (a path filter turns "unrelated PR" into a skipped run, which is the same grey
# tick from the other side).

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# One live run per ref: a newer push to the same PR branch cancels the run it supersedes; main and
# the merge queue never cancel (each main push is its own group, keyed on the commit).
concurrency:
  group: hosting-operator-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scripts:
    name: Operator scripts (shellcheck + behaviour)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on hosted runners, which is exactly why it is asserted rather than assumed:
      # a dependency satisfied by luck of the runner image breaks on an image bump, as a "command
      # not found" unrelated to the code being gated.
      - name: Assert the tools this gate needs
        run: |
          set -euo pipefail
          missing=()
          command -v shellcheck >/dev/null 2>&1 || missing+=("shellcheck — apt-get install shellcheck")
          command -v bash       >/dev/null 2>&1 || missing+=("bash")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the operator gate cannot run — provide:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          shellcheck --version

      # 🚨 The regression guard for the trap that kept these scripts out of the repo entirely:
      # .gitignore's `/deploy/**/bin/` (build output) also matched THIS bin/, so `git add` on them
      # exited 0 and did nothing. The Dockerfile shipped COPYing a directory git refused to track.
      # A checkout is the only place that can prove the re-include still holds.
      - name: The operator scripts are actually TRACKED
        run: |
          set -euo pipefail
          tracked=$(git ls-files deploy/aks/operator/bin/ | wc -l | tr -d ' ')
          if [ "$tracked" -lt 27 ]; then
            echo "::error::only ${tracked} file(s) tracked under deploy/aks/operator/bin/ — expected 27 (24 commands + run.sh + _common.sh + _audit.jq). The floor is the REAL count — raise it with every command added, or a lost file passes."
            echo "::error::Almost certainly .gitignore matching this bin/ again. `git add` on an ignored path exits 0 and does NOTHING, so the loss is silent until a fresh checkout builds an image with no scripts in it."
            git check-ignore -v deploy/aks/operator/bin/run.sh || true
            exit 1
          fi
          # Executability is part of the contract: the Dockerfile chmods, but run.sh is the Job's
          # ENTRYPOINT and a non-executable command is a CrashLoop, not a warning.
          nonexec=$(git ls-files -s deploy/aks/operator/bin/hosting-* deploy/aks/operator/bin/run.sh | awk '$1 != "100755"' | wc -l | tr -d ' ')
          [ "$nonexec" -eq 0 ] || { echo "::error::${nonexec} operator command(s) are not committed executable (mode 100755)"; exit 1; }
          echo "${tracked} files tracked, all commands executable"

      - name: Every script parses
        run: |
          set -euo pipefail
          cd deploy/aks/operator/bin
          for f in _common.sh run.sh hosting-*; do
            bash -n "$f" || { echo "::error::${f} is not valid bash"; exit 1; }
          done
          echo "all $(ls _common.sh run.sh hosting-* | wc -l) scripts parse"

      - name: shellcheck
        run: shellcheck -S warning deploy/aks/operator/bin/_common.sh deploy/aks/operator/bin/run.sh deploy/aks/operator/bin/hosting-*

      # 🚨 Every hosting-* command the mesh's plan can emit must EXIST. A plan step naming a script
      # nobody wrote fails inside a Job, halfway through a lifecycle action, as "command not found"
      # — which for a teardown means after the quiesce and possibly after the backup.
      - name: Every command the plan can emit exists
        run: |
          set -euo pipefail
          plan_src=$(mktemp)
          # The plan lives in the Hosting plugin repo; the command names it emits are also listed
          # here so this repo can gate them without a cross-repo checkout. Keep in step with
          # MeshWeaver.Plugins/Hosting/InstanceAction/Source/InstanceActionPlan.cs.
          cat > "$plan_src" <<'EOF'
          hosting-audit
          hosting-backup
          hosting-deploy
          hosting-dns
          hosting-export
          hosting-federate
          hosting-inline-env-retire
          hosting-kv-copy
          hosting-kv-ensure
          hosting-kv-purge
          hosting-kv-rotate
          hosting-pull-secret
          hosting-pv-purge
          hosting-pv-resize
          hosting-redirect
          hosting-registry-key
          hosting-registry-register
          hosting-restore
          hosting-signin-app
          hosting-tls
          hosting-verify
          hosting-verify-backup
          hosting-verify-catalog
          hosting-verify-restore
          EOF
          missing=()
          while read -r cmd; do
            cmd="$(echo "$cmd" | tr -d '[:space:]')"
            [ -n "$cmd" ] || continue
            [ -x "deploy/aks/operator/bin/${cmd}" ] || missing+=("$cmd")
          done < "$plan_src"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the plan can emit commands this image does not carry: ${missing[*]}"
            echo "::error::A missing one fails INSIDE a running lifecycle Job — for a teardown, after the quiesce."
            exit 1
          fi
          echo "all $(grep -c . "$plan_src") plan commands present and executable"

          # 🚨 THE REVERSE DIRECTION, and it is the half that actually rots.
          #
          # The check above asks "does every command the plan names exist?" — it can only fail when
          # someone deletes a script. It is structurally blind to the opposite drift: a script that
          # SHIPS in the image while no plan entry names it. That one is silent, because a list
          # nobody compares against its subject simply stops describing it, and the gate goes on
          # passing while its coverage narrows. Measured on 2026-09-01: `hosting-kv-rotate` had
          # shipped, had zero behaviour tests, and was absent from the list above — so nothing in CI
          # knew it existed.
          #
          # So every hosting-* that ships must be EITHER claimed by the plan above OR named here,
          # deliberately, with the reason it is not yet wired. Adding a script without touching one
          # of the two lists is now a red build rather than an unnoticed hole.
          not_wired=$(mktemp)
          cat > "$not_wired" <<'EOF'
          # command                  why it ships without a plan entry
          # (none — hosting-kv-rotate moved to the plan list: InstanceActionPlan.RotateRegistryKeySteps emits it)
          EOF
          unclaimed=()
          for path in deploy/aks/operator/bin/hosting-*; do
            cmd="${path##*/}"
            grep -qx "$cmd" "$plan_src" && continue
            grep -qE "^${cmd}([[:space:]]|$)" "$not_wired" && continue
            unclaimed+=("$cmd")
          done
          if [ ${#unclaimed[@]} -gt 0 ]; then
            echo "::error::these operator commands ship but no plan entry names them: ${unclaimed[*]}"
            echo "::error::Either add each to the plan list above (and keep MeshWeaver.Plugins' InstanceActionPlan.cs in step),"
            echo "::error::or declare it in the not-yet-wired list with the reason. A shipped command nobody claims is"
            echo "::error::untested and unreachable, and nothing else in CI will say so."
            exit 1
          fi
          echo "every shipped hosting-* command is either claimed by the plan or declared not-yet-wired"
          # hosting-audit is two files: the command and the jq program beside it. A command that
          # ships without its detection dies at "the detection program … is missing" inside a Job.
          [ -f deploy/aks/operator/bin/_audit.jq ] || { echo "::error::bin/_audit.jq is missing — hosting-audit cannot compute anything without it"; exit 1; }
          # Parse-check the program. jq exits 3 on a PROGRAM error and 5 on a runtime error();
          # empty inputs legitimately reach the error() refusal, so only exit 3 is a failure here —
          # the behaviour tests below exercise the real detection against fixtures.
          set +e
          jq -n -f deploy/aks/operator/bin/_audit.jq --slurpfile manifest /dev/null --slurpfile live /dev/null \
            --arg namespace n --arg release r --arg deployment d --arg container c --argjson revision 1 \
            --arg chart "" --arg auditedAt now --arg skipped "" --argjson persistence '{}' >/dev/null 2>"$RUNNER_TEMP/audit-jq.err"
          jq_rc=$?
          set -e
          if [ "$jq_rc" -eq 3 ]; then
            echo "::error::_audit.jq does not parse:"; cat "$RUNNER_TEMP/audit-jq.err"; exit 1
          fi
          echo "_audit.jq parses (exit ${jq_rc} on empty inputs is its own refusal, as designed)"

      - name: The test stubs are TRACKED and executable
        # The same .gitignore trap as bin/ above, one directory over: the pull-secret behaviour
        # tests run against stubs under test/stubs/pull-secret/, and a stub git refused to track
        # makes those tests fail on a fresh checkout as "command not found" — or, worse, fall
        # through to a REAL az/kubectl on a runner that has one.
        run: |
          set -euo pipefail
          for f in deploy/aks/operator/test/stubs/pull-secret/az deploy/aks/operator/test/stubs/pull-secret/kubectl deploy/aks/operator/test/stubs/pv-resize/kubectl deploy/aks/operator/test/stubs/inline-env/kubectl deploy/aks/operator/test/stubs/kv-rotate/az deploy/aks/operator/test/stubs/kv-ensure/az deploy/aks/operator/test/stubs/kv-copy/az deploy/aks/operator/test/stubs/registry-register/az deploy/aks/operator/test/stubs/signin-app/az; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || { echo "::error::${f} is not tracked"; git check-ignore -v "$f" || true; exit 1; }
            [ "$(git ls-files -s "$f" | awk '{print $1}')" = "100755" ] || { echo "::error::${f} is not committed executable (mode 100755)"; exit 1; }
          done
          echo "operator test stubs tracked and executable"

      - name: Behaviour tests
        run: deploy/aks/operator/test/run-tests.sh

      # 🚨 memex-local is the OTHER operator script in this repo — ~2000 lines that stand up every
      # developer's local portal — and nothing in CI opened it until MeshWeaver#2367. What that
      # cost, in one file: `memex-local help` was an unbounded FORK BOMB (a backtick in an unquoted
      # heredoc re-entered main()); `helm_deploy` aborted on macOS bash 3.2 for the paths the script
      # itself calls normal; and `up`/`update` reported success on a portal with no sign-in page and
      # no view packs. Three live defects, zero red ticks, because nothing ever ran it.
      - name: memex-local parses
        run: bash -n deploy/homebrew/bin/memex-local

      - name: shellcheck (memex-local)
        run: shellcheck -S warning deploy/homebrew/bin/memex-local deploy/homebrew/test/run-tests.sh

      # 🚨 This runner is bash 5 and has no colima/kubectl/helm, so what it CAN prove is asserted by
      # running the CLI against stub tools (every red state of the usability verification, plus that
      # a green one is reachable) and by static assertions for the two traps a Linux runner can
      # never reach by execution — the heredoc backtick and macOS bash 3.2's empty-array abort.
      - name: Behaviour tests (memex-local)
        run: deploy/homebrew/test/run-tests.sh

  image:
    name: Operator image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Build only — nothing is pushed from a pull request. The point is that the Dockerfile and its
      # build context stay in step: the context is `deploy/` (not the operator directory) because
      # the image carries the CHART as well as the scripts, and that is easy to break silently.
      - name: Build
        run: docker build -f deploy/aks/operator/Dockerfile -t hosting-operator:ci deploy/

      - name: The image carries the scripts AND the chart
        run: |
          set -euo pipefail
          # A chart-less image would deploy nothing and an image without run.sh cannot start; both
          # are build-context mistakes that only surface during a real provision.
          docker run --rm --entrypoint /bin/bash hosting-operator:ci -c '
            set -e
            test -x /opt/hosting/bin/run.sh          || { echo "run.sh missing"; exit 1; }
            test -f /opt/hosting/chart/Chart.yaml    || { echo "chart missing — build context must be deploy/"; exit 1; }
            command -v hosting-deploy >/dev/null     || { echo "hosting-* not on PATH"; exit 1; }
            command -v helm kubectl az pg_dump jq >/dev/null || { echo "a required tool is missing"; exit 1; }
            test -f /opt/hosting/bin/_audit.jq       || { echo "_audit.jq missing — hosting-audit has no detection"; exit 1; }
            echo "image carries: $(ls /opt/hosting/bin/hosting-* | wc -l) commands + chart $(grep ^version /opt/hosting/chart/Chart.yaml)"
          '

      # Stronger than running them on the runner: this is the bash, the coreutils and the PATH the
      # scripts will actually execute under in a lifecycle Job.
      - name: Behaviour tests, inside the image
        run: |
          # The manifests are NOT in the image (only bin/ and the chart are), but the suite's RBAC
          # coverage case needs the ClusterRole: mount them read-only and name the file, so the
          # case runs here exactly as on the runner — a missing input is exit 2 and red, not a skip.
          docker run --rm -v "$PWD/deploy/aks/operator/test:/opt/hosting/test:ro" \
            -v "$PWD/deploy/aks/manifests:/opt/hosting/manifests:ro" \
            -e HOSTING_RBAC_MANIFEST=/opt/hosting/manifests/hosting-operator/operator-rbac.yaml \
            --entrypoint /bin/bash hosting-operator:ci -c 'cd /opt/hosting && bash test/run-tests.sh'

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # PUBLISH — on a push to main only. Never on a pull request (nothing from a PR reaches ACR),
  # never with continue-on-error, never behind "is the secret set" (AGENTS.md → a gate never
  # tests its own inputs): the preflight below asserts every external input and fails RED naming
  # what to provision, and this job runs unconditionally after it.
  #
  # 🚨 WHY THIS JOB EXISTS. `meshweaver.azurecr.io/hosting-operator` was last built by hand on
  # 2026-08-22 and NOTHING republished it: the two jobs above build the image on every push and
  # then throw it away, so every fix to a hosting-* script since then — the audit, kv-rotate, the
  # chart baked into the image — shipped to the repository and never to the Jobs that run them.
  # The mesh names the image by tag (Hosting__Operator__Image); a tag nobody moves is a fleet
  # running the operator as it was the day someone last remembered to `docker push`.
  #
  # Two tags per build: `<short sha>` (immutable — what a deployment record pins) and `main`
  # (moving — what a Provision that has not pinned yet uses). Multi-arch is deliberately NOT
  # built here: the Jobs run on the cluster's amd64 node pools, and the Dockerfile's TARGETARCH
  # handles a laptop build.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  publish-preflight:
    name: Publish preflight (every external input, or a red naming it)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every external input, or a red build naming what to provision
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID           OIDC app registration for azure/login (the same one main-cd.yml uses)")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID           the Systemorph AAD tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID     the subscription holding ACR meshweaver")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the operator image cannot be published — provision the following under Settings → Secrets → Actions, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."

  publish:
    name: Publish operator image to ACR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-preflight, scripts, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write is required for OIDC federated login to Azure (no stored client secret) —
    # the federated credential on the app registration is scoped to this repo's main branch,
    # which is the only ref this job runs on.
    permissions:
      contents: read
      id-token: write
    env:
      ACR: meshweaver.azurecr.io
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        # The bounded transport retry main-cd.yml uses (#2827) — the bare one-liner has died on
        # `context deadline exceeded` from a single runner while sibling jobs logged in fine.
        run: bash .github/scripts/acr-login.sh
      - name: Build and push hosting-operator:<sha> and :main
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker build -f deploy/aks/operator/Dockerfile \
            -t "$ACR/hosting-operator:$short" -t "$ACR/hosting-operator:main" deploy/
          docker push "$ACR/hosting-operator:$short"
          docker push "$ACR/hosting-operator:main"
      - name: Verify the tags exist in the registry (never the green tick)
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          # Read the pushed manifests BACK; a push that "succeeded" against a stale login has
          # produced a green step and no image before (#2827's family).
          az acr manifest show-metadata --registry meshweaver --name "hosting-operator:$short" --query digest -o tsv
          az acr manifest show-metadata --registry meshweaver --name "hosting-operator:main" --query digest -o tsv
          echo "published $ACR/hosting-operator:$short (+ :main)"
