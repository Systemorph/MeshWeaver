name: Issue taxonomy

# Every OPEN issue of the triage scope carries exactly one type and exactly one sev:B/H/M/L — a non-bug
# sev:M or sev:L only, sev:B/sev:H being reserved for defects (Doc/Architecture/IssueTaxonomy, policies
# `release-blocker-gate` and `every-issue-has-a-severity`). The release gate counts open sev:B and sev:H
# bugs, so an issue that breaks the invariant is invisible to it — an untyped issue and an issue without
# a severity both read as "nothing blocking".
#
# Triage keeps the invariant (the hourly issue sweep classifies, and names what needs a person on
# Hosting/Triage/blocking/issues-need-a-person); this lane is the INDEPENDENT measurement of whether it
# did. It goes RED naming every violation older than 24 hours — younger ones are triage's to finish —
# and every repository missing a severity label. `scripts/check-issue-taxonomy.py` reads the issues
# endpoint page by page (never search) and exits 2 when anything could not be read: a run that could
# not check is red, never green.
#
# 🛡️ THIS WORKFLOW MAY NOT SKIP (AGENTS.md → "A gate NEVER tests its own inputs"). `preflight` asserts
# the App credential and fails RED naming it; `check` needs it and carries no input-shaped `if:`.

on:
  schedule:
    - cron: "53 6 * * *"   # daily, after the night's sweeps
  workflow_dispatch:

permissions:
  contents: read

# A scheduled lane has no pull request to turn red, so its state lives in ONE standing issue that
# `report` opens or updates when a run did not pass — violations found, or a run that could not
# check — and closes when a run passes again: the sentinel pattern of issue-text-names.yml and
# chart-drift.yml (.github/scripts/sentinel-issue.py). The run log names the violations.
concurrency:
  group: issue-taxonomy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (fleet-reader credential)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every input
        env:
          APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APP_ID" ]  || missing+=("secrets.FLEET_READER_APP_ID           the fleet-reader App's id")
          [ -n "$APP_KEY" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY  the fleet-reader App's private key")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::the issue-taxonomy check cannot run — provision:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "every input present"

  check:
    name: Every open issue typed, with one severity
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Self-test the check
        run: python3 scripts/check-issue-taxonomy.py --self-test
      # The App must hold Issues: read on every repository below; a missing grant fails THIS step,
      # naming the permission — never a quiet zero.
      - name: Mint a read token for the triage scope
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: >-
            MeshWeaver,MeshWeaver.Plugins,Memex,MeshWeaver.Crm,MeshWeaver.Education,MeshWeaver.Reinsurance,
            MeshWeaver.SocialMedia,MeshWeaver.Manufacturing,MeshWeaver.FundReporting
          permission-issues: read
          permission-metadata: read
      - name: Check
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python3 scripts/check-issue-taxonomy.py check \
            --repo Systemorph/MeshWeaver --repo Systemorph/MeshWeaver.Plugins --repo Systemorph/Memex \
            --repo Systemorph/MeshWeaver.Crm --repo Systemorph/MeshWeaver.Education --repo Systemorph/MeshWeaver.Reinsurance \
            --repo Systemorph/MeshWeaver.SocialMedia --repo Systemorph/MeshWeaver.Manufacturing --repo Systemorph/MeshWeaver.FundReporting \
            --older-than-hours 24

  report:
    name: Publish the standing state
    needs: [preflight, check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: issue-taxonomy-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            scripts
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESULT_PRE: ${{ needs.preflight.result }}
          RESULT_CHECK: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: issue-taxonomy-sentinel
        run: |
          set -euo pipefail
          LOOKUP=$(python3 .github/scripts/sentinel-issue.py find --repo "$REPO" --label "$LABEL" \
                     --ensure-label --color "d93f0b" \
                     --description "The ONE standing issue issue-taxonomy.yml updates in place — do not remove")
          NUM=$(printf '%s' "$LOOKUP" | jq -r '.number // empty')
          ISSUE_STATE=$(printf '%s' "$LOOKUP" | jq -r '.state // empty')
          if [ "$RESULT_PRE" = "success" ] && [ "$RESULT_CHECK" = "success" ]; then
            if [ -n "$NUM" ] && [ "$ISSUE_STATE" = "open" ]; then
              gh api "repos/$REPO/issues/$NUM/comments" --silent \
                -f body="The issue-taxonomy check passed again as of $RUN_URL — closing. It reopens on the next run that does not pass."
              gh api -X PATCH "repos/$REPO/issues/$NUM" -f state=closed --silent
              echo "closed #$NUM"
            else
              echo "Passed, and no tracking issue open. Nothing to do."
            fi
            exit 0
          fi
          TITLE="Issue taxonomy: the last run did NOT pass (preflight=${RESULT_PRE}, check=${RESULT_CHECK})"
          BODY=$(printf '**State: not passing** — last run %s ([run](%s)).\n\njob results: preflight=%s check=%s\n\nThe run log names every open issue that has broken the taxonomy for more than 24 hours, every repository missing a severity label, or why the run could not read (a missing credential, a missing Issues: read grant, an unreadable page). An issue the release gate cannot classify is invisible to it — see Doc/Architecture/IssueTaxonomy.\n\n---\nMaintained automatically by `.github/workflows/issue-taxonomy.yml`; closed automatically when a run passes again.\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUN_URL" "$RESULT_PRE" "$RESULT_CHECK")
          if [ -n "$NUM" ]; then
            gh api -X PATCH "repos/$REPO/issues/$NUM" -f title="$TITLE" -f body="$BODY" -f state=open --silent
            echo "updated #$NUM (was $ISSUE_STATE)"
          else
            NEW=$(gh api "repos/$REPO/issues" -f title="$TITLE" -f body="$BODY" -f "labels[]=$LABEL" --jq '.number')
            echo "opened #$NEW"
            python3 .github/scripts/sentinel-issue.py await-visible --repo "$REPO" --label "$LABEL" --number "$NEW"
            NUM="$NEW"
          fi
          # 🏷️ The sentinel states its own TYPE and SEVERITY, like every other: an unmeasured or broken
          # taxonomy hides issues from the release gate, which is silently wrong results — but the
          # classifiers that keep it (triage, the filers' own stamps) still run, so a bug at sev:M.
          python3 scripts/check-issue-taxonomy.py stamp --repo "$REPO" --number "$NUM" --label bug --label sev:M
