name: Issue-text name scan

# Client names in issue and pull-request TEXT (MeshWeaver.Plugins#2845, policy `issue-text-name-scan`).
#
# The committed-text check covers the tree. This scheduled lane covers what the repository also
# publishes: issue titles and bodies, issue comments, pull-request descriptions, review comments and
# review bodies, by every author, bots included. `.github/scripts/scan-issue-text-names.py` is
# deterministic and holds no names. It submits the text to the instance that owns the CRM as
# `Governance/NameCheck` requests with `source: issue-text`. That instance proves every line is in
# the item it names and this run is live, matches against the CRM, and FILES any finding to its
# private review and one masked triage item. It returns nothing about the result, and nothing here
# edits or deletes anything.
#
# 🛡️ THIS WORKFLOW MAY NOT SKIP (AGENTS.md → "A gate NEVER tests its own inputs"). `preflight`
# asserts every input and fails RED naming it; `scan` needs it and has no input-shaped `if:`. A run
# that could not check is red, never green.

on:
  schedule:
    - cron: "41 5 * * *"   # daily; the scan window (26 h) overlaps the previous run
  workflow_dispatch:
    inputs:
      since-hours:
        description: "Scan items updated in this many hours (a backfill passes a large number)"
        required: false
        default: "26"

permissions:
  contents: read
  issues: read
  pull-requests: read

# A scheduled lane has no pull request to turn red, so its state lives in ONE standing issue that
# `report` opens or updates when a run could not check, and closes when a run checks again — the
# same sentinel pattern chart-drift.yml uses (.github/scripts/sentinel-issue.py). Counts only.
concurrency:
  group: issue-text-names
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (name-check inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every input
        env:
          NAME_CHECK_URL: ${{ secrets.NAME_CHECK_URL }}
          NAME_CHECK_TOKEN: ${{ secrets.NAME_CHECK_TOKEN }}
        run: |
          missing=()
          [ -n "$NAME_CHECK_URL" ]   || missing+=("secrets.NAME_CHECK_URL    base URL of the instance that owns the CRM (org secret: grant this repository access)")
          [ -n "$NAME_CHECK_TOKEN" ] || missing+=("secrets.NAME_CHECK_TOKEN  the build's service-user token holding namecheck.caller.grant there")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::issue-text name scan cannot run — provision:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "every input present"

  scan:
    name: Scan issue and pull-request text
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Self-test the scanner
        run: python3 .github/scripts/scan-issue-text-names.py --self-test
      - name: Scan
        env:
          NAME_CHECK_URL: ${{ secrets.NAME_CHECK_URL }}
          NAME_CHECK_TOKEN: ${{ secrets.NAME_CHECK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SINCE_HOURS: ${{ inputs.since-hours || '26' }}
        run: python3 .github/scripts/scan-issue-text-names.py --repo "${{ github.repository }}" --since-hours "$SINCE_HOURS"

  report:
    name: Publish the standing state
    needs: [preflight, scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: issue-text-names-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESULT_PRE: ${{ needs.preflight.result }}
          RESULT_SCAN: ${{ needs.scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: issue-text-names-sentinel
        run: |
          set -euo pipefail
          LOOKUP=$(python3 .github/scripts/sentinel-issue.py find --repo "$REPO" --label "$LABEL" \
                     --ensure-label --color "d93f0b" \
                     --description "The ONE standing issue issue-text-names.yml updates in place — do not remove")
          NUM=$(printf '%s' "$LOOKUP" | jq -r '.number // empty')
          ISSUE_STATE=$(printf '%s' "$LOOKUP" | jq -r '.state // empty')
          if [ "$RESULT_PRE" = "success" ] && [ "$RESULT_SCAN" = "success" ]; then
            if [ -n "$NUM" ] && [ "$ISSUE_STATE" = "open" ]; then
              gh api "repos/$REPO/issues/$NUM/comments" --silent \
                -f body="The issue-text name scan checked again as of $RUN_URL — closing. It reopens on the next run that cannot check."
              gh api -X PATCH "repos/$REPO/issues/$NUM" -f state=closed --silent
              echo "closed #$NUM"
            else
              echo "Checked, and no tracking issue open. Nothing to do."
            fi
            exit 0
          fi
          # Not checked: the scan never reports a finding here (findings are filed privately on the
          # CRM-owning instance), only that it could not check — loud, in one place.
          TITLE="Issue-text name scan: the last run could NOT check (preflight=${RESULT_PRE}, scan=${RESULT_SCAN})"
          BODY=$(printf '**State: not checked** — last run %s ([run](%s)).\n\njob results: preflight=%s scan=%s\n\nThe run log names why (a missing input, an unreachable or refusing CRM-owning instance, or a NotChecked answer). Findings are never reported here — they are filed privately on that instance.\n\n---\nMaintained automatically by `.github/workflows/issue-text-names.yml`; closed automatically when a run checks again.\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUN_URL" "$RESULT_PRE" "$RESULT_SCAN")
          if [ -n "$NUM" ]; then
            gh api -X PATCH "repos/$REPO/issues/$NUM" -f title="$TITLE" -f body="$BODY" -f state=open --silent
            echo "updated #$NUM (was $ISSUE_STATE)"
          else
            NEW=$(gh api "repos/$REPO/issues" -f title="$TITLE" -f body="$BODY" -f "labels[]=$LABEL" --jq '.number')
            echo "opened #$NEW"
            python3 .github/scripts/sentinel-issue.py await-visible --repo "$REPO" --label "$LABEL" --number "$NEW"
          fi
