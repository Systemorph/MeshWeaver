name: Lock pinned image digests

# Protect every manifest the fleet PINS, by locking it in the registry — so retention cannot delete
# what CI and the deployments depend on.
#
# WHY (MeshWeaver#3438, requirement 1). ACR's `purge-old-images` deleted the manifests
# MeshWeaver.Education's `main` pinned. Every run of that repo's `Disposable-mesh gate` then died at
# `manifest unknown` before a single content gate executed — including `main`'s OWN NIGHTLY, so the
# repository lost its gate and its green baseline in the same instant. Education, Manufacturing and
# SocialMedia went down together at 2026-09-05T15:29Z.
#
# `pinned-digests.yml` (#3462) is the GUARD half: it reports, at 05:20, which pins are already dead.
# THIS is the half that stops the deletion:
#
#     `acr purge` SKIPS LOCKED MANIFESTS BY DEFAULT. `--include-locked` is the documented opt-in to
#     delete them and NEITHER STEP of `purge-old-images` passes it (verified against the live task
#     definition, recorded in .github/acr-retention/). So `deleteEnabled: false` is a hard
#     protection against this exact configuration, not a hint.
#
# Five manifests were locked BY HAND on 2026-09-06 to stop the bleeding. A hand list is the defect,
# not the fix — it is only ever correct on the day it is written. This derives the set nightly.
#
# 🚨 IT LOCKS. IT DOES NOT UNLOCK. Releasing is the only direction that can DESTROY data, and it is
# unsafe in exactly the case where the extractor is wrong: a pin the scan cannot see is spelled
# identically to a pin that is not there. The release arm is COMPUTED and PRINTED on every run — so
# the stale-lock debt is visible — and acted on only when a person sets the repository variable
# `MW_ACR_RELEASE_UNPINNED` to `true` AND the run is free of every blocker. That is not a hypothetical
# guard: on 2026-09-07 three of the five hand-locked manifests were release candidates, because they
# are the set MeshWeaver.Education's PENDING pin bump will name. An enabled release arm would have
# unlocked the fix for #3438's own victim.
#
# 🛡️ THIS WORKFLOW MAY NOT SKIP (AGENTS.md — "a gate NEVER tests its own inputs"). GitHub paints a
# skipped job with the same grey tick as a passed one, so:
#   * `preflight` asserts EVERY external input and fails RED naming what to provision. It never asks
#     "is the credential set?" in order to decide whether to check.
#   * `protect` runs `needs: [preflight]` with NO input-shaped `if:` and NO `continue-on-error:`.
#   * The script probes the registry with a CONTROL first and fails closed on an unreadable
#     repository, a truncated git tree, an unclassifiable pin, an indeterminate registry answer, a
#     DECLARATION THAT ANSWERS TO NOTHING, or a lock that did not take.
#     🚨 THE SECOND-TO-LAST is the half that was missing until 2026-09-21, and it is why this lane
#     was red from 2026-09-17: `instances.json`'s `registries` table was checked only for hosts the
#     fleet pins and this file does not name, never for a line naming a host the fleet no longer
#     pins. A client's estate was rebuilt in its own subscription on 2026-09-17, the overlay moved
#     to the new ACR the same morning, and the declaration stayed on one that no longer exists — a
#     well-formed entry about nothing, validating green, while the run refused nightly over its
#     replacement. Both directions now, on the same `--discover`-only denominator the repository
#     table uses — and it stands DOWN, saying so, while any overlay tree could not be read, because
#     the reference it would look for lives inside the file it could not open.
#     🚨 THE LAST is an assertion, not a phrase: `apply_locks` READS `deleteEnabled` BACK after
#     every write and requires `false`. `az`'s exit code is a statement
#     about the REQUEST, and a write that returns 0 without the attribute moving would leave this
#     job reporting `Protected N manifest(s)` over manifests the 03:00 purge can still delete —
#     which is precisely the failure it exists to remove, pointed at itself. An INDETERMINATE
#     read-back is not a confirmation either. Two `--self-test` arms drive both cases and were
#     falsified by deleting the read-back.
#   * It PRINTS THE DENOMINATOR — per axis: repositories scanned, repositories that pin, pin sites
#     found, installations expected and installations that ANSWERED — and an installation that did
#     not answer makes the run INCOMPLETE, which is a refusal rather than a shorter answer.
#
# 🚨 THREE AXES, AND THE THIRD IS LIVE (#3438/#3858/#3860, 2026-09-12). Axes 1 and 2 read COMMITTED
# files — workflow digest pins and deployment-overlay tag pins — and both are proxies for what is
# actually being consumed. Axis 3 asks each installation directly, through its own unauthenticated
# `/api/version`, and protects the closure of the image sets built from the commit it answers.
# Memex#219's third shape is why: memex-cloud was rolled to `3.0.0-ci.8399` at 06:15Z on 2026-09-12
# while its committed pin still read `8372`, so that night's lock protected the manifest it was NOT
# running. The expected installations come from the same overlays axis 2 reads
# (`Hosting__Deployment` + `ingress.host`); `.github/acr-retention/instances.json` declares the ones
# that are deliberately not live, with a reason, because silence is unavailability and never
# retirement.
#
# 🚨 IT LOCKS TWO THINGS, AND THEY ARE DIFFERENT OBJECTS. A manifest lock saves the BYTES; a TAG
# carries its OWN `deleteEnabled` and that is the one `acr purge` reads when it deletes a tag.
# Measured 2026-09-12: `memex-portal-ai:3.0.0-ci.8372` — the tag both production overlays pin — read
# `deleteEnabled: true` over a manifest reading `false`, and ZERO of that repository'"'"'s 1,396 tags
# were locked. The purge would have deleted the reference and left the bytes: `manifest unknown` to
# the next pull, from a fully protected manifest. Both halves are locked now, delete only.
#
# 🚨 THE AXIS-1 ZERO ASSERTION IS GONE, AND WHAT REPLACED IT IS STRONGER. It read "six repositories
# pinned a digest on 2026-09-06, so zero means the extractor stopped matching" — and on 2026-09-12
# the scheduled run died on exactly that line, two hours before the purge, because #3842 had moved
# every satellite to RESOLVING the platform set at run time. An assertion about the FLEET expires;
# one about the INSTRUMENT does not. `extractor_control()` drives `extract()` over a fixture with two
# known digest pins on every run, so a broken matcher reds even when the fleet happens to declare
# pins anyway.
#
# 🚨 WHY THE `push` TRIGGER IS REPORT-ONLY. It is not a skip: the script runs in full, prints both
# denominators, and reds on every blocker — only the `az` WRITE is withheld. A change to the
# extractor should prove itself against the live fleet before it starts mutating a shared registry,
# and the scheduled run two hours later applies whatever it found. The gate is live on push; the
# mutation is not.
#
# WHY THERE IS NO `pull_request` TRIGGER. The live state of a registry is not a property of a pull
# request, and a credentialed PR-reachable job would put both secrets into the Dependabot store's
# blast radius for no gain (#3399). The script's own falsification runs on every PR instead —
# `lock-pinned-digests.py --self-test` in dotnet-test.yml's workflow-shell lane.

on:
  schedule:
    # 01:00 UTC — TWO HOURS before `purge-old-images` runs at 03:00, and three before the disabled
    # `purge-old-ci-releases` slot at 04:00. The margin is deliberate: a run that overlaps the purge
    # would race it on the one manifest that matters most. The 05:20 guard then reports, after both,
    # whatever this could not protect.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "apply = write the locks; report-only = say what it would do"
        type: choice
        options: [apply, report-only]
        default: apply
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-pinned-digests.yml'
      - '.github/scripts/lock-pinned-digests.py'
      - '.github/scripts/check-pin-set-consistency.py'
      - '.github/scripts/check-pinned-digests.py'
      - '.github/scripts/ghrest.py'
      - '.github/acr-retention/instances.json'
      # The lock classifies every declared release-channel label as floating (never locked).
      - '.github/release-channels.json'
      - '.github/scripts/release-channels.py'

permissions:
  contents: read
  id-token: write     # azure/login OIDC — no long-lived registry secret in this repo

jobs:
  preflight:
    name: Assert the inputs exist
    runs-on: ubuntu-latest
    # Five emptiness tests, a mint and one API call. The fleet cap is 45
    # (check-workflow-timeouts.py) and nothing here has any business approaching it.
    timeout-minutes: 10
    steps:
      # No `if:` anywhere in this job. It asserts, it does not decide whether to assert.
      - name: Every external input, or a red build naming what to provision
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FLEET_READER_APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
          FLEET_READER_APP_PRIVATE_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID        OIDC app registration for azure/login. 🚨 LOCKING IS A WRITE: it needs the data action Microsoft.ContainerRegistry/registries/repositories/metadata/write, which is in 'Container Registry Repository Writer' (and Contributor/Owner) and in NEITHER AcrPull NOR AcrPush — measured 2026-09-07, AcrPush is pull/read + push/write and nothing else. If this identity only has the read-only grant the pinned-digest sweep uses, the lock step reds naming the exact 'az role assignment create'")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID        the Systemorph AAD tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID  the subscription holding meshweaver.azurecr.io")
          [ -n "$FLEET_READER_APP_ID" ]     || missing+=("secrets.FLEET_READER_APP_ID          app id of the org's READ-ONLY fleet-reader GitHub App (Contents, Metadata, Pull requests: read); its installation IS the fleet whose pins and deployment overlays this job locks — set it in BOTH the Actions and the Dependabot secret stores (gh secret set NAME --repo Systemorph/MeshWeaver, then again with --app dependabot)")
          [ -n "$FLEET_READER_APP_PRIVATE_KEY" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY  that App's private key (PEM), in BOTH stores like the id. NOT meshweaver-cloud's key: that App holds write and is not installed on Memex")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the pinned-manifest lock job cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."

      # 🚨 PRESENT is not VALID, and chart-drift.yml learned that the hard way (2026-08-17): a
      # provisioned-but-worthless credential passed an emptiness test and every job downstream died
      # at "Bad credentials", with the preflight above it reporting that all inputs were present.
      # So assert the CAPABILITY the job needs — enumerating the installation's repositories —
      # against the real API. That is also the job's fleet list: it is discovered, never committed,
      # so a repository added to the org is protected the day the App reaches it.
      # 🚨 The READ-ONLY `fleet-reader` App. Discovery makes the App's installation the fleet, so an
      # App that does not reach a repository does not FAIL here — it silently drops that repository.
      # Memex's deployment overlays pin the live portals' image tags (AXIS 2), which is why this is
      # not `meshweaver-cloud`, which Memex is leaving (decided 2026-09-11).
      # Doc/Architecture/GitHubAppCredentials.
      - name: Mint an installation token for the fleet
        id: fleet-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: The token can enumerate the fleet it is meant to protect
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
        run: |
          set -euo pipefail
          # No `2>/dev/null` and no `|| true`: a failed enumeration must print WHY. Swallowing it
          # would turn "the token cannot read the org" into "the fleet is empty", which is the one
          # answer this job must never produce (check-workflow-shell.py's `swallow` class).
          if ! reachable=$(gh api --paginate /installation/repositories \
                             --jq '.repositories[].full_name'); then
            echo "::error::the minted installation token could not enumerate its own repositories."
            echo "  /installation/repositories is the endpoint an installation token answers about"
            echo "  itself, so this is the token, not the network. Confirm the fleet-reader App"
            echo "  is installed on the Systemorph org and holds Contents: Read."
            exit 1
          fi
          count=$(printf '%s\n' "$reachable" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::the installation reaches ZERO repositories."
            echo "  Deriving a lock set from an empty fleet protects NOTHING while reporting success."
            echo "  Add the fleet repositories to the fleet-reader installation."
            exit 1
          fi
          echo "The App reaches $count repository(ies); those are what the job will read."

  protect:
    name: Every pinned manifest is locked
    needs: [preflight]
    runs-on: ubuntu-latest
    # 38 repositories × (a workflow listing, a recursive tree, a handful of file reads), one
    # manifest listing per ACR repository (21, 11,522 manifests on 2026-10-10), one `az acr manifest
    # show` per image index in the wanted set (~108), one tag listing per repository the fleet
    # references, one HTTPS probe per installation, and one `az` write per manifest or tag newly
    # locked. Each `az` is a whole process (~6 s on a hosted runner), and run SERIALLY that did not
    # fit: the scan alone took 15 minutes and the apply run was cancelled at this cap three nights
    # running (Memex#219) with 72 of a 297-manifest + 113-tag backlog written. Every one of those
    # calls is independent, so the script runs them on a bounded pool (`MW_ACR_LOCK_WORKERS`,
    # default 8) and reads the locks back with ONE fresh listing per repository instead of one
    # `az` per item. 🚨 Never raise this bound to make a run fit: 30 is the lane's honest cap and
    # 45 the fleet's, and a run that does not fit is doing serial work that should not be serial.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      # Cross-repo reads are a GitHub App installation token minted per run, never a stored PAT — a
      # PAT rots exactly as PATs do (chart-drift.yml carried one; HTTP 401 on all nine runs after it
      # was provisioned, so the check never ran once, #1709). This one is minted fresh, expires in an
      # hour, and holds Contents: Read and nothing else.
      # 🚨 The READ-ONLY `fleet-reader` App. Discovery makes the App's installation the fleet, so an
      # App that does not reach a repository does not FAIL here — it silently drops that repository.
      # Memex's deployment overlays pin the live portals' image tags (AXIS 2), which is why this is
      # not `meshweaver-cloud`, which Memex is leaving (decided 2026-09-11).
      # Doc/Architecture/GitHubAppCredentials.
      - name: Mint an installation token for the fleet
        id: fleet-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_READER_APP_ID }}
          private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Ensure Azure CLI
        # GitHub's ubuntu-latest no longer ships the Azure CLI on PATH for azure/login@v3
        # ("Unable to locate executable file: az"). Install it if missing (idempotent).
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ONE step, ALWAYS run. No `if:`, no `continue-on-error:`.
      #
      # The two policy dials are passed as VALUES the script prints, never as conditions on whether
      # the step executes — the difference between a decision that is visible in the log and a job
      # that is grey for a reason nobody can see:
      #
      #   MW_ACR_LOCK_MODE          `apply` on the schedule and on a manual run; `report-only` on a
      #                             push, so a change to the extractor proves itself against the
      #                             live fleet before it mutates a shared registry.
      #   MW_ACR_RELEASE_UNPINNED   the unlock arm. SHIPS DISABLED. Unset unless a maintainer sets
      #                             the repository variable to `true`; the script prints which it
      #                             saw either way, and refuses to release anything at all on a run
      #                             that carries a blocker.
      - name: Lock every manifest the fleet pins
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          MW_ACR_RELEASE_UNPINNED: ${{ vars.MW_ACR_RELEASE_UNPINNED }}
          MW_ACR_PRIVATE_ROSTER: ${{ secrets.ACR_RETENTION_PRIVATE_ROSTER }}
          MW_EVENT: ${{ github.event_name }}
          MW_ACR_LOCK_MODE: >-
            ${{ (github.event_name == 'push' && 'report-only')
             || (github.event.inputs.mode || 'apply') }}
        run: |
          set -uo pipefail
          # 🚨 AN UNRECOGNISED MODE IS A RED, NEVER A FALL-THROUGH TO REPORT-ONLY. A typo in the
          # expression above would otherwise make the nightly run stop mutating the registry while
          # staying green — a job that protects nothing and says it protected everything, which is
          # the failure this whole workflow exists to remove.
          case "$MW_ACR_LOCK_MODE" in
            apply|report-only) ;;
            *) echo "::error::MW_ACR_LOCK_MODE is '$MW_ACR_LOCK_MODE'; expected apply|report-only."
               exit 1 ;;
          esac
          echo "mode: $MW_ACR_LOCK_MODE (event: $MW_EVENT)"
          # A client estate's roster lines are PRIVATE (not in this public repository): the
          # ACR_RETENTION_PRIVATE_ROSTER secret carries them as JSON of instances.json's shape and
          # the script merges it over the committed file. Absent, the committed fleet is all there
          # is — and a client repository the scan reaches reds as undeclared, which is the point.
          if [ -z "${MW_ACR_PRIVATE_ROSTER:-}" ]; then
            echo "::notice::ACR_RETENTION_PRIVATE_ROSTER is not set — only the committed roster is declared."
          fi
          args=(--discover --registry meshweaver)
          if [ "$MW_ACR_LOCK_MODE" = "apply" ]; then
            args+=(--apply)
          fi
          python3 .github/scripts/lock-pinned-digests.py "${args[@]}"

      # 🚨 THE PREMISE THE LOCK RESTS ON, ASSERTED RATHER THAN ASSUMED. A lock protects only
      # because `acr purge` skips locked manifests unless `--include-locked` is passed. If a purge
      # step ever gains that flag, every lock above becomes decoration — silently, with this job
      # still reporting that it protected N manifests. This reads the COMMITTED record of the
      # cloud-only task definitions (.github/acr-retention/) and needs no credential at all, so it
      # runs here AND on every pull request in dotnet-test.yml's workflow-shell lane.
      #
      # It deliberately does NOT compare against the live registry: that needs
      # `registries/tasks/read`, a strictly larger grant than the lock itself, and a step that is
      # always red for a missing grant is a step that gets ignored. The live drift comparison is a
      # maintainer's manual instrument — `.github/scripts/acr-retention-tasks.sh verify`.
      #
      # `if: ${{ !cancelled() }}` is NOT a skip-trapdoor: it asks whether the RUN was cancelled,
      # never whether an input exists. Without it this step would be dead behind the lock step's
      # red, and the lock step is red right now for a reason that has nothing to do with the
      # retention record (MeshWeaver.Education's three purged pins). The job's conclusion is still
      # the AND of both steps.
      - name: The purge still skips locked manifests
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/lock-pinned-digests.py --check-retention-record .

      # 🚨 THE OTHER REGISTRY'S RETENTION GATE IS DELIBERATELY *NOT* HERE (MeshWeaver#4230, #4315
      # review). `--check-registry-retention` asks every registry the fleet's overlays name what
      # DELETES from it and re-derives the committed chart — and it runs on every PULL REQUEST, in
      # dotnet-test.yml's `workflow-shell` job, which is a `needs:` of `collect-results`
      # (`Consolidate test results`, this repository's ONLY required status check) and is named by
      # that job's explicit fail step. `main` is ruleset-protected and merges through the merge
      # queue, which builds the merged branch and runs the same job — so there is no path to `main`
      # on which that gate does not block.
      #
      # A second copy HERE would therefore add no coverage and one new way to red THIS lane — whose
      # green is `pause.reEnableWhen` in .github/acr-retention/tasks.json. Two consecutive nightly
      # runs were already lost that way in September 2026, and the cost was recorded on #3438: the
      # false `pins no image at all` refusal stood between the fleet and re-enabling cleanup. (A
      # scheduled-only red used to have no durable reporter at all — #7416; it now lands on this
      # lane's ci-failure ledger, the `lane-red`/`lane-green` jobs at the end of this file.)
      #
      # If this lane ever becomes the only place a chart can move — a direct push to `main`, say —
      # that is the change that should add the step back, in the same diff.

  # ─────────────────────── A RED HERE HAS AN AUDIENCE (#7416) ───────────────────────
  # This lane is scheduled and main-only: no pull request, no reviewer and no check list ever
  # shows its conclusion. It was red on every run from 2026-09-15 to 2026-09-21 (runs 25-34) and
  # nobody read it for six days — while its green is the stated precondition for re-enabling the
  # registry purge (`pause.reEnableWhen` in .github/acr-retention/tasks.json). `pinned-digests.yml`
  # asserted this lane's CONFIGURATION, which was correct on all ten failing days; nothing read its
  # OUTCOME. So the outcome goes where every other unattended red in the fleet goes: the ci-failure
  # ledger (node-repo-ci-failure.yml) — ONE issue under this lane's OWN label, a dated entry per red
  # run, reopened rather than re-filed, closed by the next green, and a signed event to the control
  # portal's triage inbox each way. `check-scheduled-lane-reporters.py` refuses a scheduled workflow
  # without such a pair.
  #
  # 🔀 The ten reds had TWO causes in the SAME job and the SAME step (an installation's
  # /api/version timing out, then an undeclared registry), so a ledger naming the step alone would
  # still read "same red for six days". `cause` lists this run's failed jobs WITH a signature of
  # their error annotations, and the ledger entry says whether the cause is the same as the previous
  # red's or CHANGED. Only the signature reaches the (public) issue — the error text can name a
  # client estate's registry; the run link carries the text.
  #
  # No `continue-on-error:` and no input-shaped `if:`. `always()` is deliberate, not `!cancelled()`:
  # a job cut at its `timeout-minutes` (Memex#219 — the apply run cut at the cap three nights
  # running) is precisely a red this must report.
  cause:
    name: "Which red is this: the failed jobs and their error signatures"
    needs: [preflight, protect]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read     # list this run's jobs
      checks: read      # read each failed job's annotations
    outputs:
      failed-jobs: ${{ steps.list.outputs.failed-jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: "The ledger can say no (self-test)"
        run: python3 .github/scripts/ci-failure-ledger.py --self-test
      # Red when the jobs or their annotations cannot be read — and that red is itself reported
      # below (the ledger then lists the run's failed jobs on its own, this one among them).
      - name: List this run's failed jobs with their cause signatures
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          # Inside this job's 5-minute cap: a rate limit past it exits 3, NO VERDICT, and the
          # ledger lists the run's jobs itself (MeshWeaver#7416).
          MW_API_OUTAGE_WAIT_MINUTES: "3"
        run: python3 .github/scripts/ci-failure-ledger.py --list-failed-jobs "$RUN_ID"

  lane-red:
    name: "The lock lane is red: file it, tell the control portal"
    needs: [preflight, protect, cause]
    if: always() && (needs.preflight.result != 'success' || needs.protect.result != 'success' || needs.cause.result != 'success')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/node-repo-ci-failure.yml
    with:
      outcome: failure
      run: ${{ github.run_id }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ github.sha }}
      event: ${{ github.event_name }}
      platform-set: ""
      # Empty when `cause` itself failed: the lane then lists the run's failed jobs on its own.
      failed-jobs: ${{ needs.cause.outputs.failed-jobs || '[]' }}
      label: ci-lock-pinned-digests-red
      issue-title: "lock-pinned-digests: the pinned-manifest lock lane is red"
      # A scheduled lane's red is a bug at sev:M — tracked, not a release gate (#7416 owner decision).
      severity: sev:M
      control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
      # The ledger script at THIS commit (it reads the `cause` field this commit's `cause` job writes).
      scripts-ref: ${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}

  # 🚨 A REPORT-ONLY green does NOT close the ledger. A push run (and a manual `report-only` one)
  # proves the scan has no blocker but writes no lock, and the green `pause.reEnableWhen` cites is
  # one whose locks were APPLIED. So only an applying run — the schedule, or a manual run in `apply`
  # mode — clears the alert; a report-only red still files above, because a blocker it finds is just
  # as real. The condition reads the EVENT and the dispatch input, never whether a secret is set.
  lane-green:
    name: "The lock lane is green: close the ledger"
    needs: [preflight, protect, cause]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'report-only')) && needs.preflight.result == 'success' && needs.protect.result == 'success' && needs.cause.result == 'success'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/node-repo-ci-failure.yml
    with:
      outcome: success
      run: ${{ github.run_id }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ github.sha }}
      event: ${{ github.event_name }}
      platform-set: ""
      label: ci-lock-pinned-digests-red
      issue-title: "lock-pinned-digests: the pinned-manifest lock lane is red"
      # A scheduled lane's red is a bug at sev:M — tracked, not a release gate (#7416 owner decision).
      severity: sev:M
      control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
      scripts-ref: ${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
