name: Continuous Delivery (main)

# CONTINUOUS-channel delivery: every merge to main that PASSES the test suite ships a
# fresh deployment image and rolls it out to every environment.
#
#   push main ─▶ "MeshWeaver Build and Test" (existing) ─▶ [THIS] images ─▶ deploy (memex, atioz, memex-cloud)
#
# Why workflow_run (and not push: branches:[main]): we want the image+deploy to fire ONLY
# after the full test suite is green on the merged commit — never ship an image that failed
# tests. workflow_run starts after the named workflow COMPLETES; the `if` below filters to a
# successful run that came from a push to main (not a PR run, not a failed run).
#
# This is the CONTINUOUS channel (build-numbered 3.0.0-ci.<build> baked in, images tagged by
# commit SHA). The RELEASED channel — clean 3.0.0 NuGet packages + clean GHCR images — is a
# SEPARATE path fired by pushing a v*.*.* tag (release-packages.yml + release-images.yml).
# "Freeze a release" = push a tag; "merge to main" = this workflow.
#
# The portal and migration images build in PARALLEL jobs: the migration image is small
# (~5 min) and used to run sequentially after the portal's ~18-minute multi-arch publish on
# the same runner — a free ~5 min off every merge-to-deployed cycle. Each job is
# self-contained (checkout → az login → publish); the duplicated setup (~3 min) runs
# concurrently so it costs no wall-clock.
on:
  workflow_run:
    workflows: ["MeshWeaver Build and Test"]
    types: [completed]

# id-token: write is required for OIDC federated login to Azure (no stored client secret).
permissions:
  contents: read
  id-token: write
  # packages: write — the mw-plugin-test image is ALSO published to GHCR so the
  # MeshWeaver.Plugins CI can pull it with a GitHub token instead of ACR credentials.
  packages: write

# Never let two main merges deploy concurrently — a later merge waits for the in-flight
# rollout rather than racing it. cancel-in-progress:false so we don't abort a half-done deploy.
concurrency:
  group: main-cd
  cancel-in-progress: false

env:
  ACR: meshweaver.azurecr.io
  AKS_RG: memex-aks-rg
  AKS_CLUSTER: memexaks-cluster

jobs:
  # ─────────────────────────── BUILD + PUSH IMAGES ───────────────────────────
  # Two parallel legs, one per image. No `dotnet workload restore` in either:
  # CI logs prove it installs nothing ("No workloads installed for this feature
  # band … Successfully updated workload(s): .") and burned ~75 s per run.
  # ─────────────────────────────── DELIVERY GATE ───────────────────────────────
  # 🚨 Gate on the REQUIRED CHECK, not on the workflow run's umbrella conclusion.
  # A run's conclusion is `failure` if ANY job ends cancelled — including a job that
  # never executed a step because it waited 15 minutes for a runner and was killed
  # (main 2026-08-06: three consecutive main commits shipped no image for exactly this
  # reason, with every test that did run green). Keying delivery on that conclusion
  # means infrastructure noise silently stops the pull-based self-update, which is the
  # failure mode the merge gate exists to prevent.
  #
  # "Consolidate test results" is the repo's single required check (ruleset
  # `main pr protection`) and, since the evidence gate in dotnet-test.yml, it can only
  # be green if tests actually ran (or a proven green-tree marker was reused). So it is
  # both necessary and sufficient — and strictly stronger than the umbrella conclusion,
  # which a starved job can poison in either direction.
  gate:
    name: "Verify the required check is green"
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      green: ${{ steps.required.outputs.green }}
    steps:
      - name: "Read the required check for this commit"
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Latest run of the required check on this SHA (a re-run appends another).
          concl=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name=="Consolidate test results")]
                  | sort_by(.completed_at) | last | .conclusion // "missing"')
          echo "Required check 'Consolidate test results' on $SHA → $concl"
          echo "run conclusion (umbrella, informational) → ${{ github.event.workflow_run.conclusion }}"
          if [ "$concl" = "success" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Required check green — shipping images" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "### ⛔ Required check is \`$concl\` — no image will be built" >> "$GITHUB_STEP_SUMMARY"
          fi

  portal-image:
    name: "Build + push portal-ai image"
    # Gate: only a SUCCESSFUL test run, from a PUSH (not a PR), on main.
    needs: gate
    if: needs.gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the EXACT commit the tests passed on — not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      # The SDK container build + the publish output overflow the runner's ~14 GB; reclaim the
      # ~25 GB of preinstalled tooling a .NET build never touches (same as the test workflow).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # The image is tagged with the VERSION (3.0.0-ci.<run#>) AND the short SHA AND the moving `main`.
      # The version tag is what each install's self-updater (ReleaseStrategy.md) compares to decide a
      # rollout — so it MUST be the monotonic $(Version) (Directory.Build.props derives the .ci.<n>
      # suffix from $GITHUB_RUN_NUMBER). -getProperty:Version prints the computed version without
      # building; CIRun=true so it matches the version baked into the published binaries below.
      - name: Compute image tags (version + short SHA)
        id: vars
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(dotnet msbuild memex/aspire/Memex.Portal.Distributed/Memex.Portal.Distributed.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      # OIDC federated login — no client secret stored. Requires a federated credential on the
      # Azure AD app scoped to this repo's main branch (see the README block at the bottom).
      - name: Ensure Azure CLI
        # GitHub's ubuntu-latest no longer ships the Azure CLI on PATH for azure/login@v2
        # ("Unable to locate executable file: az"). Install it if missing (idempotent).
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # portal-ai app image — the deployment image (aspnet + node + Claude Code/Copilot CLIs),
      # layered on the base already in ACR. The base (memex-portal-ai-base) changes rarely and is
      # rebuilt by the release path / runbook §1, NOT on every main merge.
      # CIRun=true → continuous version 3.0.0-ci.<build> baked in; image tagged <sha> + moving `main`.
      #
      # MULTI-ARCH: we drop `-r linux-x64` and instead set ContainerRuntimeIdentifiers to
      # "linux-x64;linux-arm64". With no single RID set, the SDK (>= 8.0.405; we're on .NET 10)
      # publishes per-RID and combines the results into an OCI Image Index (manifest list) — so one tag
      # serves both x86 cloud nodes AND Apple-silicon (arm64) local k3s, which can then pull-and-self-
      # update natively from ACR instead of hand-building locally. ContainerRuntimeIdentifiers MUST be a
      # subset of RuntimeIdentifiers — that subset requirement is why <RuntimeIdentifiers>linux-x64;linux-arm64
      # </RuntimeIdentifiers> is declared INSIDE Memex.Portal.Distributed.csproj (project-local), NOT as a
      # global `-p:RuntimeIdentifiers` here: a global `-p:` propagates to every ProjectReference and makes
      # ~6 referenced libraries fail `NETSDK1083: RuntimeIdentifier 'linux-x64;linux-arm64' is not recognized`.
      # No Docker is needed: pushing the index straight to a remote registry (ContainerRegistry set) is Docker-free.
      # 🚨 PREREQUISITE: memex-portal-ai-base:latest in ACR must itself be MULTI-ARCH, else the arm64 leg
      # has no base layer and this step fails. base-image-acr.yml (workflow_dispatch) builds it multi-arch
      # (buildx → ACR); operators doing the first multi-arch roll run that once (see LocalColimaMac.md).
      # 🚨 List-valued `-p:` props are wrapped '"a;b"' — single-quoted DOUBLE-quotes around a REAL `;`, NOT
      # `%3B`. `%3B` is an MSBuild-ESCAPED (literal) semicolon, so `-p:ContainerRuntimeIdentifiers=a%3Bb` is a
      # SINGLE RID value "a;b" that NEVER splits into a list — the SDK then builds ONE image with the bogus RID
      # "linux-x64;linux-arm64" and fails (OutputPath MSB4115 / NETSDK1083). The '"…"' form (the SDK's own
      # documented Bash escaping) keeps the value one CLI switch while letting MSBuild split the real `;` into a
      # 2-item list. Applies to ContainerRuntimeIdentifiers AND ContainerImageTags (every `-p:` whose value is a `;`-list).
      - name: Build + push portal-ai
        run: >
          dotnet publish memex/aspire/Memex.Portal.Distributed/Memex.Portal.Distributed.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=memex-portal-ai
          -p:ContainerImageTags='"${{ steps.vars.outputs.version }};${{ steps.vars.outputs.sha }};main"'
          -p:ContainerBaseImage=${{ env.ACR }}/memex-portal-ai-base:latest

  migration-image:
    name: "Build + push migration image"
    needs: gate
    if: needs.gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Same $(Version) computation as the portal leg: both jobs run inside ONE
      # workflow run, so GITHUB_RUN_NUMBER — and therefore the computed
      # 3.0.0-ci.<n> tag — is identical across the two legs by construction.
      - name: Compute image tags (version + short SHA)
        id: vars
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(dotnet msbuild memex/aspire/Memex.Database.Migration/Memex.Database.Migration.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # migration — lean image on the standard (already multi-arch) aspnet base; same multi-arch publish.
      # <RuntimeIdentifiers> lives in Memex.Database.Migration.csproj (project-local, same reason as above).
      - name: Build + push migration
        run: >
          dotnet publish memex/aspire/Memex.Database.Migration/Memex.Database.Migration.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=memex-migration
          -p:ContainerImageTags='"${{ steps.vars.outputs.version }};${{ steps.vars.outputs.sha }};main"'
      # nodetype-bake — compiles every dynamic NodeType against THIS build into the shared assembly
      # cache before the portal rolls onto it, and fails the release on a regression. It must be
      # built from the SAME commit as the portal: the framework identity it bakes against is the
      # Graph MVID of these binaries, so an image built from a different commit would warm a cache
      # the portal cannot use. Same multi-arch publish; <RuntimeIdentifiers> is project-local.
      - name: Build + push nodetype-bake
        run: >
          dotnet publish memex/aspire/Memex.NodeType.Bake/Memex.NodeType.Bake.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=memex-bake
          -p:ContainerImageTags='"${{ steps.vars.outputs.version }};${{ steps.vars.outputs.sha }};main"'

  # The MeshWeaver.Plugins PR gate image: `mw-plugin-test` (tools/MeshWeaver.PluginTester)
  # imports a node-repo checkout into a fresh in-process mesh, asserts every NodeType compiles,
  # renders, and its `Tests` layout area executes green. The plugins repo's ci.yml `test-repos`
  # job runs INSIDE this image (repo variable MW_TEST_IMAGE), so every main build must refresh
  # it — `latest` is the stable tag that variable pins.
  plugin-test-image:
    name: "Build + push mw-plugin-test image"
    needs: gate
    if: needs.gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Same $(Version) computation as the other legs — GITHUB_RUN_NUMBER is shared across the
      # run, so the 3.0.0-ci.<n> tag matches the portal/migration images by construction.
      - name: Compute image tags (version + short SHA)
        id: vars
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(dotnet msbuild tools/MeshWeaver.PluginTester/MeshWeaver.PluginTester.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # Lean console image on the standard multi-arch base; <RuntimeIdentifiers> lives in the
      # csproj (project-local — a global -p:RuntimeIdentifiers breaks referenced libs, see above).
      # `latest` rides along so the plugins repo can pin MW_TEST_IMAGE=…/mw-plugin-test:latest.
      - name: Build + push mw-plugin-test (ACR)
        run: >
          dotnet publish tools/MeshWeaver.PluginTester/MeshWeaver.PluginTester.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=mw-plugin-test
          -p:ContainerImageTags='"${{ steps.vars.outputs.version }};${{ steps.vars.outputs.sha }};main;latest"'

      # ALSO publish to GHCR. The MeshWeaver.Plugins CI runs its `test-repos` gate INSIDE this
      # image, and that repo has no ACR credentials — it used to gate the whole job on a repo
      # variable nobody had set, so the gate reported "skipping" on every PR and every plugin's
      # `Tests` area was compiled but never executed. Publishing here gives that repo a registry
      # it can reach with a GitHub token, so the gate runs by default.
      - name: Lowercase image namespace (GHCR requires lowercase)
        run: echo "IMAGE_NS=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push mw-plugin-test (GHCR)
        run: >
          dotnet publish tools/MeshWeaver.PluginTester/MeshWeaver.PluginTester.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=$IMAGE_NS/mw-plugin-test
          -p:ContainerImageTags='"${{ steps.vars.outputs.version }};${{ steps.vars.outputs.sha }};main;latest"'

  # ─────────────────────────── portal-next (Next.js) ─────────────────────────
  # The React/Next.js portal. It is NOT a .NET project, so it cannot use the
  # `dotnet publish -t:PublishContainer` shape the other three legs share — it builds from
  # clients/portal-next/Dockerfile with the `clients/` directory as context (the app aliases
  # @meshweaver/react and @meshweaver/client-web to their SOURCE trees in ../react and
  # ../grpc-web, so the context has to span all three).
  #
  # 🚨 WHY THIS JOB EXISTS. Until now nothing built this image in CI: every deployment ran
  # `memex-portal-next:guiship-20260705-2109`, a hand-tagged one-off from 2026-07-05 that drifted
  # 11 commits behind main. Every portal-next change — the side-panel actions, the client
  # localization, the whole React GUI half — merged to main and then simply never shipped, with no
  # signal that it hadn't. A feature-flagged surface that silently stops receiving updates is worse
  # than one that is switched off, because it looks live.
  #
  # amd64 ONLY, on purpose: every AKS node in memexaks-cluster is amd64, and the runner is amd64,
  # so this builds natively with no QEMU emulation. memex-local builds its own arm64 image into
  # Colima's Docker store for local dev (see clients/portal-next/DEPLOY.md), so nothing needs the
  # arm64 variant from ACR.
  portal-next-image:
    name: "Build + push portal-next image"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the EXACT commit the tests passed on — not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # PREREQUISITE — grpc-web codegen. grpc-web/src/connection.ts imports ./gen/mesh_pb, which is
      # GENERATED (gitignored) by `buf generate` from the mesh .proto in the .NET tree
      # (src/MeshWeaver.Hosting.Grpc/Protos) — OUTSIDE the clients/ build context, and buf ships
      # glibc binaries that will not run in the musl Alpine build image. So it MUST happen here, on
      # the host, before the docker build. Without it the Next build fails with
      # "Module not found: Can't resolve './gen/mesh_pb'".
      - name: Generate gRPC-web client (buf)
        run: |
          set -euo pipefail
          # npm INSTALL, not `npm ci`: clients/grpc-web/package-lock.json is deliberately
          # GITIGNORED (clients/grpc-web/.gitignore), and `npm ci` hard-fails without a lockfile
          # ("can only install with an existing package-lock.json"). Every leg in clients.yml uses
          # `npm install` for exactly this reason. This is why the first portal-next CD run failed
          # while the other three image legs went green.
          npm --prefix clients/grpc-web install --no-audit --no-fund
          npm --prefix clients/grpc-web run gen
          test -f clients/grpc-web/src/gen/mesh_pb.ts
      # Same tag triple as the other legs, computed the same way, so a given main commit's
      # portal-ai and portal-next images always carry matching tags.
      - name: Compute image tags (version + short SHA)
        id: vars
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=3.0.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # DOCKER_BUILDKIT=1 explicitly: the Dockerfile opens with `# syntax=docker/dockerfile:1` and
      # relies on Dockerfile.dockerignore (a per-Dockerfile ignore, a BuildKit-only feature) to keep
      # node_modules/.next/dist out of the context. Without BuildKit that ignore is silently not
      # applied and the stale host artefacts get copied into the image.
      - name: Build + push portal-next
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          docker build
          --platform linux/amd64
          -f clients/portal-next/Dockerfile
          -t ${{ env.ACR }}/memex-portal-next:${{ steps.vars.outputs.version }}
          -t ${{ env.ACR }}/memex-portal-next:${{ steps.vars.outputs.sha }}
          -t ${{ env.ACR }}/memex-portal-next:main
          clients/
      - name: Push tags
        run: |
          set -euo pipefail
          docker push ${{ env.ACR }}/memex-portal-next:${{ steps.vars.outputs.version }}
          docker push ${{ env.ACR }}/memex-portal-next:${{ steps.vars.outputs.sha }}
          docker push ${{ env.ACR }}/memex-portal-next:main

  # ───────────────────────────── FAILURE ALERTING ────────────────────────────
  # A red CD after a green merge is otherwise INVISIBLE (nobody watches the Actions tab), and the
  # consequence is severe: the merged commit never gets a deployable image, so every pull-based
  # self-updating install silently stays on the previous image (2026-07-22: prod ran a leaky build
  # for 20h because run 29929207634 failed unnoticed). This job makes a failed main CD loud: it
  # files (or comments on) a GitHub issue labeled `ci-failure`.
  # - `if: failure()` with `needs`: fires only when at least one image job actually FAILED —
  #   not when they were skipped (PR-triggered workflow_run) and not on cancellation.
  # - Idempotent: one open `ci-failure` issue collects repeat failures as comments; a new issue is
  #   only created when none is open (close the issue once CD is green again).
  alert-on-failure:
    name: "Alert: CD failed on main"
    needs: [portal-image, migration-image, plugin-test-image, portal-next-image]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level map for this job: the default GITHUB_TOKEN
    # here only needs to read/write issues (no checkout, no OIDC).
    permissions:
      issues: write
    steps:
      - name: Create or comment on ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Ensure the label exists (--force = update-or-create, idempotent).
          gh label create ci-failure --repo "$GITHUB_REPOSITORY" \
            --description "A main-branch CD run failed - no deployable image was published" \
            --color B60205 --force
          body="CD failed on main: [run ${GITHUB_RUN_ID}](${RUN_URL}) for commit \`${HEAD_SHA}\`.

          No deployable image was published for this merge - every self-updating install stays on the PREVIOUS image until a CD run goes green. Triage the failed job in the linked run, fix (or re-run if infrastructure), and close this issue once CD is green."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CD failed on main: run ${GITHUB_RUN_ID}" \
              --label ci-failure --body "$body"
          fi

  # ─────────────────────────────── NO DEPLOY JOB ─────────────────────────────
  # Deployment is PULL-BASED, not push. CI's job ends at "publish the image to ACR" (the image
  # jobs above). Each installation — memex / atioz / memex-cloud AND every external install in the
  # world that prod knows nothing about — runs the in-portal self-updater
  # (memex/Memex.Portal.Shared/SelfUpdate): it polls ACR with its OWN workload identity, and, per its
  # own Admin/UpdatePolicy (Continuous/Stable/None + the CI-green gate), patches its OWN portal +
  # migration Deployments via its OWN in-cluster ServiceAccount token. So CI needs NO cluster
  # credentials — which is also why the old `az aks command invoke` deploy job was deleted: it
  # required a central service principal with per-cluster Azure RBAC (the `commandResults/read`
  # authorization failure on 2026-06-29), a model that cannot scale to installs prod doesn't manage.
  # See SelfUpdate.md / DEPLOY-RUNBOOK.md for enabling self-update on an environment (the SA + RBAC are
  # in the Helm chart; set selfUpdate.azureClientId and grant the UAMI AcrPull).
