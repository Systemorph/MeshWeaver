name: Continuous Delivery (main)

# CONTINUOUS-channel delivery: every merge to main that PASSES the test suite ships a
# fresh deployment image and rolls it out to every environment.
#
#   push main ─▶ "MeshWeaver Build and Test" (existing) ─▶ [THIS] images ─▶ deploy (memex, prod, memex-cloud)
#
# Why workflow_run (and not push: branches:[main]): we want the image+deploy to fire ONLY
# after the full test suite is green on the merged commit — never ship an image that failed
# tests. workflow_run starts after the named workflow COMPLETES; the `if` below filters to a
# successful run that came from a push to main (not a PR run, not a failed run).
#
# This is the CONTINUOUS channel (build-numbered 3.0.0-ci.<build> baked in, images tagged by
# commit SHA). The RELEASED channel — clean 3.0.0 NuGet packages + clean GHCR images — is a
# SEPARATE path fired by pushing a v*.*.* tag (release-packages.yml + release-images.yml).
# "Freeze a release" = push a tag; "merge to main" = this workflow.
#
# The portal and migration images build in PARALLEL jobs: the migration image is small
# (~5 min) and used to run sequentially after the portal's ~18-minute multi-arch publish on
# the same runner — a free ~5 min off every merge-to-deployed cycle. Each job is
# self-contained (checkout → az login → publish); the duplicated setup (~3 min) runs
# concurrently so it costs no wall-clock.
#
# ══════════════════════════ ALL-OR-NOTHING PUBLICATION ══════════════════════════
# 🚨 NO image in the set carries a consumer-visible tag unless EVERY image built.
#
# Each leg builds and pushes its layers under a per-run STAGING tag that nothing can select
# (`staging-<sha>-<run_id>` — VersionSelect.PlatformVersionTag requires `^\d+\.\d+\.\d+`, so a
# staging tag is invisible to every self-updater by construction). Only after all five legs
# succeed does the `promote` job apply the real tags, and promotion is a MANIFEST-ONLY operation
# (`docker buildx imagetools create`) — the layers are already in ACR, so it costs seconds.
#
# Why this shape and not "build to a tarball, push later": the bytes have to reach the registry
# for a push to happen at all, and pushing them to a staging tag costs exactly what pushing them
# to the real tag costs. The only thing worth withholding is the TAG, because the tag IS the
# entire consumer contract. Publishing to an archive instead (ContainerArchiveOutputPath) would
# move multi-GB tarballs — full base layers included, x2 architectures — through GitHub artifact
# storage between jobs, and `docker load` cannot even load a multi-arch OCI archive on the
# runner's classic image store. Same guarantee, an order of magnitude more machinery.
#
# Cost, measured on runs 31324251944 / 31326034137 (job wall clocks: plugin-test 13m27s — the
# pole since the nodetype-bake leg was retired in #1347; portal-ai 13m6s; migration 9m58s;
# portal-next 2m23s):
#   * full set available: ~13m30s → ~14m30s (+~1 min, the promote job's own runner acquisition
#     and ~15 s of manifest PUTs). The CD critical path grows by that one job and nothing else.
#   * memex-portal-ai's version tag specifically: it waits for the slowest leg rather than its
#     own, which is what makes the set all-or-nothing — 4f0c35c shipped a portal increment with
#     a leg missing (#1026), and ~1 minute is what not doing that costs.
#   * registry traffic: unchanged (same layers, pushed once). Accumulating tags per run per .NET
#     repo go DOWN, 6 → 5: today version+sha indexes plus four RID-suffixed variants; now the
#     staging index + its two RID variants plus the version and sha indexes.
#
# ═══════════════════════════ SELF-HEALING (RECONCILE) ═══════════════════════════
# 🚨 A failed CD run used to be TERMINAL. Nothing re-attempted it, so the commit simply never got
# an image and the hole was only ever closed incidentally, by the next merge — which publishes
# the LATER commit, so the failed commit's set was never completed, just superseded. That is how
# #1026 went unnoticed.
#
# The `schedule` trigger below closes that. It is a RECONCILER, not a retry: it asks "does main's
# current HEAD have a complete image set in ACR?" — observed state — and only when the answer is
# no does it drive a publish, saying out loud on the `ci-failure` issue what was missing. It
# never wraps a failing operation in a retry and never suppresses the original failure signal.
#
# It heals to HEAD, never to the failed commit. Re-publishing a superseded commit is not merely
# low-value, it is UNSOUND: the version tag comes from the BUILDING run's number, so republishing
# older code would mint a higher `-ci.<n>` for it and every install would roll "forward" onto
# older code — breaking the monotonic-build-number invariant VersionSelect documents in red.
#
# `workflow_dispatch` is the manual door to the same reconciler (`gh workflow run main-cd.yml`).
# 🚨 Neither new trigger weakens the push gate. `workflow_run` still requires
# `event == 'push' && head_branch == 'main'` — that is what stops a FORK's pull_request run
# (whose head_branch can also be "main") from publishing untrusted code with this repo's
# secrets. The reconcile paths never read the event payload at all: they resolve the target
# commit server-side as the tip of THIS repo's main and re-check the required test check on it,
# which a fork's code can never be.
on:
  workflow_run:
    workflows: ["MeshWeaver Build and Test"]
    types: [completed]
  # Reconcile cadence. Off the hour on purpose (the top of the hour is GitHub's most contended
  # scheduling slot).
  #
  # 🚨 THIS CADENCE IS THE PUBLISH-LATENCY BOUND, not the batch window. A merge that batching
  # declines leaves main's HEAD without an image set, which is precisely the state the reconciler
  # exists to close — so it ships on the NEXT tick whatever the window is set to. At the former
  # 3 h that made the worst case ~3 h from merge to published image, which the maintainer rejected
  # on 2026-08-17 ("3 hour window is not acceptable"). Hourly bounds it at ~1 h + the ~20 min
  # build (~30 min expected), and makes the batch window safe: coalescing no longer buys the tail.
  #
  # A healthy tick is ONE ~40 s job — `gate` stops the moment ACR says the set is complete — so
  # 24 ticks/day costs ~15 min of runner time a day, up from ~5 min. Runner time is NOT what caps
  # this, though; the 3-attempts-per-commit budget already bounds the failing case.
  #
  # 🚨 WHY NOT FASTER: since #1773 an install rolls per PUBLICATION event, and nothing paces the
  # rolls — `UpdatePolicyKind` picks a channel (Continuous/Stable/None), not a cadence, and the
  # `SelfUpdate__PollInterval: 1.00:00:00` that deliberately held AKS to ONE roll/day (2026-08-10)
  # binds to an option that no longer exists. So publication frequency is now portal-RESTART
  # frequency, one-for-one. Hourly is the fastest tick that is defensible until a roll floor lands
  # (#1778); tighten it once an install can decline to roll, not before.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# id-token: write is required for OIDC federated login to Azure (no stored client secret).
permissions:
  contents: read
  id-token: write
  # packages: write — the mw-plugin-test image is ALSO published to GHCR so the
  # MeshWeaver.Plugins CI can pull it with a GitHub token instead of ACR credentials.
  packages: write

# Every green main merge ships its OWN image increment — CD runs never supersede each
# other. The previous shared `main-cd` group dated from when this workflow also ROLLED
# OUT deployments; delivery is pull-based now (installs self-update by comparing the
# monotonic 3.0.0-ci.<n> version tag), so parallel image builds are safe: every tag is
# distinct and nothing here mutates a live environment. Under the shared group GitHub's
# one-pending-slot rule CANCELLED queued CD runs during merge bursts (6 cancelled runs
# on 2026-08-07 alone), silently dropping release increments.
# 🚨 SERIALIZE, and never cancel. The group used to be keyed on `github.run_id`, which is unique
# per run — so it grouped each run with itself and serialized NOTHING. Two CD runs for the same
# commit could therefore overlap, and because each one skipped when it saw "another CD run is
# already in flight", BOTH deferred and NEITHER published. Observed 2026-08-19 on cb33558: a
# workflow_run CD and a manual dispatch raced, both reported success, and no image was built —
# a mutual deferral that reads exactly like a healthy skip.
#
# Keyed on the ref, concurrent runs QUEUE instead: the second waits for the first, then finds a
# complete image set and exits with "nothing to reconcile", which is the honest no-op. And
# `cancel-in-progress: false` matters as much as the group — a CD run that is midway through
# pushing a multi-image set must never be killed, or the set is left incomplete, which is the
# very state the reconciler exists to repair.
concurrency:
  group: main-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR: meshweaver.azurecr.io
  AKS_RG: <aks-resource-group>
  AKS_CLUSTER: <aks-cluster>

jobs:
  # ─────────────────────────── BUILD + PUSH IMAGES ───────────────────────────
  # Two parallel legs, one per image. No `dotnet workload restore` in either:
  # CI logs prove it installs nothing ("No workloads installed for this feature
  # band … Successfully updated workload(s): .") and burned ~75 s per run.
  #
  # 🚨 No `jlumbroso/free-disk-space` in ANY leg either — do not re-add it. It was removed
  # 2026-08-09 after measuring what the runner actually has. From the free-disk-space step's
  # OWN "BEFORE CLEAN-UP" output on run 31304347053:
  #
  #     /dev/root  145G  58G used  88G available  40% /
  #
  # It then spent 123 s reclaiming 21 GiB to reach 108G available — on a job whose entire
  # publish needs a small fraction of the 88G that was already free. The "~14 GB runner"
  # the old comment guarded against no longer exists; hosted runners ship 145G.
  #
  # It was not merely useless, it was NEGATIVE: `large-packages: true` purges `azure-cli`,
  # so the very next step (`Ensure Azure CLI`, `command -v az || curl … | sudo bash`) found
  # it missing and spent ~20 s apt-reinstalling what the previous step had just deleted.
  # Removing the reclaim keeps az preinstalled, so that guard short-circuits to ~0 s.
  #
  # Measured cost of the round trip: ~143 s per image job, ~9.5 min of runner time per CD run.
  # If a leg ever genuinely runs out of disk it will fail loudly with ENOSPC — reclaim
  # selectively THEN, against a measurement, rather than pre-emptively on every job.
  #
  # 🚨 TRIAGE: "Cannot create image index because provided images are invalid" is NOT an
  # image-index defect and NOT a defect in the failing project. It means one per-RID leg
  # produced no image, because Microsoft.NET.Build.Containers' CreateNewImage catches a
  # cancellation, logs the bare warning "The operation was canceled." and STILL returns
  # success. The cancellation is that library's hard-coded 30 s
  # SocketsHttpHandler.ConnectTimeout on a stalled connect to the base registry
  # (mcr.microsoft.com) or to ACR — its inner TimeoutException is dropped, so nothing in the
  # log names a host. Read the ~30 s gap in the timestamps before the warning, not the error.
  # Root Directory.Build.props now fails the leg AT that point (error MW1026) with both
  # registries named, so a recurrence is one line to attribute — see issue #1026 for the
  # full trace (CD run 31322066110, the nodetype-bake leg's linux-arm64 publish,
  # 16:01:03.9 → 16:01:34.1 — that leg is retired, the failure mode is not).
  #
  # 🚨 A leg that dies this way can no longer leave a PARTIAL release — that was 4f0c35cfc,
  # which shipped memex-portal-ai:3.0.0-rc1.ci.2470 with one leg missing (#1026), i.e. an
  # incomplete set behind a green tick. Every leg now pushes only a STAGING tag and
  # the `promote` job applies the real tags after ALL of them succeed. Do NOT paper a failing leg
  # over by retrying the publish, dropping a RID or `continue-on-error`: a genuine build failure
  # must fail CD loudly and completely, and the reconciler will re-attempt HEAD on its own.
  # ─────────────────────────────── DELIVERY GATE ───────────────────────────────
  # 🚨 Gate on the REQUIRED CHECK, not on the workflow run's umbrella conclusion.
  # A run's conclusion is `failure` if ANY job ends cancelled — including a job that
  # never executed a step because it waited 15 minutes for a runner and was killed
  # (main 2026-08-06: three consecutive main commits shipped no image for exactly this
  # reason, with every test that did run green). Keying delivery on that conclusion
  # means infrastructure noise silently stops the pull-based self-update, which is the
  # failure mode the merge gate exists to prevent.
  #
  # "Consolidate test results" is the repo's single required check (ruleset
  # `main pr protection`) and, since the evidence gate in dotnet-test.yml, it can only
  # be green if tests actually ran (or a proven green-tree marker was reused). So it is
  # both necessary and sufficient — and strictly stronger than the umbrella conclusion,
  # which a starved job can poison in either direction.
  #
  # This job is ALSO the reconciler's brain and the single source of the target commit. Three
  # entry shapes, one output contract (`publish` / `sha` / `short_sha` / `staging_tag` / `reason`):
  #
  #   workflow_run  → target = the event's head_sha. The `if:` below keeps the ORIGINAL push gate
  #                   verbatim; nothing about the trusted path changed. Always publishes when the
  #                   required check is green (a new merge always earns a new increment).
  #   schedule /    → target = the tip of THIS repo's main, resolved through the API, never from
  #   dispatch        the event payload. Publishes ONLY when ACR is missing part of that commit's
  #                   set — i.e. driven by observed state, which is what makes it a reconciler
  #                   rather than a retry.
  #
  # ─────────────────── PREFLIGHT: assert the external inputs, RED ───────────────────
  # 🚨 A gate NEVER tests its own inputs. Every CI input that comes from outside the tree is
  # asserted HERE and fails RED naming exactly what to provision; no downstream job carries an
  # input-shaped `if:` ("is the secret set?") or a `continue-on-error:` on the step that fetches
  # its input. GitHub renders a skipped job with the same tick as a passed one, so the two shapes
  # are how a gate reports success having verified nothing.
  #
  # This job exists because that is precisely what happened to the release broadcast (#2235):
  # `notify-platform-update` opened with `if [ -z "$URL" ] || [ -z "$SECRET" ]; then … exit 0`,
  # so an unprovisioned notify path was a NOTICE in a summary nobody reads and a green tick on
  # every promote. The broadcast dispatched nothing for eight days and CD said "delivered" every
  # single time.
  #
  # No `if:` on this job at all — not even "only when we publish". It asserts and fails; it does
  # not decide whether to run. An hourly reconcile tick that publishes nothing still proves the
  # notify path is provisioned, so an unset secret is found on the next tick rather than on the
  # next release.
  preflight:
    name: "Assert the inputs exist"
    # 🚨 The ONE sanctioned condition, and it is a check on the EVENT — never on whether a secret is
    # set. It is byte-identical to `gate`'s below, and it is here for the same reason: `workflow_run`
    # fires for EVERY completion of Build-and-Test, PRs included, and GitHub withholds org secrets
    # from a FORK by design. Without this a fork's PR would light up a red CD run asserting inputs
    # it can never be given — the one legitimate exemption AGENTS.md carves out, expressed once, on
    # the event. It costs nothing in coverage: a run this skips is a run where `gate` publishes
    # nothing either, so there is no path on which CD acts without having been preflighted.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every external input, or a red build naming what to provision
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLATFORM_WEBHOOK_URL: ${{ vars.PLATFORM_WEBHOOK_URL }}
          PLATFORM_WEBHOOK_SECRET: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=("secrets.AZURE_CLIENT_ID           OIDC app registration for azure/login")
          [ -n "$AZURE_TENANT_ID" ]       || missing+=("secrets.AZURE_TENANT_ID           the Systemorph AAD tenant")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("secrets.AZURE_SUBSCRIPTION_ID     the subscription holding ACR meshweaver")
          [ -n "$PLATFORM_WEBHOOK_URL" ]  || missing+=("vars.PLATFORM_WEBHOOK_URL         the control instance's inbox, e.g. https://<instance>/api/hooks/Hosting/PlatformBuilds — WITHOUT it no release event ever reaches the mesh, so the framework-release broadcast to the node repos never fires and every satellite falls back to its schedule poll")
          [ -n "$PLATFORM_WEBHOOK_SECRET" ] || missing+=("secrets.PLATFORM_WEBHOOK_SECRET  the shared HMAC the inbox watcher verifies X-Hub-Signature-256 against. It must be BYTE-IDENTICAL to the control instance's Hosting:PlatformWebhookSecret (Key Vault -> Hosting-PlatformWebhookSecret, see deploy/aks/envs/example/secretproviderclass.yaml); a mismatch is INVISIBLE from here — the POST still answers 2xx and the watcher silently drops every delivery as unverifiable")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::CD cannot deliver a release event — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "All external inputs are present."

  # Every downstream job takes its commit from here, so a push run and a heal run are literally
  # the same pipeline with a different target and a different reason.
  gate:
    name: "Resolve the target commit and decide whether to publish"
    # The push gate, unchanged, for the ONLY path that trusts the event payload. Schedule and
    # workflow_dispatch carry no workflow_run object at all, so they fall through to the
    # reconcile branch below — which trusts nothing but the API and the registry.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions REPLACE the workflow-level map, so EVERY one this job needs is here —
    # an omission surfaces as a 403 at runtime, on main, in the job that decides whether anything
    # ships at all:
    #   contents  — checkout, for the shared check script
    #   id-token  — OIDC → Azure, to read ACR manifests
    #   issues    — the heal ledger (see "attempt budget" below)
    #   checks    — `commits/$SHA/check-runs`, the required-check gate
    #   actions   — `gh run list`, the in-flight-publish check
    permissions:
      contents: read
      id-token: write
      issues: write
      checks: read
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
      staging_tag: ${{ steps.target.outputs.staging_tag }}
      reason: ${{ steps.target.outputs.reason }}
      # The three facts the delivery verdict below judges. Exposed as outputs so the check is a
      # JOB anyone can read in the run summary, not a conclusion buried in this job's log.
      complete: ${{ steps.acr.outputs.complete }}
      green: ${{ steps.required.outputs.green }}
    steps:
      - uses: actions/checkout@v7
      - name: "Resolve the target commit"
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            reason="push"
          else
            # 🚨 Server-side truth, not the event payload. A fork can push anything to a branch
            # called "main" in its own repo; it can never be the tip of THIS repo's main.
            sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
            reason="reconcile"
          fi
          # 🚨 The ONE definition of the short SHA — every job, and the image-set check, use this
          # output. `git rev-parse --short` uses core.abbrev=auto, which can hand out 8 characters
          # for an ambiguous prefix; a promote that tagged 7 while verify looked for 8 would be a
          # silent, unreproducible miss. A fixed cut cannot drift.
          short=$(printf '%s' "$sha" | cut -c1-7)
          echo "sha=$sha"                                     >> "$GITHUB_OUTPUT"
          echo "short_sha=$short"                             >> "$GITHUB_OUTPUT"
          echo "reason=$reason"                               >> "$GITHUB_OUTPUT"
          echo "staging_tag=staging-$short-$GITHUB_RUN_ID"    >> "$GITHUB_OUTPUT"
          echo "Target: $sha ($short), entered via $reason (event ${{ github.event_name }})."
      - name: "Read the required check for this commit"
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          REASON: ${{ steps.target.outputs.reason }}
        run: |
          set -euo pipefail
          # Latest run of the required check on this SHA (a re-run appends another).
          # 🚨 STATUS as well as conclusion. A check that is still RUNNING has conclusion `null`,
          # which is indistinguishable from "never ran" if you only read the conclusion — and the
          # reconciler draws opposite conclusions from those two ("wait" vs "main cannot ship").
          # Sorted by started_at, not completed_at: an in-progress run has no completed_at.
          read -r status concl < <(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name=="Consolidate test results")]
                  | sort_by(.started_at) | last // {}
                  | "\(.status // "absent") \(.conclusion // "none")"')
          # How long CI has had. Distinguishes "no check YET" (a merge seconds ago) from "no check
          # EVER" (AGENTS.md trap #1) without a timer that retries anything.
          # RECONCILE ONLY, deliberately: the push path does not use it, and this is the step every
          # delivery depends on — no reason to put an extra API call and a `date -d` on that path.
          age_min=0
          if [ "$REASON" = "reconcile" ]; then
            committed=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.committer.date')
            age_min=$(( ( $(date -u +%s) - $(date -u -d "$committed" +%s) ) / 60 ))
          fi
          echo "Required check 'Consolidate test results' on $SHA → $status/$concl (commit is ${age_min} min old)"
          echo "run conclusion (umbrella, informational) → ${{ github.event.workflow_run.conclusion }}"
          echo "green=$([ "$status" = "completed" ] && [ "$concl" = "success" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pending=$([ "$status" = "queued" ] || [ "$status" = "in_progress" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "conclusion=$status/$concl" >> "$GITHUB_OUTPUT"
          echo "age_min=$age_min" >> "$GITHUB_OUTPUT"
      # The reconcile path only — a push always publishes and never needs to ask the registry.
      #
      # 🚨 Deliberately NOT also gated on the required check being green. The registry answer is
      # what separates "nothing is wrong" from "main's HEAD cannot ship AND has no images", and the
      # second one has to be said out loud: if Build-and-Test never ran on HEAD (a CI incident, a
      # stalled queue — AGENTS.md's trap #1), the check reads `missing`, nothing can publish that
      # commit, and without this the reconciler would go quiet about it on every tick forever.
      - name: Ensure Azure CLI
        if: steps.target.outputs.reason == 'reconcile' || vars.CD_BATCH_WINDOW_MINUTES != ''
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        if: steps.target.outputs.reason == 'reconcile' || vars.CD_BATCH_WINDOW_MINUTES != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # ── BATCHING (push path only, opt-in via repo var CD_BATCH_WINDOW_MINUTES) ─────────────
      # Maintainer 2026-08-16: "batch updates are ok." A merge landing while the NEWEST published
      # version tag is younger than the window does not publish; the hourly reconciler then
      # publishes main's tip on its next tick (its registry-first probe sees the missing set and
      # heals it — that machinery predates batching and re-checks the required check itself).
      #
      # 🚨 So the WINDOW controls coalescing, and the RECONCILE CADENCE controls the tail — they
      # are not the same knob, and raising the window does not delay a merge by the window. Both
      # were 3 h until 2026-08-17, which is why a merge could sit unpublished that long; the
      # maintainer rejected that ("3 hour window is not acceptable"). Now: window **60 min** (the
      # repo var `CD_BATCH_WINDOW_MINUTES` — this comment does not set it, so treat the variable as
      # the authority and this line as its intent), ticks **hourly** (`23 * * * *`). A lone fix
      # landing more than an hour after the last publish ships at once; a batched one waits at
      # most one tick.
      # `workflow_dispatch` bypasses the window by construction (it enters via the reconcile
      # branch), so an urgent fix ships immediately with one manual run.
      # 🚨 FAILS OPEN: if the registry cannot be read, the age reports 999999 and the merge
      # publishes — a broken batching probe must cost at most one extra image build, never a
      # missed publish. Unset/empty var = publish every merge (the historical behavior).
      - name: "Age of the newest published set (batching probe)"
        id: freshness
        if: steps.target.outputs.reason == 'push' && vars.CD_BATCH_WINDOW_MINUTES != ''
        run: |
          set -uo pipefail
          newest=$(az acr repository show-tags -n meshweaver --repository memex-portal-ai \
            --orderby time_desc --detail --top 20 \
            --query "[?contains(name, 'ci.')] | [0].lastUpdateTime" -o tsv 2>/dev/null || true)
          # Fail-open must survive EVERY failure shape, including a timestamp `date -d` cannot
          # parse: an error inside arithmetic expansion is fatal to the shell, which would fail
          # this step — and the gate job with it — CLOSED. So the epoch parse is guarded on its
          # own line and age_min only computed from a verified number (Copilot review, #1691).
          age_min=999999
          if [ -n "$newest" ]; then
            epoch=$(date -u -d "$newest" +%s 2>/dev/null || true)
            case "$epoch" in
              ''|*[!0-9]*) echo "::warning::Batching probe could not parse '$newest' — failing OPEN (this merge publishes)." ;;
              *) age_min=$(( ( $(date -u +%s) - epoch ) / 60 )) ;;
            esac
          else
            echo "::warning::Batching probe could not read the registry — failing OPEN (this merge publishes)."
          fi
          echo "Newest published ci tag: ${newest:-<none>} (${age_min} min ago)"
          echo "age_min=$age_min" >> "$GITHUB_OUTPUT"
      - name: "Does main's HEAD already have a complete image set?"
        id: acr
        if: steps.target.outputs.reason == 'reconcile'
        run: |
          set -uo pipefail
          if .github/scripts/check-image-set.sh "${{ steps.target.outputs.short_sha }}"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      # ── The decision, and (reconcile only) the ATTEMPT BUDGET ──────────────────────────────
      # A reconciler that cannot succeed must not grind forever. Persistent failure here means
      # main's HEAD genuinely does not build an image — a human has to act — and re-attempting
      # on every tick would burn ~75 min of runner time a tick and drip identical comments onto an
      # issue nobody would keep reading. So the budget is 3 attempts PER COMMIT, and the ledger
      # is the `ci-failure` issue itself: the surface a human already watches, no new state store.
      #
      #   * The slot is consumed when an attempt STARTS, not when it fails — a run that dies
      #     without reporting must not buy an infinite supply of retries.
      #   * A new HEAD resets the budget naturally (the marker carries the SHA).
      #   * 🚨 This budget is also what makes the hourly cadence affordable: a broken HEAD
      #     costs 3 attempts PER COMMIT, not per tick, so a 6× faster reconcile multiplies only
      #     the ~40 s healthy probe — never the ~75 min failing one.
      #   * On exhaustion it stops attempting, says so ONCE, and labels the issue `cd-unhealed`.
      #     Later ticks then cost ~40 s and print nothing — loud once, then quiet, which is the
      #     opposite of a repeating alarm nobody reads. Closing the issue is a deliberate human
      #     act and legitimately grants a fresh budget.
      - name: "Are there image-relevant changes since the newest published set?"
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          # Paths that PROVABLY enter no published image: the standalone clients (a Python LAN
          # gateway and the Expo app — neither is COPY'd by any Dockerfile in the set). A merge
          # touching ONLY these must not cost a ~20-minute five-image build and a fleet roll.
          # 🚨 FAIL-OPEN: any doubt — no published set, unresolvable base, unreadable compare —
          # publishes as today. The only way to skip is a POSITIVE finding that every changed
          # file since the newest PUBLISHED set matches the list. Diffing against the newest
          # published set (not HEAD^) is what keeps the reconciler stable: a skipped tip differs
          # from the last set only by irrelevant files, so the reconcile branch skips it too
          # instead of "healing" it back into a build every tick.
          IRRELEVANT='^clients/(react-native|voice-gateway)/'
          relevant=true
          newest_short=$(az acr repository show-tags -n meshweaver --repository memex-portal-ai \
            --orderby time_desc --top 60 --query "[].name" -o tsv 2>/dev/null \
            | grep -E '^[0-9a-f]{7}$' | head -1 || true)
          if [ -n "$newest_short" ] && [ "$newest_short" != "$(printf '%s' "$SHA" | cut -c1-7)" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/commits/$newest_short" --jq .sha 2>/dev/null || true)
            if [ -n "$base" ]; then
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$SHA" --jq '.files[].filename' 2>/dev/null || true)
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$IRRELEVANT"; then
                relevant=false
              fi
            fi
          fi
          echo "Newest published set: ${newest_short:-<none>}; image-relevant changes since: $relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      - name: "Decide"
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEVANT: ${{ steps.relevance.outputs.relevant }}
          SHORT: ${{ steps.target.outputs.short_sha }}
          REASON: ${{ steps.target.outputs.reason }}
          GREEN: ${{ steps.required.outputs.green }}
          PENDING: ${{ steps.required.outputs.pending }}
          CONCL: ${{ steps.required.outputs.conclusion }}
          AGE_MIN: ${{ steps.required.outputs.age_min }}
          COMPLETE: ${{ steps.acr.outputs.complete }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ATTEMPTS: "3"
          BATCH_WINDOW: ${{ vars.CD_BATCH_WINDOW_MINUTES }}
          FRESH_AGE_MIN: ${{ steps.freshness.outputs.age_min }}
        run: |
          set -euo pipefail
          decision() { echo "publish=$1" >> "$GITHUB_OUTPUT"; echo "### $2" >> "$GITHUB_STEP_SUMMARY"; echo "$2"; }
          # How many comments on issue $1 carry the marker $2 — the whole state store for the
          # attempt budget and for the one-shot reports. Markers are HTML comments, so they are
          # invisible in the rendered issue but exact to match.
          count_marker() {
            gh issue view "$1" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq "[.comments[] | select(.body | contains(\"$2\"))] | length"
          }

          if [ "$REASON" = "push" ]; then
            if [ "$GREEN" != "true" ]; then
              decision false "⛔ \`Consolidate test results\` on $SHORT is \`$CONCL\` — nothing will be built"
            elif [ "$RELEVANT" = "false" ]; then
              decision false "⏭️ Only image-irrelevant paths (standalone clients) changed since the newest published set — no image build for \`$SHORT\`"
            # Batching window (see the freshness probe above): a green merge inside the window
            # defers to the reconciler's next tick. Deliberately SILENT beyond the summary — this
            # is intentional cadence, not a fault, and the reconciler self-heals it by design.
            elif [ "$COMPLETE" != "true" ] && [ -n "${BATCH_WINDOW:-}" ] \
                 && [ "${FRESH_AGE_MIN:-999999}" -lt "$BATCH_WINDOW" ]; then
              # 🚨 Batching NEVER applies to a HEAD that has no image set of its own.
              #
              # Coalescing several rapid merges onto one build is only safe while main is already
              # DELIVERABLE — then the window defers an UPDATE. When HEAD has no complete set the
              # same decision defers the ONLY image, and main sits undeliverable behind a window
              # measured against some OTHER commit's build.
              #
              # Its promise ("the reconciler publishes main's tip within the hour") did not hold
              # either, and the way it failed is worth keeping: the scheduled reconcile had already
              # run 3 min earlier and correctly answered "waiting for CI"; the run that fired once
              # CI went green entered via workflow_run and so took the PUSH path — and batched. No
              # further reconcile was due for an hour. Observed 2026-08-19 on 17a7f16, whose
              # decision log reads `Newest published set: <none>` and `🕐 Batched … 44 min old` in
              # consecutive lines.
              decision true "✅ Required check green and \`$SHORT\` has NO image set — publishing now rather than batching (a window may defer an update, never the only image)"
            elif [ -n "${BATCH_WINDOW:-}" ] && [ "${FRESH_AGE_MIN:-999999}" -lt "$BATCH_WINDOW" ]; then
              decision false "🕐 Batched: newest published set is ${FRESH_AGE_MIN} min old (< ${BATCH_WINDOW} min window) — main's tip already has a complete image set, so this defers an UPDATE; the reconciler publishes within the hour, or run this workflow manually to ship now"
            else
              decision true "✅ Required check green — publishing the full image set for \`$SHORT\`"
            fi
            exit 0
          fi

          # ── reconcile ────────────────────────────────────────────────────────────────────────
          # Registry first: a complete set means nothing is wrong, whatever the check says. This is
          # the overwhelmingly common tick and it ends here, having cost ~40 s and said nothing.
          if [ "$COMPLETE" = "true" ]; then
            decision false "✅ main \`$SHORT\` already has a complete image set — nothing to reconcile"
            exit 0
          fi

          # A tip that differs from the newest PUBLISHED set only by image-irrelevant paths is
          # NOT unhealed state — it is the deliberate skip above, seen from the next tick. Without
          # this the reconciler would "heal" every skipped clients-only merge back into a build.
          if [ "$RELEVANT" = "false" ]; then
            decision false "⏭️ main \`$SHORT\` differs from the newest published set only in image-irrelevant paths — nothing to reconcile"
            exit 0
          fi

          # 🚨 CRY WOLF AND THE LEDGER BECOMES NOISE. A tick landing in the ~22 min while
          # Build-and-Test runs on a fresh merge sees an incomplete set and an unconcluded check —
          # which is NORMAL, not a fault. So "still testing", and "merged moments ago, no check
          # created yet", both mean WAIT, silently. Only a check that has actually concluded
          # non-success, or one that is still absent long after CI should have reported, is the
          # unhealable state worth waking someone for.
          if [ "$PENDING" = "true" ] || { [ "$GREEN" != "true" ] && [ "$AGE_MIN" -lt 120 ]; }; then
            decision false "⏳ \`Consolidate test results\` on $SHORT is \`$CONCL\` and the commit is ${AGE_MIN} min old — waiting for CI, nothing to reconcile yet"
            exit 0
          fi

          # 🚨 UNHEALABLE, and it must not be silent. HEAD has no complete image set AND its
          # required check has settled on something other than success (or never appeared at all,
          # two hours on — AGENTS.md's trap #1). No amount of reconciling fixes that from here;
          # only CI going green on HEAD does (a `gh workflow run "MeshWeaver Build and Test"
          # --ref main` is enough — this reconciler reads the CHECK on the commit, not the event
          # that produced it, so unlike the old push-gated CD it WILL pick that up on its next
          # tick). Said ONCE per commit, then quiet — same discipline as the exhausted budget.
          #
          # Past this line the tick has something real to say, so it may touch the ledger. Nothing
          # above it writes anything at all: a healthy tick, and a tick that is merely early, are
          # both completely silent.
          # 🚨 The `|| echo "::warning::…"` ON THE LABEL ONLY, and it is load-bearing. (A warning
          # rather than a bare `|| true`: the failure still has to be visible in the run, it just
          # must not be fatal.) This step runs under
          # `set -euo pipefail`, so on 2026-08-17 a GitHub API 503 on `/labels` — ensuring a
          # COSMETIC label, idempotently, with --force — killed the Decide step and blocked
          # publication outright. The gate had already resolved everything correctly: the required
          # check read `completed/success` and the image set was genuinely incomplete, i.e. it was
          # about to publish. It also burned one of the 3 heal attempts for that commit.
          #
          # A label is decoration on the ledger, not the ledger. The ledger is the marker COMMENT
          # below, and that write stays fatal — an attempt that is not written down is an attempt
          # that can be repeated forever. Same test AGENTS.md applies to the green-marker push:
          # what does a failure here hide? Nothing — losing a label costs a colour, never
          # correctness. Do NOT extend this to the issue create/comment calls.
          gh label create ci-failure --repo "$GITHUB_REPOSITORY" \
            --description "A main-branch CD run failed - no deployable image was published" \
            --color B60205 --force >/dev/null || echo "::warning::could not ensure the ci-failure label (continuing — the ledger is the comment, not the label)"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ "$GREEN" != "true" ]; then
            if [ -n "$issue" ] && [ "$(count_marker "$issue" "<!-- cd-blocked:$SHORT -->")" -eq 0 ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s\n\n%s' \
                "<!-- cd-blocked:$SHORT -->" \
                "🚧 **main \`$SHORT\` cannot be published**: it has no complete image set AND its required check \`Consolidate test results\` is \`$CONCL\`." \
                "The reconciler will not attempt it — CD must never publish an untested tree. This clears itself the moment Build-and-Test goes green on HEAD (\`gh workflow run \"MeshWeaver Build and Test\" --ref main\` is enough; the reconciler reads the check on the commit, not the event that produced it), or when the next merge moves HEAD.")"
            fi
            decision false "🚧 \`Consolidate test results\` on $SHORT is \`$CONCL\` and the image set is incomplete — cannot publish"
            exit 0
          fi

          # 🚨 Never race an in-flight publish for the same commit. A CD run's head_sha IS the
          # commit it targets, so this is an observed-state check, not a lock: if someone's merge
          # is already building $SHORT, there is nothing to reconcile yet.
          # (The "another run is in flight" guard that used to sit here is GONE. It was the
          # mutual-deferral bug: with the concurrency group above, runs for a ref cannot overlap,
          # so a second run is queued rather than concurrent — and once it starts, the COMPLETE
          # check a few lines up is what makes it a no-op. Re-adding an in-flight test would
          # re-arm the defect, because a run QUEUED behind this one also counts as "in flight".)

          # The ledger has to exist before an attempt is recorded — an attempt that is not written
          # down is an attempt that can be repeated forever.
          if [ -z "$issue" ]; then
            # `gh issue create` prints the issue URL (it has no --json); the number is its tail.
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --label ci-failure \
              --title "CD: main \`$SHORT\` has an incomplete image set" \
              --body "main's HEAD \`$SHORT\` is missing part of its deployment image set in ACR, so every self-updating install stays on the previous image. The CD reconciler will attempt to publish it; this issue collects those attempts. Close it once CD is green again.")
            issue="${url##*/}"
          fi

          attempts=$(count_marker "$issue" "<!-- cd-heal:$SHORT -->")
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            if [ "$(count_marker "$issue" "<!-- cd-heal-stopped:$SHORT -->")" -eq 0 ]; then
              gh label create cd-unhealed --repo "$GITHUB_REPOSITORY" \
                --description "CD could not publish a complete image set and has stopped retrying" \
                --color 5319E7 --force >/dev/null
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label cd-unhealed >/dev/null
              # printf, not a multi-line string literal: this whole step is a YAML block scalar,
              # so a body line starting at column 1 would end the block — and indenting it would
              # bury the text in a markdown code fence.
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s\n\n%s' \
                "<!-- cd-heal-stopped:$SHORT -->" \
                "🛑 **Automatic healing STOPPED for \`$SHORT\`** after $MAX_ATTEMPTS attempts." \
                "main's HEAD still has no complete image set, so **no install will ever roll forward** until a human acts: fix whatever fails in the image jobs of the linked runs and merge, or close this issue to grant the reconciler a fresh budget. The reconciler will not attempt \`$SHORT\` again.")"
            fi
            decision false "🛑 heal budget exhausted for \`$SHORT\` ($MAX_ATTEMPTS attempts) — not retrying"
            exit 0
          fi

          n=$((attempts + 1))
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s\n\n%s' \
            "<!-- cd-heal:$SHORT -->" \
            "🔁 **CD reconcile attempt $n/$MAX_ATTEMPTS for \`$SHORT\`** ([run]($RUN_URL))." \
            "main's HEAD is missing part of its image set in ACR (that run's annotations name which repositories), so this run is publishing the full set for \`$SHORT\`. The commit whose CD run originally failed is NOT re-published — it is superseded by HEAD on purpose: the version tag comes from the BUILDING run's number, so re-publishing older code would mint a higher \`-ci.<n>\` for it and roll every install backwards.")"
          decision true "🔁 reconcile attempt $n/$MAX_ATTEMPTS — publishing the full image set for \`$SHORT\`"

  portal-image:
    name: "Build + push portal-ai image"
    # Gate: a commit whose required check is green, resolved by `gate` (push OR reconcile).
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the EXACT commit the tests passed on — not whatever main is now.
          ref: ${{ needs.gate.outputs.sha }}
      # 🚨 The portal HOST lives in MeshWeaver.Plugins (#2293 removed it from here). This checkout is
      # what makes the image buildable at all; without it the publish below has no project.
      #
      # ref defaults to `main` and is overridable by a repo variable, mirroring the plugins lane's
      # own MW_PLATFORM_REF. The variable does not decouple "which plugins commit shipped with which
      # core commit" — it makes that coupling STEERABLE, so pinning to a known-good plugins commit
      # during an incident is a variable change rather than editing this file under pressure.
      - name: Check out MeshWeaver.Plugins (holds the portal host)
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver.Plugins
          ref: ${{ vars.MW_PLUGINS_REF || 'main' }}
          path: plugins-repo
          ssh-key: ${{ secrets.PLUGINS_REPO_SSH_KEY }}
          fetch-depth: 1
      # The SDK container build + the publish output overflow the runner's ~14 GB; reclaim the
      # ~25 GB of preinstalled tooling a .NET build never touches (same as the test workflow).
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The VERSION (3.0.0-rc1.ci.<run#>) is what each install's self-updater (ReleaseStrategy.md)
      # compares to decide a rollout — so it MUST be the monotonic $(Version) (Directory.Build.props
      # derives the .ci.<n> suffix from $GITHUB_RUN_NUMBER). -getProperty:Version prints the computed
      # version without building; CIRun=true so it matches the version baked into the binaries below.
      # It is NOT applied here: this job only pushes the staging tag, and `promote` applies this
      # version (job output) once every leg has succeeded.
      - name: Compute image version
        id: vars
        run: |
          set -euo pipefail
          # 🚨 Read from a project that STAYS in this repo. This used to read
          # Memex.Portal.Distributed, which moved to MeshWeaver.Plugins — and CD then failed here for
          # every commit on main, publishing nothing, until someone noticed nothing had shipped.
          # Version comes from the root Directory.Build.props, so ANY core project yields the same
          # value; Mesh.Contract is picked because it is cheap and is not going anywhere.
          #
          # -getProperty: asks MSBuild for the COMPUTED value, deliberately not a grep of the props
          # file: a regex keeps returning a plausible, well-formed, WRONG number after the definition
          # moves — and that number gets published.
          VERSION=$(dotnet msbuild src/MeshWeaver.Mesh.Contract/MeshWeaver.Mesh.Contract.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          # Refuse rather than invent: an empty version becomes `:` or `latest` somewhere downstream,
          # which is the failure where a tag exists and points at the wrong thing.
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve Version from the platform checkout. Refusing to invent one."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      # OIDC federated login — no client secret stored. Requires a federated credential on the
      # Azure AD app scoped to this repo's main branch (see the README block at the bottom).
      - name: Ensure Azure CLI
        # GitHub's ubuntu-latest no longer ships the Azure CLI on PATH for azure/login@v3
        # ("Unable to locate executable file: az"). Install it if missing (idempotent).
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # portal-ai app image — the deployment image (aspnet + node + Claude Code/Copilot CLIs),
      # layered on the base already in ACR. The base (memex-portal-ai-base) changes rarely and is
      # rebuilt by the release path / runbook §1, NOT on every main merge.
      # CIRun=true → continuous version 3.0.0-ci.<build> baked in; image tagged <sha> + moving `main`.
      #
      # MULTI-ARCH: we drop `-r linux-x64` and instead set ContainerRuntimeIdentifiers to
      # "linux-x64;linux-arm64". With no single RID set, the SDK (>= 8.0.405; we're on .NET 10)
      # publishes per-RID and combines the results into an OCI Image Index (manifest list) — so one tag
      # serves both x86 cloud nodes AND Apple-silicon (arm64) local k3s, which can then pull-and-self-
      # update natively from ACR instead of hand-building locally. ContainerRuntimeIdentifiers MUST be a
      # subset of RuntimeIdentifiers — that subset requirement is why <RuntimeIdentifiers>linux-x64;linux-arm64
      # </RuntimeIdentifiers> is declared INSIDE Memex.Portal.Distributed.csproj (project-local), NOT as a
      # global `-p:RuntimeIdentifiers` here: a global `-p:` propagates to every ProjectReference and makes
      # ~6 referenced libraries fail `NETSDK1083: RuntimeIdentifier 'linux-x64;linux-arm64' is not recognized`.
      # No Docker is needed: pushing the index straight to a remote registry (ContainerRegistry set) is Docker-free.
      # 🚨 PREREQUISITE: memex-portal-ai-base:latest in ACR must itself be MULTI-ARCH, else the arm64 leg
      # has no base layer and this step fails. base-image-acr.yml (workflow_dispatch) builds it multi-arch
      # (buildx → ACR); operators doing the first multi-arch roll run that once (see LocalColimaMac.md).
      # 🚨 List-valued `-p:` props are wrapped '"a;b"' — single-quoted DOUBLE-quotes around a REAL `;`, NOT
      # `%3B`. `%3B` is an MSBuild-ESCAPED (literal) semicolon, so `-p:ContainerRuntimeIdentifiers=a%3Bb` is a
      # SINGLE RID value "a;b" that NEVER splits into a list — the SDK then builds ONE image with the bogus RID
      # "linux-x64;linux-arm64" and fails (OutputPath MSB4115 / NETSDK1083). The '"…"' form (the SDK's own
      # documented Bash escaping) keeps the value one CLI switch while letting MSBuild split the real `;` into a
      # 2-item list. Applies to ContainerRuntimeIdentifiers AND ContainerImageTags (every `-p:` whose value is a `;`-list).
      #
      # 🚨 STAGING TAG ONLY — this is the all-or-nothing gate. The layers land in ACR (they have to;
      # that IS what pushing costs) but under a name no consumer can select, so this leg succeeding
      # ships NOTHING on its own. `promote` applies version/sha/main once every leg has succeeded.
      - name: Build + push portal-ai (staging tag)
        run: >
          dotnet publish plugins-repo/src/Memex.Portal.Distributed/Memex.Portal.Distributed.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:MeshWeaverRoot=${{ github.workspace }}
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=memex-portal-ai
          -p:ContainerImageTags=${{ needs.gate.outputs.staging_tag }}
          -p:ContainerBaseImage=${{ env.ACR }}/memex-portal-ai-base:latest

  migration-image:
    name: "Build + push migration image"
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Same $(Version) computation as the portal leg: both jobs run inside ONE
      # workflow run, so GITHUB_RUN_NUMBER — and therefore the computed
      # 3.0.0-ci.<n> tag — is identical across the two legs by construction.
      # 🚨 This one is load-bearing beyond tidiness: the self-updater patches the portal AND the
      # migration Deployment to the SAME tag (SelfUpdateOptions.MigrationImage), so a portal
      # version tag without a matching migration version tag is an ImagePullBackOff on rollout.
      - name: Compute image version
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(dotnet msbuild memex/aspire/Memex.Database.Migration/Memex.Database.Migration.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # migration — lean image on the standard (already multi-arch) aspnet base; same multi-arch publish.
      # <RuntimeIdentifiers> lives in Memex.Database.Migration.csproj (project-local, same reason as above).
      - name: Build + push migration (staging tag)
        run: >
          dotnet publish memex/aspire/Memex.Database.Migration/Memex.Database.Migration.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=memex-migration
          -p:ContainerImageTags=${{ needs.gate.outputs.staging_tag }}

  # The MeshWeaver.Plugins PR gate image: `mw-plugin-test` (tools/MeshWeaver.PluginTester)
  # imports a node-repo checkout into a fresh in-process mesh, asserts every NodeType compiles,
  # renders, and its `Tests` layout area executes green. The plugins repo's ci.yml `test-repos`
  # job runs INSIDE this image (repo variable MW_TEST_IMAGE), so every main build must refresh
  # it — `latest` is the stable tag that variable pins.
  plugin-test-image:
    name: "Build + push mw-plugin-test image"
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Same $(Version) computation as the other legs — GITHUB_RUN_NUMBER is shared across the
      # run, so the 3.0.0-ci.<n> tag matches the portal/migration images by construction.
      - name: Compute image version
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(dotnet msbuild tools/MeshWeaver.PluginTester/MeshWeaver.PluginTester.csproj \
            -getProperty:Version -p:CIRun=true -nologo | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed image version: $VERSION (run #$GITHUB_RUN_NUMBER)"
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name meshweaver
      # Lean console image on the standard multi-arch base; <RuntimeIdentifiers> lives in the
      # csproj (project-local — a global -p:RuntimeIdentifiers breaks referenced libs, see above).
      # `latest` (the tag the plugins repo pins as MW_TEST_IMAGE) and the GHCR mirror both moved
      # to `promote`: they are consumer-visible, so they must not appear until every leg is green.
      - name: Build + push mw-plugin-test (staging tag, ACR)
        run: >
          dotnet publish tools/MeshWeaver.PluginTester/MeshWeaver.PluginTester.csproj
          -c Release --no-self-contained -t:PublishContainer -p:PublishProfile=
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:CIRun=true
          -p:ContainerRegistry=${{ env.ACR }}
          -p:ContainerRepository=mw-plugin-test
          -p:ContainerImageTags=${{ needs.gate.outputs.staging_tag }}

  # 🚨 portal-next is NOT built here any more. Its sources and its image lane live in
  # MeshWeaver.Plugins (MeshWeaver#2169). It is publishable from there independently because
  # portalNext is opt-in (chart default enabled: false) and the self-updater never rolls it —
  # nothing waits on it, so it does not belong to this repo's all-or-nothing set.

  promote:
    name: "Promote: tag the full set (all-or-nothing)"
    needs: [gate, portal-image, migration-image, plugin-test-image]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING: ${{ needs.gate.outputs.staging_tag }}
      SHA: ${{ needs.gate.outputs.short_sha }}
      V_PORTAL: ${{ needs.portal-image.outputs.version }}
      V_MIGRATION: ${{ needs.migration-image.outputs.version }}
      V_PLUGIN: ${{ needs.plugin-test-image.outputs.version }}
    steps:
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # buildx reads registry credentials from ~/.docker/config.json, which is what both of these
      # logins write — one store, both registries.
      - name: ACR login
        run: az acr login --name meshweaver
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Phase A — identity tags (everything except the portal's version)"
        run: |
          set -euo pipefail
          promote() { # promote <repo> <tag>...
            local repo="$1"; shift
            local args=()
            for t in "$@"; do args+=(--tag "${{ env.ACR }}/$repo:$t"); done
            echo "→ $repo: $*"
            docker buildx imagetools create "${args[@]}" "${{ env.ACR }}/$repo:$STAGING"
          }
          promote memex-migration   "$V_MIGRATION" "$SHA"
          promote mw-plugin-test    "$V_PLUGIN"    "$SHA"
          # The portal's SHA tag, but NOT its version tag — see phase C.
          promote memex-portal-ai   "$SHA"
      - name: "Phase B — moving pointers (main, latest, GHCR mirror)"
        run: |
          set -euo pipefail
          for repo in memex-migration memex-portal-ai; do
            echo "→ $repo: main"
            docker buildx imagetools create --tag "${{ env.ACR }}/$repo:main" "${{ env.ACR }}/$repo:$STAGING"
          done
          # `latest` is what MeshWeaver.Plugins pins as MW_TEST_IMAGE.
          docker buildx imagetools create \
            --tag "${{ env.ACR }}/mw-plugin-test:main" \
            --tag "${{ env.ACR }}/mw-plugin-test:latest" \
            "${{ env.ACR }}/mw-plugin-test:$STAGING"
          # MIRROR the ACR index to GHCR — never a second `dotnet publish`. Two independent builds
          # of one commit are two independent compilations, so the bits the plugins repo gates on
          # from GHCR would not provably be the bits validated in ACR (and it measured 411 s on top
          # of the ACR leg's 637 s, run 31269491065). imagetools copies the index by digest.
          #
          # 🚨 In phase B ON PURPOSE, so a GHCR outage BLOCKS the release rather than silently
          # leaving the plugins repo's `latest` stale. It is a real coupling and it is the lesser
          # evil: check-image-set.sh only sees ACR, so a GHCR miss after phase C would never be
          # reconciled and nothing would ever notice. Here it fails CD, alerts, and the hourly
          # reconciler re-drives HEAD until it lands or the budget escalates.
          NS=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            --tag "ghcr.io/$NS/mw-plugin-test:$V_PLUGIN" \
            --tag "ghcr.io/$NS/mw-plugin-test:$SHA" \
            --tag "ghcr.io/$NS/mw-plugin-test:main" \
            --tag "ghcr.io/$NS/mw-plugin-test:latest" \
            "${{ env.ACR }}/mw-plugin-test:$STAGING"
      - name: "Phase C — arm the release: memex-portal-ai:<version>"
        run: |
          set -euo pipefail
          # 🚨 THE LAST WRITE IN CD. Until this single PUT lands, no install can see this commit:
          # SelfUpdateHostedService reads memex-portal-ai's tags and rolls the portal AND the
          # migration Deployment to the newest ^\d+\.\d+\.\d+ one. Everything it will need — the
          # matching memex-migration:$V_MIGRATION — is already tagged by phase A. Do not move
          # this step, and do not add anything after it.
          echo "→ memex-portal-ai: $V_PORTAL  (arming the self-updater)"
          docker buildx imagetools create \
            --tag "${{ env.ACR }}/memex-portal-ai:$V_PORTAL" \
            "${{ env.ACR }}/memex-portal-ai:$STAGING"
          {
            echo "### Promoted \`$SHA\` → $V_PORTAL"
            echo "- memex-portal-ai \`$V_PORTAL\`, \`$SHA\`, \`main\`"
            echo "- memex-migration \`$V_MIGRATION\`, \`$SHA\`, \`main\`"
            echo "- mw-plugin-test \`$V_PLUGIN\`, \`$SHA\`, \`main\`, \`latest\` (ACR + GHCR)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────── BAKE THE PLATFORM'S OWN CONTENT *IN THE SHIPPED IMAGE*, THEN PUBLISH ──────────
  # #1660 WS3 delivery, corrected by #1725. The portals adopt a prebuilt NodeType bundle only when
  # its framework identity EQUALS the one the booting process resolves — that identity IS the
  # ABI-compatibility proof, and adopting bytes from an identity you did not resolve is precisely
  # what it exists to prevent. So the only sound producer is the very build the consumer runs.
  #
  # 🚨 THE REGRESSION THIS SHAPE FIXES. Until #1725 this job downloaded the Build-and-Test run's
  # `baked-assemblies-*` artifact — a DIFFERENT compilation of the same source — and published it.
  # Two compilations never agree on the identity. Measured on commit `babb3bc` (Build-and-Test run
  # 32016820517 vs the images CD run 32018411051 promoted), same sources, same runner path:
  #   * EVERY implementation assembly's MVID differs between the two hosts — the controls too
  #     (Data, Layout, AI, Utils) — so every `FrameworkBuildIdentity.FullMvidAssemblies` member
  #     (the MeshWeaver.Compiler + MeshWeaver.NuGet toolchain closure) contributes a different id;
  #   * 4 of the 37 canonical REFERENCE assemblies differ as well — MeshWeaver.Graph, .Hosting,
  #     .Kernel, .Markdown.Collaboration — so the surface half diverges independently.
  # Result: the artifact resolved `sd0d0daa9398c4d810e0e730a0495b9db` while the running pods
  # resolve `s377941f549f721e01ac764e0fb8db84a`. `prebuilt-bundles/<runtime-identity>/` never
  # contained `meshweaver-content`, so every pod Roslyn-compiled ~80 platform types on EVERY boot
  # (64.8 s warm-up, `compiled=80 alreadyBaked=4`) — the exact regression (#1347 → #1660) this lane
  # exists to prevent, behind a green tick.
  #
  # The satellites never had this problem because they bake INSIDE the shipped image
  # (`node-repo-publish-bake.yml`: `docker run … mw-plugin-test … --bake-output`). This job now does
  # the same for the platform's own content: one producer, one toolchain, one identity, and the
  # producer/consumer question stops existing. The bake is also strictly STRONGER as a gate than the
  # artifact hop was — it proves the shipped content compiles against the binaries that SHIP, not
  # against a build output that never leaves CI.
  #
  # 🚨 ARCHITECTURE IS PART OF THE IDENTITY, so the platform is pinned explicitly — never inherited
  # from whatever the runner happens to be. The same four reference assemblies differ between the
  # amd64 and arm64 variants of ONE image, so a multi-arch image carries two identities.
  #
  # This used to be a single amd64 bake, because every AKS node is amd64 and an arm64 install
  # (memex-local, any Apple Silicon host) simply resolved the other identity and compiled locally.
  # It is now ONE LANE PER ARCHITECTURE: each leg pins `--platform` to its own matrix value and
  # runs ON that architecture, so each publishes the bytes it actually produced under the identity
  # those bytes resolve. That is the opposite of the forbidden shape, not an exception to it —
  # publishing amd64 bytes under a second identity to "cover" arm64 remains the
  # adopt-what-you-did-not-resolve defect, and publish-bake-bundles.sh refuses it outright
  # (architecture.txt) rather than relying on this file staying careful.
  #
  # 🚨 The CONFIG is preflighted RED, not skipped: BAKE_PUBLISH_TARGETS missing means no portal can
  # ever receive a bake — a grey skip would hide that forever (AGENTS.md: a gate never tests its own
  # inputs). And there is no longer any "nothing to publish" branch to warn about: the bake happens
  # HERE, from this run's image, so it either produces bundles or fails.
  #
  # Ordering: after `promote` (the image is armed) and therefore after `plugin-test-image` pushed
  # the staging tag this job bakes with. The staging tag is exact and immutable for this run —
  # `latest`/`main` are moving pointers a concurrent CD run can re-aim mid-job. Publication itself
  # stays all-or-nothing inside `publish-bake-bundles.sh`: every bundle first, the `_complete`
  # sentinel strictly LAST, and pods seed only sealed directories.
  publish-bake:
    name: "Bake platform content in the shipped image + publish (${{ matrix.arch }})"
    # portal-image is here for its `version` output — the release marker below is keyed by the
    # platform version the self-updater compares, not by the commit.
    needs: [gate, plugin-test-image, portal-image, promote]
    # 🚨 The arm64 leg is OFF until BAKE_ARM64 is set, and that is deliberate belt-and-braces.
    # delivery-verdict reads `needs.publish-bake.result`, which for a matrix is the AGGREGATE, and
    # whether a continue-on-error leg reports `success` THERE is a GitHub semantic I could not
    # verify from here. Being wrong about it would red-line delivery of the architecture the whole
    # fleet runs — so the default keeps this workflow byte-identical in behaviour to today (a
    # skipped leg cannot fail an aggregate), and turning arm64 on is one deliberate repo-variable
    # flip whose FIRST run someone watches, rather than a surprise discovered in production.
    #
    # This is a feature flag on a NEW publication lane, not a gate skipping its own inputs
    # (AGENTS.md): with the flag off nothing anywhere claims arm64 is covered — arm64 installs
    # compile at boot exactly as they always have, and the compile is itself the honest signal.
    # Delete the flag once a green arm64 publication has been observed.
    if: >-
      needs.gate.outputs.publish == 'true' && needs.promote.result == 'success'
      && (matrix.arch == 'linux-x64' || vars.BAKE_ARM64 == 'true')
    # ═══════════ ONE LANE PER ARCHITECTURE (#1728 "just give path to correct arch") ═══════════
    # A bake is an ABI claim about BYTES, and the bytes differ per architecture: four reference
    # assemblies genuinely differ between the amd64 and arm64 variants of one image, so each
    # resolves its own surface identity (s<hash>) and publishes to its own directory. That is why
    # this is a matrix and not a second `--platform` on one job: the two lanes must each be taken
    # ON the architecture they describe. Publishing amd64 bytes under an arm64 label is the
    # adopt-what-you-did-not-resolve shape CiContentBake.md forbids, and publish-bake-bundles.sh
    # now REFUSES it outright (architecture.txt) rather than trusting this file to be careful.
    #
    # Both images already ship both architectures — mw-plugin-test via
    # ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"', the portal set asserted multi-arch by
    # check-image-set.sh — so nothing new has to be built for the arm64 leg to run.
    strategy:
      # 🚨 An arm64 failure must never cancel the amd64 leg: amd64 is what every AKS node runs.
      fail-fast: false
      matrix:
        include:
          - arch: linux-x64
            docker_platform: linux/amd64
            runner: ubuntu-latest
          - arch: linux-arm64
            docker_platform: linux/arm64
            # Free for public repositories, which this repo is; no larger-runner configuration.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 🚨 The arm64 leg is LOUD BUT NON-BLOCKING, and this is not a skip-trapdoor (AGENTS.md).
    # delivery-verdict consumes `needs.publish-bake.result`, which for a matrix is the AGGREGATE —
    # so without this a brand-new lane could red-line delivery of the architecture the fleet
    # actually runs. What an arm64 failure hides is nothing: arm64 installs keep compiling at boot,
    # exactly as they do today, and the leg still shows red with its reason in the log. Compare the
    # forbidden shape — a GATE that passes on no evidence. This gates nothing; it publishes an
    # ADDITIONAL architecture, and publication is all-or-nothing behind the sentinel, so a partial
    # arm64 publish can never be adopted.
    continue-on-error: ${{ matrix.arch != 'linux-x64' }}
    # The bake compiles every shipped NodeType twice over (Doc + samples) inside the container;
    # the doc-gate's equivalent budget is 12 min, and the pull plus the publish add to it.
    timeout-minutes: 40
    # Job-level permissions REPLACE the workflow-level map, so every one this job needs is here.
    # `actions: read` is deliberately GONE — nothing cross-run is downloaded any more.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # 🚨 The plugins are BUILT HERE, in the same run and against the same image as the platform's
      # own content — maintainer decision 2026-08-26 ("run full plugin build in main memex build";
      # "plugins should not have a lane in this sense"). One run, one framework identity, one
      # sealed publish: a plugin bundle can no longer carry bytes from a framework that is not the
      # one shipping (#1814's class), and its version is the version THIS run computed (#695's
      # class — see the publish step). Same repo as portal-image's checkout; PlatformBakeLaneGuard
      # asserts it is the only foreign repository in this file.
      - name: Check out MeshWeaver.Plugins (every plugin is baked in this run)
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver.Plugins
          ref: ${{ vars.MW_PLUGINS_REF || 'main' }}
          path: plugins-repo
          ssh-key: ${{ secrets.PLUGINS_REPO_SSH_KEY }}
          fetch-depth: 1
      - name: "Preflight: the publish targets must be provisioned"
        run: |
          set -euo pipefail
          if [ -z "${{ vars.BAKE_PUBLISH_TARGETS }}" ]; then
            echo "::error::Repo variable BAKE_PUBLISH_TARGETS is not provisioned — the CI bake can reach no portal. Set it to the portals' Azure Files targets, whitespace-separated <account>/<share>[/<base-path>] (on AKS: the account/share behind each portal's memex-data PVC — resolve with 'kubectl get pv -o jsonpath' on the claim; the CD identity needs the 'Storage File Data Privileged Contributor' role on those accounts)."
            exit 1
          fi
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # 🚨 REACHING THE REGISTRY IS INFRA, AND INFRA BLIPS — bounded retries with backoff, then a
      # LOUD error naming it as infra. Exactly the shape dotnet-test.yml's "Pre-pull Testcontainers
      # images (infra, not a test)" step already uses, for the same reason.
      #
      # Measured, CD run 32028644747: this job died on `az acr login` with
      # `HTTPSConnectionPool(host='meshweaver.azurecr.io', port=443) … [Errno 111] Connection
      # refused` while FOUR sibling jobs in the same run logged into the same registry minutes
      # earlier and pushed to it. A refused TCP connect from one runner is not a defect of ours, and
      # retrying it suppresses nothing — but LOSING the job to it is expensive and asymmetric: the
      # `promote` job has already armed the images by the time this runs, so the release ships
      # WITHOUT its content bake, and the CD reconciler keys on the IMAGE set (complete) rather than
      # on the publication, so nothing re-attempts it. The bundles are only republished by the next
      # successful CD publish; until then pods compile shipped content at boot exactly as they did
      # before the bake lane existed. Seconds of backoff against that trade is the right side.
      #
      # The image is PULLED here rather than left to `docker run`'s implicit pull, so the retry
      # covers the pull too — a login that succeeds and a pull that is refused would otherwise fail
      # the bake step with a registry error dressed up as a bake failure.
      - name: "ACR login + pull the bake image (infra, not the bake)"
        env:
          IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
        run: |
          set -uo pipefail
          attempts=5
          ok=0
          for attempt in $(seq 1 $attempts); do
            if az acr login --name meshweaver && docker pull --quiet --platform ${{ matrix.docker_platform }} "$IMAGE"; then
              echo "$IMAGE: registry reached and image pulled on attempt $attempt"
              ok=1; break
            fi
            # Backoff: 5s, 10s, 20s, 40s — registry blips are seconds-to-minutes. Only BETWEEN
            # attempts: sleeping after the last failure would add 80s to reporting an outage we
            # have already decided not to retry.
            if [ "$attempt" -lt "$attempts" ]; then
              delay=$((5 * 2 ** (attempt - 1)))
              echo "registry attempt $attempt failed; retrying in ${delay}s" >&2
              sleep $delay
            fi
          done
          if [ $ok -eq 0 ]; then
            echo "::error::could not log in to ${{ env.ACR }} and pull $IMAGE after $attempts attempts — this is a REGISTRY/INFRA failure, not a bake failure. The image set for this commit is already promoted; its platform content bake was NOT published, so pods compile shipped content at boot until a later CD run republishes it."
            exit 1
          fi
      # ── WHAT THIS BAKES, AND WHAT IT DELIBERATELY DOES NOT ──────────────────────────────────
      # 🚨 ONLY the content the IMAGE itself embeds: `src/MeshWeaver.Documentation/Data`, which
      # `Memex.Portal.Shared` references as MeshWeaver.Documentation and every portal therefore
      # ships inside itself. Nothing else. Compiling anything a deployment receives ALREADY BUILT
      # is redoing work someone else's lane already did, and it is the expensive half of a bake.
      #
      # Everything else a portal holds arrives compiled and is ADOPTED, not rebuilt:
      #   * node-repo content (Plugins, Education, Reinsurance, SocialMedia) and Store packages —
      #     each repo's own `node-repo-publish-bake` lane bakes and publishes them under the SAME
      #     framework identity, from the same image. main-cd checks out no other repository (there
      #     is not one `repository:` input in this file), so it could not compile them even by
      #     accident — and must never be given the chance.
      #   * `samples/Graph/Data` — REMOVED from this bake deliberately. Measured against the
      #     shipped image: the samples half compiled 7 packages / 24 assemblies (ACME, Cornerstone,
      #     FutuRe, MathDemo, Northwind, PythonDemo, Systemorph) whose bundles NO deployment can
      #     adopt. No portal embeds them (Memex.Portal.Shared references only
      #     MeshWeaver.Documentation); memex receives them over the GitHub link into the
      #     `MeshWeaver` partition, where the node paths read `MeshWeaver/samples/Graph/Data/ACME/…`
      #     while the bundles are keyed `ACME/…` — and the seeder matches by node PATH, so they are
      #     inert there too. They still compile-GATE on every PR (dotnet-test.yml's doc-gate runs
      #     the samples stage): correctness of that content is proven, its assemblies are simply
      #     not worth shipping. Before/after for this job: 8 packages / 28 assemblies → 1 / 4.
      # ── THE BAKE — a BUILD STEP, with no mesh anywhere in it (#1763) ────────────────────────
      # 🚨 This step and the GATE below used to be ONE `docker run`, and that fusion is the finding
      # #1763 opens with: producing an assembly is a build step, and the mesh's job is to CONSUME a
      # bake, not to produce one. The old command stood up an in-process mesh, imported the content,
      # let the MESH compile every NodeType and collected what it produced — a headless mesh rather
      # than a serving portal, but exactly "compile through mesh nodes".
      #
      # `compile` resolves NodeType sources straight from the staged tree and compiles them with
      # MeshWeaver.Compiler: no MeshBuilder, no AddGraph(), no import, no hub scheduler, no per-type
      # activation. That equivalence is not assumed — `BakeEquivalenceTest` bakes one content set
      # BOTH ways and pins that the two producers agree on the bundle set, the resolved source set,
      # the per-type dependency records and the emitted surfaces.
      #
      # It is the SAME BINARY in the SAME IMAGE as the gate below, which is what makes their
      # framework identities provably equal (see MeshWeaver.PluginTester.csproj — the bake and the
      # gate share one project on purpose). A leaner compiler-only project would resolve a DIFFERENT
      # identity and every bundle it baked would be declined by every portal, silently.
      - name: "BAKE the platform's OWN shipped content (compiler-driven, no mesh)"
        env:
          IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # The SAME staging the doc-gate judges — one script, so the bake can only ever publish
          # content that was gated in exactly the shape it was gated in.
          STAGE="$RUNNER_TEMP/bake-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          bash .github/scripts/stage-doc-gate.sh src/MeshWeaver.Documentation/Data "$STAGE/doc"
          # The known-debt ratchet travels INTO the mount: the tester runs in the container and
          # cannot see the checkout. Same file BOTH halves read, so the split cannot make the same
          # ratchet mean two different things depending on which half is looking at it.
          cp .github/doc-gate.allow "$STAGE/doc-gate.allow"
          # The image's tester runs as a non-root user: it must be able to read the mount and write
          # the bake directory.
          chmod -R a+rX "$STAGE"
          BAKE="$RUNNER_TEMP/bake"
          rm -rf "$BAKE"
          mkdir -p "$BAKE"
          chmod 777 "$BAKE"
          # A red bake FAILS this job: the platform's own shipped content not compiling against the
          # image that ships it is a release defect, not a reason to publish less.
          # --pull never: the image is already in the local store (the retrying step above pulled
          # it), so a registry blip here can no longer be mistaken for a bake failure.
          echo "── baking /repo/doc against $IMAGE (no mesh)"
          docker run --rm --init --pull never --platform ${{ matrix.docker_platform }} -v "$STAGE:/repo" -v "$BAKE:/bake" \
            --entrypoint /app/mw-plugin-test "$IMAGE" compile /repo/doc \
            --output /bake --allow /repo/doc-gate.allow --source-sha "$SHA"
          # Postconditions, not hopes: a green bake that wrote no identity, or no bundles, is a
          # bake-stage regression — never a quiet publish of nothing.
          if [ ! -s "$BAKE/framework-mvid.txt" ]; then
            echo "::error::the bake ran green but wrote no identity ($BAKE/framework-mvid.txt) — the bake stage regressed (or the image predates the compile verb)."
            exit 1
          fi
          if ! ls "$BAKE"/*.zip >/dev/null 2>&1; then
            echo "::error::the bake ran green but produced no bundles under $BAKE — nothing could be published."
            exit 1
          fi
          echo "BAKE_DIR=$BAKE" >> "$GITHUB_ENV"
          echo "baked identity: $(cat "$BAKE/framework-mvid.txt")"
          ls -l "$BAKE"/*.zip
      # ── THE GATE — a mesh, CONSUMING the bake above (#1763) ─────────────────────────────────
      # 🚨 The gate legitimately needs a mesh: rendering a layout area and executing a `Tests` area
      # are runtime behaviours. What it must NOT do is produce the bytes it is judging. With
      # `--seed` it adopts the bake's assemblies for every NodeType it installs, so what renders and
      # what runs the Tests areas is the assembly that will actually ship — a strictly stronger
      # release gate than the fused run ever was, which proved only that a private recompile of the
      # same sources worked.
      #
      # THE GATE STILL FAILS THE JOB. Splitting the steps must not lose the gate: the platform's own
      # shipped content failing to render or test against the image that ships it is a release
      # defect. It also fails if the bake was DECLARED but not consumed — adoption leaves no trace
      # in a gate verdict (an adopted type renders exactly like a compiled one), so "the consuming
      # half silently stopped working" is invisible unless it is a verdict. `--seed` additionally
      # refuses, before the mesh boots, a bake keyed to a framework identity this process does not
      # resolve: that mismatch would otherwise decline every assembly one by one and leave the gate
      # green having judged none of the bytes that ship (#1814's shape, one level down).
      - name: "GATE the bake: render + execute Tests areas on the BAKED bytes"
        env:
          IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bake-stage"
          echo "── gating /repo/doc against $IMAGE, consuming the bake in /bake"
          docker run --rm --init --pull never --platform ${{ matrix.docker_platform }} -v "$STAGE:/repo" -v "$BAKE_DIR:/bake" \
            --entrypoint /app/mw-plugin-test "$IMAGE" /repo/doc \
            --allow /repo/doc-gate.allow --seed /bake
      # ─────────── THE ADDRESS CHECK — publish only to an address the portal actually reads ───────────
      # 🚨 The framework identity is an ADDRESS, and until now NOTHING in this pipeline could observe
      # that the producer and the consumer disagree about it. The bake publishes under the identity
      # ITS host (mw-plugin-test) resolves; a portal only ever looks under the identity IT resolves.
      # When the two differ the bundles are published, intact, to a directory no pod will ever open —
      # so every publication-side check passes, this job goes green, and the pods compile everything
      # at boot exactly as if the bake lane did not exist.
      #
      # That is not hypothetical. CD run 32063444385 baked release 3.0.0-rc4.ci.4201 (commit 493e1992)
      # under sda0843abd6db4fc7e37cc3f838079265 while both prod pods asked for
      # s944d7fd0bbf81f4b40b85a7a74296263 and logged "no CI-published bundles for framework identity".
      # The first pod of that deploy compiled 269 NodeTypes over 10 m 29 s (+1598 MB working set); the
      # second adopted from what the FIRST had compiled, not from CI. During that window ~12 instance
      # hubs latched a compilation-fallback card and served it to anonymous visitors for two hours —
      # every course cover on memex.meshweaver.cloud. Issue #1814.
      #
      # The cause was one host losing eight canonical assemblies from its surface manifest, which no
      # amount of publication-side checking can see. A one-line comparison of the two VALUES can, and
      # this is it. It runs BEFORE the publish on purpose: a bake nobody can adopt must fail the
      # release rather than be filed under an address nobody reads. The release marker is then never
      # written, so the deployment gate (#1754) holds too — fail-safe in both directions.
      #
      # 🚨 --platform ${{ matrix.docker_platform }} on BOTH pulls, out loud. The identity is per-architecture (the same
      # four reference assemblies differ between the amd64 and arm64 legs of one multi-arch image), so
      # a multi-arch image carries two identities and comparing across legs would be meaningless. Every
      # AKS node is amd64 and the bake above already pins amd64; this pins the portal side to match.
      # (An arm64 install — memex.localhost — resolves the OTHER identity and compiles locally; that is
      # the second, independent way to mint an unread address, and publishing a second copy under it to
      # "cover" it is forbidden: a bake is adoptable only when its producer ran the consumer's binaries.)
      #
      # The comparison is done by the bake image's own `framework-identity` verb, which resolves the
      # identity of ANOTHER directory from that directory's meshweaver-surface.manifest and assemblies
      # as FILES — nothing is loaded, so one container answers for the other image's /app. It refuses
      # to answer for a directory with no usable manifest rather than degrading to the fallback
      # identity: two manifest-less hosts of one commit resolve the SAME fallback, and a comparison
      # that passes on degraded input would be a check that cannot fail.
      - name: "Assert the bake's identity is the one the PROMOTED PORTAL IMAGE resolves"
        env:
          BAKE_IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
          PORTAL_IMAGE: ${{ env.ACR }}/memex-portal-ai:${{ needs.gate.outputs.staging_tag }}
        run: |
          set -euo pipefail
          BAKED="$(tr -d '[:space:]' < "$BAKE_DIR/framework-mvid.txt")"
          echo "the bake published under: $BAKED"
          # The STAGING tag is this run's exact, immutable image — `main`/`latest` are moving
          # pointers a concurrent CD run can re-aim mid-job, which would compare this bake against
          # somebody else's build.
          docker pull --quiet --platform ${{ matrix.docker_platform }} "$PORTAL_IMAGE"
          STAGE="$RUNNER_TEMP/portal-image"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cid="$(docker create --platform ${{ matrix.docker_platform }} "$PORTAL_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # /app is ~306 MB (it is the app, not the base image), so copying it whole is cheap and
          # uses nothing but `docker cp` — no tar wildcard flags that differ between tar flavours.
          docker cp "$cid:/app" "$STAGE"
          if [ ! -s "$STAGE/app/meshweaver-surface.manifest" ]; then
            echo "::error::the promoted portal image ships no /app/meshweaver-surface.manifest, so it resolves the stamp/MVID FALLBACK identity and can adopt NO bake at all. That is the #1699 shape (the manifest missing from the publish output). Fix the image — do not publish a bake it cannot read."
            exit 1
          fi
          echo "portal /app: $(ls "$STAGE/app"/MeshWeaver.*.dll | wc -l) MeshWeaver assemblies, $(wc -l < "$STAGE/app/meshweaver-surface.manifest") manifest lines"
          # `--init` so a crashed tester exits instead of spinning as an unkillable PID 1 (#1741).
          # The verb prints the portal's identity, compares it with the bake's, and on a mismatch
          # names the canonical assemblies whose absence caused it — the actual defect in #1814 was
          # eight of them, not "a hash that differs".
          docker run --rm --init --platform ${{ matrix.docker_platform }} -v "$STAGE/app:/portal:ro" \
            --entrypoint /app/mw-plugin-test "$BAKE_IMAGE" \
            framework-identity /portal --expect "$BAKED"
          {
            echo "### 🔑 Bake address verified"
            echo "- \`$BAKED\` — resolved by BOTH the bake host and the promoted \`memex-portal-ai\` image (linux/amd64)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "BAKE every plugin against the SAME image (compiler-driven, no mesh)"
        env:
          IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
        run: |
          set -euo pipefail
          PLUGINS="$GITHUB_WORKSPACE/plugins-repo"
          [ -f "$PLUGINS/plugin-gate.allow" ] || { echo "::error::plugins-repo/plugin-gate.allow is missing — the known-debt ratchet the plugin bake is configured against. Refusing to bake without it."; exit 1; }
          PLUGINS_SHA="$(git -C "$PLUGINS" rev-parse HEAD)"
          BAKE_PLUGINS="$RUNNER_TEMP/bake-plugins"
          rm -rf "$BAKE_PLUGINS"; mkdir -p "$BAKE_PLUGINS"; chmod 777 "$BAKE_PLUGINS"
          echo "── baking /plugins (every module) against $IMAGE at plugins $PLUGINS_SHA"
          docker run --rm --init --pull never --platform ${{ matrix.docker_platform }} -v "$PLUGINS:/plugins" -v "$BAKE_PLUGINS:/bake" \
            --entrypoint /app/mw-plugin-test "$IMAGE" compile /plugins \
            --output /bake --allow /plugins/plugin-gate.allow --source-sha "$PLUGINS_SHA"
          # Postconditions, not hopes — same as the platform bake above.
          if [ ! -s "$BAKE_PLUGINS/framework-mvid.txt" ]; then
            echo "::error::the plugin bake ran green but wrote no identity — the bake stage regressed."; exit 1
          fi
          if ! ls "$BAKE_PLUGINS"/*.zip >/dev/null 2>&1; then
            echo "::error::the plugin bake ran green but produced no bundles — nothing could be published."; exit 1
          fi
          echo "BAKE_PLUGINS_DIR=$BAKE_PLUGINS" >> "$GITHUB_ENV"
          echo "PLUGINS_SHA=$PLUGINS_SHA" >> "$GITHUB_ENV"
          echo "plugin bake identity: $(cat "$BAKE_PLUGINS/framework-mvid.txt")"
          ls "$BAKE_PLUGINS"/*.zip | wc -l | xargs echo "plugin bundles:"
      - name: "GATE the plugin bake: render + execute Tests areas on the BAKED bytes"
        env:
          IMAGE: ${{ env.ACR }}/mw-plugin-test:${{ needs.gate.outputs.staging_tag }}
        run: |
          set -euo pipefail
          PLUGINS="$GITHUB_WORKSPACE/plugins-repo"
          echo "── gating /plugins against $IMAGE, consuming the bake in /bake"
          docker run --rm --init --pull never --platform ${{ matrix.docker_platform }} -v "$PLUGINS:/plugins" -v "$BAKE_PLUGINS_DIR:/bake" \
            --entrypoint /app/mw-plugin-test "$IMAGE" /plugins \
            --allow /plugins/plugin-gate.allow --seed /bake
      # 🚨 The whole point of building plugins HERE: their identity must be the platform's, by
      # construction. Assert it rather than trust it — a divergence means the two bakes did not run
      # against the same image, and publishing both would ship bundles no portal can adopt together.
      - name: "Assert the plugin bake's identity equals the platform bake's"
        run: |
          set -euo pipefail
          PLATFORM="$(tr -d '[:space:]' < "$BAKE_DIR/framework-mvid.txt")"
          PLUGINS="$(tr -d '[:space:]' < "$BAKE_PLUGINS_DIR/framework-mvid.txt")"
          if [ "$PLATFORM" != "$PLUGINS" ]; then
            echo "::error::plugin bake identity ($PLUGINS) differs from the platform bake identity ($PLATFORM) in the SAME run — they did not build against the same image. Refusing to publish either."
            exit 1
          fi
          echo "identities agree: $PLATFORM"
      # 🚨 RELEASE_VERSION is REQUIRED here and is the version THIS run computed. It is not read
      # from any manifest.lock: a bundle's version must be minted by the run that produced its
      # bytes (Plugins#695 — a version that moves on a lock file while the bytes come from
      # elsewhere is how an already-fixed defect kept shipping, #2356).
      - name: "Publish the plugin bundles to every portal target (same identity, same version)"
        env:
          BAKE_PUBLISH_TARGETS: ${{ vars.BAKE_PUBLISH_TARGETS }}
          BAKE_ARCHITECTURE: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.portal-image.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_VERSION" ] || { echo "::error::no release version from portal-image — refusing to publish plugin bundles under an unknown version (Plugins#695)."; exit 1; }
          .github/scripts/publish-bake-bundles.sh "$BAKE_PLUGINS_DIR" "plugins" \
            "$PLUGINS_SHA" "$RELEASE_VERSION"
          {
            echo "### 🧩 Plugin bundles published (built in this run)"
            echo "- identity: \`$(cat "$BAKE_PLUGINS_DIR/framework-mvid.txt")\` (equal to the platform bake's, asserted)"
            echo "- version: \`$RELEASE_VERSION\` (this run's, not manifest.lock)"
            echo "- plugins commit: \`$PLUGINS_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Publish bundles to every portal target"
        env:
          BAKE_PUBLISH_TARGETS: ${{ vars.BAKE_PUBLISH_TARGETS }}
          BAKE_ARCHITECTURE: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.portal-image.outputs.version }}
        run: |
          set -euo pipefail
          # The third argument is the CONTENT identity (the commit this bake was taken from).
          # Under the API-surface framework identity an internal-only merge resolves the SAME
          # directory — without the content key the first seal would freeze that directory for
          # the whole surface generation, and pods would keep declining its stale per-type source
          # SHAs and recompiling. With it, a content change under an unchanged surface republishes
          # (cheap uploads), and a truly unchanged bake still skips.
          #
          # The FOURTH argument is the platform version this run promoted, and it records the
          # version → framework-identity mapping at prebuilt-bundles/_releases/<version>. That
          # marker is what lets anything outside the image answer "which framework identity is
          # release X?" — the release gates (#1754 deployment, #1755 build) hold when it is
          # absent, so this run publishing it is what OPENS the gate for the release it just armed.
          .github/scripts/publish-bake-bundles.sh "$BAKE_DIR" meshweaver-content \
            "${{ needs.gate.outputs.sha }}" "$RELEASE_VERSION"
          {
            echo "### 📦 Platform content bake published"
            echo "- identity: \`$(cat "$BAKE_DIR/framework-mvid.txt")\` (resolved by the image this run promoted)"
            echo "- source: \`meshweaver-content\`  targets: \`${BAKE_PUBLISH_TARGETS}\`"
            echo "- release marker: \`_releases/${RELEASE_VERSION}\` — environments may now be rolled to it"
          } >> "$GITHUB_STEP_SUMMARY"
      # 🚨 CD's own consumption of the release gate (#1754). The three paths that roll a version
      # must read ONE verdict, and this is CD's: assert — against the artifact store, through the
      # same script the build gate uses — that the release just armed resolves an identity and
      # carries a sealed platform content bake. Without it, an environment rolled to this release
      # Roslyn-compiles its whole content set at boot.
      #
      # It runs UNCONDITIONALLY and fails RED, never `if:`-guarded and never continue-on-error: a
      # grey skip renders identically to a pass, and a release-availability check that cannot fail
      # is not a check. Placed AFTER the publish it verifies, so it judges the state that shipped
      # rather than the state that was intended.
      - name: "Assert the armed release is one an environment can be rolled to"
        env:
          BAKE_PUBLISH_TARGETS: ${{ vars.BAKE_PUBLISH_TARGETS }}
          BAKE_ARCHITECTURE: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.portal-image.outputs.version }}
        run: .github/scripts/check-release-availability.sh "$RELEASE_VERSION" meshweaver-content

  # ────────────────── NOTIFY DEPENDENT REPOS (repository_dispatch) ──────────────────
  # "Subscribe to new releases of any dependency and rebuild": dependency bumps INSIDE a repo are
  # already covered by the commit-scoped framework identity (a Dependabot merge is a commit ⇒ a
  # new identity ⇒ a fresh CI bake). The cross-REPO edge — this platform releasing while the node
  # repos (Plugins, Education, Reinsurance, SocialMedia) sit unchanged — is closed BY MEMEX'S
  # BROADCAST (see the block below): one repository_dispatch per subscriber, which their CI
  # receives with
  #   on: repository_dispatch: { types: [meshweaver-framework-released] }
  # and answers by re-running its gate + bake + publish against the new framework identity.
  # REPORTER-CLASS like notify-platform-update: a lost dispatch costs one delayed rebake wave
  # (the next release re-notifies, and the schedule poll is the standing fallback) and can never
  # hide a defect.
  #
  # 🚨 Provisioning note (#1755): a subscriber whose own upstreams are not yet published EXITS
  # without building and is re-woken by its upstream's `meshweaver-upstream-published` event, so
  # ────────────────── NO DEPENDENT DISPATCH *FROM HERE*: memex broadcasts (2026-08-23) ──────────
  # There is deliberately no job here that dispatches to the node repos, and there never will be —
  # but the wave is now BROADCAST, not only pulled. The broadcast happens ONE HOP AWAY, in memex,
  # and this workflow already feeds it: the `notify-platform-update` job below signs a POST telling
  # the registry mesh "a new platform build exists". memex, on that fact, fans a
  # `repository_dispatch` (`meshweaver-framework-released`) out to every subscriber repo, whose CI
  # answers with `on: repository_dispatch: { types: [meshweaver-framework-released] }` and re-bakes
  # against the new framework in SECONDS instead of up to a schedule interval.
  #
  # 🚨 Why the broadcast lives in memex and NOT here — it resolves the two objections that kept the
  # old GitHub→GitHub `notify-dependents` job (which needed `BAKE_SUBSCRIBER_REPOS` + a satellite
  # write credential, was never provisioned, and printed "NOT CONFIGURED" for its whole life):
  #   • no credential in the release path — the PLATFORM still holds no write access to any
  #     satellite and no PAT. memex does the fan-out with the GitHub App it ALREADY holds for
  #     GitSync (`FrameworkReleaseBroadcaster`, `src/MeshWeaver.GitSync`); the release only signs a
  #     POST to memex, exactly like every other `notify-*` job here.
  #   • no hand-maintained list here — the subscriber set lives in the Hosting fleet registry ON
  #     memex ("register a new repo in Hosting"), the graph memex already owns; nothing is named in
  #     this file.
  # 🚨 `BAKE_SUBSCRIBER_REPOS` IS GONE — deleted as a repo variable on 2026-08-25, not merely
  # unused. It survived the 2026-08-23 redesign holding one stale repo name, and a leftover
  # variable that LOOKS like the live subscriber list is worse than none: the next person to debug
  # a missing rebake reads it, believes the fan-out targets exactly that repo, and stops looking.
  # If you need to know who is subscribed, ask the Hosting registry on the control instance.
  # Pull stays the fallback: each repo's `schedule` run still reads the registry
  # (`Resolve the bake target` in each ci.yml) and bakes for the identity it finds, so a lost
  # dispatch costs at most one delayed rebake wave and a repo that stops baking still shows up as an
  # instance HELD on its own UpdatePolicy. REPORTER-CLASS: the broadcast makes the wave prompt; the
  # poll makes it guaranteed.

  # ────────────────── NOTIFY THE PLATFORM-UPDATE AGENT (required) ──────────────────
  # After the release is ARMED (promote's last PUT), tell the control instance's mesh that a new
  # platform build exists: one signed POST to the WebhookInbox target the Hosting plugin watches
  # (Hosting/PlatformBuilds). The mesh side verifies the HMAC over the RAW body, runs the pin
  # updater (the MW_IMAGE_DIGEST bump PRs on the node repos) and BROADCASTS the release to every
  # subscriber as a `repository_dispatch` (FrameworkReleaseBroadcaster, src/MeshWeaver.GitSync) so
  # each satellite re-bakes in seconds instead of at its next schedule poll.
  #
  # 🚨 THIS POST IS THE ONLY THING THAT STARTS THAT WAVE, AND IT USED TO BE UNFAILABLE (#2235).
  # It was written REPORTER-CLASS — "losing one notification costs one delayed update wave" — and
  # that reasoning produced exactly one observable outcome: a green tick on every promote while
  # ZERO releases were broadcast between 2026-08-22 and 2026-08-25. Two shapes did it, and both
  # are now gone:
  #   * an input-shaped `if [ -z "$URL" ] || [ -z "$SECRET" ]; then ... exit 0` — a gate testing
  #     its own inputs, which renders identically to a gate that passed. The inputs are now
  #     asserted in `preflight`, which fails RED naming what to provision.
  #   * a non-2xx downgraded to `::warning::`. A release event the mesh REFUSED is a wave that did
  #     not happen; it is now `exit 1`.
  # The pull/schedule fallback is still there and still means a single lost dispatch costs at most
  # one delayed rebake — but "the fallback exists" is a reason to keep CD's images shipping, never
  # a reason to stop REPORTING that delivery failed. This job runs after `promote`, so failing it
  # cannot unpublish anything: the images are already tagged and every install still self-updates.
  # What changes is that the failure is now visible (and filed by `alert-on-failure`) instead of
  # being a sentence in a step summary.
  #
  # 🚨 WHAT A 2xx HERE DOES *NOT* PROVE. The inbox is deliberately dumb (WebhookInbox: allowlist +
  # size cap, verifies nothing) so a 2xx means "the delivery was STORED", not "the wave ran". The
  # half this side cannot see is the shared HMAC: if the control instance's
  # `Hosting:PlatformWebhookSecret` is unset or differs from `secrets.PLATFORM_WEBHOOK_SECRET`,
  # the watcher drops every delivery as unverifiable and this job still goes green. That is the
  # residual #2235 tracks; its close condition is observing a `repository_dispatch` run on the
  # satellites plus the MW_IMAGE_DIGEST bump PRs — never a green tick here.
  notify-platform-update:
    name: "Notify platform-update registry"
    # `preflight` is what guarantees URL + SECRET exist, so nothing in this job checks for them.
    needs: [preflight, gate, plugin-test-image, promote]
    # The ONLY condition, and it is about the RUN, not about an input: notify when this run
    # actually published something. Never "notify if the secret happens to be set".
    if: needs.gate.outputs.publish == 'true' && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Sign and POST the build fact"
        env:
          URL: ${{ vars.PLATFORM_WEBHOOK_URL }}
          SECRET: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}
          SHA: ${{ needs.gate.outputs.short_sha }}
          V_PLUGIN: ${{ needs.plugin-test-image.outputs.version }}
        run: |
          set -euo pipefail
          az acr login --name meshweaver
          # The digest of mw-plugin-test:main — the exact pin (MW_IMAGE_DIGEST) the plugin repos
          # compile against. Resolved HERE so the mesh side needs no registry credential.
          DIGEST=$(docker buildx imagetools inspect meshweaver.azurecr.io/mw-plugin-test:main --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$DIGEST" ] || { echo "::error::could not resolve mw-plugin-test:main digest — the release event would name a pin that does not exist"; exit 1; }
          BODY=$(printf '{"event":"platform-build","repo":"%s","sha":"%s","version":"%s","image":"meshweaver.azurecr.io/mw-plugin-test","digest":"%s"}' "$GITHUB_REPOSITORY" "$SHA" "$V_PLUGIN" "$DIGEST")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.*= /sha256=/')
          # `|| code=000` is not defensive noise: `run:` is `bash -e`, so a curl that fails at the
          # TRANSPORT level (DNS, TLS, connection refused) would kill the step before the verdict
          # below — failing closed, but with a bare curl error instead of the sentence naming what
          # is wrong. The timeouts stop an unreachable instance from burning the job timeout.
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' --connect-timeout 10 --max-time 60 \
            -X POST "$URL" -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $SIG" --data "$BODY") || code=000
          echo "POST $URL -> $code"; cat /tmp/resp || true
          case "$code" in
            2*)
              echo "### 📣 Release event for $SHA ($DIGEST) accepted by the inbox (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              echo "The mesh STORED the delivery. Whether the wave actually ran is verified on the satellites (a repository_dispatch run + the MW_IMAGE_DIGEST bump PR), never here — see #2235." >> "$GITHUB_STEP_SUMMARY"
              ;;
            000)
              echo "::error::could not reach the platform-update inbox at all (DNS/TLS/connection refused). No release event was delivered, so no satellite will re-bake against $SHA until its next schedule poll."
              exit 1
              ;;
            404)
              echo "::error::the platform-update inbox answered 404. It is FAIL-CLOSED and answers 404 for BOTH an unlisted target and a wrong URL — check vars.PLATFORM_WEBHOOK_URL against the instance's WebhookInbox:Targets (deploy/aks/values.aks.yaml sets WebhookInbox__Targets__0=Hosting/PlatformBuilds). No release event was delivered."
              exit 1
              ;;
            *)
              echo "::error::the platform-update inbox refused the release event (HTTP $code). No satellite will re-bake against $SHA until its next schedule poll."
              exit 1
              ;;
          esac

  # ─────────────────────────── DID IT ACTUALLY SHIP? ──────────────────────────
  # Belt and braces: `promote` PREVENTS a partial set, this CONFIRMS one landed. Assert the
  # IMAGES, never the green tick — 4f0c35cfc shipped memex-portal-ai:3.0.0-rc1.ci.2470 with a
  # leg missing (#1026) while every job it had reported success.
  #
  # `if: always()` on purpose: this runs whether the legs passed, failed or were cancelled, so the
  # run's LAST word is a named list of what is missing from the registry rather than a stack trace
  # from whichever leg died. That is the difference between "CD is red, go read four job logs" and
  # "memex-migration:<sha> is missing".
  #
  # It also catches what a per-job red CANNOT: a leg that reports success while pushing nothing
  # (Microsoft.NET.Build.Containers swallows a cancelled push as a warning and returns true — see
  # the guard in the root Directory.Build.props), an index that lost an architecture, and a
  # promotion that stopped between phases.
  #
  # The assertion itself lives in .github/scripts/check-image-set.sh because `gate` asks the SAME
  # question to decide whether HEAD needs reconciling; the two must never disagree.
  verify-images:
    name: "Verify every image shipped"
    needs: [gate, portal-image, migration-image, plugin-test-image, promote]
    if: always() && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Azure CLI
        run: command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      # Reads manifests through ARM (no `az acr login` needed — that one is for docker/push creds).
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Every image for this commit must exist in ACR
        run: .github/scripts/check-image-set.sh "${{ needs.gate.outputs.short_sha }}"
      # A heal that WORKED has to say so on the same issue that recorded the attempt, or the
      # ledger only ever grows and nobody can tell a fixed hole from an open one.
      - name: Report a successful heal
        if: needs.gate.outputs.reason == 'reconcile' && needs.promote.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          [ -n "$issue" ] || exit 0
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "✅ **Healed \`${{ needs.gate.outputs.short_sha }}\`** ([run]($RUN_URL)) — main's HEAD now has the complete image set (portal \`${{ needs.portal-image.outputs.version }}\`), verified against ACR. Installs pick it up on their next 6 h self-update poll. Close this issue if nothing else is outstanding."

  # ───────────────────────────── FAILURE ALERTING ────────────────────────────
  # A red CD after a green merge is otherwise INVISIBLE (nobody watches the Actions tab), and the
  # consequence is severe: the merged commit never gets a deployable image, so every pull-based
  # self-updating install silently stays on the previous image (2026-07-22: prod ran a leaky build
  # for 20h because run 29929207634 failed unnoticed). This job makes a failed main CD loud: it
  # files (or comments on) a GitHub issue labeled `ci-failure`.
  # - `if: failure()` with `needs`: fires only when at least one job actually FAILED — not when
  #   they were skipped (PR-triggered workflow_run, or a reconcile tick that found nothing to do)
  #   and not on cancellation.
  # - 🚨 EVERY job in this workflow is in `needs`. A job missing from this list fails SILENTLY,
  #   which is the whole failure mode this alerting exists to prevent: `gate` (a broken decision
  #   ships nothing), `promote` (the all-or-nothing act — if it dies, the legs are green and the
  #   release is unarmed), and `verify-images` (a registry MISSING an image, even when every
  #   publish leg reported success).
  # - Idempotent: one open `ci-failure` issue collects repeat failures as comments; a new issue is
  #   only created when none is open (close the issue once CD is green again). The reconciler
  #   writes its attempt ledger to the same issue, so the whole story is in one place.
  # ─────────────────────────── DELIVERY VERDICT ───────────────────────────
  # 🚨 The gate for "green, and shipped NOTHING".
  #
  # `alert-on-failure` below only fires on failure(). A CD run in which every image job SKIPPED is
  # a SUCCESS, so nothing alerted — and that is the exact state observed on 2026-08-19: two runs
  # for cb33558 each deferred to the other, both reported success, no image was built, and every
  # self-updating install silently stayed on the previous image. The cause is fixed (the
  # concurrency group, above), but the CLASS needs a post-condition, because a skip and a success
  # are indistinguishable in the UI — the same reason the node repos grew a skip-detection gate.
  #
  # It fires ONLY on the reconcile path, and that narrowness is deliberate:
  #   * the reconciler's entire purpose is to repair an incomplete image set. If it runs while
  #     main is GREEN and the set is INCOMPLETE and it still publishes nothing, delivery is stuck
  #     and no one is being told;
  #   * the PUSH path legitimately defers — batching hands the commit to the reconciler within
  #     the hour — so failing there would be noise, and noise is how a real red gets ignored.
  delivery-verdict:
    name: "CD delivered, or had a good reason not to"
    # 🚨 Every delivery leg is a NEED, not just [gate, promote]. The verdict cannot assert that a
    # publish actually happened while it can only see two of the nine jobs that make it happen.
    needs: [preflight, gate, portal-image, migration-image, plugin-test-image, promote,
            publish-bake, notify-platform-update, verify-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A green, incomplete main must never end a reconcile unpublished
        env:
          REASON: ${{ needs.gate.outputs.reason }}
          PUBLISH: ${{ needs.gate.outputs.publish }}
          COMPLETE: ${{ needs.gate.outputs.complete }}
          GREEN: ${{ needs.gate.outputs.green }}
          SHORT: ${{ needs.gate.outputs.short_sha }}
          GATE_RESULT: ${{ needs.gate.result }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "gate=$GATE_RESULT reason=$REASON publish=$PUBLISH complete=$COMPLETE green=$GREEN sha=$SHORT"

          # 🚨 THIS JOB MUST NOT PASS ON AN EMPTY VERDICT.
          #
          # Both guards below compare REASON against a literal. When `gate` is SKIPPED every
          # `needs.gate.outputs.*` is the EMPTY STRING, so neither comparison can match, and this
          # job printed "not publishing was the correct answer" and exited 0 having evaluated
          # NOTHING. Measured 2026-08-26: run 32914425222 reported `reason= publish= complete=
          # green= sha=` and a green tick, while every image job read `skipped`. A no-op and a
          # real delivery were indistinguishable on the wall — which is exactly how a merged fix
          # sat unshipped while its instance waited for it.
          #
          # That is the repo's own CI invariant (#3/#4) turned inward: a gate that CANNOT run must
          # not look like a gate that passed. So classify the three cases explicitly.
          if [ -z "$REASON" ]; then
            # (a) LEGITIMATE no-op: CD fires on every completed Build-and-Test, and `gate` is
            # deliberately conditioned to push-on-main. A PR run reaching here is expected, and
            # saying so is not the same as claiming a delivery.
            if [ "$GATE_RESULT" = "skipped" ] \
               && [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] \
               && { [ "$UPSTREAM_EVENT" != "push" ] || [ "$UPSTREAM_BRANCH" != "main" ]; }; then
              echo "not applicable — upstream was '${UPSTREAM_EVENT}' on '${UPSTREAM_BRANCH}', not a push to main. No delivery was due, and none is claimed."
              exit 0
            fi
            # (b) EVERYTHING ELSE with no verdict is the invisible state this job exists to catch:
            # the gate errored, was cancelled, or ran and produced no outputs at all. Reporting
            # success here is the failure mode, not the safe default.
            echo "::error::the delivery gate produced NO verdict (gate=${GATE_RESULT}, event=${GITHUB_EVENT_NAME}, upstream='${UPSTREAM_EVENT}' on '${UPSTREAM_BRANCH}'), so this run cannot say whether delivery was due. Refusing to report success on an unevaluated gate — a CD run that checked nothing must never be indistinguishable from one that delivered."
            exit 1
          fi

          if [ "$REASON" = "reconcile" ] && [ "$PUBLISH" != "true" ] \
             && [ "$COMPLETE" = "false" ] && [ "$GREEN" = "true" ]; then
            echo "::error::main \`$SHORT\` is GREEN and has an INCOMPLETE image set, and this reconcile published nothing. Delivery is stuck: every self-updating install stays on the previous image. This job exists because that state is otherwise INVISIBLE — the run reports success and every image job simply reads as skipped."
            exit 1
          fi

          # 🚨 THE OTHER INVISIBLE STATE — the push path's ⛔ branch. CD enters via workflow_run,
          # i.e. only after Build-and-Test COMPLETED on main, so GREEN != true here is a suite
          # that has SETTLED red — never one still running. The gate then records "⛔ nothing
          # will be built" in the step summary and the run ends SUCCESS: continuous delivery is
          # switched off for every commit until someone happens to open the summary. Measured
          # 2026-08-22: one flaky shard on 1b0b834 kept CD reporting green no-ops from 11:48
          # while both production instances waited on the release it was not building. A red
          # main is an incident for a continuously-delivered product; this run must be RED so
          # alert-on-failure files it. (A rerun that goes green fires a fresh workflow_run,
          # which publishes and supersedes this alarm — nothing to un-stick by hand.)
          if [ "$REASON" = "push" ] && [ "$PUBLISH" != "true" ] && [ "$GREEN" != "true" ]; then
            echo "::error::the required check on main \`$SHORT\` settled RED, so this CD run built nothing — delivery is OFF until main is green again. Re-run the failed Build-and-Test jobs (a green rerun re-enters CD by itself); if the failure is real, fixing main IS the release path."
            exit 1
          fi

          echo "OK — either something was published, or not publishing was the correct answer."

      # 🚨 THE POSITIVE CHECK: a run that DECIDED to publish must have RUN every leg.
      #
      # The guards above classify the gate's VERDICT. They say nothing about whether the nine jobs
      # that carry out a delivery actually executed — and a job that `skipped` renders the same
      # grey/green tick as one that ran, so a publish missing a leg reports success. That is the
      # repo's own CI invariant ("a gate that cannot run must not look like a gate that passed")
      # applied to delivery itself rather than to the decision about delivery.
      #
      # Named results, compared to a literal 'success': `skipped`, `cancelled` and `failure` all
      # fail here. There is deliberately no "if it is empty, assume fine" branch — that assumption
      # is what made the verdict pass on an empty gate output in the first place.
      - name: A publishing run must have RUN every leg, not skipped any
        if: needs.gate.outputs.publish == 'true'
        env:
          LEGS: >-
            preflight=${{ needs.preflight.result }}
            portal-image=${{ needs.portal-image.result }}
            migration-image=${{ needs.migration-image.result }}
            plugin-test-image=${{ needs.plugin-test-image.result }}
            promote=${{ needs.promote.result }}
            publish-bake=${{ needs.publish-bake.result }}
            notify-platform-update=${{ needs.notify-platform-update.result }}
            verify-images=${{ needs.verify-images.result }}
        run: |
          set -euo pipefail
          bad=""
          for kv in $LEGS; do
            name="${kv%%=*}"; res="${kv#*=}"
            if [ "$res" != "success" ]; then bad="$bad $name=$res"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::the gate decided to PUBLISH, but these delivery legs did not run to success:$bad. A skipped leg is not a delivery: the promote step tags all-or-nothing, so a missing leg means either no image set was published or one was published without its bake/notify. Read the named job rather than re-running."
            exit 1
          fi
          echo "every delivery leg ran and succeeded: $LEGS"

      # Make the outcome unmissable on the run page. A 3-second success and a 20-minute delivery
      # are otherwise identical at a glance, which is how a merged fix sat unshipped.
      - name: Say plainly what this run did
        if: always()
        env:
          PUBLISH: ${{ needs.gate.outputs.publish }}
          REASON: ${{ needs.gate.outputs.reason }}
          SHORT: ${{ needs.gate.outputs.short_sha }}
          GATE_RESULT: ${{ needs.gate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          # 🚨 NO-OP is keyed on the gate having been SKIPPED — never on an empty reason. An empty
          # reason is ALSO what a gate that errored, was cancelled, or produced no outputs looks
          # like, and this step runs under `if: always()`, so labelling that "NO-OP" would stamp a
          # broken run with the one label that says nothing was due. (Caught in review.)
          if [ "$GATE_RESULT" = "skipped" ]; then
            echo "### ⚪ NO-OP — the gate did not run: not a push to main, so no delivery was due" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = "true" ] && [ "$PROMOTE_RESULT" = "success" ]; then
            echo "### ✅ PUBLISHED an image set for \`${SHORT}\` (reason: ${REASON})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = "true" ]; then
            echo "### ❌ DELIVERY FAILED for \`${SHORT}\` — the gate decided to publish but promote=${PROMOTE_RESULT}; see the leg check above" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$REASON" ]; then
            echo "### 🕐 NO PUBLISH for \`${SHORT}\` (reason: ${REASON})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ INCONCLUSIVE — gate=${GATE_RESULT} produced no verdict; this run is red above" >> "$GITHUB_STEP_SUMMARY"
          fi

  alert-on-failure:
    name: "Alert: CD failed on main"
    # delivery-verdict is in this list ON PURPOSE: it is the job that turns the two
    # invisible do-nothing states (green-but-stuck reconcile, red-main push) into failures,
    # and a failure nobody is paged for is still invisible.
    # `preflight` and `notify-platform-update` are in this list ON PURPOSE (#2235): the release
    # event that starts the cross-repo rebake wave used to be unfailable, and a failure nobody is
    # paged for is still invisible. A red notify job does NOT mean the images are missing —
    # `verify-images` answers that — it means no satellite learned about them.
    needs: [preflight, gate, portal-image, migration-image, plugin-test-image, promote, verify-images, publish-bake, notify-platform-update, delivery-verdict]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level map for this job: the default GITHUB_TOKEN
    # here only needs to read/write issues (no checkout, no OIDC).
    permissions:
      issues: write
    steps:
      - name: Create or comment on ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # `gate` resolves the target for BOTH entry paths, so this names the right commit on a
          # reconcile run too — where workflow_run.head_sha is empty and the alert would otherwise
          # read "for commit ``". The fallbacks cover a failure IN gate, before it produced outputs.
          HEAD_SHA: ${{ needs.gate.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          set -euo pipefail
          # Ensure the label exists (--force = update-or-create, idempotent). Non-fatal for the
          # same reason as in `gate`: this is the ALERT path, so a 503 here must not swallow the
          # alert it is decorating. If the label genuinely does not exist, the `--label` on the
          # create below still fails loudly — which is the signal that matters.
          gh label create ci-failure --repo "$GITHUB_REPOSITORY" \
            --description "A main-branch CD run failed - no deployable image was published" \
            --color B60205 --force || echo "::warning::could not ensure the ci-failure label (continuing to file the alert)"
          body="CD failed on main: [run ${GITHUB_RUN_ID}](${RUN_URL}) for commit \`${HEAD_SHA}\` (entered via \`${REASON:-unknown}\`).

          Triage the failed job in the linked run - which of the two things CD delivers is broken depends on WHICH job went red:

          * an IMAGE job / promote / verify-images: no complete image set was published. Publication is all-or-nothing, so every self-updating install stays on the PREVIOUS image until a CD run promotes the full set.
          * preflight / notify-platform-update: the images may be fine, but the release EVENT did not reach the control instance, so no node repo re-bakes against this commit until its own schedule poll (#2235). Read the job's ::error:: line - it names what to provision or what refused the delivery.

          The hourly reconciler will re-attempt main's HEAD on its own (bounded at 3 attempts per commit, logged here); you do NOT need to force a merge to trigger delivery. Close this issue once CD is green."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CD failed on main: run ${GITHUB_RUN_ID}" \
              --label ci-failure --body "$body"
          fi

  # ─────────────────────────────── NO DEPLOY JOB ─────────────────────────────
  # Deployment is PULL-BASED, not push. CI's job ends at "publish the image to ACR" (the image
  # jobs above). Each installation — memex / prod / memex-cloud AND every external install in the
  # world that prod knows nothing about — runs the in-portal self-updater
  # (memex/Memex.Portal.Shared/SelfUpdate): it polls ACR with its OWN workload identity, and, per its
  # own Admin/UpdatePolicy (Continuous/Stable/None + the CI-green gate), patches its OWN portal +
  # migration Deployments via its OWN in-cluster ServiceAccount token. So CI needs NO cluster
  # credentials — which is also why the old `az aks command invoke` deploy job was deleted: it
  # required a central service principal with per-cluster Azure RBAC (the `commandResults/read`
  # authorization failure on 2026-06-29), a model that cannot scale to installs prod doesn't manage.
  # See deploy/aks/SELF-UPDATE.md / deploy/aks/README.md for enabling self-update on an environment (the SA + RBAC are
  # in the Helm chart; set selfUpdate.azureClientId and grant the UAMI AcrPull).
