name: Node repo cap debt (reusable)

# ♻️ REUSABLE (workflow_call) — a package capped below `latest` keeps its deployment, and owes a
# migration that triage hears about every day (policy `package-mesh-version-cap`,
# Doc/Architecture/DeployTestSwitchLatest §5-§6).
#
# A package may author `maxMeshVersion` next to `minMeshVersion` in `<Package>/index.json` (with
# `capReason` and `capTracking`); its modules then build against the highest COMPLETE build-server
# deployment inside its floor and cap instead of `latest`. Once a day this lane does two things, both
# in `.github/scripts/cap-debt-triage.py` (self-tested at the start of every run):
#
#   1. PUBLISHES the repository's WHOLE cap set to the control inbox as ONE signed `build-caps` event
#      (`{event, repo, sha, caps:[{package, floor, cap, version, deployed, reason}]}`). The control
#      plane's intake keeps one `Hosting/BuildCaps/<package>` node per cap, written as System; the
#      build hosts' retention reads them, fail-closed, so a capped package's deployment is never torn
#      down under it. `version` is the highest COMPLETE deployed version in [floor, cap] (from
#      `GET <build API>/hosts`; a 503 there is an outage, retried, never an empty list); when none is
#      deployed it is the version that must be. A package absent from the set is a REMOVED cap: its
#      node is deleted, so its version can be torn down. That is why the set is sent even when it is
#      empty.
#   2. FILES ONE triage item per capped package — a submitted `Feedback/Feedback` node, "migrate
#      <package> to latest" — over the control instance's MCP endpoint, as the lane's service user, in
#      that user's own `<user>/Feedback`. The id is (repository, package, cap), so the next day refreshes
#      it and never duplicates it; a removed cap's item is resolved.
#   3. REQUESTS every deployment a cap needs and no complete version provides: ONE signed
#      `build-host-deploy-requested` per needed version, reason `cap:<package>`, carrying the set's
#      tester, portal and runner digests (plus `coreTestsDigest` when the set has one), read from the
#      registry by the version tag — so ONLY then the registry credential is needed, and its absence
#      is RED naming it. The inbox's 202 is acceptance, not a deployment: the next run reads `/hosts`.
#
# 🛡️ THIS LANE MAY NOT SKIP (AGENTS.md → "A gate NEVER tests its own inputs"). The first step
# asserts every input and fails RED naming it; no step carries an input-shaped `if:` and none has
# `continue-on-error`. A tree with no cap still runs: it publishes its empty set and resolves the
# items of caps that are gone.
#
# CALLER (a satellite's own daily workflow; the cap-debt job needs `contents: read` alone, the two
# reporter jobs the ledger lane's `contents: read, issues: write, actions: read`):
#
#   on:
#     schedule: [{ cron: "17 6 * * *" }]
#     workflow_dispatch: {}
#   jobs:
#     cap-debt:
#       permissions: { contents: read }
#       uses: Systemorph/MeshWeaver/.github/workflows/node-repo-cap-debt.yml@main
#       with:
#         build-api: ${{ vars.MW_BUILD_API }}
#         mesh-url: ${{ vars.MW_TRIAGE_URL }}
#         triage-namespace: ${{ vars.MW_TRIAGE_NAMESPACE }}
#         control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
#       secrets:
#         triage-token: ${{ secrets.MW_TRIAGE_TOKEN }}
#         control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
#         build-api-token: ${{ secrets.MW_BUILD_API_TOKEN }}
#         build-worker-token: ${{ secrets.MW_BUILD_WORKER_TOKEN }}   # optional: reads `cappedBy` names
#         registry-username: ${{ secrets.ACR_USERNAME }}             # needed only to request a deployment
#         registry-password: ${{ secrets.ACR_PASSWORD }}
#     # 🚨 A DAILY lane's red is red in an EMPTY ROOM: a failed preflight, `/hosts`, publication or
#     # MCP call leaves only a failed scheduled run while the retention and debt records silently
#     # stop being refreshed. So the caller ALSO wires the fleet's result-aware reporter — the
#     # ci-failure ledger lane, under its OWN label — on BOTH outcomes: a red opens (or appends to)
#     # ONE `cap-debt-red` issue and tells the control inbox; the next green closes it.
#     cap-debt-red:
#       needs: [cap-debt]
#       if: github.event_name != 'pull_request' && failure()
#       permissions: {contents: read, issues: write, actions: read}
#       uses: Systemorph/MeshWeaver/.github/workflows/node-repo-ci-failure.yml@main
#       with:
#         outcome: failure
#         label: cap-debt-red
#         issue-title: "cap-debt-red: the daily cap-debt lane is red"
#         run: ${{ github.run_id }}
#         run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#         sha: ${{ github.sha }}
#         event: ${{ github.event_name }}
#         control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
#       secrets:
#         github-token: ${{ secrets.GITHUB_TOKEN }}
#         control-webhook-secret: ${{ secrets.CONTROL_WEBHOOK_SECRET }}
#     cap-debt-green:
#       needs: [cap-debt]
#       if: github.event_name != 'pull_request' && success()
#       permissions: {contents: read, issues: write, actions: read}
#       uses: Systemorph/MeshWeaver/.github/workflows/node-repo-ci-failure.yml@main
#       with:
#         outcome: success
#         label: cap-debt-red
#         issue-title: "cap-debt-red: the daily cap-debt lane is red"
#         run: ${{ github.run_id }}
#         run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#         sha: ${{ github.sha }}
#         event: ${{ github.event_name }}
#         control-webhook-url: ${{ vars.CONTROL_WEBHOOK_URL }}
