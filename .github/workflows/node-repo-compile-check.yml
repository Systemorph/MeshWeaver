name: Node repo compile-check (reusable)

# ♻️ REUSABLE (workflow_call) — 🧱 THE COMPILE GATE for MeshWeaver.* content repos (unified per
# #1707). validate-repos.py checks JSON shape only — it does NOT compile. This gate compiles
# every NodeType's resolved Source against the framework assemblies exactly as the mesh does
# (concatenated sources, hoisted usings), so async-broken / API-drifted Source can no longer
# merge "green" and PARK on a live mesh at the next pod restart (the 2026-07-21 UWDeepfield
# outage in MeshWeaver.Plugins). The reference set is taken FROM the digest-pinned platform
# image — the same assemblies the mesh loads at run time — instead of building the core repo
# from source (~10 minutes per run for a dependency that changes far less often than the repo).
#
# The caller's `scripts/compile-check.py` does the work; `scripts/compile-check.allow`
# grandfathers known debt with a one-way ratchet: a NEW non-allowlisted failure fails the PR;
# a fixed allowlisted type must be removed from the file.
#
# NOT gated on the image inputs being set: the compile gate is unconditional. If the image
# reference or the registry credentials are missing, the login/pull steps fail LOUDLY — a
# silently skipped compile gate is exactly how the 2026-07-21 outage shipped.
#
# Caller contract:
#
#   compile-check:
#     needs: validate
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-compile-check.yml@<40-char platform commit sha>
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".
#     with:
#       test-image: ${{ vars.MW_TEST_IMAGE }}
#       image-digest: ${{ vars.MW_IMAGE_DIGEST }}
#     secrets:
#       acr-username: ${{ secrets.ACR_USERNAME }}
#       acr-password: ${{ secrets.ACR_PASSWORD }}
#
# The SECOND caller shape (MeshWeaver, 2026-09-12): the platform's own CD points this lane at a
# satellite's content — `content-repository: Systemorph/MeshWeaver.<X>`, `content-ref: main`, the
# tester at THIS run's digest, this run's module bundles as `module-artifacts`, and a
# `verdict-artifact` so the run can relay WHICH satellite broke on WHICH types. That is the
# per-build counterweight to the fleet's daily rebuild (satellites rebuild once a day, not per
# platform build): every core build still MEASURES compatibility, cheaply, so a break is known
# within the hour rather than at 03:00 or on a portal at self-update. A node repo calling this lane
# with no content-repository behaves exactly as before.

on:
  workflow_call:
    inputs:
      test-image:
        description: The platform image whose /app assemblies are the reference set.
        required: true
        type: string
      image-digest:
        description: >-
          Digest pin (tag@digest). Leaving it empty is an ERROR unless allow-unpinned is set.
        required: false
        type: string
        default: ''
      allow-unpinned:
        description: >-
          Explicitly accept an empty image-digest and take the reference assemblies from the
          tag verbatim. Never a silent fallback.
        required: false
        type: boolean
        default: false
      module-artifacts:
        description: >-
          Artifact-name pattern (actions/download-artifact `pattern`) of module bundles UPLOADED
          BY THIS RUN whose assemblies belong in the reference set.
        required: false
        type: string
        default: ''
      registry-modules:
        description: >-
          Package ids (whitespace-separated, e.g. `AI`) whose module bundle to fetch from
          registry-url and add to the reference set — for a repo that BINDS a module's types but
          does not build the module.

          🚨 Since MeshWeaver#2276 the image is no longer the whole framework. `/app` ships no
          MeshWeaver.AI, so `AiSettings`, `ThreadMessage`, `ThreadNodeType`,
          `AgentPickerProjection`, `ModelProviderConfiguration` and the `IMessageHub.StartThread`
          extension are simply ABSENT — and every NodeType binding them fails CS0246 / CS0103 /
          CS1061. Those errors name the CONTENT, so they read as the repo breaking rather than as
          a reference set that is missing a module.
        required: false
        type: string
        default: ''
      registry-url:
        description: The registry serving module bundles for registry-modules.
        required: false
        type: string
        default: ''
      platform-ref:
        description: >-
          The Systemorph/MeshWeaver ref whose .github/scripts this gate runs (compose-sealed-modules.sh).
          Default main; pin it to the same sha as the `uses:` line for a reproducible run.
          (`github.job_workflow_sha` is EMPTY inside a reusable called from another repo — measured
          2026-08-30 — so the script's ref is an input, never inferred.)
        required: false
        type: string
        default: main
      content-repository:
        description: >-
          The repository whose NodeTypes are compile-checked. Empty = the caller (every node repo
          checking its own content — the original shape). The platform's CD sets it to each
          satellite in turn (its `satellite-compat` matrix), so every core build measures every
          satellite against the set it just promoted. With it set, `content-app-id` /
          `content-app-private-key` are REQUIRED and asserted RED before the checkout: the caller's
          GITHUB_TOKEN cannot read another repository.
        required: false
        type: string
        default: ''
      content-ref:
        description: >-
          The ref of content-repository to check. Empty = the caller's own commit. The platform's
          CD passes the satellite's default branch — what that satellite's own daily run would bake.
        required: false
        type: string
        default: ''
      verdict-artifact:
        description: >-
          When set, the gate's verdict is ALSO written as JSON (compile-check.py --report) and
          uploaded under this artifact name — for a caller that has to RELAY the result rather than
          read this job's log (a matrix of these calls has no steps of its own). Uploaded on red as
          well as green; a run that produced no report fails the upload RED rather than uploading
          nothing, so "no verdict" can never be read as "clean".
        required: false
        type: string
        default: ''
      upstream-seed:
        description: >-
          The upstream source(s) whose SEALED publication for this image's framework identity
          supplies the registry-modules bundles (e.g. `plugins`). 🚨 With this set, module bytes
          come from the seal — the ones the upstream's NodeType assemblies were built against —
          never from the registry's package endpoint (MeshWeaver#2698: the registry serves the
          module's own lane's last build under an unmoved version, so a gate composing it judges
          assemblies built against one MeshWeaver.AI while holding another). No fallback: an
          upstream with no seal, or a seal without a module set, fails RED naming the identity.
          Without it, registry-modules are taken from the registry and the log says so loudly.
        required: false
        type: string
        default: ''
    secrets:
      acr-username:
        description: Registry user able to pull the image.
        required: true
      acr-password:
        description: Registry password for that user.
        required: true
      registry-key:
        description: An instance key (mwi_…) able to read the packages named in registry-modules.
        required: false
      content-app-id:
        description: >-
          App id of a GitHub App with Contents: Read on content-repository. Required whenever
          content-repository is set (the caller's GITHUB_TOKEN cannot read another repository);
          asserted RED before the checkout, never skipped. The platform passes its READ-ONLY
          fleet-reader App.
        required: false
      content-app-private-key:
        description: Private key (PEM) of that App.
        required: false

jobs:
  compile-check:
    name: Compile every NodeType (vs core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 🚨 A job-level `permissions:` in a workflow_call lane is a DEMAND on every caller, not a
    # grant (MeshWeaver#3933 took MeshWeaver.Plugins down for five hours with one `id-token:
    # write` here). Both scopes below sit inside GitHub's RESTRICTED default (contents / packages /
    # metadata read), so a caller that writes no `permissions:` at all — four satellites call this
    # lane exactly that way, see .github/lane-caller-grants.yml — still satisfies them, and
    # check-workflow-permission-pairing.py --fleet holds that against the roster on every core PR.
    #   contents — the checkout
    #   packages — the platform's CD pulls the tester from its GHCR mirror with GITHUB_TOKEN (core
    #              holds no ACR password and OIDC would be `id-token`, the one scope no default
    #              grants); a node repo pulling from ACR with its own credential does not use it.
    permissions:
      contents: read
      packages: read
    steps:
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository: Systemorph/<sat>`
      # (private) answers 404 under it. When content-repository is set, the App credential is
      # ASSERTED red, never fallen back on: a fallback to github.token would 404 anyway, one step
      # later and blaming the checkout. Same shape as node-repo-publish-bake.yml's content checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - name: Check out the node repo
        uses: actions/checkout@v7
        with:
          # Empty inputs fall through to the caller's own repo + commit — byte-identical to the
          # default checkout for every node repo; only the platform's CD points these elsewhere.
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
          path: repo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # compile-check.py shells out to `dotnet build` on a generated net10.0 check.csproj — pin
      # the SDK rather than depend on whatever the runner image happens to preinstall.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Log in to the image registry
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          # 🚨 Bounded retry, and deliberately NOT a skip-trapdoor: after the last attempt this
          # still fails RED, and a CREDENTIAL rejection fails IMMEDIATELY rather than being retried
          # three times — retrying a 401 only delays the same red while hiding which kind of
          # failure it was.
          #
          # Everything else IS retried, including failures this does not recognise. That is the
          # intended default rather than an oversight: an unclassified docker login failure is far
          # more often transient (daemon not ready, DNS, TLS reset) than permanent, and the one
          # class known to be permanent — bad credentials — is carved out above. A positive
          # allow-list of "connection-level" strings would fail fast on the next transient error
          # nobody predicted, which is the failure mode this exists to remove.
          #
          # Three ACR logins failed on 2026-08-28 in two separate incidents an hour apart
          # ("dial tcp 51.12.25.80:443: connect: connection refused", registry healthy throughout),
          # reddening three REQUIRED checks across two repos. On a strict:true repo the cost is not
          # one re-run: the re-run lands against a moved main, the branch goes BEHIND, and it needs
          # another sync and another full run — so one TCP reset re-stales every open PR (#2570).
          for attempt in 1 2 3; do
            if echo "${{ secrets.acr-password }}" \
                 | docker login "${TEST_IMAGE%%/*}" -u "${{ secrets.acr-username }}" \
                     --password-stdin 2>login.err; then
              rm -f login.err
              exit 0
            fi
            cat login.err
            if grep -qiE 'unauthorized|authentication required|denied|401' login.err; then
              echo "::error::ACR rejected the credentials for ${TEST_IMAGE%%/*} — that is not a"\
                   "transient failure, so it is not retried. Check the acr-username/acr-password secrets."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::docker login to ${TEST_IMAGE%%/*} failed after 3 connection-level attempts."
          exit 1
      - name: Take the framework assemblies from the platform image
        id: image
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          UPSTREAM_SEED: ${{ inputs.upstream-seed }}
        # The image already CONTAINS the built framework — the same assemblies the mesh loads at
        # run time. Copying them out costs seconds, and checking Source against what actually
        # ships is the question this gate exists to answer.
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            IMAGE="${TEST_IMAGE%%:*}@${IMAGE_DIGEST}"
          elif [ "${{ inputs.allow-unpinned }}" = "true" ]; then
            IMAGE="$TEST_IMAGE"
            echo "checking against ${TEST_IMAGE} verbatim (allow-unpinned — runs are not reproducible)"
          else
            echo "::error::image-digest is empty and allow-unpinned is not set — pin a digest (reproducible) or opt in to following the tag."
            exit 1
          fi
          docker pull -q "$IMAGE"
          id=$(docker create "$IMAGE")
          mkdir -p refs
          docker cp "$id:/app/." refs/ >/dev/null
          # 🚨 The platform's SHARED FRAMEWORKS ride into the reference set too. A container-built
          # module (mw-plugin-test build-project compiles against /app) references
          # System.Private.CoreLib's identity DIRECTLY — the SDK ref pack cannot resolve it, and
          # the first run whose floor bundles were container-built failed 11 NodeTypes with
          # CS0012 'System.Private.CoreLib not referenced' (Plugins#1032, 2026-09-01). With these
          # present, compile-check.py switches itself to implementation-framework mode and
          # compiles exactly the way the mesh does.
          mkdir -p refs/shared-frameworks
          docker cp "$id:/usr/share/dotnet/shared/." refs/shared-frameworks/ >/dev/null
          docker rm -v "$id" >/dev/null
          echo "framework assemblies: $(find refs -maxdepth 1 -name 'MeshWeaver.*.dll' | wc -l) from /app; $(find refs/shared-frameworks -name '*.dll' | wc -l) implementation-framework assemblies"
          # The identity that addresses an upstream's sealed publication — only when one is seeded.
          if [ -n "${UPSTREAM_SEED:-}" ]; then
            line=$(docker run --rm --init --entrypoint /app/mw-plugin-test "$IMAGE" --print-framework-identity)
            identity="${line#*identity=}"; identity="${identity%% *}"
            [ -n "$identity" ] || { echo "::error::could not resolve a framework identity from $IMAGE (got: '$line') — cannot address the upstream publication for upstream-seed."; exit 1; }
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
            echo "this check resolves framework identity $identity; registry-modules come from the seal of: $UPSTREAM_SEED"
          fi
      - name: Download this run's module-bundle artifacts
        if: inputs.module-artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.module-artifacts }}
          path: ${{ runner.temp }}/ref-bundles
          merge-multiple: true
      # 🚨 THE IMAGE IS NO LONGER THE WHOLE FRAMEWORK (#2276). A repo binding an external module's
      # types must add that module's assemblies, or the gate compiles against a framework no mesh
      # actually runs — and reports the gap as CONTENT errors.
      - name: Add external modules to the reference set
        if: inputs.module-artifacts != '' || inputs.registry-modules != ''
        env:
          REGISTRY_MODULES: ${{ inputs.registry-modules }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
          SEAL_UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.image.outputs.identity }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLES="${RUNNER_TEMP:-/tmp}/ref-bundles"; mkdir -p "$BUNDLES"
          if [ -n "${REGISTRY_MODULES:-}" ]; then
            if [ -n "${SEAL_UPSTREAMS:-}" ]; then
              # 🚨 The publication is the unit of consistency (MeshWeaver#2698): module bytes come
              # from the SEALED upstream publication for this identity, never the registry's
              # package endpoint. No fallback — a missing seal or module set is RED in the script.
              # The compose script at inputs.platform-ref (default main; pin it beside the `uses:` sha for a
              # reproducible run). NOT github.job_workflow_sha: it is empty inside a reusable called from
              # another repository, so a fetch keyed on it silently read main while claiming a pin.
              SCRIPT="${RUNNER_TEMP:-/tmp}/compose-sealed-modules.sh"
              [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the compose script has no ref to be fetched at"; exit 1; }
              gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/compose-sealed-modules.sh?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$SCRIPT" \
                || { echo "::error::could not fetch compose-sealed-modules.sh at ${PLATFORM_REF} from Systemorph/MeshWeaver"; exit 1; }
              head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched compose-sealed-modules.sh at ${PLATFORM_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
              chmod +x "$SCRIPT"
              [ -n "${REGISTRY_URL:-}" ] || { echo "::error::upstream-seed is set but registry-url is empty — the compile check reads sealed module sets from the registry."; exit 1; }
              "$SCRIPT" --identity "$IDENTITY" --packages "$REGISTRY_MODULES" --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" \
                --registry-url "$REGISTRY_URL" --registry-key "$REGISTRY_KEY"
            else
              echo "::notice::composing registry-modules ($REGISTRY_MODULES) from the REGISTRY's package endpoint: this repo declares no upstream seed, so there is no sealed publication to take module bytes from. These bytes are whatever the module's own lane published last — a bake-consumption decline against a publication that composed different ones is expected, and is the reason to declare the upstream (upstream-seed / upstream-sources) instead."
            for pkg in ${REGISTRY_MODULES:-}; do
              idx=$(curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" "$REGISTRY_URL/api/plugins/bundles/index.json") \
                || { echo "::error::registry index unreadable at $REGISTRY_URL (registry-modules: $pkg)"; exit 1; }
              ver=$(jq -r --arg p "$pkg" '(.bundles // .Bundles // [])[] | select(((.plugin // .Plugin)|ascii_downcase)==($p|ascii_downcase)) | (.version // .Version)' <<<"$idx" | head -1)
              [ -n "$ver" ] || { echo "::error::the registry at $REGISTRY_URL does not advertise package '$pkg' to this instance key."; exit 1; }
              curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" -o "$BUNDLES/$pkg.bundle.zip" "$REGISTRY_URL/api/plugins/bundles/$pkg/$ver" \
                || { echo "::error::download failed for $pkg@$ver from $REGISTRY_URL"; exit 1; }
              echo "fetched $pkg@$ver from $REGISTRY_URL"
            done
            fi
          fi
          shopt -s nullglob
          added=0
          for b in "$BUNDLES"/*.nupkg "$BUNDLES"/*.zip; do
            u="${RUNNER_TEMP:-/tmp}/refunpack-$(basename "$b")"; rm -rf "$u"; mkdir -p "$u"
            unzip -o -q "$b" -d "$u"
            [ -d "$u/meshweaver/modules" ] || { echo "::error::$(basename "$b"): no meshweaver/modules/ in the bundle"; exit 1; }
            cp -R "$u"/meshweaver/modules/*.dll refs/ 2>/dev/null || true
            added=$((added + 1))
          done
          # RED, not "nothing to do": silently falling back to the image-only set is exactly the
          # state this input exists to leave.
          [ "$added" -gt 0 ] || { echo "::error::external modules were requested but none were added — the artifact pattern matched nothing and no registry bundle was fetched."; exit 1; }
          echo "reference set topped up from $added module bundle(s): $(find refs -name 'MeshWeaver.*.dll' | wc -l) assemblies"
      # 🚨 ONE implementation, every repo ("centralize scripts as best as possible"): the check
      # runs the PLATFORM's compile-check.py at the pinned ref — the caller keeps only its
      # allow-file (policy). Fetched exactly like compose-sealed-modules.sh above: asserted RED
      # when unavailable, never fallen back to a drifted per-repo copy (three satellite copies
      # had already drifted apart when this centralization landed).
      - name: Fetch the platform's compile-check at the pinned ref
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the canonical compile-check.py has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/compile-check.py?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/compile-check.py" \
            || { echo "::error::could not fetch .github/scripts/compile-check.py at ${PLATFORM_REF} from Systemorph/MeshWeaver — a pin older than the centralization needs the older lane, not a drifted local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/compile-check.py" | grep -q "compile-check" || { echo "::error::the fetched compile-check.py at ${PLATFORM_REF} does not look like the checker"; exit 1; }
      - name: Compile-check every NodeType
        working-directory: repo
        env:
          MW_REPO_ROOT: ${{ github.workspace }}/repo
          MW_ALLOW_FILE: ${{ github.workspace }}/repo/scripts/compile-check.allow
          VERDICT_ARTIFACT: ${{ inputs.verdict-artifact }}
        # --refs points at the assemblies unpacked from the platform image — a FLAT directory;
        # compile-check.py globs it recursively, dedupes by filename, and compiles each
        # NodeType's resolved source-set. The script is the PLATFORM's, fetched above.
        # --report only when a verdict artifact was asked for: the flag exists from the platform
        # ref that introduced satellite-compat, and a caller naming an artifact against an older
        # platform-ref fails here on the unknown flag — RED, not a silent artifact-less pass.
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/compile-check.py" --refs ../refs \
            ${VERDICT_ARTIFACT:+--report "$RUNNER_TEMP/compile-check-verdict.json"}
      # 🚨 `always()` so a RED gate uploads its verdict too — that is the whole point of the
      # artifact — and `if-no-files-found: error` so a run that died before writing one fails
      # here rather than handing the consumer nothing to read. This is a reporter riding a
      # gate whose result is already decided above, never a step the gate's own colour depends on.
      - name: Upload the verdict
        if: ${{ always() && inputs.verdict-artifact != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.verdict-artifact }}
          path: ${{ runner.temp }}/compile-check-verdict.json
          retention-days: 7
          if-no-files-found: error
