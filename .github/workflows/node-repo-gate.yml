name: Node repo gate (reusable)

# ♻️ REUSABLE (workflow_call) — the heavy tester gate every MeshWeaver.* content repo runs
# (unified per #1707): install each package into a real MeshWeaver mesh (in-process,
# SQLite/filesystem persistence) and assert code packages compile live, render, AND that each
# type's `Tests` layout area runs green — tests are EXECUTED, not just compiled; a red test
# fails the PR. The tester ships in the mw-plugin-test image; contract is `docker run` with the
# checkout mounted (NOT a `container:` job — see MeshWeaver.Plugins ci.yml history).
#
# NO input-shaped `if:` anywhere in here, deliberately (AGENTS.md: a gate never tests its own
# inputs). The caller's `preflight` job asserts the image/registry inputs red-fail-naming-them,
# the fork exemption lives there too, and this gate runs unconditionally behind
# `needs: [preflight, ...]`.
#
# Caller contract:
#
#   test-repos:
#     needs: [validate, preflight]
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-gate.yml@<40-char platform commit sha>
#
# 🚨 THE REQUIRED CONTEXT IS THE AGGREGATE, and the caller's job name is half of it. This lane is a
# FAN-OUT since #2543's tax was measured: `plan` decides the shard matrix, `gate` runs one job per
# shard, and `verify` — named `Compile + render node repos (MeshWeaver from ACR)`, unchanged — folds
# the shards' evidence and is the ONE stable context. A repo requires
# `<caller job> / Compile + render node repos (MeshWeaver from ACR)` and nothing else from this
# lane: the per-shard contexts (`<caller job> / Gate shard i/n`) appear and disappear with the
# `shards` input, so requiring one would wait forever the day the number changed. Same invariant as
# `All selected bundles built` in node-repo-module-pack.yml, for the same reason.
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".
#     with:
#       test-image: ${{ vars.MW_TEST_IMAGE }}
#       image-digest: ${{ vars.MW_IMAGE_DIGEST }}
#       platform-image: meshweaver.azurecr.io/memex-portal-ai        # the PORTAL — the reference set (#3022)
#       platform-image-digest: ${{ vars.MW_PORTAL_IMAGE_DIGEST }}    # same CD wave as image-digest
#       stage-repo: Systemorph/MeshWeaver.Plugins
#       stage-modules: Store
#       shards: 4        # opt-in fan-out; 1 (the default) is the unsharded lane, unchanged
#
# 🚨 TWO IMAGES, TWO ROLES (MeshWeaver#3022, the module lane's shape since #2907): the TESTER image
# EXECUTES the compile and the gate; the PLATFORM image (the portal) SUPPLIES the reference set,
# the framework identity and the runtime the gate's mesh runs on. Both run from a COMPOSED HOST —
# the portal's /app with the tester CLI beside it (compose-gate-host.sh) — started by the portal
# image's own `dotnet`. The tester's /app is a strict subset of the portal's (88 vs 219 assemblies
# on 3.0.0-rc9.ci.7534), so a gate compiling against the tester's /app reports every NodeType
# that binds a portal-only assembly (the Blazor and hosting halves; on ci.7534 also MeshWeaver.Maps
# and .AI, both modules since) as a CONTENT error.
#     secrets:
#       acr-username: ${{ secrets.ACR_USERNAME }}
#       acr-password: ${{ secrets.ACR_PASSWORD }}
#       stage-repo-app-id: ${{ secrets.MESHWEAVER_APP_ID }}
#       stage-repo-app-private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}

on:
  workflow_call:
    outputs:
      gate-log-artifact:
        description: >-
          The name of the artifact holding the tester's stdout (gate-log-<sha>) — EMPTY when the gate
          ran nothing (a PR whose diff reaches no module content). A caller's own ratchet keys on
          this: present ⇒ download and read it, and fail on a missing or truncated log; empty ⇒
          there was no gate run to ratchet, which the gate's own log states.

          🚨 UNCHANGED BY SHARDING, deliberately. With `shards: N` the tester's stdout arrives as N
          per-shard logs; the aggregate job FOLDS them into one `gate.log` carrying a single
          `=== mw-plugin-test summary ===` block and one terminal verdict, and uploads it under
          this same name. A caller's ratchet keeps reading one log. (Concatenating the shard logs
          instead would be a FALSE PASS: MeshWeaver.Plugins' `check-test-suites.py` reads the LAST
          summary in the file, so a concatenation would ratchet 1/N of the NodeTypes and report a
          clean sweep.)
        value: ${{ jobs.verify.outputs.gate-log-artifact }}
    inputs:
      test-image:
        description: The mw-plugin-test image reference (the caller's vars.MW_TEST_IMAGE).
        required: true
        type: string
      image-digest:
        description: >-
          Digest pin (tag@digest — reproducible; an image regression lands on the commit that
          bumps the pin, and a pin that lags the platform by days is a gate reporting on a
          framework nobody runs, so bump it routinely). Leaving it empty is an ERROR unless
          allow-unpinned is set.
        required: false
        type: string
        default: ''
      allow-unpinned:
        description: >-
          Explicitly accept an empty image-digest / platform-image-digest and gate against the
          tags verbatim. Never a silent fallback: an empty digest WITHOUT this flag fails red.
        required: false
        type: boolean
        default: false
      platform-image:
        description: >-
          The PORTAL image the gate compiles against and RUNS AS, e.g.
          meshweaver.azurecr.io/memex-portal-ai — REQUIRED (MeshWeaver#3022). The tester image
          executes; this image supplies the reference set (its /app + implementation shared
          frameworks), the framework identity the run's own bake is keyed to, and the runtime the
          gate's mesh runs on. The same input, same meaning, as node-repo-publish-bake.yml's and
          node-repo-module-pack.yml's. No default, no fallback to the tester's /app.
        required: true
        type: string
      platform-image-digest:
        description: >-
          Digest pin for platform-image (tag@digest), resolved as image-digest is: the pin, else
          the tag under allow-unpinned, else RED. Pin both digests from ONE CD wave — the lane
          asserts the two images resolve ONE framework identity and refuses a mixed pair by name.
        required: false
        type: string
        default: ''
      stage-repo:
        description: Repository to stage cross-repo modules from. Empty = no staging.
        required: false
        type: string
        default: ''
      stage-modules:
        description: >-
          Module directories to sparse-checkout from stage-repo and copy into the gate mount
          (newline-separated for several) so the caller's packages' `requires` resolve. Without
          them the package roots land on the unresolvable-NodeType error overlay — an
          arrangement production never runs (MeshWeaver#1701).
        required: false
        type: string
        default: ''
      allow-file:
        description: >-
          Known-debt ratchet file passed as --allow (repo-relative; one-way — a NEW
          non-allowlisted failure fails the PR, a fixed allowlisted type must be removed).
          Empty = none.
        required: false
        type: string
        default: 'plugin-gate.allow'
      affected-narrowing:
        description: >-
          On pull_request diffs, gate only the affected module closure computed by the caller's
          scripts/affected-modules.py (mirrors the runtime's edge semantics; full-run fallbacks
          are built into the script's classification). Main pushes / dispatches never narrow.
          Set false for a repo without that script — every event then gates the full set.
        required: false
        type: boolean
        default: true
      upstream-seed:
        description: >-
          Consume the caller's UPSTREAMS as pre-built bundles instead of staging their source:
          a whitespace-separated list of bake-source segments (e.g. `plugins`), each fetched from
          the portals' storage under `prebuilt-bundles/<framework-identity>/<source>/` — the
          SEALED publication for the exact identity this gate's image resolves — and handed to
          the tester as `--seed`. The tester then stands its mesh up on those bytes and REFUSES a
          run that could not adopt them (`BakeSeedConsumer.Shortfall`), so a green gate here
          means the dependency was installed, not recompiled.

          This is step 2 of the plugin build contract (Doc/Architecture/PluginBuildContract):
          "install my dependencies" — as artifacts, served by MeshWeaver. Requires the
          publication to carry NODE DEFINITIONS (core #2478), and the caller to grant
          `id-token: write` and pass the three azure-* secrets, exactly as for publish-bake.
          Empty = no upstream is consumed (today's behaviour, where stage-repo copies SOURCE).
          Fails RED — never skips — when a named upstream has no sealed publication for this
          identity: a gate that silently compiled its upstream is indistinguishable from one
          that installed it.
        required: false
        type: string
        default: ''
      registry-url:
        description: >-
          The registry that SERVES sealed publications (MeshWeaver#2487), e.g.
          https://memex.meshweaver.cloud. With registry-key set, upstream-seed fetches over
          HTTPS with an instance key and never touches Azure — and it works on pull_request.
        required: false
        type: string
        default: ''
      bake-publish-targets:
        description: >-
          Where upstream-seed READS the upstream publication from — the same
          <account>/<share>[/<base-path>] value the caller's publish-bake WRITES to
          (vars.BAKE_PUBLISH_TARGETS). The first target is read; publish-bake writes every
          target all-or-nothing, so one is the set. Required when upstream-seed is set.
        required: false
        type: string
        default: ''
      module-artifacts:
        description: >-
          Artifact-name pattern (actions/download-artifact `pattern`) of module bundles UPLOADED
          BY THIS RUN (each a *.module.nupkg) whose module DLLs the gate must compose with
          `--module`. The mirror of the same input on node-repo-publish-bake.yml, and it exists
          for the same reason: since MeshWeaver#2276 the tester image ships NO modules.
        required: false
        type: string
        default: ''
      registry-modules:
        description: >-
          Package ids (whitespace-separated, e.g. `AI`) whose module bundle to fetch from
          registry-url and compose into the gate with `--module` — for a repo that consumes a
          package's types but does not build its module. Requires registry-url + registry-key.

          🚨 A repo whose content declares `Skill` or `Agent` nodes needs `AI` here. Those are
          ENGINE NodeTypes served by MeshWeaver.AI, so without the module they are unregistered
          and every such package fails at INSTALL with `NodeType(s) not registered: Skill` —
          a CONTENT-shaped error with an INFRASTRUCTURE cause.
        required: false
        type: string
        default: ''
      platform-ref:
        description: >-
          The Systemorph/MeshWeaver ref whose .github/scripts this gate runs (compose-sealed-modules.sh).
          Default main; pin it to the same sha as the `uses:` line for a reproducible run.
          (`github.job_workflow_sha` is EMPTY inside a reusable called from another repo — measured
          2026-08-30 — so the script's ref is an input, never inferred.)
        required: false
        type: string
        default: main
      shards:
        description: >-
          How many runners to fan the gate out across. 1 (the default) is exactly the pre-fan-out
          behaviour: one job, one container, every discovered package gated in it.

          🚨 WHY THE FAN-OUT EXISTS — and why raising the cap was refused. The single job performs
          ~60 SERIAL package installs, each paying the `portal/nodeops` tax of MeshWeaver#2543.
          Measured on MeshWeaver.Plugins across 28 consecutive gate jobs (2026-09-03, 12:32-16:29Z),
          classified by reading each job's duration AND its verdict rather than its colour: 20 of
          them gated the full set, and their durations were 17.9-30.4 minutes against a
          `timeout-minutes: 30`. FOUR were CUT AT THE CAP (30.3-30.4 min, the gate the only
          cancelled job in an otherwise complete run) and three more returned real content verdicts
          at 28.1 / 29.4 / 29.7 — i.e. 35% of full-set runs came within two minutes of the cap.

          A cap cut reports as `cancelled`, indistinguishable from a real cancellation, so the
          gate's verdict was unreadable exactly when it took longest — and a caller's own ratchet
          skips on `cancelled` too, so the Tests-area evidence went with it. Raising the cap does
          not fix that: the fleet-wide ceiling is 45 minutes, so it buys 15 against a moving tail
          and a 45-minute cut still reports `cancelled`.

          🚨 A `failure` on this gate is NOT evidence of a cap cut. Three of the four longest reds
          in that sample were content verdicts (`GATE FAILED — install: Hosting`), and attributing
          them to the cap would inflate the "before" and overstate what sharding buys. Read the
          duration and the verdict text.

          Each shard is its own `docker run --rm`, so shards share no mesh, no nodeops hub and no
          runner — the `portal/nodeops` saturation behind the long tail (MeshWeaver#2543) does not
          follow them. A shard gates its slice and INSTALLS that slice's dependency closure
          (GateShardPlan); every package is gated exactly once across the fan-out.

          🚨 IT COSTS RUNNER MINUTES, so it is opt-in per caller rather than a default. Modelled on
          the same measurements for MeshWeaver.Plugins' 59 packages: 1 shard 21.9 min wall / 21.9
          runner-min; 3 shards 11.1 / 31.6; 4 shards 10.8 / 35.5. Past 4 the per-shard fixed cost
          (image pull, /app extract, the compile pass) dominates and the curve flattens.

          🚨 THE PINNED IMAGE MUST UNDERSTAND `--shard`. A tester image that predates it exits 2 on
          the unknown argument; the shard job asserts the flag by name BEFORE it gates, so the
          failure names the pin rather than the content.
        required: false
        type: number
        default: 1
      capture-coredumps:
        description: >-
          Run the tester with minidump-on-crash enabled and upload any dumps as a run artifact
          — for a repo whose gate has crashed in ways a log cannot explain.
        required: false
        type: boolean
        default: false
    secrets:
      acr-username:
        description: Registry user able to pull the test image.
        required: true
      acr-password:
        description: Registry password for that user.
        required: true
      # The same OIDC identity publish-bake uses, read-only here: the gate FETCHES the caller's
      # upstream publication to seed from. Required only when upstream-seed is set; the preflight
      # below fails RED naming whichever is missing rather than letting the step skip.
      registry-key:
        description: An instance key (mwi_…) holding a whole-source grant on each upstream (upstream-seed via registry-url).
        required: false
      azure-client-id:
        description: Client id of the Azure identity that can read the portals' storage (upstream-seed only).
        required: false
      azure-tenant-id:
        description: Tenant of that identity (upstream-seed only).
        required: false
      azure-subscription-id:
        description: Subscription of that identity (upstream-seed only).
        required: false
      stage-repo-app-id:
        description: >
          App id of a GitHub App installed on stage-repo's org with Contents: Read (needed only
          when stage-modules is set). Replaces the former stage-repo-token PAT: an installation
          token is minted per run and scoped to stage-repo alone, so it cannot rot the way a
          stored PAT does — and, unlike a PAT, it resolves for dependabot-triggered runs once
          provisioned in the caller's Dependabot secret store as well (#2249).
        required: false
      stage-repo-app-private-key:
        description: Private key (PEM) of that App.
        required: false

jobs:
  # ─────────────────────────── 1. WHAT THIS RUN GATES, computed ONCE ───────────────────────────
  # The affected closure used to be recomputed inside the one gate job. With a fan-out it has to be
  # decided in ONE place: N shards that each ran the diff could disagree about the mount, and a
  # fan-out whose parts disagree about the whole is the same defect as a skipped job rendering a
  # green tick. This job is also the only one that needs the base commits (`fetch-depth: 0`).
  plan:
    name: Plan the gate's shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      mount: ${{ steps.affected.outputs.mount }}
      run_all: ${{ steps.affected.outputs.run_all }}
      nothing-to-gate: ${{ steps.plan.outputs.nothing_to_gate }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The affected computation diffs against the PR base — it needs the base commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compute the affected module closure
        id: affected
        env:
          NARROWING: ${{ inputs.affected-narrowing }}
        # 🎯 PRs gate only the AFFECTED dependency closure — changed modules, plus every
        # transitive DEPENDENT, plus the affected set's own dependencies (the fresh gate mesh
        # needs them present to install and to resolve `shared=@…`).
        # 🚨 FAIL LOUD: `set -euo pipefail` — an errored computation fails the job; the script
        # itself refuses an empty diff, so a wrong empty set can never pass as "nothing to test".
        run: |
          set -euo pipefail
          if [ "$NARROWING" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/affected-modules.py \
              --range "origin/${{ github.base_ref }}...HEAD" --json > affected.json
          else
            echo "${{ github.event_name }} on ${{ github.ref_name }} — full run (narrowing applies only to PR diffs)"
            echo '{"mount": [], "runAll": true}' > affected.json
          fi
          {
            echo "mount=$(jq -r '.mount | join(" ")' affected.json)"
            echo "run_all=$(jq -r '.runAll' affected.json)"
          } >> "$GITHUB_OUTPUT"
      # 🚨 The matrix is `[]` for exactly ONE reason — a pull_request whose diff reaches no module
      # content — and that reason is recorded as its own output so the aggregate job can ASSERT the
      # pairing instead of reading a skipped `gate` job as "fine". GitHub refuses a matrix with no
      # vectors, so an empty selection has to express itself as "this job does not run"; what makes
      # that safe is `verify` running unconditionally and refusing a skipped gate that the plan did
      # not predict. Same shape, same reason, as node-repo-module-pack.yml's `pack`/`verify` pair.
      - name: Decide the shard matrix
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          MOUNT: ${{ steps.affected.outputs.mount }}
          RUN_ALL: ${{ steps.affected.outputs.run_all }}
        run: |
          set -euo pipefail
          case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a positive integer, got '$SHARDS'"; exit 1 ;;
          esac
          [ "$SHARDS" -ge 1 ] || { echo "::error::shards must be at least 1, got '$SHARDS'"; exit 1; }
          # 45 is the fleet-wide job ceiling in MINUTES, not a shard bound — but a caller asking for
          # more shards than any repo has packages is a typo, and an empty shard that looks like a
          # shard doing its share is the failure this lane exists to remove.
          [ "$SHARDS" -le 12 ] || { echo "::error::shards is $SHARDS — past ~4 the per-shard fixed cost dominates and the wall-clock curve flattens (see the input's own measurements), so this is a typo, not a plan."; exit 1; }
          if [ "$RUN_ALL" != "true" ] && [ -z "$MOUNT" ]; then
            echo "nothing_to_gate=true" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "shards=0" >> "$GITHUB_OUTPUT"
            echo "no module content affected (see the affected computation above) — nothing for the gate to test"
            exit 0
          fi
          echo "nothing_to_gate=false" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq 1 "$SHARDS" | jq -R . | jq -sc 'map(tonumber)')" >> "$GITHUB_OUTPUT"
          echo "fanning the gate out across $SHARDS shard(s)"

  # ─────────────────────────── 2. THE GATE, one job per shard ───────────────────────────
  gate:
    name: Gate shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    needs: plan
    # 🚨 A MODE SWITCH on the plan's own output, never a skip-trapdoor: an empty matrix cannot be
    # expressed any other way, and `verify` below runs unconditionally and refuses a skipped gate
    # the plan did not predict. `plan.result` is asserted by name too — a FAILED plan emits no
    # matrix at all, and `fromJson('')` would fail the matrix evaluation instead of letting
    # `verify` name the real cause.
    if: needs.plan.result == 'success' && needs.plan.outputs.nothing-to-gate != 'true'
    strategy:
      # 🚨 NEVER fail-fast. A cancelled sibling reports `cancelled`, which is the exact unreadable
      # verdict this whole fan-out exists to remove — and a sweep wants every shard's verdict in
      # one run, not the first one to break.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write     # azure/login OIDC for upstream-seed — granted BY the caller, as for publish-bake
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the image registry
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          # 🚨 Bounded retry, and deliberately NOT a skip-trapdoor: after the last attempt this
          # still fails RED, and a CREDENTIAL rejection fails IMMEDIATELY rather than being retried
          # three times — retrying a 401 only delays the same red while hiding which kind of
          # failure it was.
          #
          # Everything else IS retried, including failures this does not recognise. That is the
          # intended default rather than an oversight: an unclassified docker login failure is far
          # more often transient (daemon not ready, DNS, TLS reset) than permanent, and the one
          # class known to be permanent — bad credentials — is carved out above. A positive
          # allow-list of "connection-level" strings would fail fast on the next transient error
          # nobody predicted, which is the failure mode this exists to remove.
          #
          # Three ACR logins failed on 2026-08-28 in two separate incidents an hour apart
          # ("dial tcp 51.12.25.80:443: connect: connection refused", registry healthy throughout),
          # reddening three REQUIRED checks across two repos. On a strict:true repo the cost is not
          # one re-run: the re-run lands against a moved main, the branch goes BEHIND, and it needs
          # another sync and another full run — so one TCP reset re-stales every open PR (#2570).
          for attempt in 1 2 3; do
            if echo "${{ secrets.acr-password }}" \
                 | docker login "${TEST_IMAGE%%/*}" -u "${{ secrets.acr-username }}" \
                     --password-stdin 2>login.err; then
              rm -f login.err
              exit 0
            fi
            cat login.err
            if grep -qiE 'unauthorized|authentication required|denied|401' login.err; then
              echo "::error::ACR rejected the credentials for ${TEST_IMAGE%%/*} — that is not a"\
                   "transient failure, so it is not retried. Check the acr-username/acr-password secrets."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::docker login to ${TEST_IMAGE%%/*} failed after 3 connection-level attempts."
          exit 1
      # Cross-repo `requires` must resolve for the package roots to bind — the tester installs
      # whatever the mount holds, so the required modules are STAGED into it, exactly like
      # production resolves the requires from the store's package sources.
      # 🚨 Assert the staging inputs BEFORE minting, so a missing one fails RED naming what to
      # provision rather than surfacing as an opaque create-github-app-token or checkout error two
      # steps later (Copilot review, #2310). The `if:` is on the declared INPUT stage-modules —
      # i.e. whether staging was requested at all — never on whether a secret happens to be set,
      # which is the skip-trapdoor AGENTS.md forbids.
      - name: "Preflight: the stage-repo credentials must be provisioned"
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
          STAGE_APP_ID: ${{ secrets.stage-repo-app-id }}
          STAGE_APP_KEY: ${{ secrets.stage-repo-app-private-key }}
        run: |
          set -euo pipefail
          missing=()
          case "${STAGE_REPO:-}" in
            "")  missing+=("stage-repo (input) — owner/name of the repo modules are staged from") ;;
            */*) : ;;
            *)   missing+=("stage-repo (input) — must be owner/name, got '${STAGE_REPO}'") ;;
          esac
          [ -n "${STAGE_APP_ID:-}" ]  || missing+=("stage-repo-app-id (secret) — app id of a GitHub App able to read ${STAGE_REPO:-the stage repo}")
          [ -n "${STAGE_APP_KEY:-}" ] || missing+=("stage-repo-app-private-key (secret) — that App's private key, PEM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::stage-modules is set, so the cross-repo staging inputs are required:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            # 🚨 The store split that made every satellite dependabot PR red (#2249).
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::This run reads the DEPENDABOT secret store, not Actions — provision the pair there too (#2249)."
            fi
            exit 1
          fi
          echo "Staging ${STAGE_REPO} — credentials present."

      # 🚨 A PAT here was a permanent two-way failure. It rots — the platform's own copy went
      # HTTP 401 and a daily check never ran once (#1709) — and, because GitHub hands a
      # dependabot-triggered run the DEPENDABOT secret store rather than the Actions one, a PAT
      # provisioned for normal runs left every dependabot PR in every satellite permanently RED
      # (#2249). An installation token is minted here, per run, scoped to stage-repo alone.
      - name: Resolve the stage repo's owner and name
        id: stage-repo-parts
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
        run: |
          set -euo pipefail
          echo "owner=${STAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${STAGE_REPO##*/}"  >> "$GITHUB_OUTPUT"
      - name: Mint an installation token for the stage repo
        id: stage-token
        if: inputs.stage-modules != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.stage-repo-app-id }}
          private-key: ${{ secrets.stage-repo-app-private-key }}
          owner: ${{ steps.stage-repo-parts.outputs.owner }}
          repositories: ${{ steps.stage-repo-parts.outputs.name }}
          permission-contents: read
      # ─────────── Step 2 of the plugin build contract: INSTALL the upstreams ───────────
      # Fetch the caller's upstream publications — the sealed bundles baked for the EXACT framework
      # identity this gate's image resolves — into a seed directory the tester consumes. This is
      # what makes "install my dependencies" an install rather than a rebuild: the tester stands
      # its mesh up on the upstream's baked bytes and node definitions, and its Shortfall verdict
      # REFUSES a run that compiled what it was handed. See Doc/Architecture/PluginBuildContract.
      #
      # 🚨 Fails RED, never skips. A named upstream with no sealed publication for this identity
      # is not "nothing to seed" — it is a gate about to compile its dependency and pass, which
      # is indistinguishable from a gate that installed it (BakeSeed's own warning).
      - name: "Preflight: the upstream-seed credentials must be provisioned"
        if: inputs.upstream-seed != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.azure-client-id }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.azure-subscription-id }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          missing=()
          if [ -n "${REGISTRY_URL:-}" ]; then
            [ -n "${REGISTRY_KEY:-}" ] || missing+=("registry-key (secret) — registry-url is set, so the fetch is over HTTPS with an instance key")
          else
            [ -n "${AZURE_CLIENT_ID:-}" ]       || missing+=("azure-client-id (secret)")
            [ -n "${AZURE_TENANT_ID:-}" ]       || missing+=("azure-tenant-id (secret)")
            [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] || missing+=("azure-subscription-id (secret)")
            [ -n "${TARGETS:-}" ]               || missing+=("bake-publish-targets (input) — the storage target to read the upstream publication from")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::upstream-seed is set but missing: ${m}"; done
            echo "::error::upstream-seed cannot fetch a publication without these. This job fails RED rather than skipping the seed: a gate that silently compiled its upstream would look exactly like one that installed it."
            exit 1
          fi
      - name: Azure login (OIDC) for the upstream publication
        if: inputs.upstream-seed != '' && inputs.registry-url == ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      # ───────────── TWO IMAGES, ONE BUILD: resolve, pull, extract, compose (MeshWeaver#3022) ─────────────
      - name: Resolve the tester and the platform image
        id: images
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          PLATFORM_IMAGE: ${{ inputs.platform-image }}
          PLATFORM_DIGEST: ${{ inputs.platform-image-digest }}
          ALLOW_UNPINNED: ${{ inputs.allow-unpinned }}
        run: |
          set -euo pipefail
          # 🚨 The one wrong value GitHub cannot refuse for us: the tester passed as the platform,
          # which would silently restore the reference-set gap this input closes.
          case "$PLATFORM_IMAGE" in
            *mw-plugin-test*) echo "::error::platform-image names the TESTER image ('$PLATFORM_IMAGE') — pass the PORTAL image (meshweaver.azurecr.io/memex-portal-ai); the tester only executes."; exit 1 ;;
          esac
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            TESTER="${TEST_IMAGE%%:*}@${IMAGE_DIGEST}"
          elif [ "$ALLOW_UNPINNED" = "true" ]; then
            TESTER="$TEST_IMAGE"
            echo "gating with ${TEST_IMAGE} verbatim (allow-unpinned — runs are not reproducible)"
          else
            echo "::error::image-digest is empty and allow-unpinned is not set — pin a digest (reproducible) or opt in to following the tag."
            exit 1
          fi
          if [ -n "${PLATFORM_DIGEST:-}" ]; then
            PORTAL="${PLATFORM_IMAGE%%:*}@${PLATFORM_DIGEST}"
          elif [ "$ALLOW_UNPINNED" = "true" ]; then
            PORTAL="$PLATFORM_IMAGE"
            echo "gating against ${PLATFORM_IMAGE} verbatim (allow-unpinned)"
          else
            echo "::error::platform-image-digest is empty and allow-unpinned is not set — pin the portal digest from the same CD wave as image-digest, or opt in to following the tag. There is no fallback to the tester's /app (MeshWeaver#3022)."
            exit 1
          fi
          echo "tester=$TESTER" >> "$GITHUB_OUTPUT"
          echo "platform=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "tester: $TESTER"; echo "platform: $PORTAL"
      - name: Pull both images and extract their /app
        id: hosts
        env:
          TESTER_REF: ${{ steps.images.outputs.tester }}
          PORTAL_REF: ${{ steps.images.outputs.platform }}
        run: |
          set -euo pipefail
          docker pull -q "$TESTER_REF"
          docker pull -q "$PORTAL_REF"
          T="$RUNNER_TEMP/tester-app"; P="$RUNNER_TEMP/portal-app"
          rm -rf "$T" "$P"
          cid=$(docker create "$TESTER_REF"); docker cp -q "$cid:/app" "$T"; docker rm "$cid" >/dev/null
          cid=$(docker create "$PORTAL_REF"); docker cp -q "$cid:/app" "$P"; docker rm "$cid" >/dev/null
          [ -f "$T/mw-plugin-test.dll" ] || { echo "::error::$TESTER_REF ships no /app/mw-plugin-test.dll — test-image must be the mw-plugin-test image"; exit 1; }
          [ -s "$P/meshweaver-surface.manifest" ] || { echo "::error::$PORTAL_REF ships no /app/meshweaver-surface.manifest — platform-image must be the PORTAL image; a host without a manifest resolves the fallback identity no bake may be keyed to"; exit 1; }
          echo "tester_app=$T" >> "$GITHUB_OUTPUT"
          echo "portal_app=$P" >> "$GITHUB_OUTPUT"
          echo "tester /app: $(find "$T" -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ') assemblies; portal /app: $(find "$P" -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ') assemblies"
      # 🚨 ONE BUILD, asserted: the run's own bake is keyed to the PORTAL's identity and executed by
      # the TESTER's toolchain, which is honest only when the two images are one build. The tester's
      # `framework-identity` verb reads the portal's /app as files and compares — naming the canonical
      # assemblies each side lacks on a mismatch (#1814). The identity it prints is ALSO the address
      # an upstream seed must be sealed under (upstream-seed).
      - name: "Resolve the framework identity this gate runs as — the PORTAL's; the tester must resolve the same"
        id: identity
        env:
          TESTER_REF: ${{ steps.images.outputs.tester }}
          PORTAL_APP: ${{ steps.hosts.outputs.portal_app }}
        run: |
          set -euo pipefail
          line=$(docker run --rm --init --entrypoint /app/mw-plugin-test "$TESTER_REF" --print-framework-identity)
          tester="${line#*identity=}"; tester="${tester%% *}"
          [ -n "$tester" ] || { echo "::error::could not resolve the tester image's framework identity (got: '$line')"; exit 1; }
          if ! identity=$(docker run --rm --init -v "$PORTAL_APP:/portal:ro" --entrypoint /app/mw-plugin-test "$TESTER_REF" framework-identity /portal --expect "$tester"); then
            echo "::error::the tester image and the platform image do NOT resolve one framework identity — they are not one build (the verb's output above names the canonical assemblies each side lacks). Pin test-image/image-digest and platform-image/platform-image-digest from the SAME CD wave."
            exit 1
          fi
          identity=$(printf '%s' "$identity" | tail -1 | tr -d '[:space:]')
          [ -n "$identity" ] || { echo "::error::framework-identity printed no identity for the portal's /app"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "this gate runs as framework identity $identity (the portal's; the tester resolves the same); upstream bundles must be sealed under it"
      # The compose script, from the platform at platform-ref — same fetch shape as
      # compose-sealed-modules.sh below, for the same reason (job_workflow_sha is empty here).
      - name: Compose the gate host (the portal's /app + the tester CLI)
        id: host
        env:
          PORTAL_APP: ${{ steps.hosts.outputs.portal_app }}
          TESTER_APP: ${{ steps.hosts.outputs.tester_app }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCRIPT="${RUNNER_TEMP:-/tmp}/compose-gate-host.sh"
          [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — compose-gate-host.sh has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/compose-gate-host.sh?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$SCRIPT" \
            || { echo "::error::could not fetch compose-gate-host.sh at ${PLATFORM_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched compose-gate-host.sh at ${PLATFORM_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
          chmod +x "$SCRIPT"
          HOST="$RUNNER_TEMP/gate-host"
          "$SCRIPT" "$PORTAL_APP" "$TESTER_APP" "$HOST"
          echo "dir=$HOST" >> "$GITHUB_OUTPUT"
      - name: Fetch the upstream publications into the seed directory
        if: inputs.upstream-seed != ''
        id: seed
        env:
          UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          SEED_DIR="${RUNNER_TEMP:-/tmp}/upstream-seed"
          mkdir -p "$SEED_DIR"

          # 🚨 A 5xx is not an answer — it is the ABSENCE of one, and refusing on it makes every
          # platform promotion a source of red CI across the fleet (MeshWeaver#2787). Promotion
          # rolls the portal that SERVES this registry, so the window is STRUCTURAL: the more
          # reliably promotion works, the more often a dependent repo's gate lands inside it. One
          # day's three promotions opened it three times, and six repos read this endpoint.
          #
          # A DEFINITE answer still refuses immediately and unchanged — 404 (unsealed), 401/403
          # (no grant) are decisions the registry has already made, and waiting on one only
          # delays the message that names it. Same distinction, same reason, as MeshWeaver#2836
          # on the portal side: branch on what the server SAID, never on "the read failed".
          #
          # 🚨 This is a retry, NOT a skip-trapdoor. Exhausting the attempts returns the last
          # status to the caller, which still refuses RED — a registry that is genuinely down
          # fails the gate exactly as before, roughly three minutes later.
          #
          # 🚨 There is a SECOND copy of this function, in .github/scripts/compose-sealed-modules.sh
          # (same policy, `registry_key` spelled lower-case there). It is duplicated ON PURPOSE
          # rather than factored into a third file: that script is fetched from core at a pinned
          # `platform-ref` while this workflow is pinned by the caller's `uses:`, so a shared file
          # would be a THIRD independently-pinned artefact — the exact skew that once let an old
          # workflow drive a new script and seal an empty module set. Change one, change both.
          registry_get() { # <url> <out-file> → echoes the final HTTP status
            local url="$1" out="$2" code="" attempt=0
            local -r delays="15 30 60 90"
            while :; do
              code=$(curl -sS -o "$out" -w '%{http_code}' \
                       -H "Authorization: Bearer $REGISTRY_KEY" "$url") || code="000"
              case "$code" in
                # Transient: a roll window, a gateway blip, or a connection that never landed
                # (curl reports 000). Everything else is the registry's decision — return it.
                408|429|5??|000) ;;
                *) printf '%s' "$code"; return 0 ;;
              esac
              attempt=$((attempt+1))
              local delay
              delay=$(printf '%s\n' $delays | sed -n "${attempt}p")
              [ -n "$delay" ] || { printf '%s' "$code"; return 0; }
              echo "registry answered $code for $url — transient (a platform roll looks like this);" \
                   "re-asking in ${delay}s, attempt $((attempt+1))" >&2
              sleep "$delay"
            done
          }
          if [ -n "${REGISTRY_URL:-}" ]; then
            # The REGISTRY serves the sealed publication (MeshWeaver#2487) — HTTPS + instance key,
            # no Azure, works on pull_request. Fails RED on 404 (unsealed) or 401/403 (no grant).
            fetched=0
            for src in $UPSTREAMS; do
              base="${REGISTRY_URL%/}/api/plugins/bundles/prebuilt/$IDENTITY/$src"
              code=$(registry_get "$base" "$SEED_DIR/.index.json")
              case "$code" in
                200) ;;
                404) echo "::error::upstream '$src' has no SEALED publication on $REGISTRY_URL for identity $IDENTITY. Not compiling it instead."; exit 1 ;;
                401|403) echo "::error::the registry refused registry-key for '$src' ($code) — the instance needs a whole-source grant '$src/*'."; exit 1 ;;
                *) echo "::error::registry answered $code for $base — refusing."; exit 1 ;;
              esac
              # 🚨 200 is NOT proof of an index. The portal answers 200 + HTML (the app shell's
              # catch-all route) for ANY unknown path, /api/… included — so a registry that does not
              # serve /prebuilt yet answers this request with a web page. Measured 2026-08-27 on
              # SocialMedia#84 against a memex one build behind MeshWeaver#2487: jq's parse error
              # was swallowed, fetched stayed 0, and the step died as "sealed but empty" — the wrong
              # condition, pointing at the wrong fix. Only a JSON object with a `bundles` array is
              # a publication index; anything else is a registry that cannot serve this lane yet.
              if ! jq -e '.bundles | type == "array"' "$SEED_DIR/.index.json" >/dev/null 2>&1; then
                echo "::error::$base answered 200 but not a publication index (starts: $(head -c 60 "$SEED_DIR/.index.json" | tr -d '\n\r')…). The registry does not serve /api/plugins/bundles/prebuilt — it runs a build without MeshWeaver#2487. Refusing to guess; retry once the registry has rolled."
                exit 1
              fi
              for name in $(jq -r '.bundles[]' "$SEED_DIR/.index.json"); do
                bcode=$(registry_get "$base/$name" "$SEED_DIR/$name")
                [ "$bcode" = 200 ] || { echo "::error::could not fetch $name from $base — registry answered $bcode."; exit 1; }
                fetched=$((fetched+1))
              done
              rm -f "$SEED_DIR/.index.json"
              echo "upstream '$src': fetched from $REGISTRY_URL"
            done
            printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
            [ "$fetched" -gt 0 ] || { echo "::error::sealed but empty — refusing an empty seed"; exit 1; }
            echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The FIRST target is read — every target holds the same publication (publish-bake
          # writes them all-or-nothing), so one read is the set.
          target=$(printf '%s\n' $TARGETS | head -1)
          account="${target%%/*}"; rest="${target#*/}"
          share="${rest%%/*}"; base=""
          case "$rest" in */*) base="${rest#*/}" ;; esac
          fetched=0
          for src in $UPSTREAMS; do
            dir="${base:+$base/}prebuilt-bundles/$IDENTITY/$src"
            # EXISTENCE FIRST, fail CLOSED (the publish script's own rule): an unreadable answer
            # is not "absent", and absent is a red gate, not an empty seed.
            sealed=$(az storage file exists --account-name "$account" --share-name "$share" \
              --path "$dir/_complete" --auth-mode login --backup-intent --query exists -o tsv --only-show-errors 2>/dev/null || echo unknown)
            if [ "$sealed" != "true" ]; then
              echo "::error::upstream '$src' has no SEALED publication under $account/$share/$dir for framework identity $IDENTITY (exists=$sealed). This gate cannot install its dependency and will not compile it instead. The upstream's own publish-bake for this identity re-enables this run."
              exit 1
            fi
            az storage file download-batch --account-name "$account" --share-name "$share" \
              --source "$share/$dir" --destination "$SEED_DIR" --pattern '*.zip' \
              --auth-mode login --backup-intent --only-show-errors > /dev/null
            n=$(ls "$SEED_DIR"/*.zip 2>/dev/null | wc -l | tr -d ' ')
            echo "upstream '$src': $n bundle(s) from $account/$share/$dir"
            fetched=$((fetched + n))
          done
          # The tester keys a seed to this file; without it the seed is refused as unaddressable.
          printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
          [ "$fetched" -gt 0 ] || { echo "::error::upstream publications were sealed but held no bundles — refusing an empty seed"; exit 1; }
          echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
      - name: Stage cross-repo modules
        if: inputs.stage-modules != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.stage-repo }}
          token: ${{ steps.stage-token.outputs.token }}
          path: cross-repo-stage
          sparse-checkout: ${{ inputs.stage-modules }}
      - name: Download this run's module-bundle artifacts
        if: inputs.module-artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.module-artifacts }}
          path: ${{ runner.temp }}/ext-bundles
          merge-multiple: true
      # 🚨 EXTERNAL MODULES — the same composition node-repo-publish-bake.yml does, for the same
      # reason (#2276: the tester image ships no modules) and by the same recipe, so the GATE and
      # the BAKE cannot disagree about what a mesh contains.
      #
      # Without it the gate stands up a mesh missing whatever module the content binds, and the
      # failure is CONTENT-shaped with an INFRASTRUCTURE cause — `NodeType(s) not registered:
      # Skill` at install, or CS0246 at compile. Measured 2026-08-28 across every plugin repo at
      # once, while bumping their pins past #2276: 17 packages failed to install in one run.
      # Every failure below is RED and NAMED, because a gate that quietly ran without a module it
      # needed is worse than one that did not run at all.
      - name: "External modules: assemble what the gate must compose"
        if: inputs.module-artifacts != '' || inputs.registry-modules != ''
        env:
          REGISTRY_MODULES: ${{ inputs.registry-modules }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
          SEAL_UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXT="${RUNNER_TEMP:-/tmp}/ext-modules"; mkdir -p "$EXT"; chmod 777 "$EXT"
          BUNDLES="${RUNNER_TEMP:-/tmp}/ext-bundles"; mkdir -p "$BUNDLES"
          if [ -n "${REGISTRY_MODULES:-}" ]; then
            if [ -n "${SEAL_UPSTREAMS:-}" ]; then
              # 🚨 The publication is the unit of consistency (MeshWeaver#2698): module bytes come
              # from the SEALED upstream publication for this identity, never the registry's
              # package endpoint. No fallback — a missing seal or module set is RED in the script.
              # The compose script at inputs.platform-ref (default main; pin it beside the `uses:` sha for a
              # reproducible run). NOT github.job_workflow_sha: it is empty inside a reusable called from
              # another repository, so a fetch keyed on it silently read main while claiming a pin.
              SCRIPT="${RUNNER_TEMP:-/tmp}/compose-sealed-modules.sh"
              [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the compose script has no ref to be fetched at"; exit 1; }
              gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/compose-sealed-modules.sh?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$SCRIPT" \
                || { echo "::error::could not fetch compose-sealed-modules.sh at ${PLATFORM_REF} from Systemorph/MeshWeaver"; exit 1; }
              head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched compose-sealed-modules.sh at ${PLATFORM_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
              chmod +x "$SCRIPT"
              if [ -n "${REGISTRY_URL:-}" ]; then
                "$SCRIPT" --identity "$IDENTITY" --packages "$REGISTRY_MODULES" --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" \
                  --registry-url "$REGISTRY_URL" --registry-key "$REGISTRY_KEY"
              else
                "$SCRIPT" --identity "$IDENTITY" --packages "$REGISTRY_MODULES" --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" \
                  --storage-target "$(printf '%s\n' $TARGETS | head -1)"
              fi
            else
              echo "::notice::composing registry-modules ($REGISTRY_MODULES) from the REGISTRY's package endpoint: this repo declares no upstream seed, so there is no sealed publication to take module bytes from. These bytes are whatever the module's own lane published last — a bake-consumption decline against a publication that composed different ones is expected, and is the reason to declare the upstream (upstream-seed / upstream-sources) instead."
            for pkg in ${REGISTRY_MODULES:-}; do
              idx=$(curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" "$REGISTRY_URL/api/plugins/bundles/index.json") \
                || { echo "::error::registry index unreadable at $REGISTRY_URL (registry-modules: $pkg)"; exit 1; }
              ver=$(jq -r --arg p "$pkg" '(.bundles // .Bundles // [])[] | select(((.plugin // .Plugin)|ascii_downcase)==($p|ascii_downcase)) | (.version // .Version)' <<<"$idx" | head -1)
              [ -n "$ver" ] || { echo "::error::the registry at $REGISTRY_URL does not advertise package '$pkg' to this instance key — check the key's grants, and that the upstream wave has published the bundle."; exit 1; }
              curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" -o "$BUNDLES/$pkg.bundle.zip" "$REGISTRY_URL/api/plugins/bundles/$pkg/$ver" \
                || { echo "::error::download failed for $pkg@$ver from $REGISTRY_URL"; exit 1; }
              echo "fetched $pkg@$ver from $REGISTRY_URL"
            done
            fi
          fi
          shopt -s nullglob
          MODULE_ARGS=""
          for b in "$BUNDLES"/*.nupkg "$BUNDLES"/*.zip; do
            u="${RUNNER_TEMP:-/tmp}/unpack-$(basename "$b")"; rm -rf "$u"; mkdir -p "$u"
            unzip -o -q "$b" -d "$u"
            name=""
            [ -f "$u/meshweaver/manifest.json" ] && name=$(jq -r '.module.assemblyName // empty' "$u/meshweaver/manifest.json")
            if [ -z "$name" ]; then
              set -- "$u"/meshweaver/modules/*.dll
              { [ $# -eq 1 ] && [ -f "$1" ]; } || { echo "::error::$(basename "$b"): cannot identify the module's entry assembly (no manifest module.assemblyName; meshweaver/modules/ holds $# dll(s))"; exit 1; }
              name=$(basename "$1" .dll)
            fi
            test -f "$u/meshweaver/modules/$name.dll" || { echo "::error::$(basename "$b"): meshweaver/modules/$name.dll is missing from the bundle"; exit 1; }
            mkdir -p "$EXT/$name"
            cp -R "$u"/meshweaver/modules/. "$EXT/$name/"
            MODULE_ARGS="$MODULE_ARGS --module /ext/$name/$name.dll"
            echo "external module composed: $name ($(basename "$b"))"
          done
          [ -n "$MODULE_ARGS" ] || { echo "::error::external modules were requested but none were assembled — the artifact pattern matched nothing and no registry bundle was fetched."; exit 1; }
          echo "EXT_MODULES_DIR=$EXT" >> "$GITHUB_ENV"
          echo "EXT_MODULE_ARGS=$MODULE_ARGS" >> "$GITHUB_ENV"
      - name: Import + compile + render + run tests for each node repo
        id: gate
        env:
          PLATFORM_REF: ${{ steps.images.outputs.platform }}
          HOST_DIR: ${{ steps.host.outputs.dir }}
          TARGET_IDENTITY: ${{ steps.identity.outputs.identity }}
          STAGE_MODULES: ${{ inputs.stage-modules }}
          ALLOW_FILE: ${{ inputs.allow-file }}
          AFFECTED_MOUNT: ${{ needs.plan.outputs.mount }}
          AFFECTED_RUN_ALL: ${{ needs.plan.outputs.run_all }}
          # `<index>/<total>`, or empty for the unsharded lane — see the `shards` input.
          SHARD: ${{ needs.plan.outputs.shards != '1' && format('{0}/{1}', matrix.shard, needs.plan.outputs.shards) || '' }}
          # Empty unless upstream-seed fetched a publication — then the tester consumes it.
          SEED_DIR: ${{ steps.seed.outputs.dir }}
        # Allow entries whose module is not mounted on a narrowed run are "unverifiable" —
        # warned, never failed — so narrowing cannot trip the ratchet. On a narrowed run the
        # affected closure is STAGED into its own tree and mounted as /repo — the tester gates
        # every package it discovers, so the mount IS the filter.
        run: |
          set -euo pipefail
          if [ "$AFFECTED_RUN_ALL" = "true" ]; then
            REPO_MOUNT="$GITHUB_WORKSPACE"
            ALLOW_PATH="${ALLOW_FILE:+/repo/$ALLOW_FILE}"
            echo "full run: gating every module"
          elif [ -z "$AFFECTED_MOUNT" ]; then
            # 🚨 Unreachable by construction: `plan` turns an empty narrowed mount into an EMPTY
            # MATRIX, so this job does not exist on such a run. Getting here means the plan and the
            # gate disagree about what this run gates — which is exactly the fan-out failure the
            # aggregate job exists to catch, so it is RED here rather than a quiet `exit 0` that
            # would render as a shard doing its share.
            echo "::error::this shard was scheduled with an EMPTY affected mount. The plan job decides that case (nothing-to-gate ⇒ empty matrix), so a shard reaching it means the two disagree — refusing to report a gate that gated nothing."
            exit 1
          else
            REPO_MOUNT="${RUNNER_TEMP:-/tmp}/gate-stage"
            mkdir "$REPO_MOUNT"
            for m in $AFFECTED_MOUNT; do cp -R "$GITHUB_WORKSPACE/$m" "$REPO_MOUNT/"; done
            ALLOW_PATH=""
            if [ -n "${ALLOW_FILE:-}" ]; then
              cp "$GITHUB_WORKSPACE/$ALLOW_FILE" "$REPO_MOUNT/"
              ALLOW_PATH="/repo/$(basename "$ALLOW_FILE")"
            fi
            echo "narrowed run: gating $AFFECTED_MOUNT"
          fi
          # Staged modules join the mount so every package's requires resolve. On the full-run
          # path the workspace IS the mount — cross-repo-stage/ itself has no root index.json,
          # so the tester never treats it as a module; only the copied module dirs count.
          for m in ${STAGE_MODULES:-}; do
            cp -R "$GITHUB_WORKSPACE/cross-repo-stage/$m" "$REPO_MOUNT/"
          done
          # The images were resolved, pulled and composed above (steps.images / hosts / identity /
          # host): both runs below start the PORTAL image's `dotnet` on the composed host.
          ALLOW_ARGS=()
          [ -n "${ALLOW_PATH:-}" ] && ALLOW_ARGS=(--allow "$ALLOW_PATH")
          DUMP_ARGS=()
          if [ "${{ inputs.capture-coredumps }}" = "true" ]; then
            mkdir -p "${RUNNER_TEMP:-/tmp}/coredumps"
            chmod 0777 "${RUNNER_TEMP:-/tmp}/coredumps"
            DUMP_ARGS=(-v "${RUNNER_TEMP:-/tmp}/coredumps:/coredumps"
              --cap-add=SYS_PTRACE
              -e DOTNET_DbgEnableMiniDump=1
              -e DOTNET_DbgMiniDumpType=2
              -e DOTNET_DbgMiniDumpName=/coredumps/%e-%p.dmp)
          fi
          # 🚨 `--init` is not cosmetic: without it the tester is the container's PID 1, and a
          # PID-namespace init with SIG_DFL for SIGABRT is SIGNAL_UNKILLABLE — the kernel DISCARDS
          # the signal the .NET runtime raises to end a crashed process. `abort()` then falls
          # through to its trap instruction, the runtime's SIGTRAP handler returns to the very
          # instruction that trapped, and the process SPINS at 100% CPU forever instead of exiting
          # (#1741: two such containers "Up" 36 and 57 minutes each, having printed one exception
          # in their first second). On CI that reads as a hang and burns the job's whole timeout
          # rather than reporting the crash. With `--init` the tool runs as PID 2 under tini and a
          # crash exits 134 immediately. The tester itself no longer lets an exception escape
          # `Main`, but this covers what a `catch` cannot — a stack overflow, an OOM abort, an
          # unhandled throw on a background thread.
          # Step 2 of the plugin build contract: hand the tester the upstream seed, mounted
          # read-only. The tester checks it BEFORE the mesh boots (BakeSeed.Read — a seed it
          # cannot consume is a usage error, exit 2, never a green gate) and REFUSES a run that
          # compiled a type the seed declared (BakeSeedConsumer.Shortfall). That mount happens on
          # the GATE call below, not here: `compile` takes no --seed, and the gate is given
          # $OWN_BAKE — into which the upstream zips are copied — as /seed.
          # (SEED_ARGS/SEED_MOUNT arrays used to be built at this point and passed to neither
          # docker run. shellcheck's SC2034 on them is what surfaced the leftover.)
          # ── BUILD ONCE, TEST WHAT WAS BUILT (Doc/Architecture/PluginBuildContract, step 3 → 4).
          # The gate used to compile in-mesh and DISCARD the result; publish-bake then compiled the
          # identical source again on merge. Now: `compile` (mesh-free, the producer) writes this
          # repo's OWN bundles to /bake; the gate stands its mesh up on THOSE bytes (`--seed`), so
          # what is tested is what would ship; and the bake is uploaded as `bake-<sha>` so the
          # merge's publish-bake can REUSE it (bake-run-id) instead of compiling a third time.
          # The upstream seed (if any) is a SEPARATE mount: consumed, never re-emitted.
          OWN_BAKE="${RUNNER_TEMP:-/tmp}/own-bake"; mkdir -p "$OWN_BAKE"; chmod 777 "$OWN_BAKE"
          # 🚨 The seed rides the GATE call only. `compile` is the mesh-free bake of THIS repo's
          # own types and its parser deliberately takes no --seed ("Unknown argument '--seed'",
          # exit 2 — measured 2026-08-27 on the first run that ever got past the registry auth,
          # Reinsurance run 33091175986; the flag on the compile line had never been exercised).
          # The gate below stands the mesh up on the repo's own bundles PLUS the upstream seed —
          # that is where consuming a bake means something.
          EXT_V=()
          [ -n "${EXT_MODULES_DIR:-}" ] && EXT_V=(-v "$EXT_MODULES_DIR:/ext")
          # 🚨 AGAINST THE PORTAL, executed by the tester (MeshWeaver#3022): the portal image's own
          # `dotnet` on the composed host (/host = the portal's /app + the tester CLI), as the
          # runner's uid (HOME=/tmp keeps runtime probes off read-only image paths). `--app /app
          # --shared-frameworks /usr/share/dotnet/shared` makes the reference set the portal's /app
          # plus its IMPLEMENTATION frameworks — what the portal's runtime compile sees — and keys
          # the bake to the portal's identity. Same shape as node-repo-publish-bake.yml, on purpose:
          # the gate and the bake must not disagree about what a portal contains.
          # shellcheck disable=SC2086  # EXT_MODULE_ARGS is a flag list; word-splitting is the point
          docker run --rm --init --user "$(id -u):$(id -g)" -e HOME=/tmp "${EXT_V[@]}" \
            -v "$HOST_DIR:/host:ro" -v "$REPO_MOUNT:/repo" -v "$OWN_BAKE:/bake" "${DUMP_ARGS[@]}" \
            --entrypoint dotnet "$PLATFORM_REF" /host/mw-plugin-test.dll compile /repo \
            --app /app --shared-frameworks /usr/share/dotnet/shared \
            "${ALLOW_ARGS[@]}" ${EXT_MODULE_ARGS:-} \
            --output /bake --source-sha "$GITHUB_SHA"
          [ -s "$OWN_BAKE/framework-mvid.txt" ] || { echo "::error::compile ran but wrote no bake identity — the bake stage regressed (or the image predates the compile verb; pin ≥ 77bc5f1)"; exit 1; }
          baked="$(tr -d '[:space:]' < "$OWN_BAKE/framework-mvid.txt")"
          [ "$baked" = "$TARGET_IDENTITY" ] || { echo "::error::the run's own bake is keyed to '$baked' but the portal's /app resolves '$TARGET_IDENTITY' — the compile did not run against the platform host (is --app /app on the compile line?)"; exit 1; }
          # Gate on the bake: own bundles AND the upstream seed together in one seed directory.
          if [ -n "${SEED_DIR:-}" ]; then cp "$SEED_DIR"/*.zip "$OWN_BAKE"/ 2>/dev/null || true; fi
          # shellcheck disable=SC2086
          # The tester's stdout is ALSO the gate log a caller's own ratchets read (MeshWeaver.Manufacturing's
          # Tests-area ratchet, `check-test-suites.py --gate-log`). A reusable workflow cannot hand a
          # file back through outputs, so it is uploaded as an artifact below. `pipefail` keeps the
          # TESTER's exit code — tee's success never masks a red gate.
          GATE_LOG="${RUNNER_TEMP:-/tmp}/gate.log"
          # 🚨 Exported BEFORE the tester runs: under `set -e` a red gate would exit this script before
          # a later export, and the always() upload would then skip on an empty GATE_LOG — the log
          # missing exactly when a caller's ratchet needs the `GATE FAILED` line. The tester's exit
          # code is carried past `tee` explicitly and re-raised after, so a red gate is still red.
          echo "GATE_LOG=$GATE_LOG" >> "$GITHUB_ENV"
          # 🚨 THE SLICE. Empty for `shards: 1`, which is byte-for-byte the pre-fan-out command line —
          # so a caller that does not opt in cannot be affected by this at all, and an image that
          # predates the flag keeps working for them. When it IS set, the flag is asserted BY NAME
          # against the pinned image FIRST: without this the run dies on `Unknown argument '--shard'`
          # (exit 2) with a message that names the tester's argv rather than the pin that is behind.
          SHARD_ARGS=()
          if [ -n "${SHARD:-}" ]; then
            if ! docker run --rm --init -v "$HOST_DIR:/host:ro" \
                 --entrypoint dotnet "$PLATFORM_REF" /host/mw-plugin-test.dll --help 2>&1 | grep -q -- '--shard'; then
              echo "::error::this lane was called with shards>1 but the PINNED tester image does not accept --shard, so it cannot gate a slice. Bump image-digest/platform-image-digest to a CD wave carrying it (both pins move together, from one wave), or set shards: 1."
              exit 1
            fi
            SHARD_ARGS=(--shard "$SHARD")
            echo "this job gates shard $SHARD"
          fi
          # `--app /app`: the gate must RUN AS the portal host (it resolves the portal's identity),
          # refused before a mesh boots otherwise — a gate running as another host would decline
          # every bundle and compile the tree itself, passing without judging the bytes that ship.
          set +e
          docker run --rm --init --user "$(id -u):$(id -g)" -e HOME=/tmp "${EXT_V[@]}" \
            -v "$HOST_DIR:/host:ro" -v "$REPO_MOUNT:/repo" -v "$OWN_BAKE:/seed:ro" "${DUMP_ARGS[@]}" \
            --entrypoint dotnet "$PLATFORM_REF" /host/mw-plugin-test.dll /repo --app /app \
            "${ALLOW_ARGS[@]}" ${EXT_MODULE_ARGS:-} "${SHARD_ARGS[@]}" --seed /seed | tee "$GATE_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::the gate exited $rc — the verdict is above and in this shard's gate-log artifact"
            exit "$rc"
          fi
          echo "OWN_BAKE=$OWN_BAKE" >> "$GITHUB_ENV"
          echo "bake identity: $(cat "$OWN_BAKE/framework-mvid.txt") — $(ls "$OWN_BAKE"/*.zip | wc -l | tr -d ' ') bundle(s), gated on their own bytes"
      # 🚨 The dump is written by the CONTAINER, which runs as root, so the file lands owned by
      # root with a restrictive mode — a core dump can contain anything that was in memory, so the
      # runtime writes it 0600 on purpose. `chmod 0777` on the mount DIRECTORY (above) lets the
      # container create the file; it does nothing for the file's own permissions. So
      # upload-artifact, which runs as the unprivileged `runner` user, failed with
      #
      #     Error: EACCES: permission denied, open '.../coredumps/mw-plugin-test-7.dmp'
      #
      # and the job then died in zip creation. Every crash produced exactly the evidence needed to
      # diagnose it and then threw it away — which is why MeshWeaver.Reinsurance#98 stayed
      # "different NodeTypes park on different runs" for weeks instead of being read as the SIGSEGV
      # (exit 139) it actually is.
      #
      # `if: always()` because the only runs with a dump are the ones where the gate FAILED.
      # The bake this gate produced — publish-bake reuses it on merge (bake-run-id) so the same
      # source is never compiled twice. Short retention: it is an intermediate, not a publication.
      # 🚨 always(), and RED if the log is missing while the gate ran: a caller's ratchet that finds no
      # artifact must fail on "no log", never pass on "nothing to check" — the same rule the gate
      # itself applies to a truncated log. Named per commit so a merge-group ref cannot pick up a
      # sibling run's log.
      # 🚨 PER SHARD. Two artifacts of one name cannot coexist in a run, and the CANONICAL names —
      # `gate-log-<sha>` and `bake-<sha>`, which is what a caller's ratchet and publish-bake know —
      # are re-emitted by the aggregate job below from the folded evidence. With `shards: 1` there is
      # exactly one of each here and the fold is a copy, so the contract is identical either way.
      - name: Upload this shard's gate log (the tester's stdout)
        if: always() && env.GATE_LOG != ''
        uses: actions/upload-artifact@v7
        with:
          name: gate-log-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ env.GATE_LOG }}
          retention-days: 3
          if-no-files-found: error
      - name: Upload this shard's bake for publish-bake to reuse
        if: always() && env.OWN_BAKE != ''
        uses: actions/upload-artifact@v7
        with:
          name: bake-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ env.OWN_BAKE }}
          retention-days: 3
          if-no-files-found: error
      - name: Make core dumps readable by the uploader
        if: always() && inputs.capture-coredumps
        shell: bash
        run: |
          dir="${RUNNER_TEMP:-/tmp}/coredumps"
          [ -d "$dir" ] || exit 0
          # Not `|| true`: if a dump exists and cannot be made readable, say so here rather than
          # letting the upload fail three steps later with a message about zip creation.
          sudo chown -R "$(id -u):$(id -g)" "$dir"
          sudo chmod -R u+rw "$dir"
          ls -l "$dir" || true

      - name: Upload core dumps (if the gate crashed)
        if: always() && inputs.capture-coredumps
        uses: actions/upload-artifact@v7
        with:
          name: gate-coredumps-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coredumps
          if-no-files-found: ignore
          retention-days: 15

  # ─────────────── 3. THE ONE STABLE CONTEXT — this is what a repo's protection requires ───────────────
  # 🚨 THE NAME IS THE CONTRACT. `test-repos / Compile + render node repos (MeshWeaver from ACR)` is
  # required on three satellites today; it must keep meaning "the whole gate ran and was green",
  # whatever the shard count. So the aggregate carries the name, and the per-shard contexts
  # (`Gate shard i/n`) deliberately do NOT — they appear and disappear with the `shards` input, and
  # a repo that required one would wait forever the day the number changed. Same invariant, same
  # reason, as `All selected bundles built` in node-repo-module-pack.yml.
  #
  # 🚨 IT FOLDS RECEIPTS, it does not re-derive a verdict. Every shard prints, before it installs
  # anything, which slice of which discovered total it gates; the fold refuses a run whose slices are
  # not a DISJOINT COVER of that total. That is what makes a fan-out safe to require: "shard 3 never
  # ran" and "shard 3 passed" are otherwise the same green wall, and GitHub paints a skipped matrix
  # leg exactly like a passed one.
  verify:
    name: Compile + render node repos (MeshWeaver from ACR)
    needs: [plan, gate]
    # always(): a red or CANCELLED shard must still be folded and NAMED here, never leave this
    # context skipped — a skipped required check reads as satisfied (ReadingCiSignals).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gate-log-artifact: ${{ steps.fold.outputs.artifact }}
    steps:
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 The plan is the ONLY thing that may say "there was nothing to gate", and it says so as a
      # named output rather than by producing no evidence. Anything else — a failed plan, a skipped
      # gate the plan did not predict, a gate that did not succeed — is RED here, with the cause
      # named. A `uses:` job cannot carry steps, so this is where the caller's "a failed need must
      # not SILENCE this gate" guard lives for the lane's own internals.
      - name: The fan-out must have happened, or the plan must have said why not
        id: expect
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          NOTHING_TO_GATE: ${{ needs.plan.outputs.nothing-to-gate }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the gate's plan job reported '$PLAN_RESULT', so nothing decided what this run gates and no shard can be trusted. Read that job."
            exit 1
          fi
          if [ "$NOTHING_TO_GATE" = "true" ]; then
            if [ "$GATE_RESULT" != "skipped" ]; then
              echo "::error::the plan said there was no module content to gate, but the gate job reported '$GATE_RESULT'. The two disagree; refusing to answer."
              exit 1
            fi
            echo "fold=false" >> "$GITHUB_OUTPUT"
            echo "this run's diff reaches no module content — the plan said so, and the gate correctly did not run. No gate log to hand back."
            exit 0
          fi
          if [ "$GATE_RESULT" != "success" ]; then
            echo "::error::the gate fan-out reported '$GATE_RESULT' across its $SHARDS shard(s) — at least one shard failed, was cancelled, or never ran. Its verdict is in that shard's own job log and its gate-log artifact."
            # Not an early exit: the fold below still runs and NAMES which shard, which is the
            # difference between "the gate is red" and a red nobody can attribute.
          fi
          echo "fold=true" >> "$GITHUB_OUTPUT"
      # A pattern that matches nothing must REACH the folder as zero evidence — it is the folder's
      # job to say which shard is missing — so this download does not fail the job. (The legitimate
      # `continue-on-error`: losing it would replace a NAMED missing-shard verdict with an unnamed
      # download error. The gate's INPUTS are asserted by the caller's preflight and by the plan.)
      - name: Collect every shard's gate log
        if: steps.expect.outputs.fold == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: gate-log-${{ github.sha }}-shard-*
          path: ${{ runner.temp }}/shard-logs
      # 🚨 The fold's own verdict is DEFERRED, not swallowed: the merged log is uploaded first, then
      # re-raised by the explicit fail step at the bottom. Same reason the shard job exports
      # GATE_LOG before running the tester — the evidence a caller's ratchet needs must survive the
      # failure it describes. `rc` is carried in an output, so a fold that refused cannot reach the
      # end of this job green.
      - name: Fold the shards into ONE gate log
        id: fold
        if: steps.expect.outputs.fold == 'true'
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          set -uo pipefail
          python3 meshweaver/.github/scripts/gate-shard-merge.py \
            --logs "$RUNNER_TEMP/shard-logs" \
            --shards "$SHARDS" \
            --gate-result "$GATE_RESULT" \
            --out "$RUNNER_TEMP/gate.log"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The artifact name is published only when there IS a folded log to download — an empty
          # `gate-log-artifact` is a caller's signal that no gate ran, and it must never point at a
          # file that does not exist.
          if [ -s "$RUNNER_TEMP/gate.log" ]; then
            echo "artifact=gate-log-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the fold produced no gate.log at all — the merge script died before writing one."
            exit 1
          fi
      # The canonical name a caller's ratchet downloads. One log, one summary, one verdict —
      # whatever the shard count.
      - name: Upload the folded gate log for the caller's own ratchets
        if: always() && steps.fold.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: gate-log-${{ github.sha }}
          path: ${{ runner.temp }}/gate.log
          retention-days: 3
          if-no-files-found: error
      # The bake, likewise re-emitted under its canonical name. Every shard bakes the whole mount
      # (`compile` takes no --shard — it is 70 s and its output is what the gate then consumes), so
      # merge-multiple overwrites identical bundles and the union is the complete bake either way.
      - name: Collect every shard's bake
        if: steps.expect.outputs.fold == 'true' && needs.gate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: bake-${{ github.sha }}-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/bake
      - name: Upload the merged bake for publish-bake to reuse
        if: steps.expect.outputs.fold == 'true' && needs.gate.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bake-${{ github.sha }}
          path: ${{ runner.temp }}/bake
          retention-days: 3
          if-no-files-found: error
      # 🚨 LAST, and unconditional on the fan-out's result: the fold above NAMES which shard broke,
      # and this is what makes that naming a RED rather than a note. Placed after the uploads so a
      # red gate still hands its evidence to the caller's ratchet — the same reason the shard job
      # exports GATE_LOG before running the tester.
      # 🚨 THE EXPLICIT FAIL STEP. `always()` on this job means a red need does not fail it on its
      # own, so the two ways this context must go red are asserted BY NAME, after the evidence has
      # been handed over: a shard that did not succeed, and a fold that refused the cover.
      - name: A shard that did not succeed, or a fold that refused, fails this context
        if: always() && needs.plan.outputs.nothing-to-gate != 'true'
        run: |
          set -euo pipefail
          failed=0
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::the gate fan-out reported '${{ needs.gate.result }}'. See the fold above for which shard and why."
            failed=1
          fi
          if [ "${{ steps.fold.outputs.rc }}" != "0" ]; then
            echo "::error::the shard fold refused this run (exit '${{ steps.fold.outputs.rc }}') — the shards' slices did not add up to the discovered package set. The annotations above name which. A fan-out whose parts disagree about the whole must never report green."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "every shard succeeded and the fold accounted for every discovered package."
