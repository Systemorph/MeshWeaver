name: Node repo gate (reusable)

# ♻️ REUSABLE (workflow_call) — the heavy tester gate every MeshWeaver.* content repo runs
# (unified per #1707): install each package into a real MeshWeaver mesh (in-process,
# SQLite/filesystem persistence) and assert code packages compile live, render, AND that each
# type's `Tests` layout area runs green — tests are EXECUTED, not just compiled; a red test
# fails the PR. The tester ships in the mw-plugin-test image, and a shard gets its bytes ONE of
# two ways — off the runner node's platform volume (the default on the self-hosted sets, no Docker
# at all) or by pulling the image (GitHub-hosted runners). See "Where the heavy legs run" below.
# Neither is a `container:` job (see MeshWeaver.Plugins ci.yml history).
#
# NO input-shaped `if:` anywhere in here, deliberately (AGENTS.md: a gate never tests its own
# inputs). The caller's `preflight` job asserts the image/registry inputs red-fail-naming-them,
# the fork exemption lives there too, and this gate runs unconditionally behind
# `needs: [preflight, ...]`.
#
# Caller contract:
#
#   test-repos:
#     needs: [validate, preflight]
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-gate.yml@<40-char platform commit sha>
#
# 🚨 THE REQUIRED CONTEXT IS THE AGGREGATE, and the caller's job name is half of it. This lane is a
# FAN-OUT since #2543's tax was measured: `plan` decides the shard matrix, `gate` runs one job per
# shard, and `verify` — named `Compile + render node repos (MeshWeaver from ACR)`, unchanged — folds
# the shards' evidence and is the ONE stable context. A repo requires
# `<caller job> / Compile + render node repos (MeshWeaver from ACR)` and nothing else from this
# lane: the per-shard contexts (`<caller job> / Gate shard i/n`) appear and disappear with the
# `shards` input, so requiring one would wait forever the day the number changed. Same invariant as
# `All selected bundles built` in node-repo-module-pack.yml, for the same reason.
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".
#     with:
#       test-image: ${{ vars.MW_TEST_IMAGE }}
#       image-digest: ${{ vars.MW_IMAGE_DIGEST }}          # or EMPTY: the lane resolves the newest sealed set
#       platform-image: meshweaver.azurecr.io/memex-portal-ai        # the PORTAL — the reference set (#3022)
#       platform-image-digest: ${{ vars.MW_PORTAL_IMAGE_DIGEST }}    # same CD wave as image-digest; or EMPTY
#       stage-repo: Systemorph/MeshWeaver.Plugins
#
# ──────── THE LANE RESOLVES THE PLATFORM ITSELF when both digests are EMPTY (2026-09-12) ────────
# Maintainer rule, 2026-09-12, verbatim: "for compile always find latest package of platform and
# plugins." Every satellite resolves the newest PLATFORM-SEALED core set at run time
# (MeshWeaver#3842) and re-resolves it in the first step of every NORMAL job, so a "re-run failed
# jobs" tests the newest packages (Education#320 / #323, Reinsurance#202, Crm#94, Manufacturing#82,
# SocialMedia#181, Plugins#1739). What a satellite CANNOT refresh is THIS lane: a `uses:` job takes
# `image-digest` / `platform-image-digest` as `with:` inputs evaluated when it is CALLED, from the
# caller's stored `platform-ref` outputs, and GitHub offers no hook inside a reusable workflow for
# the caller to re-resolve. Measured on Education#320 (run 34685497637): the 09:22Z resolution was
# re-used at 12:5xZ although two newer sets had sealed with the fix.
#
# So when a caller passes BOTH digests EMPTY (and does not set allow-unpinned), `plan` resolves the
# platform ITSELF with core's `.github/scripts/resolve-platform.py` — fetched at `scripts-ref` like
# compose-gate-host.sh — by the same rule as the satellites: the newest core `main-cd.yml` run on
# `main` whose `Promote: tag the full set`, `Verify every image shipped` and `Bake platform content
# in the shipped image + publish` all succeeded, images present in ACR by the version or identity
# tag; the Plugins publication found on its own (the newest run whose `Plugins: bake + seal …`
# succeeded, possibly an OLDER run) and reported beside it; the caller's repository VARIABLE
# `MW_PLATFORM_REF` honoured as a freeze (`vars` in a reusable workflow resolve from the CALLER's
# repository — GitHub docs, Variables reference: "For reusable workflows, the variables from the
# caller workflow's repository are used"). The chosen set and the plugins publication are printed
# in the log, the `::notice` and the step summary, and the digests flow to every shard through
# `needs.plan.outputs`. Each shard then runs the resolver ONCE MORE with `plan`'s outputs as its
# `PLATFORM_BASELINE`: a NEWER sealed set is taken (`override=true`, said in a `::notice`), the
# same or an older one keeps the baseline verbatim, and a failed re-resolution keeps the baseline
# with a `::warning` — so a "re-run failed jobs" of ONE red shard tests the newest set, which is
# the whole point of the rule.
#
# 🔒 NON-EMPTY DIGESTS KEEP TODAY'S BEHAVIOUR BYTE-FOR-BYTE — a caller that pins still pins, the
# resolver never runs, and `allow-unpinned` still means "follow the tags verbatim". One empty
# digest beside a non-empty one is RED by name (a half-pin would compose two CD waves). The
# resolver needs the caller's `acr-username` / `acr-password` (it proves the set's images are in
# the registry before it names them) and the caller's `GITHUB_TOKEN` (core is public). Budget:
# one resolution ≈ 5-12 GitHub calls, plus one per shard for the freshness check, plus one
# `contents` read per job for the script — see the script's own header.
#       stage-modules: Store
#       shards: 4        # opt-in fan-out; 1 (the default) is the unsharded lane, unchanged
#
# 🚨 TWO IMAGES, TWO ROLES (MeshWeaver#3022, the module lane's shape since #2907): the TESTER image
# EXECUTES the compile and the gate; the PLATFORM image (the portal) SUPPLIES the reference set,
# the framework identity and the runtime the gate's mesh runs on. Both run from a COMPOSED HOST —
# the portal's /app with the tester CLI beside it (compose-gate-host.sh) — started by the portal
# image's own `dotnet`. The tester's /app is a strict subset of the portal's (88 vs 219 assemblies
# on 3.0.0-rc9.ci.7534), so a gate compiling against the tester's /app reports every NodeType
# that binds a portal-only assembly (the Blazor and hosting halves; on ci.7534 also MeshWeaver.Maps
# and .AI, both modules since) as a CONTENT error.
#     secrets:
#       acr-username: ${{ secrets.ACR_USERNAME }}
#       acr-password: ${{ secrets.ACR_PASSWORD }}
#       stage-repo-app-id: ${{ secrets.MESHWEAVER_APP_ID }}
#       stage-repo-app-private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
#
# ──────── Where the heavy legs run (2026-09-12, evening — MeshWeaver#4113) ────────
# A gate shard needs three things: the TESTER's /app (the CLI), the PORTAL's /app (the reference
# set, the framework identity, the modules), and a .NET runtime to start the composed host with.
# Until #4113 all three arrived as CONTAINERS — `docker login`, two `docker pull`s of 279 MB +
# 833 MB, `docker cp` of both /app trees, then four `docker run`s — which is why this lane needed
# a Docker daemon and why `aks-silos-dind` (a PRIVILEGED dind sidecar) existed for it at all.
#
# The runner NODES now carry the platform already. Systemorph/Memex#321 (applied 2026-09-12 15:00Z)
# mounts one read-only Azure Files share at **`/opt/platform`** in every runner pod of BOTH ARC
# scale sets, and a CronJob (`ci-platform-refresh`) keeps the 3 newest SEALED sets on it:
#
#     /opt/platform/current                     the newest set's TESTER digest — a FILE, read ONCE
#     /opt/platform/sha256-<hex>/app/           the tester image's /app
#     /opt/platform/sha256-<hex>/platform-refs/ the PORTAL image's /app
#     /opt/platform/sha256-<hex>/platform.json  set, core sha, BOTH image digests, installed-at
#     /opt/platform/sha256-<hex>/.complete      the digest, written LAST — no .complete, no set
#
# So this lane has TWO MODES, and `.github/scripts/resolve-gate-platform.sh` decides which by
# MEASURING whether that mount exists — never by reading a label or an input:
#
#   * **volume** — `/opt/platform` is there (every self-hosted ARC runner pod). The shard reads
#     `app/` and `platform-refs/` off the share, composes the gate host into $RUNNER_TEMP, and runs
#     the tester **as a process** on a .NET installed by `actions/setup-dotnet` under
#     `DOTNET_INSTALL_DIR=/home/runner/.dotnet`. No daemon, no registry credential, no pull.
#   * **container** — `/opt/platform` is absent (a GitHub-hosted `ubuntu-latest` runner: `/opt` is
#     EMPTY in ghcr.io/actions/actions-runner and the GitHub image has no such mount). The shard
#     takes the pre-#4113 path verbatim: login, pull both, `docker cp`, four `docker run`s. A
#     caller that passes nothing is on `ubuntu-latest` and therefore in this mode, unchanged.
#
# 🚨 THERE IS NO FALLBACK BETWEEN THE MODES. Once the mount is present, a set that is missing,
# half-written or paired with another portal is RED and NAMES `ci-platform-refresh`; it never
# degrades into `docker pull`. A silent fallback would turn "the refresh job has been dead for a
# day" into "the gate is a bit slower today". The mode taken is printed, and both failure paths
# name their own fix: a runner with NEITHER the volume NOR a daemon is red naming both.
#
# WHAT THE VOLUME SUPPLIES, AND WHAT IT DOES NOT — measured 2026-09-12 against the images of set
# 3.0.0-ci.8417 (tester sha256:60b2dec8…, portal sha256:bd27c33f…) and
# ghcr.io/actions/actions-runner:2.337.0:
#
#   * tester /app: 433 MB, 358 files, 89 assemblies (27 `MeshWeaver.*`) — ON THE VOLUME.
#   * portal /app: 544 MB, 1,521 files, 216 assemblies (45 `MeshWeaver.*`), its
#     `meshweaver-surface.manifest`, its `modules/`, its `wwwroot/` and its NATIVE libraries
#     (`libSkiaSharp.so`, `libHarfBuzzSharp.so`, `libe_sqlite3.so`, which live INSIDE /app) — ON
#     THE VOLUME.
#   * Native OS dependencies: both images are Ubuntu 24.04 with `libicuuc.so.74.2`,
#     `libssl.so.3`, `libcrypto.so.3`. The ARC runner image is **Ubuntu 24.04.4 with the same
#     three** — so the globalization and TLS surface is identical and nothing has to be carried.
#   * Portal-only extras the tester never touches: `chromium`, `/opt/ms-playwright`, `git`
#     (the runner has git anyway). Grepped: the tester references neither Playwright nor chromium.
#   * 🚨 **The .NET host is the ONE thing the volume does not carry.** In a container the tester is
#     started by the PORTAL image's own `dotnet` — `/usr/share/dotnet`, 114 MB, host fxr 10.0.12
#     with `shared/Microsoft.NETCore.App/10.0.12` AND `shared/Microsoft.AspNetCore.App/10.0.12` —
#     and that directory is also what `--shared-frameworks` names. In volume mode it comes from
#     `setup-dotnet` instead, and the step below ASSERTS that the runner's install carries every
#     framework the portal's own runtimeconfig declares, at the portal's major.minor, printing
#     both sides' versions on every run. The residual is patch-level: the implementation
#     assemblies in the reference set are the runner's 10.0.x rather than the portal's 10.0.12
#     (servicing policy freezes the public API within a band, so a compile cannot see it). Closing
#     it exactly is a Memex change, not a lane change — `ci-platform-refresh.py` would extract the
#     portal image's `/usr/share/dotnet` into `<set>/dotnet/` (+114 MB per set, ~12% of a set) and
#     this lane would prefer it. Tracked with Memex#316/#321.
#
# THE RUNNER SET, and what each label buys:
#
#   * `aks-silos` — the plain, NON-privileged ARC scale set. **Now accepted**, and the point of
#     #4113: with the volume there is nothing left for a daemon to do in this lane.
#   * `aks-silos-dind` — still works (it mounts the same volume, so it takes the same volume mode);
#     its privileged sidecar is simply unused here. It remains the label for the lanes that
#     genuinely build or push images (`publish-bake`, `compile-check`, module-pack's `prepare`).
#   * `ubuntu-latest` — the default, GitHub-hosted, container mode, byte-identical to before.
#
#   The runner container is `ghcr.io/actions/actions-runner:2.337.0`: NON-ROOT (`runner`, uid 1001,
#   passwordless sudo), no .NET, no Node, NO `gh`, NO `az`. What it has that this job uses: bash,
#   git, curl, jq, python3, unzip, tar, sha256sum, awk, sudo. The `/opt/platform` mount is
#   `uid=0,gid=0,dir_mode=0755,file_mode=0644` and read-only: uid 1001 reads everything, writes
#   nothing. Both fetches of a lane script `curl` the contents API (the image has no `gh`), and the
#   `az storage` read of an upstream seed — taken only when `upstream-seed` is set and
#   `registry-url` is NOT — asserts `az` by name in its preflight rather than dying on a missing
#   binary three commands later.
#
#   Job-level `DOTNET_INSTALL_DIR: /home/runner/.dotnet` whenever `runner` is not `ubuntu-latest`:
#   the runner is non-root and setup-dotnet cannot write /usr/share/dotnet there. EMPTY on
#   ubuntu-latest, which setup-dotnet reads as unset, so the default path is untouched.
#
#   `plan` and `verify` stay on `ubuntu-latest` whatever the input says: seconds of orchestration,
#   no platform, and `verify` is the required context.
#
# A caller opts in PER REPOSITORY behind a repository variable — its OWN, never the module-pack
# lane's `vars.MW_RUNNER_HEAVY`, so one job family moves at a time and the move is one edit to
# revert:
#
#     with:
#       runner: ${{ vars.MW_RUNNER_GATE || 'ubuntu-latest' }}
#
# Unset, the variable resolves to `ubuntu-latest` and this lane behaves byte-for-byte as before
# this input existed. Doc: Doc/Architecture/ModuleBuildArchitecture ("The pipeline, end to end",
# the 2026-09-12 notes).

on:
  workflow_call:
    outputs:
      gate-log-artifact:
        description: >-
          The name of the artifact holding the tester's stdout (gate-log-<sha>) — EMPTY when the gate
          ran nothing (a PR whose diff reaches no module content). A caller's own ratchet keys on
          this: present ⇒ download and read it, and fail on a missing or truncated log; empty ⇒
          there was no gate run to ratchet, which the gate's own log states.

          🚨 UNCHANGED BY SHARDING, deliberately. With `shards: N` the tester's stdout arrives as N
          per-shard logs; the aggregate job FOLDS them into one `gate.log` carrying a single
          `=== mw-plugin-test summary ===` block and one terminal verdict, and uploads it under
          this same name. A caller's ratchet keeps reading one log. (Concatenating the shard logs
          instead would be a FALSE PASS: MeshWeaver.Plugins' `check-test-suites.py` reads the LAST
          summary in the file, so a concatenation would ratchet 1/N of the NodeTypes and report a
          clean sweep.)
        value: ${{ jobs.verify.outputs.gate-log-artifact }}
      nothing-to-gate:
        description: >-
          `true` when this run had NOTHING to gate — a pull request whose diff reaches no module
          content, under `affected-narrowing` (which is ON by default). The plan then emits an empty
          matrix, every shard is SKIPPED, and no gate log is produced.

          🚨 This is the OTHER HALF of `gate-log-artifact`, and without it that output is
          undecidable. Its own description tells a caller "empty ⇒ there was no gate run to
          ratchet" — but an empty artifact has two causes, and only one of them is benign: nothing
          to gate, or a gate that was meant to run and did not. A caller's ratchet keying on
          emptiness alone must therefore either accept both (a skipped gate renders as a pass — the
          skip-trapdoor AGENTS.md forbids) or reject both (every content-free pull request reds).
          MeshWeaver.SocialMedia#161 is the second, measured: its ratchet reds every pull request
          whose diff touches no module content.

          Pair them: accept an empty artifact ONLY when this is `true`, and stay red otherwise.
          The distinction was always computed here (`plan.outputs.nothing-to-gate`, which this
          workflow already guards its own aggregate on) and simply never reachable from a caller —
          a job output is not a `workflow_call` output.
        value: ${{ jobs.plan.outputs.nothing-to-gate }}
      platform-set:
        description: >-
          The promoted set the gate ran against (`3.0.0-ci.<n>`), when the lane RESOLVED the
          platform itself (both digest inputs empty — see the header); EMPTY when the caller
          pinned the digests, because then the caller already knows. A shard that took a NEWER set
          on a re-run says so in its own log and summary; this is `plan`'s baseline.
        value: ${{ jobs.plan.outputs.platform-set }}
    inputs:
      test-image:
        description: The mw-plugin-test image reference (the caller's vars.MW_TEST_IMAGE).
        required: true
        type: string
      image-digest:
        description: >-
          Digest pin (tag@digest — reproducible; an image regression lands on the commit that
          bumps the pin, and a pin that lags the platform by days is a gate reporting on a
          framework nobody runs, so bump it routinely). EMPTY, together with an empty
          platform-image-digest and no allow-unpinned, means THE LANE RESOLVES THE PLATFORM
          ITSELF: the newest platform-sealed core set, images present in ACR, the caller's
          `MW_PLATFORM_REF` variable honoured as a freeze (see the header). A non-empty value is
          taken verbatim and the resolver never runs. Empty beside a non-empty
          platform-image-digest is RED by name.
        required: false
        type: string
        default: ''
      allow-unpinned:
        description: >-
          Explicitly accept an empty image-digest / platform-image-digest and gate against the
          tags verbatim — a run that is not reproducible and does NOT resolve a sealed set. With
          both digests empty and this flag unset the lane resolves the newest sealed set instead
          (the header). Never a silent fallback either way.
        required: false
        type: boolean
        default: false
      platform-image:
        description: >-
          The PORTAL image the gate compiles against and RUNS AS, e.g.
          meshweaver.azurecr.io/memex-portal-ai — REQUIRED (MeshWeaver#3022). The tester image
          executes; this image supplies the reference set (its /app + implementation shared
          frameworks), the framework identity the run's own bake is keyed to, and the runtime the
          gate's mesh runs on. The same input, same meaning, as node-repo-publish-bake.yml's and
          node-repo-module-pack.yml's. No default, no fallback to the tester's /app.
        required: true
        type: string
      platform-image-digest:
        description: >-
          Digest pin for platform-image (tag@digest), resolved as image-digest is: the pin, else
          the tag under allow-unpinned, else — both digests empty — the newest platform-sealed set
          the lane resolves itself (the header). Pin both digests from ONE CD wave — the lane
          asserts the two images resolve ONE framework identity and refuses a mixed pair by name.
        required: false
        type: string
        default: ''
      stage-repo:
        description: Repository to stage cross-repo modules from. Empty = no staging.
        required: false
        type: string
        default: ''
      stage-modules:
        description: >-
          Module directories to sparse-checkout from stage-repo and copy into the gate mount
          (newline-separated for several) so the caller's packages' `requires` resolve. Without
          them the package roots land on the unresolvable-NodeType error overlay — an
          arrangement production never runs (MeshWeaver#1701).
        required: false
        type: string
        default: ''
      allow-file:
        description: >-
          Known-debt ratchet file passed as --allow (repo-relative; one-way — a NEW
          non-allowlisted failure fails the PR, a fixed allowlisted type must be removed).
          Empty = none.
        required: false
        type: string
        default: 'plugin-gate.allow'
      affected-narrowing:
        description: >-
          On pull_request diffs, gate only the affected module closure computed by the caller's
          scripts/affected-modules.py (mirrors the runtime's edge semantics; full-run fallbacks
          are built into the script's classification). Main pushes / dispatches never narrow.
          Set false for a repo without that script — every event then gates the full set.
        required: false
        type: boolean
        default: true
      upstream-seed:
        description: >-
          Consume the caller's UPSTREAMS as pre-built bundles instead of staging their source:
          a whitespace-separated list of bake-source segments (e.g. `plugins`), each fetched from
          the portals' storage under `prebuilt-bundles/<framework-identity>/<source>/` — the
          SEALED publication for the exact identity this gate's image resolves — and handed to
          the tester as `--seed`. The tester then stands its mesh up on those bytes and REFUSES a
          run that could not adopt them (`BakeSeedConsumer.Shortfall`), so a green gate here
          means the dependency was installed, not recompiled.

          This is step 2 of the plugin build contract (Doc/Architecture/PluginBuildContract):
          "install my dependencies" — as artifacts, served by MeshWeaver. Requires the
          publication to carry NODE DEFINITIONS (core #2478), and the caller to grant
          `id-token: write` and pass the three azure-* secrets, exactly as for publish-bake.
          Empty = no upstream is consumed (today's behaviour, where stage-repo copies SOURCE).
          Fails RED — never skips — when a named upstream has no sealed publication for this
          identity: a gate that silently compiled its upstream is indistinguishable from one
          that installed it.
        required: false
        type: string
        default: ''
      registry-url:
        description: >-
          The registry that SERVES sealed publications (MeshWeaver#2487), e.g.
          https://memex.meshweaver.cloud. With registry-key set, upstream-seed fetches over
          HTTPS with an instance key and never touches Azure — and it works on pull_request.
        required: false
        type: string
        default: ''
      bake-publish-targets:
        description: >-
          Where upstream-seed READS the upstream publication from — the same
          <account>/<share>[/<base-path>] value the caller's publish-bake WRITES to
          (vars.BAKE_PUBLISH_TARGETS). The first target is read; publish-bake writes every
          target all-or-nothing, so one is the set. Required when upstream-seed is set.
        required: false
        type: string
        default: ''
      module-artifacts:
        description: >-
          Artifact-name pattern (actions/download-artifact `pattern`) of module bundles UPLOADED
          BY THIS RUN (each a *.module.nupkg) whose module DLLs the gate must compose with
          `--module`. The mirror of the same input on node-repo-publish-bake.yml, and it exists
          for the same reason: since MeshWeaver#2276 the tester image ships NO modules.
        required: false
        type: string
        default: ''
      registry-modules:
        description: >-
          Package ids (whitespace-separated, e.g. `AI`) whose module bundle to fetch from
          registry-url and compose into the gate with `--module` — for a repo that consumes a
          package's types but does not build its module. Requires registry-url + registry-key.

          🚨 A repo whose content declares `Skill` or `Agent` nodes needs `AI` here. Those are
          ENGINE NodeTypes served by MeshWeaver.AI, so without the module they are unregistered
          and every such package fails at INSTALL with `NodeType(s) not registered: Skill` —
          a CONTENT-shaped error with an INFRASTRUCTURE cause.
        required: false
        type: string
        default: ''
      platform-ref:
        description: >-
          The Systemorph/MeshWeaver ref that names the PLATFORM this gate runs against; also the ref
          this lane's own .github/scripts are fetched at when `scripts-ref` (below) is empty.
          Default main; pin it to the same sha as the `uses:` line for a reproducible run.
          (`github.job_workflow_sha` is EMPTY inside a reusable called from another repo — measured
          2026-08-30 — so the script's ref is an input, never inferred.)
        required: false
        type: string
        default: main
      scripts-ref:
        description: >-
          The Systemorph/MeshWeaver ref this lane's OWN helper scripts are fetched at (the guards,
          compose scripts and mergers under .github/scripts that the lane itself runs). Distinct from
          `platform-ref`, which names the PLATFORM the caller builds against (compile references,
          images, core source). Empty (the default) means "the same as platform-ref" — right for a
          caller that pins the lane and the platform to one commit. A caller that pins NOTHING
          (MeshWeaver#3842: the platform resolved at run time to the newest SEALED set, the lane
          called at `@main`) passes `main` here, because a sealed set is hours behind the lane's own
          tip: on 2026-09-09 this lane at @main fetched check-abbreviated-shas.py — added at 17:06Z
          (022ab4a9d) — at a platform-ref cut at 3cda3efde a few hours earlier, and the fetch 404'd
          (Plugins#1566). `github.job_workflow_sha` cannot stand in for this: it is EMPTY inside a
          reusable called from another repository (measured 2026-08-30), so the lane's own ref is an
          input, never inferred.
        required: false
        type: string
        default: ''
      shards:
        description: >-
          How many runners to fan the gate out across. 1 (the default) is exactly the pre-fan-out
          behaviour: one job, one container, every discovered package gated in it.

          🚨 WHY THE FAN-OUT EXISTS — and why raising the cap was refused. The single job performs
          ~60 SERIAL package installs, each paying the `portal/nodeops` tax of MeshWeaver#2543.
          Measured on MeshWeaver.Plugins across 28 consecutive gate jobs (2026-09-03, 12:32-16:29Z),
          classified by reading each job's duration AND its verdict rather than its colour: 20 of
          them gated the full set, and their durations were 17.9-30.4 minutes against a
          `timeout-minutes: 30`. FOUR were CUT AT THE CAP (30.3-30.4 min, the gate the only
          cancelled job in an otherwise complete run) and three more returned real content verdicts
          at 28.1 / 29.4 / 29.7 — i.e. 35% of full-set runs came within two minutes of the cap.

          A cap cut reports as `cancelled`, indistinguishable from a real cancellation, so the
          gate's verdict was unreadable exactly when it took longest — and a caller's own ratchet
          skips on `cancelled` too, so the Tests-area evidence went with it. Raising the cap does
          not fix that: the fleet-wide ceiling is 45 minutes, so it buys 15 against a moving tail
          and a 45-minute cut still reports `cancelled`.

          🚨 A `failure` on this gate is NOT evidence of a cap cut. Three of the four longest reds
          in that sample were content verdicts (`GATE FAILED — install: Hosting`), and attributing
          them to the cap would inflate the "before" and overstate what sharding buys. Read the
          duration and the verdict text.

          Each shard is its own `docker run --rm`, so shards share no mesh, no nodeops hub and no
          runner — the `portal/nodeops` saturation behind the long tail (MeshWeaver#2543) does not
          follow them. A shard gates its slice and INSTALLS that slice's dependency closure
          (GateShardPlan); every package is gated exactly once across the fan-out.

          🚨 IT COSTS RUNNER MINUTES, so it is opt-in per caller rather than a default. Modelled on
          the same measurements for MeshWeaver.Plugins' 59 packages: 1 shard 21.9 min wall / 21.9
          runner-min; 3 shards 11.1 / 31.6; 4 shards 10.8 / 35.5. Past 4 the per-shard fixed cost
          (image pull, /app extract, the compile pass) dominates and the curve flattens.

          🚨 THE PINNED IMAGE MUST UNDERSTAND `--shard`. A tester image that predates it exits 2 on
          the unknown argument; the shard job asserts the flag by name BEFORE it gates, so the
          failure names the pin rather than the content.
        required: false
        type: number
        default: 1
      capture-coredumps:
        description: >-
          Run the tester with minidump-on-crash enabled and upload any dumps as a run artifact
          — for a repo whose gate has crashed in ways a log cannot explain.
        required: false
        type: boolean
        default: false
      runner:
        description: >-
          The `runs-on` label for the gate SHARDS (`gate`) and nothing else — `plan` and `verify`
          stay on `ubuntu-latest`. `ubuntu-latest` (the default) is exactly today's behaviour: no
          platform volume, so the shard pulls both images and runs the tester in a container.

          `aks-silos` is the Systemorph org's PLAIN self-hosted scale set — no Docker daemon, no
          privileged sidecar — and since MeshWeaver#4113 it is the right label for this lane: its
          runner pods mount the CI platform share read-only at `/opt/platform`, so the shard takes
          the tester's and the portal's `/app` off the node and runs the tester as a PROCESS.
          `aks-silos-dind` also works and takes the same volume path; its daemon is simply unused
          here, so prefer `aks-silos` and leave dind to the lanes that build images.

          The shard does not infer any of this from the label: it MEASURES whether `/opt/platform`
          is mounted, prints which mode it took, and fails RED naming `ci-platform-refresh` when
          the volume is there but the pinned set is not — never falling back to a registry pull.
          A runner with neither the volume nor a Docker daemon is red naming both. See "Where the
          heavy legs run" in the header.

          Wire it from a repository variable of its own (`vars.MW_RUNNER_GATE`, falling back to
          `ubuntu-latest` when unset — the header shows the expression) so the move is one edit to
          revert.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      acr-username:
        description: Registry user able to pull the test image.
        required: true
      acr-password:
        description: Registry password for that user.
        required: true
      # The same OIDC identity publish-bake uses, read-only here: the gate FETCHES the caller's
      # upstream publication to seed from. Required only when upstream-seed is set; the preflight
      # below fails RED naming whichever is missing rather than letting the step skip.
      registry-key:
        description: An instance key (mwi_…) holding a whole-source grant on each upstream (upstream-seed via registry-url).
        required: false
      azure-client-id:
        description: Client id of the Azure identity that can read the portals' storage (upstream-seed only).
        required: false
      azure-tenant-id:
        description: Tenant of that identity (upstream-seed only).
        required: false
      azure-subscription-id:
        description: Subscription of that identity (upstream-seed only).
        required: false
      stage-repo-app-id:
        description: >
          App id of a GitHub App installed on stage-repo's org with Contents: Read (needed only
          when stage-modules is set). Replaces the former stage-repo-token PAT: an installation
          token is minted per run and scoped to stage-repo alone, so it cannot rot the way a
          stored PAT does — and, unlike a PAT, it resolves for dependabot-triggered runs once
          provisioned in the caller's Dependabot secret store as well (#2249).
        required: false
      stage-repo-app-private-key:
        description: Private key (PEM) of that App.
        required: false

jobs:
  # ─────────────────────────── 1. WHAT THIS RUN GATES, computed ONCE ───────────────────────────
  # The affected closure used to be recomputed inside the one gate job. With a fan-out it has to be
  # decided in ONE place: N shards that each ran the diff could disagree about the mount, and a
  # fan-out whose parts disagree about the whole is the same defect as a skipped job rendering a
  # green tick. This job is also the only one that needs the base commits (`fetch-depth: 0`).
  plan:
    name: Plan the gate's shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      mount: ${{ steps.affected.outputs.mount }}
      run_all: ${{ steps.affected.outputs.run_all }}
      nothing-to-gate: ${{ steps.plan.outputs.nothing_to_gate }}
      # The platform every shard gates against: the caller's pins verbatim, or — both empty — the
      # set `plan` resolved itself (the header). `resolved` says which; the shards refresh only
      # a resolved baseline, never a caller's pin. `baseline` is the resolver's whole output row
      # (JSON), handed to each shard as its PLATFORM_BASELINE.
      resolved: ${{ steps.digests.outputs.resolved }}
      image-digest: ${{ steps.digests.outputs.image-digest }}
      platform-image-digest: ${{ steps.digests.outputs.platform-image-digest }}
      platform-set: ${{ steps.digests.outputs.platform-set }}
      baseline: ${{ steps.digests.outputs.baseline }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The affected computation diffs against the PR base — it needs the base commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compute the affected module closure
        id: affected
        env:
          NARROWING: ${{ inputs.affected-narrowing }}
        # 🎯 PRs gate only the AFFECTED dependency closure — changed modules, plus every
        # transitive DEPENDENT, plus the affected set's own dependencies (the fresh gate mesh
        # needs them present to install and to resolve `shared=@…`).
        # 🚨 FAIL LOUD: `set -euo pipefail` — an errored computation fails the job; the script
        # itself refuses an empty diff, so a wrong empty set can never pass as "nothing to test".
        run: |
          set -euo pipefail
          if [ "$NARROWING" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/affected-modules.py \
              --range "origin/${{ github.base_ref }}...HEAD" --json > affected.json
          else
            echo "${{ github.event_name }} on ${{ github.ref_name }} — full run (narrowing applies only to PR diffs)"
            echo '{"mount": [], "runAll": true}' > affected.json
          fi
          {
            echo "mount=$(jq -r '.mount | join(" ")' affected.json)"
            echo "run_all=$(jq -r '.runAll' affected.json)"
          } >> "$GITHUB_OUTPUT"
      # 🚨 The matrix is `[]` for exactly ONE reason — a pull_request whose diff reaches no module
      # content — and that reason is recorded as its own output so the aggregate job can ASSERT the
      # pairing instead of reading a skipped `gate` job as "fine". GitHub refuses a matrix with no
      # vectors, so an empty selection has to express itself as "this job does not run"; what makes
      # that safe is `verify` running unconditionally and refusing a skipped gate that the plan did
      # not predict. Same shape, same reason, as node-repo-module-pack.yml's `pack`/`verify` pair.
      - name: Decide the shard matrix
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          MOUNT: ${{ steps.affected.outputs.mount }}
          RUN_ALL: ${{ steps.affected.outputs.run_all }}
        run: |
          set -euo pipefail
          case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a positive integer, got '$SHARDS'"; exit 1 ;;
          esac
          [ "$SHARDS" -ge 1 ] || { echo "::error::shards must be at least 1, got '$SHARDS'"; exit 1; }
          # 45 is the fleet-wide job ceiling in MINUTES, not a shard bound — but a caller asking for
          # more shards than any repo has packages is a typo, and an empty shard that looks like a
          # shard doing its share is the failure this lane exists to remove.
          [ "$SHARDS" -le 12 ] || { echo "::error::shards is $SHARDS — past ~4 the per-shard fixed cost dominates and the wall-clock curve flattens (see the input's own measurements), so this is a typo, not a plan."; exit 1; }
          if [ "$RUN_ALL" != "true" ] && [ -z "$MOUNT" ]; then
            echo "nothing_to_gate=true" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "shards=0" >> "$GITHUB_OUTPUT"
            echo "no module content affected (see the affected computation above) — nothing for the gate to test"
            exit 0
          fi
          echo "nothing_to_gate=false" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq 1 "$SHARDS" | jq -R . | jq -sc 'map(tonumber)')" >> "$GITHUB_OUTPUT"
          echo "fanning the gate out across $SHARDS shard(s)"
      # ───────────── THE PLATFORM: the caller's pins verbatim, or resolved HERE (the header) ─────────────
      # Not an input-shaped `if:` — the step runs whenever there is something to gate and branches
      # INSIDE on the inputs, so a caller's pin is echoed back byte-for-byte and an empty pair is
      # resolved, out loud. Gated on the plan's OWN verdict only (as the `gate` job is): a run with
      # nothing to gate resolves nothing, and says so through an empty `platform-set`.
      - name: "The platform: the caller's pins, or the newest sealed set resolved here"
        id: digests
        if: steps.plan.outputs.nothing_to_gate != 'true'
        env:
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          PLATFORM_DIGEST: ${{ inputs.platform-image-digest }}
          ALLOW_UNPINNED: ${{ inputs.allow-unpinned }}
          TEST_IMAGE: ${{ inputs.test-image }}
          PLATFORM_IMAGE: ${{ inputs.platform-image }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
          # The CALLER's repository variable (GitHub docs, Variables reference: "For reusable
          # workflows, the variables from the caller workflow's repository are used") — the same
          # freeze the caller's own jobs honour, so one variable binds the whole run. Empty in the
          # normal state; the ONE value read from `vars` here, because a freeze is an incident
          # instruction that must not be overridable by a caller that forgot to pass it on.
          FREEZE: ${{ vars.MW_PLATFORM_REF }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_DIGEST:-}" ] && [ -n "${PLATFORM_DIGEST:-}" ]; then
            {
              echo "resolved=false"
              echo "image-digest=${IMAGE_DIGEST}"
              echo "platform-image-digest=${PLATFORM_DIGEST}"
              echo "platform-set="
              echo "baseline="
            } >> "$GITHUB_OUTPUT"
            echo "platform: the caller's pins — tester ${IMAGE_DIGEST}, portal ${PLATFORM_DIGEST} — taken verbatim; nothing resolved"
            exit 0
          fi
          if [ -n "${IMAGE_DIGEST:-}" ] || [ -n "${PLATFORM_DIGEST:-}" ]; then
            echo "::error::one digest is pinned and the other is empty (image-digest='${IMAGE_DIGEST:-}', platform-image-digest='${PLATFORM_DIGEST:-}') — a half-pin would compose two CD waves. Pin BOTH from one wave, or leave BOTH empty and the lane resolves the newest sealed set itself."
            exit 1
          fi
          if [ "$ALLOW_UNPINNED" = "true" ]; then
            {
              echo "resolved=false"
              echo "image-digest="
              echo "platform-image-digest="
              echo "platform-set="
              echo "baseline="
            } >> "$GITHUB_OUTPUT"
            echo "platform: allow-unpinned — the tags are followed verbatim downstream; no sealed set is resolved"
            exit 0
          fi
          # Both empty, no opt-out: RESOLVE. The registry credential is asserted by name (the
          # resolver proves the set's images are in ACR before it names them) — never skipped over.
          [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::image-digest and platform-image-digest are both empty, so this lane resolves the newest sealed platform set itself — and that needs acr-username + acr-password (secrets) to prove the set's images are in the registry. Pass them, or pin both digests."; exit 1; }
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — resolve-platform.py has no ref to be fetched at"; exit 1; }
          SCRIPT="${RUNNER_TEMP:-/tmp}/resolve-platform.py"
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/resolve-platform.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$SCRIPT" \
            || { echo "::error::could not fetch resolve-platform.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched resolve-platform.py at ${SCRIPTS_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
          python3 "$SCRIPT" --self-test
          # The resolver writes its rows to GITHUB_OUTPUT under ITS names (`portal-image-digest`);
          # they are captured and re-keyed to this lane's, and the whole row travels to the shards
          # as their baseline (JSON, one line).
          ROWS="${RUNNER_TEMP:-/tmp}/platform-rows.txt"; : > "$ROWS"
          echo "platform: no pin from the caller — resolving the newest platform-sealed set (freeze: '${FREEZE:-none}')"
          GITHUB_OUTPUT="$ROWS" python3 "$SCRIPT" --tester-image "$TEST_IMAGE" --portal-image "$PLATFORM_IMAGE" ${FREEZE:+--freeze "$FREEZE"}
          python3 - "$ROWS" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          rows = dict(line.rstrip("\n").split("=", 1) for line in open(sys.argv[1], encoding="utf-8") if "=" in line)
          for key in ("image-digest", "portal-image-digest", "set", "run-number"):
              if not rows.get(key):
                  raise SystemExit(f"::error::the resolver wrote no `{key}` — refusing to hand the shards an incomplete platform")
          print("resolved=true")
          print(f"image-digest={rows['image-digest']}")
          print(f"platform-image-digest={rows['portal-image-digest']}")
          print(f"platform-set={rows['set']}")
          print("baseline=" + json.dumps(rows, separators=(",", ":")))
          PY
          echo "platform: resolved $(grep '^set=' "$ROWS" | cut -d= -f2-) (core $(grep '^sha=' "$ROWS" | cut -d= -f2- | cut -c1-9)); plugins publication: $(grep '^plugins-set=' "$ROWS" | cut -d= -f2-)"

  # ─────────────────────────── 2. THE GATE, one job per shard ───────────────────────────
  gate:
    name: Gate shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    needs: plan
    # 🚨 A MODE SWITCH on the plan's own output, never a skip-trapdoor: an empty matrix cannot be
    # expressed any other way, and `verify` below runs unconditionally and refuses a skipped gate
    # the plan did not predict. `plan.result` is asserted by name too — a FAILED plan emits no
    # matrix at all, and `fromJson('')` would fail the matrix evaluation instead of letting
    # `verify` name the real cause.
    if: needs.plan.result == 'success' && needs.plan.outputs.nothing-to-gate != 'true'
    strategy:
      # 🚨 NEVER fail-fast. A cancelled sibling reports `cancelled`, which is the exact unreadable
      # verdict this whole fan-out exists to remove — and a sweep wants every shard's verdict in
      # one run, not the first one to break.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    # `runner` — THE job that honours it; see "`runner` — honoured by the gate shards" in the header.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      # The self-hosted runner is non-root: setup-dotnet cannot write /usr/share/dotnet there.
      # EMPTY on ubuntu-latest, which setup-dotnet reads as unset — the default path is unchanged.
      # No step here runs setup-dotnet today; the line is the rule, uniform with module-pack.
      DOTNET_INSTALL_DIR: ${{ inputs.runner != 'ubuntu-latest' && '/home/runner/.dotnet' || '' }}
    permissions:
      contents: read
      id-token: write     # azure/login OIDC for upstream-seed — granted BY the caller, as for publish-bake
    steps:
      - uses: actions/checkout@v7
      # Cross-repo `requires` must resolve for the package roots to bind — the tester installs
      # whatever the mount holds, so the required modules are STAGED into it, exactly like
      # production resolves the requires from the store's package sources.
      # 🚨 Assert the staging inputs BEFORE minting, so a missing one fails RED naming what to
      # provision rather than surfacing as an opaque create-github-app-token or checkout error two
      # steps later (Copilot review, #2310). The `if:` is on the declared INPUT stage-modules —
      # i.e. whether staging was requested at all — never on whether a secret happens to be set,
      # which is the skip-trapdoor AGENTS.md forbids.
      - name: "Preflight: the stage-repo credentials must be provisioned"
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
          STAGE_APP_ID: ${{ secrets.stage-repo-app-id }}
          STAGE_APP_KEY: ${{ secrets.stage-repo-app-private-key }}
        run: |
          set -euo pipefail
          missing=()
          case "${STAGE_REPO:-}" in
            "")  missing+=("stage-repo (input) — owner/name of the repo modules are staged from") ;;
            */*) : ;;
            *)   missing+=("stage-repo (input) — must be owner/name, got '${STAGE_REPO}'") ;;
          esac
          [ -n "${STAGE_APP_ID:-}" ]  || missing+=("stage-repo-app-id (secret) — app id of a GitHub App able to read ${STAGE_REPO:-the stage repo}")
          [ -n "${STAGE_APP_KEY:-}" ] || missing+=("stage-repo-app-private-key (secret) — that App's private key, PEM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::stage-modules is set, so the cross-repo staging inputs are required:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            # 🚨 The store split that made every satellite dependabot PR red (#2249).
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::This run reads the DEPENDABOT secret store, not Actions — provision the pair there too (#2249)."
            fi
            exit 1
          fi
          echo "Staging ${STAGE_REPO} — credentials present."

      # 🚨 A PAT here was a permanent two-way failure. It rots — the platform's own copy went
      # HTTP 401 and a daily check never ran once (#1709) — and, because GitHub hands a
      # dependabot-triggered run the DEPENDABOT secret store rather than the Actions one, a PAT
      # provisioned for normal runs left every dependabot PR in every satellite permanently RED
      # (#2249). An installation token is minted here, per run, scoped to stage-repo alone.
      - name: Resolve the stage repo's owner and name
        id: stage-repo-parts
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
        run: |
          set -euo pipefail
          echo "owner=${STAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${STAGE_REPO##*/}"  >> "$GITHUB_OUTPUT"
      - name: Mint an installation token for the stage repo
        id: stage-token
        if: inputs.stage-modules != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.stage-repo-app-id }}
          private-key: ${{ secrets.stage-repo-app-private-key }}
          owner: ${{ steps.stage-repo-parts.outputs.owner }}
          repositories: ${{ steps.stage-repo-parts.outputs.name }}
          permission-contents: read
      # ─────────── Step 2 of the plugin build contract: INSTALL the upstreams ───────────
      # Fetch the caller's upstream publications — the sealed bundles baked for the EXACT framework
      # identity this gate's image resolves — into a seed directory the tester consumes. This is
      # what makes "install my dependencies" an install rather than a rebuild: the tester stands
      # its mesh up on the upstream's baked bytes and node definitions, and its Shortfall verdict
      # REFUSES a run that compiled what it was handed. See Doc/Architecture/PluginBuildContract.
      #
      # 🚨 Fails RED, never skips. A named upstream with no sealed publication for this identity
      # is not "nothing to seed" — it is a gate about to compile its dependency and pass, which
      # is indistinguishable from a gate that installed it (BakeSeed's own warning).
      - name: "Preflight: the upstream-seed credentials must be provisioned"
        if: inputs.upstream-seed != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.azure-client-id }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.azure-subscription-id }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          missing=()
          if [ -n "${REGISTRY_URL:-}" ]; then
            [ -n "${REGISTRY_KEY:-}" ] || missing+=("registry-key (secret) — registry-url is set, so the fetch is over HTTPS with an instance key")
          else
            [ -n "${AZURE_CLIENT_ID:-}" ]       || missing+=("azure-client-id (secret)")
            [ -n "${AZURE_TENANT_ID:-}" ]       || missing+=("azure-tenant-id (secret)")
            [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] || missing+=("azure-subscription-id (secret)")
            [ -n "${TARGETS:-}" ]               || missing+=("bake-publish-targets (input) — the storage target to read the upstream publication from")
            # Without registry-url the seed is read with `az storage` after `azure/login`, and the
            # self-hosted runner image ships no `az` (header, "`runner` — honoured by the gate
            # shards"). Named here, not three commands later as a missing binary.
            command -v az >/dev/null 2>&1 || missing+=("az CLI — runner '${RUNNER_NAME:-?}' (runs-on '${RUNNER_LABEL}') has none, and without registry-url the seed is read from the storage share with 'az storage'. Pass registry-url (HTTPS + instance key, no az), or keep the gate on ubuntu-latest (the lane's 'runner' input)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::upstream-seed is set but missing: ${m}"; done
            echo "::error::upstream-seed cannot fetch a publication without these. This job fails RED rather than skipping the seed: a gate that silently compiled its upstream would look exactly like one that installed it."
            exit 1
          fi
      - name: Azure login (OIDC) for the upstream publication
        if: inputs.upstream-seed != '' && inputs.registry-url == ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      # ───────────── THE PLATFORM FOR THIS SHARD: plan's baseline, re-checked for a NEWER set ─────────────
      # "Re-run failed jobs" re-runs THIS job with `needs.plan.outputs` exactly as they were hours
      # ago, because a successful `plan` is not re-run (Education#320). So when `plan` RESOLVED the
      # platform (the caller pinned nothing), this shard resolves once more with plan's row as its
      # PLATFORM_BASELINE: a newer sealed set is taken (`override=true`, a `::notice`), the same or
      # an older one keeps the baseline verbatim, a failed re-resolution keeps it with a `::warning`.
      # A caller's PIN is never refreshed — it is echoed back byte-for-byte. Not an input-shaped
      # `if:`: the step always runs and branches inside.
      - name: "The platform for this shard: the caller's pins, or plan's set re-checked for a newer one"
        id: platform
        env:
          RESOLVED: ${{ needs.plan.outputs.resolved }}
          IMAGE_DIGEST: ${{ needs.plan.outputs.image-digest }}
          PLATFORM_DIGEST: ${{ needs.plan.outputs.platform-image-digest }}
          PLATFORM_BASELINE: ${{ needs.plan.outputs.baseline }}
          TEST_IMAGE: ${{ inputs.test-image }}
          PLATFORM_IMAGE: ${{ inputs.platform-image }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
          FREEZE: ${{ vars.MW_PLATFORM_REF }}    # the CALLER's variable — see `plan`
        run: |
          set -euo pipefail
          if [ "${RESOLVED:-}" != "true" ]; then
            {
              echo "image-digest=${IMAGE_DIGEST}"
              echo "platform-image-digest=${PLATFORM_DIGEST}"
            } >> "$GITHUB_OUTPUT"
            echo "platform: as called (tester '${IMAGE_DIGEST:-<tag>}', portal '${PLATFORM_DIGEST:-<tag>}') — nothing was resolved in plan, nothing is refreshed here"
            exit 0
          fi
          [ -n "${PLATFORM_BASELINE:-}" ] || { echo "::error::plan reports resolved=true but handed this shard no baseline row — the plan step and this one disagree about their contract"; exit 1; }
          SCRIPT="${RUNNER_TEMP:-/tmp}/resolve-platform.py"
          # curl, not `gh api`: THIS job honours the `runner` input and the self-hosted runner image
          # ships no `gh` (header, "Where the heavy legs run"). The two other lane-script fetches in
          # this job moved off `gh` for exactly that reason and this one was left behind, so an
          # unpinned caller on `aks-silos` / `aks-silos-dind` would have died here on a missing
          # binary. Same endpoint, same ref, same token; the raw media type returns the bytes
          # without the base64 round-trip. (`plan`'s copy keeps `gh api` — it is on ubuntu-latest.)
          curl -fsSL --retry 3 --retry-delay 5 -o "$SCRIPT" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/Systemorph/MeshWeaver/contents/.github/scripts/resolve-platform.py?ref=${SCRIPTS_REF}" \
            || { echo "::error::could not fetch resolve-platform.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched resolve-platform.py at ${SCRIPTS_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
          ROWS="${RUNNER_TEMP:-/tmp}/platform-rows.txt"; : > "$ROWS"
          # With PLATFORM_BASELINE set the resolver never fails the job on its own re-resolution:
          # the baseline is a valid answer (see the script's FRESHNESS section).
          GITHUB_OUTPUT="$ROWS" python3 "$SCRIPT" --tester-image "$TEST_IMAGE" --portal-image "$PLATFORM_IMAGE" ${FREEZE:+--freeze "$FREEZE"}
          python3 - "$ROWS" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          rows = dict(line.rstrip("\n").split("=", 1) for line in open(sys.argv[1], encoding="utf-8") if "=" in line)
          for key in ("image-digest", "portal-image-digest", "set"):
              if not rows.get(key):
                  raise SystemExit(f"::error::the resolver wrote no `{key}` for this shard — refusing to gate against an incomplete platform")
          print(f"image-digest={rows['image-digest']}")
          print(f"platform-image-digest={rows['portal-image-digest']}")
          print(f"platform-set={rows['set']}")
          print(f"override={rows.get('override', 'false')}")
          PY
          echo "platform for this shard: $(grep '^set=' "$ROWS" | cut -d= -f2-) (override=$(grep '^override=' "$ROWS" | cut -d= -f2-))"
      # ───────────── TWO IMAGES, ONE BUILD: resolve, pull, extract, compose (MeshWeaver#3022) ─────────────
      - name: Resolve the tester and the platform image
        id: images
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ steps.platform.outputs.image-digest }}
          PLATFORM_IMAGE: ${{ inputs.platform-image }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.platform-image-digest }}
          ALLOW_UNPINNED: ${{ inputs.allow-unpinned }}
        run: |
          set -euo pipefail
          # 🚨 The one wrong value GitHub cannot refuse for us: the tester passed as the platform,
          # which would silently restore the reference-set gap this input closes.
          case "$PLATFORM_IMAGE" in
            *mw-plugin-test*) echo "::error::platform-image names the TESTER image ('$PLATFORM_IMAGE') — pass the PORTAL image (meshweaver.azurecr.io/memex-portal-ai); the tester only executes."; exit 1 ;;
          esac
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            TESTER="${TEST_IMAGE%%:*}@${IMAGE_DIGEST}"
          elif [ "$ALLOW_UNPINNED" = "true" ]; then
            TESTER="$TEST_IMAGE"
            echo "gating with ${TEST_IMAGE} verbatim (allow-unpinned — runs are not reproducible)"
          else
            echo "::error::image-digest is empty and allow-unpinned is not set — pin a digest (reproducible) or opt in to following the tag."
            exit 1
          fi
          if [ -n "${PLATFORM_DIGEST:-}" ]; then
            PORTAL="${PLATFORM_IMAGE%%:*}@${PLATFORM_DIGEST}"
          elif [ "$ALLOW_UNPINNED" = "true" ]; then
            PORTAL="$PLATFORM_IMAGE"
            echo "gating against ${PLATFORM_IMAGE} verbatim (allow-unpinned)"
          else
            echo "::error::platform-image-digest is empty and allow-unpinned is not set — pin the portal digest from the same CD wave as image-digest, or opt in to following the tag. There is no fallback to the tester's /app (MeshWeaver#3022)."
            exit 1
          fi
          echo "tester=$TESTER" >> "$GITHUB_OUTPUT"
          echo "platform=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "tester: $TESTER"; echo "platform: $PORTAL"
      # 🚨 THE MODE, MEASURED — and the only place this lane decides where the platform comes from
      # (MeshWeaver#4113; "Where the heavy legs run" in the header). Until 2026-09-12 the shard's
      # FIRST step asserted `docker info` and failed RED on a runner without a daemon, because a
      # shard WAS a `docker run`. It no longer is when the runner node carries the platform: this
      # step reports `volume` when /opt/platform is mounted and `container` when it is not, and the
      # Docker assertion is now the CONTAINER mode's own precondition, made here so a runner with
      # NEITHER is red naming both rather than dying on a missing binary later.
      #
      # 🚨 Not an input-shaped `if:` and not a label test: the mount either exists on this runner
      # or it does not, and the answer is printed on every run in both modes. Within volume mode
      # there is NO fallback — a missing or half-written set is RED naming `ci-platform-refresh`.
      #
      # It runs HERE rather than first because the digests it looks the set up BY are what the two
      # steps above resolved (`platform` re-checks plan's baseline for a newer sealed set, `images`
      # turns the result into the two references). Everything above is string work and one registry
      # HEAD; nothing heavy — no pull, no compose, no checkout of the platform — happens before the
      # mode is known and printed.
      #
      # The script comes from the platform at the lane's SCRIPTS ref, `curl`ed exactly as
      # compose-gate-host.sh is (the self-hosted runner image ships no `gh`).
      - name: Where this shard takes the platform from
        id: platform-source
        env:
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
          # The EFFECTIVE pins — the caller's, or the set `platform` resolved for this shard — not
          # `inputs.*`, which are empty for a caller that pins nothing (MeshWeaver#4099).
          TESTER_DIGEST: ${{ steps.platform.outputs.image-digest }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.platform-image-digest }}
          RUNNER_LABEL: ${{ inputs.runner }}
          PLATFORM_VOLUME: /opt/platform
        run: |
          set -euo pipefail
          SCRIPT="${RUNNER_TEMP:-/tmp}/resolve-gate-platform.sh"
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — resolve-gate-platform.sh has no ref to be fetched at"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 5 -o "$SCRIPT" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/Systemorph/MeshWeaver/contents/.github/scripts/resolve-gate-platform.sh?ref=${SCRIPTS_REF}" \
            || { echo "::error::could not fetch resolve-gate-platform.sh at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched resolve-gate-platform.sh at ${SCRIPTS_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
          chmod +x "$SCRIPT"
          OUT="${RUNNER_TEMP:-/tmp}/platform-mode.txt"
          # `tee`, under pipefail: the resolver's refusals are ::error:: lines on stdout, so they
          # must be SHOWN, and its exit code must still fail this step.
          "$SCRIPT" --volume-root "$PLATFORM_VOLUME" \
            --tester-digest "$TESTER_DIGEST" --portal-digest "$PLATFORM_DIGEST" | tee "$OUT"
          MODE=$(sed -n 's/^mode=//p' "$OUT" | head -1)
          case "$MODE" in
            volume)
              echo "runner '${RUNNER_NAME:-?}' (runs-on '$RUNNER_LABEL'): VOLUME mode — the tester runs as a process from $PLATFORM_VOLUME. No Docker daemon is used, needed or asserted in this job."
              ;;
            container)
              # The pre-#4113 contract, and the daemon is its precondition. A runner that has
              # neither the mount nor a daemon is named for BOTH here, not for one of them later.
              if ! docker info >/dev/null 2>&1; then
                echo "::error::runner '${RUNNER_NAME:-?}' (runs-on '$RUNNER_LABEL') has NEITHER the CI platform volume at $PLATFORM_VOLUME NOR a reachable Docker daemon, and a gate shard needs one or the other: the volume (every runner pod of the self-hosted 'aks-silos' / 'aks-silos-dind' scale sets mounts it — Systemorph/Memex deployments/aks/ci-runners/) or a daemon to pull the tester image with. Set the caller's runner variable to 'aks-silos', or unset it (ubuntu-latest, which has Docker)."
                docker info 2>&1 | tail -5 || true
                exit 1
              fi
              echo "runner '${RUNNER_NAME:-?}' (runs-on '$RUNNER_LABEL'): CONTAINER mode — Docker $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo '?') at ${DOCKER_HOST:-the default socket}"
              ;;
            *)
              echo "::error::resolve-gate-platform.sh printed no mode — refusing to guess where this shard's platform comes from."
              exit 1
              ;;
          esac
          {
            echo "### Gate shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} — platform source: \`$MODE\`"
            echo ""
            sed -n 's/^\(mode\|set\|digest\|core_sha\|dir\)=/- **\1**: /p' "$OUT"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      # ───────────── VOLUME MODE: the runtime the composed host is started with ─────────────
      # In container mode the tester is started by the PORTAL image's own `dotnet` (10.0.12, with
      # BOTH Microsoft.NETCore.App and Microsoft.AspNetCore.App under /usr/share/dotnet/shared —
      # which is also what `--shared-frameworks` names). The volume carries the two /app trees and
      # NOT that 114 MB directory, so in volume mode the runtime comes from here. The scale set's
      # runner is non-root, hence the job-level DOTNET_INSTALL_DIR.
      # 🚨 Not a skip-trapdoor: installing a RUNTIME is not a check, and the step right after it
      # asserts by name that what landed carries every framework the portal itself declares.
      - name: Install the .NET the composed host runs on (volume mode)
        if: steps.platform-source.outputs.mode == 'volume'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # 🚨 THE FIDELITY ASSERTION. `--shared-frameworks` is the reference set's framework half, and
      # in volume mode it is the RUNNER's install rather than the portal image's. A runner missing
      # Microsoft.AspNetCore.App, or carrying another major.minor, would compile every NodeType
      # against a framework the portal does not run — reporting content errors on source nobody
      # changed, which is the exact misdiagnosis MeshWeaver#3022 exists to prevent. So the portal's
      # OWN runtimeconfig (read off the volume) is the expectation, what is installed is the
      # measurement, and BOTH are printed on every run, green or red.
      - name: The runner's .NET carries every framework the platform host declares
        id: dotnet
        if: steps.platform-source.outputs.mode == 'volume'
        env:
          PORTAL_APP: ${{ steps.platform-source.outputs.portal_app }}
        run: |
          set -euo pipefail
          ROOT="${DOTNET_ROOT:-${DOTNET_INSTALL_DIR:-/usr/share/dotnet}}"
          [ -x "$ROOT/dotnet" ] || { echo "::error::no dotnet host at '$ROOT/dotnet' — setup-dotnet installed nothing this step can find (DOTNET_ROOT='${DOTNET_ROOT:-}', DOTNET_INSTALL_DIR='${DOTNET_INSTALL_DIR:-}')."; exit 1; }
          SHARED="$ROOT/shared"
          [ -d "$SHARED" ] || { echo "::error::'$SHARED' does not exist — a dotnet install without a shared-framework root cannot supply the reference set's framework half."; exit 1; }
          RC=$(find "$PORTAL_APP" -maxdepth 1 -name '*.runtimeconfig.json' | sort | head -1)
          [ -n "$RC" ] || { echo "::error::the platform host at '$PORTAL_APP' has no *.runtimeconfig.json, so the frameworks it runs on cannot be read. That is the portal image's /app as ci-platform-refresh laid it down; a set without it is damaged."; exit 1; }
          echo "platform host runtimeconfig: $(basename "$RC")"
          missing=0
          while IFS="$(printf '\t')" read -r name want; do
            [ -n "$name" ] || continue
            band="${want%.*}"
            have=$(find "$SHARED/$name" -maxdepth 1 -mindepth 1 -type d -name "${band}.*" 2>/dev/null | sed 's#.*/##' | sort -V | tail -1)
            if [ -z "$have" ]; then
              echo "::error::the platform host declares framework '$name' >= $want, and the runner's .NET at '$SHARED' carries no $band.* of it. The gate would compile against a framework the portal does not run. Installed: $(ls "$SHARED" 2>/dev/null | tr '\n' ' ')"
              missing=$((missing + 1))
            else
              echo "  $name: portal declares >= $want, runner has $have"
            fi
          done < <(jq -r '((.runtimeOptions.frameworks // []) + (if .runtimeOptions.framework then [.runtimeOptions.framework] else [] end))[] | [.name, .version] | @tsv' "$RC")
          [ "$missing" -eq 0 ] || exit 1
          echo "dotnet=$ROOT/dotnet" >> "$GITHUB_OUTPUT"
          echo "shared=$SHARED" >> "$GITHUB_OUTPUT"
          echo "the composed host will be started by $ROOT/dotnet ($("$ROOT/dotnet" --version 2>/dev/null || echo '?')), reference frameworks from $SHARED"
      - name: Log in to the image registry
        if: steps.platform-source.outputs.mode == 'container'
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          # 🚨 Bounded retry, and deliberately NOT a skip-trapdoor: after the last attempt this
          # still fails RED, and a CREDENTIAL rejection fails IMMEDIATELY rather than being retried
          # three times — retrying a 401 only delays the same red while hiding which kind of
          # failure it was.
          #
          # Everything else IS retried, including failures this does not recognise. That is the
          # intended default rather than an oversight: an unclassified docker login failure is far
          # more often transient (daemon not ready, DNS, TLS reset) than permanent, and the one
          # class known to be permanent — bad credentials — is carved out above. A positive
          # allow-list of "connection-level" strings would fail fast on the next transient error
          # nobody predicted, which is the failure mode this exists to remove.
          #
          # Three ACR logins failed on 2026-08-28 in two separate incidents an hour apart
          # ("dial tcp 51.12.25.80:443: connect: connection refused", registry healthy throughout),
          # reddening three REQUIRED checks across two repos. On a strict:true repo the cost is not
          # one re-run: the re-run lands against a moved main, the branch goes BEHIND, and it needs
          # another sync and another full run — so one TCP reset re-stales every open PR (#2570).
          for attempt in 1 2 3; do
            if echo "${{ secrets.acr-password }}" \
                 | docker login "${TEST_IMAGE%%/*}" -u "${{ secrets.acr-username }}" \
                     --password-stdin 2>login.err; then
              rm -f login.err
              exit 0
            fi
            cat login.err
            if grep -qiE 'unauthorized|authentication required|denied|401' login.err; then
              echo "::error::ACR rejected the credentials for ${TEST_IMAGE%%/*} — that is not a"\
                   "transient failure, so it is not retried. Check the acr-username/acr-password secrets."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::docker login to ${TEST_IMAGE%%/*} failed after 3 connection-level attempts."
          exit 1
      # CONTAINER MODE ONLY. In volume mode the two /app trees are already on the node and were
      # resolved (and proven complete) by the platform-source step above — nothing is pulled,
      # nothing is copied out of an image, and `steps.platform-source.outputs.{tester,portal}_app`
      # stand in for this step's outputs everywhere below.
      - name: Pull both images and extract their /app
        id: hosts
        if: steps.platform-source.outputs.mode == 'container'
        env:
          TESTER_REF: ${{ steps.images.outputs.tester }}
          PORTAL_REF: ${{ steps.images.outputs.platform }}
        run: |
          set -euo pipefail
          docker pull -q "$TESTER_REF"
          docker pull -q "$PORTAL_REF"
          T="$RUNNER_TEMP/tester-app"; P="$RUNNER_TEMP/portal-app"
          rm -rf "$T" "$P"
          cid=$(docker create "$TESTER_REF"); docker cp -q "$cid:/app" "$T"; docker rm "$cid" >/dev/null
          cid=$(docker create "$PORTAL_REF"); docker cp -q "$cid:/app" "$P"; docker rm "$cid" >/dev/null
          [ -f "$T/mw-plugin-test.dll" ] || { echo "::error::$TESTER_REF ships no /app/mw-plugin-test.dll — test-image must be the mw-plugin-test image"; exit 1; }
          [ -s "$P/meshweaver-surface.manifest" ] || { echo "::error::$PORTAL_REF ships no /app/meshweaver-surface.manifest — platform-image must be the PORTAL image; a host without a manifest resolves the fallback identity no bake may be keyed to"; exit 1; }
          echo "tester_app=$T" >> "$GITHUB_OUTPUT"
          echo "portal_app=$P" >> "$GITHUB_OUTPUT"
          echo "tester /app: $(find "$T" -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ') assemblies; portal /app: $(find "$P" -maxdepth 1 -name '*.dll' | wc -l | tr -d ' ') assemblies"
      # 🚨 ONE BUILD, asserted: the run's own bake is keyed to the PORTAL's identity and executed by
      # the TESTER's toolchain, which is honest only when the two images are one build. The tester's
      # `framework-identity` verb reads the portal's /app as files and compares — naming the canonical
      # assemblies each side lacks on a mismatch (#1814). The identity it prints is ALSO the address
      # an upstream seed must be sealed under (upstream-seed).
      # 🚨 IT RUNS IN BOTH MODES, unchanged in what it asserts. In volume mode the tester CLI is
      # started from the share by the runner's `dotnet` (its own /app carries its deps.json, so the
      # TPA is the tester's closure exactly as inside its image) and the portal's /app is read at
      # its path on the share instead of through a bind mount. Same verb, same --expect, same
      # refusal. This is ALSO what carries the tester↔portal pairing when a bootstrap set's
      # platform.json records no portal digest for the resolver to cross-check.
      - name: "Resolve the framework identity this gate runs as — the PORTAL's; the tester must resolve the same"
        id: identity
        env:
          MODE: ${{ steps.platform-source.outputs.mode }}
          DOTNET: ${{ steps.dotnet.outputs.dotnet }}
          TESTER_REF: ${{ steps.images.outputs.tester }}
          TESTER_APP: ${{ steps.hosts.outputs.tester_app || steps.platform-source.outputs.tester_app }}
          PORTAL_APP: ${{ steps.hosts.outputs.portal_app || steps.platform-source.outputs.portal_app }}
        run: |
          set -euo pipefail
          if [ "$MODE" = volume ]; then
            line=$("$DOTNET" "$TESTER_APP/mw-plugin-test.dll" --print-framework-identity)
          else
            line=$(docker run --rm --init --entrypoint /app/mw-plugin-test "$TESTER_REF" --print-framework-identity)
          fi
          tester="${line#*identity=}"; tester="${tester%% *}"
          [ -n "$tester" ] || { echo "::error::could not resolve the tester image's framework identity (got: '$line')"; exit 1; }
          identity=""
          if [ "$MODE" = volume ]; then
            ok=0; identity=$("$DOTNET" "$TESTER_APP/mw-plugin-test.dll" framework-identity "$PORTAL_APP" --expect "$tester") || ok=$?
          else
            ok=0; identity=$(docker run --rm --init -v "$PORTAL_APP:/portal:ro" --entrypoint /app/mw-plugin-test "$TESTER_REF" framework-identity /portal --expect "$tester") || ok=$?
          fi
          if [ "$ok" -ne 0 ]; then
            printf '%s\n' "$identity"
            echo "::error::the tester image and the platform image do NOT resolve one framework identity — they are not one build (the verb's output above names the canonical assemblies each side lacks). Pin test-image/image-digest and platform-image/platform-image-digest from the SAME CD wave."
            exit 1
          fi
          identity=$(printf '%s' "$identity" | tail -1 | tr -d '[:space:]')
          [ -n "$identity" ] || { echo "::error::framework-identity printed no identity for the portal's /app"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "this gate runs as framework identity $identity (the portal's; the tester resolves the same); upstream bundles must be sealed under it"
      # The compose script, from the platform at the lane's SCRIPTS ref (`scripts-ref`, falling back
      # to platform-ref) — same fetch shape as compose-sealed-modules.sh below, for the same reason
      # (job_workflow_sha is empty here). Not platform-ref itself: this is the LANE's tooling, and an
      # unpinned caller's platform (the newest sealed set) is hours behind the lane (MeshWeaver#3842).
      - name: Compose the gate host (the portal's /app + the tester CLI)
        id: host
        env:
          PORTAL_APP: ${{ steps.hosts.outputs.portal_app || steps.platform-source.outputs.portal_app }}
          TESTER_APP: ${{ steps.hosts.outputs.tester_app || steps.platform-source.outputs.tester_app }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCRIPT="${RUNNER_TEMP:-/tmp}/compose-gate-host.sh"
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — compose-gate-host.sh has no ref to be fetched at"; exit 1; }
          # curl, not `gh api`: the self-hosted runner image ships no `gh` (header). Same endpoint,
          # same ref, same token; the raw media type returns the bytes without a base64 round-trip.
          curl -fsSL --retry 3 --retry-delay 5 -o "$SCRIPT" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/Systemorph/MeshWeaver/contents/.github/scripts/compose-gate-host.sh?ref=${SCRIPTS_REF}" \
            || { echo "::error::could not fetch compose-gate-host.sh at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched compose-gate-host.sh at ${SCRIPTS_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
          chmod +x "$SCRIPT"
          HOST="$RUNNER_TEMP/gate-host"
          "$SCRIPT" "$PORTAL_APP" "$TESTER_APP" "$HOST"
          echo "dir=$HOST" >> "$GITHUB_OUTPUT"
      - name: Fetch the upstream publications into the seed directory
        if: inputs.upstream-seed != ''
        id: seed
        env:
          UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          SEED_DIR="${RUNNER_TEMP:-/tmp}/upstream-seed"
          mkdir -p "$SEED_DIR"

          # 🚨 "THE UPSTREAM HAS NOT PUBLISHED FOR THIS IDENTITY" IS A WAIT, NOT A REPO DEFECT — and
          # it still fails RED, on every trigger. A gate that cannot fail is not a gate (AGENTS.md),
          # so nothing here exits 0, carries `continue-on-error:`, or asks an `if:` about an input.
          # What the event changes is WHAT IS SAID, never WHETHER the gate runs: the three triggers
          # learn this identity three different ways, and only one of them is this repository's
          # fault. Same wording, same title and same table as node-repo-publish-bake.yml's
          # "Upstreams not ready" step — one condition must not wear two names across two lanes.
          #
          # 🚨 THE `schedule` ROW IS THE ONE THAT USED TO BE WRONG. This lane's message promised
          # "the upstream's own publish-bake for this identity re-enables this run", which is TRUE
          # for a dispatch wave (measured 2026-09-08 on MeshWeaver.Crm: red 15:36Z, the
          # meshweaver-upstream-published wake for the same set green at 16:01Z) and FALSE for a
          # nightly poll — the poll re-resolves a MOVING tag, so its next run asks about a different
          # identity and never retries this one. Manufacturing#67 / Crm#66.
          upstream_not_ready() { # <src> <where> <extra sentence>
            local src="$1" where="$2" extra="${3:-}"
            {
              echo "### ⛔ Upstreams not ready — did NOT gate"
              echo ""
              echo "Upstream \`$src\` has no sealed publication at $where for framework identity"
              echo "\`$IDENTITY\`. This gate installs its dependency from that publication; compiling"
              echo "the upstream's source instead would gate this repo against a framework its"
              echo "dependency was never built for, so it refuses. ${extra}"
              echo ""
              echo "**This is a WAIT on the upstream, not a defect in this repository** — and which"
              echo "wait depends on how this run learned the identity above:"
              echo ""
              echo "| this run was | it learned the identity from | an unsealed upstream means |"
              echo "|---|---|---|"
              echo "| \`push\` / \`pull_request\` | this repo's PIN | the PIN is wrong — move it to an identity the upstream HAS published for |"
              echo "| \`repository_dispatch\` | the wake's own payload | the wave is mid-flight; the upstream's publication re-triggers this run |"
              echo "| \`schedule\` | a MOVING release tag this run resolved itself | nobody promised the upstream published for it |"
              echo ""
              echo "This run's event was \`${GITHUB_EVENT_NAME:-unknown}\`."
              echo ""
              echo "**What re-enables it:** the upstream's own \`publish-bake\`, on sealing for this"
              echo "identity, POSTs the publication to the control instance, which dispatches"
              echo "\`meshweaver-upstream-published\` to every repository that declares that source."
              echo ""
              echo "🚨 **The \`schedule\` poll does NOT retry this identity** — it re-resolves a moving"
              echo "tag, so the next poll asks about whatever has been promoted since. If no wake ever"
              echo "arrives, the upstream is not publishing for released identities at all: that is"
              echo "the UPSTREAM's red, and nothing in this repository repairs it."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error title=Upstreams not ready — did not gate::upstream '$src' has no SEALED publication at $where for framework identity $IDENTITY. What re-enables it is the upstream's own publish-bake dispatching meshweaver-upstream-published for this identity — NOT the schedule poll, which re-resolves a moving tag and therefore asks about a different identity next time. This run's event was ${GITHUB_EVENT_NAME:-unknown}."
            exit 1
          }

          # 🚨 A 5xx is not an answer — it is the ABSENCE of one, and refusing on it makes every
          # platform promotion a source of red CI across the fleet (MeshWeaver#2787). Promotion
          # rolls the portal that SERVES this registry, so the window is STRUCTURAL: the more
          # reliably promotion works, the more often a dependent repo's gate lands inside it. One
          # day's three promotions opened it three times, and six repos read this endpoint.
          #
          # A DEFINITE answer still refuses immediately and unchanged — 404 (unsealed), 401/403
          # (no grant) are decisions the registry has already made, and waiting on one only
          # delays the message that names it. Same distinction, same reason, as MeshWeaver#2836
          # on the portal side: branch on what the server SAID, never on "the read failed".
          #
          # 🚨 This is a retry, NOT a skip-trapdoor. Exhausting the attempts returns the last
          # status to the caller, which still refuses RED — a registry that is genuinely down
          # fails the gate exactly as before, roughly three minutes later.
          #
          # 🚨 There is a SECOND copy of this function, in .github/scripts/compose-sealed-modules.sh
          # (same policy, `registry_key` spelled lower-case there). It is duplicated ON PURPOSE
          # rather than factored into a third file: that script is fetched from core at a pinned
          # `platform-ref` while this workflow is pinned by the caller's `uses:`, so a shared file
          # would be a THIRD independently-pinned artefact — the exact skew that once let an old
          # workflow drive a new script and seal an empty module set. Change one, change both.
          registry_get() { # <url> <out-file> [generation] → echoes the final HTTP status
            local url="$1" out="$2" generation="${3:-}" code="" attempt=0
            local -r delays="15 30 60 90"
            # A publication being republished answers 503 + Retry-After (MeshWeaver#3401), so it
            # lands in the transient arm below and is waited out — rather than read as a missing
            # bundle, which is exactly how the 2026-09-06 Manufacturing red presented.
            # An `if`, not `[ … ] && …`: bash exempts a non-final `&&` operand from `set -e`
            # today, but only because this is not the function's last statement. An `if` cannot
            # become a silent early return when someone moves it.
            local -a precondition=()
            if [ -n "$generation" ]; then precondition=(-H "If-Match: $generation"); fi
            while :; do
              code=$(curl -sS -o "$out" -w '%{http_code}' \
                       -H "Authorization: Bearer $REGISTRY_KEY" \
                       ${precondition[@]+"${precondition[@]}"} "$url") || code="000"
              case "$code" in
                # Transient: a roll window, a gateway blip, or a connection that never landed
                # (curl reports 000). Everything else is the registry's decision — return it.
                408|429|5??|000) ;;
                *) printf '%s' "$code"; return 0 ;;
              esac
              attempt=$((attempt+1))
              local delay
              delay=$(printf '%s\n' $delays | sed -n "${attempt}p")
              [ -n "$delay" ] || { printf '%s' "$code"; return 0; }
              echo "registry answered $code for $url — transient (a platform roll looks like this);" \
                   "re-asking in ${delay}s, attempt $((attempt+1))" >&2
              sleep "$delay"
            done
          }
          if [ -n "${REGISTRY_URL:-}" ]; then
            # The REGISTRY serves the sealed publication (MeshWeaver#2487) — HTTPS + instance key,
            # no Azure, works on pull_request. Fails RED on 404 (unsealed) or 401/403 (no grant).
            #
            # 🚨 ONE SOURCE'S SEED READS ONE PUBLICATION, OR NONE (MeshWeaver#3401). A publication
            # that moves under the N+1 reads below answers 412; the correct response is to read
            # the publication that NOW applies — never to keep the half already fetched, and
            # never to re-ask the read that failed. `SRC_FETCHED` counts only a completed source,
            # so a restart cannot inflate the total.
            seed_one_source() { # <src> → 0 fetched, 2 the publication moved mid-fetch (re-read)
              local src="$1" base code generation name bcode
              SRC_FETCHED=0
              base="${REGISTRY_URL%/}/api/plugins/bundles/prebuilt/$IDENTITY/$src"
              code=$(registry_get "$base" "$SEED_DIR/.index.json")
              case "$code" in
                200) ;;
                404) upstream_not_ready "$src" "$REGISTRY_URL" "" ;;
                401|403) echo "::error::the registry refused registry-key for '$src' ($code) — the instance needs a whole-source grant '$src/*'."; exit 1 ;;
                *) echo "::error::registry answered $code for $base — refusing."; exit 1 ;;
              esac
              # 🚨 200 is NOT proof of an index. The portal answers 200 + HTML (the app shell's
              # catch-all route) for ANY unknown path, /api/… included — so a registry that does not
              # serve /prebuilt yet answers this request with a web page. Measured 2026-08-27 on
              # SocialMedia#84 against a memex one build behind MeshWeaver#2487: jq's parse error
              # was swallowed, fetched stayed 0, and the step died as "sealed but empty" — the wrong
              # condition, pointing at the wrong fix. Only a JSON object with a `bundles` array is
              # a publication index; anything else is a registry that cannot serve this lane yet.
              if ! jq -e '.bundles | type == "array"' "$SEED_DIR/.index.json" >/dev/null 2>&1; then
                echo "::error::$base answered 200 but not a publication index (starts: $(head -c 60 "$SEED_DIR/.index.json" | tr -d '\n\r')…). The registry does not serve /api/plugins/bundles/prebuilt — it runs a build without MeshWeaver#2487. Refusing to guess; retry once the registry has rolled."
                exit 1
              fi
              # 🚨 CARRY THE GENERATION (MeshWeaver#3401). Reading the index and then each bundle
              # it names is N+1 reads of a directory the publisher may reseal underneath us: it
              # deletes the sentinel, uploads, and re-seals LAST, deliberately. Pinning the
              # generation we read makes the server refuse a fetch that would mix two publications
              # instead of silently handing us half of each. A registry predating #3401 serves no
              # generation; we then send no If-Match and behave exactly as before, so an older
              # portal is unaffected.
              generation=$(jq -r '.generation // empty' "$SEED_DIR/.index.json")
              : > "$SEED_DIR/.attempt.list"
              for name in $(jq -r '.bundles[]' "$SEED_DIR/.index.json"); do
                bcode=$(registry_get "$base/$name" "$SEED_DIR/$name" "$generation")
                case "$bcode" in
                  200) ;;
                  412)
                    # 🚨 DISCARD THE HALF WE HOLD. A name the REJECTED publication listed and the
                    # next one does not would otherwise linger in the seed — a bundle from a
                    # publication this gate refused, which is the mix the precondition exists to
                    # prevent. The re-read then re-fetches every name the current seal lists.
                    rm -f "$SEED_DIR/$name"
                    while IFS= read -r stale; do rm -f "$SEED_DIR/$stale"; done < "$SEED_DIR/.attempt.list"
                    rm -f "$SEED_DIR/.attempt.list"
                    echo "::notice::the '$src' publication was resealed while this fetch was in flight (we held generation $generation) — discarding the partial seed and re-reading the publication that now applies. The gate reads ONE publication or none, never half of two."
                    return 2 ;;
                  404) echo "::error::'$name' is listed in the '$src' publication index but the registry will not serve it — the seal and the store disagree, and that needs a republish. This is NOT the republish window: that answers 503 and is waited out above."; exit 1 ;;
                  *) echo "::error::could not fetch $name from $base — registry answered $bcode."; exit 1 ;;
                esac
                printf '%s\n' "$name" >> "$SEED_DIR/.attempt.list"
                SRC_FETCHED=$((SRC_FETCHED+1))
              done
              rm -f "$SEED_DIR/.index.json" "$SEED_DIR/.attempt.list"
              echo "upstream '$src': fetched from $REGISTRY_URL"
            }
            # 🚨 BOUNDED, and the bound is what makes this a READ rather than a poll: a publisher
            # resealing faster than a seed completes is a real condition (two lanes publish the
            # `plugins` prefix — core CD and the Plugins satellite), and it goes RED naming itself
            # rather than spinning. Nothing here re-asks a read the server refused.
            RESTARTS=2
            fetched=0
            for src in $UPSTREAMS; do
              attempt=0
              while :; do
                rc=0
                seed_one_source "$src" || rc=$?
                [ "$rc" = 2 ] || break
                attempt=$((attempt+1))
                if [ "$attempt" -gt "$RESTARTS" ]; then
                  echo "::error::the '$src' publication was resealed under every one of $((RESTARTS+1)) seed attempts — the publisher is republishing faster than this gate can read one publication. This is MeshWeaver#3401, NOT a fault of this repo's diff or its platform pin: re-run once the upstream's publish-bake has settled."
                  exit 1
                fi
              done
              fetched=$((fetched+SRC_FETCHED))
            done
            printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
            [ "$fetched" -gt 0 ] || { echo "::error::sealed but empty — refusing an empty seed"; exit 1; }
            echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The FIRST target is read — every target holds the same publication (publish-bake
          # writes them all-or-nothing), so one read is the set.
          target=$(printf '%s\n' $TARGETS | head -1)
          account="${target%%/*}"; rest="${target#*/}"
          share="${rest%%/*}"; base=""
          case "$rest" in */*) base="${rest#*/}" ;; esac
          fetched=0
          for src in $UPSTREAMS; do
            dir="${base:+$base/}prebuilt-bundles/$IDENTITY/$src"
            # EXISTENCE FIRST, fail CLOSED (the publish script's own rule): an unreadable answer
            # is not "absent", and absent is a red gate, not an empty seed.
            sealed=$(az storage file exists --account-name "$account" --share-name "$share" \
              --path "$dir/_complete" --auth-mode login --backup-intent --query exists -o tsv --only-show-errors 2>/dev/null || echo unknown)
            # 🚨 ABSENT and COULD-NOT-DETERMINE are two answers, and only one of them is a wait —
            # `check-release-availability.sh` splits them for the same reason ("an errored probe is
            # NOT an absent one"). Both refuse; conflating them would have sent a reader chasing an
            # upstream publication when the real fault was an unreadable share.
            case "$sealed" in
              true) ;;
              false) upstream_not_ready "$src" "$account/$share/$dir" "" ;;
              *) echo "::error::could not read $account/$share/$dir/_complete for framework identity $IDENTITY (exists=$sealed) — availability CANNOT BE DETERMINED, which is a hold and not an absence. Check the storage credential and the share, not the upstream's publication."
                 exit 1 ;;
            esac
            az storage file download-batch --account-name "$account" --share-name "$share" \
              --source "$share/$dir" --destination "$SEED_DIR" --pattern '*.zip' \
              --auth-mode login --backup-intent --only-show-errors > /dev/null
            n=$(ls "$SEED_DIR"/*.zip 2>/dev/null | wc -l | tr -d ' ')
            echo "upstream '$src': $n bundle(s) from $account/$share/$dir"
            fetched=$((fetched + n))
          done
          # The tester keys a seed to this file; without it the seed is refused as unaddressable.
          printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
          [ "$fetched" -gt 0 ] || { echo "::error::upstream publications were sealed but held no bundles — refusing an empty seed"; exit 1; }
          echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
      - name: Stage cross-repo modules
        if: inputs.stage-modules != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.stage-repo }}
          token: ${{ steps.stage-token.outputs.token }}
          path: cross-repo-stage
          sparse-checkout: ${{ inputs.stage-modules }}
      - name: Download this run's module-bundle artifacts
        if: inputs.module-artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.module-artifacts }}
          path: ${{ runner.temp }}/ext-bundles
          merge-multiple: true
      # 🚨 EXTERNAL MODULES — the same composition node-repo-publish-bake.yml does, for the same
      # reason (#2276: the tester image ships no modules) and by the same recipe, so the GATE and
      # the BAKE cannot disagree about what a mesh contains.
      #
      # Without it the gate stands up a mesh missing whatever module the content binds, and the
      # failure is CONTENT-shaped with an INFRASTRUCTURE cause — `NodeType(s) not registered:
      # Skill` at install, or CS0246 at compile. Measured 2026-08-28 across every plugin repo at
      # once, while bumping their pins past #2276: 17 packages failed to install in one run.
      # Every failure below is RED and NAMED, because a gate that quietly ran without a module it
      # needed is worse than one that did not run at all.
      # `id:` is load-bearing: test-module-asset-landing.py EXTRACTS this step's shell by id and
      # executes it against synthetic bundles. A copy of the block in the harness would pass while
      # the real thing rots, so the harness fails RED if this id disappears.
      - name: "External modules: assemble what the gate must compose"
        id: ext-modules
        if: inputs.module-artifacts != '' || inputs.registry-modules != ''
        env:
          REGISTRY_MODULES: ${{ inputs.registry-modules }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
          SEAL_UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXT="${RUNNER_TEMP:-/tmp}/ext-modules"; mkdir -p "$EXT"; chmod 777 "$EXT"
          BUNDLES="${RUNNER_TEMP:-/tmp}/ext-bundles"; mkdir -p "$BUNDLES"
          if [ -n "${REGISTRY_MODULES:-}" ]; then
            if [ -n "${SEAL_UPSTREAMS:-}" ]; then
              # 🚨 The publication is the unit of consistency (MeshWeaver#2698): module bytes come
              # from the SEALED upstream publication for this identity, never the registry's
              # package endpoint. No fallback — a missing seal or module set is RED in the script.
              # The compose script at the lane's SCRIPTS ref (`scripts-ref`, falling back to platform-ref
              # for a caller that pins both to one commit; an unpinned caller passes `main`, MeshWeaver#3842).
              # NOT github.job_workflow_sha: it is empty inside a reusable called from another repository,
              # so a fetch keyed on it silently read main while claiming a pin.
              SCRIPT="${RUNNER_TEMP:-/tmp}/compose-sealed-modules.sh"
              [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the compose script has no ref to be fetched at"; exit 1; }
              # curl, not `gh api`: the self-hosted runner image ships no `gh` (header) — same
              # endpoint, same ref, same token, raw media type.
              curl -fsSL --retry 3 --retry-delay 5 -o "$SCRIPT" \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/Systemorph/MeshWeaver/contents/.github/scripts/compose-sealed-modules.sh?ref=${SCRIPTS_REF}" \
                || { echo "::error::could not fetch compose-sealed-modules.sh at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
              head -c 2 "$SCRIPT" | grep -q '#!' || { echo "::error::the fetched compose-sealed-modules.sh at ${SCRIPTS_REF} is not a script (starts: $(head -c 40 "$SCRIPT" | tr -d '\n'))"; exit 1; }
              chmod +x "$SCRIPT"
              if [ -n "${REGISTRY_URL:-}" ]; then
                "$SCRIPT" --identity "$IDENTITY" --packages "$REGISTRY_MODULES" --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" \
                  --registry-url "$REGISTRY_URL" --registry-key "$REGISTRY_KEY"
              else
                "$SCRIPT" --identity "$IDENTITY" --packages "$REGISTRY_MODULES" --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" \
                  --storage-target "$(printf '%s\n' $TARGETS | head -1)"
              fi
            else
              echo "::notice::composing registry-modules ($REGISTRY_MODULES) from the REGISTRY's package endpoint: this repo declares no upstream seed, so there is no sealed publication to take module bytes from. These bytes are whatever the module's own lane published last — a bake-consumption decline against a publication that composed different ones is expected, and is the reason to declare the upstream (upstream-seed / upstream-sources) instead."
            for pkg in ${REGISTRY_MODULES:-}; do
              idx=$(curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" "$REGISTRY_URL/api/plugins/bundles/index.json") \
                || { echo "::error::registry index unreadable at $REGISTRY_URL (registry-modules: $pkg)"; exit 1; }
              ver=$(jq -r --arg p "$pkg" '(.bundles // .Bundles // [])[] | select(((.plugin // .Plugin)|ascii_downcase)==($p|ascii_downcase)) | (.version // .Version)' <<<"$idx" | head -1)
              [ -n "$ver" ] || { echo "::error::the registry at $REGISTRY_URL does not advertise package '$pkg' to this instance key — check the key's grants, and that the upstream wave has published the bundle."; exit 1; }
              curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" -o "$BUNDLES/$pkg.bundle.zip" "$REGISTRY_URL/api/plugins/bundles/$pkg/$ver" \
                || { echo "::error::download failed for $pkg@$ver from $REGISTRY_URL"; exit 1; }
              echo "fetched $pkg@$ver from $REGISTRY_URL"
            done
            fi
          fi
          shopt -s nullglob
          MODULE_ARGS=""
          MODULE_COUNT=0
          ASSET_MODULES=0
          ASSET_FILES=0
          # ───── ONE BUILD PER ASSEMBLY NAME, ACROSS THE WHOLE COMPOSED SET (MeshWeaver#3732) ─────
          # 🚨 A module-owned `MeshWeaver.*` sibling RIDES every bundle that references it, and some
          # of those siblings are ANOTHER package's declared module (Doc/Architecture/
          # ModuleOwnedSiblingsRide). That decision stands, and it rests on exactly ONE invariant:
          # every copy of a name in the set is the SAME BUILD. `MeshWeaver.*` assemblies bind by a
          # strictly synchronised AssemblyVersion, so the copies are ONE assembly identity — whichever
          # this host loads FIRST wins the process, and every NodeType the bake compiles is stamped
          # `mvid:` of THAT build. A portal that loaded another one declines every one of them at
          # adoption ("dependency record mismatch — built against mvid:A, live is mvid:B"), falls back
          # to a local compile, and with two replicas holding two builds ping-pongs between them for
          # ever while the partition serves the default config and its pages render empty.
          #
          # 🚨 NOTHING ASSERTED THAT INVARIANT AT THE PRODUCER. The design page believed re-keying
          # preserved it — bake-scope.sh and module-build-key.py fold a sibling's SOURCES into every
          # bundle that carries it — but re-keying only makes those bundles REBUILD, and one
          # publication is composed from SEVERAL independent compilations (MeshWeaver.Plugins: two
          # `build-workspace` jobs, one per module-pack lane call, plus a
          # `dotnet build -p:Version=<module version>` per legacy `sdk` entry). Same sources, three
          # compilations, three MVIDs — measured on memex 2026-09-10, where ONE pod held
          # MeshWeaver.Markdown.Collaboration in 15 copies and 3 builds, grouped exactly by which
          # compilation produced them.
          #
          # This step is the first point where every copy is in ONE hand, and it is the point where
          # the damage is done: what the bake loads becomes the record every consumer must match. So
          # the assertion lives here, over the composed BYTES, and it is a REFUSAL — a publication
          # carrying two builds of one name is what ReleaseAvailability later answers
          # `SealedSetInconsistent` for, i.e. NOTHING ROLLS, for the whole fleet, until it is rebuilt.
          digest_of() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
            else shasum -a 256 "$1" | cut -d' ' -f1; fi
          }
          DIGESTS="${RUNNER_TEMP:-/tmp}/ext-module-builds"; : > "$DIGESTS"
          for b in "$BUNDLES"/*.nupkg "$BUNDLES"/*.zip; do
            u="${RUNNER_TEMP:-/tmp}/unpack-$(basename "$b")"; rm -rf "$u"; mkdir -p "$u"
            unzip -o -q "$b" -d "$u"
            name=""
            [ -f "$u/meshweaver/manifest.json" ] && name=$(jq -r '.module.assemblyName // empty' "$u/meshweaver/manifest.json")
            if [ -z "$name" ]; then
              set -- "$u"/meshweaver/modules/*.dll
              { [ $# -eq 1 ] && [ -f "$1" ]; } || { echo "::error::$(basename "$b"): cannot identify the module's entry assembly (no manifest module.assemblyName; meshweaver/modules/ holds $# dll(s))"; exit 1; }
              name=$(basename "$1" .dll)
            fi
            test -f "$u/meshweaver/modules/$name.dll" || { echo "::error::$(basename "$b"): meshweaver/modules/$name.dll is missing from the bundle"; exit 1; }
            # 🚨 DIGESTED FROM THIS BUNDLE'S OWN UNPACKED FOLDER, BEFORE THE MERGE — never from
            # /ext afterwards. Two bundles that declare the same `module.assemblyName` land in the
            # SAME /ext/<name>/ directory and the second `cp -R` OVERWRITES the first, so a scan of
            # /ext cannot see a collision between an artifact bundle and a registry bundle — which
            # is precisely the case this lane's own notice calls an accident of glob order
            # (`*.nupkg` before `*.zip`, so a registry copy silently wins). Reading each bundle's own
            # folder sees every input copy, and names the BUNDLE each one came from — the same
            # wording `UpdatePolicy.heldReason` uses when the consumer finds it days later.
            while IFS= read -r dll; do
              simple="$(basename "$dll" .dll)"
              printf '%s %s %s %s\n' "$simple" "$(digest_of "$dll")" "$(basename "$b")" \
                "$(if [ "$simple" = "$name" ]; then echo declared; else echo riding; fi)" >> "$DIGESTS"
            done < <(find "$u/meshweaver/modules" -maxdepth 1 -type f \( -name 'MeshWeaver.*.dll' -o -name 'MeshWeaver.dll' \) | sort)
            mkdir -p "$EXT/$name"
            cp -R "$u"/meshweaver/modules/. "$EXT/$name/"
            # 🚨 A module bundle carries its STATIC WEB ASSETS separately from the flat closure,
            # under `meshweaver/moduleassets/` (NuGetPackageWriter.ModuleAssetFolder), and they keep
            # their MODULE-RELATIVE path — `wwwroot/x.js`, `wwwroot/_content/<Dep>/y.css`. That is
            # the shape ModuleLandingService writes verbatim beside the entry assembly, and it is
            # the shape MeshModuleStaticAssetExtensions then serves at `_content/<Name>/…` off
            # `<module folder>/wwwroot`. Copying only `meshweaver/modules/` therefore lands a module
            # that LOADS PERFECTLY and 404s every asset it ships, saying so in ONE Debug line —
            # which is why it survived: MeshWeaver.Education's mesh e2e rendered a bare Code node
            # card where the workbench belongs for three days after MeshWeaver.Plugins#1268 moved
            # the collaboration views into MeshWeaver.Markdown.Collaboration (MeshWeaver#3514).
            assets=0
            if [ -d "$u/meshweaver/moduleassets" ]; then
              cp -R "$u"/meshweaver/moduleassets/. "$EXT/$name/"
              # Fail CLOSED, per file, against a DENOMINATOR: what the bundle ships is the
              # expectation, what the module folder holds is the measurement. A landing that copied
              # nothing must go RED here rather than report a green zero — an uncounted zero is
              # exactly what let the gap above ride for three days.
              ( cd "$u/meshweaver/moduleassets" && find . -type f ) | sed 's|^\./||' > "${u}.shipped-assets"
              assets=$(wc -l < "${u}.shipped-assets" | tr -d ' ')
              missing=0
              while IFS= read -r rel; do
                [ -f "$EXT/$name/$rel" ] || { echo "::error::$name: shipped static asset '$rel' did not land at /ext/$name/$rel"; missing=$((missing + 1)); }
              done < "${u}.shipped-assets"
              [ "$missing" -eq 0 ] || { echo "::error::$(basename "$b"): $missing of $assets shipped static asset(s) are missing from /ext/$name — a browser rendering against this mesh would 404 them"; exit 1; }
              [ "$assets" -eq 0 ] || ASSET_MODULES=$((ASSET_MODULES + 1))
            fi
            ASSET_FILES=$((ASSET_FILES + assets))
            MODULE_COUNT=$((MODULE_COUNT + 1))
            MODULE_ARGS="$MODULE_ARGS --module /ext/$name/$name.dll"
            echo "external module composed: $name ($(basename "$b")) — $assets static asset file(s)"
          done
          [ -n "$MODULE_ARGS" ] || { echo "::error::external modules were requested but none were assembled — the artifact pattern matched nothing and no registry bundle was fetched."; exit 1; }
          # ───── THE VERDICT ON THE SET (MeshWeaver#3732; the reading is collected above) ─────
          COPIES=$(awk 'END {print NR + 0}' "$DIGESTS")
          NAMES=$(awk '{print $1}' "$DIGESTS" | sort -u | awk 'END {print NR + 0}')
          SHARED=$(awk '{c[$1]++} END {n = 0; for (k in c) if (c[k] > 1) n++; print n}' "$DIGESTS")
          DIVERGED=$(awk '{if (!seen[$1 SUBSEP $2]++) d[$1]++} END {n = 0; for (k in d) if (d[k] > 1) n++; print n}' "$DIGESTS")
          # 🚨 The DENOMINATOR is printed on every run, green or red. A check pointed at an empty or
          # wrong directory reports zero copies and refuses nothing while ticking exactly like a clean
          # measurement, so the count that would expose it is never hidden. Zero is legitimate only
          # for a repo whose modules carry no `MeshWeaver.*` assembly at all; anywhere else it is the
          # wrong directory, and it is on the log.
          echo "module set: $COPIES MeshWeaver.* assembly file(s) across $MODULE_COUNT bundle(s), $NAMES distinct name(s), $SHARED carried by more than one bundle, $DIVERGED carried at more than one BUILD"
          if [ "$DIVERGED" -ne 0 ]; then
            while IFS= read -r dupe; do
              echo "::error::$dupe reaches this mesh as more than one build — the loader keeps whichever it sees first and the loser's bytes are never in memory, so callers compiled against the loser silently run the winner (MeshWeaver#3732). Since MeshWeaver#3934 a dependency record expresses a FLOOR rather than an exact build, so the adoption decline that used to accompany this no longer fires for same-version copies — the loader coin toss is the harm that remains, and it is why a torn publication is refused HERE, at the one place every copy is in one hand."
              awk -v n="$dupe" '$1 == n {printf "          sealed %s %s %s\n", substr($2, 1, 16), ($4 == "declared" ? "as the declared module of" : "as a sibling riding"), $3}' "$DIGESTS" | sort -u
            done < <(awk '{if (!seen[$1 SUBSEP $2]++) d[$1]++} END {for (k in d) if (d[k] > 1) print k}' "$DIGESTS" | sort)
            echo "::error::the composed module set carries $DIVERGED assembly name(s) at more than one build. The bake would stamp every NodeType against whichever copy it loaded first, and every consumer that loaded another would decline them. Build the whole set in ONE compilation, or stop the divergent copy riding — Doc/Architecture/ModuleOwnedSiblingsRide."
            exit 1
          fi
          echo "external modules: $MODULE_COUNT composed, $ASSET_MODULES of them carrying static web assets, $ASSET_FILES asset file(s) landed module-relative under /ext/<module>/"
          echo "EXT_MODULES_DIR=$EXT" >> "$GITHUB_ENV"
          echo "EXT_MODULE_ARGS=$MODULE_ARGS" >> "$GITHUB_ENV"
      - name: Import + compile + render + run tests for each node repo
        id: gate
        env:
          MODE: ${{ steps.platform-source.outputs.mode }}
          DOTNET: ${{ steps.dotnet.outputs.dotnet }}
          RUNNER_SHARED_FRAMEWORKS: ${{ steps.dotnet.outputs.shared }}
          PLATFORM_REF: ${{ steps.images.outputs.platform }}
          PORTAL_APP: ${{ steps.hosts.outputs.portal_app || steps.platform-source.outputs.portal_app }}
          HOST_DIR: ${{ steps.host.outputs.dir }}
          TARGET_IDENTITY: ${{ steps.identity.outputs.identity }}
          STAGE_MODULES: ${{ inputs.stage-modules }}
          ALLOW_FILE: ${{ inputs.allow-file }}
          AFFECTED_MOUNT: ${{ needs.plan.outputs.mount }}
          AFFECTED_RUN_ALL: ${{ needs.plan.outputs.run_all }}
          # `<index>/<total>`, or empty for the unsharded lane — see the `shards` input.
          SHARD: ${{ needs.plan.outputs.shards != '1' && format('{0}/{1}', matrix.shard, needs.plan.outputs.shards) || '' }}
          # Empty unless upstream-seed fetched a publication — then the tester consumes it.
          SEED_DIR: ${{ steps.seed.outputs.dir }}
        # Allow entries whose module is not mounted on a narrowed run are "unverifiable" —
        # warned, never failed — so narrowing cannot trip the ratchet. On a narrowed run the
        # affected closure is STAGED into its own tree and gated as the repo root — the tester
        # gates every package it discovers, so the staged tree IS the filter.
        run: |
          set -euo pipefail
          # ───── THE PATHS THE TESTER IS GIVEN, once, per mode (MeshWeaver#4113) ─────
          # 🚨 The ARGUMENTS are identical in both modes; only what they point AT differs. In
          # container mode they are the bind-mount paths inside the tester container, exactly as
          # before #4113. In volume mode they are the runner's own directories, because the tester
          # is a process on this runner. Everything below is written once, against these names.
          if [ "$MODE" = volume ]; then
            P_APP="$PORTAL_APP"                       # the portal's /app, read off the share
            P_SHARED="$RUNNER_SHARED_FRAMEWORKS"      # the runner's <dotnet root>/shared
          else
            P_APP=/app                                # the portal IMAGE's own /app
            P_SHARED=/usr/share/dotnet/shared         # the portal IMAGE's implementation frameworks
          fi
          if [ "$AFFECTED_RUN_ALL" = "true" ]; then
            REPO_MOUNT="$GITHUB_WORKSPACE"
            echo "full run: gating every module"
          elif [ -z "$AFFECTED_MOUNT" ]; then
            # 🚨 Unreachable by construction: `plan` turns an empty narrowed mount into an EMPTY
            # MATRIX, so this job does not exist on such a run. Getting here means the plan and the
            # gate disagree about what this run gates — which is exactly the fan-out failure the
            # aggregate job exists to catch, so it is RED here rather than a quiet `exit 0` that
            # would render as a shard doing its share.
            echo "::error::this shard was scheduled with an EMPTY affected mount. The plan job decides that case (nothing-to-gate ⇒ empty matrix), so a shard reaching it means the two disagree — refusing to report a gate that gated nothing."
            exit 1
          else
            REPO_MOUNT="${RUNNER_TEMP:-/tmp}/gate-stage"
            mkdir "$REPO_MOUNT"
            for m in $AFFECTED_MOUNT; do cp -R "$GITHUB_WORKSPACE/$m" "$REPO_MOUNT/"; done
            echo "narrowed run: gating $AFFECTED_MOUNT"
          fi
          # Staged modules join the tree so every package's requires resolve. On the full-run
          # path the workspace IS the tree — cross-repo-stage/ itself has no root index.json,
          # so the tester never treats it as a module; only the copied module dirs count.
          for m in ${STAGE_MODULES:-}; do
            cp -R "$GITHUB_WORKSPACE/cross-repo-stage/$m" "$REPO_MOUNT/"
          done
          OWN_BAKE="${RUNNER_TEMP:-/tmp}/own-bake"; mkdir -p "$OWN_BAKE"; chmod 777 "$OWN_BAKE"
          if [ "$MODE" = volume ]; then
            P_REPO="$REPO_MOUNT"; P_BAKE="$OWN_BAKE"; P_SEED="$OWN_BAKE"
          else
            P_REPO=/repo; P_BAKE=/bake; P_SEED=/seed
          fi
          ALLOW_PATH=""
          if [ -n "${ALLOW_FILE:-}" ]; then
            if [ "$AFFECTED_RUN_ALL" = "true" ]; then
              ALLOW_PATH="$P_REPO/$ALLOW_FILE"
            else
              cp "$GITHUB_WORKSPACE/$ALLOW_FILE" "$REPO_MOUNT/"
              ALLOW_PATH="$P_REPO/$(basename "$ALLOW_FILE")"
            fi
          fi
          ALLOW_ARGS=()
          [ -n "${ALLOW_PATH:-}" ] && ALLOW_ARGS=(--allow "$ALLOW_PATH")
          # 🚨 `--module` was written with the CONTAINER's /ext prefix by the external-modules step
          # (whose shell `test-module-asset-landing.py` extracts and executes verbatim, so it is
          # left byte-identical). In volume mode the same modules are the same files on this
          # runner, so only the prefix is re-pointed — never the set.
          MODULE_ARGS="${EXT_MODULE_ARGS:-}"
          if [ "$MODE" = volume ] && [ -n "${EXT_MODULES_DIR:-}" ]; then
            MODULE_ARGS=$(printf '%s' "$MODULE_ARGS" | sed "s#--module /ext/#--module ${EXT_MODULES_DIR}/#g")
          fi
          EXT_V=()
          [ -n "${EXT_MODULES_DIR:-}" ] && EXT_V=(-v "$EXT_MODULES_DIR:/ext")
          DUMP_ARGS=()
          if [ "${{ inputs.capture-coredumps }}" = "true" ]; then
            mkdir -p "${RUNNER_TEMP:-/tmp}/coredumps"
            chmod 0777 "${RUNNER_TEMP:-/tmp}/coredumps"
            if [ "$MODE" = volume ]; then
              # Same three knobs, set on the process instead of on the container. No SYS_PTRACE:
              # createdump dumps the process that raised the abort, as the same user.
              export DOTNET_DbgEnableMiniDump=1
              export DOTNET_DbgMiniDumpType=2
              export DOTNET_DbgMiniDumpName="${RUNNER_TEMP:-/tmp}/coredumps/%e-%p.dmp"
            else
              DUMP_ARGS=(-v "${RUNNER_TEMP:-/tmp}/coredumps:/coredumps"
                --cap-add=SYS_PTRACE
                -e DOTNET_DbgEnableMiniDump=1
                -e DOTNET_DbgMiniDumpType=2
                -e DOTNET_DbgMiniDumpName=/coredumps/%e-%p.dmp)
            fi
          fi
          # ───── THE ONE PLACE THE TESTER IS STARTED (MeshWeaver#3022 + #4113) ─────
          # BOTH modes run the COMPOSED HOST — the portal's /app with the tester CLI beside it —
          # and never the tester image's own /app: the gate's verdict is only the platform's when
          # its PROCESS is the platform host (compose-gate-host.sh's header has the full argument).
          #
          # container: the PORTAL image's own `dotnet` on the composed host, as the runner's uid
          #   (HOME=/tmp keeps runtime probes off read-only image paths).
          #   🚨 `--init` is not cosmetic: without it the tester is the container's PID 1, and a
          #   PID-namespace init with SIG_DFL for SIGABRT is SIGNAL_UNKILLABLE — the kernel
          #   DISCARDS the signal the .NET runtime raises to end a crashed process. `abort()` then
          #   falls through to its trap instruction, the runtime's SIGTRAP handler returns to the
          #   instruction that trapped, and the process SPINS at 100% CPU for ever instead of
          #   exiting (#1741: two such containers "Up" 36 and 57 minutes, having printed one
          #   exception in their first second). With `--init` a crash exits 134 immediately.
          # volume: the RUNNER's `dotnet` on the composed host. The PID-1 hazard does not exist
          #   here — the tester is an ordinary child of the job's shell, so SIGABRT is delivered
          #   and a crash exits 134 the same way.
          TESTER_MOUNTS=()
          run_tester() {
            if [ "$MODE" = volume ]; then
              "$DOTNET" "$HOST_DIR/mw-plugin-test.dll" "$@"
            else
              docker run --rm --init --user "$(id -u):$(id -g)" -e HOME=/tmp "${EXT_V[@]}" \
                -v "$HOST_DIR:/host:ro" -v "$REPO_MOUNT:/repo" "${TESTER_MOUNTS[@]}" "${DUMP_ARGS[@]}" \
                --entrypoint dotnet "$PLATFORM_REF" /host/mw-plugin-test.dll "$@"
            fi
          }
          # ── BUILD ONCE, TEST WHAT WAS BUILT (Doc/Architecture/PluginBuildContract, step 3 → 4).
          # The gate used to compile in-mesh and DISCARD the result; publish-bake then compiled the
          # identical source again on merge. Now: `compile` (mesh-free, the producer) writes this
          # repo's OWN bundles to the bake directory; the gate stands its mesh up on THOSE bytes
          # (`--seed`), so what is tested is what would ship; and the bake is uploaded as
          # `bake-<sha>` so the merge's publish-bake can REUSE it instead of compiling a third time.
          # The upstream seed (if any) is a SEPARATE input: consumed, never re-emitted.
          #
          # 🚨 The seed rides the GATE call only. `compile` is the mesh-free bake of THIS repo's
          # own types and its parser deliberately takes no --seed ("Unknown argument '--seed'",
          # exit 2 — measured 2026-08-27 on the first run that ever got past the registry auth,
          # Reinsurance run 33091175986; the flag on the compile line had never been exercised).
          #
          # `--app` + `--shared-frameworks`: the reference set is the PORTAL's /app plus its
          # IMPLEMENTATION frameworks — what the portal's runtime compile sees — which is what keys
          # the bake to the portal's identity. Same shape as node-repo-publish-bake.yml, on
          # purpose: the gate and the bake must not disagree about what a portal contains.
          TESTER_MOUNTS=(-v "$OWN_BAKE:/bake")
          # shellcheck disable=SC2086  # MODULE_ARGS is a flag list; word-splitting is the point
          run_tester compile "$P_REPO" \
            --app "$P_APP" --shared-frameworks "$P_SHARED" \
            "${ALLOW_ARGS[@]}" ${MODULE_ARGS:-} --output "$P_BAKE" --source-sha "$GITHUB_SHA"
          [ -s "$OWN_BAKE/framework-mvid.txt" ] || { echo "::error::compile ran but wrote no bake identity — the bake stage regressed (or the image predates the compile verb; pin ≥ 77bc5f1)"; exit 1; }
          baked="$(tr -d '[:space:]' < "$OWN_BAKE/framework-mvid.txt")"
          [ "$baked" = "$TARGET_IDENTITY" ] || { echo "::error::the run's own bake is keyed to '$baked' but the portal's /app resolves '$TARGET_IDENTITY' — the compile did not run against the platform host (is --app set to the portal's /app?)"; exit 1; }
          # Gate on the bake: own bundles AND the upstream seed together in one seed directory.
          if [ -n "${SEED_DIR:-}" ]; then cp "$SEED_DIR"/*.zip "$OWN_BAKE"/ 2>/dev/null || true; fi
          # The tester's stdout is ALSO the gate log a caller's own ratchets read (MeshWeaver.Manufacturing's
          # Tests-area ratchet, `check-test-suites.py --gate-log`). A reusable workflow cannot hand a
          # file back through outputs, so it is uploaded as an artifact below. `pipefail` keeps the
          # TESTER's exit code — tee's success never masks a red gate.
          GATE_LOG="${RUNNER_TEMP:-/tmp}/gate.log"
          # 🚨 Exported BEFORE the tester runs: under `set -e` a red gate would exit this script before
          # a later export, and the always() upload would then skip on an empty GATE_LOG — the log
          # missing exactly when a caller's ratchet needs the `GATE FAILED` line. The tester's exit
          # code is carried past `tee` explicitly and re-raised after, so a red gate is still red.
          echo "GATE_LOG=$GATE_LOG" >> "$GITHUB_ENV"
          # 🚨 THE SLICE. Empty for `shards: 1`, which is byte-for-byte the pre-fan-out command line —
          # so a caller that does not opt in cannot be affected by this at all, and an image that
          # predates the flag keeps working for them. When it IS set, the flag is asserted BY NAME
          # against the pinned platform FIRST: without this the run dies on `Unknown argument
          # '--shard'` (exit 2) with a message that names the tester's argv rather than the pin.
          SHARD_ARGS=()
          if [ -n "${SHARD:-}" ]; then
            TESTER_MOUNTS=()
            if ! run_tester --help 2>&1 | grep -q -- '--shard'; then
              echo "::error::this lane was called with shards>1 but the PINNED tester does not accept --shard, so it cannot gate a slice. Bump image-digest/platform-image-digest to a CD wave carrying it (both pins move together, from one wave), or set shards: 1."
              exit 1
            fi
            SHARD_ARGS=(--shard "$SHARD")
            echo "this job gates shard $SHARD"
          fi
          # `--app`: the gate must RUN AS the portal host (it resolves the portal's identity),
          # refused before a mesh boots otherwise — a gate running as another host would decline
          # every bundle and compile the tree itself, passing without judging the bytes that ship.
          TESTER_MOUNTS=(-v "$OWN_BAKE:/seed:ro")
          set +e
          # shellcheck disable=SC2086
          run_tester "$P_REPO" --app "$P_APP" \
            "${ALLOW_ARGS[@]}" ${MODULE_ARGS:-} "${SHARD_ARGS[@]}" --seed "$P_SEED" | tee "$GATE_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::the gate exited $rc — the verdict is above and in this shard's gate-log artifact"
            exit "$rc"
          fi
          echo "OWN_BAKE=$OWN_BAKE" >> "$GITHUB_ENV"
          echo "bake identity: $(cat "$OWN_BAKE/framework-mvid.txt") — $(ls "$OWN_BAKE"/*.zip | wc -l | tr -d ' ') bundle(s), gated on their own bytes"
      # 🚨 In CONTAINER mode the dump is written by the container, which runs as root, so the file
      # lands owned by root with a restrictive mode — a core dump can contain anything that was in
      # memory, so the runtime writes it 0600 on purpose. `chmod 0777` on the mount DIRECTORY
      # (above) lets the container create the file; it does nothing for the file's own permissions.
      # (In VOLUME mode the dump is written by the runner's own uid and this step is a no-op that
      # still runs — a chown of files you already own, which is cheaper than a second `if:` whose
      # correctness nobody would ever see tested.) So
      # upload-artifact, which runs as the unprivileged `runner` user, failed with
      #
      #     Error: EACCES: permission denied, open '.../coredumps/mw-plugin-test-7.dmp'
      #
      # and the job then died in zip creation. Every crash produced exactly the evidence needed to
      # diagnose it and then threw it away — which is why MeshWeaver.Reinsurance#98 stayed
      # "different NodeTypes park on different runs" for weeks instead of being read as the SIGSEGV
      # (exit 139) it actually is.
      #
      # `if: always()` because the only runs with a dump are the ones where the gate FAILED.
      # The bake this gate produced — publish-bake reuses it on merge (bake-run-id) so the same
      # source is never compiled twice. Short retention: it is an intermediate, not a publication.
      # 🚨 always(), and RED if the log is missing while the gate ran: a caller's ratchet that finds no
      # artifact must fail on "no log", never pass on "nothing to check" — the same rule the gate
      # itself applies to a truncated log. Named per commit so a merge-group ref cannot pick up a
      # sibling run's log.
      # 🚨 PER SHARD. Two artifacts of one name cannot coexist in a run, and the CANONICAL names —
      # `gate-log-<sha>` and `bake-<sha>`, which is what a caller's ratchet and publish-bake know —
      # are re-emitted by the aggregate job below from the folded evidence. With `shards: 1` there is
      # exactly one of each here and the fold is a copy, so the contract is identical either way.
      - name: Upload this shard's gate log (the tester's stdout)
        if: always() && env.GATE_LOG != ''
        uses: actions/upload-artifact@v7
        with:
          name: gate-log-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ env.GATE_LOG }}
          retention-days: 3
          if-no-files-found: error
      - name: Upload this shard's bake for publish-bake to reuse
        if: always() && env.OWN_BAKE != ''
        uses: actions/upload-artifact@v7
        with:
          name: bake-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ env.OWN_BAKE }}
          retention-days: 3
          if-no-files-found: error
      - name: Make core dumps readable by the uploader
        if: always() && inputs.capture-coredumps
        shell: bash
        run: |
          dir="${RUNNER_TEMP:-/tmp}/coredumps"
          [ -d "$dir" ] || exit 0
          # Not `|| true`: if a dump exists and cannot be made readable, say so here rather than
          # letting the upload fail three steps later with a message about zip creation.
          sudo chown -R "$(id -u):$(id -g)" "$dir"
          sudo chmod -R u+rw "$dir"
          ls -l "$dir" || true

      - name: Upload core dumps (if the gate crashed)
        if: always() && inputs.capture-coredumps
        uses: actions/upload-artifact@v7
        with:
          name: gate-coredumps-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coredumps
          if-no-files-found: ignore
          retention-days: 15

  # ─────────────── 3. THE ONE STABLE CONTEXT — this is what a repo's protection requires ───────────────
  # 🚨 THE NAME IS THE CONTRACT. `test-repos / Compile + render node repos (MeshWeaver from ACR)` is
  # required on three satellites today; it must keep meaning "the whole gate ran and was green",
  # whatever the shard count. So the aggregate carries the name, and the per-shard contexts
  # (`Gate shard i/n`) deliberately do NOT — they appear and disappear with the `shards` input, and
  # a repo that required one would wait forever the day the number changed. Same invariant, same
  # reason, as `All selected bundles built` in node-repo-module-pack.yml.
  #
  # 🚨 IT FOLDS RECEIPTS, it does not re-derive a verdict. Every shard prints, before it installs
  # anything, which slice of which discovered total it gates; the fold refuses a run whose slices are
  # not a DISJOINT COVER of that total. That is what makes a fan-out safe to require: "shard 3 never
  # ran" and "shard 3 passed" are otherwise the same green wall, and GitHub paints a skipped matrix
  # leg exactly like a passed one.
  verify:
    name: Compile + render node repos (MeshWeaver from ACR)
    needs: [plan, gate]
    # always(): a red or CANCELLED shard must still be folded and NAMED here, never leave this
    # context skipped — a skipped required check reads as satisfied (ReadingCiSignals).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gate-log-artifact: ${{ steps.fold.outputs.artifact }}
    steps:
      # The lane's own merger (gate-shard-merge.py) — the lane's SCRIPTS ref, not the platform's
      # (MeshWeaver#3842: an unpinned caller's platform is hours behind the lane).
      - name: Check out Systemorph/MeshWeaver at the lane's scripts ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.scripts-ref || inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 The plan is the ONLY thing that may say "there was nothing to gate", and it says so as a
      # named output rather than by producing no evidence. Anything else — a failed plan, a skipped
      # gate the plan did not predict, a gate that did not succeed — is RED here, with the cause
      # named. A `uses:` job cannot carry steps, so this is where the caller's "a failed need must
      # not SILENCE this gate" guard lives for the lane's own internals.
      - name: The fan-out must have happened, or the plan must have said why not
        id: expect
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          NOTHING_TO_GATE: ${{ needs.plan.outputs.nothing-to-gate }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the gate's plan job reported '$PLAN_RESULT', so nothing decided what this run gates and no shard can be trusted. Read that job."
            exit 1
          fi
          if [ "$NOTHING_TO_GATE" = "true" ]; then
            if [ "$GATE_RESULT" != "skipped" ]; then
              echo "::error::the plan said there was no module content to gate, but the gate job reported '$GATE_RESULT'. The two disagree; refusing to answer."
              exit 1
            fi
            echo "fold=false" >> "$GITHUB_OUTPUT"
            echo "this run's diff reaches no module content — the plan said so, and the gate correctly did not run. No gate log to hand back."
            exit 0
          fi
          if [ "$GATE_RESULT" != "success" ]; then
            echo "::error::the gate fan-out reported '$GATE_RESULT' across its $SHARDS shard(s) — at least one shard failed, was cancelled, or never ran. Its verdict is in that shard's own job log and its gate-log artifact."
            # Not an early exit: the fold below still runs and NAMES which shard, which is the
            # difference between "the gate is red" and a red nobody can attribute.
          fi
          echo "fold=true" >> "$GITHUB_OUTPUT"
      # A pattern that matches nothing must REACH the folder as zero evidence — it is the folder's
      # job to say which shard is missing — so this download does not fail the job. (The legitimate
      # `continue-on-error`: losing it would replace a NAMED missing-shard verdict with an unnamed
      # download error. The gate's INPUTS are asserted by the caller's preflight and by the plan.)
      - name: Collect every shard's gate log
        if: steps.expect.outputs.fold == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: gate-log-${{ github.sha }}-shard-*
          path: ${{ runner.temp }}/shard-logs
      # 🚨 The fold's own verdict is DEFERRED, not swallowed: the merged log is uploaded first, then
      # re-raised by the explicit fail step at the bottom. Same reason the shard job exports
      # GATE_LOG before running the tester — the evidence a caller's ratchet needs must survive the
      # failure it describes. `rc` is carried in an output, so a fold that refused cannot reach the
      # end of this job green.
      - name: Fold the shards into ONE gate log
        id: fold
        if: steps.expect.outputs.fold == 'true'
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          set -uo pipefail
          python3 meshweaver/.github/scripts/gate-shard-merge.py \
            --logs "$RUNNER_TEMP/shard-logs" \
            --shards "$SHARDS" \
            --gate-result "$GATE_RESULT" \
            --out "$RUNNER_TEMP/gate.log"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The artifact name is published only when there IS a folded log to download — an empty
          # `gate-log-artifact` is a caller's signal that no gate ran, and it must never point at a
          # file that does not exist.
          if [ -s "$RUNNER_TEMP/gate.log" ]; then
            echo "artifact=gate-log-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the fold produced no gate.log at all — the merge script died before writing one."
            exit 1
          fi
      # The canonical name a caller's ratchet downloads. One log, one summary, one verdict —
      # whatever the shard count.
      - name: Upload the folded gate log for the caller's own ratchets
        if: always() && steps.fold.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: gate-log-${{ github.sha }}
          path: ${{ runner.temp }}/gate.log
          retention-days: 3
          if-no-files-found: error
      # The bake, likewise re-emitted under its canonical name. Every shard bakes the whole mount
      # (`compile` takes no --shard — it is 70 s and its output is what the gate then consumes), so
      # merge-multiple overwrites identical bundles and the union is the complete bake either way.
      - name: Collect every shard's bake
        if: steps.expect.outputs.fold == 'true' && needs.gate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: bake-${{ github.sha }}-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/bake
      - name: Upload the merged bake for publish-bake to reuse
        if: steps.expect.outputs.fold == 'true' && needs.gate.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bake-${{ github.sha }}
          path: ${{ runner.temp }}/bake
          retention-days: 3
          if-no-files-found: error
      # 🚨 LAST, and unconditional on the fan-out's result: the fold above NAMES which shard broke,
      # and this is what makes that naming a RED rather than a note. Placed after the uploads so a
      # red gate still hands its evidence to the caller's ratchet — the same reason the shard job
      # exports GATE_LOG before running the tester.
      # 🚨 THE EXPLICIT FAIL STEP. `always()` on this job means a red need does not fail it on its
      # own, so the two ways this context must go red are asserted BY NAME, after the evidence has
      # been handed over: a shard that did not succeed, and a fold that refused the cover.
      - name: A shard that did not succeed, or a fold that refused, fails this context
        if: always() && needs.plan.outputs.nothing-to-gate != 'true'
        run: |
          set -euo pipefail
          failed=0
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::the gate fan-out reported '${{ needs.gate.result }}'. See the fold above for which shard and why."
            failed=1
          fi
          if [ "${{ steps.fold.outputs.rc }}" != "0" ]; then
            echo "::error::the shard fold refused this run (exit '${{ steps.fold.outputs.rc }}') — the shards' slices did not add up to the discovered package set. The annotations above name which. A fan-out whose parts disagree about the whole must never report green."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "every shard succeeded and the fold accounted for every discovered package."
