name: Node repo gate (reusable)

# ♻️ REUSABLE (workflow_call) — the heavy tester gate every MeshWeaver.* content repo runs
# (unified per #1707): install each package into a real MeshWeaver mesh (in-process,
# SQLite/filesystem persistence) and assert code packages compile live, render, AND that each
# type's `Tests` layout area runs green — tests are EXECUTED, not just compiled; a red test
# fails the PR. The tester ships in the mw-plugin-test image; contract is `docker run` with the
# checkout mounted (NOT a `container:` job — see MeshWeaver.Plugins ci.yml history).
#
# NO input-shaped `if:` anywhere in here, deliberately (AGENTS.md: a gate never tests its own
# inputs). The caller's `preflight` job asserts the image/registry inputs red-fail-naming-them,
# the fork exemption lives there too, and this gate runs unconditionally behind
# `needs: [preflight, ...]`.
#
# Caller contract:
#
#   test-repos:
#     needs: [validate, preflight]
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-gate.yml@<40-char platform commit sha>
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".
#     with:
#       test-image: ${{ vars.MW_TEST_IMAGE }}
#       image-digest: ${{ vars.MW_IMAGE_DIGEST }}
#       stage-repo: Systemorph/MeshWeaver.Plugins
#       stage-modules: Store
#     secrets:
#       acr-username: ${{ secrets.ACR_USERNAME }}
#       acr-password: ${{ secrets.ACR_PASSWORD }}
#       stage-repo-app-id: ${{ secrets.MESHWEAVER_APP_ID }}
#       stage-repo-app-private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      test-image:
        description: The mw-plugin-test image reference (the caller's vars.MW_TEST_IMAGE).
        required: true
        type: string
      image-digest:
        description: >-
          Digest pin (tag@digest — reproducible; an image regression lands on the commit that
          bumps the pin, and a pin that lags the platform by days is a gate reporting on a
          framework nobody runs, so bump it routinely). Leaving it empty is an ERROR unless
          allow-unpinned is set.
        required: false
        type: string
        default: ''
      allow-unpinned:
        description: >-
          Explicitly accept an empty image-digest and gate against the tag verbatim. Never a
          silent fallback: an empty digest WITHOUT this flag fails red.
        required: false
        type: boolean
        default: false
      stage-repo:
        description: Repository to stage cross-repo modules from. Empty = no staging.
        required: false
        type: string
        default: ''
      stage-modules:
        description: >-
          Module directories to sparse-checkout from stage-repo and copy into the gate mount
          (newline-separated for several) so the caller's packages' `requires` resolve. Without
          them the package roots land on the unresolvable-NodeType error overlay — an
          arrangement production never runs (MeshWeaver#1701).
        required: false
        type: string
        default: ''
      allow-file:
        description: >-
          Known-debt ratchet file passed as --allow (repo-relative; one-way — a NEW
          non-allowlisted failure fails the PR, a fixed allowlisted type must be removed).
          Empty = none.
        required: false
        type: string
        default: 'plugin-gate.allow'
      affected-narrowing:
        description: >-
          On pull_request diffs, gate only the affected module closure computed by the caller's
          scripts/affected-modules.py (mirrors the runtime's edge semantics; full-run fallbacks
          are built into the script's classification). Main pushes / dispatches never narrow.
          Set false for a repo without that script — every event then gates the full set.
        required: false
        type: boolean
        default: true
      upstream-seed:
        description: >-
          Consume the caller's UPSTREAMS as pre-built bundles instead of staging their source:
          a whitespace-separated list of bake-source segments (e.g. `plugins`), each fetched from
          the portals' storage under `prebuilt-bundles/<framework-identity>/<source>/` — the
          SEALED publication for the exact identity this gate's image resolves — and handed to
          the tester as `--seed`. The tester then stands its mesh up on those bytes and REFUSES a
          run that could not adopt them (`BakeSeedConsumer.Shortfall`), so a green gate here
          means the dependency was installed, not recompiled.

          This is step 2 of the plugin build contract (Doc/Architecture/PluginBuildContract):
          "install my dependencies" — as artifacts, served by MeshWeaver. Requires the
          publication to carry NODE DEFINITIONS (core #2478), and the caller to grant
          `id-token: write` and pass the three azure-* secrets, exactly as for publish-bake.
          Empty = no upstream is consumed (today's behaviour, where stage-repo copies SOURCE).
          Fails RED — never skips — when a named upstream has no sealed publication for this
          identity: a gate that silently compiled its upstream is indistinguishable from one
          that installed it.
        required: false
        type: string
        default: ''
      registry-url:
        description: >-
          The registry that SERVES sealed publications (MeshWeaver#2487), e.g.
          https://memex.meshweaver.cloud. With registry-key set, upstream-seed fetches over
          HTTPS with an instance key and never touches Azure — and it works on pull_request.
        required: false
        type: string
        default: ''
      bake-publish-targets:
        description: >-
          Where upstream-seed READS the upstream publication from — the same
          <account>/<share>[/<base-path>] value the caller's publish-bake WRITES to
          (vars.BAKE_PUBLISH_TARGETS). The first target is read; publish-bake writes every
          target all-or-nothing, so one is the set. Required when upstream-seed is set.
        required: false
        type: string
        default: ''
      capture-coredumps:
        description: >-
          Run the tester with minidump-on-crash enabled and upload any dumps as a run artifact
          — for a repo whose gate has crashed in ways a log cannot explain.
        required: false
        type: boolean
        default: false
    secrets:
      acr-username:
        description: Registry user able to pull the test image.
        required: true
      acr-password:
        description: Registry password for that user.
        required: true
      # The same OIDC identity publish-bake uses, read-only here: the gate FETCHES the caller's
      # upstream publication to seed from. Required only when upstream-seed is set; the preflight
      # below fails RED naming whichever is missing rather than letting the step skip.
      registry-key:
        description: An instance key (mwi_…) holding a whole-source grant on each upstream (upstream-seed via registry-url).
        required: false
      azure-client-id:
        description: Client id of the Azure identity that can read the portals' storage (upstream-seed only).
        required: false
      azure-tenant-id:
        description: Tenant of that identity (upstream-seed only).
        required: false
      azure-subscription-id:
        description: Subscription of that identity (upstream-seed only).
        required: false
      stage-repo-app-id:
        description: >
          App id of a GitHub App installed on stage-repo's org with Contents: Read (needed only
          when stage-modules is set). Replaces the former stage-repo-token PAT: an installation
          token is minted per run and scoped to stage-repo alone, so it cannot rot the way a
          stored PAT does — and, unlike a PAT, it resolves for dependabot-triggered runs once
          provisioned in the caller's Dependabot secret store as well (#2249).
        required: false
      stage-repo-app-private-key:
        description: Private key (PEM) of that App.
        required: false

jobs:
  test-repos:
    name: Compile + render node repos (MeshWeaver from ACR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write     # azure/login OIDC for upstream-seed — granted BY the caller, as for publish-bake
    steps:
      - uses: actions/checkout@v7
        with:
          # The affected computation diffs against the PR base — it needs the base commits.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compute the affected module closure
        id: affected
        env:
          NARROWING: ${{ inputs.affected-narrowing }}
        # 🎯 PRs gate only the AFFECTED dependency closure — changed modules, plus every
        # transitive DEPENDENT, plus the affected set's own dependencies (the fresh gate mesh
        # needs them present to install and to resolve `shared=@…`).
        # 🚨 FAIL LOUD: `set -euo pipefail` — an errored computation fails the job; the script
        # itself refuses an empty diff, so a wrong empty set can never pass as "nothing to test".
        run: |
          set -euo pipefail
          if [ "$NARROWING" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/affected-modules.py \
              --range "origin/${{ github.base_ref }}...HEAD" --json > affected.json
          else
            echo "${{ github.event_name }} on ${{ github.ref_name }} — full run (narrowing applies only to PR diffs)"
            echo '{"mount": [], "runAll": true}' > affected.json
          fi
          {
            echo "mount=$(jq -r '.mount | join(" ")' affected.json)"
            echo "run_all=$(jq -r '.runAll' affected.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to the image registry
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: >
          echo "${{ secrets.acr-password }}" |
          docker login "${TEST_IMAGE%%/*}" -u "${{ secrets.acr-username }}" --password-stdin
      # Cross-repo `requires` must resolve for the package roots to bind — the tester installs
      # whatever the mount holds, so the required modules are STAGED into it, exactly like
      # production resolves the requires from the store's package sources.
      # 🚨 Assert the staging inputs BEFORE minting, so a missing one fails RED naming what to
      # provision rather than surfacing as an opaque create-github-app-token or checkout error two
      # steps later (Copilot review, #2310). The `if:` is on the declared INPUT stage-modules —
      # i.e. whether staging was requested at all — never on whether a secret happens to be set,
      # which is the skip-trapdoor AGENTS.md forbids.
      - name: "Preflight: the stage-repo credentials must be provisioned"
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
          STAGE_APP_ID: ${{ secrets.stage-repo-app-id }}
          STAGE_APP_KEY: ${{ secrets.stage-repo-app-private-key }}
        run: |
          set -euo pipefail
          missing=()
          case "${STAGE_REPO:-}" in
            "")  missing+=("stage-repo (input) — owner/name of the repo modules are staged from") ;;
            */*) : ;;
            *)   missing+=("stage-repo (input) — must be owner/name, got '${STAGE_REPO}'") ;;
          esac
          [ -n "${STAGE_APP_ID:-}" ]  || missing+=("stage-repo-app-id (secret) — app id of a GitHub App able to read ${STAGE_REPO:-the stage repo}")
          [ -n "${STAGE_APP_KEY:-}" ] || missing+=("stage-repo-app-private-key (secret) — that App's private key, PEM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::stage-modules is set, so the cross-repo staging inputs are required:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            # 🚨 The store split that made every satellite dependabot PR red (#2249).
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::This run reads the DEPENDABOT secret store, not Actions — provision the pair there too (#2249)."
            fi
            exit 1
          fi
          echo "Staging ${STAGE_REPO} — credentials present."

      # 🚨 A PAT here was a permanent two-way failure. It rots — the platform's own copy went
      # HTTP 401 and a daily check never ran once (#1709) — and, because GitHub hands a
      # dependabot-triggered run the DEPENDABOT secret store rather than the Actions one, a PAT
      # provisioned for normal runs left every dependabot PR in every satellite permanently RED
      # (#2249). An installation token is minted here, per run, scoped to stage-repo alone.
      - name: Resolve the stage repo's owner and name
        id: stage-repo-parts
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
        run: |
          set -euo pipefail
          echo "owner=${STAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${STAGE_REPO##*/}"  >> "$GITHUB_OUTPUT"
      - name: Mint an installation token for the stage repo
        id: stage-token
        if: inputs.stage-modules != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.stage-repo-app-id }}
          private-key: ${{ secrets.stage-repo-app-private-key }}
          owner: ${{ steps.stage-repo-parts.outputs.owner }}
          repositories: ${{ steps.stage-repo-parts.outputs.name }}
          permission-contents: read
      # ─────────── Step 2 of the plugin build contract: INSTALL the upstreams ───────────
      # Fetch the caller's upstream publications — the sealed bundles baked for the EXACT framework
      # identity this gate's image resolves — into a seed directory the tester consumes. This is
      # what makes "install my dependencies" an install rather than a rebuild: the tester stands
      # its mesh up on the upstream's baked bytes and node definitions, and its Shortfall verdict
      # REFUSES a run that compiled what it was handed. See Doc/Architecture/PluginBuildContract.
      #
      # 🚨 Fails RED, never skips. A named upstream with no sealed publication for this identity
      # is not "nothing to seed" — it is a gate about to compile its dependency and pass, which
      # is indistinguishable from a gate that installed it (BakeSeed's own warning).
      - name: "Preflight: the upstream-seed credentials must be provisioned"
        if: inputs.upstream-seed != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.azure-client-id }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.azure-subscription-id }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          missing=()
          if [ -n "${REGISTRY_URL:-}" ]; then
            [ -n "${REGISTRY_KEY:-}" ] || missing+=("registry-key (secret) — registry-url is set, so the fetch is over HTTPS with an instance key")
          else
            [ -n "${AZURE_CLIENT_ID:-}" ]       || missing+=("azure-client-id (secret)")
            [ -n "${AZURE_TENANT_ID:-}" ]       || missing+=("azure-tenant-id (secret)")
            [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] || missing+=("azure-subscription-id (secret)")
            [ -n "${TARGETS:-}" ]               || missing+=("bake-publish-targets (input) — the storage target to read the upstream publication from")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::upstream-seed is set but missing: ${m}"; done
            echo "::error::upstream-seed cannot fetch a publication without these. This job fails RED rather than skipping the seed: a gate that silently compiled its upstream would look exactly like one that installed it."
            exit 1
          fi
      - name: Azure login (OIDC) for the upstream publication
        if: inputs.upstream-seed != '' && inputs.registry-url == ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      - name: Resolve the framework identity this gate's image resolves
        if: inputs.upstream-seed != ''
        id: seed-identity
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          # The SAME image reference the tester step composes below — pinned by digest when one
          # is given — so the identity the seed is addressed to is the identity that will consume it.
          if [ -n "${IMAGE_DIGEST:-}" ]; then IMAGE="${TEST_IMAGE%%:*}@${IMAGE_DIGEST}"; else IMAGE="$TEST_IMAGE"; fi
          line=$(docker run --rm --init --entrypoint /app/mw-plugin-test "$IMAGE" --print-framework-identity)
          identity="${line#*identity=}"; identity="${identity%% *}"
          [ -n "$identity" ] || { echo "::error::could not resolve a framework identity from the gate image (got: '$line') — cannot address an upstream publication"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "this gate resolves framework identity $identity; upstream bundles must be sealed under it"
      - name: Fetch the upstream publications into the seed directory
        if: inputs.upstream-seed != ''
        id: seed
        env:
          UPSTREAMS: ${{ inputs.upstream-seed }}
          IDENTITY: ${{ steps.seed-identity.outputs.identity }}
          TARGETS: ${{ inputs.bake-publish-targets }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          SEED_DIR="${RUNNER_TEMP:-/tmp}/upstream-seed"
          mkdir -p "$SEED_DIR"
          if [ -n "${REGISTRY_URL:-}" ]; then
            # The REGISTRY serves the sealed publication (MeshWeaver#2487) — HTTPS + instance key,
            # no Azure, works on pull_request. Fails RED on 404 (unsealed) or 401/403 (no grant).
            fetched=0
            for src in $UPSTREAMS; do
              base="${REGISTRY_URL%/}/api/plugins/bundles/prebuilt/$IDENTITY/$src"
              code=$(curl -sS -o "$SEED_DIR/.index.json" -w '%{http_code}' -H "Authorization: Bearer $REGISTRY_KEY" "$base")
              case "$code" in
                200) ;;
                404) echo "::error::upstream '$src' has no SEALED publication on $REGISTRY_URL for identity $IDENTITY. Not compiling it instead."; exit 1 ;;
                401|403) echo "::error::the registry refused registry-key for '$src' ($code) — the instance needs a whole-source grant '$src/*'."; exit 1 ;;
                *) echo "::error::registry answered $code for $base — refusing."; exit 1 ;;
              esac
              for name in $(jq -r '.bundles[]' "$SEED_DIR/.index.json"); do
                curl -sSf -H "Authorization: Bearer $REGISTRY_KEY" -o "$SEED_DIR/$name" "$base/$name" || { echo "::error::could not fetch $name"; exit 1; }
                fetched=$((fetched+1))
              done
              rm -f "$SEED_DIR/.index.json"
              echo "upstream '$src': fetched from $REGISTRY_URL"
            done
            printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
            [ "$fetched" -gt 0 ] || { echo "::error::sealed but empty — refusing an empty seed"; exit 1; }
            echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The FIRST target is read — every target holds the same publication (publish-bake
          # writes them all-or-nothing), so one read is the set.
          target=$(printf '%s\n' $TARGETS | head -1)
          account="${target%%/*}"; rest="${target#*/}"
          share="${rest%%/*}"; base=""
          case "$rest" in */*) base="${rest#*/}" ;; esac
          fetched=0
          for src in $UPSTREAMS; do
            dir="${base:+$base/}prebuilt-bundles/$IDENTITY/$src"
            # EXISTENCE FIRST, fail CLOSED (the publish script's own rule): an unreadable answer
            # is not "absent", and absent is a red gate, not an empty seed.
            sealed=$(az storage file exists --account-name "$account" --share-name "$share" \
              --path "$dir/_complete" --auth-mode login --backup-intent --query exists -o tsv --only-show-errors 2>/dev/null || echo unknown)
            if [ "$sealed" != "true" ]; then
              echo "::error::upstream '$src' has no SEALED publication under $account/$share/$dir for framework identity $IDENTITY (exists=$sealed). This gate cannot install its dependency and will not compile it instead. The upstream's own publish-bake for this identity re-enables this run."
              exit 1
            fi
            az storage file download-batch --account-name "$account" --share-name "$share" \
              --source "$share/$dir" --destination "$SEED_DIR" --pattern '*.zip' \
              --auth-mode login --backup-intent --only-show-errors > /dev/null
            n=$(ls "$SEED_DIR"/*.zip 2>/dev/null | wc -l | tr -d ' ')
            echo "upstream '$src': $n bundle(s) from $account/$share/$dir"
            fetched=$((fetched + n))
          done
          # The tester keys a seed to this file; without it the seed is refused as unaddressable.
          printf '%s' "$IDENTITY" > "$SEED_DIR/framework-mvid.txt"
          [ "$fetched" -gt 0 ] || { echo "::error::upstream publications were sealed but held no bundles — refusing an empty seed"; exit 1; }
          echo "dir=$SEED_DIR" >> "$GITHUB_OUTPUT"
      - name: Stage cross-repo modules
        if: inputs.stage-modules != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.stage-repo }}
          token: ${{ steps.stage-token.outputs.token }}
          path: cross-repo-stage
          sparse-checkout: ${{ inputs.stage-modules }}
      - name: Import + compile + render + run tests for each node repo
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          STAGE_MODULES: ${{ inputs.stage-modules }}
          ALLOW_FILE: ${{ inputs.allow-file }}
          AFFECTED_MOUNT: ${{ steps.affected.outputs.mount }}
          AFFECTED_RUN_ALL: ${{ steps.affected.outputs.run_all }}
          # Empty unless upstream-seed fetched a publication — then the tester consumes it.
          SEED_DIR: ${{ steps.seed.outputs.dir }}
        # Allow entries whose module is not mounted on a narrowed run are "unverifiable" —
        # warned, never failed — so narrowing cannot trip the ratchet. On a narrowed run the
        # affected closure is STAGED into its own tree and mounted as /repo — the tester gates
        # every package it discovers, so the mount IS the filter.
        run: |
          set -euo pipefail
          if [ "$AFFECTED_RUN_ALL" = "true" ]; then
            REPO_MOUNT="$GITHUB_WORKSPACE"
            ALLOW_PATH="${ALLOW_FILE:+/repo/$ALLOW_FILE}"
            echo "full run: gating every module"
          elif [ -z "$AFFECTED_MOUNT" ]; then
            echo "no module content affected (see the affected computation above) — nothing for the gate to test"
            exit 0
          else
            REPO_MOUNT="${RUNNER_TEMP:-/tmp}/gate-stage"
            mkdir "$REPO_MOUNT"
            for m in $AFFECTED_MOUNT; do cp -R "$GITHUB_WORKSPACE/$m" "$REPO_MOUNT/"; done
            ALLOW_PATH=""
            if [ -n "${ALLOW_FILE:-}" ]; then
              cp "$GITHUB_WORKSPACE/$ALLOW_FILE" "$REPO_MOUNT/"
              ALLOW_PATH="/repo/$(basename "$ALLOW_FILE")"
            fi
            echo "narrowed run: gating $AFFECTED_MOUNT"
          fi
          # Staged modules join the mount so every package's requires resolve. On the full-run
          # path the workspace IS the mount — cross-repo-stage/ itself has no root index.json,
          # so the tester never treats it as a module; only the copied module dirs count.
          for m in ${STAGE_MODULES:-}; do
            cp -R "$GITHUB_WORKSPACE/cross-repo-stage/$m" "$REPO_MOUNT/"
          done
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            IMAGE="${TEST_IMAGE%%:*}@${IMAGE_DIGEST}"
          elif [ "${{ inputs.allow-unpinned }}" = "true" ]; then
            IMAGE="$TEST_IMAGE"
            echo "gating against ${TEST_IMAGE} verbatim (allow-unpinned — runs are not reproducible)"
          else
            echo "::error::image-digest is empty and allow-unpinned is not set — pin a digest (reproducible) or opt in to following the tag."
            exit 1
          fi
          ALLOW_ARGS=()
          [ -n "${ALLOW_PATH:-}" ] && ALLOW_ARGS=(--allow "$ALLOW_PATH")
          DUMP_ARGS=()
          if [ "${{ inputs.capture-coredumps }}" = "true" ]; then
            mkdir -p "${RUNNER_TEMP:-/tmp}/coredumps"
            chmod 0777 "${RUNNER_TEMP:-/tmp}/coredumps"
            DUMP_ARGS=(-v "${RUNNER_TEMP:-/tmp}/coredumps:/coredumps"
              --cap-add=SYS_PTRACE
              -e DOTNET_DbgEnableMiniDump=1
              -e DOTNET_DbgMiniDumpType=2
              -e DOTNET_DbgMiniDumpName=/coredumps/%e-%p.dmp)
          fi
          # 🚨 `--init` is not cosmetic: without it the tester is the container's PID 1, and a
          # PID-namespace init with SIG_DFL for SIGABRT is SIGNAL_UNKILLABLE — the kernel DISCARDS
          # the signal the .NET runtime raises to end a crashed process. `abort()` then falls
          # through to its trap instruction, the runtime's SIGTRAP handler returns to the very
          # instruction that trapped, and the process SPINS at 100% CPU forever instead of exiting
          # (#1741: two such containers "Up" 36 and 57 minutes each, having printed one exception
          # in their first second). On CI that reads as a hang and burns the job's whole timeout
          # rather than reporting the crash. With `--init` the tool runs as PID 2 under tini and a
          # crash exits 134 immediately. The tester itself no longer lets an exception escape
          # `Main`, but this covers what a `catch` cannot — a stack overflow, an OOM abort, an
          # unhandled throw on a background thread.
          # Step 2 of the plugin build contract: hand the tester the upstream seed, mounted
          # read-only. The tester checks it BEFORE the mesh boots (BakeSeed.Read — a seed it
          # cannot consume is a usage error, exit 2, never a green gate) and REFUSES a run that
          # compiled a type the seed declared (BakeSeedConsumer.Shortfall).
          SEED_ARGS=()
          if [ -n "${SEED_DIR:-}" ]; then
            SEED_MOUNT=(-v "$SEED_DIR:/seed:ro")
            SEED_ARGS=(--seed /seed)
          else
            SEED_MOUNT=()
          fi
          docker run --rm --init -v "$REPO_MOUNT:/repo" "${SEED_MOUNT[@]}" "${DUMP_ARGS[@]}" \
            --entrypoint /app/mw-plugin-test "$IMAGE" /repo \
            "${ALLOW_ARGS[@]}" "${SEED_ARGS[@]}"
      # 🚨 The dump is written by the CONTAINER, which runs as root, so the file lands owned by
      # root with a restrictive mode — a core dump can contain anything that was in memory, so the
      # runtime writes it 0600 on purpose. `chmod 0777` on the mount DIRECTORY (above) lets the
      # container create the file; it does nothing for the file's own permissions. So
      # upload-artifact, which runs as the unprivileged `runner` user, failed with
      #
      #     Error: EACCES: permission denied, open '.../coredumps/mw-plugin-test-7.dmp'
      #
      # and the job then died in zip creation. Every crash produced exactly the evidence needed to
      # diagnose it and then threw it away — which is why MeshWeaver.Reinsurance#98 stayed
      # "different NodeTypes park on different runs" for weeks instead of being read as the SIGSEGV
      # (exit 139) it actually is.
      #
      # `if: always()` because the only runs with a dump are the ones where the gate FAILED.
      - name: Make core dumps readable by the uploader
        if: always() && inputs.capture-coredumps
        shell: bash
        run: |
          dir="${RUNNER_TEMP:-/tmp}/coredumps"
          [ -d "$dir" ] || exit 0
          # Not `|| true`: if a dump exists and cannot be made readable, say so here rather than
          # letting the upload fail three steps later with a message about zip creation.
          sudo chown -R "$(id -u):$(id -g)" "$dir"
          sudo chmod -R u+rw "$dir"
          ls -l "$dir" || true

      - name: Upload core dumps (if the gate crashed)
        if: always() && inputs.capture-coredumps
        uses: actions/upload-artifact@v7
        with:
          name: gate-coredumps
          path: ${{ runner.temp }}/coredumps
          if-no-files-found: ignore
          retention-days: 15
