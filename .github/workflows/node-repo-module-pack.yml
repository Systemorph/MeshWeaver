name: node-repo module pack

# The MODULE half of a mixed package, packed and (on trunk) handed to the registry — reusable from
# any node repo, because every satellite that owns a module drives the same packer the platform
# does. One matrix entry per module, so a repo that owns twelve of them does not grow twelve jobs.
#
# 🚨 The bundle's identity comes from the CONTENT side, never from workflow inputs: the released
# SemVer from `{package}/manifest.lock` and the landing floor from `{package}/index.json`'s
# `content.minMeshVersion` — the ONE declaration `NodeRepoPackageSource` reads. The job asserts
# that `content.module` names the module it is packing, so the two halves of a mixed package
# cannot drift apart silently.
#
# ─────────────────────────────── Caller contract ───────────────────────────────
# 🚨 THE MODULE LANE MUST FOLLOW THE RELEASE, exactly as the bundle bake does (#2088). A module is
# built against a platform PIN. When the platform releases, the pin moves and the module must be
# rebuilt AND republished, or every portal reads `FrameworkDeclined (built against <old>, live
# <new>)` and adopts nothing — which is what both prod portals said after ci.5050. The rebuild
# already happened there: the repo's release-follow schedule ran it. What threw it away was the
# caller passing `publish: ${{ github.event_name == 'push' }}`, so a scheduled run packed, versioned
# and inspected the bundles and handed them to nobody. Module adoption then stayed broken until an
# unrelated push to the plugin repo republished by accident.
#
# So `publish` is TRUNK-ONLY, not PUSH-ONLY. A caller wires it exactly like node-repo-publish-bake:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#     repository_dispatch:
#       types: [meshweaver-framework-released]
#     # 🚨 REQUIRED, not optional — the dispatch above has never been armed and the cross-repo PAT
#     # it needed was removed on purpose (2026-08-21), so THIS POLL is how a satellite learns a
#     # release happened. Stagger the minute per repo.
#     schedule:
#       - cron: "17,47 * * * *"
#
#   # Share the dispatch's concurrency lane: a scheduled run carries the DEFAULT BRANCH ref, so in
#   # a plain `github.ref` group a poll can cancel a main run mid-publish.
#   concurrency:
#     group: ${{ github.workflow }}-${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'framework-release' || github.ref }}
#     cancel-in-progress: true
#
#   module-pack:
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-module-pack.yml@<40-char platform sha>
#     with:
#       publish: >-
#         ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
#             || github.event_name == 'repository_dispatch'
#             || github.event_name == 'schedule' }}
#     secrets: { publish-token: ${{ secrets.PLUGIN_REGISTRY_PUBLISH_TOKEN }} }
#
# ─────────────────────────── Narrowing (the `select` job) ───────────────────────────
# 🚨 "in plugins we only re-run concerned modules ⇒ we can estimate the required count and
# validate it" · "all plugins should only re-build what changed" · "there is always a notion of
# 'full rebuild' when the platform updates".
#
# The matrix is no longer the caller's literal list on every event: `select` runs
# .github/scripts/node-repo-scope.py over the diff and hands `pack` the entries it can reach.
# MeshWeaver.Plugins ran 29 module builds on every push of every PR, whichever file moved.
#
# 🚨 ONLY `pull_request` / `merge_group` NARROW. A push, a framework-release dispatch, the release
# poll and a manual dispatch all pack the FULL set — a module is built against a platform pin, and
# when that pin moves every bundle must be rebuilt and republished or every portal reads
# FrameworkDeclined and adopts nothing (#2088). The scope script names which fallback it took, in
# the log and in the job summary; every uncertainty resolves to FULL.
#
# 🚨 AND THE COUNT IS ASSERTED. A dynamic matrix cannot be a fixed list of required contexts — the
# per-module contexts come and go with the diff — so the SELECTION is what gets checked instead:
# every pack job drops a receipt, and `verify` (one stable context, present on every run) fails if
# the receipts and the selection disagree. That is invariant #4 for a matrix allowed to change
# size, and it is the only reason a narrowed matrix is safe to require.
#
# A caller that ships neither scripts/affected-modules.py nor scripts/project-closure.py is simply
# not narrowable: the scope script says FULL and says why. Nothing to opt into, nothing to skip.
#
# ──────────── The .NET SDK is a DECLARED need (`dotnet-sdk`) ────────────
# 🚨 "make installing dotnet sdk a feature flag" (maintainer, 2026-08-31).
#
# `actions/setup-dotnet` used to run in this job the way it runs in every job in the fleet: as a
# reflex, before anyone asked whether the job compiles anything. That is the wrong shape the moment
# a module can be compiled by the platform IMAGE instead (`"build": "container"`, see above) —
# because "the SDK is here" then silently answers a question nobody put: an unconverted step keeps
# working on a runner SDK that the converted lane was supposed to have removed.
#
# So the install is now DECLARED, in two halves that must both be read to know what happened:
#
#   * `dotnet-sdk: install` (the DEFAULT) — install it, unconditionally. A caller that says nothing
#     gets exactly today's behaviour, and a lane ADDED tomorrow inherits it. Opting out is a
#     deliberate edit; drifting out is impossible.
#   * `dotnet-sdk: by-declaration` — install it only if this job's own declared consumers still
#     need it. Today they are: the compiler for any entry that is not `build: container`; the
#     module-pack tool, which is `dotnet build` + `dotnet run` in EVERY mode; a `build: container`
#     entry's binding-identity probe; and the module's own `dotnet test` suite when it ships one.
#     🚨 So NO entry can drop the SDK yet, container or not — the packer alone keeps every pack job
#     on it. That is not a placeholder, it is the measured state, and the log says it every run.
#     The lane converts when the packer moves inside the platform image, not before.
#   * anything else, the empty string included — RED. A flag that cannot be read resolving to
#     "skip" is precisely the trapdoor this whole family of gates exists to forbid.
#
# 🚨 IT IS NOT A SKIP-TRAPDOOR, and three things make that structural rather than hoped-for:
#   1. The DECISION step is unconditional — it runs on every event, in every mode, and it FAILS on
#      an unreadable policy. Only `actions/setup-dotnet` itself carries an `if:`, and skipping an
#      installer is not skipping a check: every build, pack, inspect and test step below still runs
#      and still gates. The flag chooses a COMPILER; it never chooses whether to verify.
#   2. When the answer is "no SDK", the job does not merely decline to install one — it PUTS A
#      FAILING `dotnet` ON PATH. GitHub's ubuntu runners ship an SDK of their own, so "we skipped
#      setup-dotnet" would otherwise mean "we quietly built against whatever .NET the image happens
#      to carry", which is the same class of lie as a skipped gate rendering a green tick.
#   3. The path taken is printed in the log AND in the job summary on EVERY run, with the consumers
#      enumerated by name — including when the answer is "install", so the two outcomes cannot be
#      told apart only by what is missing.
#
# Republishing is SAFE to repeat, which is why the schedule may simply publish rather than
# first proving something changed: the registry is keyed by `{package}@{version}` from
# `manifest.lock`, so a rebuild of an unchanged version overwrites the same slot with equivalent
# bytes. There is no `_complete` sentinel to shrink here — unlike the prebuilt-bundle bake, this
# lane uploads one independent bundle per module and never seals a listing, so a partial run costs
# only the modules it did not reach, never the ones it did.

on:
  workflow_call:
    inputs:
      modules:
        description: >
          JSON array of {package, module, project}: the Store package id, the module's entry
          assembly name, and the csproj to build. e.g.
          [{"package":"SocialMedia","module":"MeshWeaver.Social","project":"src/MeshWeaver.Social/MeshWeaver.Social.csproj"}]
        required: true
        type: string
      platform-ref:
        description: The Systemorph/MeshWeaver commit the modules build against (a pin, not a branch).
        required: true
        type: string
      publish:
        description: >
          Hand the packed bundles to the registry. TRUNK-ONLY, not push-only — a PR packs and
          inspects and never publishes, but a release-follow schedule or repository_dispatch run
          MUST publish or the rebuild it just did is discarded and every portal stays on
          FrameworkDeclined (#2088). See the caller contract at the top of this file.
        type: boolean
        default: false
      always-modules:
        description: >
          Comma-separated module names (entry assembly names from `modules`) that the caller's
          gates COMPOSE on every run — the AI engine that registers Skill/Agent, a carved-out
          module the content binds. A narrowed PR run keeps them in the selection regardless of
          the diff, so the gate's inputs exist unconditionally; a name the matrix lacks makes the
          selection fall back to the full set and say why.
        type: string
        required: false
        default: ''
      platform-image:
        description: >
          The PORTAL image the modules will load into (e.g. meshweaver.azurecr.io/memex-portal-ai).
          With platform-image-digest set, each module compiles against that image's /app assemblies
          instead of rebuilding the platform closure from platform-ref source — the maintainer's
          "take the image from build, not build its own; only upon core rebuild" (2026-08-29):
          reference set = runtime set, no platform build in the module lane, and a platform change
          is exactly a pin move. The tester image is NOT sufficient (no Hosting.AspNetCore / Blazor /
          Blazor.Views). Empty (the default) keeps the source build.
        type: string
        required: false
        default: ''
      platform-image-digest:
        description: >
          The digest (sha256:…) of platform-image to compile against — the promoted set's MULTI-ARCH
          manifest-list digest (immutable, never re-tagged), pulled as linux/amd64 below. Record the
          x64 framework identity beside the pin in the caller (mw-plugin-test --print-framework-identity
          on the linux-x64 member) so a mismatch is diagnosable by eye. Empty = build from source.
        type: string
        required: false
        default: ''
      registry-source:
        description: >
          The registry SOURCE these packages belong to ("Plugins", "Education", …) — it stamps the
          landed entry's packagePath, which is the key every PluginGrant and the bundle index match
          on. An unstamped landing is servable to nobody.
        type: string
        required: false
        default: Plugins
      registry-url:
        description: The registry that will serve these bundles onward.
        type: string
        default: https://memex.meshweaver.cloud
      content-repository:
        description: >-
          The repository whose packages are packed. Empty = the caller (today's behaviour). The
          platform's CD sets it to Systemorph/MeshWeaver.Plugins: Plugins is built WITH the
          platform, so its module bundles for a new framework identity come out of the same run.
        required: false
        type: string
        default: ''
      content-ref:
        description: The ref of content-repository to pack. Empty = the caller's own commit.
        required: false
        type: string
        default: ''
      dotnet-sdk:
        description: >
          FEATURE FLAG — whether the pack job installs the .NET SDK on the runner. See "The .NET
          SDK is a DECLARED need" at the top of this file.

          `install` — the DEFAULT, and what a caller that says nothing inherits: setup-dotnet runs
          unconditionally, exactly as it always has.

          `by-declaration` — install it only when a consumer in THIS job still needs it. The
          consumers are enumerated in the log and the job summary on every run, whichever way the
          decision goes, so a green log can never leave "the SDK compiled it" and "the image
          compiled it" indistinguishable.

          Any other value — the empty string included — is RED. A flag that cannot be read must
          never resolve to "skip".
        required: false
        type: string
        default: install
    secrets:
      publish-token:
        description: The registry's Plugins:Registry:PublishToken. Required when publish is true.
        required: false
      acr-username:
        description: Pull credential for platform-image's registry. Required when platform-image-digest is set.
        required: false
      acr-password:
        description: Pull credential for platform-image's registry. Required when platform-image-digest is set.
        required: false
      content-app-id:
        description: >-
          App id of a GitHub App with Contents: Read on content-repository. Required whenever
          content-repository is set (the caller's GITHUB_TOKEN cannot read another repository);
          asserted RED before the checkout, never skipped.
        required: false
      content-app-private-key:
        description: Private key (PEM) of that App.
        required: false
    outputs:
      bundles-built:
        description: >
          "true" when EVERY selected module bundle exists as an artifact — the module-built-<module>
          markers, dropped right after the bundle upload and BEFORE the tests. This is the claim a
          caller's gate should depend on when it only COMPOSES the bundles: a red suite in this call
          must not read as "bundle missing" there (Plugins #937 — one AI flake turned both required
          gates red). The lane's own stable context (`All selected bundles built`) still asserts the
          receipts AND the pack job's result, so a failed suite keeps the lane red wherever the lane
          itself is required.
        value: ${{ jobs.verify.outputs.bundles-built }}

jobs:
  # ─────────────────────── WHICH BUNDLES THIS DIFF CAN REACH ───────────────────────
  # One place decides, out loud. It never skips a gate: its two answers are "pack these" and
  # "pack everything", and it takes the second whenever it cannot be sure of the first.
  select:
    name: Select the affected bundles
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.scope.outputs.modules }}
      count: ${{ steps.scope.outputs.count }}
      selected: ${{ steps.scope.outputs.selected }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # 🚨 The caller goes in its OWN directory, not the workspace root. Node packages are
      # discovered as "top-level dirs carrying an index.json", and the platform checkout below
      # lands INSIDE the workspace — clone core to the root beside the caller's content and the
      # selector is one `index.json` away from treating the framework as a plugin of this repo.
      # gen-manifests.py already carries "meshweaver" in its SKIP set for exactly this reason;
      # keeping the two trees apart is the version that cannot rot.
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository:
      # Systemorph/MeshWeaver.Plugins` (private) answers 404 under it — the platform's first release
      # wave died on exactly that (main-cd run 33276813173, 2026-08-29). When content-repository is
      # set, the App credential is ASSERTED red, never fallen back on: a fallback to github.token
      # would 404 anyway, one step later and blaming the checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
          path: repo
          # 🚨 The diff is taken against the PR base, so the base commits must be present. A
          # shallow clone would make every range unresolvable — which the scope script turns into
          # a FULL pack rather than an empty one, but silently paying for 29 jobs is not the plan.
          fetch-depth: 0
      # The scope script is the PLATFORM's (one implementation, every repo), read from the same
      # checkout the pack jobs make at platform-ref — so a workflow newer than the checkout can
      # never call a script the checkout does not have (run 33073476996's exact failure).
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 The selection logic owes its own proof that it can say no AND that every fallback still
      # falls back. It runs here, on every run, next to the answer it produces — a selector whose
      # self-test is only run by someone remembering to is a selector nobody checks.
      - name: The selection can say no (self-test)
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/node-repo-scope.py --self-test
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py --self-test
      - name: Decide which module bundles this diff can reach
        id: scope
        env:
          MODULES: ${{ inputs.modules }}
          ALWAYS: ${{ inputs.always-modules }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # A merge_group run carries no `base_ref`; its base is on the event payload. Dormant
          # today (no repo here has a queue) and kept correct so enabling one narrows rather than
          # silently falling back to the full set.
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$MODULES" > "$RUNNER_TEMP/matrix.json"
          if [ -z "${BASE_REF:-}" ] && [ -n "${QUEUE_BASE_REF:-}" ]; then
            BASE_REF="${QUEUE_BASE_REF#refs/heads/}"
          fi
          if [ -n "${BASE_REF:-}" ]; then
            git -C repo fetch --no-tags origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          python3 meshweaver/.github/scripts/node-repo-scope.py \
            --for modules --root repo --modules "@$RUNNER_TEMP/matrix.json" \
            --event "$EVENT" --base-ref "${BASE_REF:-}" --always "${ALWAYS:-}" > "$RUNNER_TEMP/scope.json"

  pack:
    name: Module bundle (${{ matrix.entry.module }})
    needs: select
    runs-on: ubuntu-latest
    # 🚨 This is a MODE SWITCH on the selection's own output, not a skip-trapdoor: GitHub refuses
    # a matrix with no vectors, so an empty selection has to express itself as "this job does not
    # run". What makes it safe is that `verify` below runs UNCONDITIONALLY and asserts the pairing
    # — a zero count with receipts, or a non-zero count with a skipped pack job, is RED. Never
    # replace it with a condition that asks whether an input or a secret happens to be set.
    # (`select.result` too, not just the count: a FAILED select emits no count at all, and
    # `'' != '0'` is true — the matrix would then fail to evaluate instead of the verify job
    # naming the real cause.)
    if: needs.select.result == 'success' && needs.select.outputs.count != '0'
    strategy:
      # One module's failure must not hide the rest — a sweep wants every verdict in one run.
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.select.outputs.modules) }}
    steps:
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository:
      # Systemorph/MeshWeaver.Plugins` (private) answers 404 under it — the platform's first release
      # wave died on exactly that (main-cd run 33276813173, 2026-08-29). When content-repository is
      # set, the App credential is ASSERTED red, never fallen back on: a fallback to github.token
      # would 404 anyway, one step later and blaming the checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      # ═══════ THE .NET SDK — INSTALLED BECAUSE SOMETHING DECLARED IT, NOT BY REFLEX ═══════
      # 🚨 "make installing dotnet sdk a feature flag" (maintainer, 2026-08-31). The rationale and
      # the anti-trapdoor argument are at the top of this file, under "The .NET SDK is a DECLARED
      # need"; what follows is the decision itself.
      #
      # ONE step, UNCONDITIONAL, that always says which way it went and why. It enumerates the
      # consumers this job would hand to a runner SDK, applies the caller's policy, and — when the
      # answer is "none" — makes the absence REAL, because the runner ships an SDK of its own and a
      # silent fallback to it is the same class of lie as a skipped gate rendering a green tick.
      - name: Does this job need the .NET SDK?
        id: sdk
        env:
          POLICY: ${{ inputs.dotnet-sdk }}
          MODE: ${{ matrix.entry.build || 'sdk' }}
          MODULE: ${{ matrix.entry.module }}
          PROJECT: ${{ matrix.entry.project }}
          RUN_TESTS: ${{ matrix.entry.test != false }}
        run: |
          set -euo pipefail
          # EVERY consumer this job would hand to a runner SDK, named one by one and evaluated
          # against this entry — not a summary, an inventory. `build: container` (MeshWeaver#2854)
          # removes the COMPILER from it and NOTHING ELSE: the container path still reads the
          # emitted assembly's identity with a `dotnet run` file-based app, the packer is a
          # `dotnet build` + `dotnet run` in every mode, and a module that ships a test suite is a
          # `dotnet test` the image's build-project cannot do at all. An omission here is exactly
          # what would let a converted lane skip an install it needs and then blame the shim four
          # steps later, so the list is deliberately complete rather than convenient.
          consumers=()
          if [ "$MODE" = "container" ]; then
            echo "compiler: NOT a consumer — $MODULE declares build=container, so the pinned platform image compiles it"
            consumers+=("the binding-identity probe — the container path reads ${MODULE}.dll's AssemblyVersion with a 'dotnet run' file-based app")
          else
            consumers+=("the compiler for $MODULE — its matrix entry declares build=$MODE, i.e. 'dotnet build' + 'dotnet publish' on this runner")
          fi
          consumers+=("the module-pack tool — meshweaver/src/MeshWeaver.Plugin.Build is 'dotnet build' + 'dotnet run' in EVERY mode; until it ships inside the platform image, this one consumer alone keeps every pack job on the SDK")
          # Resolved against the tree, exactly as the test step below resolves it, so a module with
          # no suite does not carry a consumer it does not have.
          tests="$(dirname "$PROJECT").Test"
          if [ "$RUN_TESTS" = "true" ] && [ -d "$tests" ]; then
            consumers+=("the module's own suite — 'dotnet test $tests', a verb the image's build-project does not have at all")
          fi
          case "$POLICY" in
            install)
              install=true
              verdict="policy 'install' (the default) — installed whatever the consumers say"
              ;;
            by-declaration)
              if [ "${#consumers[@]}" -gt 0 ]; then install=true; else install=false; fi
              verdict="policy 'by-declaration' — ${#consumers[@]} declared consumer(s) in this job"
              ;;
            *)
              echo "::error::inputs.dotnet-sdk is '$POLICY'. The only values are 'install' (the default) and 'by-declaration'. An unreadable flag must NEVER resolve to 'do not install' — that is a skipped check wearing a green tick."
              exit 1
              ;;
          esac
          echo "declared consumers of a runner SDK in this job:"
          for consumer in ${consumers[@]+"${consumers[@]}"}; do echo "  • $consumer"; done
          if [ "$install" = true ]; then
            headline=".NET SDK on the runner: INSTALLED"
            echo "$headline — $verdict"
          else
            headline=".NET SDK on the runner: NOT INSTALLED"
            echo "$headline — $verdict; the pinned platform image is the only compiler in this job"
            # 🚨 Make the absence REAL. ubuntu-latest ships its own SDK, so declining to install one
            # is not the same as not having one: without this, a consumer nobody declared would
            # quietly build against whatever .NET the runner image happens to carry, and the log of
            # a converted lane would be indistinguishable from the log of an unconverted one.
            shim="$RUNNER_TEMP/no-dotnet"
            mkdir -p "$shim"
            cat > "$shim/dotnet" <<'SHIM'
          #!/usr/bin/env bash
          echo "::error::a step invoked 'dotnet $*', but this job declared dotnet-sdk: by-declaration and named no consumer that needs the .NET SDK, so none was installed. Either add that consumer to the 'Does this job need the .NET SDK?' step, or set dotnet-sdk: install on the caller. Falling back to the runner's preinstalled SDK is deliberately not an option — it would make a converted lane and an unconverted one look identical in a green log."
          exit 97
          SHIM
            chmod +x "$shim/dotnet"
            echo "$shim" >> "$GITHUB_PATH"
            echo "a FAILING 'dotnet' shim is on PATH ($shim) — nothing in this job can quietly use the runner's preinstalled SDK"
          fi
          echo "install=$install" >> "$GITHUB_OUTPUT"
          {
            echo "### $headline"
            echo
            echo "- flag: \`dotnet-sdk: $POLICY\` (default \`install\`)"
            echo "- compiler for \`$MODULE\`: \`$MODE\`"
            echo "- declared consumers of a runner SDK:"
            for consumer in ${consumers[@]+"${consumers[@]}"}; do echo "  - $consumer"; done
          } >> "$GITHUB_STEP_SUMMARY"
      # 🚨 The ONE `if:` this flag introduces, and it guards an INSTALLER, not a gate. Every build,
      # pack, inspect and test step below still runs and still gates whichever way it goes; when it
      # is skipped, the step above has already put a failing `dotnet` on PATH, so an undeclared
      # consumer goes RED naming the flag rather than silently using the runner's own SDK.
      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.install == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Read the package version + platform floor from the content half
        id: identity
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' "$PACKAGE/manifest.lock")
          floor=$(jq -er '.content.minMeshVersion' "$PACKAGE/index.json")
          declared=$(jq -er '.content.module' "$PACKAGE/index.json")
          if [ "$declared" != "$MODULE" ]; then
            echo "::error::$PACKAGE/index.json declares content.module='$declared' but this entry packs '$MODULE' — the two halves of the mixed package drifted"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "packing $MODULE as $PACKAGE@$version, platform floor $floor"

      # 🚨 THE PLATFORM IS THE IMAGE. When the caller pins platform-image-digest, the module is
      # compiled against the assemblies the portal actually runs (docker cp of /app, cached per
      # digest so a run pulls it once), and the platform checkout above serves only restore
      # (Directory.Packages.props, the test/ props) — no platform project is built here. The
      # caller's src/Directory.Build.targets must honour MeshWeaverRefs (Plugins #926); a caller
      # without it just builds from source as before, which is why this is additive.
      - name: Restore the platform image's assemblies from cache
        if: inputs.platform-image-digest != ''
        id: platform-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/platform-refs
          key: platform-refs-${{ inputs.platform-image-digest }}
      - name: Take the platform from the image (docker cp /app)
        if: inputs.platform-image-digest != '' && steps.platform-cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::platform-image-digest is set but platform-image is empty — name the image the digest belongs to"; exit 1; }
          [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::platform-image-digest is set but the acr-username/acr-password secrets are not passed — the image cannot be pulled"; exit 1; }
          echo "$ACR_PASSWORD" | docker login "${IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
          # 🚨 --platform linux/amd64 ALWAYS: framework identities are per-architecture build (the
          # ci.6469 manifest list resolves to s770d75c… on x64 and sfe27877f… on arm64), and the
          # bundles are sealed under the x64 identity the portals run. A multi-arch digest pulled on
          # an arm64 runner would compile against a platform the gates never test.
          # Strip a TAG only — a colon after the last slash. `${IMAGE%%:*}` would also eat a registry
          # port (registry:5000/repo) and `${IMAGE%:*}` would eat the path when there is no tag.
          case "${IMAGE##*/}" in *:*) IMAGE_NOTAG="${IMAGE%:*}" ;; *) IMAGE_NOTAG="$IMAGE" ;; esac
          cid=$(docker create --platform linux/amd64 "${IMAGE_NOTAG}@${DIGEST}")
          mkdir -p "$RUNNER_TEMP/platform-refs"
          docker cp "$cid:/app/." "$RUNNER_TEMP/platform-refs/"
          docker rm "$cid" >/dev/null
          shopt -s nullglob
          dlls=("$RUNNER_TEMP"/platform-refs/*.dll)
          n=${#dlls[@]}
          [ "$n" -gt 50 ] || { echo "::error::the image's /app yielded $n assemblies — not a platform image"; exit 1; }
          echo "platform refs: $n assemblies from ${IMAGE_NOTAG}@${DIGEST}"
      - name: Build the module (Release, warnings-as-errors)
        env:
          REFS: ${{ inputs.platform-image-digest != '' && format('{0}/platform-refs', runner.temp) || '' }}
        run: >
          dotnet build "${{ matrix.entry.project }}" -c Release -warnaserror
          -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          -p:Version=${{ steps.identity.outputs.version }}
          ${REFS:+-p:MeshWeaverRefs=$REFS}

      # Publish materializes the module's PACKAGE dependencies beside the entry DLL — the SDK's
      # own answer to the runtime closure (framework-trimmed packages excluded, everything else
      # included), which the pack step's --deps-closure derivation selects from. A
      # -p:CopyLocalLockFileAssemblies=true build was tried first and copied NOTHING on the CI
      # SDK while copying everything on a dev machine (2026-08-20, 12/14 jobs) — publish does not
      # depend on that flag at all.
      # 🚨 The SAME reference set as the build: --no-build re-evaluates the project, and without
      # -p:MeshWeaverRefs the platform ProjectReferences the build had dropped come back — publish
      # then copies their outputs, which were never built ("MSB3030: Could not copy
      # meshweaver/src/MeshWeaver.Graph/bin/Release/net10.0/MeshWeaver.Graph.dll", Plugins #940).
      - name: Publish the module (the closure the pack selects from)
        env:
          REFS: ${{ inputs.platform-image-digest != '' && format('{0}/platform-refs', runner.temp) || '' }}
        run: >
          dotnet publish "${{ matrix.entry.project }}" -c Release --no-build
          -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          -p:Version=${{ steps.identity.outputs.version }}
          ${REFS:+-p:MeshWeaverRefs=$REFS}

      - name: Build the module-pack tool
        run: dotnet build meshweaver/src/MeshWeaver.Plugin.Build/MeshWeaver.Plugin.Build.csproj -c Release

      - name: Pack the module bundle
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: >
          dotnet run --project meshweaver/src/MeshWeaver.Plugin.Build -c Release --no-build --
          module-pack "$GITHUB_WORKSPACE/$(dirname "$PROJECT")/bin/Release/net10.0/publish"
          --deps-closure
          --module-name "${{ matrix.entry.module }}"
          --plugin "${{ matrix.entry.package }}"
          --package-version "${{ steps.identity.outputs.version }}"
          --min-mesh-version "${{ steps.identity.outputs.floor }}"
          --own-platform "$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
          --out "$RUNNER_TEMP/bundles"

      # A bundle that PACKED is not yet a bundle that LANDS: assert the closure and the manifest a
      # consumer's landing gate will read, loudly, instead of trusting the packer's exit code.
      - name: Inspect the bundle (manifest + assemblies)
        id: bundle
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          FLOOR: ${{ steps.identity.outputs.floor }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundles/MeshWeaver.Plugin.$PACKAGE.$VERSION.module.nupkg"
          test -f "$bundle" || { echo "::error::bundle not found: $bundle"; exit 1; }
          unzip -o -q "$bundle" -d "$RUNNER_TEMP/inspect-$MODULE"
          test -f "$RUNNER_TEMP/inspect-$MODULE/meshweaver/modules/$MODULE.dll" \
            || { echo "::error::entry DLL missing from meshweaver/modules/"; exit 1; }
          manifest="$RUNNER_TEMP/inspect-$MODULE/meshweaver/manifest.json"
          jq -e --arg m "$MODULE" '.module.assemblyName == $m' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblyName is not $MODULE"; exit 1; }
          jq -e --arg d "$MODULE.dll" '.module.assemblies | index($d) != null' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblies misses the entry DLL"; exit 1; }
          jq -e --arg f "$FLOOR" '.module.minMeshVersion == $f' "$manifest" > /dev/null \
            || { echo "::error::manifest floor differs from content.minMeshVersion"; exit 1; }
          # A module bundle must NEVER carry a PLATFORM assembly beside its entry — it would
          # shadow the platform's own binary at the consumer (the same trap-door landing refuses
          # for the entry DLL). MODULE-OWNED MeshWeaver.* assemblies (their source lives in THIS
          # repo's src/, so they exist nowhere in /app — Import's DataSetReader family) are the
          # deliberate exception: for them, NOT riding is the fault. The jq mirrors the pack's
          # --own-platform set exactly, so the two cannot disagree about what "platform" means.
          # …EXCEPT the projects the repo lists in src/platform-shipped.txt: they live in its src/
          # yet ship in the portal IMAGE (the storage backends and transports that moved out of the
          # platform with the hosts), so a bundle carrying one would land a same-identity duplicate
          # beside the app's copy. ONE script computes the set for the pack AND for this check.
          own="$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
          jq -e --arg m "$MODULE" --arg own "$own" \
            '($own | split(";")) as $owned
             | [.module.assemblies[]
                | select(startswith("MeshWeaver.")
                    and (. != $m + ".dll") and (. != $m + ".pdb")
                    and ((rtrimstr(".dll") | rtrimstr(".pdb")) as $n | $owned | index($n) | not))]
             | length == 0' \
            "$manifest" > /dev/null \
            || { echo "::error::bundle carries platform (MeshWeaver.*) assemblies beside the module"; exit 1; }
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "bundle OK:"; jq . "$manifest"

      - name: Upload the bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-bundle-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/bundles/*.module.nupkg
          if-no-files-found: error

      # ───────────── THE BUILT MARKER — "the bundle exists", and nothing more ─────────────
      # Dropped the moment the bundle artifact is up, BEFORE the tests and the hand-over, so a
      # caller whose gates only COMPOSE this bundle can depend on the workflow's `bundles-built`
      # output instead of this job's result: a red suite here must not read as "bundle missing"
      # there. The receipt further down stays LAST — it still means the whole leg, tests and
      # publish included, got here.
      - name: Drop the built marker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/built"
          jq -n --arg p "${{ matrix.entry.package }}" --arg m "${{ matrix.entry.module }}" \
                --arg v "${{ steps.identity.outputs.version }}" \
             '{package:$p, module:$m, version:$v}' \
             > "$RUNNER_TEMP/built/${{ matrix.entry.module }}.json"
      - name: Upload the built marker
        uses: actions/upload-artifact@v7
        with:
          name: module-built-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/built/*.json
          if-no-files-found: error

      # 🚨 Only when THIS diff reaches the module (or on a full run): a floor-only entry — built
      # because the caller's gates compose it — carries test=false from the selection, and its
      # suite is skipped rather than answering a question nobody asked. The AI engine's suite
      # (~13 min, 1,600 tests) ran on every PR that never touched AI until 2026-08-29.
      # Runs AFTER the bundle artifact and its built marker exist and BEFORE the hand-over: a
      # failing suite never publishes — and never un-builds.
      - name: Run the module's tests, when it ships any
        if: ${{ matrix.entry.test != false }}
        env:
          PROJECT: ${{ matrix.entry.project }}
          # 🚨 THE TRAIL A FLAKE LEAVES. A red here on a diff that cannot reach the module is a
          # timing failure of the mesh under the runner's load, and the failure block alone cannot
          # say where the flow stopped (seven distinct AI.Test failures, one sentence each —
          # MeshWeaver.Plugins#941). So the run WRITES the evidence and the step below keeps it:
          #   • per-test file logs (MESHWEAVER_TEST_FILE_LOGS — Warning level, one file per test);
          #   • the MonolithMeshTestBase phase trace (/tmp/meshweaver-test-trace.log: INIT/TEST/
          #     DISPOSE phases per class, pid-tagged — a crash's last lines name the class);
          #   • the teardown-straggler captures (written beside the test assembly);
          #   • a mini dump when the host dies on a signal (exit 139 = SIGSEGV = use-after-unload).
          # None of it changes timing: the file logs are the same records the console gets, and
          # the dump is written only by a crash.
          MESHWEAVER_TEST_FILE_LOGS: "1"
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "2"
          DOTNET_DbgMiniDumpName: /tmp/coredumps/%e-%p.dmp
        run: |
          set -euo pipefail
          mkdir -p /tmp/coredumps
          # A module's tests relocate WITH it (the Approvals precedent). Conventional sibling:
          # src/<Module>.Test. Absent is fine; present and red is not.
          tests="$(dirname "$PROJECT").Test"
          if [ -d "$tests" ]; then
            dotnet test "$tests" -c Release -warnaserror \
              -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          else
            echo "no test project at $tests — nothing to run"
          fi

      # 🚨 Only on FAILURE, and only what a diagnosis needs: the failing suite's per-test logs, the
      # phase trace, the straggler captures and any dump. A green run uploads nothing — the point
      # is that the ONE red run in five leaves something to read instead of a re-run button.
      - name: Keep the failing suite's evidence
        if: ${{ failure() && matrix.entry.test != false }}
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: |
          set -uo pipefail
          tests="$(dirname "$PROJECT").Test"
          out="$RUNNER_TEMP/test-evidence"; mkdir -p "$out"
          find "$tests" -path '*/test-logs/*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            cp "$f" "$out/" || true
          done
          [ -f /tmp/meshweaver-test-trace.log ] && cp /tmp/meshweaver-test-trace.log "$out/_meshweaver-test-trace.log" || true
          [ -f /tmp/meshweaver-msg-trace.log ] && cp /tmp/meshweaver-msg-trace.log "$out/_meshweaver-msg-trace.log" || true
          if compgen -G '/tmp/coredumps/*.dmp' > /dev/null; then
            # The runtime writes a dump 0600; make it readable for the upload.
            sudo chmod a+r /tmp/coredumps/*.dmp || true
            cp /tmp/coredumps/*.dmp "$out/" || true
            dotnet --list-runtimes > "$out/_runtimes.txt" 2>/dev/null || true
          fi
          echo "kept $(ls "$out" | wc -l | tr -d ' ') file(s):"; ls -la "$out" | head -40
      - name: Upload the failing suite's evidence
        if: ${{ failure() && matrix.entry.test != false }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.entry.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-evidence
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      # 🚨 The hand-over. Without it a module that has LEFT the platform repo is packed, versioned,
      # inspected — and reaches nobody, because a registry serves only bytes it holds. A missing
      # token here FAILS the job rather than skipping quietly: "published nothing" and "published
      # fine" must never look the same (the same reason a gate may not skip green).
      - name: Hand the bundle to the registry
        if: ${{ inputs.publish }}
        env:
          TOKEN: ${{ secrets.publish-token }}
          REGISTRY: ${{ inputs.registry-url }}
          REGISTRY_SOURCE: ${{ inputs.registry-source }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::publish was requested but no publish-token secret was provided — the registry would never receive $MODULE, and this job would have reported success"
            exit 1
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/publish-$MODULE.json" -w '%{http_code}' \
            -X POST "$REGISTRY/api/plugins/bundles/$PACKAGE?version=$VERSION&packagePath=$REGISTRY_SOURCE/$PACKAGE" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$BUNDLE")
          echo "registry answered $code:"; cat "$RUNNER_TEMP/publish-$MODULE.json"; echo
          case "$code" in
            2*) echo "$MODULE@$VERSION is now served by $REGISTRY" ;;
            *)  echo "::error::registry refused $MODULE@$VERSION (HTTP $code)"; exit 1 ;;
          esac

      # ─────────────────────────── THE RECEIPT ───────────────────────────
      # 🚨 POSITIVE EVIDENCE THAT THIS LEG RAN. A skipped matrix leg renders with the same tick as
      # a passed one, so "this module was never packed" and "this module packed fine" are
      # indistinguishable on the checks wall — and a matrix whose size depends on a diff makes
      # that failure mode reachable rather than theoretical. `verify` counts these against the
      # selection and names whatever is missing. It is the LAST step on purpose: a receipt means
      # the whole leg, publish included, got here.
      - name: Drop the receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          jq -n --arg p "${{ matrix.entry.package }}" --arg m "${{ matrix.entry.module }}" \
                --arg v "${{ steps.identity.outputs.version }}" \
                --argjson pub '${{ inputs.publish }}' \
             '{package:$p, module:$m, version:$v, published:$pub}' \
             > "$RUNNER_TEMP/receipts/${{ matrix.entry.module }}.json"
          cat "$RUNNER_TEMP/receipts/${{ matrix.entry.module }}.json"
      - name: Upload the receipt
        uses: actions/upload-artifact@v7
        with:
          name: module-pack-receipt-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error

  # ═══════════════ THE COUNT GATE — one STABLE context, on every run ═══════════════
  # 🚨 A dynamic matrix cannot be a fixed list of required status checks: the per-module contexts
  # appear and disappear with the diff, so requiring one means requiring a context that will
  # legitimately never report — which is how a gate ends up not required at all and PRs merge past
  # it. This job is the answer: it is present on EVERY run whatever the diff, so it is the one
  # context a repo's protection should require for this lane, and it asserts that exactly the
  # selected bundles were built.
  #
  # `if: always()` because the failure it exists to catch is a SKIP, and a job that skips when the
  # thing it watches skipped watches nothing.
  verify:
    name: All selected bundles built
    needs: [select, pack]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      bundles-built: ${{ steps.verify.outputs.bundles_built }}
    steps:
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Absent receipts are the finding, so a download that matches nothing must NOT fail here —
      # it must reach the verifier, which says which module is missing. That is the whole point.
      - name: Collect the receipts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: module-pack-receipt-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Collect the built markers
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: module-built-*
          merge-multiple: true
          path: ${{ runner.temp }}/built
      - name: Exactly the selected bundles were built
        id: verify
        env:
          EXPECTED: ${{ needs.select.outputs.selected }}
          PACK_RESULT: ${{ needs.pack.result }}
          SCOPE: ${{ needs.select.outputs.scope }}
          COUNT: ${{ needs.select.outputs.count }}
          DECLARED: ${{ inputs.modules }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE, selection named $COUNT module bundle(s); pack job: $PACK_RESULT"
          # 🚨 An INDEPENDENT recount, because the count and the selection come from the same
          # call and therefore agree by construction — they cannot catch a selection that is
          # simply wrong. This one has a second source: on a FULL scope the answer must be every
          # entry the CALLER declared, counted here from `inputs.modules` rather than from
          # anything `select` produced.
          declared=$(jq 'length' <<< "$DECLARED")
          if [ "$SCOPE" = "full" ] && [ "$COUNT" != "$declared" ]; then
            echo "::error title=Module bundles incomplete::the scope is FULL, so every one of the \
          $declared declared module(s) must be packed — but the selection named $COUNT. The \
          selection and the caller's matrix disagree."
            echo "bundles_built=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 🚨 `select` itself failing must not read as "nothing was selected" — that would turn a
          # broken selector into a green wall with an empty matrix behind it.
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "::error title=Module bundles incomplete::the selection job reported \
          '${{ needs.select.result }}' — no module bundle was chosen, so none was built. Read that \
          job; nothing below can be trusted."
            echo "bundles_built=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 🚨 `--declared`: artifacts are RUN-wide, so when a repo calls this workflow twice in
          # one run (Plugins #932: a floor call the gates compose, and the rest) each verifier
          # downloads the OTHER call's receipts too. Only modules in THIS call's matrix count.
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py \
            --expected "$EXPECTED" \
            --receipts "$RUNNER_TEMP/receipts" \
            --pack-result "$PACK_RESULT" \
            --scope "$SCOPE" \
            --declared "$DECLARED" \
            --built "$RUNNER_TEMP/built" \
            --github-output "$GITHUB_OUTPUT"
