name: node-repo module pack

# The MODULE half of a mixed package, packed and (on trunk) handed to the registry — reusable from
# any node repo, because every satellite that owns a module drives the same packer the platform
# does. One matrix entry per module, so a repo that owns twelve of them does not grow twelve jobs.
#
# 🚨 The bundle's identity comes from the CONTENT side, never from workflow inputs: the released
# SemVer from `{package}/manifest.lock` and the landing floor from `{package}/index.json`'s
# `content.minMeshVersion` — the ONE declaration `NodeRepoPackageSource` reads. The job asserts
# that `content.module` names the module it is packing, so the two halves of a mixed package
# cannot drift apart silently.
#
# ─────────────────────────────── Caller contract ───────────────────────────────
# 🚨 THE MODULE LANE MUST FOLLOW THE RELEASE, exactly as the bundle bake does (#2088). A module is
# built against a platform PIN. When the platform releases, the pin moves and the module must be
# rebuilt AND republished, or every portal reads `FrameworkDeclined (built against <old>, live
# <new>)` and adopts nothing — which is what both prod portals said after ci.5050. The rebuild
# already happened there: the repo's release-follow schedule ran it. What threw it away was the
# caller passing `publish: ${{ github.event_name == 'push' }}`, so a scheduled run packed, versioned
# and inspected the bundles and handed them to nobody. Module adoption then stayed broken until an
# unrelated push to the plugin repo republished by accident.
#
# So `publish` is TRUNK-ONLY, not PUSH-ONLY. A caller wires it exactly like node-repo-publish-bake:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#     repository_dispatch:
#       types: [meshweaver-framework-released]
#     # 🚨 REQUIRED, not optional — the dispatch above has never been armed and the cross-repo PAT
#     # it needed was removed on purpose (2026-08-21), so THIS POLL is how a satellite learns a
#     # release happened. Stagger the minute per repo.
#     schedule:
#       - cron: "17,47 * * * *"
#
#   # Share the dispatch's concurrency lane: a scheduled run carries the DEFAULT BRANCH ref, so in
#   # a plain `github.ref` group a poll can cancel a main run mid-publish.
#   concurrency:
#     group: ${{ github.workflow }}-${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'framework-release' || github.ref }}
#     cancel-in-progress: true
#
#   module-pack:
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-module-pack.yml@<40-char platform sha>
#     with:
#       publish: >-
#         ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
#             || github.event_name == 'repository_dispatch'
#             || github.event_name == 'schedule' }}
#     secrets: { publish-token: ${{ secrets.PLUGIN_REGISTRY_PUBLISH_TOKEN }} }
#
# ─────────────────────────── Narrowing (the `select` job) ───────────────────────────
# 🚨 "in plugins we only re-run concerned modules ⇒ we can estimate the required count and
# validate it" · "all plugins should only re-build what changed" · "there is always a notion of
# 'full rebuild' when the platform updates".
#
# The matrix is no longer the caller's literal list on every event: `select` runs
# .github/scripts/node-repo-scope.py over the diff and hands `pack` the entries it can reach.
# MeshWeaver.Plugins ran 29 module builds on every push of every PR, whichever file moved.
#
# 🚨 ONLY `pull_request` / `merge_group` NARROW. A push, a framework-release dispatch, the release
# poll and a manual dispatch all pack the FULL set — a module is built against a platform pin, and
# when that pin moves every bundle must be rebuilt and republished or every portal reads
# FrameworkDeclined and adopts nothing (#2088). The scope script names which fallback it took, in
# the log and in the job summary; every uncertainty resolves to FULL.
#
# 🚨 AND THE COUNT IS ASSERTED. A dynamic matrix cannot be a fixed list of required contexts — the
# per-module contexts come and go with the diff — so the SELECTION is what gets checked instead:
# every pack job drops a receipt, and `verify` (one stable context, present on every run) fails if
# the receipts and the selection disagree. That is invariant #4 for a matrix allowed to change
# size, and it is the only reason a narrowed matrix is safe to require.
#
# A caller that ships neither scripts/affected-modules.py nor scripts/project-closure.py is simply
# not narrowable: the scope script says FULL and says why. Nothing to opt into, nothing to skip.
#
# ──────────── Where the module's own suite runs (`pack` inline vs the `tests` lane) ────────────
# 🚨 A CONSUMER THAT ONLY WANTS THE BUNDLE MUST NOT WAIT FOR THE SUITE. A `needs:` on a `uses:`
# job waits for the WHOLE called workflow, so anything inside the last job of this lane is on the
# critical path of every gate the caller hangs off it. Measured on MeshWeaver.Plugins run
# 33656010754 (a 39-minute PR): `Module bundle (MeshWeaver.AI)` ran 13.4 minutes, of which 12.7
# were `Run the module's tests` and 0.2 were the build — so the bundle ARTIFACT the two required
# gates compose was ready 0.2 minutes in, and they started at 32.8. It also blocks the RETRY loop:
# a run cannot be re-run until it completes, so a flaked portal-host shard waits out a suite whose
# verdict nobody is reading.
#
# So the suite's position is decided by `publish`, the input that already means "trunk" here:
#
#   * `publish: true`  — the suite runs INLINE in `pack`, after the bundle upload and BEFORE the
#     hand-over. That ordering buys exactly one property, and it is worth its cost here: a failing
#     suite never publishes, and every installation reads what the registry serves.
#   * `publish: false` — the hand-over step cannot fire at all (its own `if:` is `inputs.publish
#     && …`), so the ordering protects nothing. The suite runs in the `tests` job, in PARALLEL
#     with select → prepare → build-workspace → pack, and the lane finishes when the slower of the
#     two ends instead of when their sum does.
#
# It is a switch on the INPUT, not on `github.event_name`: this repo's own main-cd calls the lane
# with `publish: false` for the bake's compose set, and that call is not a pull request — it wants
# the fast path for the same reason, because it publishes nothing either.
#
# 🚨 THE SUITE STILL GATES, and not because a comment says so:
#   * the `tests` job is part of this called workflow, so a red suite fails the caller's `uses:`
#     job exactly as a red inline suite did;
#   * `verify` — `All selected bundles built`, this lane's one stable context and the one a repo's
#     protection requires — `needs:` the tests lane and is RED when it did not succeed. No context
#     is renamed and no protection changes;
#   * and a suite that ran in NEITHER lane is caught by receipts rather than by re-reading the two
#     conditions: every pack receipt records which lane owns its suite, the tests lane drops a
#     receipt of its own, and `node-repo-pack-verify.py` fails when the two disagree.
#
# `bundles-built` is untouched: it still answers from the built markers dropped before any suite,
# so a red suite still does not read as "bundle missing" to a gate that only COMPOSES the bundle.
#
# ─────────────────── Which compiler builds a module (`build`) ───────────────────
# 🚨 "we want to use memex build plugin and not dotnet build" (maintainer, 2026-08-31).
#
# A module does not run against a source tree and it does not run against a feed: it is loaded into
# the platform IMAGE and bound by the assemblies in there. So the honest compiler is that image's
# own — `memex build project`, whose work is `mw-plugin-test build-project` from the pinned TESTER
# image, compiling against the pinned PLATFORM image's /app
# (MeshWeaver#2850). This lane runs the container form directly, because CI has already pulled and
# digest-pinned the image; going through the `memex` CLI would add an SDK build in order to remove
# one.
#
# It is DECLARED PER ENTRY, and it is deliberately not yet the default:
#
#     {"package":"Import","module":"MeshWeaver.Import",
#      "project":"src/MeshWeaver.Import/MeshWeaver.Import.csproj",
#      "build":"container","accept":"targets"}
#
# #2850's own sweep over all 54 non-test projects in MeshWeaver.Plugins/src compiled 12 green. The
# rest need what a RUNTIME image does not carry: SDK source generators (15 — they live in the SDK),
# Razor/Blazor (15 — the image ships none of the three Razor assemblies), `<Protobuf>` (3),
# additional libraries (5), portal hosts (3). A blanket swap would therefore break most bundles, so
# the split is deliberate, per module, visible, and expected to SHRINK — `verify` prints the count
# every run for exactly that reason.
#
# 🚨 THERE IS NO FALLBACK BETWEEN THE TWO, and that is the point. A lane that tries the container
# and quietly drops back to the SDK makes "the container built it" and "the SDK built it"
# indistinguishable in a green log. A declared mode that cannot run FAILS; an unknown mode FAILS.
# The mode is printed by the build step, written into the built marker and the receipt, and
# summarised by `verify`.
#
# What the container path needs from the caller:
#   * `platform-image` + `platform-image-digest` — the image IS the reference set, so an entry that
#     asks for `container` without them fails RED rather than building against anything else.
#   * `tester-image` + `tester-image-digest` — the image that CARRIES the builder (and, beside it,
#     the generators the SDK would have supplied). The platform image ships no /app/mw-plugin-test
#     and the tester image's /app is not the full reference surface, so the build runs the tester
#     image against the platform image's extracted /app; both pins move together, from one CD wave.
#   * the `acr-username`/`acr-password` secrets, to pull them.
#   * `accept` for every construct the evaluator refuses. MeshWeaver.Plugins' own
#     `src/Directory.Build.props` carries a `<Target>` (the AssemblyVersion contract check), so its
#     entries need at least `"accept": "targets"`.
#
# What it deliberately does NOT support:
#   * `--extra-refs`. An "additional library" is one the image does not carry; with no deps.json to
#     derive a private closure from, bundling it would be guesswork and NOT bundling it would land a
#     module that faults at first use (the 2026-08-19/20 outage). build-project refuses such a
#     PackageReference BY NAME, which is the right answer: that module stays on the `sdk` path.
#   * `--deps-closure`, for the same reason there is nothing to derive it from. The container
#     bundle's closure is complete BY CONSTRUCTION — every reference resolved from the image the
#     bundle lands into — and the bundle inspection ASSERTS that claim by refusing any
#     non-MeshWeaver assembly in a container-built bundle.
#
# 🚨 PRECONDITIONS BEFORE ANY ENTRY MAY DECLARE `container` — both are checked at runtime, loudly,
# but they are cheaper to read here:
#   1. The PINNED image must carry the `build-project` verb (MeshWeaver#2850 merged AND an image
#      built from it AND `platform-image-digest` moved to that image). Before that, the container
#      run exits non-zero on an unknown argument.
#   2. `build-project` must stamp the project's <AssemblyVersion>. It runs no MSBuild targets, so
#      the SDK's GenerateAssemblyInfo does not happen and Roslyn's default identity is emitted —
#      shipping 0.0.0.0 into a 3.0.0.0 process is MeshWeaver#143 exactly: it does not fail at build,
#      it fails at runtime binding, in another repo, naming a version nobody wrote down. The build
#      step compares the emitted identity against the one the builder itself read out of the image
#      and FAILS on drift, so this cannot ship silently — but until the builder honours the
#      property, that check is what a `container` entry will hit.
#
# ──────────── The .NET SDK is a DECLARED need (`dotnet-sdk`) ────────────
# 🚨 "make installing dotnet sdk a feature flag" (maintainer, 2026-08-31).
#
# `actions/setup-dotnet` used to run in this job the way it runs in every job in the fleet: as a
# reflex, before anyone asked whether the job compiles anything. That is the wrong shape the moment
# a module can be compiled by the platform IMAGE instead (`"build": "container"`, see above) —
# because "the SDK is here" then silently answers a question nobody put: an unconverted step keeps
# working on a runner SDK that the converted lane was supposed to have removed.
#
# So the install is now DECLARED, in two halves that must both be read to know what happened:
#
#   * `dotnet-sdk: install` (the DEFAULT) — install it, unconditionally. A caller that says nothing
#     gets exactly today's behaviour, and a lane ADDED tomorrow inherits it. Opting out is a
#     deliberate edit; drifting out is impossible.
#   * `dotnet-sdk: by-declaration` — install it only if this job's own declared consumers still
#     need it. Today they are: the compiler for any entry that is not `build: container`; the
#     module-pack tool, which is `dotnet build` + `dotnet run` in EVERY mode; a `build: container`
#     entry's binding-identity probe; and the module's own `dotnet test` suite when it ships one.
#     🚨 So NO entry can drop the SDK yet, container or not — the packer alone keeps every pack job
#     on it. That is not a placeholder, it is the measured state, and the log says it every run.
#     The lane converts when the packer moves inside the platform image, not before.
#   * anything else, the empty string included — RED. A flag that cannot be read resolving to
#     "skip" is precisely the trapdoor this whole family of gates exists to forbid.
#
# 🚨 IT IS NOT A SKIP-TRAPDOOR, and three things make that structural rather than hoped-for:
#   1. The DECISION step is unconditional — it runs on every event, in every mode, and it FAILS on
#      an unreadable policy. Only `actions/setup-dotnet` itself carries an `if:`, and skipping an
#      installer is not skipping a check: every build, pack, inspect and test step below still runs
#      and still gates. The flag chooses a COMPILER; it never chooses whether to verify.
#   2. When the answer is "no SDK", the job does not merely decline to install one — it PUTS A
#      FAILING `dotnet` ON PATH. GitHub's ubuntu runners ship an SDK of their own, so "we skipped
#      setup-dotnet" would otherwise mean "we quietly built against whatever .NET the image happens
#      to carry", which is the same class of lie as a skipped gate rendering a green tick.
#   3. The path taken is printed in the log AND in the job summary on EVERY run, with the consumers
#      enumerated by name — including when the answer is "install", so the two outcomes cannot be
#      told apart only by what is missing.
#
# Republishing is SAFE to repeat, which is why the schedule may simply publish rather than
# first proving something changed: the registry is keyed by `{package}@{version}` from
# `manifest.lock`, so a rebuild of an unchanged version overwrites the same slot with equivalent
# bytes. There is no `_complete` sentinel to shrink here — unlike the prebuilt-bundle bake, this
# lane uploads one independent bundle per module and never seals a listing, so a partial run costs
# only the modules it did not reach, never the ones it did.

on:
  workflow_call:
    inputs:
      modules:
        description: >
          JSON array of {package, module, project}: the Store package id, the module's entry
          assembly name, and the csproj to build. e.g.
          [{"package":"SocialMedia","module":"MeshWeaver.Social","project":"src/MeshWeaver.Social/MeshWeaver.Social.csproj"}]


          Two OPTIONAL fields choose the COMPILER, per entry (see "Which compiler builds a module"
          below): `"build": "container"` compiles with `memex build project` inside the pinned
          platform image — no .NET SDK, no NuGet restore, no platform source checkout — and
          `"accept": "targets embedded-resource"` acknowledges, one by one, the MSBuild constructs
          that builder deliberately refuses to reproduce silently. Omitted, `build` is `sdk`: today's
          `dotnet build` + `dotnet publish` on the runner. There is no third value and no fallback
          between them.
        required: true
        type: string
      platform-ref:
        description: The Systemorph/MeshWeaver commit the modules build against (a pin, not a branch).
        required: true
        type: string
      publish:
        description: >
          Hand the packed bundles to the registry. TRUNK-ONLY, not push-only — a PR packs and
          inspects and never publishes, but a release-follow schedule or repository_dispatch run
          MUST publish or the rebuild it just did is discarded and every portal stays on
          FrameworkDeclined (#2088). See the caller contract at the top of this file.
        type: boolean
        default: false
      always-modules:
        description: >
          Comma-separated module names (entry assembly names from `modules`) that the caller's
          gates COMPOSE on every run — the AI engine that registers Skill/Agent, a carved-out
          module the content binds. A narrowed PR run keeps them in the selection regardless of
          the diff, so the gate's inputs exist unconditionally; a name the matrix lacks makes the
          selection fall back to the full set and say why.
        type: string
        required: false
      superseded-image-assemblies:
        description: >
          Comma- or whitespace-separated IMAGE assembly names whose copy in the pinned platform
          image is SUPERSEDED by this repository's source for this run — dropped from the global
          build's reference set.


          Needed in exactly one situation, and it is not rare: a type MOVES OUT of an
          image-shipped assembly into a module in the same repo. The builder's shadow set
          subtracts only what the run compiles FROM SOURCE, and membership is reachability-driven
          through ProjectReference edges — so the edge that would have shadowed the stale copy is
          the edge the move deletes. The image still defines the moved type, the module defines it
          too, and the compile fails CS0436. This input is how the caller says which stale copy to
          drop.


          DECLARED, never inferred: resolving such a collision automatically in favour of the
          source would mask a genuine two-producers-of-one-assembly defect, which
          `BakeHost.ShippedByHostProblem` (MeshWeaver#3175) exists to make RED.


          Fails closed — an empty name, a name the image does not carry (wrong, or the input is
          STALE now the image dropped it), or a name the run already builds from source, each
          refuse the build naming the entry. Omitted, nothing is dropped and the lane behaves
          exactly as before.
        type: string
        required: false
        default: ''
        default: ''
      platform-image:
        description: >
          The PORTAL image the modules will load into (e.g. meshweaver.azurecr.io/memex-portal-ai).
          With platform-image-digest set, each module compiles against that image's /app assemblies
          instead of rebuilding the platform closure from platform-ref source — the maintainer's
          "take the image from build, not build its own; only upon core rebuild" (2026-08-29):
          reference set = runtime set, no platform build in the module lane, and a platform change
          is exactly a pin move. The tester image is NOT sufficient (no Hosting.AspNetCore / Blazor /
          Blazor.Views). Empty (the default) keeps the source build.
        type: string
        required: false
        default: ''
      platform-image-digest:
        description: >
          The digest (sha256:…) of platform-image to compile against — the promoted set's MULTI-ARCH
          manifest-list digest (immutable, never re-tagged), pulled as linux/amd64 below. Record the
          x64 framework identity beside the pin in the caller (mw-plugin-test --print-framework-identity
          on the linux-x64 member) so a mismatch is diagnosable by eye. Empty = build from source.
        type: string
        required: false
        default: ''
      tester-image:
        description: >
          The image that CARRIES the builder (meshweaver.azurecr.io/mw-plugin-test) for entries
          declaring "build":"container". 🚨 Two images, two roles, deliberately split: the PORTAL
          image has no /app/mw-plugin-test (measured on memex-portal-ai@7e8c0b20, 331 files, none of
          them the tester), and the TESTER image's /app lacks the Blazor/Hosting.AspNetCore half of
          the reference surface (the platform-image doc above) — so the container build runs THIS
          image's builder against THAT image's extracted /app. The two are published by the same CD
          run and tagged in step by construction; pin them from the same wave. Empty (the default)
          leaves container entries failing RED by name.
        type: string
        required: false
        default: ''
      lane-id:
        description: >
          A HUMAN LABEL for this call, nothing more — it is a readability prefix on the lane key,
          not the thing that makes the key unique. It exists because one workflow may invoke this
          lane more than once in the same run (floor + rest) and artifacts are RUN-WIDE, so two
          calls uploading 'workspace-build' collide and half the packs then download the OTHER
          call's workspace — measured on Plugins#1044 (run 33475…, 'produced no
          MeshWeaver.Teams.dll' while the build had 35/35 ok) and again on Plugins#1077 (run
          33487032213 carried TWO artifacts named 'workspace-build', 25.8 MB and 950 kB, and the
          floor's pack downloaded the other call's).
          🚨 A DISCRIMINATOR WITH A SHARED DEFAULT IS NOT A DISCRIMINATOR: every caller that
          forgot to set this got 'main' on both calls and collided exactly as before, silently.
          So the lane KEY is now derived in `select` and always carries a fingerprint of this
          call's own `modules:` matrix (`select.outputs.lane`), which is unique per call by
          construction. Setting this input only makes the artifact names readable.
        type: string
        required: false
        default: 'main'
      prebuilt-modules:
        description: >
          DEPRECATED, ignored. The global build-workspace job replaced per-job prebuilt
          artifacts — every container entry compiles ONCE, centrally, in one Roslyn workspace
          ("we want one central build, no per project build", maintainer, 2026-09-01). Accepted
          so pinned callers keep parsing; passing it does nothing.
        type: string
        required: false
        default: ''
      tester-image-digest:
        description: >
          The digest (sha256:…) of tester-image, pulled as linux/amd64. Same immutability rule as
          platform-image-digest; move the two pins together, from one CD wave.
        type: string
        required: false
        default: ''
      registry-source:
        description: >
          The registry SOURCE these packages belong to ("Plugins", "Education", …) — it stamps the
          landed entry's packagePath, which is the key every PluginGrant and the bundle index match
          on. An unstamped landing is servable to nobody.
        type: string
        required: false
        default: Plugins
      registry-url:
        description: The registry that will serve these bundles onward.
        type: string
        default: https://memex.meshweaver.cloud
      content-repository:
        description: >-
          The repository whose packages are packed. Empty = the caller (today's behaviour). The
          platform's CD sets it to Systemorph/MeshWeaver.Plugins: Plugins is built WITH the
          platform, so its module bundles for a new framework identity come out of the same run.
        required: false
        type: string
        default: ''
      content-ref:
        description: The ref of content-repository to pack. Empty = the caller's own commit.
        required: false
        type: string
        default: ''
      dotnet-sdk:
        description: >
          FEATURE FLAG — whether the pack job installs the .NET SDK on the runner. See "The .NET
          SDK is a DECLARED need" at the top of this file.

          `install` — the DEFAULT, and what a caller that says nothing inherits: setup-dotnet runs
          unconditionally, exactly as it always has.

          `by-declaration` — install it only when a consumer in THIS job still needs it. The
          consumers are enumerated in the log and the job summary on every run, whichever way the
          decision goes, so a green log can never leave "the SDK compiled it" and "the image
          compiled it" indistinguishable.

          Any other value — the empty string included — is RED. A flag that cannot be read must
          never resolve to "skip".
        required: false
        type: string
        default: install
      ledger:
        description: >
          The CI MODULE BUILD LEDGER on the registry portal (Doc/Architecture/ModuleBuildArchitecture →
          "Content-addressed outputs"; Plugins#889). Two values, both printed in the job summary on
          every run so the two outcomes can never be told apart only by what is missing:

          `off` — the DEFAULT, and what a caller that says nothing inherits: every selected module is
          built, exactly as before the ledger existed.

          `required` — `select` computes the content address of every selected module
          (module-build-key.py: package, moduleVersion, in-repo closure, both image digests,
          platform-ref, recipe) and asks the ledger at `registry-url` what is already built, tested
          or published under that key: a usable record is REUSED (the pack job downloads that run's
          bundle and runs only the phases the record lacks), a fresh claim by another run is WAITED
          for (never the same key built twice at once), a compile failure of the same key is a hard
          red with the holder's evidence, everything else is CLAIMED and every transition recorded.
          Needs the `ledger-token` secret — asserted RED in `select` when empty, never skipped. When
          the registry portal itself is unavailable (5xx, unreachable) the lane builds WITHOUT
          coordination and says so in yellow: the ledger may cost a duplicate build, never a green.

          Anything else — the empty string included — is RED.
        required: false
        type: string
        default: off
    secrets:
      publish-token:
        description: The registry's Plugins:Registry:PublishToken. Required when publish is true.
        required: false
      ledger-token:
        description: >-
          A `mw_` ApiToken of the registry portal's CI user for the module build ledger
          (`Admin/ModuleBuilds`). Required when ledger is `required`; asserted RED, never skipped.
        required: false
      acr-username:
        description: Pull credential for platform-image's registry. Required when platform-image-digest is set.
        required: false
      acr-password:
        description: Pull credential for platform-image's registry. Required when platform-image-digest is set.
        required: false
      content-app-id:
        description: >-
          App id of a GitHub App with Contents: Read on content-repository. Required whenever
          content-repository is set (the caller's GITHUB_TOKEN cannot read another repository);
          asserted RED before the checkout, never skipped.
        required: false
      content-app-private-key:
        description: Private key (PEM) of that App.
        required: false
    outputs:
      bundles-built:
        description: >
          "true" when EVERY selected module bundle of THIS CALL exists as a COMPOSABLE artifact —
          a `module-built-<lane>-<module>` marker, dropped right after the bundle upload and BEFORE
          the tests, recording the bundle it attests and the closure evidence the build resolved.
          This is the claim a caller's gate should depend on when it only COMPOSES the bundles: a
          red suite in this call must not read as "bundle missing" there (Plugins #937 — one AI
          flake turned both required gates red). Nothing about the test run reaches it — whether
          the suite ran inline in `pack` (a publishing run) or in the `tests` lane beside it.
          🚨 It FAILS CLOSED. Zero markers, a marker stamped with another call's lane, an unstamped
          one, and one that does not record what it attests are all "not built" for the module in
          question — a truthy answer derived from absent or foreign evidence is the defect this
          output exists to not have (Plugins#1077). The lane's own stable context (`All selected
          bundles built`) still asserts the receipts AND the pack job's result, so a failed suite
          keeps the lane red wherever the lane itself is required.
        value: ${{ jobs.verify.outputs.bundles-built }}

jobs:
  # ─────────────────────── WHICH BUNDLES THIS DIFF CAN REACH ───────────────────────
  # One place decides, out loud. It never skips a gate: its two answers are "pack these" and
  # "pack everything", and it takes the second whenever it cannot be sure of the first.
  select:
    name: Select the affected bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # The matrix the pack job expands: the scope's selection, each entry annotated by the ledger
      # (`ledger.decision` build|reuse, `ledger.key`, …) when the ledger is on.
      modules: ${{ steps.ledger.outputs.modules }}
      # The SUBSET the one-workspace build compiles — every entry the ledger did not hand a reusable
      # bundle for. The postcondition in build-workspace is fed the SAME list.
      build-modules: ${{ steps.ledger.outputs.build }}
      # The SUBSET whose own test suite must RUN in this call — the entries the pack job's plan
      # would answer `need_test=true` for. It is the `tests` job's matrix; see that job for why
      # the suites are a lane of their own on a non-publishing run.
      test-modules: ${{ steps.suites.outputs.modules }}
      test-count: ${{ steps.suites.outputs.count }}
      count: ${{ steps.scope.outputs.count }}
      selected: ${{ steps.scope.outputs.selected }}
      scope: ${{ steps.scope.outputs.scope }}
      lane: ${{ steps.lane.outputs.id }}
    steps:
      # ───────────── THIS CALL'S ARTIFACT NAMESPACE — derived, never assumed ─────────────
      # 🚨 ARTIFACTS ARE RUN-WIDE. A repo may invoke this reusable workflow more than once in one
      # run (MeshWeaver.Plugins does, on every run: `modules-floor` and `modules-rest`), and every
      # artifact either call uploads lands in ONE run-scoped namespace. `lane-id` was added for
      # exactly this (#2934) — and did not close it, because its DEFAULT is the same literal for
      # both calls and neither caller set it. Two artifacts named `workspace-build` therefore
      # coexisted in Plugins run 33487032213 (25.8 MB and 950 kB), `download-artifact` resolved
      # the name to ONE of them, and the floor's pack read the other call's workspace: "the global
      # build wrote no closure manifest for MeshWeaver.Markdown.Collaboration" — a REQUIRED gate
      # flipping green/red on main with no source change (Plugins#1077).
      #
      # So the key is DERIVED here rather than trusted from the caller: `lane-id` is only a
      # readable prefix, and the part that discriminates is a fingerprint of this call's own
      # `modules:` matrix. Two calls that build different sets fingerprint differently by
      # construction — there is no input a caller can forget. It is also stamped INTO every
      # marker and receipt this call drops, so the verifier can refuse a foreign lane's evidence
      # even if the names ever collide again.
      - name: This call's lane key
        id: lane
        env:
          LANE: ${{ inputs.lane-id }}
          DECLARED: ${{ inputs.modules }}
        run: |
          set -euo pipefail
          # Artifact names may not carry " : < > | * ? \ / — keep the label to a safe alphabet.
          slug="$(printf '%s' "$LANE" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-24)"
          fingerprint="$(printf '%s' "$DECLARED" | sha256sum | cut -c1-12)"
          id="${slug:-lane}-$fingerprint"
          echo "lane key: $id (label '${LANE:-<unset>}' + a fingerprint of this call's own modules: matrix)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # 🚨 The caller goes in its OWN directory, not the workspace root. Node packages are
      # discovered as "top-level dirs carrying an index.json", and the platform checkout below
      # lands INSIDE the workspace — clone core to the root beside the caller's content and the
      # selector is one `index.json` away from treating the framework as a plugin of this repo.
      # gen-manifests.py already carries "meshweaver" in its SKIP set for exactly this reason;
      # keeping the two trees apart is the version that cannot rot.
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository:
      # Systemorph/MeshWeaver.Plugins` (private) answers 404 under it — the platform's first release
      # wave died on exactly that (main-cd run 33276813173, 2026-08-29). When content-repository is
      # set, the App credential is ASSERTED red, never fallen back on: a fallback to github.token
      # would 404 anyway, one step later and blaming the checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
          path: repo
          # 🚨 The diff is taken against the PR base, so the base commits must be present. A
          # shallow clone would make every range unresolvable — which the scope script turns into
          # a FULL pack rather than an empty one, but silently paying for 29 jobs is not the plan.
          fetch-depth: 0
      # The scope script is the PLATFORM's (one implementation, every repo), read from the same
      # checkout the pack jobs make at platform-ref — so a workflow newer than the checkout can
      # never call a script the checkout does not have (run 33073476996's exact failure).
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 The selection logic owes its own proof that it can say no AND that every fallback still
      # falls back. It runs here, on every run, next to the answer it produces — a selector whose
      # self-test is only run by someone remembering to is a selector nobody checks.
      - name: The selection can say no (self-test)
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/node-repo-scope.py --self-test
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py --self-test
          python3 meshweaver/.github/scripts/module-build-key.py --self-test
          python3 meshweaver/.github/scripts/module-build-ledger.py --self-test
      - name: Decide which module bundles this diff can reach
        id: scope
        env:
          MODULES: ${{ inputs.modules }}
          ALWAYS: ${{ inputs.always-modules }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # A merge_group run carries no `base_ref`; its base is on the event payload. Dormant
          # today (no repo here has a queue) and kept correct so enabling one narrows rather than
          # silently falling back to the full set.
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$MODULES" > "$RUNNER_TEMP/matrix.json"
          if [ -z "${BASE_REF:-}" ] && [ -n "${QUEUE_BASE_REF:-}" ]; then
            BASE_REF="${QUEUE_BASE_REF#refs/heads/}"
          fi
          if [ -n "${BASE_REF:-}" ]; then
            git -C repo fetch --no-tags origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          python3 meshweaver/.github/scripts/node-repo-scope.py \
            --for modules --root repo --modules "@$RUNNER_TEMP/matrix.json" \
            --event "$EVENT" --base-ref "${BASE_REF:-}" --always "${ALWAYS:-}" > "$RUNNER_TEMP/scope.json"
      # ───────────── THE LEDGER: what of this selection is ALREADY BUILT, and who builds the rest ─────────────
      # 🚨 "we should not start the same build multiple times ⇒ coordinate which packages are in
      # progress; track progress through memex … if Plugin X was built against Platform version Y,
      # we don't have to rebuild this" (maintainer, 2026-09-02). Every selected entry gets a CONTENT
      # ADDRESS (module-build-key.py) and the ledger on the registry portal answers per key: reuse,
      # wait, build, or blocked. The scope above still decides what this diff REACHES; the ledger
      # decides what of that must actually be COMPILED. On a `push` the scope is FULL by policy
      # (a publishing run has no diff baseline) and the ledger narrows it to "every module whose key
      # has no Published record" — which is exactly the baseline argument Plugins#889 asked for: a
      # cancelled, red or superseded run left no Published record, so its modules are rebuilt.
      #
      # ONE step, unconditional, that prints which way it went. `off` passes the selection through
      # untouched (today's behaviour); `required` asserts the token RED (a skipped ledger and a
      # consulted one must never look alike) and runs the two scripts. A registry portal that is
      # UNAVAILABLE degrades to "build everything, uncoordinated", in yellow — the ledger is a
      # coordination layer over a build that is correct without it, and its outage may cost a
      # duplicate build, never a green (core #3119).
      - name: Consult the module build ledger
        id: ledger
        env:
          LEDGER: ${{ inputs.ledger }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ steps.lane.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          SCOPE_MODULES: ${{ steps.scope.outputs.modules }}
          COUNT: ${{ steps.scope.outputs.count }}
          PUBLISH: ${{ inputs.publish }}
          TESTER_DIGEST: ${{ inputs.tester-image-digest }}
          SUPERSEDED: ${{ inputs.superseded-image-assemblies }}
          PLATFORM_DIGEST: ${{ inputs.platform-image-digest }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          printf '%s' "${SCOPE_MODULES:-[]}" > "$RUNNER_TEMP/selection.json"
          case "$LEDGER" in
            off)
              echo "module build ledger: OFF — every selected module is built (set ledger: required on the caller to coordinate builds across runs)"
              printf '### Module build ledger\n\nOFF — every one of the %s selected module(s) is built. Set `ledger: required` on the caller to reuse builds across runs.\n' "$COUNT" >> "$GITHUB_STEP_SUMMARY"
              modules="$(cat "$RUNNER_TEMP/selection.json")"
              echo "modules=$modules" >> "$GITHUB_OUTPUT"
              echo "build=$modules" >> "$GITHUB_OUTPUT"
              ;;
            required)
              [ -n "${MW_LEDGER_TOKEN:-}" ] || { echo "::error::inputs.ledger is 'required' but the ledger-token secret is empty. Mint a mw_ ApiToken for the registry portal's CI user (a partition admin on Admin/ModuleBuilds — see Doc/Architecture/ModuleBuildArchitecture), store it as a repository secret, and pass it as secrets.ledger-token. A ledger that silently does not run and one that ran must never look alike."; exit 1; }
              if [ "${COUNT:-0}" = "0" ]; then
                echo "module build ledger: nothing selected — nothing to key"
                echo "modules=[]" >> "$GITHUB_OUTPUT"
                echo "build=[]" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "module build ledger: REQUIRED — keying $COUNT selected module(s) against $MW_LEDGER_URL"
              python3 meshweaver/.github/scripts/module-build-key.py --root repo \
                --modules "@$RUNNER_TEMP/selection.json" \
                --tester-digest "$TESTER_DIGEST" --platform-digest "$PLATFORM_DIGEST" --platform-ref "$PLATFORM_REF" \
                > "$RUNNER_TEMP/keys.json"
              # Waits at most 40 of this job's 45 minutes on a live holder; a holder still busy then is
              # built anyway (a duplicate build, flagged), never a red. Exit 1 ONLY for a key the same
              # inputs already compiled RED elsewhere — that is a verdict, not the ledger's outage.
              python3 meshweaver/.github/scripts/module-build-ledger.py decide \
                --keys "@$RUNNER_TEMP/keys.json" --matrix "@$RUNNER_TEMP/selection.json" \
                --publish "$PUBLISH" --lane "$MW_LEDGER_LANE" --wait-max 2400 --poll 30 \
                --out-matrix "$RUNNER_TEMP/matrix.out.json" --out-build "$RUNNER_TEMP/build.out.json"
              echo "modules=$(jq -c . "$RUNNER_TEMP/matrix.out.json")" >> "$GITHUB_OUTPUT"
              echo "build=$(jq -c . "$RUNNER_TEMP/build.out.json")" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::inputs.ledger is '$LEDGER'. The only values are 'off' (the default) and 'required'. An unreadable flag must NEVER resolve to 'do not coordinate' — that is a skipped check wearing a green tick."
              exit 1
              ;;
          esac

      # ───────────── WHICH OF THE SELECTION STILL OWES A TEST RUN ─────────────
      # The `tests` job's matrix. The predicate is EXACTLY the one the pack job's `Ledger — this
      # entry's plan` step answers as `need_test`, restated here because a matrix has to be known
      # before the job it drives exists:
      #
      #     need_test = (ledger says REUSE) ? ledger.needTest : (entry.test != false)
      #
      # 🚨 TWO PLACES COMPUTING ONE PREDICATE IS A DRIFT RISK, SO THE VERIFIER CROSS-CHECKS THEM
      # rather than trusting them to agree: the pack leg records in its receipt which lane owns its
      # suite (`tests: none|inline|lane`), the tests lane drops a receipt of its own, and
      # `node-repo-pack-verify.py` fails the run when a module the pack leg DELEGATED has no test
      # receipt, or a test receipt arrives for a module that delegated nothing. A drift between
      # these two expressions therefore surfaces as a RED count gate naming the module, never as a
      # suite that quietly did not run.
      - name: Which selected modules still owe a test run
        id: suites
        env:
          SELECTION: ${{ steps.ledger.outputs.modules }}
        run: |
          set -euo pipefail
          printf '%s' "${SELECTION:-[]}" > "$RUNNER_TEMP/final.json"
          jq -c '[ .[] | select(
                    if (.ledger.decision // "build") == "reuse"
                    then (.ledger.needTest == true)
                    else (.test != false) end) ]' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/suites.json"
          count=$(jq 'length' "$RUNNER_TEMP/suites.json")
          echo "modules=$(cat "$RUNNER_TEMP/suites.json")" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count of $(jq 'length' "$RUNNER_TEMP/final.json") selected module(s) still owe a test run: $(jq -r 'if length == 0 then "<none>" else [.[].module] | join(", ") end' "$RUNNER_TEMP/suites.json")"

  # ─────────────────── THE SHARED BUILD ENVIRONMENT, WARMED ONCE ───────────────────
  # "see we update *once at beginning for everyone* and not by module" (maintainer, 2026-08-31).
  # Everything every pack job consumes identically is produced HERE, once per run, never once per
  # module:
  #   * the PLATFORM IMAGE, as a per-digest zstd tarball in the actions cache (GitHub's own
  #     blob storage, colocated with the runners) — the matrix `docker load`s it instead of each
  #     job pulling the same bytes from ACR (~52s/job measured on Plugins#1032; on a fresh digest
  #     EVERY job used to pull at once — the stampede that helped beat the registry into
  #     `connection refused` on 2026-08-31);
  #   * the platform /app extraction and the TESTER APP extraction (the same per-digest caches the
  #     matrix already reads) — warmed here so a fresh digest costs ONE trip to the registry per
  #     run, not one per job;
  #   * the MODULE-PACK TOOL, published once per platform pin and handed over as an artifact
  #     (~5s download) instead of `dotnet build` in every job (48–79s/job measured).
  # On a warm digest the matrix touches NO registry at all — an ACR outage cannot red a run whose
  # images are already in the cache. This is deliberately NOT a gate: a cache miss in a pack job
  # falls back to the pull of the SAME digest-pinned bytes, loudly — both paths build identically.
  prepare:
    name: Warm the shared build environment (once)
    needs: select
    if: needs.select.result == 'success' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # The framework identity the PLATFORM host resolves for its /app — what every ledger record
      # and bundle is keyed to (the portal adopts, so the portal's identity is the honest one).
      platform-identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - name: Restore the module-pack tool (per-platform-pin cache)
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pack-tool
          key: pack-tool-${{ inputs.platform-ref }}
      - uses: actions/setup-dotnet@v6
        if: steps.tool-cache.outputs.cache-hit != 'true'
        with:
          dotnet-version: "10.0.x"
      - name: Publish the module-pack tool (once for every pack job)
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: dotnet publish meshweaver/src/MeshWeaver.Plugin.Build/MeshWeaver.Plugin.Build.csproj -c Release -o "$RUNNER_TEMP/pack-tool"
      # Lane-scoped like every other artifact this workflow drops: two calls in one run publish
      # the tool from their OWN platform pin, and a run-wide name lets one call's pack jobs pack
      # with the other call's builder.
      - name: Hand the tool to the matrix
        uses: actions/upload-artifact@v7
        with:
          name: module-pack-tool-${{ needs.select.outputs.lane }}
          path: ${{ runner.temp }}/pack-tool
          retention-days: 1
      - name: Restore the platform image tarball (per-digest cache)
        if: inputs.platform-image-digest != ''
        id: image-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/platform-image
          key: platform-image-${{ inputs.platform-image-digest }}
      - name: Restore the platform image's assemblies from cache
        if: inputs.platform-image-digest != ''
        id: refs-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/platform-refs
          key: platform-refs-${{ inputs.platform-image-digest }}
      - name: Restore the tester app (per-digest cache)
        if: inputs.tester-image-digest != ''
        id: tester-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tester-app
          key: tester-app-${{ inputs.tester-image-digest }}
      - name: Fill whichever cache is cold — the run's ONE trip to the registry
        if: >-
          inputs.platform-image-digest != ''
          && (steps.image-cache.outputs.cache-hit != 'true'
              || steps.refs-cache.outputs.cache-hit != 'true'
              || (inputs.tester-image-digest != '' && steps.tester-cache.outputs.cache-hit != 'true'))
        env:
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
          TESTER_IMAGE: ${{ inputs.tester-image }}
          TESTER_DIGEST: ${{ inputs.tester-image-digest }}
          IMAGE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
          REFS_HIT: ${{ steps.refs-cache.outputs.cache-hit }}
          TESTER_HIT: ${{ steps.tester-cache.outputs.cache-hit }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
        run: |
          set -euo pipefail
          [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::platform-image-digest is set but the acr-username/acr-password secrets are not passed — the cold caches cannot be filled"; exit 1; }
          echo "$ACR_PASSWORD" | docker login "${IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
          case "${IMAGE##*/}" in *:*) NOTAG="${IMAGE%:*}" ;; *) NOTAG="$IMAGE" ;; esac
          pinned="${NOTAG}@${DIGEST}"
          if [ "$IMAGE_HIT" != "true" ] || [ "$REFS_HIT" != "true" ]; then
            docker pull -q --platform linux/amd64 "$pinned"
          fi
          if [ "$IMAGE_HIT" != "true" ]; then
            mkdir -p "$RUNNER_TEMP/platform-image"
            # `docker load` of a digest-pulled save keeps no RepoDigests, so the matrix runs the
            # image by ID — content-addressed, i.e. exactly as pinned as the digest itself.
            docker inspect --format '{{.Id}}' "$pinned" > "$RUNNER_TEMP/platform-image/image-id.txt"
            docker save "$pinned" | zstd -T0 -3 -o "$RUNNER_TEMP/platform-image/image.tar.zst"
            ls -lh "$RUNNER_TEMP/platform-image/image.tar.zst"
          fi
          if [ "$REFS_HIT" != "true" ]; then
            cid=$(docker create --platform linux/amd64 "$pinned")
            mkdir -p "$RUNNER_TEMP/platform-refs"
            docker cp "$cid:/app/." "$RUNNER_TEMP/platform-refs/"
            docker rm "$cid" >/dev/null
            shopt -s nullglob
            dlls=("$RUNNER_TEMP"/platform-refs/*.dll)
            [ "${#dlls[@]}" -gt 50 ] || { echo "::error::the image's /app yielded ${#dlls[@]} assemblies — not a platform image"; exit 1; }
          fi
          if [ -n "$TESTER_DIGEST" ] && [ "$TESTER_HIT" != "true" ]; then
            case "${TESTER_IMAGE##*/}" in *:*) TNOTAG="${TESTER_IMAGE%:*}" ;; *) TNOTAG="$TESTER_IMAGE" ;; esac
            tester_pinned="${TNOTAG}@${TESTER_DIGEST}"
            docker pull -q --platform linux/amd64 "$tester_pinned"
            rm -rf "$RUNNER_TEMP/tester-app"
            tcid=$(docker create --platform linux/amd64 "$tester_pinned")
            docker cp -q "$tcid:/app" "$RUNNER_TEMP/tester-app"
            docker rm "$tcid" >/dev/null
            [ -f "$RUNNER_TEMP/tester-app/mw-plugin-test.dll" ] || { echo "::error::the tester image's /app carries no mw-plugin-test.dll — not a tester image"; exit 1; }
          fi
      # ───────── THE PLATFORM'S FRAMEWORK IDENTITY — resolved by the PORTAL's own /app (#3022) ─────────
      # The ledger records which framework a bundle was built against, and the honest identity is the
      # one the ADOPTING host resolves: the tester's `framework-identity <dir>` verb, run with the
      # platform image's dotnet over the platform image's /app — the same reading the node-repo bake
      # takes, never the tester image's own identity (a strict subset of the portal's). Metadata for
      # the ledger only: an older tester without the verb yields an empty identity and a warning, not
      # a red — nothing verifies against it here.
      - name: Resolve the platform's framework identity (for the ledger)
        id: identity
        if: inputs.ledger == 'required' && inputs.platform-image-digest != '' && inputs.tester-image-digest != ''
        env:
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
        run: |
          set -euo pipefail
          case "${IMAGE##*/}" in *:*) NOTAG="${IMAGE%:*}" ;; *) NOTAG="$IMAGE" ;; esac
          img="${NOTAG}@${DIGEST}"
          if ! docker image inspect "$img" >/dev/null 2>&1; then
            zstd -dc "$RUNNER_TEMP/platform-image/image.tar.zst" | docker load >/dev/null
            img="$(cat "$RUNNER_TEMP/platform-image/image-id.txt")"
          fi
          # `if out=…` rather than `|| true`: a failing verb still PRINTS, and that text must not be
          # read as the identity.
          identity=""
          if out=$(docker run --rm --init --platform linux/amd64 --user "$(id -u):$(id -g)" -e HOME=/tmp \
                     -v "$RUNNER_TEMP/tester-app:/tester:ro" --entrypoint dotnet "$img" \
                     /tester/mw-plugin-test.dll framework-identity /app 2>&1); then
            identity=$(printf '%s\n' "$out" | tail -1 | tr -d '[:space:]')
          fi
          if [ -z "$identity" ]; then
            echo "::warning::could not resolve the platform image's framework identity (the tester's framework-identity verb answered: ${out:-<nothing>}) — ledger records for this run carry no platformIdentity"
          else
            echo "platform framework identity: $identity (resolved by the portal's /app)"
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

  # ─────────────────────── ONE GLOBAL BUILD — LOCAL BUILDS ARE DISCONTINUED ───────────────────────
  # "we want *one* central build *no* per project build … just collect all under scope in global
  # process and discontinue any local build … one global one and finish … and only play with
  # parameters what's rebuilt" (maintainer, 2026-09-01). Every SELECTED container entry compiles
  # HERE, in one Roslyn workspace (shared references, single body pass, fail-fast), inside the
  # pinned platform container. What is rebuilt is exactly the selection's parameters — nothing
  # else. The pack matrix only CONSUMES this job's artifact: a module missing from it is RED
  # there, never rebuilt locally.
  #
  # 🚨 AND THIS JOB ASSERTS ITS OWN POSTCONDITION (Plugins#1051). "The compiler did not throw" is
  # not "the selected set was emitted", and the difference used to be discovered N jobs later by
  # the pack matrix. The last step before the upload checks, per SELECTED container entry, the
  # three things every pack job demands — the assembly, the closure manifest, and a build log the
  # binding-identity check can read — so this job is green only when the artifact it hands over is
  # complete.
  build-workspace:
    name: Build the workspace (one global build)
    needs: [select, prepare]
    if: needs.select.result == 'success' && needs.select.outputs.count != '0' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
      - name: Restore the platform image tarball (per-digest cache)
        if: ${{ inputs.platform-image-digest != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/platform-image
          key: platform-image-${{ inputs.platform-image-digest }}
      - name: Restore the tester app (per-digest cache)
        if: ${{ inputs.tester-image-digest != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tester-app
          key: tester-app-${{ inputs.tester-image-digest }}
      # 🚨 `build-modules`, not `modules`: the ledger handed some entries a reusable bundle, and those
      # are NOT compiled here. The postcondition below is fed the SAME list — one enumerator.
      - name: Build every selected container entry in ONE workspace
        id: build
        env:
          MODULES: ${{ needs.select.outputs.build-modules }}
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
          TESTER_IMAGE: ${{ inputs.tester-image }}
          TESTER_DIGEST: ${{ inputs.tester-image-digest }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
        run: |
          set -euo pipefail
          mapfile -t projects < <(jq -r '.[] | select(.build == "container") | .project' <<< "$MODULES")
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "no container entries to compile — the global build has nothing to do (sdk-only selection, or every container entry is reused from the ledger)"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ONE accept contract for the whole workspace: --accept applies to every entry of a
          # build-project invocation, so entries must agree. A divergent accept is a per-entry
          # contract this job cannot honour — make them uniform rather than letting one entry's
          # acknowledgment quietly cover another's construct.
          accepts_distinct=$(jq -r '[.[] | select(.build == "container") | (.accept // "")] | unique | length' <<< "$MODULES")
          [ "$accepts_distinct" = "1" ] || { echo "::error::container entries declare DIFFERENT accept sets — the global build applies one accept contract to the whole workspace; make them uniform."; exit 1; }
          ACCEPT=$(jq -r '[.[] | select(.build == "container") | (.accept // "")] | unique | .[0]' <<< "$MODULES")
          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ -z "$TESTER_IMAGE" ] || [ -z "$TESTER_DIGEST" ]; then
            echo "::error::container entries are selected, but platform-image / platform-image-digest / tester-image / tester-image-digest are not all set — there is nothing sound to compile with, and deliberately no local-SDK fallback."
            exit 1
          fi
          case "${IMAGE##*/}" in *:*) IMAGE_NOTAG="${IMAGE%:*}" ;; *) IMAGE_NOTAG="$IMAGE" ;; esac
          pinned="${IMAGE_NOTAG}@${DIGEST}"
          case "${TESTER_IMAGE##*/}" in *:*) TESTER_NOTAG="${TESTER_IMAGE%:*}" ;; *) TESTER_NOTAG="$TESTER_IMAGE" ;; esac
          tester_pinned="${TESTER_NOTAG}@${TESTER_DIGEST}"
          # Warm digest ⇒ ZERO registry trips: prepare staged the image as a per-digest tarball in
          # the actions cache (blob). The fallback pull fetches the SAME digest-pinned bytes,
          # loudly — a perf fallback, never a verification one.
          if [ -f "$RUNNER_TEMP/platform-image/image.tar.zst" ]; then
            echo "platform image: cache HIT for $DIGEST — docker load, no ACR"
            zstd -dc "$RUNNER_TEMP/platform-image/image.tar.zst" | docker load
            img="$(cat "$RUNNER_TEMP/platform-image/image-id.txt")"
            docker image inspect "$img" >/dev/null 2>&1 || { echo "::error::the cached tarball loaded but image id $img is absent — delete the platform-image-$DIGEST cache entry and rerun"; exit 1; }
          else
            [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::image cache MISS and no acr credentials — the image cannot be fetched."; exit 1; }
            echo "platform image: cache MISS for $DIGEST — pulling from ACR (same bytes, only slower)"
            echo "$ACR_PASSWORD" | docker login "${IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
            docker pull -q --platform linux/amd64 "$pinned"
            img="$pinned"
          fi
          tester_app="$RUNNER_TEMP/tester-app"
          if [ ! -f "$tester_app/mw-plugin-test.dll" ]; then
            [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::tester cache MISS and no acr credentials."; exit 1; }
            echo "tester-app cache MISS for $TESTER_DIGEST — extracting once"
            echo "$ACR_PASSWORD" | docker login "${TESTER_IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
            docker pull -q --platform linux/amd64 "$tester_pinned"
            rm -rf "$tester_app"
            tcid=$(docker create --platform linux/amd64 "$tester_pinned")
            docker cp -q "$tcid:/app" "$tester_app"
            docker rm "$tcid" >/dev/null
          else
            echo "tester-app cache HIT for $TESTER_DIGEST"
          fi
          out="$RUNNER_TEMP/module-build"
          rm -rf "$out"; mkdir -p "$out"; chmod 777 "$out"
          accepts=()
          for construct in $ACCEPT; do accepts+=(--accept "$construct"); done
          # The image's stale copy of a moved type's old home — see superseded-image-assemblies.
          # Empty ⇒ no flags ⇒ byte-identical invocation to before this input existed.
          superseded=()
          for asm in ${SUPERSEDED//,/ }; do superseded+=(--superseded-image-assembly "$asm"); done
          [ "${#superseded[@]}" -eq 0 ] || echo "superseding ${#superseded[@]} image assembl(y|ies) from the reference set: ${SUPERSEDED}"
          args=()
          for prj in "${projects[@]}"; do args+=("/repo/$prj"); done
          echo "global build: ${#projects[@]} container entr(y|ies) in ONE workspace — ${projects[*]}"
          # AS THE RUNNER'S UID (a root-owned /out is unwritable to later steps); HOME=/tmp keeps
          # runtime probes off read-only image paths. No --extra-refs, ever, on this lane.
          docker run --rm --init --platform linux/amd64 \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$tester_app:/tester:ro" \
            -v "$out:/out" \
            --entrypoint dotnet "$img" \
            /tester/mw-plugin-test.dll build-project "${args[@]}" --output /out ${accepts[@]+"${accepts[@]}"} ${superseded[@]+"${superseded[@]}"} 2>&1 | tee "$out/workspace-build.log"
          echo "built=true" >> "$GITHUB_OUTPUT"
      # 🚨 THE PLATFORM CHECKOUT LANDS **AFTER** THE BUILD, ON PURPOSE. This job mounts
      # `$GITHUB_WORKSPACE` at `/repo:ro` for the container build, so anything checked out beside
      # the content tree BEFORE that line is inside what the builder sees. The pack job checks
      # core out at `path: meshweaver` up front because it has no such mount; here the order is
      # inverted so the compile input stays exactly the content repository and nothing else.
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      # ───────────── THE BUILD ASSERTS ITS OWN POSTCONDITION (Plugins#1051) ─────────────
      # A green here used to mean "the compiler did not throw" and was read as "the selected set
      # was emitted". Those are different claims, and the gap between them surfaced N JOBS LATER:
      # seven bundle jobs red with `the global workspace build produced no MeshWeaver.AI.OpenAI.dll`
      # on a PR whose entire diff was one XML doc comment, while THIS job reported success in the
      # same run (Plugins#1051, run 33480755857). The downstream message was accurate and in the
      # wrong place — the job that knew the selection was the one that stayed green.
      #
      # So the producer now checks what the consumers demand, against the SAME enumerator the pack
      # matrix expands (`needs.select.outputs.modules`, not a re-derivation and not a glob of the
      # output — a second enumerator is the defect one level up). One accurate failure here
      # replaces N inaccurate ones there, and no SHORT workspace is ever handed to the matrix:
      # this step sits BEFORE the upload.
      #
      # 🚨 NO `if:` ON IT. The sdk-only case is handled INSIDE the script (it asserts nothing and
      # says so) rather than by a condition that would render as a grey tick indistinguishable
      # from a pass. Its self-test runs FIRST and fails the job — an unproven postcondition is
      # exactly the thing #1051 is about.
      - name: The global build emitted every selected module (postcondition)
        env:
          MODULES: ${{ needs.select.outputs.build-modules }}
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/workspace-build-verify.py --self-test
          printf '%s' "$MODULES" > "$RUNNER_TEMP/selection.json"
          python3 meshweaver/.github/scripts/workspace-build-verify.py \
            --modules "@$RUNNER_TEMP/selection.json" \
            --output "$RUNNER_TEMP/module-build"
      # ───────── THE LEDGER HEARS ABOUT THIS JOB — a heartbeat on success, the verdict on failure ─────────
      # A claim taken in `select` must stay fresh across this job (queue + up to 30 min of compile);
      # a heartbeat here keeps a follower from taking the key over mid-build. On failure the verdict
      # is per key: an entry whose assembly the workspace never emitted and whose project the log
      # names in a compiler error FAILED in `compile` (blocking — same inputs, same result); every
      # other claimed entry was ABORTED by fail-fast on someone else's error (`workspace`, never
      # blocking). Neither step can red the job: the ledger is coordination, not verification.
      - name: Ledger — heartbeat every claimed key
        if: inputs.ledger == 'required'
        env:
          MODULES: ${{ needs.select.outputs.build-modules }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            python3 meshweaver/.github/scripts/module-build-ledger.py heartbeat --key "$key"
          done < <(jq -r '.[] | select(.build == "container") | .ledger.key // empty' <<< "$MODULES")
      - name: Ledger — record the compile verdict of a failed workspace
        if: failure() && inputs.ledger == 'required'
        env:
          MODULES: ${{ needs.select.outputs.build-modules }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/module-build"
          log="$out/workspace-build.log"
          while IFS=$'\t' read -r module project key; do
            [ -n "$key" ] || continue
            phase=workspace
            evidence="$RUNNER_TEMP/failure-$module.txt"
            if [ ! -f "$out/$module/$module.dll" ] && [ -f "$log" ] && grep -F "$(dirname "$project")/" "$log" | grep -q 'error CS'; then
              phase=compile
              grep -F "$(dirname "$project")/" "$log" | grep 'error CS' | head -50 > "$evidence"
            else
              { echo "the one-workspace build failed before this module's verdict; log tail:"; tail -40 "$log" 2>/dev/null; } > "$evidence"
            fi
            python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$key" --status Failed --phase "$phase" --failure-file "$evidence" || true
          done < <(jq -r '.[] | select(.build == "container") | select(.ledger.key != null) | [.module, .project, .ledger.key] | @tsv' <<< "$MODULES")
      - name: Hand the workspace to the matrix
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build-${{ needs.select.outputs.lane }}
          path: ${{ runner.temp }}/module-build
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Module bundle (${{ matrix.entry.module }})
    needs: [select, prepare, build-workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 🚨 This is a MODE SWITCH on the selection's own output, not a skip-trapdoor: GitHub refuses
    # a matrix with no vectors, so an empty selection has to express itself as "this job does not
    # run". What makes it safe is that `verify` below runs UNCONDITIONALLY and asserts the pairing
    # — a zero count with receipts, or a non-zero count with a skipped pack job, is RED. Never
    # replace it with a condition that asks whether an input or a secret happens to be set.
    # (`select.result` too, not just the count: a FAILED select emits no count at all, and
    # `'' != '0'` is true — the matrix would then fail to evaluate instead of the verify job
    # naming the real cause.)
    # (An explicit `if:` replaces the implicit all-needs-succeeded check, so prepare's result
    # is asserted by name — a failed prepare must stop the matrix, not strand 30 jobs at their
    # artifact downloads.)
    if: needs.select.result == 'success' && needs.select.outputs.count != '0' && needs.prepare.result == 'success' && needs.build-workspace.result == 'success'
    strategy:
      # One module's failure must not hide the rest — a sweep wants every verdict in one run.
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.select.outputs.modules) }}
    steps:
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository:
      # Systemorph/MeshWeaver.Plugins` (private) answers 404 under it — the platform's first release
      # wave died on exactly that (main-cd run 33276813173, 2026-08-29). When content-repository is
      # set, the App credential is ASSERTED red, never fallen back on: a fallback to github.token
      # would 404 anyway, one step later and blaming the checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      # ═══════ THE .NET SDK — INSTALLED BECAUSE SOMETHING DECLARED IT, NOT BY REFLEX ═══════
      # 🚨 "make installing dotnet sdk a feature flag" (maintainer, 2026-08-31). The rationale and
      # the anti-trapdoor argument are at the top of this file, under "The .NET SDK is a DECLARED
      # need"; what follows is the decision itself.
      #
      # ONE step, UNCONDITIONAL, that always says which way it went and why. It enumerates the
      # consumers this job would hand to a runner SDK, applies the caller's policy, and — when the
      # answer is "none" — makes the absence REAL, because the runner ships an SDK of its own and a
      # silent fallback to it is the same class of lie as a skipped gate rendering a green tick.
      - name: Does this job need the .NET SDK?
        id: sdk
        env:
          POLICY: ${{ inputs.dotnet-sdk }}
          MODE: ${{ matrix.entry.build || 'sdk' }}
          MODULE: ${{ matrix.entry.module }}
          PROJECT: ${{ matrix.entry.project }}
          RUN_TESTS: ${{ matrix.entry.test != false }}
        run: |
          set -euo pipefail
          # EVERY consumer this job would hand to a runner SDK, named one by one and evaluated
          # against this entry — not a summary, an inventory. `build: container` (MeshWeaver#2854)
          # removes the COMPILER from it and NOTHING ELSE: the container path still reads the
          # emitted assembly's identity with a `dotnet run` file-based app, the packer is a
          # `dotnet build` + `dotnet run` in every mode, and a module that ships a test suite is a
          # `dotnet test` the image's build-project cannot do at all. An omission here is exactly
          # what would let a converted lane skip an install it needs and then blame the shim four
          # steps later, so the list is deliberately complete rather than convenient.
          consumers=()
          if [ "$MODE" = "container" ]; then
            echo "compiler: NOT a consumer — $MODULE declares build=container, so the pinned platform image compiles it"
            consumers+=("the binding-identity probe — the container path reads ${MODULE}.dll's AssemblyVersion with a 'dotnet run' file-based app")
          else
            consumers+=("the compiler for $MODULE — its matrix entry declares build=$MODE, i.e. 'dotnet build' + 'dotnet publish' on this runner")
          fi
          consumers+=("the module-pack tool — prebuilt once by the prepare job, but 'dotnet <dll>' still takes the runner's dotnet; a pack-module verb inside the image would remove this last every-mode consumer")
          # Resolved against the tree, exactly as the test step below resolves it, so a module with
          # no suite does not carry a consumer it does not have.
          tests="$(dirname "$PROJECT").Test"
          if [ "$RUN_TESTS" = "true" ] && [ -d "$tests" ]; then
            consumers+=("the module's own suite — 'dotnet test $tests', a verb the image's build-project does not have at all")
          fi
          case "$POLICY" in
            install)
              install=true
              verdict="policy 'install' (the default) — installed whatever the consumers say"
              ;;
            by-declaration)
              if [ "${#consumers[@]}" -gt 0 ]; then install=true; else install=false; fi
              verdict="policy 'by-declaration' — ${#consumers[@]} declared consumer(s) in this job"
              ;;
            *)
              echo "::error::inputs.dotnet-sdk is '$POLICY'. The only values are 'install' (the default) and 'by-declaration'. An unreadable flag must NEVER resolve to 'do not install' — that is a skipped check wearing a green tick."
              exit 1
              ;;
          esac
          echo "declared consumers of a runner SDK in this job:"
          for consumer in ${consumers[@]+"${consumers[@]}"}; do echo "  • $consumer"; done
          if [ "$install" = true ]; then
            headline=".NET SDK on the runner: INSTALLED"
            echo "$headline — $verdict"
          else
            headline=".NET SDK on the runner: NOT INSTALLED"
            echo "$headline — $verdict; the pinned platform image is the only compiler in this job"
            # 🚨 Make the absence REAL. ubuntu-latest ships its own SDK, so declining to install one
            # is not the same as not having one: without this, a consumer nobody declared would
            # quietly build against whatever .NET the runner image happens to carry, and the log of
            # a converted lane would be indistinguishable from the log of an unconverted one.
            shim="$RUNNER_TEMP/no-dotnet"
            mkdir -p "$shim"
            cat > "$shim/dotnet" <<'SHIM'
          #!/usr/bin/env bash
          echo "::error::a step invoked 'dotnet $*', but this job declared dotnet-sdk: by-declaration and named no consumer that needs the .NET SDK, so none was installed. Either add that consumer to the 'Does this job need the .NET SDK?' step, or set dotnet-sdk: install on the caller. Falling back to the runner's preinstalled SDK is deliberately not an option — it would make a converted lane and an unconverted one look identical in a green log."
          exit 97
          SHIM
            chmod +x "$shim/dotnet"
            echo "$shim" >> "$GITHUB_PATH"
            echo "a FAILING 'dotnet' shim is on PATH ($shim) — nothing in this job can quietly use the runner's preinstalled SDK"
          fi
          echo "install=$install" >> "$GITHUB_OUTPUT"
          {
            echo "### $headline"
            echo
            echo "- flag: \`dotnet-sdk: $POLICY\` (default \`install\`)"
            echo "- compiler for \`$MODULE\`: \`$MODE\`"
            echo "- declared consumers of a runner SDK:"
            for consumer in ${consumers[@]+"${consumers[@]}"}; do echo "  - $consumer"; done
          } >> "$GITHUB_STEP_SUMMARY"
      # 🚨 The ONE `if:` this flag introduces, and it guards an INSTALLER, not a gate. Every build,
      # pack, inspect and test step below still runs and still gates whichever way it goes; when it
      # is skipped, the step above has already put a failing `dotnet` on PATH, so an undeclared
      # consumer goes RED naming the flag rather than silently using the runner's own SDK.
      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.install == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Read the package version + platform floor from the content half
        id: identity
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' "$PACKAGE/manifest.lock")
          floor=$(jq -er '.content.minMeshVersion' "$PACKAGE/index.json")
          declared=$(jq -er '.content.module' "$PACKAGE/index.json")
          if [ "$declared" != "$MODULE" ]; then
            echo "::error::$PACKAGE/index.json declares content.module='$declared' but this entry packs '$MODULE' — the two halves of the mixed package drifted"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "packing $MODULE as $PACKAGE@$version, platform floor $floor"

      # ───────────── THE LEDGER'S PLAN FOR THIS ENTRY — build it, or reuse another run's bundle ─────────────
      # `select` annotated the entry (`ledger.decision`, `ledger.key`, what is still needed). ONE
      # step reads it, prints it, and hands the rest of the job three booleans; with the ledger off
      # the plan is "build, test if the entry says so, publish if the caller says so" — today's leg.
      # A `reuse` leg downloads the recorded run's bundle artifact (sha256 verified against the
      # record), runs only the phases the record lacks, and drops the same artifact, marker and
      # receipt a built leg drops — a caller composing this bundle cannot tell the two apart, and
      # must not need to. The heartbeat keeps the claim fresh across this job's queue time.
      - name: Ledger — this entry's plan
        id: plan
        env:
          LEDGER: ${{ inputs.ledger }}
          ENTRY_LEDGER: ${{ toJSON(matrix.entry.ledger) }}
          RUN_TESTS: ${{ matrix.entry.test != false }}
          PUBLISH: ${{ inputs.publish }}
          MODULE: ${{ matrix.entry.module }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          decision=build; key=""; need_test="$RUN_TESTS"; need_publish="$PUBLISH"; art_run=""; art_name=""; sha=""; holder=""
          if [ "$LEDGER" = "required" ] && [ "$ENTRY_LEDGER" != "null" ] && [ -n "$ENTRY_LEDGER" ]; then
            decision=$(jq -r '.decision // "build"' <<< "$ENTRY_LEDGER")
            key=$(jq -r '.key // ""' <<< "$ENTRY_LEDGER")
            if [ "$decision" = "reuse" ]; then
              need_test=$(jq -r 'if .needTest then "true" else "false" end' <<< "$ENTRY_LEDGER")
              need_publish=$(jq -r 'if .needPublish then "true" else "false" end' <<< "$ENTRY_LEDGER")
              art_run=$(jq -r '.artifact.runId // ""' <<< "$ENTRY_LEDGER")
              art_name=$(jq -r '.artifact.name // ""' <<< "$ENTRY_LEDGER")
              sha=$(jq -r '.bundleSha256 // ""' <<< "$ENTRY_LEDGER")
              holder=$(jq -r '.holder // ""' <<< "$ENTRY_LEDGER")
              [ -n "$art_run" ] && [ -n "$art_name" ] || { echo "::error::the ledger said REUSE for $MODULE but named no bundle artifact — nothing to reuse; this is a select-step defect, not a build failure"; exit 1; }
              echo "plan: REUSE $MODULE from run $art_run ($art_name, sha256 ${sha:-unrecorded}; holder $holder) — tests: $need_test, publish: $need_publish"
            else
              echo "plan: BUILD $MODULE (ledger key ${key:-<none>}; $(jq -r 'if .unavailable then "WITHOUT coordination: " + .unavailable else "attempt " + (.attempts|tostring) end' <<< "$ENTRY_LEDGER")) — tests: $need_test, publish: $need_publish"
              [ -z "$key" ] || python3 meshweaver/.github/scripts/module-build-ledger.py heartbeat --key "$key"
            fi
          else
            echo "plan: BUILD $MODULE (ledger off) — tests: $need_test, publish: $need_publish"
          fi
          {
            echo "decision=$decision"; echo "key=$key"; echo "need_test=$need_test"; echo "need_publish=$need_publish"
            echo "art_run=$art_run"; echo "art_name=$art_name"; echo "sha=$sha"; echo "holder=$holder"
          } >> "$GITHUB_OUTPUT"

      # 🚨 THE PLATFORM IS THE IMAGE. When the caller pins platform-image-digest, the module is
      # compiled against the assemblies the portal actually runs (docker cp of /app, cached per
      # digest so a run pulls it once), and the platform checkout above serves only restore
      # (Directory.Packages.props, the test/ props) — no platform project is built here. The
      # caller's src/Directory.Build.targets must honour MeshWeaverRefs (Plugins #926); a caller
      # without it just builds from source as before, which is why this is additive.
      - name: Restore the platform image's assemblies from cache
        if: inputs.platform-image-digest != ''
        id: platform-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/platform-refs
          key: platform-refs-${{ inputs.platform-image-digest }}
      - name: Take the platform from the image (docker cp /app)
        if: inputs.platform-image-digest != '' && steps.platform-cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::platform-image-digest is set but platform-image is empty — name the image the digest belongs to"; exit 1; }
          [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ] || { echo "::error::platform-image-digest is set but the acr-username/acr-password secrets are not passed — the image cannot be pulled"; exit 1; }
          echo "$ACR_PASSWORD" | docker login "${IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
          # 🚨 --platform linux/amd64 ALWAYS: framework identities are per-architecture build (the
          # ci.6469 manifest list resolves to s770d75c… on x64 and sfe27877f… on arm64), and the
          # bundles are sealed under the x64 identity the portals run. A multi-arch digest pulled on
          # an arm64 runner would compile against a platform the gates never test.
          # Strip a TAG only — a colon after the last slash. `${IMAGE%%:*}` would also eat a registry
          # port (registry:5000/repo) and `${IMAGE%:*}` would eat the path when there is no tag.
          case "${IMAGE##*/}" in *:*) IMAGE_NOTAG="${IMAGE%:*}" ;; *) IMAGE_NOTAG="$IMAGE" ;; esac
          cid=$(docker create --platform linux/amd64 "${IMAGE_NOTAG}@${DIGEST}")
          mkdir -p "$RUNNER_TEMP/platform-refs"
          docker cp "$cid:/app/." "$RUNNER_TEMP/platform-refs/"
          docker rm "$cid" >/dev/null
          shopt -s nullglob
          dlls=("$RUNNER_TEMP"/platform-refs/*.dll)
          n=${#dlls[@]}
          [ "$n" -gt 50 ] || { echo "::error::the image's /app yielded $n assemblies — not a platform image"; exit 1; }
          echo "platform refs: $n assemblies from ${IMAGE_NOTAG}@${DIGEST}"
      # ══════════ THE COMPILER — the CONTAINER or the SDK, and the log says WHICH ══════════
      # 🚨 "we want to use memex build plugin and not dotnet build" (maintainer, 2026-08-31). A
      # module does not run against a source tree and it does not run against a feed: it is loaded
      # into the platform IMAGE and bound by the assemblies in there. So the honest compiler is
      # that image's own — `memex build project`, whose work is `mw-plugin-test build-project`
      # INSIDE the pinned image: no .NET SDK, no NuGet restore, no platform source checkout. The
      # `docker run … --entrypoint /app/mw-plugin-test … build-project` below IS that verb; the
      # `memex` half is only the trip into the container, and CI has already pinned the image by
      # digest, so reaching for the tool would add an SDK build to remove one.
      #
      # 🚨 IT IS NOT YET A BLANKET SWAP, AND PRETENDING OTHERWISE WOULD BREAK MOST BUNDLES. The
      # builder's own sweep over all 54 non-test projects in MeshWeaver.Plugins/src compiled 12
      # green (MeshWeaver#2850); the rest need what a RUNTIME image does not carry — SDK source
      # generators (15), Razor/Blazor (15), `<Protobuf>` (3), additional libraries (5), portal
      # hosts (3). So the compiler is chosen PER ENTRY and DECLARED by the caller
      # (`"build": "container"`), never guessed.
      #
      # 🚨 AND NEVER A FALLBACK. A lane that tries the container and quietly drops back to the SDK
      # makes "the container built it" and "the SDK built it" indistinguishable in a green log —
      # the one thing a gate in this family may not do. A declared mode that cannot run FAILS.
      #
      # ONE step, not two `if:`-guarded ones: two guards can BOTH skip, and a skipped step renders
      # with the same tick as a passed one. This step always runs, always prints the compiler it
      # used, records it in the receipt, and refuses a mode it does not know.
      # The tester's extracted /app, cached by DIGEST — one extraction per digest per repo,
      # every later job restores it in seconds instead of pulling the tester image at all.
      # The global workspace build's outputs — every container entry's assemblies, closure
      # manifests and the one build log. Container packs consume THIS; sdk entries ignore it.
      - name: Fetch the global workspace build
        if: ${{ (matrix.entry.build || 'sdk') == 'container' && steps.plan.outputs.decision == 'build' }}
        uses: actions/download-artifact@v8
        with:
          name: workspace-build-${{ needs.select.outputs.lane }}
          path: ${{ runner.temp }}/workspace-build
      # 🚨 `if: decision == 'build'` on the build/pack/inspect trio is a MODE SWITCH on the ledger's
      # plan, not a skip-trapdoor: the reuse leg below runs in their place, is itself unconditional
      # within its mode, verifies the bytes it fetched, and drops the same artifact/marker/receipt —
      # so `verify` still counts this entry, and a leg that did neither is still RED there.
      - name: Build the module — and say which compiler produced it
        id: build
        if: steps.plan.outputs.decision == 'build'
        env:
          MODE: ${{ matrix.entry.build || 'sdk' }}
          ACCEPT: ${{ matrix.entry.accept || '' }}
          PROJECT: ${{ matrix.entry.project }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          IMAGE: ${{ inputs.platform-image }}
          DIGEST: ${{ inputs.platform-image-digest }}
          TESTER_IMAGE: ${{ inputs.tester-image }}
          TESTER_DIGEST: ${{ inputs.tester-image-digest }}
          # For `gh run download` of sibling module-dll artifacts (the prebuilt lane).
          GH_TOKEN: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
          REFS: ${{ inputs.platform-image-digest != '' && format('{0}/platform-refs', runner.temp) || '' }}
        run: |
          set -euo pipefail
          # The closure arguments are written HERE and read by the pack step, so the compiler that
          # ran is the one that says what rides: the SDK path derives the private closure from the
          # deps.json only it produces (--deps-closure), the container path names the module-owned
          # siblings it actually emitted (--with). One producer, one reader, no re-derivation.
          packargs="$RUNNER_TEMP/pack-args"
          : > "$packargs"
          case "$MODE" in
            sdk)
              compiler="dotnet SDK on the runner"
              echo "compiler: dotnet SDK $(dotnet --version) on the runner — the LEGACY path"
              echo "🚧 $MODULE has not been converted to \`memex build project\` yet. Declare"
              echo "🚧 \`\"build\": \"container\"\` on its \`modules:\` entry once it compiles against the image."
              dotnet build "$PROJECT" -c Release -warnaserror \
                -p:MeshWeaverRoot="$GITHUB_WORKSPACE/meshweaver" \
                -p:Version="$VERSION" \
                ${REFS:+-p:MeshWeaverRefs=$REFS}
              # Publish materializes the module's PACKAGE dependencies beside the entry DLL — the
              # SDK's own answer to the runtime closure (framework-trimmed packages excluded,
              # everything else included), which --deps-closure selects from. A
              # -p:CopyLocalLockFileAssemblies=true build was tried first and copied NOTHING on the
              # CI SDK while copying everything on a dev machine (2026-08-20, 12/14 jobs) — publish
              # does not depend on that flag at all.
              # 🚨 The SAME reference set as the build: --no-build re-evaluates the project, and
              # without -p:MeshWeaverRefs the platform ProjectReferences the build had dropped come
              # back — publish then copies their outputs, which were never built ("MSB3030: Could
              # not copy meshweaver/src/MeshWeaver.Graph/bin/Release/net10.0/MeshWeaver.Graph.dll",
              # Plugins #940).
              dotnet publish "$PROJECT" -c Release --no-build \
                -p:MeshWeaverRoot="$GITHUB_WORKSPACE/meshweaver" \
                -p:Version="$VERSION" \
                ${REFS:+-p:MeshWeaverRefs=$REFS}
              packdir="$GITHUB_WORKSPACE/$(dirname "$PROJECT")/bin/Release/net10.0/publish"
              printf '%s\n' --deps-closure >> "$packargs"
              # What resolved this bundle's private closure — recorded, not merely implied. It is
              # stamped into the built marker below and the verifier REFUSES a marker without it:
              # "the bundle exists" and "the bundle is composable" must be one claim, not two
              # facts that happen to be produced by adjacent steps (Plugins#1077).
              closure_evidence="deps-closure (from the publish deps.json)"
              ;;
            container)
              compiler="memex build project (ONE global workspace build)"
              # 🚨 LOCAL BUILDS ARE DISCONTINUED ("we want *one* central build *no* per project
              # build … one global one and finish", maintainer, 2026-09-01). The build-workspace
              # job compiled every selected container entry in ONE Roslyn workspace inside the
              # pinned platform container; this job only CONSUMES its artifact. A module missing
              # from it is RED here — by design there is no local rebuild to slide into, exactly
              # as there is no SDK fallback.
              ws="$RUNNER_TEMP/workspace-build"
              log="$ws/workspace-build.log"
              packdir="$ws/$MODULE"
              if [ ! -f "$packdir/$MODULE.dll" ]; then
                # 🚨 build-workspace now asserts this very file EXISTS for every selected entry
                # before it uploads (Plugins#1051), so a green build can no longer be a short one.
                # Reaching here therefore means this job read the WRONG workspace — a sibling
                # call's artifact (Plugins#1077) or a torn download — not that the build skipped
                # the module. Still never rebuild locally: that would paper over which artifact
                # arrived.
                echo "::error::the global workspace build produced no $MODULE.dll under $packdir — yet build-workspace asserted every selected entry's assembly before uploading. So the workspace this job downloaded is not the one this call built (a sibling call's artifact, or a torn download); the lane key is ${{ needs.select.outputs.lane }}. Local builds are discontinued: fix which artifact arrives, never rebuild here."
                exit 1
              fi
              closure_file="$ws/$MODULE.closure.txt"
              if [ ! -f "$closure_file" ]; then
                echo "::error::the global build wrote no closure manifest for $MODULE — without it this job cannot know which in-tree siblings ride THIS bundle (a shared workspace output holds every entry's assemblies side by side, and globbing it would ride every other module)."
                exit 1
              fi
              closure_evidence="$MODULE.closure.txt ($(wc -l < "$closure_file" | tr -d ' ') entr(y|ies)) from the global workspace build"
              echo "compiler: CONTAINER — consumed from the ONE global workspace build (no docker, no registry, no compile in this job)"
              # MODULE-OWNED in-tree siblings (from THIS module's closure manifest, never a glob of
              # the shared output) MUST ride; image-shipped ones must NOT (same-identity duplicate
              # beside /app's copy — the #143 family). Same script as packer + inspection.
              own="$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
              while IFS= read -r name; do
                { [ -n "$name" ] && [ "$name" != "$MODULE" ]; } || continue
                dir="$ws/$name"
                [ -d "$dir" ] || continue   # resolved from the image, nothing emitted — nothing to ride
                case "$name" in
                  MeshWeaver.*) ;;
                  *)
                    echo "::error::the global build emitted '$name' in $MODULE's closure. Only MeshWeaver.* siblings can be classified as platform-carried or module-owned — build $MODULE on the sdk path until this lane can decide."
                    exit 1
                    ;;
                esac
                if printf '%s' ";$own;" | grep -qF ";$name;"; then
                  cp "$dir/$name.dll" "$packdir/"
                  if [ -f "$dir/$name.pdb" ]; then cp "$dir/$name.pdb" "$packdir/"; fi
                  printf '%s\n%s\n' --with "$name.dll" >> "$packargs"
                  echo "closure: $name.dll RIDES — module-owned (its source is in this repo's src/, so it is nowhere in the image's /app)"
                else
                  echo "closure: $name.dll does NOT ride — the image ships it (src/platform-shipped.txt); bundling it would land a same-identity duplicate beside /app's copy"
                fi
              done < "$closure_file"
              # The PRIVATE CLOSURE rides: module-libs.txt is the builder-written provenance —
              # every non-framework assembly this module's own PackageReferences pull in, sourced
              # from the image's /app and the module-libraries shelf.
              # 🚨 "The image has it" is NOT a reason to leave one out. The reference image is a
              # PORTAL, and a portal with a module compiled into it carries that module's private
              # dependencies too: reading /app as a platform guarantee dropped Microsoft.Agents.AI
              # out of the AI bundle and threw ReflectionTypeLoadException in every host that was
              # not that exact image — this repo's bake gate and MeshWeaver.Reinsurance's trunk
              # (MeshWeaver.Plugins#1043). The SHARED FRAMEWORK is the only sound omission.
              if [ -f "$packdir/module-libs.txt" ]; then
                while IFS= read -r ride; do
                  [ -n "$ride" ] || continue
                  printf '%s\n%s\n' --with "$ride" >> "$packargs"
                  echo "closure: $ride RIDES — the module's private closure (deps.json-derived, from the image or the shelf)"
                done < "$packdir/module-libs.txt"
              fi
              echo "closure: NO --deps-closure on the container path — there is no SDK deps.json to derive one from."
              echo "closure: complete BY RECORD instead — the builder walked the module's own package references over the image's and the shelf's deps.json and copied everything the shared framework does not supply; it refuses BY NAME anything neither supplies, and this lane passes no --extra-refs."
              # 🚨 THE BINDING IDENTITY, CHECKED (MeshWeaver#143): the expected value is the one
              # the global builder read out of the image, so it cannot drift from what the portals
              # run. The global build log carries it once for the whole workspace.
              platform_version="$(sed -n 's/.*platform AssemblyVersion \([0-9][0-9.]*\).*/\1/p' "$log" | head -1)"
              if [ -z "$platform_version" ]; then
                echo "::error::could not read 'platform AssemblyVersion' out of the global build log ($log). The binding-identity check cannot run, and a check that quietly does not run reads exactly like one that passed."
                exit 1
              fi
              printf '%s\n' 'Console.WriteLine(System.Reflection.AssemblyName.GetAssemblyName(args[0]).Version);' > "$RUNNER_TEMP/asmver.cs"
              module_version="$(DOTNET_NOLOGO=1 dotnet run "$RUNNER_TEMP/asmver.cs" -- "$packdir/$MODULE.dll" | tail -1)"
              if [ "$module_version" != "$platform_version" ]; then
                echo "::error::binding identity drift: $MODULE.dll was emitted as AssemblyVersion $module_version, but every MeshWeaver.* assembly in the platform image carries $platform_version — a runtime FileNotFoundException, not a build error (MeshWeaver#143)."
                exit 1
              fi
              echo "identity: $MODULE.dll AssemblyVersion $module_version == the image's $platform_version"
              ;;
            *)
              echo "::error::matrix entry '$MODULE' declares build='$MODE'. The only values are 'container' (memex build project, inside the pinned platform image) and 'sdk' (dotnet build on the runner — the default). A typo must not silently pick either one."
              exit 1
              ;;
          esac
          # `closure` is never empty by the time we get here: both branches set it, and the only
          # paths that leave it unset already exited 1 above. The built marker carries it so that
          # the VERIFIER — not the order the steps happen to sit in — is what asserts this bundle
          # was composable (Plugins#1077).
          {
            echo "compiler=$MODE"
            echo "packdir=$packdir"
            echo "closure=$closure_evidence"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### \`$MODULE\` — compiled by **$compiler**"
            echo
            echo "- mode: \`$MODE\` (\`container\` = memex build project inside the pinned image; \`sdk\` = dotnet build on the runner)"
            echo "- pack input: \`$packdir\`"
            echo "- closure args: \`$( (tr '\n' ' ' < "$packargs") || true )\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────────── THE REUSE LEG — another run already built these bytes ─────────────
      # The ledger's record names the run and the artifact; `select` already asked the API that the
      # artifact exists and is not expired. Download it with this run's token (the caller's job needs
      # `permissions: actions: read` — without it `select` never says reuse), and verify the sha256
      # against the record: bytes that do not match the ledger are a FAULT (a re-uploaded artifact,
      # a torn download), never something to pack anyway.
      - name: Reuse the bundle another run built (ledger)
        id: reused
        if: steps.plan.outputs.decision == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          ART_RUN: ${{ steps.plan.outputs.art_run }}
          ART_NAME: ${{ steps.plan.outputs.art_name }}
          EXPECTED_SHA: ${{ steps.plan.outputs.sha }}
          HOLDER: ${{ steps.plan.outputs.holder }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundles"
          gh run download "$ART_RUN" -R "$GITHUB_REPOSITORY" -n "$ART_NAME" -D "$RUNNER_TEMP/bundles"
          bundle="$RUNNER_TEMP/bundles/MeshWeaver.Plugin.$PACKAGE.$VERSION.module.nupkg"
          if [ ! -f "$bundle" ]; then
            found=$(find "$RUNNER_TEMP/bundles" -name '*.module.nupkg' | head -1)
            echo "::error::run $ART_RUN's artifact $ART_NAME carries no MeshWeaver.Plugin.$PACKAGE.$VERSION.module.nupkg (found: ${found:-nothing}) — the ledger record and this checkout's manifest.lock disagree about the version; the key should have differed. Not reusing."
            exit 1
          fi
          actual=$(sha256sum "$bundle" | cut -d' ' -f1)
          if [ -n "$EXPECTED_SHA" ] && [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::the downloaded bundle's sha256 $actual is not the ledger's $EXPECTED_SHA (record by $HOLDER) — the bytes are not the ones the record attests. Not reusing."
            exit 1
          fi
          echo "reused: $bundle (sha256 $actual) from run $ART_RUN — built and inspected there ($HOLDER); no compile, no pack, no inspection in this job"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          {
            echo "### \`$MODULE\` — **reused** from run $ART_RUN"
            echo
            echo "- record: $HOLDER"
            echo "- sha256: \`$actual\` (verified against the ledger)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Published ONCE by the prepare job — `dotnet build` here cost 48–79s in EVERY job (measured
      # across Plugins#1032). A missing artifact fails this download RED rather than quietly
      # rebuilding a maybe-different tool.
      - name: Fetch the module-pack tool (built once by prepare)
        if: steps.plan.outputs.decision == 'build'
        uses: actions/download-artifact@v8
        with:
          name: module-pack-tool-${{ needs.select.outputs.lane }}
          path: ${{ runner.temp }}/pack-tool

      - name: Pack the module bundle
        id: pack
        if: steps.plan.outputs.decision == 'build'
        env:
          PACKDIR: ${{ steps.build.outputs.packdir }}
          COMPILER: ${{ steps.build.outputs.compiler }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          FLOOR: ${{ steps.identity.outputs.floor }}
          # 🚨 THE IDENTITY ANCHOR'S HOME — the SAME expression the build step uses, so the anchor
          # named below and the reference set the bytes were compiled against cannot be two
          # different things. When a platform image is pinned, `platform-refs` is a `docker cp` of
          # its /app, which the sdk build passes as `-p:MeshWeaverRefs=$REFS` and the container
          # build compiles inside; when none is, it is empty and the platform came from source.
          REFS: ${{ inputs.platform-image-digest != '' && format('{0}/platform-refs', runner.temp) || '' }}
        run: |
          set -euo pipefail
          # 🚨 The closure flags come from the COMPILER THAT RAN, written to a file by the step
          # above rather than re-derived here — the SDK path derives the private closure from its
          # own deps.json (--deps-closure), the container path names the module-owned siblings it
          # emitted (--with). Re-deriving here would be a second opinion about what ships.
          closure=()
          while IFS= read -r flag; do closure+=("$flag"); done < "$RUNNER_TEMP/pack-args"
          # ───────── WHAT THIS BUNDLE WAS BUILT AGAINST, STATED — never omitted (#3211) ─────────
          # Measured on MeshWeaver.Plugins run 33773265959 (2026-09-03): all 34 bundles packed
          # "built-against MVID (unrecorded)", sdk and container alike, so #3154's
          # (version, identity) comparison shipped with nothing to compare on every installation in
          # the fleet. The cause is WHERE the anchor is, and it moves with the platform:
          #
          #   * platform pinned as an IMAGE (`REFS` = the docker cp of its /app, which the sdk build
          #     passes as MeshWeaverRefs and the container build compiles inside) — the anchor is in
          #     there, and the module's own output deliberately carries no platform assembly. This
          #     is every satellite call, and it is the case the packer's default probe cannot see.
          #   * platform built from SOURCE (`REFS` empty — core's own main-cd call) — the platform
          #     ProjectReferences are real, so MeshWeaver.Compiler.dll IS beside the module in the
          #     publish output. Measured green on CD run 33779812466:
          #     "built-against MVID ce81fd4e3f5146c7a6ebaa6dc72da3f2".
          #
          # Both arms end in a RED with no anchor — neither is a quiet fallback, and the packer
          # refuses again behind them, so a bundle whose identity is a guess cannot exist.
          if [ -n "$REFS" ]; then
            anchor="$REFS/MeshWeaver.Compiler.dll"
            where="the pinned platform image's extracted /app"
          else
            anchor="$PACKDIR/MeshWeaver.Compiler.dll"
            where="the module's own build output (no platform image is pinned, so the platform was built from source)"
          fi
          if [ ! -f "$anchor" ]; then
            echo "::error::no identity anchor for $MODULE — expected MeshWeaver.Compiler.dll at '$anchor', i.e. in $where. Every bundle must state the framework build its bytes were compiled against (#3211): a consumer compares it against what it has landed, and an unstated one makes every reconcile answer 'up to date, identity could not be checked' forever. Nothing here may guess it, so the pack stops."
            exit 1
          fi
          echo "packing $MODULE from $PACKDIR (compiler: $COMPILER); closure flags: ${closure[*]:-<none>}"
          dotnet "$RUNNER_TEMP/pack-tool/MeshWeaver.Plugin.Build.dll" \
            module-pack "$PACKDIR" \
            ${closure[@]+"${closure[@]}"} \
            --module-name "$MODULE" \
            --plugin "$PACKAGE" \
            --package-version "$VERSION" \
            --min-mesh-version "$FLOOR" \
            --graph-dll "$anchor" \
            --own-platform "$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")" \
            --out "$RUNNER_TEMP/bundles"

      # A bundle that PACKED is not yet a bundle that LANDS: assert the closure and the manifest a
      # consumer's landing gate will read, loudly, instead of trusting the packer's exit code.
      - name: Inspect the bundle (manifest + assemblies)
        id: bundle
        if: steps.plan.outputs.decision == 'build'
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          # The staticAssets assertion reads the PROJECT's source tree (wwwroot/, *.razor.css) —
          # measured missing on the first 31-entry acceptance run: every container inspection died
          # `PROJECT: unbound variable` AFTER a GREEN build, because only the build step carried it.
          PROJECT: ${{ matrix.entry.project }}
          VERSION: ${{ steps.identity.outputs.version }}
          FLOOR: ${{ steps.identity.outputs.floor }}
          COMPILER: ${{ steps.build.outputs.compiler }}
          PACKDIR: ${{ steps.build.outputs.packdir }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundles/MeshWeaver.Plugin.$PACKAGE.$VERSION.module.nupkg"
          test -f "$bundle" || { echo "::error::bundle not found: $bundle"; exit 1; }
          unzip -o -q "$bundle" -d "$RUNNER_TEMP/inspect-$MODULE"
          test -f "$RUNNER_TEMP/inspect-$MODULE/meshweaver/modules/$MODULE.dll" \
            || { echo "::error::entry DLL missing from meshweaver/modules/"; exit 1; }
          manifest="$RUNNER_TEMP/inspect-$MODULE/meshweaver/manifest.json"
          jq -e --arg m "$MODULE" '.module.assemblyName == $m' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblyName is not $MODULE"; exit 1; }
          jq -e --arg d "$MODULE.dll" '.module.assemblies | index($d) != null' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblies misses the entry DLL"; exit 1; }
          jq -e --arg f "$FLOOR" '.module.minMeshVersion == $f' "$manifest" > /dev/null \
            || { echo "::error::manifest floor differs from content.minMeshVersion"; exit 1; }
          # 🚨 THE BUILT-AGAINST IDENTITY, ASSERTED ON THE BYTES — not inferred from the packer's
          # exit code (#3211). The packer refuses to omit it, so this reads the artifact back and
          # says so: a manifest with no `frameworkMvid` is a bundle whose consumers can never tell
          # a rebuild against a new platform from a no-op (#3154's comparison with nothing to
          # compare), and it must never leave this job.
          jq -e '(.frameworkMvid // "") | test("^\\S+$")' "$manifest" > /dev/null \
            || { echo "::error::the bundle states no framework identity (manifest .frameworkMvid is $(jq -c '.frameworkMvid' "$manifest")). It was built against SOMETHING; a bundle that cannot say what parks every consumer in 'up to date, identity could not be checked' forever (#3211). The pack step names the anchor — this manifest did not get it."; exit 1; }
          echo "built against: $(jq -r '.frameworkMvid' "$manifest")"
          # A module bundle must NEVER carry a PLATFORM assembly beside its entry — it would
          # shadow the platform's own binary at the consumer (the same trap-door landing refuses
          # for the entry DLL). MODULE-OWNED MeshWeaver.* assemblies (their source lives in THIS
          # repo's src/, so they exist nowhere in /app — Import's DataSetReader family) are the
          # deliberate exception: for them, NOT riding is the fault. The jq mirrors the pack's
          # --own-platform set exactly, so the two cannot disagree about what "platform" means.
          # …EXCEPT the projects the repo lists in src/platform-shipped.txt: they live in its src/
          # yet ship in the portal IMAGE (the storage backends and transports that moved out of the
          # platform with the hosts), so a bundle carrying one would land a same-identity duplicate
          # beside the app's copy. ONE script computes the set for the pack AND for this check.
          own="$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
          jq -e --arg m "$MODULE" --arg own "$own" \
            '($own | split(";")) as $owned
             | [.module.assemblies[]
                | select(startswith("MeshWeaver.")
                    and (. != $m + ".dll") and (. != $m + ".pdb")
                    and ((rtrimstr(".dll") | rtrimstr(".pdb")) as $n | $owned | index($n) | not))]
             | length == 0' \
            "$manifest" > /dev/null \
            || { echo "::error::bundle carries platform (MeshWeaver.*) assemblies beside the module"; exit 1; }
          # 🚨 The container path's closure claim, ASSERTED rather than asserted-in-prose. It packs
          # no --deps-closure because there is no SDK deps.json to derive one from; what makes that
          # sound is that build-project resolved every reference from the image's /app (it refuses
          # by name any PackageReference the image does not supply, and this lane passes no
          # --extra-refs). A NON-MeshWeaver assembly in such a bundle would contradict exactly that
          # — it could only have come from somewhere this lane cannot account for — so it is a
          # refusal, not a curiosity. The SDK path is untouched: its private closure legitimately
          # carries package assemblies.
          if [ "$COMPILER" = "container" ]; then
            # A non-MeshWeaver assembly is allowed ONLY with builder provenance: the builder's
            # module-libs.txt names every ride it derived from the image's and the shelf's
            # deps.json. Anything else has no accountable closure and must fail — the
            # 2026-08-19/20 outage shape.
            # 🚨 FROM THE BUILD STEP'S OWN packdir output — never a hard-coded layout. The global
            # workspace moved the pack input to workspace-build/<Module>; this path still reading
            # module-build/ made the allow-list EMPTY and failed all 8 shelf-consuming modules on
            # the first coherent global-build lap (33472830308) with perfectly correct manifests.
            shelf_manifest="$PACKDIR/module-libs.txt"
            allowed="$( [ -f "$shelf_manifest" ] && tr '\n' ';' < "$shelf_manifest" || true )"
            jq -e --arg allowed "$allowed" \
              '($allowed | split(";") | map(select(length > 0))) as $shelf
               | [.module.assemblies[]
                  | select(startswith("MeshWeaver.") | not)
                  | select(. as $a | $shelf | index($a) | not)]
               | length == 0' \
              "$manifest" > /dev/null \
              || { echo "::error::the container-built bundle carries a non-MeshWeaver assembly with NO builder provenance (not in the builder's module-libs.txt) — its closure cannot be accounted for, so the pack fails rather than landing a module that faults at first use"; exit 1; }
            echo "container path: closure is entry + module-owned MeshWeaver siblings + the manifested private closure, as recorded"
            # 🚨 The STATIC-ASSET half, asserted — because its absence is the one failure with no
            # symptom at any later gate: the publish 200s, the module lands and loads, every page
            # renders, only UNSTYLED (#2221's exact signature; PluginBundlePublishAssetsTest names
            # it). The packer nulls `staticAssets` when the pack input has no wwwroot, and nothing
            # downstream distinguishes "this module ships no assets" from "the compiler forgot
            # them" — so this lane distinguishes it HERE, from the source of truth: a project that
            # has *.razor.css or wwwroot/ in its tree must produce a bundle that declares assets.
            src_dir="$GITHUB_WORKSPACE/$(dirname "$PROJECT")"
            if [ -d "$src_dir/wwwroot" ] \
               || find "$src_dir" -name '*.razor.css' -not -path '*/bin/*' -not -path '*/obj/*' -print -quit | grep -q .; then
              jq -e '(.module.staticAssets // []) | length > 0' "$manifest" > /dev/null \
                || { echo "::error::$MODULE has wwwroot/ or *.razor.css in its source tree, but the container-built bundle declares NO staticAssets — it would land, load, and render unstyled with nothing in any log (#2221). The builder must emit wwwroot/ (its .styles.css aggregate included) into the pack input."; exit 1; }
              echo "container path: staticAssets declared ($(jq '(.module.staticAssets // []) | length' "$manifest") file(s)) for a source tree that has assets"
            fi
          fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "bundle OK:"; jq . "$manifest"

      # 7 days, not 3: this artifact is what a LATER run downloads when the ledger says the key is
      # already built — the reuse window is exactly its retention (the ledger records the expiry).
      - name: Upload the bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-bundle-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/bundles/*.module.nupkg
          retention-days: 7
          if-no-files-found: error
      # AFTER the upload, never before: `Built` means "a later run can fetch this bundle", and the
      # record names the artifact the upload above just created. Carries the PLATFORM's identity as
      # `prepare` resolved it (#931's producer half: the record says which framework these bytes are for).
      - name: Ledger — Built
        if: inputs.ledger == 'required' && steps.plan.outputs.decision == 'build' && steps.plan.outputs.key != ''
        env:
          KEY: ${{ steps.plan.outputs.key }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          PLATFORM_IDENTITY: ${{ needs.prepare.outputs.platform-identity }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Built \
            --bundle "$BUNDLE" --artifact-name "module-bundle-$MODULE" --retention-days 7 \
            --version "$VERSION" ${PLATFORM_IDENTITY:+--platform-identity "$PLATFORM_IDENTITY"}

      # ───────── THE BUILT MARKER — "this bundle exists AND is composable", from THIS lane ─────────
      # Dropped the moment the bundle artifact is up, BEFORE the tests and the hand-over, so a
      # caller whose gates only COMPOSE this bundle can depend on the workflow's `bundles-built`
      # output instead of this job's result: a red suite here must not read as "bundle missing"
      # there (#2710, Plugins#937). That intent is unchanged — NOTHING about the test run reaches
      # this marker. The receipt further down stays LAST — it still means the whole leg, tests and
      # publish included, got here.
      #
      # 🚨 WHAT THE MARKER ASSERTS IS NOW WRITTEN DOWN, not inferred from where the step sits.
      # `bundles-built` is the claim a REQUIRED gate composes bundles on, so it must mean "the set
      # is complete and usable", and a marker that says only "an artifact was uploaded" leaves
      # "present but uncomposable" reading as true. So the marker carries the two things the
      # composing caller actually needs — the bundle file the upload above just took, and the
      # closure evidence the build resolved (the closure manifest on the container path) — and the
      # verifier REFUSES a marker missing either. An ordering guarantee that only a comment
      # records is one refactor away from being gone; this one fails closed instead.
      #
      # 🚨 And it carries its LANE. Artifacts are run-wide, so a repo calling this workflow twice
      # (Plugins: floor + rest) puts both calls' evidence in one namespace. The names below are
      # lane-scoped AND the stamp inside is checked, so even a name collision cannot donate one
      # call's marker to the other's answer (Plugins#1077).
      - name: Drop the built marker
        env:
          LANE: ${{ needs.select.outputs.lane }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          # A reused leg has no compiler of its own: the marker says so, and names the run that did.
          COMPILER: ${{ steps.plan.outputs.decision == 'reuse' && 'reused' || steps.build.outputs.compiler }}
          CLOSURE: ${{ steps.plan.outputs.decision == 'reuse' && format('reused from run {0} ({1}, sha256 verified against the ledger)', steps.plan.outputs.art_run, steps.plan.outputs.art_name) || steps.build.outputs.closure }}
          BUNDLE: ${{ steps.bundle.outputs.path || steps.reused.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/built"
          [ -n "$LANE" ]    || { echo "::error::the lane key is empty — the select job did not produce one, so this marker could not be attributed to this call and the verifier would refuse it anyway. Failing here, where it is readable."; exit 1; }
          [ -n "$CLOSURE" ] || { echo "::error::the build step recorded no closure evidence for $MODULE — the bundle may exist but nothing says it is composable, which is exactly the claim \`bundles-built\` makes. Failing rather than dropping a marker that overstates."; exit 1; }
          [ -n "$BUNDLE" ]  || { echo "::error::no bundle path from the pack step for $MODULE — there is nothing for this marker to attest."; exit 1; }
          jq -n --arg l "$LANE" --arg p "$PACKAGE" --arg m "$MODULE" \
                --arg v "$VERSION" --arg c "$COMPILER" \
                --arg cl "$CLOSURE" --arg b "$(basename "$BUNDLE")" \
             '{lane:$l, package:$p, module:$m, version:$v, compiler:$c, closure:$cl, bundle:$b}' \
             > "$RUNNER_TEMP/built/$MODULE.json"
          cat "$RUNNER_TEMP/built/$MODULE.json"
      - name: Upload the built marker
        uses: actions/upload-artifact@v7
        with:
          name: module-built-${{ needs.select.outputs.lane }}-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/built/*.json
          retention-days: 1
          if-no-files-found: error

      # ═══════ THE SUITE, INLINE — ON A PUBLISHING RUN ONLY (see the `tests` job below) ═══════
      # 🚨 Only when THIS diff reaches the module (or on a full run): a floor-only entry — built
      # because the caller's gates compose it — carries test=false from the selection, and its
      # suite is skipped rather than answering a question nobody asked. The AI engine's suite
      # (~13 min, 1,600 tests) ran on every PR that never touched AI until 2026-08-29.
      # `need_test`: the entry's own `test` flag AND, with the ledger on, "no earlier run recorded a
      # verdict for this key" — a reused Tested/Published bundle is not re-tested.
      #
      # 🚨 AND ONLY WHEN THIS CALL PUBLISHES. Inline, the suite sits AFTER the bundle upload and
      # BEFORE the hand-over, and the property that buys is exactly one: *a failing suite never
      # publishes*. That property is worth its cost on a trunk/release-follow run, where the step
      # below POSTs these bytes to the registry and every installation then reads them. It buys
      # NOTHING on a run with `publish: false` — the hand-over step's own `if:` cannot fire there,
      # so there is nothing for the ordering to protect, and the ordering instead costs every
      # consumer of this call the whole suite: a `needs:` on a `uses:` job waits for the WHOLE
      # called workflow, so MeshWeaver.Plugins' two required gates, which consume only the bundle
      # ARTIFACT, waited 12.7 minutes for a MeshWeaver.AI suite they never read (run 33656010754:
      # the bundle was ready 0.2 min into a 13.4-minute job; the gates started at 32.8 min).
      #
      # So on a non-publishing run the suite moves to the `tests` job below and runs in PARALLEL
      # with prepare → build-workspace → pack instead of after them. The two are mutually
      # exclusive by construction (`inputs.publish` here, `!inputs.publish` there), the leg
      # RECORDS which of them owned its suite in the receipt, and `verify` refuses a run where
      # the two disagree — a suite may not silently belong to neither.
      - name: Run the module's tests, when it ships any
        id: tests
        if: ${{ inputs.publish && matrix.entry.test != false && steps.plan.outputs.need_test == 'true' }}
        env:
          PROJECT: ${{ matrix.entry.project }}
          # 🚨 THE TRAIL A FLAKE LEAVES. A red here on a diff that cannot reach the module is a
          # timing failure of the mesh under the runner's load, and the failure block alone cannot
          # say where the flow stopped (seven distinct AI.Test failures, one sentence each —
          # MeshWeaver.Plugins#941). So the run WRITES the evidence and the step below keeps it:
          #   • per-test file logs (MESHWEAVER_TEST_FILE_LOGS — Warning level, one file per test);
          #   • the MonolithMeshTestBase phase trace (/tmp/meshweaver-test-trace.log: INIT/TEST/
          #     DISPOSE phases per class, pid-tagged — a crash's last lines name the class);
          #   • the teardown-straggler captures (written beside the test assembly);
          #   • a mini dump when the host dies on a signal (exit 139 = SIGSEGV = use-after-unload).
          # None of it changes timing: the file logs are the same records the console gets, and
          # the dump is written only by a crash.
          MESHWEAVER_TEST_FILE_LOGS: "1"
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "2"
          DOTNET_DbgMiniDumpName: /tmp/coredumps/%e-%p.dmp
        run: |
          set -euo pipefail
          mkdir -p /tmp/coredumps
          # A module's tests relocate WITH it (the Approvals precedent). Conventional sibling:
          # src/<Module>.Test. Absent is fine; present and red is not.
          tests="$(dirname "$PROJECT").Test"
          if [ -d "$tests" ]; then
            # The trx is the ledger's evidence: counts, and the FAILED names a follower is handed.
            dotnet test "$tests" -c Release -warnaserror \
              -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver \
              --logger "trx;LogFileName=ledger.trx" --results-directory "$RUNNER_TEMP/trx"
          else
            echo "no test project at $tests — nothing to run"
          fi
      - name: Ledger — Tested
        if: inputs.ledger == 'required' && steps.plan.outputs.key != '' && steps.tests.outcome == 'success'
        env:
          KEY: ${{ steps.plan.outputs.key }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Tested --trx "$RUNNER_TEMP/trx/ledger.trx"

      # 🚨 Only on FAILURE, and only what a diagnosis needs: the failing suite's per-test logs, the
      # phase trace, the straggler captures and any dump. A green run uploads nothing — the point
      # is that the ONE red run in five leaves something to read instead of a re-run button.
      - name: Keep the failing suite's evidence
        if: ${{ failure() && inputs.publish && matrix.entry.test != false }}
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: |
          set -uo pipefail
          tests="$(dirname "$PROJECT").Test"
          out="$RUNNER_TEMP/test-evidence"; mkdir -p "$out"
          find "$tests" -path '*/test-logs/*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            cp "$f" "$out/" || true
          done
          [ -f /tmp/meshweaver-test-trace.log ] && cp /tmp/meshweaver-test-trace.log "$out/_meshweaver-test-trace.log" || true
          [ -f /tmp/meshweaver-msg-trace.log ] && cp /tmp/meshweaver-msg-trace.log "$out/_meshweaver-msg-trace.log" || true
          if compgen -G '/tmp/coredumps/*.dmp' > /dev/null; then
            # The runtime writes a dump 0600; make it readable for the upload.
            sudo chmod a+r /tmp/coredumps/*.dmp || true
            cp /tmp/coredumps/*.dmp "$out/" || true
            dotnet --list-runtimes > "$out/_runtimes.txt" 2>/dev/null || true
          fi
          echo "kept $(ls "$out" | wc -l | tr -d ' ') file(s):"; ls -la "$out" | head -40
      - name: Upload the failing suite's evidence
        if: ${{ failure() && inputs.publish && matrix.entry.test != false }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.entry.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-evidence
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      # 🚨 The hand-over. Without it a module that has LEFT the platform repo is packed, versioned,
      # inspected — and reaches nobody, because a registry serves only bytes it holds. A missing
      # token here FAILS the job rather than skipping quietly: "published nothing" and "published
      # fine" must never look the same (the same reason a gate may not skip green).
      # `need_publish`: the caller's `publish` AND, with the ledger on, "no earlier run published this
      # key" — a key the registry already serves at these bytes is not re-handed (Plugins#889: a push
      # publishes every module whose key has no Published record, and only those).
      - name: Hand the bundle to the registry
        id: publish
        if: ${{ inputs.publish && steps.plan.outputs.need_publish == 'true' }}
        env:
          TOKEN: ${{ secrets.publish-token }}
          REGISTRY: ${{ inputs.registry-url }}
          REGISTRY_SOURCE: ${{ inputs.registry-source }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.path || steps.reused.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::publish was requested but no publish-token secret was provided — the registry would never receive $MODULE, and this job would have reported success"
            exit 1
          fi
          # ───────── THE PUBLISH-SIDE GATE: a bundle that states no framework identity is
          # ───────── UNPUBLISHABLE (#3211, part 3 of Plugins#931)
          # 🚨 HERE, on the bytes about to be POSTed, and NOT only in the inspection above — the
          # inspection runs on the BUILD leg alone, and the reuse leg hands over an artifact an
          # earlier run packed, which may predate the packer that refuses to omit the field. This
          # step is the one every published byte passes through, so this is where the refusal binds.
          #
          # Why it must be a refusal and not a warning: the registry shelves what arrives
          # (ModulePublish.Accepted.FrameworkMvid -> ShelveModule) and advertises it per bundle on
          # /api/plugins/bundles/index.json. A null there is not "unknown for now" — a registry that
          # states no identity states none next time either, so ModuleUpdateDecision (#3154) answers
          # SkipUpToDate-and-say-so for that module on every reconcile of every installation,
          # forever. Unlike an unknown on the LANDED side, one fetch cannot heal it. Publishing such
          # a bundle is therefore not a smaller good than refusing: it is the defect.
          # Neither the exit status nor unzip's own stderr is swallowed: "could not check" must
          # never render as "checked", and the log has to say WHY it could not.
          if ! manifest_json="$(unzip -p "$BUNDLE" meshweaver/manifest.json)" || [ -z "$manifest_json" ]; then
            echo "::error::cannot read meshweaver/manifest.json out of $BUNDLE (see unzip's message above) — refusing to publish bytes whose manifest this lane could not check (#3211)"
            exit 1
          fi
          identity="$(printf '%s' "$manifest_json" | jq -r '.frameworkMvid // ""' | tr -d '[:space:]')"
          if [ -z "$identity" ]; then
            echo "::error::REFUSING to publish $MODULE@$VERSION — the bundle states no framework identity (manifest .frameworkMvid is $(printf '%s' "$manifest_json" | jq -c '.frameworkMvid')). The registry would shelve a null and advertise a null, and every consumer of this module would answer 'already landed — the identity could not be checked' on every reconcile, forever (#3154). A rebuild of unchanged source against a new platform republishes under the SAME version, so the identity is the only thing that tells that rebuild from a no-op. Repack with the platform's MeshWeaver.Compiler.dll as --graph-dll (or state it with --framework-mvid); if these bytes were REUSED from an earlier run, that run packed them before the identity was recorded — rebuild them."
            exit 1
          fi
          echo "publishing $MODULE@$VERSION, built against $identity"
          code=$(curl -sS -o "$RUNNER_TEMP/publish-$MODULE.json" -w '%{http_code}' \
            -X POST "$REGISTRY/api/plugins/bundles/$PACKAGE?version=$VERSION&packagePath=$REGISTRY_SOURCE/$PACKAGE" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$BUNDLE")
          echo "registry answered $code:"; cat "$RUNNER_TEMP/publish-$MODULE.json"; echo
          case "$code" in
            2*) echo "$MODULE@$VERSION is now served by $REGISTRY" ;;
            *)  echo "::error::registry refused $MODULE@$VERSION (HTTP $code)"; exit 1 ;;
          esac
      - name: Ledger — Published
        if: inputs.ledger == 'required' && steps.plan.outputs.key != '' && steps.publish.outcome == 'success'
        env:
          KEY: ${{ steps.plan.outputs.key }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Published

      # ───────── THE LEDGER'S VERDICT WHEN THIS LEG DID NOT GET HERE — never a reason for red ─────────
      # `failure()`: the phase is read off the step outcomes, so the record says WHERE it failed and the
      # tolerance rule (compile blocks; a test failure blocks from the 2nd attempt; pack/publish never)
      # is applied by the script. `cancelled()`: the claim is released at once instead of expiring.
      # Both steps are best-effort by construction — the script exits 0 with a ::warning when the
      # registry is unavailable, and `|| true` keeps a failed leg's own failure as the job's verdict.
      - name: Ledger — Failed
        if: failure() && inputs.ledger == 'required' && steps.plan.outputs.key != ''
        env:
          KEY: ${{ steps.plan.outputs.key }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REUSED_OUTCOME: ${{ steps.reused.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          INSPECT_OUTCOME: ${{ steps.bundle.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          MODE: ${{ matrix.entry.build || 'sdk' }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -uo pipefail
          phase="pack"
          if   [ "$TESTS_OUTCOME" = "failure" ]; then phase="test"
          elif [ "$PUBLISH_OUTCOME" = "failure" ]; then phase="publish"
          elif [ "$BUILD_OUTCOME" = "failure" ] && [ "$MODE" = "sdk" ]; then phase="compile"
          elif [ "$BUILD_OUTCOME" = "failure" ] || [ "$PACK_OUTCOME" = "failure" ] || [ "$INSPECT_OUTCOME" = "failure" ] || [ "$REUSED_OUTCOME" = "failure" ]; then phase="pack"
          fi
          printf 'step outcomes — build:%s reused:%s pack:%s inspect:%s tests:%s publish:%s (%s)\n' \
            "$BUILD_OUTCOME" "$REUSED_OUTCOME" "$PACK_OUTCOME" "$INSPECT_OUTCOME" "$TESTS_OUTCOME" "$PUBLISH_OUTCOME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/failure.txt"
          trx="$RUNNER_TEMP/trx/ledger.trx"
          trxarg=()
          if [ -f "$trx" ]; then trxarg=(--trx "$trx"); fi
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Failed --phase "$phase" \
            --failure-file "$RUNNER_TEMP/failure.txt" ${trxarg[@]+"${trxarg[@]}"} || true
      - name: Ledger — released (cancelled)
        if: cancelled() && inputs.ledger == 'required' && steps.plan.outputs.key != ''
        env:
          KEY: ${{ steps.plan.outputs.key }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: python3 meshweaver/.github/scripts/module-build-ledger.py release --key "$KEY" || true

      # ─────────────────────────── THE RECEIPT ───────────────────────────
      # 🚨 POSITIVE EVIDENCE THAT THIS LEG RAN. A skipped matrix leg renders with the same tick as
      # a passed one, so "this module was never packed" and "this module packed fine" are
      # indistinguishable on the checks wall — and a matrix whose size depends on a diff makes
      # that failure mode reachable rather than theoretical. `verify` counts these against the
      # selection and names whatever is missing. It is the LAST step on purpose: a receipt means
      # the whole leg, publish included, got here.
      # 🚨 Lane-stamped and lane-named, for the same reason as the marker: artifacts are run-wide,
      # and `--declared` alone separates two calls only while their matrices are DISJOINT. The
      # moment two calls in one run declare the same module — an `always-modules` floor entry that
      # is also in the other call's list is all it takes — a name-only filter hands one call's
      # receipt to the other's accounting. The stamp is what makes attribution structural.
      - name: Drop the receipt
        env:
          LANE: ${{ needs.select.outputs.lane }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          COMPILER: ${{ steps.plan.outputs.decision == 'reuse' && 'reused' || steps.build.outputs.compiler }}
          PUBLISHED: ${{ inputs.publish }}
          # 🚨 WHICH LANE OWNS THIS MODULE'S SUITE, written down rather than inferred from an `if:`
          # nobody can read after the fact. `none` — the selection says this entry owes no test run
          # (a floor-only entry, or a ledger record that already carries a verdict); `inline` — the
          # step above ran it in this job, which is what a PUBLISHING run does so a red suite can
          # never publish; `lane` — this call does not publish, so the `tests` job ran it beside
          # this one. `verify` pairs every `lane` against a test receipt and fails when one is
          # missing: two mutually exclusive conditions can BOTH be false, and this is what makes
          # that impossible to do quietly.
          TESTS: ${{ steps.plan.outputs.need_test != 'true' && 'none' || (inputs.publish && 'inline' || 'lane') }}
          LEDGER_KEY: ${{ steps.plan.outputs.key }}
          LEDGER_DECISION: ${{ steps.plan.outputs.decision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          [ -n "$LANE" ]  || { echo "::error::the lane key is empty — the select job did not produce one, so this receipt could not be attributed to this call."; exit 1; }
          [ -n "$TESTS" ] || { echo "::error::this leg recorded no owner for $MODULE's suite — a receipt that cannot say whether the suite ran here, ran in the tests lane, or was not owed leaves 'it ran nowhere' reading as green."; exit 1; }
          jq -n --arg l "$LANE" --arg p "$PACKAGE" --arg m "$MODULE" \
                --arg v "$VERSION" --arg c "$COMPILER" --arg t "$TESTS" \
                --argjson pub "$PUBLISHED" \
                --arg lk "$LEDGER_KEY" --arg ld "$LEDGER_DECISION" \
             '{lane:$l, package:$p, module:$m, version:$v, compiler:$c, tests:$t, published:$pub, ledger:{key:$lk, decision:$ld}}' \
             > "$RUNNER_TEMP/receipts/$MODULE.json"
          cat "$RUNNER_TEMP/receipts/$MODULE.json"
      - name: Upload the receipt
        uses: actions/upload-artifact@v7
        with:
          name: module-pack-receipt-${{ needs.select.outputs.lane }}-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/receipts/*.json
          retention-days: 1
          if-no-files-found: error
      # The leg is over: a record left at Built/Tested (no publish on this event) is marked finished so
      # a follower stops waiting for a publish that will never come. Idempotent on a Published record.
      - name: Ledger — finished
        if: inputs.ledger == 'required' && steps.plan.outputs.key != ''
        env:
          KEY: ${{ steps.plan.outputs.key }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: python3 meshweaver/.github/scripts/module-build-ledger.py finish --key "$KEY"

  # ════════ THE MODULE SUITES — A LANE OF THEIR OWN ON A NON-PUBLISHING RUN ════════
  # 🚨 THE MEASUREMENT THIS JOB EXISTS FOR (MeshWeaver.Plugins run 33656010754, a 39-minute PR):
  #
  #    19.1 -> 32.5  Module bundles (floor) / Module bundle (MeshWeaver.AI)   <-- 13.4 min
  #                    12.7 min  Run the module's tests, when it ships any
  #                     0.2 min  Build the module — and say which compiler produced it
  #    32.5 -> 32.7  Module bundles (floor) / All selected bundles built
  #    32.8 -> 37.0  Compile every NodeType (vs core)          (a REQUIRED context)
  #    32.9 -> 38.6  test-repos / Compile + render node repos  (the Tests-area gate)
  #
  # The bundle ARTIFACT — the only thing those two gates consume — was ready 0.2 minutes in. The
  # gates waited another 12.7 for a suite they never read, because a `needs:` on a `uses:` job
  # waits for the WHOLE called workflow, and the suite sat inside the last job of it. The floor
  # call exists precisely so the gates do not wait for the other 30 bundles (Plugins#892); the
  # suite put the wait straight back.
  #
  # It costs a SECOND thing, measured 2026-09-02: a run cannot be re-run until it fully completes
  # (`gh run rerun --failed` answers "This workflow is already running"). So when a portal-host
  # shard flakes, the retry is blocked by a suite whose verdict nobody is waiting on — every flake
  # pays it, which makes the recovery loop the compounding half of the cost.
  #
  # 🚨 WHY IT IS SAFE TO RELAX HERE AND NOT ON TRUNK. Inline, the suite's position buys exactly one
  # property: a failing suite never publishes. On a run with `publish: false` the hand-over step
  # cannot fire at all — its own `if:` is `inputs.publish && …` — so the ordering protects nothing
  # and delays everything. On a publishing run it protects the registry, and every installation
  # reads what the registry serves, so there the suite stays INLINE and this job does not run. The
  # switch is `inputs.publish`, not the event name: `publish` is the input that already means
  # "trunk" by this file's caller contract, and core's own main-cd calls this lane with
  # `publish: false` for the bake's compose set — that call gets the fast path and is not a PR.
  #
  # 🚨 IT IS NOT A WAY TO STOP TESTING, AND THREE THINGS MAKE THAT STRUCTURAL:
  #   1. This job is part of THIS called workflow, so a red suite fails the CALLER's `uses:` job
  #      exactly as a red inline suite did.
  #   2. `verify` — the lane's one stable context, `All selected bundles built`, the context a
  #      repo's protection requires — `needs:` this job and goes RED when it did not succeed. The
  #      name is unchanged and so is what a red suite does to it.
  #   3. A suite that silently ran NOWHERE is caught by receipts, not by reading a condition: the
  #      pack leg records which lane owns its suite, this job drops a receipt of its own, and
  #      node-repo-pack-verify.py fails when a delegated module has no test receipt (or a test
  #      receipt arrives for a module that delegated nothing). Two mutually exclusive `if:`s can
  #      BOTH be false; the receipts are what make that impossible to do quietly.
  #
  # `bundles-built` is deliberately untouched: it still answers from the built markers dropped
  # before any suite, so a red suite still does not read as "bundle missing" to a gate that only
  # COMPOSES the bundle (#2710, Plugins#937).
  tests:
    name: Module tests (${{ matrix.entry.module }})
    # 🚨 `select` ONLY — not prepare, not build-workspace, not pack. The suite is a `dotnet test`
    # against the content checkout with `-p:MeshWeaverRoot=<the platform checkout>`; it consumes
    # no platform image, no workspace build and no bundle. Depending on any of them would put it
    # back on the very chain this job exists to run beside.
    needs: select
    # 🚨 The exact COMPLEMENT of the inline step's `inputs.publish &&`, on the same input. A
    # matrix with zero vectors does not evaluate, so `test-count` is asserted the way `pack`
    # asserts `count` — and `verify` runs unconditionally and refuses the pairing when a
    # delegated suite produced no receipt, which is what keeps this from being a skip-trapdoor.
    if: >-
      !inputs.publish
      && needs.select.result == 'success'
      && needs.select.outputs.test-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One module's red suite must not hide the rest — a sweep wants every verdict in one run.
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.select.outputs.test-modules) }}
    steps:
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      # 🚨 UNCONDITIONAL, and the log says why. `dotnet-sdk: by-declaration` exists so a job that
      # compiles nothing on the runner stops installing an SDK by reflex — but this job's ONLY
      # work is `dotnet test`, a verb the platform image's build-project does not have at all. So
      # the SDK is a declared consumer here whichever way the caller's flag reads, and saying so
      # out loud is the point: the flag chooses a COMPILER, it never chooses whether to verify.
      - name: The .NET SDK is this job's one declared need
        env:
          POLICY: ${{ inputs.dotnet-sdk }}
          MODULE: ${{ matrix.entry.module }}
        run: |
          set -euo pipefail
          case "$POLICY" in
            install|by-declaration) ;;
            *) echo "::error::inputs.dotnet-sdk is '$POLICY'. The only values are 'install' (the default) and 'by-declaration'. An unreadable flag must NEVER resolve to 'do not install' — that is a skipped check wearing a green tick."; exit 1 ;;
          esac
          echo ".NET SDK on the runner: INSTALLED — policy '$POLICY'; this job's one declared consumer is the module's own suite ('dotnet test' for $MODULE), which the pinned platform image cannot run."
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # The same command, the same evidence trail and the same tolerance for a module that ships
      # no suite as the inline step in `pack` — this is a MOVE, not a rewrite. See that step for
      # what each environment variable buys when a flake has to be diagnosed from the artifacts.
      - name: Run the module's tests, when it ships any
        id: tests
        env:
          PROJECT: ${{ matrix.entry.project }}
          MESHWEAVER_TEST_FILE_LOGS: "1"
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "2"
          DOTNET_DbgMiniDumpName: /tmp/coredumps/%e-%p.dmp
        run: |
          set -euo pipefail
          mkdir -p /tmp/coredumps
          tests="$(dirname "$PROJECT").Test"
          if [ -d "$tests" ]; then
            echo "suite=present" >> "$GITHUB_OUTPUT"
            dotnet test "$tests" -c Release -warnaserror \
              -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver \
              --logger "trx;LogFileName=ledger.trx" --results-directory "$RUNNER_TEMP/trx"
          else
            echo "suite=absent" >> "$GITHUB_OUTPUT"
            echo "no test project at $tests — nothing to run"
          fi
      - name: Ledger — Tested
        if: inputs.ledger == 'required' && steps.tests.outcome == 'success' && matrix.entry.ledger.key != ''
        env:
          KEY: ${{ matrix.entry.ledger.key }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Tested --trx "$RUNNER_TEMP/trx/ledger.trx"
      - name: Keep the failing suite's evidence
        if: ${{ failure() }}
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: |
          set -uo pipefail
          tests="$(dirname "$PROJECT").Test"
          out="$RUNNER_TEMP/test-evidence"; mkdir -p "$out"
          find "$tests" -path '*/test-logs/*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            cp "$f" "$out/" || true
          done
          [ -f /tmp/meshweaver-test-trace.log ] && cp /tmp/meshweaver-test-trace.log "$out/_meshweaver-test-trace.log" || true
          [ -f /tmp/meshweaver-msg-trace.log ] && cp /tmp/meshweaver-msg-trace.log "$out/_meshweaver-msg-trace.log" || true
          if compgen -G '/tmp/coredumps/*.dmp' > /dev/null; then
            sudo chmod a+r /tmp/coredumps/*.dmp || true
            cp /tmp/coredumps/*.dmp "$out/" || true
            dotnet --list-runtimes > "$out/_runtimes.txt" 2>/dev/null || true
          fi
          echo "kept $(ls "$out" | wc -l | tr -d ' ') file(s):"; ls -la "$out" | head -40
      - name: Upload the failing suite's evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ needs.select.outputs.lane }}-${{ matrix.entry.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-evidence
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9
      # ─────────── THE TEST RECEIPT — positive evidence that this suite RAN ───────────
      # 🚨 The whole reason the split is allowed to exist. Two mutually exclusive `if:`s can BOTH
      # evaluate false, and a suite that ran in neither lane renders exactly like one that passed.
      # So the pack leg records which lane OWNS its suite (`tests: none|inline|lane` in its
      # receipt), this job records that the lane actually ran it, and `verify` refuses a run where
      # the two do not line up — naming the module. Lane-stamped for the same reason as every
      # other artifact here: artifacts are RUN-WIDE and a repo may call this lane twice.
      # LAST step on purpose: a receipt means the suite got here green.
      - name: Drop the test receipt
        env:
          LANE: ${{ needs.select.outputs.lane }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          SUITE: ${{ steps.tests.outputs.suite }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-receipts"
          [ -n "$LANE" ]  || { echo "::error::the lane key is empty — the select job did not produce one, so this receipt could not be attributed to this call and the verifier would refuse it anyway."; exit 1; }
          [ -n "$SUITE" ] || { echo "::error::the suite step recorded neither 'present' nor 'absent' for $MODULE — a receipt that cannot say whether a suite existed attests nothing."; exit 1; }
          jq -n --arg l "$LANE" --arg p "$PACKAGE" --arg m "$MODULE" --arg s "$SUITE" \
             '{lane:$l, package:$p, module:$m, tests:"lane", suite:$s, result:"passed"}' \
             > "$RUNNER_TEMP/test-receipts/$MODULE.json"
          cat "$RUNNER_TEMP/test-receipts/$MODULE.json"
      - name: Upload the test receipt
        uses: actions/upload-artifact@v7
        with:
          name: module-tests-receipt-${{ needs.select.outputs.lane }}-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/test-receipts/*.json
          retention-days: 1
          if-no-files-found: error
      # Best-effort, exactly as in `pack`: the script exits 0 with a ::warning when the registry is
      # unavailable, and `|| true` keeps this leg's own failure as the job's verdict.
      - name: Ledger — Failed
        if: failure() && inputs.ledger == 'required' && matrix.entry.ledger.key != ''
        env:
          KEY: ${{ matrix.entry.ledger.key }}
          MODULE: ${{ matrix.entry.module }}
          MW_LEDGER_URL: ${{ inputs.registry-url }}
          MW_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          MW_LEDGER_LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -uo pipefail
          printf 'the module suite failed in the tests lane — %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/failure.txt"
          trx="$RUNNER_TEMP/trx/ledger.trx"
          trxarg=()
          if [ -f "$trx" ]; then trxarg=(--trx "$trx"); fi
          python3 meshweaver/.github/scripts/module-build-ledger.py record --key "$KEY" --status Failed --phase test \
            --failure-file "$RUNNER_TEMP/failure.txt" ${trxarg[@]+"${trxarg[@]}"} || true

  # ═══════════════ THE COUNT GATE — one STABLE context, on every run ═══════════════
  # 🚨 A dynamic matrix cannot be a fixed list of required status checks: the per-module contexts
  # appear and disappear with the diff, so requiring one means requiring a context that will
  # legitimately never report — which is how a gate ends up not required at all and PRs merge past
  # it. This job is the answer: it is present on EVERY run whatever the diff, so it is the one
  # context a repo's protection should require for this lane, and it asserts that exactly the
  # selected bundles were built.
  #
  # `if: always()` because the failure it exists to catch is a SKIP, and a job that skips when the
  # thing it watches skipped watches nothing.
  # 🚨 IT IS ALSO WHERE A RED SUITE LANDS. Since the suites may run beside `pack` rather than
  # inside it (the `tests` job above), this job `needs:` BOTH and asserts both: a failed or
  # cancelled tests lane is RED here, under the same context name a repo's protection already
  # requires, and a module whose pack leg DELEGATED its suite but produced no test receipt is RED
  # too. Moving the suite off the consumer's critical path may not move it out of the gate.
  verify:
    name: All selected bundles built
    needs: [select, pack, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      bundles-built: ${{ steps.verify.outputs.bundles_built }}
    steps:
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Absent receipts are the finding, so a download that matches nothing must NOT fail here —
      # it must reach the verifier, which says which module is missing. That is the whole point.
      #
      # 🚨 SCOPED TO THIS CALL'S LANE. These patterns used to be `module-pack-receipt-*` and
      # `module-built-*`, and artifacts are RUN-WIDE: a repo calling this workflow twice in one
      # run (Plugins: `modules-floor` + `modules-rest`) had each verifier download BOTH calls'
      # evidence and then separate them by module NAME alone (`--declared`). That works only while
      # the two matrices are disjoint, and `bundles-built` is what a REQUIRED gate composes on —
      # so the failure mode was a truthy answer derived from a sibling's evidence (Plugins#1077).
      # The lane key is unique per call by construction, so the glob no longer reaches a sibling;
      # the lane stamp INSIDE each file is checked as well, because a pattern is one edit away
      # from being widened again and this one must fail closed when it is.
      #
      # A pattern that matches nothing still reaches the verifier as ZERO evidence, which is
      # `bundles-built=false` for any non-empty selection — never a silent true.
      - name: Collect the receipts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: module-pack-receipt-${{ needs.select.outputs.lane }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Collect the built markers
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: module-built-${{ needs.select.outputs.lane }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/built
      # The suites' own positive evidence, when they ran in the `tests` lane. Same rule as above:
      # a pattern matching nothing must REACH the verifier as zero evidence, never fail here — a
      # delegated suite with no receipt is precisely the finding.
      - name: Collect the test receipts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: module-tests-receipt-${{ needs.select.outputs.lane }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/test-receipts
      - name: Exactly the selected bundles were built
        id: verify
        env:
          EXPECTED: ${{ needs.select.outputs.selected }}
          PACK_RESULT: ${{ needs.pack.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SCOPE: ${{ needs.select.outputs.scope }}
          COUNT: ${{ needs.select.outputs.count }}
          DECLARED: ${{ inputs.modules }}
          LANE: ${{ needs.select.outputs.lane }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE, selection named $COUNT module bundle(s); pack job: $PACK_RESULT, tests lane: $TESTS_RESULT"
          # 🚨 An INDEPENDENT recount, because the count and the selection come from the same
          # call and therefore agree by construction — they cannot catch a selection that is
          # simply wrong. This one has a second source: on a FULL scope the answer must be every
          # entry the CALLER declared, counted here from `inputs.modules` rather than from
          # anything `select` produced.
          declared=$(jq 'length' <<< "$DECLARED")
          if [ "$SCOPE" = "full" ] && [ "$COUNT" != "$declared" ]; then
            echo "::error title=Module bundles incomplete::the scope is FULL, so every one of the \
          $declared declared module(s) must be packed — but the selection named $COUNT. The \
          selection and the caller's matrix disagree."
            echo "bundles_built=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 🚨 `select` itself failing must not read as "nothing was selected" — that would turn a
          # broken selector into a green wall with an empty matrix behind it.
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "::error title=Module bundles incomplete::the selection job reported \
          '${{ needs.select.result }}' — no module bundle was chosen, so none was built. Read that \
          job; nothing below can be trusted."
            echo "bundles_built=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 🚨 The lane key is what makes every download above THIS call's. Without it the two
          # collectors fall back to name-only separation, which is exactly the state that let a
          # sibling call's evidence answer this one (Plugins#1077) — so an empty key is refused
          # here rather than silently degraded into the behaviour being fixed.
          if [ -z "$LANE" ]; then
            echo "::error title=Module bundles incomplete::the selection produced no lane key, so \
          nothing downloaded above can be attributed to THIS call and bundles-built would be \
          answerable from a sibling call's artifacts. Refusing to answer."
            echo "bundles_built=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 🚨 `--declared`: artifacts are RUN-wide, so when a repo calls this workflow twice in
          # one run (Plugins #932: a floor call the gates compose, and the rest) each verifier
          # downloads the OTHER call's receipts too. Only modules in THIS call's matrix count.
          # 🚨 `--lane`: the structural half of the same answer. `--declared` separates two calls
          # by module name; `--lane` separates them by the stamp the producer wrote, so a marker
          # or receipt this call cannot attribute to itself is set aside and NAMED, and a
          # SELECTED module left without one reads as not built.
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py \
            --expected "$EXPECTED" \
            --receipts "$RUNNER_TEMP/receipts" \
            --pack-result "$PACK_RESULT" \
            --scope "$SCOPE" \
            --declared "$DECLARED" \
            --lane "$LANE" \
            --built "$RUNNER_TEMP/built" \
            --test-receipts "$RUNNER_TEMP/test-receipts" \
            --tests-result "$TESTS_RESULT" \
            --github-output "$GITHUB_OUTPUT"

      # ─────────── WHICH COMPILER BUILT WHAT — a NUMBER, on every run ───────────
      # 🚨 The split between `memex build project` (the container: no SDK, no NuGet, the image's own
      # assemblies) and the legacy `dotnet build` is meant to SHRINK, and a split nobody counts is a
      # split that becomes permanent. So it is reported every run, from the receipts the verifier
      # just accounted for, filtered to THIS call's declared matrix (artifacts are run-wide). It is
      # a report, never a gate: `if: always()` so a red verifier does not also hide the number.
      - name: Report the compiler split
        if: always()
        # A REPORT, not a gate: it must never be the reason this required context goes red, and it
        # must still print when the verifier above failed.
        continue-on-error: true
        env:
          DECLARED: ${{ inputs.modules }}
        run: |
          set -euo pipefail
          mine="$(jq -r '[.[].module] | @json' <<< "$DECLARED")"
          shopt -s nullglob
          receipts=("$RUNNER_TEMP"/receipts/*.json)
          if [ ${#receipts[@]} -eq 0 ]; then
            echo "no receipts to read — the pack job produced none, which the verifier above judges."
            exit 0
          fi
          split="$(jq -s --argjson mine "$mine" -r '
              [ .[] | select(.module as $m | $mine | index($m)) ]
              | (map(select(.compiler == "container")) | length) as $c
              | (length) as $n
              | "\($c) of \($n)"' "${receipts[@]}")"
          containers="$(jq -s --argjson mine "$mine" -r '
              [ .[] | select((.module as $m | $mine | index($m)) and .compiler == "container") | .module ]
              | sort | join(", ")' "${receipts[@]}")"
          legacy="$(jq -s --argjson mine "$mine" -r '
              [ .[] | select((.module as $m | $mine | index($m)) and .compiler != "container" and .compiler != "reused") | .module ]
              | sort | join(", ")' "${receipts[@]}")"
          reused="$(jq -s --argjson mine "$mine" -r '
              [ .[] | select((.module as $m | $mine | index($m)) and .compiler == "reused") | .module ]
              | sort | join(", ")' "${receipts[@]}")"
          echo "compiler split: $split module bundle(s) built by \`memex build project\` in the platform image"
          echo "  container: ${containers:-<none>}"
          echo "  dotnet SDK: ${legacy:-<none>}"
          echo "  reused (ledger): ${reused:-<none>}"
          {
            echo "### Compiler split"
            echo
            echo "**$split** built by \`memex build project\` (inside the pinned platform image — no SDK, no NuGet restore)."
            echo
            echo "- container: ${containers:-_none yet_}"
            echo "- dotnet SDK (legacy): ${legacy:-_none_}"
            echo "- reused from an earlier run (module build ledger): ${reused:-_none_}"
          } >> "$GITHUB_STEP_SUMMARY"
