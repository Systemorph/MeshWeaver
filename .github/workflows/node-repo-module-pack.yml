name: node-repo module pack

# The MODULE half of a mixed package, packed and (on trunk) handed to the registry — reusable from
# any node repo, because every satellite that owns a module drives the same packer the platform
# does. One matrix entry per module, so a repo that owns twelve of them does not grow twelve jobs.
#
# 🚨 The bundle's identity comes from the CONTENT side, never from workflow inputs: the released
# SemVer from `{package}/manifest.lock` and the landing floor from `{package}/index.json`'s
# `content.minMeshVersion` — the ONE declaration `NodeRepoPackageSource` reads. The job asserts
# that `content.module` names the module it is packing, so the two halves of a mixed package
# cannot drift apart silently.
#
# ─────────────────────────────── Caller contract ───────────────────────────────
# 🚨 THE MODULE LANE MUST FOLLOW THE RELEASE, exactly as the bundle bake does (#2088). A module is
# built against a platform PIN. When the platform releases, the pin moves and the module must be
# rebuilt AND republished, or every portal reads `FrameworkDeclined (built against <old>, live
# <new>)` and adopts nothing — which is what both prod portals said after ci.5050. The rebuild
# already happened there: the repo's release-follow schedule ran it. What threw it away was the
# caller passing `publish: ${{ github.event_name == 'push' }}`, so a scheduled run packed, versioned
# and inspected the bundles and handed them to nobody. Module adoption then stayed broken until an
# unrelated push to the plugin repo republished by accident.
#
# So `publish` is TRUNK-ONLY, not PUSH-ONLY. A caller wires it exactly like node-repo-publish-bake:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#     repository_dispatch:
#       types: [meshweaver-framework-released]
#     # 🚨 REQUIRED, not optional — the dispatch above has never been armed and the cross-repo PAT
#     # it needed was removed on purpose (2026-08-21), so THIS POLL is how a satellite learns a
#     # release happened. Stagger the minute per repo.
#     schedule:
#       - cron: "17,47 * * * *"
#
#   # Share the dispatch's concurrency lane: a scheduled run carries the DEFAULT BRANCH ref, so in
#   # a plain `github.ref` group a poll can cancel a main run mid-publish.
#   concurrency:
#     group: ${{ github.workflow }}-${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'framework-release' || github.ref }}
#     cancel-in-progress: true
#
#   module-pack:
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-module-pack.yml@<40-char platform sha>
#     with:
#       publish: >-
#         ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
#             || github.event_name == 'repository_dispatch'
#             || github.event_name == 'schedule' }}
#     secrets: { publish-token: ${{ secrets.PLUGIN_REGISTRY_PUBLISH_TOKEN }} }
#
# ─────────────────────────── Narrowing (the `select` job) ───────────────────────────
# 🚨 "in plugins we only re-run concerned modules ⇒ we can estimate the required count and
# validate it" · "all plugins should only re-build what changed" · "there is always a notion of
# 'full rebuild' when the platform updates".
#
# The matrix is no longer the caller's literal list on every event: `select` runs
# .github/scripts/node-repo-scope.py over the diff and hands `pack` the entries it can reach.
# MeshWeaver.Plugins ran 29 module builds on every push of every PR, whichever file moved.
#
# 🚨 ONLY `pull_request` / `merge_group` NARROW. A push, a framework-release dispatch, the release
# poll and a manual dispatch all pack the FULL set — a module is built against a platform pin, and
# when that pin moves every bundle must be rebuilt and republished or every portal reads
# FrameworkDeclined and adopts nothing (#2088). The scope script names which fallback it took, in
# the log and in the job summary; every uncertainty resolves to FULL.
#
# 🚨 AND THE COUNT IS ASSERTED. A dynamic matrix cannot be a fixed list of required contexts — the
# per-module contexts come and go with the diff — so the SELECTION is what gets checked instead:
# every pack job drops a receipt, and `verify` (one stable context, present on every run) fails if
# the receipts and the selection disagree. That is invariant #4 for a matrix allowed to change
# size, and it is the only reason a narrowed matrix is safe to require.
#
# A caller that ships neither scripts/affected-modules.py nor scripts/project-closure.py is simply
# not narrowable: the scope script says FULL and says why. Nothing to opt into, nothing to skip.
#
# Republishing is SAFE to repeat, which is why the schedule may simply publish rather than
# first proving something changed: the registry is keyed by `{package}@{version}` from
# `manifest.lock`, so a rebuild of an unchanged version overwrites the same slot with equivalent
# bytes. There is no `_complete` sentinel to shrink here — unlike the prebuilt-bundle bake, this
# lane uploads one independent bundle per module and never seals a listing, so a partial run costs
# only the modules it did not reach, never the ones it did.

on:
  workflow_call:
    inputs:
      modules:
        description: >
          JSON array of {package, module, project}: the Store package id, the module's entry
          assembly name, and the csproj to build. e.g.
          [{"package":"SocialMedia","module":"MeshWeaver.Social","project":"src/MeshWeaver.Social/MeshWeaver.Social.csproj"}]
        required: true
        type: string
      platform-ref:
        description: The Systemorph/MeshWeaver commit the modules build against (a pin, not a branch).
        required: true
        type: string
      publish:
        description: >
          Hand the packed bundles to the registry. TRUNK-ONLY, not push-only — a PR packs and
          inspects and never publishes, but a release-follow schedule or repository_dispatch run
          MUST publish or the rebuild it just did is discarded and every portal stays on
          FrameworkDeclined (#2088). See the caller contract at the top of this file.
        type: boolean
        default: false
      registry-source:
        description: >
          The registry SOURCE these packages belong to ("Plugins", "Education", …) — it stamps the
          landed entry's packagePath, which is the key every PluginGrant and the bundle index match
          on. An unstamped landing is servable to nobody.
        type: string
        required: false
        default: Plugins
      registry-url:
        description: The registry that will serve these bundles onward.
        type: string
        default: https://memex.meshweaver.cloud
    secrets:
      publish-token:
        description: The registry's Plugins:Registry:PublishToken. Required when publish is true.
        required: false

jobs:
  # ─────────────────────── WHICH BUNDLES THIS DIFF CAN REACH ───────────────────────
  # One place decides, out loud. It never skips a gate: its two answers are "pack these" and
  # "pack everything", and it takes the second whenever it cannot be sure of the first.
  select:
    name: Select the affected bundles
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.scope.outputs.modules }}
      count: ${{ steps.scope.outputs.count }}
      selected: ${{ steps.scope.outputs.selected }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # 🚨 The caller goes in its OWN directory, not the workspace root. Node packages are
      # discovered as "top-level dirs carrying an index.json", and the platform checkout below
      # lands INSIDE the workspace — clone core to the root beside the caller's content and the
      # selector is one `index.json` away from treating the framework as a plugin of this repo.
      # gen-manifests.py already carries "meshweaver" in its SKIP set for exactly this reason;
      # keeping the two trees apart is the version that cannot rot.
      - uses: actions/checkout@v7
        with:
          path: repo
          # 🚨 The diff is taken against the PR base, so the base commits must be present. A
          # shallow clone would make every range unresolvable — which the scope script turns into
          # a FULL pack rather than an empty one, but silently paying for 29 jobs is not the plan.
          fetch-depth: 0
      # The scope script is the PLATFORM's (one implementation, every repo), read from the same
      # checkout the pack jobs make at platform-ref — so a workflow newer than the checkout can
      # never call a script the checkout does not have (run 33073476996's exact failure).
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 The selection logic owes its own proof that it can say no AND that every fallback still
      # falls back. It runs here, on every run, next to the answer it produces — a selector whose
      # self-test is only run by someone remembering to is a selector nobody checks.
      - name: The selection can say no (self-test)
        run: |
          set -euo pipefail
          python3 meshweaver/.github/scripts/node-repo-scope.py --self-test
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py --self-test
      - name: Decide which module bundles this diff can reach
        id: scope
        env:
          MODULES: ${{ inputs.modules }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # A merge_group run carries no `base_ref`; its base is on the event payload. Dormant
          # today (no repo here has a queue) and kept correct so enabling one narrows rather than
          # silently falling back to the full set.
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$MODULES" > "$RUNNER_TEMP/matrix.json"
          if [ -z "${BASE_REF:-}" ] && [ -n "${QUEUE_BASE_REF:-}" ]; then
            BASE_REF="${QUEUE_BASE_REF#refs/heads/}"
          fi
          if [ -n "${BASE_REF:-}" ]; then
            git -C repo fetch --no-tags origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          python3 meshweaver/.github/scripts/node-repo-scope.py \
            --for modules --root repo --modules "@$RUNNER_TEMP/matrix.json" \
            --event "$EVENT" --base-ref "${BASE_REF:-}" > "$RUNNER_TEMP/scope.json"

  pack:
    name: Module bundle (${{ matrix.entry.module }})
    needs: select
    runs-on: ubuntu-latest
    # 🚨 This is a MODE SWITCH on the selection's own output, not a skip-trapdoor: GitHub refuses
    # a matrix with no vectors, so an empty selection has to express itself as "this job does not
    # run". What makes it safe is that `verify` below runs UNCONDITIONALLY and asserts the pairing
    # — a zero count with receipts, or a non-zero count with a skipped pack job, is RED. Never
    # replace it with a condition that asks whether an input or a secret happens to be set.
    # (`select.result` too, not just the count: a FAILED select emits no count at all, and
    # `'' != '0'` is true — the matrix would then fail to evaluate instead of the verify job
    # naming the real cause.)
    if: needs.select.result == 'success' && needs.select.outputs.count != '0'
    strategy:
      # One module's failure must not hide the rest — a sweep wants every verdict in one run.
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.select.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read the package version + platform floor from the content half
        id: identity
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' "$PACKAGE/manifest.lock")
          floor=$(jq -er '.content.minMeshVersion' "$PACKAGE/index.json")
          declared=$(jq -er '.content.module' "$PACKAGE/index.json")
          if [ "$declared" != "$MODULE" ]; then
            echo "::error::$PACKAGE/index.json declares content.module='$declared' but this entry packs '$MODULE' — the two halves of the mixed package drifted"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "packing $MODULE as $PACKAGE@$version, platform floor $floor"

      - name: Build the module (Release, warnings-as-errors)
        run: >
          dotnet build "${{ matrix.entry.project }}" -c Release -warnaserror
          -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          -p:Version=${{ steps.identity.outputs.version }}

      - name: Run the module's tests, when it ships any
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: |
          set -euo pipefail
          # A module's tests relocate WITH it (the Approvals precedent). Conventional sibling:
          # src/<Module>.Test. Absent is fine; present and red is not.
          tests="$(dirname "$PROJECT").Test"
          if [ -d "$tests" ]; then
            dotnet test "$tests" -c Release -warnaserror \
              -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          else
            echo "no test project at $tests — nothing to run"
          fi

      # Publish materializes the module's PACKAGE dependencies beside the entry DLL — the SDK's
      # own answer to the runtime closure (framework-trimmed packages excluded, everything else
      # included), which the pack step's --deps-closure derivation selects from. A
      # -p:CopyLocalLockFileAssemblies=true build was tried first and copied NOTHING on the CI
      # SDK while copying everything on a dev machine (2026-08-20, 12/14 jobs) — publish does not
      # depend on that flag at all.
      - name: Publish the module (the closure the pack selects from)
        run: >
          dotnet publish "${{ matrix.entry.project }}" -c Release --no-build
          -p:MeshWeaverRoot=$GITHUB_WORKSPACE/meshweaver
          -p:Version=${{ steps.identity.outputs.version }}

      - name: Build the module-pack tool
        run: dotnet build meshweaver/src/MeshWeaver.Plugin.Build/MeshWeaver.Plugin.Build.csproj -c Release

      - name: Pack the module bundle
        env:
          PROJECT: ${{ matrix.entry.project }}
        run: >
          dotnet run --project meshweaver/src/MeshWeaver.Plugin.Build -c Release --no-build --
          module-pack "$GITHUB_WORKSPACE/$(dirname "$PROJECT")/bin/Release/net10.0/publish"
          --deps-closure
          --module-name "${{ matrix.entry.module }}"
          --plugin "${{ matrix.entry.package }}"
          --package-version "${{ steps.identity.outputs.version }}"
          --min-mesh-version "${{ steps.identity.outputs.floor }}"
          --own-platform "$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
          --out "$RUNNER_TEMP/bundles"

      # A bundle that PACKED is not yet a bundle that LANDS: assert the closure and the manifest a
      # consumer's landing gate will read, loudly, instead of trusting the packer's exit code.
      - name: Inspect the bundle (manifest + assemblies)
        id: bundle
        env:
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          FLOOR: ${{ steps.identity.outputs.floor }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundles/MeshWeaver.Plugin.$PACKAGE.$VERSION.module.nupkg"
          test -f "$bundle" || { echo "::error::bundle not found: $bundle"; exit 1; }
          unzip -o -q "$bundle" -d "$RUNNER_TEMP/inspect-$MODULE"
          test -f "$RUNNER_TEMP/inspect-$MODULE/meshweaver/modules/$MODULE.dll" \
            || { echo "::error::entry DLL missing from meshweaver/modules/"; exit 1; }
          manifest="$RUNNER_TEMP/inspect-$MODULE/meshweaver/manifest.json"
          jq -e --arg m "$MODULE" '.module.assemblyName == $m' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblyName is not $MODULE"; exit 1; }
          jq -e --arg d "$MODULE.dll" '.module.assemblies | index($d) != null' "$manifest" > /dev/null \
            || { echo "::error::manifest module.assemblies misses the entry DLL"; exit 1; }
          jq -e --arg f "$FLOOR" '.module.minMeshVersion == $f' "$manifest" > /dev/null \
            || { echo "::error::manifest floor differs from content.minMeshVersion"; exit 1; }
          # A module bundle must NEVER carry a PLATFORM assembly beside its entry — it would
          # shadow the platform's own binary at the consumer (the same trap-door landing refuses
          # for the entry DLL). MODULE-OWNED MeshWeaver.* assemblies (their source lives in THIS
          # repo's src/, so they exist nowhere in /app — Import's DataSetReader family) are the
          # deliberate exception: for them, NOT riding is the fault. The jq mirrors the pack's
          # --own-platform set exactly, so the two cannot disagree about what "platform" means.
          # …EXCEPT the projects the repo lists in src/platform-shipped.txt: they live in its src/
          # yet ship in the portal IMAGE (the storage backends and transports that moved out of the
          # platform with the hosts), so a bundle carrying one would land a same-identity duplicate
          # beside the app's copy. ONE script computes the set for the pack AND for this check.
          own="$(bash "$GITHUB_WORKSPACE/meshweaver/.github/scripts/module-owned-platform.sh" "$GITHUB_WORKSPACE/src")"
          jq -e --arg m "$MODULE" --arg own "$own" \
            '($own | split(";")) as $owned
             | [.module.assemblies[]
                | select(startswith("MeshWeaver.")
                    and (. != $m + ".dll") and (. != $m + ".pdb")
                    and ((rtrimstr(".dll") | rtrimstr(".pdb")) as $n | $owned | index($n) | not))]
             | length == 0' \
            "$manifest" > /dev/null \
            || { echo "::error::bundle carries platform (MeshWeaver.*) assemblies beside the module"; exit 1; }
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "bundle OK:"; jq . "$manifest"

      - name: Upload the bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-bundle-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/bundles/*.module.nupkg
          if-no-files-found: error

      # 🚨 The hand-over. Without it a module that has LEFT the platform repo is packed, versioned,
      # inspected — and reaches nobody, because a registry serves only bytes it holds. A missing
      # token here FAILS the job rather than skipping quietly: "published nothing" and "published
      # fine" must never look the same (the same reason a gate may not skip green).
      - name: Hand the bundle to the registry
        if: ${{ inputs.publish }}
        env:
          TOKEN: ${{ secrets.publish-token }}
          REGISTRY: ${{ inputs.registry-url }}
          REGISTRY_SOURCE: ${{ inputs.registry-source }}
          PACKAGE: ${{ matrix.entry.package }}
          MODULE: ${{ matrix.entry.module }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::publish was requested but no publish-token secret was provided — the registry would never receive $MODULE, and this job would have reported success"
            exit 1
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/publish-$MODULE.json" -w '%{http_code}' \
            -X POST "$REGISTRY/api/plugins/bundles/$PACKAGE?version=$VERSION&packagePath=$REGISTRY_SOURCE/$PACKAGE" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$BUNDLE")
          echo "registry answered $code:"; cat "$RUNNER_TEMP/publish-$MODULE.json"; echo
          case "$code" in
            2*) echo "$MODULE@$VERSION is now served by $REGISTRY" ;;
            *)  echo "::error::registry refused $MODULE@$VERSION (HTTP $code)"; exit 1 ;;
          esac

      # ─────────────────────────── THE RECEIPT ───────────────────────────
      # 🚨 POSITIVE EVIDENCE THAT THIS LEG RAN. A skipped matrix leg renders with the same tick as
      # a passed one, so "this module was never packed" and "this module packed fine" are
      # indistinguishable on the checks wall — and a matrix whose size depends on a diff makes
      # that failure mode reachable rather than theoretical. `verify` counts these against the
      # selection and names whatever is missing. It is the LAST step on purpose: a receipt means
      # the whole leg, publish included, got here.
      - name: Drop the receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          jq -n --arg p "${{ matrix.entry.package }}" --arg m "${{ matrix.entry.module }}" \
                --arg v "${{ steps.identity.outputs.version }}" \
                --argjson pub '${{ inputs.publish }}' \
             '{package:$p, module:$m, version:$v, published:$pub}' \
             > "$RUNNER_TEMP/receipts/${{ matrix.entry.module }}.json"
          cat "$RUNNER_TEMP/receipts/${{ matrix.entry.module }}.json"
      - name: Upload the receipt
        uses: actions/upload-artifact@v7
        with:
          name: module-pack-receipt-${{ matrix.entry.module }}
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error

  # ═══════════════ THE COUNT GATE — one STABLE context, on every run ═══════════════
  # 🚨 A dynamic matrix cannot be a fixed list of required status checks: the per-module contexts
  # appear and disappear with the diff, so requiring one means requiring a context that will
  # legitimately never report — which is how a gate ends up not required at all and PRs merge past
  # it. This job is the answer: it is present on EVERY run whatever the diff, so it is the one
  # context a repo's protection should require for this lane, and it asserts that exactly the
  # selected bundles were built.
  #
  # `if: always()` because the failure it exists to catch is a SKIP, and a job that skips when the
  # thing it watches skipped watches nothing.
  verify:
    name: All selected bundles built
    needs: [select, pack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out Systemorph/MeshWeaver at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: meshweaver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Absent receipts are the finding, so a download that matches nothing must NOT fail here —
      # it must reach the verifier, which says which module is missing. That is the whole point.
      - name: Collect the receipts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: module-pack-receipt-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Exactly the selected bundles were built
        env:
          EXPECTED: ${{ needs.select.outputs.selected }}
          PACK_RESULT: ${{ needs.pack.result }}
          SCOPE: ${{ needs.select.outputs.scope }}
          COUNT: ${{ needs.select.outputs.count }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE, selection named $COUNT module bundle(s); pack job: $PACK_RESULT"
          # 🚨 `select` itself failing must not read as "nothing was selected" — that would turn a
          # broken selector into a green wall with an empty matrix behind it.
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "::error title=Module bundles incomplete::the selection job reported \
          '${{ needs.select.result }}' — no module bundle was chosen, so none was built. Read that \
          job; nothing below can be trusted."
            exit 1
          fi
          python3 meshweaver/.github/scripts/node-repo-pack-verify.py \
            --expected "$EXPECTED" \
            --receipts "$RUNNER_TEMP/receipts" \
            --pack-result "$PACK_RESULT"
