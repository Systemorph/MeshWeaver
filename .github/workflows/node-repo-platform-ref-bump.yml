name: Node repo platform-ref bump (reusable)

# ♻️ REUSABLE (workflow_call) — keeps a node repo's PLATFORM PIN current on its own.
#
# A node repo that builds a compiled module pins WHICH MeshWeaver commit it builds against
# (`MW_PLATFORM_REF` in its ci.yml). The pin buys reproducibility — a platform regression lands
# on the commit that moves it, not on whoever pushed next — and the price, as every caller's own
# comment says, is that it must be "bumped routinely".
#
# "Routinely" meant a person remembering, and it lagged. On 2026-08-18 MeshWeaver.SocialMedia's
# pin sat days behind while a module fix landed on a later platform commit — which meant the
# fix could be merged, green, and STILL never reach the shipped bundle, because the bundle is
# built against the pin. This automates the bump so that cannot recur silently.
#
# 🚨 It opens a PR; it never pushes to main. That is the point of keeping a pin at all: the bump
# stays a reviewable commit that the full gate suite runs on, so a platform regression arrives as
# a red PR instead of as a silently-changed build input. Auto-MERGING would turn the pin back
# into "always latest", which is exactly what the pin exists to prevent.
#
# 🚨🚨 …AND "THE FULL GATE SUITE RUNS ON IT" IS NOT FREE — IT IS A PROPERTY OF THE CREDENTIAL.
# This lane opened its PRs with `${{ github.token }}` until 2026-09-06, and a pull request created
# with GITHUB_TOKEN starts NO workflow runs at all: GitHub suppresses the `pull_request` event for
# anything that token creates, by documented design, to stop workflows recursing. On a repo whose
# `main` requires five contexts (MeshWeaver.Plugins does) the resulting PR can never merge, and it
# does not read as broken — it reads as "checks haven't started yet", forever. That is the same
# suppressed-trigger failure `auto-arm.yml`'s header documents one level down (#2916): the bump
# would have looked automated while landing nothing, which is strictly worse than the manual bump
# it replaces, because a person watching a PR pile up assumes the pile is in flight.
#
# So the lane mints a GitHub App installation token and opens the PR as the App. An App token is
# not GITHUB_TOKEN: its pushes and its pull requests trigger workflows normally. There is
# deliberately NO fallback to `github.token` — falling back would restore exactly the failure
# above, silently, on the day the App loses a grant. `ArmedMergeMustTriggerMainsPushLanesGuard`
# fails core's build if anyone puts it back.
#
# 🚨 THE APP INSTALLATION MUST GRANT `workflows`, not just `contents` and `pull_requests` (#3568).
# The pin lives in the calling repo's OWN workflow file (`workflow-file`, default
# `.github/workflows/ci.yml`), so this lane's entire diff is under `.github/workflows/**`, and
# GitHub refuses an App push that touches that path without the grant — by name, at the push, on
# the last step. The mint below asks for it explicitly so a missing grant is reported by the step
# that wanted it. Provisioning it is a repository-settings act (Settings → GitHub Apps → the
# installation → Repository permissions → Workflows: Read and write); nothing in CI can grant it,
# and nothing in CI can read whether it is granted.
#
# 🚨🚨 A LANE THAT FAILS WHERE NOBODY LOOKS IS THE SAME DEFECT AS A GATE THAT CANNOT FAIL (#3568,
# MeshWeaver.Plugins#1462). Everything above is about the lane being HONESTLY red — no
# `continue-on-error`, no input-shaped `if:`, an assert that fails naming what to provision. It was
# all of that, and it still went unnoticed for the whole of its existence, because *honestly red on
# a schedule* is red in an empty room: a scheduled run is attached to no pull request, no reviewer
# and no check list. Measured 2026-09-07: MeshWeaver.Plugins had exactly ONE run of this lane ever
# (34083504064) and it failed; MeshWeaver.SocialMedia the same. Nothing anywhere said so. The pin
# then drifted to 153 commits past the 120-commit staleness bound, which reddened all 16 open pull
# requests in the repo on a gate none of their diffs could reach, and starved the registry of a
# sealed publication until a person hand-moved the pin.
#
# So the failure now lands on an artefact a person reads: `report` opens (and keeps current) ONE
# tracking issue in the CALLING repo, labelled `platform-pin-bump-failure`, and closes it on the
# next success. That is why the caller must grant `issues: write` alongside the other two — a called
# workflow cannot widen what its caller was given, so the grant has to be written in the caller's
# job. It is `${{ github.token }}`'s grant, not the App's: the `meshweaver-cloud` installation holds
# `contents`/`metadata`/`pull_requests` and nothing else (measured 2026-09-07 via
# `GET /orgs/Systemorph/installations`), so an App-token issue write would fail for a second missing
# grant while reporting the first.
#
# 🚨 The report job is NOT tolerated-on-failure either, and that is the point rather than an
# oversight. If it cannot write the issue, the run stays red with the reason named — an alerting
# path that swallows its own failure re-creates, one level up, exactly the silence it was added to
# end.
#
# Caller contract:
#
#   name: Bump the platform pin
#   on:
#     schedule: [{cron: "17 4 * * *"}]
#     workflow_dispatch:
#   jobs:
#     bump:
#       permissions: {contents: write, pull-requests: write, issues: write}
#       uses: Systemorph/MeshWeaver/.github/workflows/node-repo-platform-ref-bump.yml@<sha>
#       with:
#         workflow-file: .github/workflows/ci.yml
#         pin-key: MW_PLATFORM_REF
#         upstream-repo: Systemorph/MeshWeaver
#       secrets:
#         MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
#         MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
#
# Pass every input explicitly even where it matches the default: a default read from a lane you
# did not open is a value nobody in the calling repo has agreed to. Never `secrets: inherit` — that
# hands this lane every secret the calling repo owns.
#
# 🚨 `repository_dispatch: {types: [meshweaver-framework-released]}` is deliberately NOT in the
# contract above, and this is a measurement rather than a preference. Each dispatch carries a
# DIFFERENT `client_payload.sha`, and the branch name is a function of the target commit, so every
# dispatch opens its OWN pull request. On 2026-09-03 MeshWeaver.SocialMedia received nine of them
# in one day (14:42, 16:34, 18:10, 19:06, 19:42, 20:43, 21:00, 21:08, 21:20Z) — nine bump PRs, nine
# full gate suites, eight of them superseded within the hour. The schedule below is the floor the
# lane exists to provide ("the pin is never silently days behind"); `workflow_dispatch` is the
# same-day path when a specific core fix is being chased, and a hand-written bump PR remains
# perfectly normal. A caller that genuinely wants per-release bumps must first answer what closes
# the superseded PRs.
#
# 🔒 PIN THE REF — same reason as every other node-repo template.

on:
  workflow_call:
    inputs:
      workflow-file:
        description: The caller's workflow file carrying the pin.
        type: string
        default: .github/workflows/ci.yml
      pin-key:
        description: The env key holding the platform commit.
        type: string
        default: MW_PLATFORM_REF
      upstream-repo:
        description: >-
          The repo whose default branch the pin tracks. It must be readable by the token minted
          below — public, or inside the same App installation. A read that fails stops the run red
          rather than writing a pin it could not verify.
        type: string
        default: Systemorph/MeshWeaver
    secrets:
      MESHWEAVER_APP_ID:
        description: >-
          App id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet.
          Required: a pull request opened with secrets.GITHUB_TOKEN starts no workflow runs, so the
          bump would sit unmergeable behind required contexts that can never report (#2916's shape).
        required: true
      MESHWEAVER_APP_PRIVATE_KEY:
        description: >-
          That App's private key (PEM). Source of truth is Key Vault Systemorph/github-app-privatekey.
        required: true

jobs:
  bump:
    name: Bump the platform pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No `if:` on any step here. The assert and the mint ASSERT and fail; they never choose
      # whether to run. A step asking "is the App id set?" and skipping would render exactly like
      # a bump that found nothing to do — invariant #3 in AGENTS.md.
      - name: The App credential, or a red run naming what to provision
        env:
          MESHWEAVER_APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          MESHWEAVER_APP_PRIVATE_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$MESHWEAVER_APP_ID" ]          || missing+=("secrets.MESHWEAVER_APP_ID           app id of the org's meshweaver-cloud GitHub App, installed on every repo in the fleet")
          [ -n "$MESHWEAVER_APP_PRIVATE_KEY" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY  that App's private key (PEM); source of truth is Key Vault Systemorph/github-app-privatekey")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the platform-ref bump cannot run — provision the following, then re-run:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "App credential present."

      # 🚨 No `continue-on-error` here, and the contrast with `auto-arm.yml` is deliberate. There
      # the tolerance is defensible because a missing grant is a property of the REPOSITORY and
      # would paint the same red on every open pull request, saying nothing about any of them —
      # so the assertion moved to a repo-scoped lane. This lane IS repo-scoped and runs once a
      # day against nobody's branch: a red here is the actionable, once-per-day statement that the
      # pin is not being maintained. Tolerating it would mean the bump silently stops happening,
      # which is the exact state this lane was written to end.
      - name: Mint an installation token whose pull requests actually start CI
        id: bump-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Requested explicitly so an installation missing any of them fails HERE, on a step whose
          # name says what it wanted, rather than degrading to a token that pushes fine and then
          # opens a pull request nothing runs on.
          permission-contents: write
          permission-pull-requests: write
          # 🚨 THIS LANE'S ENTIRE DIFF IS A WORKFLOW FILE, so `contents: write` alone cannot push it
          # (#3568). `workflow-file` defaults to `.github/workflows/ci.yml` — the pin lives in the
          # workflow's own `env:` — and GitHub refuses an App push that touches
          # `.github/workflows/**` without this grant, by name:
          #
          #   ! [remote rejected] chore/platform-ref-<sha> -> chore/platform-ref-<sha>
          #     (refusing to allow a GitHub App to create or update workflow
          #      `.github/workflows/ci.yml` without `workflows` permission)
          #
          # Measured 2026-09-07: that is EVERY run this lane has ever had — MeshWeaver.Plugins
          # 34083504064 at 04:32:51Z and MeshWeaver.SocialMedia at 04:51:24Z, the only two runs the
          # API lists for either caller. So the lane has never once moved a pin, and it failed at
          # the LAST step, three minutes in, naming a permission nobody had asked for.
          #
          # It stayed invisible because the lane is right about everything else: it refuses to
          # `continue-on-error`, so it went red honestly — at 04:17Z, on a schedule, against
          # nobody's branch, where nothing surfaces a scheduled red. "The pin is not being
          # maintained" is exactly the statement this lane exists to make, and it made it daily
          # into an empty room while MeshWeaver.Plugins' MW_PLATFORM_REF drifted 117 commits behind
          # core main — inside the staleness gate's bounds, and therefore silent.
          #
          # Requesting it here is the same discipline the two lines above already state: if the
          # installation lacks the grant, this step fails with the permission in its own name,
          # instead of a push failing later with a message about something nobody requested.
          permission-workflows: write

      # The checkout carries the minted token, so the later `git push` is the App's push. With the
      # default credential the push would be GITHUB_TOKEN's, and the branch would exist with no
      # event attached to it.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.bump-token.outputs.token }}

      - name: Work out the current pin and the target commit
        id: refs
        env:
          GH_TOKEN: ${{ steps.bump-token.outputs.token }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          current=$(grep -oE '^\s*${{ inputs.pin-key }}:\s*[0-9a-f]+' ${{ inputs.workflow-file }} \
            | grep -oE '[0-9a-f]+$' || true)
          if [ -z "$current" ]; then
            echo "::error::Could not read ${{ inputs.pin-key }} from ${{ inputs.workflow-file }} — the pin's \
          shape changed and this workflow would silently bump nothing."
            exit 1
          fi

          # A release dispatch names the exact commit that was released; a scheduled run asks the
          # platform where its default branch points. Never "latest tag": the module compiles
          # against project references in a CHECKOUT, so the meaningful identity is a commit.
          if [ -n "${PAYLOAD_SHA:-}" ]; then
            target="$PAYLOAD_SHA"
            source="release dispatch"
          else
            target=$(gh api repos/${{ inputs.upstream-repo }}/commits/main --jq '.sha')
            source="scheduled poll of ${{ inputs.upstream-repo }}@main"
          fi

          if [ -z "$target" ] || [ ${#target} -lt 7 ]; then
            echo "::error::Could not resolve a target platform commit ($source) — refusing to \
          write a pin I cannot verify."
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target"   >> "$GITHUB_OUTPUT"
          echo "source=$source"   >> "$GITHUB_OUTPUT"
          echo "pin is $current; target is $target ($source)"

      # Comparing PREFIXES. Callers write the pin full-length with a SHORT sha in the adjacent
      # "# Current:" note, but a caller that pins short must work too — and against a 40-char API
      # answer a naive compare would report a bump every single day and open an endless series of
      # no-op PRs. Prefix-comparing to the length actually written handles both.
      - name: Is the pin already current?
        id: check
        run: |
          set -euo pipefail
          current='${{ steps.refs.outputs.current }}'
          target='${{ steps.refs.outputs.target }}'
          if [ "${target:0:${#current}}" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pin already points at $target — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open (or update) the bump PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bump-token.outputs.token }}
          CURRENT: ${{ steps.refs.outputs.current }}
          TARGET: ${{ steps.refs.outputs.target }}
          SOURCE: ${{ steps.refs.outputs.source }}
          APP_SLUG: ${{ steps.bump-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          branch="chore/platform-ref-${TARGET:0:9}"

          # Attributed to the identity that actually pushes. Naming github-actions[bot] here while
          # the App pushes would put the one identity whose pushes start nothing on a commit that
          # does start something — a misdirection for the next person reading the blame.
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          # A stable branch name per target commit makes a re-run idempotent: same target, same
          # branch, same PR updated in place rather than a pile of duplicates. On a re-run the
          # branch exists on the REMOTE but not locally, so it has to be created tracking it —
          # `git switch <name>` alone finds nothing in a fresh checkout, and the later push then
          # fails non-fast-forward.
          if git fetch origin "$branch" 2>/dev/null; then
            git switch -c "$branch" --track "origin/$branch"
            # A conflict here must STOP. Swallowing it (|| true) leaves the tree half-merged and
            # commits that as if it were a clean bump.
            if ! git merge --no-edit origin/main -q; then
              echo "::error::'$branch' conflicts with main — resolve it there; refusing to commit a \
          half-merged tree."
              exit 1
            fi
          else
            git switch -c "$branch"
          fi

          # Rewrite ONLY the pin line, and only where it is the env declaration.
          sed -i -E "s|^(\s*${{ inputs.pin-key }}:\s*)[0-9a-f]+|\1${TARGET}|" ${{ inputs.workflow-file }}
          # Keep the human-readable "Current:" note beside it honest — a stale comment next to a
          # fresh pin is how the next reader gets misled about what is being built.
          today=$(date -u +%Y-%m-%d)
          sed -i -E "s|^(\s*# Current: )[0-9a-f]+, [0-9]{4}-[0-9]{2}-[0-9]{2}.*|\1${TARGET:0:9}, ${today} (auto-bumped).|" \
            ${{ inputs.workflow-file }}

          if git diff --quiet; then
            echo "::notice::pin already at ${TARGET} on this branch — nothing to commit"
            exit 0
          fi

          git add ${{ inputs.workflow-file }}
          git commit -q -m "chore: bump ${{ inputs.pin-key }} to ${TARGET:0:9}

          This repo's src/ and its compiled modules build against a MeshWeaver checkout at this
          pin. Source: ${SOURCE}. Previous pin: ${CURRENT}.

          Opened automatically so the pin cannot silently lag behind the platform — a lagging pin
          is a gate reporting on a framework nobody runs, and it means a module fix can be merged
          and still never reach the shipped bundle."
          git push -q origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already open — updated in place"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: bump ${{ inputs.pin-key }} to ${TARGET:0:9}" \
              --body "$(printf '%s\n' \
                "Bumps the platform pin this repo builds against." \
                "" \
                "| | |" \
                "|---|---|" \
                "| previous | \`${CURRENT}\` |" \
                "| new | \`${TARGET}\` |" \
                "| source | ${SOURCE} |" \
                "" \
                "The pin exists so a platform regression lands on the commit that moves it rather than on whoever pushed next — so this is a **PR, not a push**, and the full gate suite runs on it exactly as it would for a hand-written bump." \
                "" \
                "If CI is red here, the platform changed under the module: fix it on this branch, do not close and re-bump later. A pin that lags is a gate reporting on a framework nobody runs.")"
          fi

  # ───────────────────────── the failure has an audience ─────────────────────────
  #
  # `if: ${{ !cancelled() }}` and NOT `if: failure()`, because this job has two jobs: it files the
  # alert when the bump failed AND clears it when the bump worked. A failure-only variant leaves a
  # stale issue standing after the lane recovers, and a standing alert that is no longer true is how
  # the next real one gets skimmed past.
  #
  # A cancelled run says nothing about the pin — neither open nor close.
  report:
    name: A failed bump is visible, not just red in an empty room
    needs: [bump]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # REPLACES the caller's map for this job: no checkout, no push, no pull request here — the
    # alert only reads and writes issues. `issues: write` must be granted by the CALLER (a called
    # workflow can only narrow what it was given); without it this job fails, naming the line to add,
    # which is the correct way for a missing grant to surface.
    permissions:
      issues: write
    steps:
      - name: File the tracking issue, or close it because the bump worked
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_RESULT: ${{ needs.bump.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PIN_KEY: ${{ inputs.pin-key }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          UPSTREAM: ${{ inputs.upstream-repo }}
        run: |
          set -euo pipefail

          label=platform-pin-bump-failure
          title="ci: the automated ${PIN_KEY} bump is not moving the pin"

          # A label of ITS OWN, never the repo's general `ci-failure`. Listing by a shared label
          # would find whatever unrelated alert happens to be open and comment the pin's story onto
          # it — and, worse, close it on the next success. The label IS the state store, so it has
          # to name exactly one subject.
          #
          # `--force` is update-or-create, so this is idempotent. A transient 5xx here must not
          # swallow the alert it is decorating, and it cannot hide one either: the `--label` on the
          # create below fails loudly if the label genuinely does not exist.
          gh label create "$label" --repo "$GITHUB_REPOSITORY" \
            --description "The scheduled platform-pin bump lane cannot move the pin" \
            --color B60205 --force \
            || echo "::warning::could not ensure the $label label (continuing to file the alert)"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ "$BUMP_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "The bump lane succeeded in [run ${GITHUB_RUN_ID}](${RUN_URL}); the pin is being moved automatically again. Reopened automatically if it stops."
              echo "::notice::bump succeeded — closed #$existing"
            else
              echo "bump succeeded and no alert was open — nothing to do"
            fi
            exit 0
          fi

          # ONE issue, kept current, rather than a comment per night. The lane runs daily, so
          # appending would produce a year of identical comments and bury the one sentence that
          # matters; the issue's own age already measures how long the pin has been unmaintained.
          body=$(printf '%s\n' \
            "The scheduled lane that keeps \`${PIN_KEY}\` in \`${WORKFLOW_FILE}\` current **failed**, so this repo's platform pin is not being moved by anything." \
            "" \
            "| | |" \
            "|---|---|" \
            "| latest failed run | [${GITHUB_RUN_ID}](${RUN_URL}) |" \
            "| pin | \`${PIN_KEY}\` in \`${WORKFLOW_FILE}\` |" \
            "| tracks | \`${UPSTREAM}@main\` |" \
            "" \
            "**What this costs while it is open.** Every pin move is a hand move. The pin drifts against ${UPSTREAM}'s \`main\` at that repo's merge rate, and when it crosses the staleness bound the ratchet reds **every open pull request here at once**, on a gate none of their diffs can reach — and nothing seals, so downstream consumers keep the previous publication." \
            "" \
            "**Read the failing step in the linked run.** Two shapes have actually occurred:" \
            "" \
            "* *the token mint fails naming a permission* — the \`meshweaver-cloud\` App installation is missing it. The pin lives in a file under \`.github/workflows/\`, so the push needs **Workflows: Read and write**, which is a GitHub App settings change plus an installation approval. Nothing in CI can grant it and nothing in CI can read whether it is granted." \
            "* *the push is rejected* with \`refusing to allow a GitHub App to create or update workflow … without \\\`workflows\\\` permission\` — same missing grant, on a lane sha that predates the explicit request." \
            "" \
            "This issue closes itself on the lane's next success. Do **not** close it after a hand bump: the hand bump clears the drift and leaves the mover dead, which is the state that produced this issue." \
            "" \
            "<!-- platform-pin-bump-failure -->")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "::error::the platform-pin bump failed again — #$existing updated with $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" --body "$body"
            echo "::error::the platform-pin bump failed — tracking issue filed"
          fi
