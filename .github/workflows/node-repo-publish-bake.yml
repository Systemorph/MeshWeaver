name: Node repo publish-bake (reusable)

# ♻️ REUSABLE (workflow_call) — the ONE bake-and-publish lane for every MeshWeaver.* content repo
# (#1660 WS3, unified per #1707). Each node repo used to vendor a near-identical `publish-bake`
# job plus its own copy of `publish-bake-bundles.sh`; five copies of a script whose `_complete`
# sentinel name must keep matching `ShippedPrebuiltBundles.CompletionSentinelFileName` is five
# chances for silent drift. This workflow runs the canonical script from THIS repo (checked out
# by ref), so the sentinel contract has exactly one home next to the C# constant it mirrors.
#
# What it does: run the caller repo's full content through mw-plugin-test as the #2064 SPLIT —
# `compile … --output` (the compiler produces the bake; no mesh) then `… --seed` (a mesh consumes
# and gates the produced bytes). Never the fused `--bake-output`, which makes the MESH the producer
# (the run IS a full gate — import + compile + render + Tests areas), then publish the resulting
# bundles to every portal storage target under
# `<base>/prebuilt-bundles/<framework-identity>/<bake-source>/`. A portal whose own framework
# identity matches seeds them at boot and compiles nothing the repo ships.
#
# The PUBLICATION is always the FULL set; the COMPILE need not be. The publication is atomic per
# identity — the `_complete` sentinel (written LAST) lists the whole bundle set and the portal
# seeds only what the sentinel lists, so a partial publish would SHRINK what portals adopt — and
# that is a constraint on what is UPLOADED, not on what is recompiled. With
# `narrow-by-affected: true` the job diffs the caller's content against the commit its own sealed
# publication records (`source-commit.txt`), rebuilds only the modules that diff AFFECTS
# (`scripts/affected-modules.py`: changed modules + every transitive DEPENDENT + their
# dependencies), and carries every other bundle forward from the publication before sealing — so
# the sentinel still lists everything and no portal adopts less than it does today. Every
# uncertainty falls back to a FULL bake, out loud. Callers gate this job to main pushes +
# `repository_dispatch` (framework releases) via the job-level `if:`/`needs:` on the `uses:` job.
#
# Caller contract (see the SocialMedia/Plugins ci.yml for a worked example):
#
#   on:
#     repository_dispatch:
#       # BOTH: the platform releasing, and an UPSTREAM of this repo publishing (#1755). The second
#       # is what wakes a run that exited because its upstreams were not ready yet.
#       types: [meshweaver-framework-released]
#     # 🚨 REQUIRED, not optional. The dispatch above has NEVER been armed, and the cross-repo
#     # PAT it needed was removed on purpose (2026-08-21), so THIS POLL is how a satellite learns a
#     # release happened. Without it the repo bakes only on its own pushes while the platform mints
#     # an identity per merge, so every portal boots on an identity nobody baked and falls back to a
#     # full in-mesh Roslyn sweep. Measured 2026-08-22: 3 of 4 satellites had no schedule and
#     # followed nothing, behind a wall of green ticks. Stagger the minute per repo. Full rationale:
#     # CiContentBake.md -> "Following the release is a POLL in every satellite".
#     schedule:
#       - cron: "17,47 * * * *"
#
#   # The schedule MUST share the dispatch's concurrency lane: a scheduled run carries the DEFAULT
#   # BRANCH ref, so in the `github.ref` group a poll can cancel a main run mid-`tag-modules`.
#   concurrency:
#     group: ${{ github.workflow }}-${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'framework-release' || github.ref }}
#     cancel-in-progress: true
#
#   publish-bake:
#     if: >
#       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
#       github.event_name == 'repository_dispatch' ||
#       github.event_name == 'schedule'
#     needs: [preflight, validate, compile-check, test-repos]
#     permissions: { contents: read, id-token: write }   # OIDC — must be granted BY the caller
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-publish-bake.yml@<40-char platform commit sha>
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".
#     with:
#       bake-source: socialmedia
#       narrow-by-affected: true      # rebuild only the modules a push actually affects
#       test-image: ${{ vars.MW_TEST_IMAGE }}
#       image-digest: ${{ vars.MW_IMAGE_DIGEST }}     # or a workflow env / literal pin
#       bake-publish-targets: ${{ vars.BAKE_PUBLISH_TARGETS }}
#       upstream-sources: plugins                    # exit unless `plugins` is published for the
#                                                    # framework identity this bake targets
#       stage-repo: Systemorph/MeshWeaver.Plugins
#       stage-modules: Store
#     secrets:
#       acr-username: ${{ secrets.ACR_USERNAME }}
#       acr-password: ${{ secrets.ACR_PASSWORD }}
#       azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
#       azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
#       azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
#       stage-repo-app-id: ${{ secrets.MESHWEAVER_APP_ID }}
#       stage-repo-app-private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
#
# The real topology, and the order it produces without any central scheduler:
#
#   platform ──dispatch──▶ plugins (no upstreams)            builds, publishes
#                            └──dispatch──▶ education        (was exited) builds, publishes
#                            │                 └──dispatch──▶ reinsurance
#                            └──dispatch──▶ socialmedia      (was exited) builds, publishes
#
# A repo woken before its upstreams are ready EXITS immediately and is woken again by the
# publication it was waiting for. Nothing polls; nothing sleeps in a runner.
#
# Every externally-provisioned value is an EXPLICIT input/secret — nothing is read from the
# caller's `vars`/`env` implicitly — so the preflight step below can assert the complete set and
# fail RED naming exactly what to provision (AGENTS.md: a gate never tests its own inputs, and a
# grey skip is indistinguishable from a pass).

on:
  workflow_call:
    inputs:
      bake-source:
        description: >-
          The producing repo's source segment in the publication layout
          (prebuilt-bundles/<identity>/<bake-source>/...), e.g. plugins, education,
          reinsurance, socialmedia. Multiple producers publish without clobbering.
        required: true
        type: string
      test-image:
        description: The mw-plugin-test image reference (the caller's vars.MW_TEST_IMAGE).
        required: true
        type: string
      image-digest:
        description: >-
          Digest pin for push-triggered bakes (tag@digest — reproducible, bump deliberately).
          Ignored for repository_dispatch, which always bakes against the released version tag
          from the payload. Leaving it empty is an ERROR unless allow-unpinned is set.
        required: false
        type: string
        default: ''
      allow-unpinned:
        description: >-
          Explicitly accept an empty image-digest and bake against the tag verbatim (a repo
          that tracks :main accepts that its runs are not reproducible). Never a silent
          fallback: an empty digest WITHOUT this flag fails red.
        required: false
        type: boolean
        default: false
      narrow-by-affected:
        description: >-
          Rebuild only the modules the content diff AFFECTS, instead of every module on every
          run. The baseline is the commit the repo's own sealed publication records
          (source-commit.txt), NOT github.event.before — so a run that lost a race, was
          cancelled, or followed a red gate still diffs against what is actually published. The
          modules NOT rebuilt keep their published bundles, carried forward before the seal, so
          the publication stays complete.

          OPT-IN, and biased to full: no selector in the caller repo, no sealed publication yet,
          publish targets that disagree, an unreachable baseline, a rewritten history, a diff the
          selector refuses, or any change to scripts/ .github/ a repo-root file or a DELETED
          module ⇒ a FULL bake, logged with the reason. Requires the caller to ship
          scripts/affected-modules.py, and is mutually exclusive with pre-bake-script (a hook that
          builds its own mount owns its composition).
        required: false
        type: boolean
        default: false
      bake-publish-targets:
        description: >-
          Whitespace-separated portal storage targets, <account>/<share>[/<base-path>]
          (the caller's vars.BAKE_PUBLISH_TARGETS — same value the platform repo carries).
        required: true
        type: string
      upstream-sources:
        description: >-
          The bake-source segments this repo DEPENDS ON, whitespace-separated (e.g. `plugins`
          for Education / Reinsurance / SocialMedia). Before building, the job asserts each one
          has a SEALED publication under the framework identity it is about to bake against; if
          any has not, it EXITS WITHOUT BUILDING (#1755) rather than gating against an upstream
          that no longer matches the framework. Empty = this repo has no upstreams (the roots:
          the platform itself, and MeshWeaver.Plugins), and the gate does not apply.
        required: false
        type: string
        default: ''
      stage-repo:
        description: >-
          Repository to stage cross-repo modules from (e.g. Systemorph/MeshWeaver.Plugins),
          so the caller's packages' `requires` resolve. Empty = no staging.
          🚧 Transitional. The directive is that a repo builds only what it OWNS and consumes its
          upstreams as pre-built released artifacts; `upstream-sources` above is the half of that
          which exists today (the availability gate). Staging cannot be dropped until a published
          artifact carries the upstream's NODE DEFINITIONS and not just its compiled assemblies —
          see Doc/Architecture/ReleaseGates → "Build only what you own".
        required: false
        type: string
        default: ''
      stage-modules:
        description: >-
          Module directories to sparse-checkout from stage-repo and copy into the bake mount
          (newline-separated for several). Staged modules are OWNED by stage-repo: their bundles
          are excluded from this repo's publication so no package is ever seeded from two
          sources.
        required: false
        type: string
        default: ''
      pre-bake-script:
        description: >-
          Optional shell run in the caller checkout after staging, before the bake — e.g. a
          package-snapshot filter. Keep it minimal; anything load-bearing belongs in the repo.
          A script that builds its own bake mount (Education's snapshot) writes
          `BAKE_MOUNT_DIR=<path>` to $GITHUB_ENV; the bake then mounts THAT as /repo instead of
          the checkout, and staged modules are NOT auto-copied (the script owns the mount's
          composition — the staged checkout is available at cross-repo-stage/).
        required: false
        type: string
        default: ''
      node-version:
        description: Set to install Node (actions/setup-node) before the pre-bake script. Empty = skip.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 40
      allow-file:
        description: Known-debt ratchet file passed as --allow (repo-relative). Empty = none.
        required: false
        type: string
        default: 'plugin-gate.allow'
      platform-ref:
        description: >-
          Ref of Systemorph/MeshWeaver to take the canonical publish script from. Default main;
          pin only to bisect a script regression.
        required: false
        type: string
        default: 'main'
      module-artifacts:
        description: >-
          Artifact-name pattern (actions/download-artifact `pattern`) of module bundles UPLOADED
          BY THIS RUN (each a *.module.nupkg) whose module DLLs the bake and the gate must
          compose. The tester image ships NO modules since MeshWeaver#2276
          (TesterModules.ImageShipped is empty by design; a repo mounts its own build with
          --module, #2541) — so a repo whose NodeType source binds a module's types names that
          module here or in registry-modules, or its bake fails CS0103/CS0246 on every wave.
          Empty = none.
        required: false
        type: string
        default: ''
      registry-modules:
        description: >-
          Package ids (whitespace-separated, e.g. `AI`) whose module bundle to fetch from
          registry-url and compose into the bake/gate with --module — for a repo that stages the
          package's CONTENT but does not build its module. The module lane is FLOOR-gated, not
          identity-gated (PluginBundleClient.AdoptModule), so the registry's current bundle is
          the right bytes for any image satisfying the module's minMeshVersion. Requires
          registry-url and the registry-key secret; asserted RED in preflight, never skipped.
        required: false
        type: string
        default: ''
      registry-url:
        description: >-
          Base URL of the registry serving /api/plugins/bundles (the caller's MW_REGISTRY_URL
          variable). Needed only when registry-modules is set.
        required: false
        type: string
        default: ''
      content-repository:
        description: >-
          The repository whose node content is baked. Empty = the caller (every node repo baking
          its own content — today's behaviour). The platform's CD sets it to
          Systemorph/MeshWeaver.Plugins: Plugins is built WITH the platform, not as a subscriber,
          so its publication for a new framework identity is sealed in the same run that mints
          the identity, before any dependent is told to rebuild.
        required: false
        type: string
        default: ''
      content-ref:
        description: The ref of content-repository to bake. Empty = the caller's own commit.
        required: false
        type: string
        default: ''
      dispatch-dependents:
        description: >-
          After a SUCCESSFUL publish, send `repository_dispatch: meshweaver-upstream-published` to
          every repo the dispatch App is installed on whose ci.yml declares this bake-source as an
          upstream (`upstream-sources:` / `upstream-seed:`). That is the package-publish half of
          the rebuild wave: "otherwise only dependent packages — then publish package built and
          cascade recursively". Each receiver bakes against the SAME image (client_payload.image),
          publishes, and emits the same event for its own source; the payload carries the chain of
          sources so a cycle can never loop. Needs the dispatch-app-* secrets, asserted RED.
        required: false
        type: boolean
        default: false
    secrets:
      acr-username:
        description: >-
          Registry user able to pull the test image. OPTIONAL since the platform's own CD calls
          this workflow: leave both acr-* secrets empty and the image pull authenticates through
          the azure-* OIDC identity instead (`az acr login`), which then needs AcrPull.
        required: false
      acr-password:
        description: Registry password for that user (see acr-username).
        required: false
      azure-client-id:
        description: >-
          Client id of an Azure identity holding "Storage File Data Privileged Contributor" on
          the portals' storage accounts, with a federated credential for the caller repo's main.
        required: true
      azure-tenant-id:
        description: Tenant of that identity.
        required: true
      azure-subscription-id:
        description: Subscription of the storage accounts.
        required: true
      stage-repo-app-id:
        description: >
          App id of a GitHub App installed on stage-repo's org with Contents: Read (needed only
          when stage-modules is set). Replaces the former stage-repo-token PAT: an installation
          token is minted per run and scoped to stage-repo alone, so it cannot rot the way a
          stored PAT does — and, unlike a PAT, it resolves for dependabot-triggered runs once
          provisioned in the caller's Dependabot secret store as well (#2249).
        required: false
      stage-repo-app-private-key:
        description: Private key (PEM) of that App.
        required: false
      registry-key:
        description: >-
          Instance key (mwi_…) able to read the packages named in registry-modules from
          registry-url. Needed only when registry-modules is set.
        required: false
      dispatch-app-id:
        description: >-
          App id of a GitHub App installed on every repo that may depend on this one, with
          Contents: Read (to read their ci.yml) and Contents: Write (repository_dispatch).
          Required when dispatch-dependents is true; asserted RED, never skipped.
        required: false
      dispatch-app-private-key:
        description: Private key (PEM) of that App.
        required: false
      content-app-id:
        description: >-
          App id of a GitHub App with Contents: Read on content-repository. Required whenever
          content-repository is set (the caller's GITHUB_TOKEN cannot read another repository);
          asserted RED before the checkout, never skipped.
        required: false
      content-app-private-key:
        description: Private key (PEM) of that App.
        required: false

jobs:
  publish-bake:
    name: Bake + publish NodeType assemblies to portal storage
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      # Read by dispatch-dependents below: a run that baked NOTHING (already sealed) publishes
      # nothing and therefore wakes nobody.
      published: ${{ steps.publish.outputs.published }}
      image: ${{ steps.image.outputs.ref }}
      identity: ${{ steps.identity.outputs.identity }}
    permissions:
      contents: read
      id-token: write     # azure/login OIDC — no long-lived storage secret in any node repo
    steps:
      # 🚨 NO SKIP-TRAPDOOR: the publish credentials are asserted RED here, naming exactly what
      # to provision — never `continue-on-error`, never an if-secret-set skip. A grey skip would
      # silently restore the every-pod-rebakes-everything regression this lane closes.
      - name: "Preflight: the publish credentials must be provisioned"
        env:
          AZURE_CLIENT_ID: ${{ secrets.azure-client-id }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.azure-subscription-id }}
          ACR_USERNAME: ${{ secrets.acr-username }}
          ACR_PASSWORD: ${{ secrets.acr-password }}
          # Half a basic credential is a misconfiguration, not OIDC mode.
          ACR_MODE: ${{ (secrets.acr-username != '' && secrets.acr-password != '') && 'basic' || ((secrets.acr-username == '' && secrets.acr-password == '') && 'oidc' || 'half') }}
          STAGE_APP_ID: ${{ secrets.stage-repo-app-id }}
          STAGE_APP_KEY: ${{ secrets.stage-repo-app-private-key }}
          BAKE_PUBLISH_TARGETS: ${{ inputs.bake-publish-targets }}
          STAGE_MODULES: ${{ inputs.stage-modules }}
          NARROW: ${{ inputs.narrow-by-affected }}
          PRE_BAKE: ${{ inputs.pre-bake-script }}
          REGISTRY_MODULES: ${{ inputs.registry-modules }}
          REGISTRY_URL_IN: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AZURE_CLIENT_ID:-}" ]        || missing+=("azure-client-id (secret) — client id of an Azure identity holding 'Storage File Data Privileged Contributor' on the portals' storage account, with a federated credential for repo:${GITHUB_REPOSITORY}:ref:refs/heads/main")
          [ -n "${AZURE_TENANT_ID:-}" ]        || missing+=("azure-tenant-id (secret) — tenant of that identity")
          [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]  || missing+=("azure-subscription-id (secret) — subscription of the storage account")
          case "${ACR_MODE:-}" in
            basic) ;;                       # user + password present
            oidc)  ;;                       # both empty: az acr login under the azure-* identity (asserted below)
            *) missing+=("acr-username + acr-password (secrets) — set BOTH for a basic registry login, or NEITHER to pull through the azure-* OIDC identity; one without the other is neither") ;;
          esac
          [ -n "${BAKE_PUBLISH_TARGETS:-}" ]   || missing+=("bake-publish-targets (input, from the caller's repo VARIABLE) — the portals' Azure Files targets, whitespace-separated <account>/<share>[/<base-path>]")
          if [ -n "${STAGE_MODULES:-}" ]; then
            stage_missing=0
            [ -n "${STAGE_APP_ID:-}" ]  || { stage_missing=1; missing+=("stage-repo-app-id (secret) — app id of a GitHub App that can read the stage repo (stage-modules is set)"); }
            [ -n "${STAGE_APP_KEY:-}" ] || { stage_missing=1; missing+=("stage-repo-app-private-key (secret) — that App's private key, PEM (stage-modules is set)"); }
            # 🚨 Gated on the STAGE credentials specifically, never on "any input is missing".
            # This hint names one cause, so it must only fire for the input that has that cause:
            # a missing acr-password is not a Dependabot-store problem, and a hint that says it is
            # sends the next person to the wrong settings page (Copilot review, #2310).
            #
            # When it DOES fire, the secrets usually exist — in the WRONG STORE. GitHub hands a
            # dependabot-triggered run the Dependabot secret store, never the Actions one, so a
            # value provisioned only for push runs is simply absent here and every dependabot PR
            # stays red forever (#2249). Provision the same pair under
            # Settings -> Secrets and variables -> Dependabot in the CALLING repo.
            if [ "$stage_missing" = "1" ] && [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::warning::This run reads the DEPENDABOT secret store, not Actions. stage-repo-app-id/stage-repo-app-private-key must be provisioned there too (#2249)."
            fi
          fi
          # 🚨 Declaring dependents is declaring an OBLIGATION: those repos exit on their own
          # upstream gate and are woken only by the event this job fires. A missing token would
          # break the chain silently — every downstream repo would sit un-rebuilt for the whole
          # release with nothing red anywhere. Asserted here, as a DECLARED-INPUT check, never as
          # an "is the secret set?" probe that decides whether to run.
          # 🚨 A DECLARED-INPUT contradiction, asserted here rather than resolved silently at run
          # time. A pre-bake hook that writes BAKE_MOUNT_DIR OWNS the mount's composition (it can
          # filter, snapshot or synthesise packages), so "the affected closure" is not a set this
          # job may substitute for it. Picking one and carrying on would mean a caller reading its
          # own workflow could not tell which mount ran.
          if [ -n "${REGISTRY_MODULES:-}" ]; then
            [ -n "${REGISTRY_URL_IN:-}" ] || missing+=("registry-url (input, the caller's MW_REGISTRY_URL variable) — registry-modules is set")
            [ -n "${REGISTRY_KEY:-}" ]    || missing+=("registry-key (secret, the caller's MW_REGISTRY_KEY) — registry-modules is set")
          fi
          if [ "${NARROW:-false}" = "true" ] && [ -n "${PRE_BAKE:-}" ]; then
            missing+=("narrow-by-affected and pre-bake-script are mutually exclusive — a hook that builds its own bake mount owns its composition, so the affected closure cannot also decide it. Drop one.")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The bake publication cannot reach any portal — required credentials are not provisioned. This job fails RED rather than skipping: a grey skip is indistinguishable from a pass and would silently leave every portal re-compiling this repo's content at boot."
            for m in "${missing[@]}"; do echo "::error::missing: ${m}"; done
            exit 1
          fi
          echo "All publish credentials are provisioned."
      # 🚨 fetch-depth 0 when narrowing: the baseline is a commit the PUBLICATION names, which can
      # be any distance back (as far as the last successful publish), and a shallow clone cannot
      # resolve it. bake-scope.sh falls back to a full bake rather than guessing when it cannot —
      # correct, but it would narrow NOTHING, ever. The string forms are deliberate: GitHub
      # expressions treat the NUMBER 0 as falsy, so `inputs.x && 0 || 1` yields 1 in both branches.
      # 🚨 A content checkout from ANOTHER repository needs a token that can read it. The caller's
      # GITHUB_TOKEN is scoped to the calling repository alone, so `repository:
      # Systemorph/MeshWeaver.Plugins` (private) answers 404 under it — the platform's first release
      # wave died on exactly that (main-cd run 33276813173, 2026-08-29). When content-repository is
      # set, the App credential is ASSERTED red, never fallen back on: a fallback to github.token
      # would 404 anyway, one step later and blaming the checkout.
      - name: Resolve the content repository's credential
        id: content-repo
        if: inputs.content-repository != ''
        env:
          REPO: ${{ inputs.content-repository }}
          APP_ID: ${{ secrets.content-app-id }}
          APP_KEY: ${{ secrets.content-app-private-key }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ]  || { echo "::error::content-repository is '$REPO' but secrets.content-app-id is empty — the caller's GITHUB_TOKEN cannot read another repository, so the checkout would 404. Pass a GitHub App installed on '$REPO' with Contents: Read."; exit 1; }
          [ -n "$APP_KEY" ] || { echo "::error::content-repository is '$REPO' but secrets.content-app-private-key is empty — see content-app-id."; exit 1; }
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}"   >> "$GITHUB_OUTPUT"
      - name: Mint a read token for the content repository
        id: content-token
        if: inputs.content-repository != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.content-app-id }}
          private-key: ${{ secrets.content-app-private-key }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          # Empty inputs fall through to the caller's own repo + commit — byte-identical to the
          # default checkout for every node repo; only the platform's CD points these elsewhere.
          repository: ${{ inputs.content-repository || github.repository }}
          ref: ${{ inputs.content-ref || github.sha }}
          token: ${{ steps.content-token.outputs.token || github.token }}
          fetch-depth: ${{ inputs.narrow-by-affected && '0' || '1' }}
      # 🚨 The CONTENT commit, not $GITHUB_SHA. They differ exactly when content-repository is set
      # (the platform baking Plugins), and the publication records the content's commit — the
      # bake-scope baseline is compared against it on the next run, so stamping the caller's sha
      # would make every narrowed bake fall back to a full one.
      - name: Resolve the content commit
        id: content
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve the bake image
        id: image
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          RELEASED_VERSION: ${{ github.event.client_payload.version }}
          RELEASED_SHA: ${{ github.event.client_payload.sha }}
          UPSTREAM_IMAGE: ${{ github.event.client_payload.image }}
          UPSTREAM_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.action }}" = "meshweaver-upstream-published" ]; then
            # A dependency republished for an identity: bake against THAT image, so this repo's
            # publication lands under the same identity its upstream just sealed. Never the pin
            # and never the tag — either could name a different framework than the upstream's.
            [ -n "${UPSTREAM_IMAGE:-}" ] || { echo "::error::meshweaver-upstream-published payload carries no client_payload.image — cannot know which framework the upstream '${UPSTREAM_SOURCE:-?}' was sealed for."; exit 1; }
            echo "ref=${UPSTREAM_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "woken by upstream '${UPSTREAM_SOURCE:-?}' publishing; baking against its image ${UPSTREAM_IMAGE}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${RELEASED_VERSION:-}" ]; then
            # The release's own identity tag (main-cd promote, phase A). A framework-release
            # dispatch without a resolvable image is a platform CD contract break — fail loudly
            # below, never fall back to the pinned digest (that would publish the OLD identity and
            # call it a re-bake).
            echo "ref=${TEST_IMAGE%%:*}:${RELEASED_VERSION}" >> "$GITHUB_OUTPUT"
            echo "baking against released ${RELEASED_VERSION} (${RELEASED_SHA:-sha unknown})"
          elif [ "${{ github.event.action }}" = "meshweaver-framework-released" ]; then
            echo "::error::meshweaver-framework-released payload carries no client_payload.version — cannot resolve the released image."
            exit 1
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${IMAGE_DIGEST:-}" ]; then
            # 🚨 An UPSTREAM-published wake, not a framework release. The upstream may have been
            # publishing for the caller's own pinned platform (its own push), in which case there
            # is no released version to bake against and the pin is exactly right: the identity the
            # gate just verified its upstreams against came from THIS image. Falling back here is
            # therefore the same identity, not an older one — the case the framework-release branch
            # above must never take.
            echo "ref=${TEST_IMAGE%%:*}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
            echo "woken by an upstream publication; baking against the pinned digest ${IMAGE_DIGEST}"
          elif [ -n "${IMAGE_DIGEST:-}" ]; then
            # tag@digest: the tag names the image, the digest pins the build (reproducible runs;
            # an image regression lands on the commit that bumps the pin).
            echo "ref=${TEST_IMAGE%%:*}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
            echo "baking against the pinned digest ${IMAGE_DIGEST}"
          elif [ "${{ inputs.allow-unpinned }}" = "true" ]; then
            echo "ref=${TEST_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "baking against ${TEST_IMAGE} verbatim (allow-unpinned — runs are not reproducible; pin a digest to change that)"
          else
            # Never a silent fallback: an unset pin without the explicit opt-in is a
            # provisioning error, not a mode.
            echo "::error::image-digest is empty and allow-unpinned is not set — pin a digest (reproducible) or opt in to following the tag."
            exit 1
          fi
      - name: Registry login mode
        id: acr
        env:
          ACR_MODE: ${{ (secrets.acr-username != '' && secrets.acr-password != '') && 'basic' || ((secrets.acr-username == '' && secrets.acr-password == '') && 'oidc' || 'half') }}
        run: |
          set -euo pipefail
          case "$ACR_MODE" in
            basic|oidc) echo "mode=$ACR_MODE" >> "$GITHUB_OUTPUT"; echo "registry login: $ACR_MODE" ;;
            *) echo "::error::acr-username and acr-password must BOTH be set (basic) or BOTH be empty (OIDC via the azure-* identity) — one without the other is a misconfiguration, not a mode."; exit 1 ;;
          esac
      - name: Azure login (OIDC) for the image pull
        if: steps.acr.outputs.mode == 'oidc'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      - name: Log in to the image registry (OIDC)
        if: steps.acr.outputs.mode == 'oidc'
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          set -euo pipefail
          host="${TEST_IMAGE%%/*}"
          az acr login --name "${host%%.*}" || { echo "::error::az acr login to ${host} failed under the OIDC identity — it needs AcrPull on that registry."; exit 1; }
      - name: Log in to the image registry
        if: steps.acr.outputs.mode == 'basic'
        env:
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          # 🚨 Bounded retry, and deliberately NOT a skip-trapdoor: after the last attempt this
          # still fails RED, and a CREDENTIAL rejection fails IMMEDIATELY rather than being retried
          # three times — retrying a 401 only delays the same red while hiding which kind of
          # failure it was.
          #
          # Everything else IS retried, including failures this does not recognise. That is the
          # intended default rather than an oversight: an unclassified docker login failure is far
          # more often transient (daemon not ready, DNS, TLS reset) than permanent, and the one
          # class known to be permanent — bad credentials — is carved out above. A positive
          # allow-list of "connection-level" strings would fail fast on the next transient error
          # nobody predicted, which is the failure mode this exists to remove.
          #
          # Three ACR logins failed on 2026-08-28 in two separate incidents an hour apart
          # ("dial tcp 51.12.25.80:443: connect: connection refused", registry healthy throughout),
          # reddening three REQUIRED checks across two repos. On a strict:true repo the cost is not
          # one re-run: the re-run lands against a moved main, the branch goes BEHIND, and it needs
          # another sync and another full run — so one TCP reset re-stales every open PR (#2570).
          for attempt in 1 2 3; do
            if echo "${{ secrets.acr-password }}" \
                 | docker login "${TEST_IMAGE%%/*}" -u "${{ secrets.acr-username }}" \
                     --password-stdin 2>login.err; then
              rm -f login.err
              exit 0
            fi
            cat login.err
            if grep -qiE 'unauthorized|authentication required|denied|401' login.err; then
              echo "::error::ACR rejected the credentials for ${TEST_IMAGE%%/*} — that is not a"\
                   "transient failure, so it is not retried. Check the acr-username/acr-password secrets."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::docker login to ${TEST_IMAGE%%/*} failed after 3 connection-level attempts."
          exit 1
      # ───────────────────── THE UPSTREAM GATE (#1755) ─────────────────────
      # A repo's build must not start until every upstream it depends on has a published artifact
      # for the TARGET framework. Otherwise it compiles and gates against an upstream that no
      # longer matches the framework it is building for: the publication comes out clean and the
      # verdict means nothing.
      #
      # The identity comes from the IMAGE, because that is the only place it exists — a framework
      # identity is a property of the shipped binaries, not of a tag or a commit. `mw-plugin-test
      # --print-framework-identity` resolves it without standing up a mesh (one container start).
      #
      # 🚨 EXIT, do not wait. Not a poll, not a bounded re-check, not a sleep in a runner: the job
      # ends immediately — no runner burned, no partial build, no false green — and is re-triggered
      # by the EVENT its upstream fires when it publishes (the `Notify dependent repos` step at the
      # end of this same workflow). That turns the platform's concurrent fan-out into a correct
      # topological order with no central scheduler: the roots have no upstreams, so they build and
      # publish; each publication wakes the repos that exited.
      #
      # 🚨 It exits RED, and that is deliberate. GitHub renders a skipped job with the same tick as
      # a passed one, so "upstreams not ready, did not build" must not be a grey skip or a silent
      # success — the exact trapdoor AGENTS.md forbids. A red here means "this repo has not been
      # rebuilt for this release yet", which is TRUE and is exactly what an operator needs to see.
      # The canonical scripts, fetched BEFORE the gate because the gate is what decides whether the
      # bake runs at all. Same sparse checkout as the publish-side fetch further down, into its own
      # path: it carries no root index.json, so the tester never treats it as a module (identical
      # reasoning to `cross-repo-stage/`).
      - name: Fetch the canonical gate + bake-scope scripts (platform repo)
        if: inputs.upstream-sources != '' || inputs.narrow-by-affected
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: mw-platform-gate
          sparse-checkout: .github/scripts
      # A SECOND login, deliberately: the gate must authenticate before a bake that can run 40
      # minutes, and the publish side re-logs in afterwards rather than relying on a token minted
      # before it. Two cheap OIDC exchanges beat one that can expire mid-job.
      - name: Azure login for the gate / scope decision (OIDC)
        if: inputs.upstream-sources != '' || inputs.narrow-by-affected
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      # Needed by BOTH the upstream gate and the scope decision: a publication is keyed by
      # framework identity, so "what is already published" is unanswerable without it — and the
      # identity is a property of the shipped BINARIES, so only the image can report it.
      - name: "Resolve the framework identity this bake will target"
        if: inputs.upstream-sources != '' || inputs.narrow-by-affected
        id: identity
        run: |
          set -euo pipefail
          # `--init` so a crashed tester exits instead of spinning as an unkillable PID 1 (#1741);
          # this step would otherwise hang the job on a one-line diagnostic.
          line=$(docker run --rm --init --entrypoint /app/mw-plugin-test "${{ steps.image.outputs.ref }}" \
            --print-framework-identity)
          identity="${line#*identity=}"
          identity="${identity%% *}"
          if [ -z "$identity" ]; then
            echo "::error::could not resolve a framework identity from the bake image (got: '$line'). Availability CANNOT BE DETERMINED, which is not clearance to build."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "this bake targets framework identity $identity"
      - name: "Gate: every upstream must be published for that identity"
        if: inputs.upstream-sources != ''
        env:
          BAKE_PUBLISH_TARGETS: ${{ inputs.bake-publish-targets }}
          UPSTREAMS: ${{ inputs.upstream-sources }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          if mw-platform-gate/.github/scripts/check-release-availability.sh \
               --identity "${{ steps.identity.outputs.identity }}" $UPSTREAMS; then
            echo "every upstream is published for ${{ steps.identity.outputs.identity }} — building."
            exit 0
          fi
          {
            echo "### ⛔ Upstreams not ready — did NOT build"
            echo ""
            echo "This repo depends on \`$UPSTREAMS\`, and at least one of them has no sealed"
            echo "publication for framework identity \`${{ steps.identity.outputs.identity }}\`."
            echo "Building anyway would gate this repo's content against an upstream that does not"
            echo "match the framework it is being built for."
            echo ""
            echo "**Nothing to do — if this repo has the \`schedule\` trigger.** The next"
            echo "scheduled run re-reads the released image and rebuilds once the upstream has"
            echo "published. Nothing wakes this repo otherwise: the dependent-dispatch lane was"
            echo "removed deliberately (no cross-repo write credential), so a repo WITHOUT the"
            echo "schedule stays behind here silently."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstreams not ready — did not build::at least one upstream of this repo has no published artifact for framework identity ${{ steps.identity.outputs.identity }}; exiting without building. The upstream's own publication re-triggers this run."
          exit 1
      # ───────────────────── WHAT MUST ACTUALLY BE REBUILT (#1707) ─────────────────────
      # "When updating plugins, we should check from git history which modules are affected, and
      # we should rebuild only these."
      #
      # 🚨 IT RUNS BEFORE STAGING, and that ordering is load-bearing: the staged cross-repo module
      # dirs are copied INTO the caller's checkout, and scripts/affected-modules.py discovers
      # modules as "top-level dirs carrying an index.json". Deciding after staging would have the
      # selector treat another repo's packages as this repo's, changing the dependency graph it
      # derives the closure from.
      #
      # The decision is biased to FULL — see bake-scope.sh, where every fallback names itself in
      # the log and the job summary. Narrowing is the shape that produces a silent under-build, so
      # "cannot answer safely" and "nothing to do" must never be the same answer.
      - name: Decide the bake scope (affected modules since the published baseline)
        if: inputs.narrow-by-affected
        id: scope
        env:
          BAKE_PUBLISH_TARGETS: ${{ inputs.bake-publish-targets }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          SOURCE: ${{ inputs.bake-source }}
          HEAD_SHA: ${{ github.sha }}
          REPO_DIR: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          STATE_DIR: ${{ runner.temp }}/bake-scope
        run: mw-platform-gate/.github/scripts/bake-scope.sh
      # Same staging the caller's gate does, for the same reason: cross-repo `requires` must
      # resolve for the package roots to bind.
      # 🚨 A PAT here was a permanent two-way failure. It rots — the platform's own copy went
      # HTTP 401 and a daily check never ran once (#1709) — and, because GitHub hands a
      # dependabot-triggered run the DEPENDABOT secret store rather than the Actions one, a PAT
      # provisioned for normal runs left every dependabot PR in every satellite permanently RED
      # (#2249). An installation token is minted here, per run, scoped to stage-repo alone.
      - name: Resolve the stage repo's owner and name
        id: stage-repo-parts
        if: inputs.stage-modules != ''
        env:
          STAGE_REPO: ${{ inputs.stage-repo }}
        run: |
          set -euo pipefail
          echo "owner=${STAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${STAGE_REPO##*/}"  >> "$GITHUB_OUTPUT"
      - name: Mint an installation token for the stage repo
        id: stage-token
        if: inputs.stage-modules != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.stage-repo-app-id }}
          private-key: ${{ secrets.stage-repo-app-private-key }}
          owner: ${{ steps.stage-repo-parts.outputs.owner }}
          repositories: ${{ steps.stage-repo-parts.outputs.name }}
          permission-contents: read
      - name: Stage cross-repo modules
        if: inputs.stage-modules != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.stage-repo }}
          token: ${{ steps.stage-token.outputs.token }}
          path: cross-repo-stage
          sparse-checkout: ${{ inputs.stage-modules }}
      - name: Set up Node for the pre-bake hook
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Pre-bake hook
        if: inputs.pre-bake-script != ''
        run: ${{ inputs.pre-bake-script }}
      - name: Download this run's module-bundle artifacts
        if: inputs.module-artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.module-artifacts }}
          path: ${{ runner.temp }}/ext-bundles
          merge-multiple: true
      # 🚨 EXTERNAL MODULES (#2541): the tester image ships no modules since #2276, so a module a
      # NodeType binds must be handed in explicitly. Every failure here is RED and NAMED — a bake
      # that quietly ran without a module it needed blames the CONTENT (CS0246), which is exactly
      # the misdiagnosis that froze the fleet on 2026-08-28.
      - name: "External modules: assemble what the compile surface must compose"
        if: inputs.module-artifacts != '' || inputs.registry-modules != ''
        env:
          REGISTRY_MODULES: ${{ inputs.registry-modules }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_KEY: ${{ secrets.registry-key }}
          SEAL_UPSTREAMS: ${{ inputs.upstream-sources }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          EXT="${RUNNER_TEMP:-/tmp}/ext-modules"; mkdir -p "$EXT"; chmod 777 "$EXT"
          BUNDLES="${RUNNER_TEMP:-/tmp}/ext-bundles"; mkdir -p "$BUNDLES"
          if [ -n "${REGISTRY_MODULES:-}" ]; then
            if [ -n "${SEAL_UPSTREAMS:-}" ]; then
              # 🚨 The publication is the unit of consistency (MeshWeaver#2698): module bytes come
              # from the SEALED upstream publication for this identity, never the registry's
              # package endpoint. No fallback — a missing seal or module set is RED in the script.
              [ -n "${REGISTRY_URL:-}" ] || { echo "::error::upstream-sources is set but registry-url is empty — the bake reads sealed module sets from the registry."; exit 1; }
              mw-platform-gate/.github/scripts/compose-sealed-modules.sh --identity "$IDENTITY" --packages "$REGISTRY_MODULES" \
                --upstreams "$SEAL_UPSTREAMS" --out "$BUNDLES" --registry-url "$REGISTRY_URL" --registry-key "$REGISTRY_KEY"
            else
              echo "::notice::composing registry-modules ($REGISTRY_MODULES) from the REGISTRY's package endpoint: this repo declares no upstream seed, so there is no sealed publication to take module bytes from. These bytes are whatever the module's own lane published last — a bake-consumption decline against a publication that composed different ones is expected, and is the reason to declare the upstream (upstream-seed / upstream-sources) instead."
            for pkg in ${REGISTRY_MODULES:-}; do
              idx=$(curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" "$REGISTRY_URL/api/plugins/bundles/index.json") \
                || { echo "::error::registry index unreadable at $REGISTRY_URL (registry-modules: $pkg)"; exit 1; }
              ver=$(jq -r --arg p "$pkg" '(.bundles // .Bundles // [])[] | select(((.plugin // .Plugin)|ascii_downcase)==($p|ascii_downcase)) | (.version // .Version)' <<<"$idx" | head -1)
              [ -n "$ver" ] || { echo "::error::the registry at $REGISTRY_URL does not advertise package '$pkg' to this instance key — check the key's grants, and that the upstream wave has published the bundle."; exit 1; }
              curl -fsS -H "Authorization: Bearer $REGISTRY_KEY" -o "$BUNDLES/$pkg.bundle.zip" "$REGISTRY_URL/api/plugins/bundles/$pkg/$ver" \
                || { echo "::error::download failed for $pkg@$ver from $REGISTRY_URL"; exit 1; }
              echo "fetched $pkg@$ver from $REGISTRY_URL"
            done
            fi
          fi
          shopt -s nullglob
          MODULE_ARGS=""
          for b in "$BUNDLES"/*.nupkg "$BUNDLES"/*.zip; do
            u="${RUNNER_TEMP:-/tmp}/unpack-$(basename "$b")"; rm -rf "$u"; mkdir -p "$u"
            unzip -o -q "$b" -d "$u"
            name=""
            [ -f "$u/meshweaver/manifest.json" ] && name=$(jq -r '.module.assemblyName // empty' "$u/meshweaver/manifest.json")
            if [ -z "$name" ]; then
              set -- "$u"/meshweaver/modules/*.dll
              { [ $# -eq 1 ] && [ -f "$1" ]; } || { echo "::error::$(basename "$b"): cannot identify the module's entry assembly (no manifest module.assemblyName; meshweaver/modules/ holds $# dll(s))"; exit 1; }
              name=$(basename "$1" .dll)
            fi
            test -f "$u/meshweaver/modules/$name.dll" || { echo "::error::$(basename "$b"): meshweaver/modules/$name.dll is missing from the bundle"; exit 1; }
            mkdir -p "$EXT/$name"
            cp -R "$u"/meshweaver/modules/. "$EXT/$name/"
            MODULE_ARGS="$MODULE_ARGS --module /ext/$name/$name.dll"
            echo "external module composed: $name ($(basename "$b"))"
            # 🚨 The bytes this bake composes are the bytes its publication SEALS (modules/<pkg>.module.nupkg,
            # MeshWeaver#2698): a consumer pinned to this identity composes exactly these, never the
            # registry's. Keyed by PACKAGE id, which is what a consumer asks for (registry-modules).
            # The package id is the manifest's `plugin` (ModulePackCommand writes it); the file name
            # is only the fallback for a hand-built bundle, and then the VERSION is stripped from the
            # right so a package id that itself contains dots (Markdown.Collaboration) survives.
            pkg=""
            [ -f "$u/meshweaver/manifest.json" ] && pkg=$(jq -r '.plugin // empty' "$u/meshweaver/manifest.json")
            if [ -z "$pkg" ]; then
              stem="$(basename "$b")"; stem="${stem%.module.nupkg}"; stem="${stem%.bundle.zip}"; stem="${stem#MeshWeaver.Plugin.}"
              pkg=$(printf '%s' "$stem" | sed -E 's/\.[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.+-]*)?$//')
            fi
            [ -n "$pkg" ] || { echo "::error::$(basename "$b"): cannot derive the package id this bundle seals under — no manifest plugin id, and the file name is not MeshWeaver.Plugin.<pkg>.<version>.module.nupkg / <pkg>.bundle.zip / <pkg>.module.nupkg"; exit 1; }
            SEAL="${RUNNER_TEMP:-/tmp}/seal-modules"; mkdir -p "$SEAL"
            cp "$b" "$SEAL/$(printf '%s' "$pkg" | tr '[:upper:]' '[:lower:]').module.nupkg"
            echo "sealing $name as module package '$pkg'"
          done
          [ -n "$MODULE_ARGS" ] || { echo "::error::external modules were requested but none were assembled — the artifact pattern matched nothing and no registry bundle was fetched."; exit 1; }
          echo "EXT_MODULES_DIR=$EXT" >> "$GITHUB_ENV"
          echo "EXT_MODULE_ARGS=$MODULE_ARGS" >> "$GITHUB_ENV"
          echo "SEAL_MODULES_DIR=${RUNNER_TEMP:-/tmp}/seal-modules" >> "$GITHUB_ENV"
      - name: Bake (compiler --output), then gate a mesh against it (--seed)
        # scope=none means the decision above VERIFIED that this exact content is already sealed
        # for this framework identity at every target — a positive finding, logged with both
        # shas, not an input-shaped skip. Everything downstream is skipped with it.
        if: steps.scope.outputs.scope != 'none'
        env:
          STAGE_MODULES: ${{ inputs.stage-modules }}
          ALLOW_FILE: ${{ inputs.allow-file }}
          BAKE_SCOPE: ${{ steps.scope.outputs.scope || 'full' }}
          BAKE_MODULES: ${{ steps.scope.outputs.mount }}
        run: |
          set -euo pipefail
          # The mount the tester sees: the checkout, unless the pre-bake hook built its own
          # (BAKE_MOUNT_DIR via $GITHUB_ENV — Education's package snapshot). When the hook owns
          # the mount it owns its composition too, so staged modules are only auto-copied into
          # the plain checkout (cross-repo-stage/ itself has no root index.json, so the tester
          # never treats it as a module; only the copied module dirs count).
          REPO_MOUNT="${BAKE_MOUNT_DIR:-$GITHUB_WORKSPACE}"
          if [ -z "${BAKE_MOUNT_DIR:-}" ]; then
            for m in ${STAGE_MODULES:-}; do
              cp -R "$GITHUB_WORKSPACE/cross-repo-stage/$m" "$GITHUB_WORKSPACE/"
            done
          fi
          # 🎯 THE MOUNT IS THE FILTER. mw-plugin-test gates and bakes every package it discovers
          # under /repo and takes no module list, so a narrowed bake is a narrowed MOUNT — exactly
          # the seam the PR gate already uses (ci.yml `test-repos`). The set is
          # affected + transitive dependents + THEIR dependencies, dependencies-first, because the
          # tester's mesh installs what it mounts and a package whose `requires` is absent never
          # activates. (narrow-by-affected and pre-bake-script are mutually exclusive — asserted in
          # preflight — so BAKE_MOUNT_DIR and a narrowed stage can never both be in play.)
          if [ "$BAKE_SCOPE" = "narrowed" ]; then
            NARROW="${RUNNER_TEMP:-/tmp}/bake-stage"
            mkdir -p "$NARROW"
            for m in $BAKE_MODULES; do cp -R "$GITHUB_WORKSPACE/$m" "$NARROW/"; done
            for m in ${STAGE_MODULES:-}; do
              # An `A && B` list whose test fails would abort the step under `set -e`.
              name=$(basename "$m")
              if [ -d "$GITHUB_WORKSPACE/$name" ]; then
                cp -R "$GITHUB_WORKSPACE/$name" "$NARROW/"
              fi
            done
            if [ -n "${ALLOW_FILE:-}" ] && [ -f "$GITHUB_WORKSPACE/$ALLOW_FILE" ]; then
              mkdir -p "$NARROW/$(dirname "$ALLOW_FILE")"
              cp "$GITHUB_WORKSPACE/$ALLOW_FILE" "$NARROW/$ALLOW_FILE"
            fi
            REPO_MOUNT="$NARROW"
            echo "narrowed bake: $BAKE_MODULES"
          else
            echo "full bake: every module in the checkout"
          fi
          BAKE="${RUNNER_TEMP:-/tmp}/bake"
          mkdir -p "$BAKE"
          # The image's tester runs as a non-root user; the bind-mounted bake dir must be
          # writable for it.
          chmod 777 "$BAKE"
          ALLOW_ARGS=()
          [ -n "${ALLOW_FILE:-}" ] && ALLOW_ARGS=(--allow "/repo/${ALLOW_FILE}")
          # `--init` for the same reason as the gate's run (#1741): as a container's PID 1 the
          # tester cannot be killed by the SIGABRT its own runtime raises on a crash — the kernel
          # discards the signal (SIGNAL_UNKILLABLE) and the process spins at 100% CPU instead of
          # exiting. Under tini it is PID 2 and a crash exits 134 at once.
          # ══ 1. THE BAKE — compiler-driven, NO MESH ANYWHERE IN IT (#2064) ══════════════════
          # 🚨 This used to be ONE fused run: `… /repo --bake-output /bake`, which stood up an
          # in-process mesh and let the MESH compile every NodeType. Producing an assembly is a
          # BUILD step; the mesh's job is to CONSUME a bake, not to be the thing that makes one.
          # The fused shape also activates hubs to produce bytes nothing has adopted yet, which is
          # where it crashes. #2064 split the platform's own two lanes (dotnet-test.yml's PR lane
          # and main-cd.yml's publish-bake) and held the pair in bake-then-gate.sh so they could
          # not drift — this reusable lane was the one caller left on the old shape, so every node
          # repo (Plugins, Education, Reinsurance, SocialMedia) still baked through a mesh.
          EXT_V=()
          [ -n "${EXT_MODULES_DIR:-}" ] && EXT_V=(-v "$EXT_MODULES_DIR:/ext")
          # shellcheck disable=SC2086  # EXT_MODULE_ARGS is a flag list built above; word-splitting is the point
          docker run --rm --init "${EXT_V[@]}" -v "$REPO_MOUNT:/repo" -v "$BAKE:/bake" \
            --entrypoint /app/mw-plugin-test "${{ steps.image.outputs.ref }}" compile /repo \
            "${ALLOW_ARGS[@]}" ${EXT_MODULE_ARGS:-} \
            --output /bake --source-sha "${{ steps.content.outputs.sha }}"

          # ══ 2. THE GATE — a mesh, CONSUMING the bake above ═════════════════════════════════
          # Strictly stronger than the fused form as a gate: fused, the mesh rendered and ran
          # `Tests` against a PRIVATE recompile — bytes nothing ever ships. Seeded, it exercises
          # the very assemblies this lane is about to publish, which are the ones a portal adopts.
          # shellcheck disable=SC2086
          docker run --rm --init "${EXT_V[@]}" -v "$REPO_MOUNT:/repo" -v "$BAKE:/bake" \
            --entrypoint /app/mw-plugin-test "${{ steps.image.outputs.ref }}" /repo \
            "${ALLOW_ARGS[@]}" ${EXT_MODULE_ARGS:-} \
            --seed /bake
          # The module set this bake composed travels WITH the publication (publish-bake-bundles.sh
          # writes modules/_index from it). A bake that composed nothing seals an empty set — a
          # consumer can tell "composed nothing" from "predates module sealing".
          mkdir -p "$BAKE/modules"
          if [ -n "${SEAL_MODULES_DIR:-}" ] && [ -d "$SEAL_MODULES_DIR" ]; then
            cp "$SEAL_MODULES_DIR"/*.module.nupkg "$BAKE/modules/"
            echo "module set to seal: $(ls "$BAKE/modules" | tr '\n' ' ')"
          fi
          # Postcondition, not a hope: a green tester that wrote no identity is a bake-stage
          # regression (or an image predating --bake-output support).
          if [ ! -s "$BAKE/framework-mvid.txt" ]; then
            echo "::error::the tester ran green but wrote no bake identity ($BAKE/framework-mvid.txt) — the bake stage regressed (or the image predates --bake-output support)."
            exit 1
          fi
          # 🚨 LOUD, never silent: staged modules were brought in only so the requires resolve —
          # they are OWNED and published by the stage repo. Publishing them from here too would
          # seed the same package from two sources.
          for m in ${STAGE_MODULES:-}; do
            name=$(basename "$m")
            if [ -f "$BAKE/$name.zip" ]; then
              rm "$BAKE/$name.zip"
              echo "excluded from publication: $name.zip (owned by ${{ inputs.stage-repo }} — staged here only to resolve the packages' requires)"
            fi
          done
          echo "BAKE_DIR=$BAKE" >> "$GITHUB_ENV"
          echo "baked identity: $(cat "$BAKE/framework-mvid.txt")"
          echo "baked bundles:"; ls -l "$BAKE"/*.zip
      - name: Azure login (OIDC)
        if: steps.scope.outputs.scope != 'none'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
      # The CANONICAL script — one home, next to the ShippedPrebuiltBundles constants its
      # `_complete` sentinel must keep matching. Checked out after the bake so it never sits in
      # the tester's /repo mount. Public repo: the default token reads it from any caller.
      - name: Fetch the canonical publish script (platform repo)
        if: steps.scope.outputs.scope != 'none'
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver
          ref: ${{ inputs.platform-ref }}
          path: mw-platform
          sparse-checkout: .github/scripts
      # ───────────── KEEP THE PUBLICATION COMPLETE (the reason the bake used to be full) ─────────────
      # A narrowed bake wrote bundles only for what it rebuilt. The publish below uploads exactly
      # the local bundle set and seals a `_complete` listing exactly it — and a portal seeds only
      # what that sentinel lists. So publishing the delta would not ADD bundles, it would REPLACE
      # the sentinel and shrink what every portal adopts, silently putting every other module back
      # to compiling at boot.
      #
      # This step re-hydrates every bundle the sealed publication lists that this bake did not
      # produce, so the publish script runs COMPLETELY UNCHANGED over a full set and the resulting
      # publication is indistinguishable from a full bake's. A bundle that can neither be rebuilt
      # nor fetched is FATAL here — the alternative is publishing less than is published today,
      # which is the silent failure this whole lane exists to remove. Nothing has been written at
      # that point, so the existing publication stays sealed and intact.
      - name: Carry forward the bundles this bake did not rebuild
        if: steps.scope.outputs.scope == 'narrowed'
        run: >
          mw-platform/.github/scripts/carry-forward-bundles.sh
          "$BAKE_DIR"
          "${{ runner.temp }}/bake-scope/published-bundles.txt"
          "$BAKE_CARRY_TARGET"
          "${{ steps.identity.outputs.identity }}"
          "${{ inputs.bake-source }}"
      - name: Publish bundles to every portal target
        id: publish
        if: steps.scope.outputs.scope != 'none'
        env:
          BAKE_PUBLISH_TARGETS: ${{ inputs.bake-publish-targets }}
        # Contract: layout <base>/prebuilt-bundles/<framework-identity>/<source>/<bundle>.zip,
        # every bundle first, the `_complete` sentinel strictly LAST; an already-sealed identity
        # with the same source sha skips (the surface identity is breaking-change-keyed, so
        # internal platform merges re-resolve the SAME identity and the re-publish is a no-op by
        # design).
        run: |
          set -euo pipefail
          mw-platform/.github/scripts/publish-bake-bundles.sh "$BAKE_DIR" "${{ inputs.bake-source }}" "${{ steps.content.outputs.sha }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          {
            echo "### 📦 CI bake published"
            echo "- identity: \`$(cat "$BAKE_DIR/framework-mvid.txt")\`"
            echo "- source: \`${{ inputs.bake-source }}\`  targets: \`${BAKE_PUBLISH_TARGETS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ────────────────── NO DEPENDENT DISPATCH: the wave is PULLED ──────────────────
      # This used to POST an upstream-published event to repos named by `dependent-repos`,
      # using a token with write access to each of them. Both are gone.
      #
      # A publication is a FACT about the registry, not a message a publisher owes its readers.
      # memex.meshweaver.cloud is the one source of truth for what is released and what is sealed;
      # a dependent repo's SCHEDULED run reads it and rebuilds if it must. Pull, not push — so no
      # cross-repo credential exists to leak, no hand-maintained dependents list can silently omit
      # a repo, and a repo that stops rebuilding surfaces as an instance HELD on its own
      # UpdatePolicy (naming the bundles and the identity) rather than as nothing at all.
      #
      # 🚨 A caller that relies on this MUST have the `schedule` trigger. Without it the repo only
      # ever bakes against its pin on its own pushes, never against the released image, and the
      # fleet stays a release behind with everything green.

      - name: Nothing to bake (this content is already sealed for this identity)
        if: steps.scope.outputs.scope == 'none'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
        run: |
          set -euo pipefail
          echo "no bake, no publish: $REASON"
          echo "published baseline: $BASELINE   head: ${{ steps.content.outputs.sha }}   identity: ${{ steps.identity.outputs.identity }}"
          echo "This is a VERIFIED outcome, not a skipped gate: the sealed publication was read from"
          echo "every target in BAKE_PUBLISH_TARGETS and compared against this commit's content."

  # ────────────────── DISPATCH DEPENDENTS (the package-publish half of the wave) ──────────────────
  # "otherwise only dependent packages — then publish package built and cascade recursively"
  # (maintainer, 2026-08-29). A platform release rebuilds EVERYTHING (the platform's CD sends
  # meshweaver-framework-released to every installed repo); a package publish wakes ONLY the repos
  # that declare this source as an upstream, against the SAME image, and each of those emits the
  # same event for its own source after it publishes — recursion by construction, terminated by the
  # chain carried in the payload.
  #
  # Dependents are DISCOVERED, never listed: every repo the dispatch App is installed on is asked
  # for its .github/workflows/ci.yml, and a repo depends on this source iff that file declares it
  # under `upstream-sources:` or `upstream-seed:`. Installing the App on a new node repo is the
  # whole subscription. A repo with no ci.yml, or one that does not name this source, is skipped
  # and SAID so — silence is not a skip.
  #
  # 🚨 A failed dispatch is RED, not a warning. "The next own push re-bakes it" is precisely the
  # silent-drift shape the maintainer is removing; a dependent that was not told is a dependent
  # that is out of date, and this job's summary must say which one.
  dispatch-dependents:
    name: Dispatch dependents (meshweaver-upstream-published)
    needs: publish-bake
    if: >-
      inputs.dispatch-dependents && needs.publish-bake.result == 'success'
      && needs.publish-bake.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Preflight: the dispatch credential must be provisioned"
        env:
          APP_ID: ${{ secrets.dispatch-app-id }}
          APP_KEY: ${{ secrets.dispatch-app-private-key }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${APP_ID:-}" ]  || missing+=("dispatch-app-id (secret) — a GitHub App installed on every dependent repo, Contents: Read + Write")
          [ -n "${APP_KEY:-}" ] || missing+=("dispatch-app-private-key (secret) — that App's private key, PEM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::dispatch-dependents is on but its credential is not provisioned — a publish that wakes nobody is silent drift:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
      - name: Mint an installation token for the dependents
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.dispatch-app-id }}
          private-key: ${{ secrets.dispatch-app-private-key }}
          owner: ${{ github.repository_owner }}
      - name: Dispatch to every installed repo that declares this source as an upstream
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE: ${{ inputs.bake-source }}
          IMAGE: ${{ needs.publish-bake.outputs.image }}
          IDENTITY: ${{ needs.publish-bake.outputs.identity }}
          CHAIN_IN: ${{ toJSON(github.event.client_payload.chain) }}
          RELEASED_VERSION: ${{ github.event.client_payload.version }}
          RELEASED_SHA: ${{ github.event.client_payload.sha }}
          SELF: ${{ inputs.content-repository || github.repository }}
        run: |
          set -euo pipefail
          # The chain: every source that led here, plus this one. A repo whose own bake-source is
          # already in it is never dispatched — that is the cycle guard, and it needs no registry.
          chain=$(jq -cn --argjson in "${CHAIN_IN:-null}" --arg s "$SOURCE" '(if ($in|type)=="array" then $in else [] end) + [$s]')
          echo "source=$SOURCE image=$IMAGE identity=${IDENTITY:-?} chain=$chain"
          repos=$(gh api --paginate /installation/repositories --jq '.repositories[].full_name')
          [ -n "$repos" ] || { echo "::error::the dispatch App is installed on NO repository — nothing can subscribe. Install it on the dependent repos."; exit 1; }
          # A receiver's own gate wants the bare digest (its image-digest input); the bake wants
          # the full reference. Carry both — the digest is the part after '@' when the image was
          # resolved by digest, empty when it was a tag (then the receiver resolves it itself).
          digest=""; case "$IMAGE" in *@sha256:*) digest="${IMAGE#*@}" ;; esac
          payload=$(jq -cn --arg s "$SOURCE" --arg i "$IMAGE" --arg d "$digest" --arg id "${IDENTITY:-}" --argjson c "$chain" \
            --arg v "${RELEASED_VERSION:-}" --arg sha "${RELEASED_SHA:-}" \
            '{source:$s, image:$i, digest:$d, identity:$id, chain:$c, version:$v, sha:$sha}')
          dispatched=(); skipped=(); failed=()
          for repo in $repos; do
            if [ "$repo" = "$SELF" ]; then continue; fi
            # A missing ci.yml is a designed skip (404, said so); ANY other failure to read it is
            # RED — a transient API error must never read as "this repo has no CI", because that
            # is exactly a dependent silently left out of the wave.
            err="$RUNNER_TEMP/ci-read.err"
            if ! resp=$(gh api "repos/$repo/contents/.github/workflows/ci.yml" 2>"$err"); then
              if grep -q "HTTP 404" "$err"; then skipped+=("$repo (no .github/workflows/ci.yml)"); continue; fi
              failed+=("$repo (could not read its ci.yml: $(tr '\n' ' ' <"$err" | head -c 200))"); continue
            fi
            ci=$(jq -r '.content' <<<"$resp" | base64 -d)
            own=$(printf '%s\n' "$ci" | sed -nE 's/^[[:space:]]*bake-source:[[:space:]]*//p' | head -1 | sed -E 's/["'"'"']//g; s/[[:space:]]+$//')
            if [ -n "$own" ] && jq -e --arg o "$own" 'index($o) != null' <<<"$chain" >/dev/null; then
              skipped+=("$repo (its source '$own' is already in the chain — cycle guard)"); continue
            fi
            if ! printf '%s\n' "$ci" | grep -Eq "^[[:space:]]*(upstream-sources|upstream-seed):[[:space:]]*.*(^|[[:space:],\"'])${SOURCE}([[:space:],\"']|$)"; then
              skipped+=("$repo (does not declare upstream '$SOURCE')"); continue
            fi
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "$(jq -cn --argjson p "$payload" '{event_type:"meshweaver-upstream-published", client_payload:$p}')") || code=000
            case "$code" in
              2*) dispatched+=("$repo") ;;
              *)  failed+=("$repo (HTTP $code: $(head -c 200 /tmp/resp | tr '\n' ' '))") ;;
            esac
          done
          {
            echo "### 📣 upstream '$SOURCE' published — dependents dispatched"
            echo "- image: \`$IMAGE\`  identity: \`${IDENTITY:-?}\`  chain: \`$chain\`"
            for r in "${dispatched[@]}"; do echo "- ✅ $r"; done
            for r in "${skipped[@]}";    do echo "- ⏭️ $r"; done
            for r in "${failed[@]}";     do echo "- ❌ $r"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "${dispatched[@]}"; do echo "dispatched: $r"; done
          for r in "${skipped[@]}";    do echo "skipped:    $r"; done
          if [ ${#failed[@]} -gt 0 ]; then
            for r in "${failed[@]}"; do echo "::error::dispatch failed: $r"; done
            exit 1
          fi
          echo "dependents dispatched: ${#dispatched[@]}"
