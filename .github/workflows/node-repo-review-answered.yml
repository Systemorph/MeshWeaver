name: Node repo review answered (reusable)

# ♻️ REUSABLE (workflow_call) — core's `Automatic review answered` gate, offered to every other
# repository in the fleet as ONE copy (MeshWeaver#4776, step 1 of 3).
#
# 🚨 WHY. Core holds a pull request while the automatic review is missing or any thread it opened
# has no human reply (review-answered.yml, required on ruleset 2128472). NO other repository does,
# and measured 2026-09-19 over the last 20 merges of six repositories, 55 of 120 merged past
# unanswered findings — N of N every time, never a partial. Of 13 such findings treated on
# 2026-09-18, 11 were real. Doc/Architecture/ReviewFindingsAnswered carries the measurement.
#
# 🚨 WHY A LANE AND NOT A COPY. The predicate (check-review-answered.py) is ~900 lines with its own
# self-test, a settle wait for the burst of review-comment events and a bounded wait for the review
# itself — each derived from a measurement (#4649, #4575). Six hand-copies is how gen-manifests.py
# reached five vintages (#1426). So the predicate is FETCHED here at `scripts-ref`, its identity
# asserted, its self-test run on EVERY call, and it is never fallen back to a local copy.
#
# 🚨 THE REVIEWER-UNAVAILABLE DEGRADATION (MeshWeaver.Feedback#86) comes with the predicate: a
# caller whose pinned sha includes it releases the review condition when the head carries the
# internal reviewer App's neutral "Reviewer unavailable" `internal-review` check run. What does NOT
# come with the lane is the re-evaluation when that check run completes — a `check_run` run lands
# on the default branch, so it cannot publish this context; core's
# review-answered-on-degradation.yml re-runs the gate instead, and a caller that needs the same adds
# that listener naming its own caller workflow.
#
# 🚨 AN API OUTAGE IS NOT A VERDICT (MeshWeaver#7187). A rate-limit 403/429, a secondary limit or a
# 5xx is retried inside the job (MW_API_OUTAGE_WAIT_MINUTES) and, past that, the job fails the marker
# step "API outage: no verdict was taken (retried automatically)" instead of reading as an
# unanswered review. What re-runs such a run LATER is a separate listener the caller adds beside this
# one — node-repo-review-answered-retry.yml (its header carries the thin caller). WITHOUT it, an
# outage red in that repository still needs a person's re-run, exactly as before — but it now says
# so, by name, rather than reading as an unanswered thread.
#
# 🚦 THE ROLLOUT ORDER IS NOT OPTIONAL, and this lane is only its first step:
#   1. this lane lands in core (observe-only by construction — it changes no protection);
#   2. a repository adds the thin caller below — OBSERVE-ONLY, i.e. NOT a required context yet —
#      and its row in .github/lane-caller-grants.yml lands in core FIRST (as `pending:`), because
#      every satellite asserts its roster row against core's main;
#   3. only after the context `review-answered / Automatic review answered` has been SEEN published
#      on live pull requests in that repository does the maintainer add it to protection. Under
#      CLASSIC protection (five satellites) an absent required context blocks every pull request
#      forever ("Expected — Waiting for status to be reported", measured on Plugins#1453), so
#      adding the context before the caller publishes bricks the repository, including the pull
#      request that would add the caller. Step 3 is a branch-protection edit: the maintainer's act.
#
# Caller contract — a SEPARATE workflow file (never ci.yml: it needs review events, and ci.yml's
# `pull_request` path filters / cancel rules must not apply to it):
#
#   # .github/workflows/review-answered.yml
#   name: Review answered
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
#     pull_request_review:
#       types: [submitted, dismissed]
#     pull_request_review_comment:
#       types: [deleted]          # NOT `created` — see "ONE RUN PER REPLY" below
#   permissions:
#     contents: read
#     pull-requests: read
#     issues: read
#     checks: read
#   concurrency:
#     group: review-answered-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request_review_comment' && 'feedback' || 'gate' }}
#     cancel-in-progress: false
#   jobs:
#     review-answered:
#       uses: Systemorph/MeshWeaver/.github/workflows/node-repo-review-answered.yml@<40-char core sha>
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#         checks: read
#         actions: write     # the `refresh` job only — see "THE SELF-REFRESH" below
#       with:
#         scripts-ref: <the SAME 40-char core sha>
#
# 🚨 ONE RUN PER REPLY (MeshWeaver#7187). A reply to a finding raises BOTH `pull_request_review:
# submitted` and `pull_request_review_comment: created`, in the same second — every review comment
# belongs to a review. Listening to both judged every reply twice (each judgement spends REST calls on
# the caller's 1,000/hour `github.token` budget), so a burst of 27 replies on core #7180 started ~60
# runs and the installation's budget ran out. Measured on core 2026-10-30: 232 of 232 comment runs had
# a same-head review run within 15 s. So the caller listens to `created` NOT AT ALL; `deleted` stays,
# because a reply going raises no review event and can make a thread unanswered again. The predicate's
# self-test asserts this contract and core's caller (`review_comment_trigger_types`).
#
# ⏳ OPT-IN: PENDING WHILE ANSWERING (policy review-pending-while-answering). With the default empty
# `verdict-check-run` the lane behaves exactly as before. To have the context read PENDING (not red)
# while threads await answers, the caller changes three things together, and its roster row lands in
# core first (as `pending:`):
#       schedule:                               # under `on:` — the sweep that re-judges pending verdicts
#         - cron: "4,19,34,49 * * * *"
#       permissions: … checks: write …          # on the `uses:` job (the verdict check-run is written)
#       with:
#         verdict-check-run: review-answered / Automatic review answered   # EXACTLY as protection lists it
# Core opts its own `lane` job in, so the path is exercised on live pull requests there first.
#
# 🛡️ What the caller must NOT add (each is a skip-trapdoor — a skipped required context counts as
# SATISFIED under both classic protection and rulesets):
#   * no job-level `if:` — in particular NOT core's `github.actor != 'dependabot[bot]'`: only core has
#     a merge-queue rule, so in a satellite that condition skips the gate outright;
#   * no path or branch filter on the triggers;
#   * no `merge_group:` trigger — measured 2026-09-06, only core has a merge-queue rule, so the event
#     never fires elsewhere. (The lane still judges a `merge_group` event correctly if one arrives.)
#
# 🚨 THE CONCURRENCY BLOCK IS PART OF THE CONTRACT, and it lives in the caller because only a
# WORKFLOW-level group replaces a pending run with ZERO jobs (a job-level group here would publish a
# `cancelled` check-run, which the rollup reads as a failure). It is split by event class because
# branch protection reads the `pull_request` and `pull_request_review` runs and NOT the
# `pull_request_review_comment` ones (measured on #4649) — sharing one pending slot let the
# comment-driven runs evict the read-eligible ones. review-answered.yml in core carries the full
# measurement.
#
# ♻️ THE SELF-REFRESH (the `refresh` job). Branch protection reads this check's `pull_request` run
# and NOT the `pull_request_review_comment` run a reply starts (measured on #4649), so a reply that
# turned the verdict GREEN used to leave the pull request BLOCKED on the older `pull_request` red
# until a person re-ran it by hand. Now, after a GREEN verdict on any event but `pull_request` /
# `merge_group`, the `refresh` job re-runs the WHOLE newest `pull_request` run of the
# CALLER's workflow for the current head — once per (head, answered state); the decision is
# `refresh_action` in the predicate, self-tested. 🚨 And after a GREEN verdict on ANY event (a
# `pull_request` one included) it re-runs EVERY other run of this check on the head whose review
# check-run is red and started before the verdict (`duplicate_red_action`): each run publishes its own
# duplicate of the required context, and branch protection blocked MeshWeaver.Plugins#4276 on three
# older review/comment-event reds while the newest check-run read success. It is the ONLY job here that writes, and the ONLY
# reason a caller grants `actions: write`: a called workflow's job permissions are a HARD requirement
# on every caller (startup_failure, zero jobs, otherwise — .github/lane-caller-grants.yml), so an
# adopting caller grants it in the same change and records it in its roster row.
#
# 🔒 PIN THE REF — `@<40-char commit sha>`, never `@main` (CiContentBake.md → "The caller PINS the
# workflow ref"): otherwise a caller's gate changes with no diff in the caller. And pass the SAME sha
# as `scripts-ref`, so the lane and the predicate it fetches cannot come from two different commits.
# (Core's own caller in review-answered.yml is the exception by construction: it calls the lane by
# local path and passes `github.sha`, i.e. the tree under review.)

on:
  workflow_call:
    inputs:
      scripts-ref:
        description: >-
          The Systemorph/MeshWeaver ref check-review-answered.py is fetched at. A caller pins the
          lane to a 40-char sha and passes the SAME sha here, so the lane and its predicate cannot
          come from two commits. The `main` default exists only so an unpinned call still fetches a
          predicate rather than failing on an empty ref; it is not the recommended shape.
          `github.job_workflow_sha` cannot stand in for this: it is EMPTY inside a reusable called
          from another repository (measured 2026-08-30).
        required: false
        type: string
        default: main
      wait-for-review-minutes:
        description: >-
          How long the verdict re-reads while the ONLY thing missing is the review itself, before
          answering RED. Core measured the reviewer at 3–12 minutes (#4299, #4575). Never waits for
          anything else.
        required: false
        type: number
        default: 15
      settle-replies-seconds:
        description: >-
          How long answering must have stopped before an unanswered-thread verdict is taken — so
          every evaluation on one head sha agrees (#4649). 60 s is ~5x the widest gap measured
          inside one answering burst.
        required: false
        type: number
        default: 60
      verdict-check-run:
        description: >-
          OPT-IN (policy review-pending-while-answering). The caller's REQUIRED context name, exactly as
          branch protection lists it (e.g. `review-answered / Automatic review answered`). When set, a
          same-repository, non-Dependabot pull request's verdict is written through the Checks API as ONE
          check-run of that name per head — PENDING (in_progress, still blocking) while threads await
          answers or the head awaits its review inside the deadlines (policy review-answer-deadline),
          success when answered, failure past a deadline or when unmeasured — and the judging job is
          renamed so its own check-run never carries the name. The caller must then ALSO grant
          `checks: write` on its `uses:` job and add a `schedule:` trigger (the sweep that re-judges a
          pending verdict). Empty (the default): exactly the old red/green, unchanged.
        required: false
        type: string
        default: ""

jobs:
  answered:
    # ⏳ The shape is chosen by NAME, never by skipping (a skipped required context counts as satisfied):
    # opted in (`verdict-check-run`) and judging a same-repository, non-Dependabot pull request or the sweep,
    # this job is the verdict WRITER and its own check-run must not carry the required name.
    name: ${{ (inputs.verdict-check-run != '' && (github.event_name == 'schedule' || (github.event_name != 'merge_group' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'Review answered — verdict writer' || 'Automatic review answered' }}
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    # 30 = the 15-minute bounded wait for the review + the 3-minute settle cap + the 5-minute API outage
    # budget (MW_API_OUTAGE_WAIT_MINUTES, MeshWeaver#7187) + headroom for the fetch and the reads.
    timeout-minutes: 30
    # Reads only, and only what the predicate needs: the pull request, its reviews and review
    # comments (pull-requests), the label events that attribute a waiver (issues). The
    # collaborator-permission read that verifies a waiver needs `metadata: read`, which every
    # GITHUB_TOKEN carries. No checkout at all: the predicate is fetched from core and the caller's
    # tree is never read, so no file in the pull request's tree is what judges it. (The CALLER file
    # itself still comes from the pull request's merge ref on a `pull_request` event, as every
    # workflow does — which is why the context is made REQUIRED in step 3, not trusted to exist.)
    # `checks: read` — the head's `internal-review` check runs, read for the reviewer-unavailable
    # degradation on every evaluation (a PRIVATE caller's token cannot list them without it).
    #
    # 🚨 NO `permissions:` BLOCK HERE, ON PURPOSE (policy review-pending-while-answering). The verdict writer
    # needs `checks: write`, and a called job's `permissions:` is a HARD requirement on every caller: writing
    # `checks: write` here would startup_fail every caller that has not granted it — five of six call this lane
    # at `@main` (the #3933 outage shape, .github/lane-caller-grants.yml). Without a block the job holds exactly
    # what its caller grants on the `uses:` job, recorded per caller in that roster: `contents`,
    # `pull-requests`, `issues` and `checks` at `read` for a caller that has not opted in (plus the `actions:
    # write` its `refresh` job needs), and `checks: write` for one that has.
    # When the GREEN verdict was taken — the `refresh` job re-runs only a read run that STARTED
    # before it (one that started later judged a state no older than this one).
    outputs:
      evaluated-at: ${{ steps.verdict-time.outputs.at }}
      # The writer's reading: success | pending | failure (empty in the job-shaped check).
      verdict-state: ${{ steps.judge.outputs.verdict-state }}
    steps:
      # The platform files this job reads come over git, not REST (Doc/Architecture/CiRestBudget).
      - uses: Systemorph/MeshWeaver/.github/actions/core-file@main
      # The self-hosted scale set a private caller lands on does not promise a Python; every other
      # lane that runs a central guard pins one the same way.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the platform's review-answered predicate at the lane's scripts ref
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref is empty — the review-answered predicate has no ref to be fetched at"; exit 1; }
          "$RUNNER_TEMP/mw-core-file" "${SCRIPTS_REF}" ".github/scripts/check-review-answered.py" > "$RUNNER_TEMP/check-review-answered.py" \
            || { echo "::error::could not fetch check-review-answered.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — never fall back to a local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-review-answered.py" | grep -q "check-review-answered" \
            || { echo "::error::the fetched check-review-answered.py at ${SCRIPTS_REF} does not look like the predicate"; exit 1; }
          echo "predicate: check-review-answered.py from Systemorph/MeshWeaver@${SCRIPTS_REF} ($(wc -c < "$RUNNER_TEMP/check-review-answered.py") bytes)"

      - name: "Prove the predicate can say no (self-test)"
        run: python3 "$RUNNER_TEMP/check-review-answered.py" --self-test

      # 🚨 An API outage (rate limit, 5xx) is retried inside the run for up to MW_API_OUTAGE_WAIT_MINUTES
      # and, past that, exits 3 with `outcome=api-outage` — INFRA, never the verdict "unanswered"
      # (MeshWeaver#7187). The marker step below names it, and the retry listener re-runs it.
      - name: Judge the pull request's automatic review
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          WAIT_MINUTES: ${{ inputs.wait-for-review-minutes }}
          SETTLE_SECONDS: ${{ inputs.settle-replies-seconds }}
          VERDICT_CHECK_RUN: ${{ (inputs.verdict-check-run != '' && (github.event_name == 'schedule' || (github.event_name != 'merge_group' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && inputs.verdict-check-run || '' }}
          MW_API_OUTAGE_WAIT_MINUTES: "5"
        run: |
          set -euo pipefail
          if [ -n "${VERDICT_CHECK_RUN:-}" ] && [ "$EVENT_NAME" = "schedule" ]; then
            python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --verdict-sweep --verdict-check-run "$VERDICT_CHECK_RUN"
          elif [ -n "${VERDICT_CHECK_RUN:-}" ]; then
            # The writer: judged once, no review/settle wait (a pending verdict is not red; the sweep re-judges it).
            python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --pr "$PR" --verdict-check-run "$VERDICT_CHECK_RUN"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --merge-group-ref "$QUEUE_REF" --wait-for-review "$WAIT_MINUTES" --settle-replies "$SETTLE_SECONDS"
          elif [ -n "${PR:-}" ]; then
            python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --pr "$PR" --wait-for-review "$WAIT_MINUTES" --settle-replies "$SETTLE_SECONDS"
          else
            # A caller wired to an event that carries no pull request would otherwise pass
            # `--pr ""` and fail on an argument error that names nothing useful. Fail RED, named.
            echo "::error::event '${EVENT_NAME}' carries no pull request and no merge-queue ref — this lane judges pull requests only; wire the caller to pull_request / pull_request_review / pull_request_review_comment"
            exit 1
          fi

      # 🚨 THE OUTAGE MARKER (MeshWeaver#7187). Runs only after the verdict step FAILED with
      # `outcome=api-outage`, and is itself RED — so the job is red either way and this condition can
      # never turn anything green. Its NAME is the contract: the retry listener
      # (node-repo-review-answered-retry.yml) re-runs a run only when a step of this exact name failed
      # (check-review-answered.py OUTAGE_STEP_NAME, asserted by its self-test in core's tree).
      - name: "API outage: no verdict was taken (retried automatically)"
        if: failure() && steps.judge.outputs.outcome == 'api-outage'
        env:
          OUTAGE_KIND: ${{ steps.judge.outputs.outage-kind }}
        run: |
          echo "::error::GitHub's API refused this run for capacity (${OUTAGE_KIND}) past its retry budget. NO verdict was taken: this is not an unanswered thread and not a missing review. The retry listener re-runs this run once the limit has reset."
          exit 1

      # Reached only on GREEN (the step above exits 1 on RED).
      - name: Stamp when the verdict was taken
        id: verdict-time
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # ♻️ THE SELF-REFRESH — see the header. Runs only after a GREEN verdict (`needs` success); on a
  # RED one there is nothing to refresh, and a later reply's own GREEN run refreshes then. It covers
# the newest `pull_request` run AND every older red duplicate of any event (#4276). The script
  # decides and PRINTS every no-op (this run is the `pull_request` one; the read run is already
  # green, or newer than this verdict; a fork) and WAITS for a read run still in flight (#7187 — it
  # may already have published its red) — so the job never skips silently on an event
  # it was started for. Not a required context: it can turn nothing green by itself, only make the
  # run branch protection reads judge the live state again.
  refresh:
    name: Refresh the verdict branch protection reads
    needs: answered
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    # 45 = up to 30 minutes letting an in-flight read run finish (REFRESH_WAIT_SECONDS — a run still in
    # flight may already have published a red its gate job read before this verdict, #7187) + the
    # 5-minute API outage budget + headroom. Typically seconds: the read run is past its review wait.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      actions: write      # list this workflow's runs for the head; POST …/runs/{id}/rerun (whole run)
    steps:
      - uses: Systemorph/MeshWeaver/.github/actions/core-file@main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the platform's review-answered predicate at the lane's scripts ref
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref is empty — the review-answered predicate has no ref to be fetched at"; exit 1; }
          "$RUNNER_TEMP/mw-core-file" "${SCRIPTS_REF}" ".github/scripts/check-review-answered.py" > "$RUNNER_TEMP/check-review-answered.py" \
            || { echo "::error::could not fetch check-review-answered.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — never fall back to a local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-review-answered.py" | grep -q "check-review-answered" \
            || { echo "::error::the fetched check-review-answered.py at ${SCRIPTS_REF} does not look like the predicate"; exit 1; }
          python3 "$RUNNER_TEMP/check-review-answered.py" --self-test > "$RUNNER_TEMP/self-test.log" || { cat "$RUNNER_TEMP/self-test.log"; exit 1; }

      - name: Re-run every run of this check on the head that still carries an older red
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          EVALUATED_AT: ${{ needs.answered.outputs.evaluated-at }}
          VERDICT_STATE: ${{ needs.answered.outputs.verdict-state }}
          MW_API_OUTAGE_WAIT_MINUTES: "5"
        run: |
          set -euo pipefail
          # The verdict writer passes the job on PENDING too (pending is not red). Nothing is refreshed then: a
          # pending verdict is not GREEN, and the writer's own check-run is the one every later event updates.
          if [ -n "${VERDICT_STATE:-}" ] && [ "$VERDICT_STATE" != "success" ]; then
            echo "  verdict ${VERDICT_STATE} (the writer's check-run carries it) — nothing to refresh until it is GREEN"
            exit 0
          fi
          python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --refresh-read-run \
            --event "$EVENT_NAME" --pr "${PR:-}" --run-id "$RUN_ID" --evaluated-at "$EVALUATED_AT"

      # The same marker as the verdict job's: an outage here left the read run un-refreshed, and the
      # retry listener re-runs this whole run (its verdict, then this refresh) once the limit resets.
      - name: "API outage: no verdict was taken (retried automatically)"
        if: failure() && steps.judge.outputs.outcome == 'api-outage'
        env:
          OUTAGE_KIND: ${{ steps.judge.outputs.outage-kind }}
        run: |
          echo "::error::GitHub's API refused the refresh for capacity (${OUTAGE_KIND}) past its retry budget — the read run was NOT refreshed. The retry listener re-runs this run once the limit has reset."
          exit 1
