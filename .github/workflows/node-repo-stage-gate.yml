# The staged pull-request pipeline's STAGE GATE (reusable) — may the expensive suites start for this head?
#
# 🔀 THE SUITES RUN IN PARALLEL WITH THE REVIEW (policy `suites-parallel-with-review`):
# with ~50 reviews in flight the stage-1 hold kept the runners IDLE while pull requests waited for a
# reviewer (measured 2026-10-05 09:00Z: core 31 jobs running / 0 waiting, Plugins 30 / 0). So by default this
# gate judges STAGE 0 only — a red static control still holds every heavy leg, fail-fast — and answers
# `parallel` for the review. Nothing about merging changed: the review requirement stays a REAL
# required check (core `Automatic review answered`, Plugins `internal-review`) and arming still needs
# the review answered AND the suites green. `review-before-suites: true` restores the review-first
# ordering below, verbatim — and then the caller must carry its stage-advance.yml listener too.
#
# ── The review-first ordering (opt-in under policy suites-parallel-with-review) ──
#
# Maintainer, 2026-10-04: "code review must pass and also other controls such as no client etc. must
# pass before we start test. and we arm only at end of test". Design of record, with the measured
# saving: Doc/Architecture/StagedPullRequestPipeline.
#
#   STAGE 0  cheap static controls (validate, confidential terms, shared rules, locks, policy gates) —
#            the caller makes its heavy-leg front door NEED them, so they fail fast.
#   STAGE 1  THIS lane: the head's automatic review (`internal-review`, App systemorph-com) landed and
#            every reviewer thread has a reply from a person — `check-review-answered.py --stage-gate`,
#            the SAME `internal_review_runs` / `reviewer_threads` / `listing_incomplete` the arm gate and
#            the merge gate use, so the three can never disagree about "reviewed" or "answered".
#   STAGE 2  the caller's test shards / portal hosts / gate shards / bundles — they `need` this job and
#            require `result == 'success'` EXPLICITLY (a skipped need is success() to the implicit guard).
#   STAGE 3  arming — the control plane's babysitter, after the required checks are green.
#
# 🚨 A HOLD IS RED, NEVER SKIPPED. The job fails, naming what holds the head; every required aggregator
# downstream reads red with that root line. Nothing here may grow a job-level `if:` or
# `continue-on-error` — a skipped gate is success() to everything that needs it (the #4139 shape).
# A non-pull-request event (push, merge_group, schedule, dispatch) is not staged: trunk and the queue
# never wait for a review, and the step says so in green.
#
# 🔁 WHAT RE-ASKS THE QUESTION (event-driven, not polling): the caller's `stage-advance.yml`, calling
# node-repo-stage-advance.yml on `check_run: completed` (the review landing), on a person's reply
# (`pull_request_review_comment`) and on a 15-minute sweep (the bounded fallback — a review OUTAGE
# raises no event at all). It POSTs `rerun-failed-jobs` on the held run: this gate, the front door and
# everything they held run again on the SAME head; the green stage-0 jobs are not repeated.
#
# 🛟 THREE LOUD RELEASES, so stage 1 can never freeze the fleet in silence: the reviewer's own
# "Reviewer unavailable" degradation; NO completed review `fallback-minutes` after the head's run was
# created (a review outage); the label `tests-before-review`. Each prints a ::warning:: and a summary
# line; NONE of them arms — the arm gate still requires this head's real review and every answer.
name: Node repo stage gate (reusable)

on:
  workflow_call:
    inputs:
      scripts-ref:
        description: >-
          The Systemorph/MeshWeaver ref check-review-answered.py is fetched at. Callers float on `main`
          (no pins — MeshWeaver#3842); core's own caller passes github.sha so a pull request that
          changes the predicate is judged by its own copy.
        required: false
        type: string
        default: main
      fallback-minutes:
        description: >-
          Minutes after the head's CI run was created with NO completed review, after which stage 2
          starts anyway — loudly, and still without arming. Derived from the measured review latency
          (Doc/Architecture/StagedPullRequestPipeline).
        required: false
        type: number
        default: 120
      stage0-results:
        description: >-
          Space-separated `name=result` pairs of the caller's stage-0 controls (`needs.<job>.result`).
          `failure` or `cancelled` holds the head as STAGE 0 RED; `success` and `skipped` pass (a control
          that skips by its own design — a fork, a non-PR event — does not hold stage 2). The caller job
          runs with `if: !cancelled()` so a skipped control never skips this gate.
        required: false
        type: string
        default: ""
      already-green:
        description: "The caller's tree is already tested green (core's green-tree reuse): nothing is spent, so nothing is held"
        required: false
        type: boolean
        default: false
      review-before-suites:
        description: >-
          true = hold the suites until the head's review landed and every thread is answered (the
          review-first ordering; the caller then needs its stage-advance.yml listener). false (default,
          policy suites-parallel-with-review) = the suites start as soon as stage 0 is green and run in
          PARALLEL with the review; merging and arming still require the answered review.
        required: false
        type: boolean
        default: false
    outputs:
      ready:
        description: "'true' when stage 2 may start for this head"
        value: ${{ jobs.gate.outputs.ready }}
      mode:
        description: "parallel | reviewed | degraded | fallback | label | not-staged | stage0-red | draft | waiting | unanswered | unreadable"
        value: ${{ jobs.gate.outputs.mode }}

jobs:
  gate:
    # 🚨 This NAME is the contract the event half matches (check-review-answered.py STAGE_GATE_JOBS, Plugins
    # PrBabysitter.StageGateJob). Renamed under policy suites-parallel-with-review from "Stage 1: review landed and answered", which a
    # green tick would now misreport; the event half still recognises the old name on held runs.
    name: "Stage gate: may the suites start"
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      ready: ${{ steps.judge.outputs.ready }}
      mode: ${{ steps.judge.outputs.mode }}
    steps:
      - name: Fetch the platform's review predicate at the lane's scripts ref
        # Only the opt-in review hold reads the predicate; the default (parallel) judges stage 0 alone.
        if: ${{ inputs.review-before-suites }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref is empty — the stage predicate has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-review-answered.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-review-answered.py" \
            || { echo "::error::could not fetch check-review-answered.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — never fall back to a local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-review-answered.py" | grep -q "check-review-answered" \
            || { echo "::error::the fetched check-review-answered.py at ${SCRIPTS_REF} does not look like the predicate"; exit 1; }

      - name: "Prove the predicate can say no (self-test)"
        if: ${{ inputs.review-before-suites }}
        run: python3 "$RUNNER_TEMP/check-review-answered.py" --self-test > "$RUNNER_TEMP/self-test.log" || { cat "$RUNNER_TEMP/self-test.log"; exit 1; }

      - name: Stage 1 — is this head reviewed and every finding answered?
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          FALLBACK: ${{ inputs.fallback-minutes }}
          STAGE0: ${{ inputs.stage0-results }}
          ALREADY_GREEN: ${{ inputs.already-green }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          REVIEW_BEFORE_SUITES: ${{ inputs.review-before-suites }}
        run: |
          set -euo pipefail
          # Stage 0 first: a red static control holds every event's heavy legs only on a pull request,
          # but it is judged here on its own results so a SKIPPED control can never skip this gate.
          red=""
          for pair in $STAGE0; do
            case "${pair#*=}" in failure|cancelled) red="$red ${pair}" ;; esac
          done
          not_staged() {
            echo "$1"
            { echo "ready=true"; echo "mode=not-staged"; } >> "$GITHUB_OUTPUT"
            echo "### Staged pipeline — $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            not_staged "event '$EVENT_NAME' is not staged — trunk, the queue, the schedule and a dispatch never wait for a review"
          fi
          if [ -n "$red" ]; then
            echo "::error title=Stage 2 held — stage 0 red::STAGE 2 HELD (stage 0 red): a cheap static control is red (${red# }) — fix it and push; the new head restarts at stage 0"
            { echo "ready=false"; echo "mode=stage0-red"; } >> "$GITHUB_OUTPUT"
            echo "### ⏸ Stage 2 held — stage 0 red:${red}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$ALREADY_GREEN" = "true" ]; then
            not_staged "this tree is already tested green — the reuse path spends nothing, so it is not held"
          fi
          # The internal reviewer does not review a FORK's head (the steward admits members, their
          # agents and bots), so holding one would only wait out the fallback under a warning that
          # blames an outage. A fork runs as before; its merge still needs the review gate (a waiver).
          if [ "$FORK" = "true" ]; then
            not_staged "a fork's head is not reviewed by the internal reviewer — not staged; the merge gate still applies"
          fi
          [ -n "${PR:-}" ] || { echo "::error::a pull_request event without a pull request number"; exit 1; }
          # 🔀 The default: the review runs IN PARALLEL with the suites (policy suites-parallel-with-review).
          if [ "$REVIEW_BEFORE_SUITES" != "true" ]; then
            echo "stage 0 green — the suites start now and run in PARALLEL with the automatic review; merging and arming still require the review landed and every thread answered"
            { echo "ready=true"; echo "mode=parallel"; } >> "$GITHUB_OUTPUT"
            echo "### Staged pipeline — stage 0 green; the suites run in parallel with the review (the merge still requires it answered)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Stage 1 began when the head's run was created; a re-run keeps created_at, so the fallback
          # clock does not restart on every re-evaluation.
          since=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .created_at)
          python3 "$RUNNER_TEMP/check-review-answered.py" --repo "$GH_REPO" --pr "$PR" --stage-gate \
            --since "$since" --fallback-minutes "$FALLBACK"
