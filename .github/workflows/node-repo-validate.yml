name: Node repo validate (reusable)

# ♻️ REUSABLE (workflow_call) — the cheap shape gate for MeshWeaver.* content repos (unified per
# #1707): every node JSON validates, every manifest.lock is current, and — on main only — every
# module's derived version matches its content. `validate-repos.py` is the caller's; the manifest
# half runs the PLATFORM's `.github/scripts/gen-manifests.py`, fetched at `platform-ref`, against
# the caller's tree — the same centralization as compile-check.py, and for the same measured
# reason: the six vendored copies had drifted to five vintages (Plugins 1157 lines, Crm 646,
# Education 646, Reinsurance 644, SocialMedia 643, Manufacturing 305), so each fix landed in one
# repo and the other five kept the bug (#434, #942/#1023, #1426).
#
# Caller contract:
#
#   validate:
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-validate.yml@<40-char platform commit sha>
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".

on:
  workflow_call:
    inputs:
      platform-ref:
        description: >-
          The Systemorph/MeshWeaver ref the CENTRAL guard scripts are fetched at
          (check-workflow-timeouts.py, check-pr-secret-preflight.py).
          Pin it to the same platform commit as the `uses:` sha of this lane; `main` floats and makes two runs
          of identical code able to disagree (the same argument as the image digest).
        required: false
        type: string
        default: main
      check-versions-always:
        description: >-
          Run the derived-version check on EVERY event instead of main-only. Correct for a repo
          whose PRs are expected to regenerate manifests and which has no settle-versions job to
          repair a miss on main (a miss would otherwise surface as a red MAIN push). A repo with
          higher PR traffic keeps the default: the derived patch races the moving trunk baseline,
          so PR-gating it fails PRs for OTHER people's merges.
        required: false
        type: boolean
        default: false
      centralized-gen-manifests:
        description: >-
          Take the manifest VERDICT from the platform's canonical gen-manifests.py rather than the
          caller's vendored copy. The platform's copy is fetched and self-tested on EVERY run either
          way — this input only chooses which one is believed, so neither setting skips a gate.
          A caller flips it to true in the same commit that adds `scripts/gen-manifests.config.json`
          (the skip list + hashModuleSources, its allow-file); until then it keeps running the copy
          it has, visibly, in a step that names it. Retiring the vendored copy is a SEPARATE step —
          it is still the repo's local command and, in most callers, `validate-repos.py`'s library
          for `check_manifests`, so it goes when a `platform-script.py`-style resolver replaces it.
          After the flip it is no longer the VERDICT, which is what this input is about.
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate node repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tags are the version history — --check-versions needs them
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate every node JSON (+ NodeType Source)
        run: python3 scripts/validate-repos.py
      # 🚨 THE 45-MINUTE CAP, fleet-wide (maintainer, 2026-09-02: "hard cut CI runs after 45min — we pay all
      # this"). GitHub's default job timeout is 360 minutes; an uncapped job that hangs bills a runner for six
      # hours and, when a required check `needs:` it, blocks every merge behind it (the Plugins Mcp bundle,
      # 19 runs in_progress at once). The guard is the PLATFORM's script fetched at platform-ref — the same
      # centralization as compile-check.py — and it runs against the CALLER's tree. No fallback: a ref the
      # script cannot be fetched at fails RED naming it, never "skipped".
      - name: Fetch the platform's workflow-timeout guard at the pinned ref
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the timeout guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-workflow-timeouts.py?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-workflow-timeouts.py" \
            || { echo "::error::could not fetch .github/scripts/check-workflow-timeouts.py at ${PLATFORM_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-workflow-timeouts.py" | grep -q "check-workflow-timeouts" || { echo "::error::the fetched check-workflow-timeouts.py at ${PLATFORM_REF} does not look like the guard"; exit 1; }
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: "Every job is capped at 45 minutes — the gate can fail (self-test)"
        run: python3 "$RUNNER_TEMP/check-workflow-timeouts.py" --self-test
      - name: "Every job in this repo's workflows is capped at 45 minutes"
        run: python3 "$RUNNER_TEMP/check-workflow-timeouts.py" --root .

      # 🚨 A DEPENDABOT RUN READS A DIFFERENT SECRET STORE (Systemorph/MeshWeaver#3399, a recurrence
      # of #2249). `secrets.X` resolves against Settings → Secrets and variables → **Dependabot**,
      # a PARTIAL mirror of the Actions store; there is no Dependabot *variables* store, so `vars.X`
      # is single-store and only `secrets.X` is doubled. Provision a name on the Actions tab alone
      # and every other run is fine while a Dependabot PR reads it EMPTY — and the maintainer who
      # opens the Actions tab finds it sitting right there and blames the workflow.
      #
      # This gate is STATIC and needs no credential: every `secrets.NAME` a pull-request-reachable
      # job consumes must be asserted by a preflight in the same repo, so an empty value is named
      # at the first job. Measured on MeshWeaver.Reinsurance#128: preflight PASSED and compile-check
      # died one job later with `compose-sealed-modules.sh: --registry-url needs --registry-key`,
      # a message that names no secret at all, because nothing had asked for MW_REGISTRY_KEY.
      #
      # A name legitimately passed but never consumed on a PR — or asserted inside a shared lane
      # this repo only CALLS, which the guard cannot see through — is declared once, with a reason,
      # in the caller's `.github/pr-secret-preflight-allow.txt`. A stale entry there fails too.
      - name: Fetch the platform's PR-secret preflight guard at the pinned ref
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the PR-secret guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-pr-secret-preflight.py?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-pr-secret-preflight.py" \
            || { echo "::error::could not fetch .github/scripts/check-pr-secret-preflight.py at ${PLATFORM_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-pr-secret-preflight.py" | grep -q "check-pr-secret-preflight" || { echo "::error::the fetched check-pr-secret-preflight.py at ${PLATFORM_REF} does not look like the guard"; exit 1; }
          # Do not lean on the timeout guard above having installed it — a reorder there would
          # break this step with an ImportError instead of a verdict.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: "Every PR-reachable secret is asserted by a preflight — the gate can fail (self-test)"
        run: python3 "$RUNNER_TEMP/check-pr-secret-preflight.py" --self-test
      - name: "Every PR-reachable secret in this repo is asserted by a preflight"
        run: python3 "$RUNNER_TEMP/check-pr-secret-preflight.py" --root .
      # 🚨 ONE implementation of the version derivation, every repo. Fetched exactly like the two
      # guards above and like compile-check.py: asserted RED when unavailable, never fallen back to
      # a drifted per-repo copy. The fetch and the self-test run on EVERY call, whichever copy is
      # believed below, so "the platform's checker is intact" is never a thing a run can skip.
      - name: Fetch the platform's manifest checker at the pinned ref
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${PLATFORM_REF:-}" ] || { echo "::error::platform-ref is empty — the canonical gen-manifests.py has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/gen-manifests.py?ref=${PLATFORM_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/gen-manifests.py" \
            || { echo "::error::could not fetch .github/scripts/gen-manifests.py at ${PLATFORM_REF} from Systemorph/MeshWeaver — a pin older than the centralization needs the older lane, not a drifted local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/gen-manifests.py" | grep -q "manifest.lock" || { echo "::error::the fetched gen-manifests.py at ${PLATFORM_REF} does not look like the manifest generator"; exit 1; }
      - name: "The manifest checker can fail — --resolve, the trunk baseline and the config contract (self-test)"
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --self-test

      # manifest.lock calls itself CI-verified; this is what verifies it. A stale lock means a
      # module's recorded content hash — and the version derived from it — describes a tree that
      # no longer exists, which is exactly what a dependent's pin would be trusting.
      - name: Every manifest.lock is current (and carries a version)
        if: ${{ inputs.centralized-gen-manifests }}
        env:
          MW_REPO_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --check
      - name: "Every manifest.lock is current — this repo's VENDORED copy, not yet centralized"
        if: ${{ !inputs.centralized-gen-manifests }}
        run: python3 scripts/gen-manifests.py --check
      # 🚨 …and the version is the RIGHT one — but ONLY on main, and that restriction is the
      # point. The patch is derived from a baseline that MOVES (the highest published tag plus
      # the trunk's committed lock), so a branch is correct the moment it is pushed and wrong as
      # soon as anyone else merges. Run as a PR gate it spends its time failing PRs for OTHER
      # people's merges. What a BRANCH can be held to is `--check` above: your lock describes
      # YOUR tree — content hashes, entirely local. What only MAIN can settle is the derived
      # number, so this runs as that step's POST-condition rather than as a gate.
      - name: Every module's version matches its content
        if: >
          inputs.centralized-gen-manifests && (inputs.check-versions-always ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          MW_REPO_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --check-versions
      - name: "Every module's version matches its content — this repo's VENDORED copy, not yet centralized"
        if: >
          !inputs.centralized-gen-manifests && (inputs.check-versions-always ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: python3 scripts/gen-manifests.py --check-versions
