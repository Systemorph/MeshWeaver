name: Node repo validate (reusable)

# ♻️ REUSABLE (workflow_call) — the cheap shape gate for MeshWeaver.* content repos (unified per
# #1707): every node JSON validates, every manifest.lock is current, and — on main only — every
# module's derived version matches its content. `validate-repos.py` is the caller's; the manifest
# half runs the PLATFORM's `.github/scripts/gen-manifests.py`, fetched at `platform-ref`, against
# the caller's tree — the same centralization as compile-check.py, and for the same measured
# reason: the six vendored copies had drifted to five vintages (Plugins 1157 lines, Crm 646,
# Education 646, Reinsurance 644, SocialMedia 643, Manufacturing 305), so each fix landed in one
# repo and the other five kept the bug (#434, #942/#1023, #1426).
#
# Caller contract:
#
#   validate:
#     uses: Systemorph/MeshWeaver/.github/workflows/node-repo-validate.yml@<40-char platform commit sha>
#
# 🔒 PIN THE REF — `@main` is wrong here. The image is pinned by digest so CI is reproducible;
# the CI logic is pinned for the same reason and with a wider blast radius, since one edit here
# would otherwise change EVERY satellite's gates at once and make "did my change break this, or
# did the shared workflow move?" unanswerable. A mutable TAG does not fix that — only a commit
# sha makes the bump a commit in the CALLER. GitHub forbids an expression in `uses:`, so the sha
# is literal in each caller and they are bumped together. Procedure: CiContentBake.md ->
# "Node repos run the same lane" -> "The workflow ref is PINNED".

on:
  workflow_call:
    inputs:
      platform-ref:
        description: >-
          The Systemorph/MeshWeaver ref the CENTRAL guard scripts are fetched at
          (check-workflow-timeouts.py, check-pr-secret-preflight.py, check-workflow-yaml-keys.py).
          Pin it to the same platform commit as the `uses:` sha of this lane; `main` floats and makes two runs
          of identical code able to disagree (the same argument as the image digest).
        required: false
        type: string
        default: main
      scripts-ref:
        description: >-
          The Systemorph/MeshWeaver ref this lane's OWN helper scripts are fetched at (the guards,
          compose scripts and mergers under .github/scripts that the lane itself runs). Distinct from
          `platform-ref`, which names the PLATFORM the caller builds against (compile references,
          images, core source). Empty (the default) means "the same as platform-ref" — right for a
          caller that pins the lane and the platform to one commit. A caller that pins NOTHING
          (MeshWeaver#3842: the platform resolved at run time to the newest SEALED set, the lane
          called at `@main`) passes `main` here, because a sealed set is hours behind the lane's own
          tip: on 2026-09-09 this lane at @main fetched check-abbreviated-shas.py — added at 17:06Z
          (022ab4a9d) — at a platform-ref cut at 3cda3efde a few hours earlier, and the fetch 404'd
          (Plugins#1566). `github.job_workflow_sha` cannot stand in for this: it is EMPTY inside a
          reusable called from another repository (measured 2026-08-30), so the lane's own ref is an
          input, never inferred.
        required: false
        type: string
        default: ''
      enforce-cancel-rule:
        description: >-
          Run the platform's cancellation guard (.github/scripts/check-main-runs-not-cancelled.py)
          over this repo's .github/workflows/ci.yml: nothing on main is ever cancelled, a person's
          pull_request push supersedes, the resolver bot's never (`github.event.sender.type !=
          'Bot'`), and no job calls the supersede lane. Fleet rule 2026-09-13 ("see that process
          is same as in plugins everywhere"). Opt-in until every caller carries the expression;
          then the default flips.
        required: false
        type: boolean
        default: false
      check-versions-always:
        description: >-
          Run the derived-version check on EVERY event instead of main-only. Correct for a repo
          whose PRs are expected to regenerate manifests and which has no settle-versions job to
          repair a miss on main (a miss would otherwise surface as a red MAIN push). A repo with
          higher PR traffic keeps the default: the derived patch races the moving trunk baseline,
          so PR-gating it fails PRs for OTHER people's merges.
        required: false
        type: boolean
        default: false
      centralized-gen-manifests:
        description: >-
          Take the manifest VERDICT from the platform's canonical gen-manifests.py rather than the
          caller's vendored copy. The platform's copy is fetched and self-tested on EVERY run either
          way — this input only chooses which one is believed, so neither setting skips a gate.
          A caller flips it to true in the same commit that adds `scripts/gen-manifests.config.json`
          (the skip list + hashModuleSources, its allow-file); until then it keeps running the copy
          it has, visibly, in a step that names it. Retiring the vendored copy is a SEPARATE step —
          it is still the repo's local command and, in most callers, `validate-repos.py`'s library
          for `check_manifests`, so it goes when a `platform-script.py`-style resolver replaces it.
          After the flip it is no longer the VERDICT, which is what this input is about.
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate node repos
    runs-on: ${{ vars.MW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # 🚨 `fetch-depth: 0` writes ONE LOG LINE PER REF, and a content repo's refs are mostly TAGS:
      # MeshWeaver.Plugins has 181 branches + 2,027 module-release tags, so this checkout alone printed
      # ~2,208 `* [new branch]`/`* [new tag]` lines — measured 28.7% of every line that repo's CI wrote
      # in a 73-job run. `actions/checkout` cannot be made quiet (`show-progress: false` drops
      # `--progress`, which is the progress METER, not the ref-update TABLE; only `--quiet` drops that,
      # and no input passes it). So: shallow checkout, then fetch exactly what `fetch-depth: 0` would
      # have, quietly.
      #
      # 🚨 A NO-OP for every consumer, and that is the whole point — same objects, same branches, same
      # tags, not shallow — so a tag read, a publication baseline and a merge-base all still resolve.
      # Dropping `fetch-depth: 0` would NOT be a no-op; a verbosity change must not change a verdict.
      # 🚨 `$HEAD_SHA` is in the refspec because on a pull request `actions/checkout` checks out
      # `refs/pull/<n>/merge`, which `+refs/heads/*` does not name. Reachability makes it arrive
      # anyway in every case measured — a same-repo PR's merge ref, and even a MERGED PR whose
      # branch was deleted, both completed to 6,729+ commits — but that is an invariant nobody
      # wrote down, and an unmerged fork head would not be reachable. Naming the commit costs one
      # argument and removes the reasoning.
      # The shallow re-check afterwards is not ceremony: a quiet success and a fetch that quietly did
      # nothing would otherwise read the same, and every selector here narrows silently when it cannot
      # see history.
      - name: Full history and tags, quietly
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --tags --prune --no-recurse-submodules --unshallow origin '+refs/heads/*:refs/remotes/origin/*' "$HEAD_SHA"
          else
            git fetch --quiet --tags --prune --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' "$HEAD_SHA"
          fi
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "::error::the repository is still SHALLOW after the history fetch — every selector that reads a tag, a publication baseline or a merge-base would now narrow silently. Refusing to continue."; exit 1; }
          echo "full history: $(git rev-list --count HEAD) commit(s), $(git tag | wc -l | tr -d ' ') tag(s)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🚨 THE PREREQUISITE LINE, AND THE ONLY THING ALLOWED TO MASK A GUARD (#4784). The checkout,
      # the history fetch it needs and Python are what every guard below reads; a guard's own input
      # is not. So this step publishes one output, every guard carries
      # `!cancelled() && steps.ready.outputs.ok == 'true'`, and the two failure modes stay separate:
      #   * a PREREQUISITE fails  ⇒ `ready` is skipped, its output is empty, every guard is skipped,
      #     and the prerequisite's own red is the verdict. Nothing runs against an empty workspace.
      #   * a GUARD fails         ⇒ `ready` is untouched, so every other guard still reports. That is
      #     the trapdoor this closes: 16 steps once reported `skipped` behind one drift red, and a
      #     skipped required context counts as SATISFIED.
      # `check-guard-step-masking.py` asserts this shape, and refuses a job whose guard list is empty
      # so it cannot pass by having nothing to check.
      - name: The workspace and the tools are present — the ONE prerequisite every guard shares
        id: ready
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
      # GitSync accepts a BuildCompletion only from this exact repository-level path (#3978).
      # If a maintainer renames content CI, the renamed workflow still runs this reusable lane;
      # this gate then fails RED instead of letting every installation silently freeze on its
      # previous imported commit. The guard is fetched at the lane's own scripts ref for the same
      # reason as the other centralized policy below: a caller cannot silently retain an old rule.
      - name: Fetch the content-CI publish-path guard at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the content-CI path guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-content-ci-path.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-content-ci-path.py" \
            || { echo "::error::could not fetch .github/scripts/check-content-ci-path.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-content-ci-path.py" | grep -q "check-content-ci-path" || { echo "::error::the fetched check-content-ci-path.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
      - name: "The content-CI publish path is enforced — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-content-ci-path.py" --self-test
      - name: "Content CI remains at GitSync's publish-signal path"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-content-ci-path.py" --root . --expected .github/workflows/ci.yml
      - name: Validate every node JSON (+ NodeType Source)
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 scripts/validate-repos.py
      # ── NO COVER IS A WALL OF TEXT, AND EVERY heroCta PILL IS LEGIBLE ──
      # 🚨 ONE copy of the cover gate, fetched here (MeshWeaver#4027). It used to be hand-copied into
      # five repos as `scripts/check-covers.py`, and measured 2026-09-13 the copies had drifted to
      # THREE variants in 17 days: the heroCta contrast check (WCAG 3:1 surface / 4.5:1 label,
      # added because twelve covers across two repos shipped an invisible pill) reached exactly one
      # of them, and nothing said the other four differed. A change to the shared gate cost between
      # two and five PRs and the answer depended on which copy you happened to open. Fetched at the
      # lane's SCRIPTS ref like every other guard above: asserted RED when unavailable, never fallen
      # back to a drifted local copy. The allow-files stay in the CALLER (`cover-prose.allow`,
      # `cover-contrast.allow`) — they are the repo's debt, the script is not.
      #
      # 🚨 This gate is NOT vacuous by construction: a repo with no cover at all fails it ("would
      # pass vacuously"), so a caller whose plugin roots moved out from under it goes red rather than
      # green. Every caller measured 2026-09-13 has at least one cover (Crm and Manufacturing: 1;
      # SocialMedia 5; Education 9; Reinsurance 17; Plugins 69).
      - name: Fetch the platform's cover gate at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the cover gate has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-covers.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-covers.py" \
            || { echo "::error::could not fetch .github/scripts/check-covers.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the centralization needs the older lane, not a drifted local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-covers.py" | grep -q "check-covers" || { echo "::error::the fetched check-covers.py at ${SCRIPTS_REF} does not look like the cover gate"; exit 1; }
      - name: "No cover is a wall of text — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-covers.py" --self-test
      - name: "No cover is a wall of text, and every heroCta pill is legible on the page"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-covers.py" --root .
      # 🚨 THE 45-MINUTE CAP, fleet-wide (maintainer, 2026-09-02: "hard cut CI runs after 45min — we pay all
      # this"). GitHub's default job timeout is 360 minutes; an uncapped job that hangs bills a runner for six
      # hours and, when a required check `needs:` it, blocks every merge behind it (the Plugins Mcp bundle,
      # 19 runs in_progress at once). The guard is the PLATFORM's script fetched at the lane's SCRIPTS ref
      # (`scripts-ref`, falling back to platform-ref for a caller that pins both to one commit) — the
      # same centralization as compile-check.py — and it runs against the CALLER's tree. No fallback: a
      # ref the script cannot be fetched at fails RED naming it, never "skipped".
      #
      # 🚨 WHY THE SCRIPTS REF IS NOT `platform-ref` (MeshWeaver#3842). A caller that pins nothing calls
      # this lane at `@main` and resolves its platform to the newest SEALED set — a commit hours behind
      # the lane. Every guard fetched here is the LANE's tooling and must be the lane's vintage: fetched
      # at the platform commit, a guard core added since the seal does not exist there and the lane
      # fails on the 404 while the caller changed nothing (check-abbreviated-shas.py, 2026-09-09,
      # Plugins#1566). `github.job_workflow_sha` is empty inside a cross-repo reusable, so the lane's
      # own ref is the `scripts-ref` input.
      - name: The cancellation rule holds — nothing on main cancels, a person's PR push supersedes, the bot's never
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' && inputs.enforce-cancel-rule }}   # reports; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-main-runs-not-cancelled.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-main-runs-not-cancelled.py" \
            || { echo "::error::could not fetch .github/scripts/check-main-runs-not-cancelled.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-main-runs-not-cancelled.py" | grep -q "check-main-runs-not-cancelled" || { echo "::error::the fetched guard at ${SCRIPTS_REF} does not look like itself"; exit 1; }
          python3 "$RUNNER_TEMP/check-main-runs-not-cancelled.py" --self-test
          python3 "$RUNNER_TEMP/check-main-runs-not-cancelled.py"

      - name: Fetch the platform's workflow-timeout guard at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the timeout guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-workflow-timeouts.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-workflow-timeouts.py" \
            || { echo "::error::could not fetch .github/scripts/check-workflow-timeouts.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-workflow-timeouts.py" | grep -q "check-workflow-timeouts" || { echo "::error::the fetched check-workflow-timeouts.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-abbreviated-shas.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-abbreviated-shas.py" \
            || { echo "::error::could not fetch .github/scripts/check-abbreviated-shas.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-abbreviated-shas.py" | grep -q "check-abbreviated-shas" || { echo "::error::the fetched check-abbreviated-shas.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-workflow-permission-pairing.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-workflow-permission-pairing.py" \
            || { echo "::error::could not fetch .github/scripts/check-workflow-permission-pairing.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-workflow-permission-pairing.py" | grep -q "check-workflow-permission-pairing" || { echo "::error::the fetched check-workflow-permission-pairing.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          # MeshWeaver#3878: the module publication gate. Its caller-graph check used to run only INSIDE
          # the publication lane — on trunk, after the merge that broke it — so it is fetched here too
          # and run against this repository's callers on every pull request (step further down).
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/module-publication.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/module-publication.py" \
            || { echo "::error::could not fetch .github/scripts/module-publication.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/module-publication.py" | grep -q "module-publication" || { echo "::error::the fetched module-publication.py at ${SCRIPTS_REF} does not look like the publication gate"; exit 1; }
          # 🚨 The pairing guard needs the LANE DEFINITIONS, not just the script: the defect is a
          # relation between this repo's caller and the lane it is about to call, and neither half
          # alone shows it. Fetch every shared lane at the same ref into a platform root. A fetch
          # that fails exits RED — a lane we cannot read would make the check silently vacuous,
          # which is the failure mode it exists to prevent (AGENTS.md — a gate never tests its own
          # inputs).
          mkdir -p "$RUNNER_TEMP/platform/.github/workflows"
          # 🚨 `auto-arm` is in this list because its demand is WORKFLOW-level and every repository in
          # the fleet calls it. It was absent while the guard resolved a cross-repo `uses:` by
          # BASENAME inside the calling repo — which found each satellite's own two-line `auto-arm.yml`
          # CALLER wrapper and compared it against itself, reporting a pair that was never checked.
          # With that fixed the lane must actually be fetched, or the caller is silently uncovered.
          for lane in node-repo-validate node-repo-compile-check node-repo-gate node-repo-module-pack \
                      node-repo-module-publish node-repo-publish-bake node-repo-tag-modules \
                      node-repo-platform-canary node-repo-platform-ref-bump node-repo-supersede \
                      auto-arm; do
            gh api "repos/Systemorph/MeshWeaver/contents/.github/workflows/${lane}.yml?ref=${SCRIPTS_REF}" --jq .content \
              | base64 -d > "$RUNNER_TEMP/platform/.github/workflows/${lane}.yml" \
              || { echo "::error::could not fetch .github/workflows/${lane}.yml at ${SCRIPTS_REF} — the permission-pairing guard cannot read the lane this repo calls, and a guard that cannot read its subject must not pass"; exit 1; }
          done
          # 🚨 THE FLEET ROSTER. Core's own pull request checks a lane change against the committed
          # grants of every repository it cannot read (.github/lane-caller-grants.yml), because the
          # pairing check below is hosted in THIS lane — which every satellite calls from the same
          # ci.yml that calls the other lanes — and a `startup_failure` rejects that whole file's
          # graph. On a recurrence this job is never scheduled, so it cannot report the outage it is
          # standing in. That makes the roster the load-bearing half, and a roster nobody
          # re-measures is a memory: this lane asserts THIS repository's row still matches reality.
          # The fetch fails RED like every other one here — never "skipped".
          gh api "repos/Systemorph/MeshWeaver/contents/.github/lane-caller-grants.yml?ref=${SCRIPTS_REF}" --jq .content \
            | base64 -d > "$RUNNER_TEMP/lane-caller-grants.yml" \
            || { echo "::error::could not fetch .github/lane-caller-grants.yml at ${SCRIPTS_REF} — the fleet roster this repo's row is asserted against is unreadable, and a guard that cannot read its subject must not pass"; exit 1; }
          grep -q "^repos:" "$RUNNER_TEMP/lane-caller-grants.yml" || { echo "::error::the fetched lane-caller-grants.yml at ${SCRIPTS_REF} has no \`repos:\` mapping"; exit 1; }
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      # 🚨 --root AND --fleet are passed on purpose: without them only the unit cases run, and those
      # pass against hand-written dicts while the real tree is broken. With them the controls mutate
      # THIS repo's real callers and the real lane files, in both directions.
      - name: "A caller grants what its lane demands — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-permission-pairing.py" --self-test --root . --platform-root "$RUNNER_TEMP/platform" --fleet "$RUNNER_TEMP/lane-caller-grants.yml"
      # 🚨 MeshWeaver#3933 added `id-token: write` to three jobs of the module-pack lane and paired
      # only core's own caller. Every satellite run became `startup_failure` with ZERO jobs — no
      # permission error, no check-run, and under classic protection an ABSENT required context
      # blocks forever. MeshWeaver.Plugins was dark for five hours and could not merge the two-line
      # fix for the thing that broke it.
      #
      # 🚨 THIS STEP WOULD NOT HAVE CAUGHT THAT, and this comment used to claim it would ("the only
      # place it CAN be caught"). Measured wrong in MeshWeaver#4011: the check lives in a job the
      # caller's own ci.yml declares, and a `startup_failure` rejects that whole FILE's graph — so
      # on a recurrence this job is never scheduled and cannot report the outage it is standing in.
      # Five of six satellites call at `@main`, so no pin stands in between either. What prevents a
      # recurrence is core's `--fleet` run against .github/lane-caller-grants.yml, before the lane
      # change merges. This step covers the OTHER direction: a change made on THIS side of the pair.
      - name: "This repo's callers grant every permission their platform lanes demand"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-permission-pairing.py" --root . --platform-root "$RUNNER_TEMP/platform"
      # 🚨 THE ANTI-STALENESS HALF. The platform's fleet roster is what core's own pull request
      # checks a lane change against, and it can only be trusted while every row is re-derived from
      # the repository it describes. Both drift directions make the fleet check answer a confident
      # green on a broken fleet — this repo ADDS a caller the roster does not know, or LOWERS a
      # grant the roster still records — and both are caught here, in a job that DOES run (a roster
      # mismatch is not a permission escalation, so the run graph is accepted and the red is
      # visible). Re-measure with `--emit-fleet-row` and land the printed block in core.
      - name: "This repo's callers still match the platform's fleet roster"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-permission-pairing.py" --root . --fleet "$RUNNER_TEMP/lane-caller-grants.yml" --assert-fleet-row "${{ github.repository }}"
      # 🚨 MeshWeaver#3878: A MODULE REGISTRY HAND-OVER WAITS FOR THE WHOLE VALIDATION VERDICT, and the
      # wiring that makes it wait is checked HERE, before merge. `node-repo-module-publish.yml` runs
      # the same caller-graph check itself, but only on trunk — the first run of a broken publisher
      # would be the post-merge run on `main`, refusing, with nothing published and main red. This
      # step runs it against every publisher in this repo's workflows on the pull request, and adds
      # the wiring the lane cannot see from inside one call: every `publish-mode: staged` pack call
      # has exactly one publisher on its `lane`, `selected` and `declared` outputs, and that publisher
      # runs on exactly the events the pack call stages on. A repo that calls neither lane prints so.
      - name: "The module publication gate can refuse (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/module-publication.py" --self-test
      - name: "A module registry hand-over waits for this repo's whole validation verdict"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/module-publication.py" check-callers --root .
      - name: "Every job is capped at 45 minutes — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-timeouts.py" --self-test
      - name: "Every job in this repo's workflows is capped at 45 minutes"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-timeouts.py" --root .

      # 🚨 A VENDORED RESOLVER MUST NOT DRIFT (MeshWeaver.Plugins#1565; the shape of MeshWeaver#4027).
      # Every satellite carries `scripts/resolve-platform.py` and runs it in its own `platform-ref`
      # job — the file that decides which sealed platform set the repository builds and tests
      # against. Measured 2026-09-13: seven copies at six distinct sizes across the fleet, one of
      # them (Education) an older vintage whose answer differs on a re-run and on a set whose own
      # Plugins seal is not the newest, and no guard compared any of them to the canonical. The
      # comparison is at the CODE level (docstrings and comments are not drift); the verdict is
      # advisory until the date the guard carries (`RED_FROM`, one day after it landed) and red
      # after — a canonical fetched at the lane's ref is live on merge for every caller, so the
      # fleet must see the finding before it can fail on it. A repository with no copy passes: that
      # is the end state (the lanes fetch the canonical themselves), not a gap.
      - name: Fetch the platform's resolver-copy guard and the canonical resolver at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the resolver-copy guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-resolver-copy.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-resolver-copy.py" \
            || { echo "::error::could not fetch .github/scripts/check-resolver-copy.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-resolver-copy.py" | grep -q "check-resolver-copy" || { echo "::error::the fetched check-resolver-copy.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/resolve-platform.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/resolve-platform.canonical.py" \
            || { echo "::error::could not fetch .github/scripts/resolve-platform.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — the canonical the copy is compared against is unreadable, and a guard that cannot read its subject must not pass"; exit 1; }
          head -c 400 "$RUNNER_TEMP/resolve-platform.canonical.py" | grep -q "resolve-platform" || { echo "::error::the fetched resolve-platform.py at ${SCRIPTS_REF} does not look like the resolver"; exit 1; }
      - name: "A vendored resolver that drifted is named — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-resolver-copy.py" --self-test
      - name: "This repo's vendored resolve-platform.py matches the platform's canonical (advisory until the guard's flip date, red after)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-resolver-copy.py" --root . --canonical "$RUNNER_TEMP/resolve-platform.canonical.py"

      # 🚨 AND THE SAME RULE FOR THE LOCAL NODE-TEST HARNESS (MeshWeaver#4785). `run-node-tests.py`
      # is the command AGENTS.md tells an author to run before pushing, and it IMPORTS
      # `compile-check.py` — a canonical whose surface moves. It existed only as three vendored
      # copies, so when core #4711 replaced the compile model and removed `usings_union` they broke
      # at once and DIFFERENTLY (Reinsurance: AttributeError before a single test ran, its own
      # self-test still green; Crm: a locally re-derived union, so it kept running against a model
      # the gate had abandoned; Plugins: alive only via a vendored compile-check fork carrying the
      # removed helper) — and not one lane in the fleet was red, because no CI job invoked the
      # caller. The canonical now lives in core and a satellite keeps a LAUNCHER. This guard refuses
      # the copy coming back; `run-node-tests.py --self-test` in core's own CI is what proves the
      # canonical still reproduces the gate. A repo with no launcher at all passes — it invokes the
      # canonical directly, which is also an end state.
      - name: Fetch the platform's node-test launcher guard at the lane's scripts ref
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the node-test launcher guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-node-test-launcher.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-node-test-launcher.py" \
            || { echo "::error::could not fetch .github/scripts/check-node-test-launcher.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-node-test-launcher.py" | grep -q "check-node-test-launcher" || { echo "::error::the fetched check-node-test-launcher.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
      - name: "A re-vendored node-test harness is named — the gate can fail (self-test)"
        run: python3 "$RUNNER_TEMP/check-node-test-launcher.py" --self-test
      - name: "This repo's scripts/run-node-tests.py launches the platform's canonical, and carries no copy of it"
        run: python3 "$RUNNER_TEMP/check-node-test-launcher.py" --root .

      # 🚨 A 40-HEX SUBSTITUTION CANNOT SEE AN ABBREVIATED SHA, and the pin-move procedure in every
      # node repo's ci.yml is exactly such a substitution ("move each value by grepping its OLD
      # value"). The narrative comment names the pin SHORT — `core <9-hex>` — so the sed moves the
      # `uses:`/`platform-ref:` literals and the SET NAME beside it, and leaves the commit. What
      # remains reads "<new set> / core <old short sha>": new set, old commit, stated confidently.
      #
      # (Written with placeholders on purpose: a real short sha here would be flagged by this very
      # guard, correctly — it would name a commit this file does not pin. It caught exactly that
      # when this comment first quoted one.)
      #
      # Measured 2026-09-09: this fired in THREE repos in one session (MeshWeaver.Reinsurance,
      # MeshWeaver.Crm, MeshWeaver.Manufacturing), each caught by hand. Reinsurance's own ci.yml
      # records having had the same class before — "the previous pin's comment said ci.6353 while
      # the pin was ci.6469" — which is what makes it a guard rather than a fourth catch.
      - name: "An abbreviated sha resolves in its own file — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-abbreviated-shas.py" --self-test
      - name: "No pin comment names a commit this repo no longer pins"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-abbreviated-shas.py" --root .

      # 🚨 A DUPLICATE MAPPING KEY IS ACCEPTED SILENTLY AND THE LAST ONE WINS (Systemorph/MeshWeaver#3579).
      # `yaml.safe_load` — the loader the guard above and every other guard in this fleet uses — takes
      # the last of two identical keys without a word. So a workflow can carry a second `with:`, parse
      # cleanly, pass every shape check, and run the job with a value the diff does not show.
      #
      # Measured 2026-09-07, in this very lane's caller contract: a patcher adopting the
      # `centralized-gen-manifests` input below found the job's end with `s.index("\n  ", i)`, which
      # also matches `"\n    with:"`, and appended a SECOND `with:` to the `validate:` job in
      # MeshWeaver.Education and MeshWeaver.Crm. The `uses:` sha had moved to the new lane; the
      # effective `platform-ref` had not — so this lane would have fetched its central guard scripts,
      # and the canonical gen-manifests.py, at the OLD ref while running the NEW lane. Caught by
      # reading the rendered block, by nothing else.
      #
      # `Platform pins name one build` models only the subset whose EFFECT is a pin mismatch, only in
      # the repos where it is a required context (MeshWeaver.SocialMedia and .Crm yes; .Reinsurance
      # and .Education no), and only after a full run. A duplicated `if:`, `env:`, `needs:` or
      # `timeout-minutes:` is invisible to it and to everything else. This gate is the general form:
      # any duplicate key, any mapping, at the first job. It needs NO credential, so it runs on forks
      # and on Dependabot pull requests too.
      - name: Fetch the platform's duplicate-key guard at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the duplicate-key guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-workflow-yaml-keys.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-workflow-yaml-keys.py" \
            || { echo "::error::could not fetch .github/scripts/check-workflow-yaml-keys.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-workflow-yaml-keys.py" | grep -q "check-workflow-yaml-keys" || { echo "::error::the fetched check-workflow-yaml-keys.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          # Do not lean on the timeout guard above having installed it — a reorder there would
          # break this step with an ImportError instead of a verdict.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: "No workflow mapping writes a key twice — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-yaml-keys.py" --self-test
      - name: "No mapping in this repo's workflows writes a key twice"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-workflow-yaml-keys.py" --root .

      # 🚨 A DEPENDABOT RUN READS A DIFFERENT SECRET STORE (Systemorph/MeshWeaver#3399, a recurrence
      # of #2249). `secrets.X` resolves against Settings → Secrets and variables → **Dependabot**,
      # a PARTIAL mirror of the Actions store; there is no Dependabot *variables* store, so `vars.X`
      # is single-store and only `secrets.X` is doubled. Provision a name on the Actions tab alone
      # and every other run is fine while a Dependabot PR reads it EMPTY — and the maintainer who
      # opens the Actions tab finds it sitting right there and blames the workflow.
      #
      # This gate is STATIC and needs no credential: every `secrets.NAME` a pull-request-reachable
      # job consumes must be asserted by a preflight in the same repo, so an empty value is named
      # at the first job. Measured on MeshWeaver.Reinsurance#128: preflight PASSED and compile-check
      # died one job later with `compose-sealed-modules.sh: --registry-url needs --registry-key`,
      # a message that names no secret at all, because nothing had asked for MW_REGISTRY_KEY.
      #
      # A name legitimately passed but never consumed on a PR — or asserted inside a shared lane
      # this repo only CALLS, which the guard cannot see through — is declared once, with a reason,
      # in the caller's `.github/pr-secret-preflight-allow.txt`. A stale entry there fails too.
      - name: Fetch the platform's PR-secret preflight guard at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the PR-secret guard has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/check-pr-secret-preflight.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/check-pr-secret-preflight.py" \
            || { echo "::error::could not fetch .github/scripts/check-pr-secret-preflight.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
          head -c 400 "$RUNNER_TEMP/check-pr-secret-preflight.py" | grep -q "check-pr-secret-preflight" || { echo "::error::the fetched check-pr-secret-preflight.py at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          # Do not lean on the timeout guard above having installed it — a reorder there would
          # break this step with an ImportError instead of a verdict.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
      - name: "Every PR-reachable secret is asserted by a preflight — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-pr-secret-preflight.py" --self-test
      - name: "Every PR-reachable secret in this repo is asserted by a preflight"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-pr-secret-preflight.py" --root .
      # ── THE NO-OP SET THIS REPO OWNS STILL AGREES WITH THE PLATFORM'S ──
      # 🚨 `node-repo-scope.py` decides which module bundles a pull request rebuilds and which
      # module SUITES it runs, and half that decision reads a set the CALLER owns: NOOP_DIRS in
      # `scripts/affected-modules.py`, hand-written in two repositories. When the caller's copy
      # stops PARSING — renamed, reformatted, moved — the platform answers "cannot verify" with a
      # full run on every pull request, forever, and the only trace is one line inside the log of
      # the job it disabled. That is the "a guard whose subject moved while its roots did not"
      # shape, and this is where it is caught. (A mere DIVERGENCE no longer costs the run: the
      # scope script narrows on the intersection, so a divergent dir is over-built, never skipped
      # — this reds only when a dir the repo ACTUALLY HAS is classified differently, which is
      # runner time being spent. `app` missing from three satellites' copies is dormant in all
      # three: none of them has an `app/`.)
      # Static, two files and a directory listing — no credential, so it runs on forks too.
      - name: Fetch the platform's no-op parity guard at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the no-op parity guard has no ref to be fetched at"; exit 1; }
          for script in check-noop-scope-parity.py node-repo-scope.py; do
            gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/${script}?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/${script}" \
              || { echo "::error::could not fetch .github/scripts/${script} at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the guard needs the older lane"; exit 1; }
            head -c 400 "$RUNNER_TEMP/${script}" | grep -q "${script%.py}" || { echo "::error::the fetched ${script} at ${SCRIPTS_REF} does not look like the guard"; exit 1; }
          done
      - name: "This repo's no-op set is comparable and agrees — the gate can fail (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-noop-scope-parity.py" --self-test
      - name: "This repo's no-op set agrees with the platform's"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/check-noop-scope-parity.py" --root .
      # 🚨 ONE implementation of the version derivation, every repo. Fetched exactly like the two
      # guards above and like compile-check.py: asserted RED when unavailable, never fallen back to
      # a drifted per-repo copy. The fetch and the self-test run on EVERY call, whichever copy is
      # believed below, so "the platform's checker is intact" is never a thing a run can skip.
      - name: Fetch the platform's manifest checker at the lane's scripts ref
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS_REF: ${{ inputs.scripts-ref || inputs.platform-ref }}
        run: |
          set -euo pipefail
          [ -n "${SCRIPTS_REF:-}" ] || { echo "::error::scripts-ref / platform-ref are both empty — the canonical gen-manifests.py has no ref to be fetched at"; exit 1; }
          gh api "repos/Systemorph/MeshWeaver/contents/.github/scripts/gen-manifests.py?ref=${SCRIPTS_REF}" --jq .content | base64 -d > "$RUNNER_TEMP/gen-manifests.py" \
            || { echo "::error::could not fetch .github/scripts/gen-manifests.py at ${SCRIPTS_REF} from Systemorph/MeshWeaver — a pin older than the centralization needs the older lane, not a drifted local copy"; exit 1; }
          head -c 400 "$RUNNER_TEMP/gen-manifests.py" | grep -q "manifest.lock" || { echo "::error::the fetched gen-manifests.py at ${SCRIPTS_REF} does not look like the manifest generator"; exit 1; }
      - name: "The manifest checker can fail — --resolve, the trunk baseline and the config contract (self-test)"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}   # an independent guard REPORTS; only a PREREQUISITE masks it (#4784)
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --self-test

      # manifest.lock calls itself CI-verified; this is what verifies it. A stale lock means a
      # module's recorded content hash — and the version derived from it — describes a tree that
      # no longer exists, which is exactly what a dependent's pin would be trusting.
      - name: Every manifest.lock is current (and carries a version)
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' && inputs.centralized-gen-manifests }}   # reports; only a PREREQUISITE masks it (#4784)
        env:
          MW_REPO_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --check
      - name: "Every manifest.lock is current — this repo's VENDORED copy, not yet centralized"
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' && !inputs.centralized-gen-manifests }}   # reports; only a PREREQUISITE masks it (#4784)
        run: python3 scripts/gen-manifests.py --check
      # 🚨 …and the version is the RIGHT one — but ONLY on main, and that restriction is the
      # point. The patch is derived from a baseline that MOVES (the highest published tag plus
      # the trunk's committed lock), so a branch is correct the moment it is pushed and wrong as
      # soon as anyone else merges. Run as a PR gate it spends its time failing PRs for OTHER
      # people's merges. What a BRANCH can be held to is `--check` above: your lock describes
      # YOUR tree — content hashes, entirely local. What only MAIN can settle is the derived
      # number, so this runs as that step's POST-condition rather than as a gate.
      - name: Every module's version matches its content
        if: >
          !cancelled() && steps.ready.outputs.ok == 'true' && inputs.centralized-gen-manifests && (inputs.check-versions-always ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          MW_REPO_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/gen-manifests.py" --check-versions
      - name: "Every module's version matches its content — this repo's VENDORED copy, not yet centralized"
        if: >
          !cancelled() && steps.ready.outputs.ok == 'true' && !inputs.centralized-gen-manifests && (inputs.check-versions-always ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: python3 scripts/gen-manifests.py --check-versions
