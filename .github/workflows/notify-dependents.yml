name: Notify dependent repos

# 🚨 THE RELEASE WAVE IS PUSHED, NOT POLLED.
#
# A package is built against a PINNED platform, so when the platform releases, every plugin repo
# must rebuild and republish or its portals read `FrameworkDeclined (built against <old>, live
# <new>)` and adopt nothing. Until now that wave was only PULLED: each repo's `schedule` run noticed
# the release at its next poll, up to an interval late, and `main-cd.yml` said in prose that a
# GitHub→GitHub dispatch "never will be" added here.
#
# Both reasons that gave are now stale:
#   • "no credential in the release path" — `DEPENDENT_DISPATCH_APP_ID` / `_PRIVATE_KEY` were
#     provisioned on 2026-08-19 and, until this workflow, were referenced by NOTHING.
#   • "no hand-maintained list here" — there is none. The subscriber set is the set of repositories
#     the App is INSTALLED on, read at run time from `GET /installation/repositories`. Adding a repo
#     to the wave is installing the App on it; there is no list in this file to drift.
#
# The `schedule` poll in each repo stays as the fallback, so a lost dispatch costs one delayed wave
# rather than a missed one. What changes is that the normal case is now seconds, not an interval.
#
# 🚨 THIS JOB FAILS RED WHEN IT NOTIFIES NOBODY. Its predecessor printed "NOT CONFIGURED" and went
# green for its entire life, which is why nothing was ever notified and nobody noticed. A fan-out
# that reaches zero repositories is indistinguishable from a fan-out that never ran, so it is an
# error here — the one shape this whole file exists to prevent.

on:
  # 🚨 RUNNABLE BY HAND, AND DRY BY DEFAULT — because "is the App installed on every plugin repo?"
  # must be answerable NOW, not at the next release. The whole reason this lane exists is that its
  # predecessor reported success while notifying nobody for its entire life; a fan-out you cannot
  # test until it matters is the same bet with extra steps.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List the subscribers WITHOUT dispatching (default: true)'
        required: false
        default: true
        type: boolean
      version:
        description: 'Version to announce (dry-run ignores it)'
        required: false
        default: '0.0.0-dispatch-check'
        type: string
  workflow_call:
    inputs:
      version:
        description: 'The released version, passed to each subscriber as client_payload.version'
        required: true
        type: string
      reason:
        description: 'What released — "platform" (images) or "packages" (NuGet)'
        required: true
        type: string
      # The image the receivers rebuild AGAINST. Every satellite's bake resolves the released
      # image from these (client_payload.image / .digest / .sha) — MeshWeaver.Manufacturing refuses
      # a platform event whose payload carries no `sha256:` digest, and MeshWeaver.Education bakes
      # against `client_payload.image` verbatim. Required for reason "platform"; asserted RED.
      sha:
        description: 'The platform commit the images were built from'
        required: false
        default: ''
        type: string
      image:
        description: 'The tester image reference, pinned by digest (registry/mw-plugin-test@sha256:…)'
        required: false
        default: ''
        type: string
      digest:
        description: 'That image''s digest (sha256:…)'
        required: false
        default: ''
        type: string
    secrets:
      app-id:
        required: true
      private-key:
        required: true

jobs:
  notify:
    name: Notify dependent repos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Invariant #2: assert the inputs and fail RED naming what is missing, rather than skipping.
      - name: Assert the dispatch credential is configured
        env:
          # 🚨 `secrets.app-id` is a workflow_call secret: on a manual workflow_dispatch there is
          # no caller passing it, so it resolves to the EMPTY STRING and the assertion below
          # correctly refuses. Fall back to the repo secret for the dispatch path — without this
          # the dry run can never run, which would make the one tool for checking the fan-out
          # untestable itself.
          APP_ID: ${{ secrets.app-id || secrets.DEPENDENT_DISPATCH_APP_ID }}
          PRIVATE_KEY: ${{ secrets.private-key || secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APP_ID" ]      || missing+=("secrets.DEPENDENT_DISPATCH_APP_ID")
          [ -n "$PRIVATE_KEY" ] || missing+=("secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY")
          # 🚨 `needs.<skipped-job>.outputs.*` is the EMPTY STRING, not an error. A CD run once
          # published and then died on exactly that (#2496). An empty version here would fan a
          # release event carrying no version out to the whole fleet, so refuse instead.
          [ -n "$VERSION" ]     || missing+=("inputs.version (empty — did the job producing it skip?)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::%s is not set — the release wave cannot be pushed and every plugin repo would wait for its next schedule poll.\n' "${missing[@]}"
            exit 1
          fi

      - name: Mint an installation token for the subscriber repos
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id || secrets.DEPENDENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.private-key || secrets.DEPENDENT_DISPATCH_APP_PRIVATE_KEY }}
          owner: Systemorph
          # No `repositories:` — the token spans every repo the App is installed on, which IS the
          # subscriber set. `contents: read` is not enough: repository_dispatch needs write.
          permission-contents: write

      - name: Fan the release out to every subscriber
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason || 'manual-check' }}
          DRY_RUN: ${{ inputs.dry-run }}
          SHA: ${{ inputs.sha }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail

          # 🚨 A platform release names the image it released, or it is not a release event. The
          # receivers gate against client_payload.image / .digest, and an event without them makes
          # every one of them either refuse (Manufacturing) or bake against nothing (Education).
          if [ "$REASON" = "platform" ]; then
            [ -n "$IMAGE" ]  || { echo "::error::reason=platform but inputs.image is empty — the receivers cannot know what to rebuild against."; exit 1; }
            case "$DIGEST" in sha256:*) ;; *) echo "::error::reason=platform but inputs.digest is '$DIGEST', not a sha256: digest."; exit 1 ;; esac
            [ -n "$SHA" ]    || { echo "::error::reason=platform but inputs.sha is empty."; exit 1; }
          fi
          # `source` and `chain` are what the receivers' cycle guard reads (client_payload.chain in
          # node-repo-publish-bake.yml): a platform release carries Plugins in its chain because
          # Plugins is baked WITH the platform, so no dependent may dispatch back to it. Any other
          # reason (release-packages.yml sends "packages") is its own root — labelling it "platform"
          # would claim an image release that did not happen and seed the chain with a Plugins
          # publication that was never made.
          payload=$(jq -cn --arg v "$VERSION" --arg r "$REASON" --arg sha "$SHA" --arg i "$IMAGE" --arg d "$DIGEST" \
            '{version:$v, reason:$r, sha:$sha, image:$i, digest:$d, source:$r,
              chain:(if $r == "platform" then ["platform","plugins"] else [$r] end)}')
          echo "payload: $payload"

          # 🚨 INSTALLATION IS NOT SUBSCRIPTION. The App is installed org-wide for OTHER reasons
          # (GitSync), so its installation list is 33 repositories — customer and solution repos
          # included. Measured on the first dry run (run 33275415742): 33 installed, and exactly
          # FIVE declare a `meshweaver-framework-released` receiver. Dispatching to the other 28
          # is not harmful — a repo with no receiver runs nothing — but it is wrong, unreviewable,
          # and it makes "who is subscribed?" unanswerable from the release side.
          #
          # So subscription is DISCOVERED: a repo is a subscriber iff its ci.yml declares the
          # event. Still no hand-maintained list — adding a receiver to a repo subscribes it, which
          # is the same property the installation list was reached for, minus the over-reach.
          installed=$(gh api --paginate /installation/repositories \
                        --jq '.repositories[].full_name' | sort -u)
          repos=""
          for candidate in $installed; do
            # 🚨 RAW, not base64. `--jq '.content' | base64 -d` works on macOS and FAILS on the
            # GNU coreutils base64 the runner has: GitHub wraps the payload in newlines, which GNU
            # rejects as invalid input unless --ignore-garbage. Every probe then fails silently and
            # EVERY repo looks like a non-subscriber — measured on run 33276934253:
            # "installed: 33  declaring a receiver: 0", against 5 when the same check is run
            # locally. The Accept header returns the file directly and has no such trap.
            if gh api "repos/$candidate/contents/.github/workflows/ci.yml" \
                 -H "Accept: application/vnd.github.raw" 2>/dev/null \
                 | grep -q 'meshweaver-framework-released'; then
              repos="$repos$candidate"$'\n'
            fi
          done
          repos=$(printf '%s' "$repos" | sed '/^$/d' | sort -u)
          echo "installed: $(echo "$installed" | wc -l | tr -d ' ')  declaring a receiver: $(echo "$repos" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ -z "$repos" ]; then
            echo "::error::NO repository declares a meshweaver-framework-released receiver, so this"
            echo "::error::release notified nobody. Either the App lost access, or every receiver was"
            echo "::error::removed. A fan-out reaching zero subscribers is exactly the silent no-op"
            echo "::error::this job replaced, so it is an error rather than a quiet success."
            exit 1
          fi

          echo "Subscribers ($(echo "$repos" | wc -l | tr -d ' ')):"
          echo "$repos" | sed 's/^/  /'

          # The dry run answers the only question that matters before a real release: does this
          # App reach every repo that must rebuild? It dispatches nothing, so it is safe to run at
          # any time and proves the wiring without waiting for a release to test it.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry-run: no dispatches sent. The list above is who WOULD be notified."
            exit 0
          fi

          # 🚨 Every failure is COLLECTED, never fatal on the first one. A wave that stops at the
          # first unreachable repo leaves the rest of the fleet stale for an interval, and the
          # partial state is invisible. Notify everyone, then report.
          failed=""
          for repo in $repos; do
            if jq -cn --argjson p "$payload" '{event_type:"meshweaver-framework-released", client_payload:$p}' \
                 | gh api -X POST "/repos/$repo/dispatches" --input - 2>dispatch.err; then
              echo "  dispatched → $repo"
            else
              # A repo with no `repository_dispatch:` receiver still ACCEPTS the POST (204) and
              # simply runs nothing, so a failure here is a real problem — permissions, or the repo
              # is gone — and must be named rather than counted.
              echo "::warning::dispatch FAILED → $repo: $(tr -d '\n' < dispatch.err)"
              failed="$failed $repo"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::the release wave did not reach:$failed"
            echo "::error::Those repos will rebuild at their next schedule poll instead of now."
            exit 1
          fi
          echo "release $VERSION ($REASON) pushed to every subscriber"
