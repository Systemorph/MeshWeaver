# Re-judge the PULL-REQUEST BODY gates when the body is EDITED — without re-running the build.
#
# 🚨 THE GAP. The declaration gates of `MeshWeaver Build and Test` (Pairs-with, Satellite-pins,
# Implementers, Mirror-sync, closing keywords — every job that `needs: [pr-body]`) judge the body as
# the run's `pr-body` job read it, and that workflow does not fire on `edited`. So a body edit that
# FIXES a red declaration left `Consolidate test results` red until somebody re-ran the failed jobs by
# hand, and an edit that BREAKS one left a green that was no longer true.
#
# WHY A LANE AND NOT `edited` ON dotnet-test.yml: that workflow's concurrency group cancels the
# in-flight run of the same pull request, so every title or body edit would throw a running build
# away, and an edit run would still have to publish the required context (a skipped required context
# counts as satisfied).
#
# 🚨 THIS LANE NEVER CANCELS ANYTHING. It acts on the EXISTING run of THIS pull request, re-running ONE
# job — `pr-body`, by id — and only when a body gate's verdict on the OLD body differs from its verdict
# on the CURRENT body (judged with the same gate scripts, through scripts/preflight-pr.py;
# Doc/Architecture/PrePrPreflight). Its dependents (the gates, the stage gate, the aggregator) follow.
# When the run is still in progress it WAITS for it to finish (a bounded script poll) and re-runs on the
# finished run; when every gate's verdict holds, nothing re-runs. Never `rerun-failed-jobs`, and the
# re-run is refused red if a /review answered/i job would be in its `needs:` subtree, computed from the
# workflow AT THE RUN'S OWN REVISION. `.github/scripts/pr-body-regate.py` holds the table and its
# self-test proves every arm.
#
# Not a gate and not a required context: it only re-runs the run that carries the required check. A
# FORK's head is exempt on the EVENT (GitHub gives a fork's run no secrets and a read-only token, so
# nothing here could re-run anything); re-run its `pr-body` job by hand.
name: Pull-request body edited (re-judge the body gates)

on:
  pull_request:
    types: [edited]

permissions:
  actions: write          # list the Build-and-Test runs and jobs; re-run ONE job by id (never cancel)
  contents: read
  pull-requests: read     # read the current body and head
  issues: read            # the closing-keyword gate reads issue labels


jobs:
  regate:
    name: Re-judge the body gates after an edit
    # The exemptions are on the EVENT, never on a secret: only a BODY change matters, and a fork gets
    # neither the App credential nor a token that can re-run.
    if: ${{ github.event.changes.body != null && github.event.pull_request.head.repo.full_name == github.repository }}
    # JOB-level, so only the edits this `if:` admits (body changes) share it — a title-only edit skips the
    # job and never enters the group. NOT cancel-in-progress: a lane that has decided must be able to post
    # its re-run; a newer body edit queues behind it (GitHub keeps the newest pending one) and judges the
    # newer body once this one is done.
    concurrency:
      group: pr-body-edited-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 45 (the fleet's cap) = the regate script's 40-minute bounded wait for a running build + the gates.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        # The gates compare against the MERGE BASE with the base branch, exactly as the run's jobs do.
        fetch-depth: 0

    - name: Assert the cross-repo read credential, or fail naming what to provision
      env:
        FLEET_READER_APP_ID: ${{ secrets.FLEET_READER_APP_ID }}
        FLEET_READER_APP_PRIVATE_KEY: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
      run: |
        missing=()
        [ -n "${FLEET_READER_APP_ID:-}" ] || missing+=("secrets.FLEET_READER_APP_ID            app id of the org's READ-ONLY fleet-reader GitHub App — set it in BOTH the Actions and the Dependabot secret stores (gh secret set NAME --repo Systemorph/MeshWeaver, then again with --app dependabot)")
        [ -n "${FLEET_READER_APP_PRIVATE_KEY:-}" ] || missing+=("secrets.FLEET_READER_APP_PRIVATE_KEY   that App's private key (PEM), in BOTH stores like the id")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::The pair gate cannot resolve a declared counterpart, so the edited body cannot be judged — provision the following, then re-run:"
          for m in "${missing[@]}"; do echo "  • $m"; done
          exit 1
        fi
        echo "Credential inputs are present (the mint below proves them)."

    # The same App and repository list as the run's `cross-repo-pair` job, so the pair gate here can
    # resolve exactly the counterparts it can resolve there.
    - name: Mint a read-only installation token for the fleet
      id: fleet-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.FLEET_READER_APP_ID }}
        private-key: ${{ secrets.FLEET_READER_APP_PRIVATE_KEY }}
        owner: Systemorph
        repositories: >-
          MeshWeaver,MeshWeaver.Plugins,MeshWeaver.Education,MeshWeaver.Reinsurance,MeshWeaver.SocialMedia,MeshWeaver.Manufacturing,Memex,CreditReRate,DecisionModels,MeshWeaver.Deploy
        permission-contents: read
        permission-pull-requests: read

    # 🚨 Both self-tests FIRST: an unproven decision table, or a preflight that cannot say red, must
    # not decide whether a required check is re-run.
    - name: "The re-gate decision table acts only when the run's verdict went stale (self-test)"
      run: python3 .github/scripts/pr-body-regate.py --self-test
    - name: "The preflight says red, green and skipped, each for its own reason (self-test)"
      run: python3 -I scripts/test-preflight-pr.py

    - name: Re-judge the current body and re-run what went stale
      env:
        # Actions API (list, read the run's workflow revision, re-run one job) and the closing-keyword gate's issue reads (through gh).
        REGATE_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        # The pair gate resolves counterparts in sibling repositories with the fleet token.
        GITHUB_TOKEN: ${{ steps.fleet-token.outputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EDITED_AT: ${{ github.event.pull_request.updated_at }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        python3 .github/scripts/pr-body-regate.py \
          --repo "$REPO" --pr "$PR" --head "$HEAD_SHA" --edited-at "$EDITED_AT" --base-ref "$BASE_REF"
