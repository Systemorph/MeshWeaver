name: Publish to GitHub Packages

# 🚨 RETIRED BY POLICY, kept only because nothing has decided to delete it: NuGet/package
# publication stopped with the rc line — in-mesh source compiles against the platform IMAGE, module
# bundles carry their own closures, and satellites build inside `mw-plugin-test`
# (Doc/Architecture/ReleaseProcess §5). Nothing in the fleet restores a MeshWeaver package, and
# `release.yml` publishes none.
#
# The `-rc*` / `-preview*` tag globs are GONE because those lines can never be minted again: the
# version scheme has exactly two shapes, `X.Y.Z-ci.<n>` and clean `X.Y.Z`
# (Doc/Architecture/ReleaseProcess §1, maintainer 2026-09-07). A trigger for a shape nothing can
# produce is a lane that reads as live and is not.
on:
  push:
    tags:
      - 'github-*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish-github:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/github-}" >> $GITHUB_ENV

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore /p:Version=${{ env.VERSION }}

      - name: Pack NuGet packages
        run: dotnet pack --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.VERSION }}

      - name: Create nuget.config
        run: |
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <configuration>
            <packageSources>
              <add key=\"github\" value=\"https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json\" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key=\"Username\" value=\"${{ github.actor }}\" />
                <add key=\"ClearTextPassword\" value=\"${{ secrets.GH_PAT }}\" />
              </github>
            </packageSourceCredentials>
          </configuration>" > nuget.config

      - name: Publish NuGet packages to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source "github" --api-key ${{ secrets.GH_PAT }}