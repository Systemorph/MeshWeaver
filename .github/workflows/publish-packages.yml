name: Publish the surviving NuGet packages

# ═══════════════════ ONE SURVIVING PACKAGE IS PUBLISHED HERE ═══════════════════
#
# Maintainer, 2026-09-07: "we retire most nuget packages completely … we leave the dotnet new
# package and the aspire integration". Everything else under the MeshWeaver prefix is retired and
# unlisted (Doc/Architecture/NuGetPackageRetirement; scripts/orphaned-nuget-packages.py).
#
#   MeshWeaver.Cli                    src/MeshWeaver.Cli                       (THIS repo)  ← published here, on a dispatch
#   MeshWeaver.Aspire.Hosting.Memex   src/Memex.Aspire.Hosting                 (MeshWeaver.Plugins) ← its publish-aspire-package.yml
#   MeshWeaver.MemexTemplate          tools/MeshWeaver.MemexTemplate.Pack      (MeshWeaver.Plugins) ← not published yet, see below
#
# The Aspire integration's SOURCE moved to MeshWeaver.Plugins with the core-slimming carve (it was
# memex/aspire/Memex.Aspire.Hosting), so its pack moved with it: a lane packs what its own
# repository holds. scripts/orphaned-nuget-packages.py declares both Plugins-packed survivors in
# PACKED_ELSEWHERE, so the retirement sweep can never read them as orphaned.
#
# policy `cli-thin-wrapper-own-version` (Doc/Architecture/PolicyNotProse): a customer's dedicated build server installs the CLI
# with `dotnet tool install` and has no MeshWeaver checkout. Like `gh`, the CLI is a thin client (REST
# for the mesh verbs, the platform IMAGE for build and test), so it is versioned by its own csproj
# <CliVersion> and released RARELY — when the CLI changes, never with every platform build. A dispatch
# publishes the version MeshWeaver.Cli.csproj declares and refuses any other.
# The CLI references no MeshWeaver framework assembly (System.CommandLine only) — an ENTRY POINT,
# not platform bytes: it is never loaded into a portal and never participates in the NodeType bake
# identity, which is what makes packing it here harmless (see "why pack rather than promote" below).
#
# ───────────────────────────── WHY THE RELEASE TAG, NOT EVERY MERGE ─────────────────────────────
# The platform ships CONTINUOUSLY as images (3.0.0-ci.<n> per green merge) and a release is a
# PROMOTION of one sealed set (Doc/Architecture/ReleaseProcess). These two packages cannot follow
# that model, for one measured reason: nuget.org orders by SemVer, and `-ci.<n>` does NOT sort the
# way the fleet's self-updater ranks it. Publishing the continuous stream to nuget.org would
# reproduce the rc line's defect exactly — `rc9` sat above `rc13` on nuget.org for a whole run — and
# would put hundreds of throwaway versions in front of consumers whose only question is "what is the
# current one". So: a clean X.Y.Z, never the continuous stream. (The CLI's X.Y.Z is its own version;
# the Aspire integration's is the platform release, dispatched in MeshWeaver.Plugins.)
#
# 🚨 WHY PACK RATHER THAN PROMOTE. release.yml promotes because the bytes already exist in a
# registry; no nupkg is ever built by main-cd, so there is nothing to retag and the CLI is packed
# here. That reintroduces "built at publish time" — the thing release.yml exists to avoid — for
# exactly this project, and it is safe only because it is not a platform assembly. The moment it
# grows a dependency on a MeshWeaver framework assembly, this lane is wrong and must take its bytes
# from a sealed set instead.
#
# ──────────────────── THE GUI QUESTION IS ANSWERED; THE WIRING IS NOT BUILT ───────────────────
# MeshWeaver.MemexTemplate is a survivor by decision and is still NOT published here — but the
# reason has changed, and the old one no longer holds. What was measured on 2026-09-07:
#
#   • generate-memex-template.cs REFUSED to generate without `--with-gui`: the two shipped hosts
#     referenced Memex.Portal.Gui unconditionally, so a template without it could not build.
#   • Memex.Portal.Gui lives ONLY in Systemorph/MeshWeaver.Plugins, which is PRIVATE. Core holds
#     zero .razor files and no MeshWeaver.Blazor* project — the GUI has fully left the public repo.
#   • The published 3.0.0-rc7 template contains NO Memex.Portal.Gui, so shipping it WITH the GUI
#     would be a NEW public exposure, not a restoration of prior behaviour.
#   • A nupkg cannot be recalled. Unlisting hides a version from search; it stays downloadable by
#     exact version for ever (verified against this very registry).
#
# 🚨 The FIRST bullet is HISTORY: issue #3653 was decided the other way — make the GUI optional in
# the hosts — and Systemorph/MeshWeaver.Plugins#1591 landed it. Both hosts now reference
# Memex.Portal.Gui from a CONDITIONED ItemGroup and compile without it, the generator drops an
# optional project it is not shipping (refusing by name if the reference is unconditional), and
# `dotnet pack tools/MeshWeaver.MemexTemplate.Pack` succeeds with no `--with-gui` and no
# Memex.Portal.Gui in the nupkg. So there IS a GUI-less template to publish, and publishing it
# does not publish the GUI.
#
# What is still missing is a lane's own wiring, and it is a real task, not a formality. Its natural
# home is now MeshWeaver.Plugins, beside publish-aspire-package.yml — where the template's sources
# already are — rather than this repository. Adding the step needs: a Plugins checkout with a MINTED App token (never a stored PAT — the predecessor
# publish-github.yml carried secrets.GH_PAT and is deleted), `-p:Version=X.Y.Z` (that project
# inherits no props and would otherwise stamp 1.0.0), `-p:MeshWeaverRoot=` (the generator copies
# two projects and three assets from core and can run in NEITHER repo alone), and an answer to
# WHICH Plugins commit a core tag pairs with — no pairing artefact exists, so record the resolved
# sha in the summary at minimum. Note also that the scaffolded solution is a HEADLESS mesh host
# (no Blazor shell), which the generated README states; publishing it is a product call about what
# `dotnet new meshweaver-memex` should hand a newcomer, not a packaging one.
#
# Until that step exists the template's publish is ABSENT rather than written-and-disabled: a step
# that exists but never runs is the skip-trapdoor this repository forbids.
#
# 🛡️ NO SKIP-TRAPDOOR (AGENTS.md → "A gate NEVER tests its own inputs"): `preflight` asserts every
# secret and fails RED naming what to provision; `publish` needs it and runs unconditionally. There
# is no `continue-on-error` and no `if: secrets.X != ''`. Every job carries a literal timeout ≤ 45.
#
# 🚨 nuget.org has no App-token equivalent — an API key is the only credential it accepts — so
# nuget.org is reached by Trusted Publishing (GitHub OIDC via NuGet/login — no stored NuGet secret), exactly as unlist-orphaned-packages.yml does. The App token replaces
# the stored GitHub PAT, which is the one this repository could actually stop storing.

# The run-name says what is published, and a dry run — which pushes nothing — says so in its title.
run-name: "Publish MeshWeaver.Cli ${{ inputs.version || 'csproj version' }}${{ inputs.dry-run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Empty = the <Version> MeshWeaver.Cli.csproj declares; any other value is refused."
        type: string
        default: ""
      ref:
        description: "Commit to pack. Empty = the dispatched ref."
        type: string
        default: ""
      dry-run:
        description: "Pack and verify, but do not push to nuget.org"
        type: boolean
        default: false

permissions:
  contents: read

# One group per (version, dry-run): a dry run never cancels a publication, and two runs of the SAME
# version serialise (`--skip-duplicate` makes the second a no-op).
concurrency:
  group: publish-packages-cli-${{ inputs.version || 'csproj' }}${{ inputs.dry-run && '-dry' || '' }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────── EVERY INPUT, ASSERTED RED ────────────────────────────
  preflight:
    name: Publish inputs are provisioned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write       # the OIDC exchange below
      contents: read
    steps:
      - name: Every input this lane consumes exists
        env:
          NUGET_TRUSTED_USER: ${{ vars.NUGET_TRUSTED_USER }}
        run: |
          set -euo pipefail
          # Only what this lane actually consumes — asserting an input nothing uses teaches a reader
          # the wrong thing about what runs.
          #
          # 🔐 nuget.org is reached by TRUSTED PUBLISHING (GitHub OIDC → NuGet/login → a short-lived
          # key), not a stored key: the policy on nuget.org names this repository and THIS workflow
          # file, and `vars.NUGET_TRUSTED_USER` is the nuget.org account that owns that policy.
          # There is nothing to rotate and nothing to leak. The exchange is PERFORMED below, so a
          # policy that does not match this file fails here, named, rather than at the push.
          missing=()
          [ -n "${NUGET_TRUSTED_USER:-}" ] || missing+=("vars.NUGET_TRUSTED_USER — the nuget.org account (user or organisation) that owns the Trusted Publishing policy for publish-packages.yml (Settings → Secrets and variables → Actions → Variables)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the surviving packages cannot be published — provision:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "every publish input is present"

      - name: The Trusted Publishing policy matches this workflow (OIDC exchange)
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_USER }}

  publish:
    name: Pack + push MeshWeaver.Cli
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write       # NuGet/login — the short-lived push key
      contents: read
    steps:
      - name: Checkout MeshWeaver (the CLI)
        uses: actions/checkout@v7
        with:
          path: meshweaver
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # The CLI's OWN version (policy `cli-thin-wrapper-own-version`): the csproj's, and only that —
      # a clean X.Y.Z, because the rc line is closed and `-ci.<n>` never reaches nuget.org.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          declared=$(dotnet msbuild meshweaver/src/MeshWeaver.Cli/MeshWeaver.Cli.csproj -getProperty:Version)
          version="${{ inputs.version }}"; version="${version:-$declared}"
          [ "$version" = "$declared" ] || { echo "::error::version '$version' is not the <Version> MeshWeaver.Cli.csproj declares ('$declared') — bump the csproj by pull request, then publish"; exit 1; }
          case "$version" in
            *[!0-9.]*|*..*|.*|*.) echo "::error::'$version' is not a clean X.Y.Z version. The rc line is closed and -ci.<n> builds are never published to nuget.org."; exit 1 ;;
          esac
          [ "$(echo "$version" | tr -cd '.' | wc -c)" -eq 2 ] || { echo "::error::'$version' is not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The id drives the pack, the count assertion and the LISTED verification, so the three
          # can never disagree.
          ids="MeshWeaver.Cli"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "publishing $ids $version (from $(git -C meshweaver rev-parse HEAD))"

      - name: Say what is being published
        run: |
          {
            echo "### Publishing MeshWeaver ${{ steps.version.outputs.version }}"
            echo "- core: \`$(git -C meshweaver rev-parse HEAD)\`"
            echo "- packages: ${{ steps.version.outputs.ids }}"
            echo "- \`MeshWeaver.Aspire.Hosting.Memex\` and \`MeshWeaver.MemexTemplate\` are packed in MeshWeaver.Plugins, not here; see the header."
          } >> "$GITHUB_STEP_SUMMARY"

      # The CLI's version is its csproj <Version>, checked equal above; -p:Version restates it.
      - name: Pack the CLI
        run: |
          set -euo pipefail
          dotnet pack meshweaver/src/MeshWeaver.Cli/MeshWeaver.Cli.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --output "$RUNNER_TEMP/nupkgs"

      # 🚨 A POSITIVE, SPECIFIC signal: the id, at this exact version, and nothing else. `dotnet
      # pack` exiting 0 having produced no package (or one under a version nobody asked for) is
      # precisely the shape of false pass this repository has paid for. The count also catches a
      # project silently regaining packability, which Directory.Build.props defaults to false.
      - name: Each package exists, at this version, and nothing else was packed
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          IDS="${{ steps.version.outputs.ids }}"
          ls -1 "$RUNNER_TEMP/nupkgs"
          expected=0
          for id in $IDS; do
            [ -f "$RUNNER_TEMP/nupkgs/$id.$V.nupkg" ] || { echo "::error::$id.$V.nupkg was not produced"; exit 1; }
            expected=$((expected + 1))
          done
          count="$(find "$RUNNER_TEMP/nupkgs" -name '*.nupkg' | wc -l | tr -d ' ')"
          [ "$count" -eq "$expected" ] || { echo "::error::expected exactly $expected package(s) ($IDS), found $count — a project has regained packability; see Directory.Build.props"; exit 1; }
          if [ -f "$RUNNER_TEMP/nupkgs/MeshWeaver.Cli.$V.nupkg" ]; then
            # A tool package that is not a TOOL installs as a library and gives no `memex` command.
            unzip -p "$RUNNER_TEMP/nupkgs/MeshWeaver.Cli.$V.nupkg" MeshWeaver.Cli.nuspec | grep -q '<packageType name="DotnetTool"' \
              || { echo "::error::MeshWeaver.Cli.$V.nupkg is not a DotnetTool package — PackAsTool is missing from MeshWeaver.Cli.csproj"; exit 1; }
            unzip -l "$RUNNER_TEMP/nupkgs/MeshWeaver.Cli.$V.nupkg" | grep -q 'tools/net10.0/any/memex.dll' \
              || { echo "::error::MeshWeaver.Cli.$V.nupkg carries no tools/net10.0/any/memex.dll"; exit 1; }
          fi
          echo "$expected package(s) at $V: $IDS"

      - name: Log in to nuget.org (Trusted Publishing — a short-lived key, nothing stored)
        if: ${{ !inputs.dry-run }}
        id: nuget_login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_USER }}

      - name: Push to nuget.org
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "$RUNNER_TEMP/nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      # 🚨 THE ONLY EVIDENCE A PUBLISH HAPPENED is nuget.org saying the version is listed. A zero
      # exit from `dotnet nuget push` reports that the call was made, not the resulting state —
      # scripts/orphaned-nuget-packages.py carries the same lesson from the other direction, where
      # fifty-five "unlisted" lines were printed over versions that still read listed=true.
      # Registration blobs rebuild asynchronously, so a not-yet-listed reading is inconclusive and
      # is polled, never reported as either outcome.
      - name: Verify every published version reads as LISTED on nuget.org
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IDS: ${{ steps.version.outputs.ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, os, sys, time, urllib.request

          version = os.environ["VERSION"]
          pending = os.environ["IDS"].split()

          def listed(package_id: str) -> bool | None:
              url = ("https://api.nuget.org/v3/registration5-gz-semver2/"
                     f"{package_id.lower()}/{version.lower()}.json")
              request = urllib.request.Request(url, headers={"Accept-Encoding": "gzip"})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      if response.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return bool(json.loads(raw).get("listed"))
              except Exception:
                  return None

          for attempt in range(1, 9):
              pending = [p for p in pending if listed(p) is not True]
              if not pending:
                  print(f"VERIFIED on attempt {attempt}: the package reads as listed at {version}")
                  sys.exit(0)
              print(f"attempt {attempt}: {', '.join(pending)} not listed yet — waiting 60s")
              time.sleep(60)

          print(f"::error::{', '.join(pending)} still do not read as listed at {version} after 8 "
                f"checks. The push reported success, so this is either a slower registration "
                f"rebuild than expected or an API key without push rights for that id. Do NOT "
                f"record this as published until a later check reads true.")
          sys.exit(1)
          PY

      - name: Say what shipped
        if: ${{ !inputs.dry-run }}
        run: |
          {
            echo "### Published to nuget.org"
            for id in ${{ steps.version.outputs.ids }}; do echo "- \`$id\` ${{ steps.version.outputs.version }}"; done
            echo ""
            echo "\`MeshWeaver.MemexTemplate\` was NOT published — this lane has no step for it yet (the GUI question is answered; see the header)"
            echo "decision recorded in Doc/Architecture/NuGetPackageRetirement."
          } >> "$GITHUB_STEP_SUMMARY"

