name: Publish the surviving NuGet packages

# ═══════════════════ TWO PACKAGES SURVIVE, AND THIS IS WHERE THEY GO ═══════════════════
#
# Maintainer, 2026-09-07: "we retire most nuget packages completely … we leave the dotnet new
# package and the aspire integration". Everything else under the MeshWeaver prefix is retired and
# unlisted (Doc/Architecture/NuGetPackageRetirement; scripts/orphaned-nuget-packages.py).
#
#   MeshWeaver.Aspire.Hosting.Memex   memex/aspire/Memex.Aspire.Hosting  (THIS repo)
#   MeshWeaver.MemexTemplate          tools/MeshWeaver.MemexTemplate.Pack (MeshWeaver.Plugins)
#
# Both are ENTRY POINTS, not platform bytes: one is the `dotnet new` template that writes a portal
# solution, the other is the AppHost-side Aspire integration whose `builder.AddMemex()` names the
# published GHCR images. Neither is loaded into a portal, neither carries a framework assembly, and
# neither participates in the NodeType bake identity — which is what makes packing them at the tag
# harmless (see "why pack rather than promote" below).
#
# ───────────────────────────── WHY THE RELEASE TAG, NOT EVERY MERGE ─────────────────────────────
# The platform ships CONTINUOUSLY as images (3.0.0-ci.<n> per green merge) and a release is a
# PROMOTION of one sealed set (Doc/Architecture/ReleaseProcess). These two packages cannot follow
# that model, for one measured reason: nuget.org orders by SemVer, and `-ci.<n>` does NOT sort the
# way the fleet's self-updater ranks it. Publishing the continuous stream to nuget.org would
# reproduce the rc line's defect exactly — `rc9` sat above `rc13` on nuget.org for a whole run — and
# would put hundreds of throwaway versions in front of consumers whose only question is "what is the
# current one". So: the clean X.Y.Z on the release tag, and nothing in between.
#
# 🚨 WHY PACK RATHER THAN PROMOTE. release.yml promotes because the bytes already exist in a
# registry; no nupkg is ever built by main-cd, so there is nothing to retag and these two are packed
# here. That reintroduces "built at the tag" — the thing release.yml exists to avoid — for exactly
# these two projects, and it is safe only because neither is a platform assembly: the adapter
# compiles against Aspire.Hosting alone and the template is content-only (IncludeBuildOutput=false).
# The moment either grows a dependency on a MeshWeaver framework assembly, this lane is wrong and
# must take its bytes from a sealed set instead.
#
# ─────────────────────────────────── THE TEMPLATE NEEDS BOTH TREES ───────────────────────────────
# generate-memex-template.cs copies six projects that split 3/3 across MeshWeaver and
# MeshWeaver.Plugins, plus three core-only assets, so it takes `<portalRoot> --core <meshweaverRoot>`
# and can run in NEITHER repo alone. The generator lives in Plugins; this lane checks out Plugins
# with a MINTED GitHub App token (AGENTS.md / memory `mint-app-tokens-never-store-pats`: never a
# stored PAT — the predecessor publish-github.yml carried `secrets.GH_PAT` and is deleted).
#
# 🚨 WHICH PLUGINS COMMIT. A core tag names a core commit; it does not name a Plugins commit, and
# no pairing artefact exists to resolve one. This lane therefore takes Plugins' DEFAULT BRANCH and
# RECORDS the resolved sha in the job summary, so the pairing is at least observable after the fact.
# `plugins-ref` overrides it on a dispatch. When a pairing artefact appears, read it here instead.
#
# 🛡️ NO SKIP-TRAPDOOR (AGENTS.md → "A gate NEVER tests its own inputs"): `preflight` asserts every
# secret and fails RED naming what to provision; `publish` needs it and runs unconditionally. There
# is no `continue-on-error` and no `if: secrets.X != ''`. Every job carries a literal timeout ≤ 45.
#
# 🚨 nuget.org has no App-token equivalent — an API key is the only credential it accepts — so
# `secrets.NUGET_PAT` stays, exactly as unlist-orphaned-packages.yml uses it. The App token replaces
# the stored GitHub PAT, which is the one this repository could actually stop storing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 3.0.0). Required on a dispatch; the tag supplies it otherwise."
        type: string
        default: ""
      plugins-ref:
        description: "MeshWeaver.Plugins ref holding the template generator (default: its default branch)"
        type: string
        default: ""
      dry-run:
        description: "Pack and verify, but do not push to nuget.org"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  # ──────────────────────────── EVERY INPUT, ASSERTED RED ────────────────────────────
  preflight:
    name: Publish inputs are provisioned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every secret this lane consumes exists
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_PAT }}
          APP_ID: ${{ secrets.MESHWEAVER_APP_ID }}
          APP_KEY: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${NUGET_API_KEY:-}" ] || missing+=("secrets.NUGET_PAT — the nuget.org API key with push rights for the MeshWeaver prefix (Settings → Secrets → Actions)")
          [ -n "${APP_ID:-}" ]  || missing+=("secrets.MESHWEAVER_APP_ID — the meshweaver-cloud GitHub App that reads Systemorph/MeshWeaver.Plugins for the template generator")
          [ -n "${APP_KEY:-}" ] || missing+=("secrets.MESHWEAVER_APP_PRIVATE_KEY — its private key (Key Vault Systemorph, secret github-app-privatekey)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the surviving packages cannot be published — provision:"
            for m in "${missing[@]}"; do echo "  • $m"; done
            exit 1
          fi
          echo "every publish input is present"

      - name: A dispatch must name the version
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        run: |
          echo "::error::workflow_dispatch needs a version input (e.g. 3.0.0) — there is no tag to read it from."
          exit 1

  publish:
    name: Pack + push the two survivors
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout MeshWeaver (the platform, and the Aspire adapter)
        uses: actions/checkout@v7
        with:
          path: meshweaver

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # The clean X.Y.Z. A tag pushes `refs/tags/v3.0.0`; a dispatch names it outright. The rc line
      # is closed and `-ci.<n>` never reaches nuget.org, so anything but three numbers is refused
      # rather than silently published under a label that sorts unpredictably.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          case "$version" in
            *[!0-9.]*|*..*|.*|*.) echo "::error::'$version' is not a clean X.Y.Z version. The rc line is closed and -ci.<n> builds are never published to nuget.org."; exit 1 ;;
          esac
          [ "$(echo "$version" | tr -cd '.' | wc -c)" -eq 2 ] || { echo "::error::'$version' is not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version"

      - name: Mint the App token for the plugins repository
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MESHWEAVER_APP_ID }}
          private-key: ${{ secrets.MESHWEAVER_APP_PRIVATE_KEY }}
          owner: Systemorph
          repositories: MeshWeaver.Plugins
          permission-contents: read

      - name: Checkout MeshWeaver.Plugins (the template generator)
        uses: actions/checkout@v7
        with:
          repository: Systemorph/MeshWeaver.Plugins
          ref: ${{ inputs.plugins-ref }}
          token: ${{ steps.app.outputs.token }}
          path: plugins

      # 🚨 A core tag does not name a Plugins commit. Record which one was used, so the pairing is
      # observable after the fact rather than reconstructed from timestamps.
      - name: Record the Plugins commit this template is generated from
        id: pluginsref
        run: |
          set -euo pipefail
          sha="$(git -C plugins rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "MeshWeaver.Plugins @ $sha"
          {
            echo "### Publishing MeshWeaver ${{ steps.version.outputs.version }}"
            echo "- core: \`${GITHUB_SHA}\`"
            echo "- plugins: \`$sha\` (${{ inputs.plugins-ref || 'default branch' }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # PublicRelease=true is what makes $(Version) the clean $(PlatformVersion) rather than
      # $(PlatformVersion)-ci.<run> (Directory.Build.props §2). PlatformVersion is passed too so a
      # tag can never publish a version the props does not agree with.
      - name: Pack the Aspire integration
        run: |
          set -euo pipefail
          dotnet pack meshweaver/memex/aspire/Memex.Aspire.Hosting/Memex.Aspire.Hosting.csproj \
            -c Release \
            -p:PublicRelease=true \
            -p:PlatformVersion=${{ steps.version.outputs.version }} \
            --output "$RUNNER_TEMP/nupkgs"

      # 🚨 -p:Version, not -p:PlatformVersion. The template pack lives under the plugins repo's
      # tools/, which inherits NO Directory.Build.props, so it never sees the platform's version
      # scheme and would otherwise pack under the SDK default 1.0.0. MeshWeaverRoot is passed
      # because the generator copies three projects and three assets out of the platform tree; the
      # project fails the pack with a named error if it does not point at a real checkout.
      - name: Pack the dotnet new template
        run: |
          set -euo pipefail
          dotnet pack plugins/tools/MeshWeaver.MemexTemplate.Pack/MeshWeaver.MemexTemplate.Pack.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:MeshWeaverRoot="$GITHUB_WORKSPACE/meshweaver" \
            --output "$RUNNER_TEMP/nupkgs"

      # 🚨 A POSITIVE, SPECIFIC signal: both ids, at this exact version, and nothing else. `dotnet
      # pack` exiting 0 having produced one package (or a package under a version nobody asked for)
      # is precisely the shape of false pass this repository has paid for.
      - name: Both packages exist, at this version, and only these two
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          ls -1 "$RUNNER_TEMP/nupkgs"
          for id in MeshWeaver.Aspire.Hosting.Memex MeshWeaver.MemexTemplate; do
            [ -f "$RUNNER_TEMP/nupkgs/$id.$V.nupkg" ] || { echo "::error::$id.$V.nupkg was not produced"; exit 1; }
          done
          count="$(find "$RUNNER_TEMP/nupkgs" -name '*.nupkg' | wc -l | tr -d ' ')"
          [ "$count" -eq 2 ] || { echo "::error::expected exactly 2 packages, found $count — a project has regained packability; see Directory.Build.props"; exit 1; }
          echo "2 packages, both at $V"

      - name: Push to nuget.org
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget push "$RUNNER_TEMP/nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      # 🚨 THE ONLY EVIDENCE A PUBLISH HAPPENED is nuget.org saying the version is listed. A zero
      # exit from `dotnet nuget push` reports that the call was made, not the resulting state —
      # scripts/orphaned-nuget-packages.py carries the same lesson from the other direction, where
      # fifty-five "unlisted" lines were printed over versions that still read listed=true.
      # Registration blobs rebuild asynchronously, so a not-yet-listed reading is inconclusive and
      # is polled, never reported as either outcome.
      - name: Verify both versions read as LISTED on nuget.org
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, os, sys, time, urllib.request

          version = os.environ["VERSION"]
          pending = ["MeshWeaver.Aspire.Hosting.Memex", "MeshWeaver.MemexTemplate"]

          def listed(package_id: str) -> bool | None:
              url = ("https://api.nuget.org/v3/registration5-gz-semver2/"
                     f"{package_id.lower()}/{version.lower()}.json")
              request = urllib.request.Request(url, headers={"Accept-Encoding": "gzip"})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      if response.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      return bool(json.loads(raw).get("listed"))
              except Exception:
                  return None

          for attempt in range(1, 9):
              pending = [p for p in pending if listed(p) is not True]
              if not pending:
                  print(f"VERIFIED on attempt {attempt}: both packages read as listed at {version}")
                  sys.exit(0)
              print(f"attempt {attempt}: {', '.join(pending)} not listed yet — waiting 60s")
              time.sleep(60)

          print(f"::error::{', '.join(pending)} still do not read as listed at {version} after 8 "
                f"checks. The push reported success, so this is either a slower registration "
                f"rebuild than expected or an API key without push rights for that id. Do NOT "
                f"record this as published until a later check reads true.")
          sys.exit(1)
          PY

      - name: Say what shipped
        if: ${{ !inputs.dry-run }}
        run: |
          {
            echo "### Published to nuget.org"
            echo "- \`MeshWeaver.Aspire.Hosting.Memex\` ${{ steps.version.outputs.version }}"
            echo "- \`MeshWeaver.MemexTemplate\` ${{ steps.version.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
