# ──────────── One automatic retry for NAMED infrastructure transients ────────────
# "can't we automate this?" (maintainer, 2026-08-31) — the queue-drain labor that motivated this
# was re-running ~25-minute CI cycles whose only failures were registry blips (`connection
# refused` from ACR mid-login, the plugins registry answering 503 during #2915's window).
#
# 🚨 THIS IS NOT A FLAKE-RETRIER. The decision — the curated signature list, the EVERY-job rule,
# and the refusal to act on an unreadable log — lives in `.github/scripts/retry-known-transients.py`
# so that it can be PROVEN offline; read its module docstring before changing any of it.
#
# 🚨 WHY THE DECISION MOVED OUT OF THIS FILE (#4534). As inline shell this step read its input with
# `gh api …/actions/jobs/<id>/logs`, and between at least 2026-09-10 and 2026-09-17 that read failed
# EVERY time, fleet-wide: the hosted runner's `gh` refuses to output a body containing terminal
# escape sequences unless `--allow-escape-sequences` is passed, and every Actions log has them (each
# `run:` line is echoed as `\e[36;1m…\e[0m`). The step then printed "log unreadable … cannot prove a
# transient, no retry" and `exit 0` — a sentence that reads like a judgement, over a green tick, for
# a week, with nobody noticing. The script reads the API DIRECTLY (no `gh`, so no dependency on a
# CLI output policy that has already changed under us once) and treats "I cannot see my input" as a
# RED, never a decline. An automation that cannot read its input must say so, not pass.
name: Retry known transients

on:
  workflow_run:
    workflows: ["MeshWeaver Build and Test", "Continuous Delivery (main)"]
    types: [completed]

permissions:
  actions: write      # list the run's jobs, read their logs, POST rerun-failed-jobs
  contents: read      # check this repo out for the decision script

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 🚨 DEFAULT REF ON PURPOSE. On `workflow_run` this checks out the DEFAULT BRANCH, which is
      # what must run: the triggering run may be a fork's pull request, and this job holds
      # `actions: write`. Never add `ref: github.event.workflow_run.head_branch` — that would
      # execute an untrusted contributor's script with the token that can rerun this repo's jobs.
      - uses: actions/checkout@v7

      # An unproven gate is no gate — and this one spent a week proving exactly that. The self-test
      # is offline and takes seconds; it drives the read failures, the EVERY-job rule, and the
      # signature list in both directions, so a steward that has gone blind again cannot reach the
      # step below wearing a clean decision.
      - name: "The steward reads a log, refuses a real red, and reds when blind (self-test)"
        run: python3 .github/scripts/retry-known-transients.py --self-test

      - name: Rerun iff EVERY failure matches a named transient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/retry-known-transients.py --repo "$REPO" --run-id "$RUN_ID"
