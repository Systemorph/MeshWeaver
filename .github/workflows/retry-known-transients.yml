# ──────────── One automatic retry for NAMED infrastructure transients ────────────
# "can't we automate this?" (maintainer, 2026-08-31) — the queue-drain labor that motivated this
# was re-running ~25-minute CI cycles whose only failures were registry blips (`connection
# refused` from ACR mid-login, the plugins registry answering 503 during #2915's window).
#
# 🚨 THIS IS NOT A FLAKE-RETRIER. The decision — the curated signature and annotation lists, the
# EVERY-job rule, and the refusal to act on an input it cannot read — lives in
# `.github/scripts/retry-known-transients.py` so that it can be PROVEN offline; read its module
# docstring before changing any of it.
#
# 🚨 CORE CALLS THE SAME LANE AS EVERY SATELLITE (node-repo-retry-transients.yml). The satellites'
# hand-copied inline steward drifted from this one and went blind to runner deaths
# (MeshWeaver.Manufacturing#84); one lane, called by all, is how a fix here reaches them. Calling it
# from core too means core's own failed runs exercise the lane exactly as a satellite's do.
#
# 🚨 #4534 — why the decision is a script that reads the API directly, not inline shell around `gh`:
# the hosted runner's `gh` refuses to output a body containing terminal escape sequences, every
# Actions log has them, and for a week the steward printed "log unreadable … no retry" over a green
# tick. The script treats "I cannot see my input" as a RED, never a decline.
name: Retry known transients

on:
  workflow_run:
    workflows: ["MeshWeaver Build and Test", "Continuous Delivery (main)"]
    types: [completed]

permissions:
  actions: write      # list the run's jobs, read their logs, POST the one rerun
  checks: read        # check-runs/<job>/annotations — the only record of a runner death
  contents: read

jobs:
  # 🚨 A LOCAL `uses:` resolves at the triggering commit of the DEFAULT branch (workflow_run always
  # runs the default branch's file), never at a fork's head — this job holds `actions: write`.
  retry:
    uses: ./.github/workflows/node-repo-retry-transients.yml
    permissions:
      actions: write
      checks: read
      contents: read
