# Start core's stage 2 the moment stage 1 turns green for a held pull request head.
#
# 🔀 REQUIRED (policy review-then-suites): the stage gate holds every pull request head for its
# review by default, and this listener is what releases it — a gate without its listener holds
# forever. Never delete one without the other.
#
# The thin caller of node-repo-stage-advance.yml (the lane carries the rationale). Core's held runs
# are `dotnet-test.yml`'s pull_request runs, whose `stage-gate` job (node-repo-stage-gate.yml) failed
# because the head's automatic review had not landed or a finding was unanswered.
# Design of record: Doc/Architecture/StagedPullRequestPipeline.
#
# The job-level `if:`s below are FILTERS on which event this listener answers, not gates: this file
# is not a required context, publishes nothing branch protection reads, and can turn nothing green.
# A skipped job here means "this event was not about stage 1" (e.g. a check run of another App).
name: Stage advance (review landed → start the suites)

on:
  check_run:
    types: [completed]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: write

concurrency:
  # ONE group per HEAD for both listeners: a check_run and a review event of the same head must not
  # race to re-run one run (Plugins #2836 review); the sweep has its own.
  group: stage-advance-${{ github.event.check_run.head_sha || github.event.pull_request.head.sha || 'sweep' }}
  cancel-in-progress: false

jobs:
  on-review:
    if: >-
      github.event_name == 'check_run' && github.event.check_run.name == 'internal-review'
      && github.event.check_run.app.id == 4918443
    uses: ./.github/workflows/node-repo-stage-advance.yml
    with:
      workflow: dotnet-test.yml
      mode: head
      head-sha: ${{ github.event.check_run.head_sha }}
      scripts-ref: ${{ github.sha }}
  on-answer:
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review')
      && github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/node-repo-stage-advance.yml
    with:
      workflow: dotnet-test.yml
      mode: pr
      pr: ${{ github.event.pull_request.number }}
      scripts-ref: main
  sweep:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/node-repo-stage-advance.yml
    with:
      workflow: dotnet-test.yml
      mode: sweep
      scripts-ref: ${{ github.sha }}
