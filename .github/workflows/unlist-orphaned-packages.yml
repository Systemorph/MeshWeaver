name: Unlist orphaned NuGet packages

# A module that LEAVES the platform stops being packed — but everything it already published
# stays on nuget.org, LISTED: it keeps appearing in search and in `dotnet add package`, offered
# to consumers as current while nothing builds or patches it any more. This is how that set is
# retired.
#
# 🚨 The set is DERIVED, never hand-kept: (published under the MeshWeaver prefix) MINUS (what
# this tree still packs). So it stays correct on its own as further modules move out — #1882
# (the fourteen drivers) and #1752 (Cosmos/Snowflake) need no edit here.
#
# 🚨 REPORT BY DEFAULT. `apply` must be set explicitly AND `confirm` must read UNLIST. The
# derivation is a subtraction, so any bug in "what this tree packs" fails toward unlisting live
# packages — during development one such bug computed "all 90". Report-only is what caught it.
#
# `dotnet nuget delete` UNLISTS on nuget.org; it does not erase. Existing pins keep resolving by
# exact version, and a listing can be restored from the nuget.org UI. That reversibility is what
# makes this safe to automate.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually unlist (unchecked = report only)"
        type: boolean
        default: false
      confirm:
        description: "Type UNLIST to confirm when apply is checked"
        type: string
        default: ""
      keep:
        description: "Space-separated package ids to spare even when orphaned"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unlist:
    name: Report or unlist orphaned packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write       # NuGet/login — the short-lived unlist key, only when applying
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # The regression checks for the two ways the "what do we pack" half has silently lied,
      # both of which failed toward unlisting a LIVE package. Gating the run on them means a
      # broken detector cannot reach the apply step at all.
      - name: Self-test the detector
        run: python3 scripts/orphaned-nuget-packages.py --self-test

      - name: Refuse an unconfirmed apply
        if: inputs.apply && inputs.confirm != 'UNLIST'
        run: |
          echo "::error::apply was requested but confirm did not read UNLIST — refusing. Re-run and type UNLIST to confirm."
          exit 1

      - name: Report the orphaned set
        run: |
          set -euo pipefail
          keep_args=""
          for id in ${{ inputs.keep }}; do keep_args="$keep_args --keep $id"; done
          python3 scripts/orphaned-nuget-packages.py --root . $keep_args | tee report.txt
          {
            echo "### Orphaned NuGet packages"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔐 Trusted Publishing: nuget.org exchanges this run's GitHub OIDC token for a short-lived
      # key, under the policy that names this repository and THIS workflow file (a policy per
      # file — publish-packages.yml has its own). No stored NuGet secret anywhere.
      - name: The policy owner is named
        if: inputs.apply && inputs.confirm == 'UNLIST'
        env:
          NUGET_TRUSTED_USER: ${{ vars.NUGET_TRUSTED_USER }}
        run: |
          set -euo pipefail
          [ -n "${NUGET_TRUSTED_USER:-}" ] || { echo "::error::vars.NUGET_TRUSTED_USER is not set — the nuget.org account that owns the Trusted Publishing policy for unlist-orphaned-packages.yml. A step that cannot run must fail RED, never pass quietly."; exit 1; }
      - name: Log in to nuget.org (Trusted Publishing)
        if: inputs.apply && inputs.confirm == 'UNLIST'
        id: nuget_login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_USER }}

      - name: Unlist them
        if: inputs.apply && inputs.confirm == 'UNLIST'
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::the Trusted Publishing exchange returned no key — the unlist cannot run. A step that cannot run must fail RED, never pass quietly."
            exit 1
          fi
          keep_args=""
          for id in ${{ inputs.keep }}; do keep_args="$keep_args --keep $id"; done
          # 🚨 Capture the SCRIPT's exit code, not the pipeline's. Three outcomes, and they must
          # stay distinguishable: 0 = the set is retired, 2 = RESUMABLE (nuget.org's rate limit
          # stopped the run with work left — re-run this same dispatch), anything else = a real
          # failure. Measured 2026-09-07: 760 versions do not fit in one quota window, so 2 is an
          # ordinary outcome of a large retirement and must not read as either of the other two.
          set +e
          python3 scripts/orphaned-nuget-packages.py --root . --apply $keep_args | tee applied.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Unlist run"
            case "$status" in
              0) echo "✅ Every orphaned version now reads as unlisted." ;;
              2) echo "🔁 **RESUMABLE — not finished.** nuget.org rate-limited the run with work"
                 echo "left. Nothing is wrong: re-dispatch this workflow with the same inputs."
                 echo "Already-unlisted versions are skipped, so the next run spends its whole"
                 echo "budget on the remainder (listed at the end of the log below)." ;;
              *) echo "❌ The run failed for a reason that is NOT the rate limit — read the log." ;;
            esac
            echo '```'
            cat applied.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A resumable stop is not a green tick: the retirement is incomplete and a reader must
          # not be able to mistake it for done.
          exit "$status"
