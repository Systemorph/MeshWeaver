# Ingress for portal.example.com (ns example), cookie session affinity.
#   kubectl apply -n example -f portal-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memex-portal
  namespace: example
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "EXAMPLE_AFFINITY"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # Rollout resilience: re-pin the affinity cookie when the pinned pod goes away (without this,
    # persistent affinity keeps routing to the draining/terminated pod), and retry the surviving
    # upstream on the cutover instant instead of surfacing a 502 to the browser.
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: [portal.example.com]
      secretName: exampledb-tls
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memex-portal-service
                port: { number: 8080 }
