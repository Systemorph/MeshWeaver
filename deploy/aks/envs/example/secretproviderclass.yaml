# ===========================================================================
# SecretProviderClass — TEMPLATE. Copy this env folder, then replace every
# CHANGE_ME below with your own values.
#
# It maps Key Vault secrets onto the config keys the portal reads. The AKS Key
# Vault Secrets Provider (CSI) add-on mounts them into the pod, and
# `secretObjects` syncs them into a K8s Secret the Deployment loads via
# `envFrom`. The secret KEY is the env-var name, so it maps 1:1 to a config
# key: `AzureFoundry__ApiKey` -> `AzureFoundry:ApiKey`.
#
# 🚨 The Deployment MUST mount this as a CSI volume. The driver syncs to the
# K8s Secret only while a pod mounts the volume — declare the SPC without the
# volume and the Secret is simply never created, with no error anywhere.
# `portal-patch.json` in this folder adds the volume / volumeMount / envFrom.
#
# Prereqs:
#   * the `azureKeyvaultSecretsProvider` add-on enabled on the cluster;
#   * its user-assigned identity (`userAssignedIdentityID`) holding secret GET
#     on the vault — RBAC role "Key Vault Secrets User", or an access policy
#     with secret get/list.
#
# 🚨 `Ai:KeyProtection:MasterKey` is the at-rest envelope key for stored
# provider credentials. Once a deployment has encrypted anything with it, it
# MUST keep the same value — pointing it at a different one makes every stored
# `enc:` key undecryptable. Treat changing it as data loss, not configuration.
#
# Only the keys your deployment actually uses need to be present. Drop the
# entries you have no vault secret for rather than leaving them empty: a
# declared object that does not exist in the vault fails the whole mount.
# ===========================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  # Referenced by name from portal-patch.json — keep the two in step.
  name: exampledb-portal-ai-secrets
  namespace: example
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # clientId of the azureKeyvaultSecretsProvider add-on's user-assigned identity.
    #   az aks show -g <rg> -n <cluster> \
    #     --query addonProfiles.azureKeyvaultSecretsProvider.identity.clientId -o tsv
    userAssignedIdentityID: "CHANGE_ME_csi_addon_identity_client_id"
    keyvaultName: "CHANGE_ME_key_vault_name"
    tenantId: "CHANGE_ME_aad_tenant_id"
    objects: |
      array:
        - |
          objectName: AzureFoundry-ApiKey
          objectType: secret
        - |
          objectName: Ai-KeyProtection-MasterKey
          objectType: secret
        # Payment gateway for the Store plugin — omit both if you do not run it.
        - |
          objectName: Stripe-SecretKey
          objectType: secret
        - |
          objectName: Stripe-WebhookSecret
          objectType: secret
        # GitHub App private key — the machine credential for PRIVATE repos.
        # Omit if every repo the portal reads is public.
        - |
          objectName: github-app-privatekey
          objectType: secret
        # Plugin-catalog consumer credential (the `mwi_` instance key issued at
        # registration). Omit if this install has no plugin registry.
        - |
          objectName: PluginCatalog-RegistryToken
          objectType: secret
  secretObjects:
    - secretName: exampledb-portal-ai-secrets
      type: Opaque
      data:
        - objectName: AzureFoundry-ApiKey
          key: AzureFoundry__ApiKey
        - objectName: Ai-KeyProtection-MasterKey
          key: Ai__KeyProtection__MasterKey
        - objectName: Stripe-SecretKey
          key: Commerce__Stripe__SecretKey
        - objectName: Stripe-WebhookSecret
          key: Commerce__Stripe__WebhookSecret
        # Pairs with the config key GitHub__App__ClientId. The token service needs
        # BOTH and throws "The GitHub App is not configured" with only one. Without
        # the App, every server-side GitHub read falls back to ANONYMOUS — and
        # anonymous against a private repo is a 404 that surfaces as an EMPTY
        # STORE, never as an error.
        - objectName: github-app-privatekey
          key: GitHub__App__PrivateKey
        # 🚨 Losing this key does not merely disable the registry: with NO registry
        # configured the Store falls back to GIT sources, so an install that drops
        # it re-enables an unauthenticable source and starts 404-polling.
        - objectName: PluginCatalog-RegistryToken
          key: PluginCatalog__RegistryToken
