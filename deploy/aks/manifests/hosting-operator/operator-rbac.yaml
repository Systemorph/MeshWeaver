# What an operator JOB may do in the cluster. This is the widest grant in the deployment, and it
# is deliberately attached to a ServiceAccount that only ever backs a short-lived Job — never a
# long-running pod, and never the portal.
#
# Scope notes:
#  * namespaces: create + delete is what provisioning and teardown ARE.
#  * apps/deployments: scale (quiesce/reactivate) and read rollout status.
#  * ingresses: the suspension redirect and its undo.
#  * secrets/configmaps/pvc/services: what a Helm release of the portal chart owns.
#  * NO access to `clusterroles` or the monitoring namespace — a lifecycle run has no business
#    there, and a Job must never widen cluster-scoped RBAC.
#  * READ on `nodes` and `customresourcedefinitions` — get + list, no watch.
#    🚨 This bullet used to read "NO access to `nodes` … and the day someone needs it is the day to
#    review this file, not to widen it pre-emptively." That day was 2026-09-18 and this is the
#    review: widened deliberately, on the maintainer's decision, not pre-emptively.
#    WHY: `hosting-db-release` must know, BEFORE it renders an instance's database release, whether
#    the CloudNativePG CRD is installed and whether a `workload=db` node pool exists. Both are
#    cluster-scoped facts belonging to no instance, and without them the step leaves a Cluster
#    Pending forever on a pool that does not exist. Read-only because the platform layer is
#    installed once, by the approved lane, and never by a lifecycle run
#    (deploy/aks/manifests/db-platform/README.md). No `watch`: all three call sites are one-shot
#    `get`s in a preflight.
#    🚨 THE COST, stated where a reviewer sees it: anything that compromises an operator Job can now
#    ENUMERATE the cluster's nodes and their labels — pool names, sizes, zones and topology. That is
#    a real widening of what a compromised Job learns, accepted knowingly. It remains read-only, and
#    still on a ServiceAccount that only ever backs a short-lived Job, never a pod and never the
#    portal. See MeshWeaver#4722 for the measurement that prompted the review.
#
# 🚨 HOW THIS FILE REACHES THE CLUSTER. It is applied by the config repo's helm-release lane
# (Systemorph/Memex `helm-release.yml`, actions adopt and deploy) from THIS repository at the
# same pin the lane renders the chart from — so a grant and the operator step that needs it move
# together. It is NOT applied by the operator (a Job must never widen its own ClusterRole) and no
# longer by a laptop. Measured 2026-09-09 on memex: the `storageclasses` rule below had been on
# main since the volume-capacity step landed, the cluster's ClusterRole predated it, and the first
# record-driven Reconcile through the fixed operator stopped at step 1/6 with
#   storageclasses.storage.k8s.io "azurefile-memex" is forbidden: User
#   "system:serviceaccount:memex-ops:hosting-operator" cannot get resource "storageclasses"
# A grant that only a laptop can move is the same defect as an operator image that only a laptop
# can move (core #3757 / Plugins #1542): the record and the chart are the inputs, and every one of
# them needs a lane. deploy/aks/operator/test/check-rbac-coverage.sh holds the other half — every
# kubectl verb+resource a bin/ script names must be granted here, or the suite is red. Its sibling
# check-stderr-discarded.sh holds the half that matters while a grant is still IN FLIGHT: a read
# that discards its stderr cannot tell a refusal from an absence, so until the lane above has run,
# the operator's own diagnostics are all that stands between a missing grant and a reader sent off
# to re-create something that is already there (MeshWeaver#4722, Doc/Architecture/DeniedIsNotAbsent).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hosting-operator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # jobs: the chart's migration Job is a release object helm PATCHES on every upgrade (labels,
  # annotations) — check-chart-kinds-granted.sh found the missing patch on 2026-09-09.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # READ-ONLY, for hosting-audit. The live-only-config audit lists every kind a namespace can carry
  # and compares it against the helm manifest; a kind it is Forbidden to list is one it must NOT
  # report as clean, so it refuses — which means every kind below has to be readable or the audit
  # never completes. Nothing here is writable: an audit measures, it never reconciles.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  # READ-ONLY and CLUSTER-SCOPED, for hosting-db-release's platform-layer preflight — the scope note
  # at the top carries the decision, the reason and the cost. get + list, never watch, never write:
  # the platform layer is installed once by the approved lane, never by a lifecycle run.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # 🚨 EVERY KIND THE CHART RENDERS MUST BE WRITABLE HERE — helm applies the release under this
  # identity. Measured 2026-09-09 01:59Z (Deployments/memex-reconcile-20260909-adopt): the chart at
  # core #3774 rendered a PodDisruptionBudget for every two-replica instance, the role granted
  # poddisruptionbudgets get+list (the audit's read-only block), and helm answered
  #   UPGRADE FAILED: failed to create resource: poddisruptionbudgets.policy is forbidden
  # and its --atomic rollback then erred as well. A chart change that renders a NEW kind must land
  # with its grant; deploy/aks/operator/test/check-chart-kinds-granted.sh holds that ratchet, and
  # hosting-deploy refuses BEFORE helm (kubectl auth can-i per rendered kind) so a missing grant is
  # named in one line instead of discovered by a failed upgrade. Excluded on purpose, and refused by
  # name if a record renders them: ClusterRole/ClusterRoleBinding (instancesAdmin.clusterRead) — a
  # Job must never widen cluster-scoped RBAC.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # The chart's rbac.yaml (ungated) renders the portal's own Role + RoleBinding (self-update: get/
  # patch its Deployment). Kubernetes refuses a Role that grants more than its creator holds, so
  # this cannot escalate past the rules in this file.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # ollama/service.yaml renders an Endpoints object for an external model host (ollama.external).
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # READ-ONLY, for hosting-pv-resize. The storage class decides whether a claim can grow
  # (allowVolumeExpansion); the command reads it BEFORE patching, and refuses a class that cannot
  # expand rather than leaving a request in Pending forever. The patch itself is the
  # persistentvolumeclaims grant above. A Forbidden here fails the "Ensure volume capacity" step
  # of every Provision / Reconcile by name (measured 2026-09-09, see the header).
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  # For hosting-pv-purge, the Teardown step that releases the Retain-policy PersistentVolumes a
  # deleted namespace leaves behind. PVs are cluster-scoped, so this is the one cluster-scoped
  # DELETE in the file; the script lists by the claim's namespace label, reads each PV's phase,
  # reclaim policy and share handle, and deletes only a Released volume. Without this grant the
  # purge step fails by name ("could not list PersistentVolumes") — which is the designed
  # fail-loud shape, but it means a Teardown could never complete. Added 2026-09-09 when the
  # coverage check below was written; the script had been on main without its grant.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "delete"]
  # For hosting-tls, the step that gives a new instance its certificate. cert-manager's own
  # controller does the issuing; the operator only declares the Certificate and reads it back to
  # learn whether it went Ready. Measured 2026-09-15 on pearl, step 15/18 of its Provision:
  #   certificates.cert-manager.io "pearl-tls" is forbidden: User
  #   "system:serviceaccount:memex-ops:hosting-operator" cannot get resource "certificates"
  # The run stopped there, so TLS and all three verification steps never ran and the host served
  # another instance's certificate. No delete: a Certificate is owned by the release that renders
  # the ingress, and removing one is not something a provisioning run may do.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hosting-operator
subjects:
  - kind: ServiceAccount
    name: hosting-operator
    namespace: memex-ops
roleRef:
  kind: ClusterRole
  name: hosting-operator
  apiGroup: rbac.authorization.k8s.io
