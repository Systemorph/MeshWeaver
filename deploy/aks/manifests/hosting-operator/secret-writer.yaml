# The WRITER identity's in-cluster half (policy `secrets-write-only-entry`,
# Doc/Architecture/SecretsWriteOnlyEntry). A secret action's Job (SetSecrets and the secret status and
# lifecycle actions) runs as THIS ServiceAccount instead of `hosting-operator`. The Hosting plugin picks
# it through `Hosting:Operator:SecretWriterServiceAccount`. The ServiceAccount is federated to the
# `secret-writer` user-assigned managed identity (Systemorph/Memex `infra/estate.bicep`), whose Key
# Vault grant is list, set, delete, recover and purge, and NEVER get. So nothing running under it can
# read a secret value out of the vault.
#
# 🚨 The federated subject is `system:serviceaccount:memex-ops:hosting-secret-writer`. Renaming the
# namespace or this ServiceAccount must change the federation in estate.bicep with it.
#
# 🚨 HOW THIS REACHES THE CLUSTER: like every cluster grant, through the governed cluster-RBAC path
# (Systemorph/Memex aks-ops.yml with a mesh approval), never applied by a Job and never from a laptop.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hosting-secret-writer
  namespace: memex-ops
  annotations:
    # Replace with estate.bicep's `secretWriterIdentityClientId` output.
    azure.workload.identity/client-id: "<secretWriterIdentityClientId>"
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/managed-by: meshweaver-hosting
---
# What a secret Job may do in the cluster, and nothing more:
#  * secrets: GET only. `hosting-kv-set --wait` compares the synced Secret's value to the one it
#    wrote BY HASH, so the restart that follows can never race the CSI driver.
#    🚨 THE RESIDUAL, stated where a reviewer sees it: a Kubernetes `get` on a synced Secret is a read
#    of a value the pods already hold. It is not a Key Vault read, and it is bounded to the objects
#    this Job just wrote. The follow-up is to wait on `secretproviderclasspodstatuses` VERSIONS
#    instead (already granted below), and then this rule goes.
#  * secretproviderclasspodstatuses: get + list, the CSI driver's per-pod record of which object
#    VERSION each pod mounted (metadata, never a value).
#  * deployments: get + patch, the "Restart after" rollout; replicasets and pods: get, list, watch,
#    for the rollout status.
# No create, no delete, no namespaces, no RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hosting-secret-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasspodstatuses"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hosting-secret-writer
subjects:
  - kind: ServiceAccount
    name: hosting-secret-writer
    namespace: memex-ops
roleRef:
  kind: ClusterRole
  name: hosting-secret-writer
  apiGroup: rbac.authorization.k8s.io
