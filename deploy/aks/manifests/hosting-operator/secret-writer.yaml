# The WRITER path's in-cluster half (policy `secrets-write-only-entry`, Doc/Architecture/SecretsWriteOnlyEntry).
# A secret action's Job (SetSecrets and the secret status and lifecycle actions) runs as the
# `hosting-secret-writer` ServiceAccount, in a namespace of its own, launched by the control instance
# with a token whose ONLY power is "start a Job in that namespace and read what it said".
#
# 🏛️ THE FENCE (maintainer decision 2026-10-18: "Own namespace"). Four properties, each held by an
# object below, never by configuration:
#   1. `memex-secrets` holds ONE ServiceAccount that matters: `hosting-secret-writer`. A pod can only
#      run as a ServiceAccount of its OWN namespace, so a Job created here cannot run as
#      `hosting-operator` (memex-ops) or any other identity — whoever writes the Job spec.
#   2. The control instance's job-runner token (`hosting-secret-jobrunner`, the SA in the control
#      portal's namespace) is bound in `memex-secrets` and NOWHERE ELSE: it can create, read and delete
#      Jobs and read their pods' logs here, and it has no binding in memex-ops.
#   3. The writer's own cluster rights are what `hosting-kv-set --wait` and the "Restart after" step
#      need — read which object VERSION each pod mounted, restart a portal Deployment — and the
#      admission policy at the end holds the restart to exactly a restart: the writer cannot change a
#      pod template, so it cannot borrow a portal's identity (which CAN read the vault).
#   4. Pod Security `baseline` is enforced on the namespace: a Job spec here cannot ask for a
#      privileged container, a hostPath or the host network, so the job-runner token cannot reach the
#      node through a Job it writes.
#
# The Azure half: the ServiceAccount is federated to the `secret-writer` user-assigned managed identity
# (Systemorph/Memex `infra/estate.bicep`, subject below), whose Key Vault grant is list, set, delete,
# recover and purge, and NEVER get. So nothing running under it can read a secret value out of the vault.
#
# 🚨 The federated subject is `system:serviceaccount:memex-secrets:hosting-secret-writer`. Renaming the
# namespace or this ServiceAccount must change the federation in estate.bicep with it.
#
# 🚨 No client id annotation on the ServiceAccount, on purpose. The Hosting plugin sets the Job's
# AZURE_CLIENT_ID from `Hosting:Operator:SecretWriterClientId` and strips the operator's own
# AZURE_CLIENT_ID from the Job environment (the workload-identity webhook never overrides a variable a
# container already sets — the defect that would otherwise sign a writer Job in as hosting-operator).
# The client id is not a security factor: the token exchange only succeeds for an identity federated
# to THIS subject, which is `secret-writer` alone. Keeping it off this file keeps the file applyable
# verbatim, which is what the governed apply requires (no placeholders).
#
# 🚨 HOW THIS REACHES THE CLUSTER: the `ApplyClusterManifest` InstanceAction on the control instance —
# Systemorph/Memex aks-ops.yml, mutate lane, a mesh approval bound to this file's sha256
# (`hosting-manifest-apply`). Never applied by a Job and never from a laptop.
apiVersion: v1
kind: Namespace
metadata:
  name: memex-secrets
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hosting-secret-writer
  namespace: memex-secrets
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/managed-by: meshweaver-hosting
---
# What a secret Job may do in the cluster, and nothing more:
#  * NO Kubernetes Secret read, anywhere. `hosting-kv-set --wait` decides that the pods have the new
#    value from secretproviderclasspodstatuses (get + list): the CSI driver's per-pod record of which
#    object VERSION each pod mounted. That is metadata, never a value.
#  * deployments: the "Restart after" step (`kubectl rollout restart` = get + patch) and its wait
#    (`rollout status` = get + a watch by name), on the portal Deployment ONLY (resourceNames). The
#    admission policy below holds the patch to the restart annotation.
#  * replicasets and pods: get, list, watch, for the rollout status.
# No create, no delete, no namespaces, no RBAC, no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hosting-secret-writer
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
rules:
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasspodstatuses"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["memex-portal-deployment"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hosting-secret-writer
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
subjects:
  - kind: ServiceAccount
    name: hosting-secret-writer
    namespace: memex-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hosting-secret-writer
---
# A restart and nothing else. `kubectl rollout restart` changes exactly one thing: the pod template's
# `kubectl.kubernetes.io/restartedAt` annotation. Every caller-settable field of the Deployment must
# arrive unchanged when the writer is the one asking: the WHOLE DeploymentSpec, field by field (replicas,
# selector, strategy, minReadySeconds, revisionHistoryLimit, paused, progressDeadlineSeconds, the pod
# spec, the template's labels and its other annotations) and the object metadata a caller can set
# (labels, annotations, ownerReferences, finalizers). `paused` would freeze every later rollout; an
# ownerReference to an owner that does not exist would have the garbage collector delete the Deployment
# without a delete grant (review of MeshWeaver#6946). Server-maintained metadata (resourceVersion,
# generation, managedFields) is not compared: the writer cannot set it. CEL cannot iterate a typed object,
# so the fields are named; a field Kubernetes adds to DeploymentSpec later is not covered until it is
# named here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hosting-secret-writer-restart-only
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: requested-by-the-secret-writer
      expression: "request.userInfo.username == 'system:serviceaccount:memex-secrets:hosting-secret-writer'"
  variables:
    - name: restartKey
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnnotations
      expression: "has(object.spec.template.metadata) && has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.spec.template.metadata) && has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
  validations:
    - expression: "object.spec.template.spec == oldObject.spec.template.spec"
      message: "the secret writer may only restart a Deployment: its pod spec (image, ServiceAccount, volumes, env) must not change"
    - expression: >-
        (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {})
        == (has(oldObject.spec.template.metadata) && has(oldObject.spec.template.metadata.labels) ? oldObject.spec.template.metadata.labels : {})
      message: "the secret writer may only restart a Deployment: its pod template labels must not change"
    - expression: >-
        variables.newAnnotations.all(k, k == variables.restartKey || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k]))
        && variables.oldAnnotations.all(k, k == variables.restartKey || k in variables.newAnnotations)
      message: "the secret writer may only restart a Deployment: no pod template annotation but kubectl.kubernetes.io/restartedAt may change"
    - expression: >-
        object.spec.selector == oldObject.spec.selector
        && (has(object.spec.replicas) ? object.spec.replicas : -1) == (has(oldObject.spec.replicas) ? oldObject.spec.replicas : -1)
        && (has(object.spec.strategy) ? object.spec.strategy : {}) == (has(oldObject.spec.strategy) ? oldObject.spec.strategy : {})
        && (has(object.spec.minReadySeconds) ? object.spec.minReadySeconds : -1) == (has(oldObject.spec.minReadySeconds) ? oldObject.spec.minReadySeconds : -1)
        && (has(object.spec.revisionHistoryLimit) ? object.spec.revisionHistoryLimit : -1) == (has(oldObject.spec.revisionHistoryLimit) ? oldObject.spec.revisionHistoryLimit : -1)
        && (has(object.spec.paused) ? object.spec.paused : false) == (has(oldObject.spec.paused) ? oldObject.spec.paused : false)
        && (has(object.spec.progressDeadlineSeconds) ? object.spec.progressDeadlineSeconds : -1) == (has(oldObject.spec.progressDeadlineSeconds) ? oldObject.spec.progressDeadlineSeconds : -1)
      message: "the secret writer may only restart a Deployment: its replicas, selector, strategy, minReadySeconds, revisionHistoryLimit, paused and progressDeadlineSeconds must not change"
    - expression: >-
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
        && (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
        && (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
        && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])
      message: "the secret writer may only restart a Deployment: its labels, annotations, ownerReferences and finalizers must not change"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hosting-secret-writer-restart-only
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
spec:
  policyName: hosting-secret-writer-restart-only
  validationActions: ["Deny"]
---
# ── the control instance's job-runner: Jobs in memex-secrets, and nowhere else ────────────────────
# The token the CONTROL PORTAL holds for the writer path. A pod can only mount a Secret of its own
# namespace, so the ServiceAccount and its token live in the control portal's namespace (`control`);
# the Role and RoleBinding live HERE and name it as a foreign subject. That is the whole of its power.
#
# 🚨 A different ServiceAccount from `hosting-jobrunner` (jobrunner.yaml) on purpose: that one is bound
# in memex-ops, where Jobs run as `hosting-operator`. This one has no binding there, and nothing here
# binds it anywhere else. The Secret keeps the name the Hosting plugin mounts
# (`hosting-jobrunner-token`, HelmValues.OperatorTokenSecret, at /var/run/secrets/hosting-operator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hosting-secret-jobrunner
  namespace: control
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
---
# A long-lived token for it (Kubernetes ≥1.24 mints none on its own). The annotation asks the token
# controller to fill it; the file carries no data and the apply never sends any.
apiVersion: v1
kind: Secret
metadata:
  name: hosting-jobrunner-token
  namespace: control
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
  annotations:
    kubernetes.io/service-account.name: hosting-secret-jobrunner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hosting-secret-jobrunner
  namespace: memex-secrets
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
rules:
  # Create a run, follow it, read what it said, delete it when it ends (a Job whose environment carried
  # pasted values is deleted by the control plane the moment its run ends). Nothing else: no Secrets,
  # no ServiceAccounts, no Roles, no pods created directly.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hosting-secret-jobrunner
  namespace: memex-secrets
  labels:
    app.kubernetes.io/managed-by: meshweaver-hosting
subjects:
  - kind: ServiceAccount
    name: hosting-secret-jobrunner
    namespace: control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hosting-secret-jobrunner
