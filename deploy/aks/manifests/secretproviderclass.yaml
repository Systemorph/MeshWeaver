# ===========================================================================
# SecretProviderClass — mounts the AzureFoundry API key from the `Systemorph`
# Key Vault into the portal pod via the AKS Key Vault Secrets Provider (CSI)
# add-on, and syncs it into a K8s Secret the portal reads via `envFrom`.
#
# Apply alongside the Helm release. The portal Deployment MUST mount this SPC as
# a CSI volume for the `secretObjects` sync to fire (the CSI driver only syncs to
# a K8s Secret while a pod mounts the volume). See the volume / volumeMount /
# envFrom patch in Doc/Architecture/DeploymentOptions.md.
#
# Prereqs:
#   • azureKeyvaultSecretsProvider add-on enabled on <aks-cluster> (it is).
#   • Its user-assigned identity (clientId below) has GET on Systemorph KV secrets
#     — RBAC role "Key Vault Secrets User" on the vault, or an access policy with
#     secret get/list.
#
# NOTE: the encryption master key (Ai:KeyProtection:MasterKey) is intentionally
# NOT managed here — it is provided out-of-band and overriding it would make every
# stored `enc:` provider key undecryptable. Add it to `objects`/`secretObjects`
# ONLY if you point it at the exact same value the running deployment already uses.
# ===========================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: memex-portal-ai-secrets
  namespace: memex
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # azureKeyvaultSecretsProvider add-on user-assigned identity (clientId) on <aks-cluster>.
    userAssignedIdentityID: "6c9dcc8d-d5b3-4545-afa1-209b33e8a1ba"
    keyvaultName: "Systemorph"
    tenantId: "3a01d7ac-3330-444d-942d-975eb491b5d6"
    objects: |
      array:
        - |
          objectName: AzureFoundry-ApiKey
          objectType: secret
        - |
          objectName: Ai-KeyProtection-MasterKey
          objectType: secret
        - |
          objectName: Stripe-SecretKey
          objectType: secret
        - |
          objectName: Stripe-WebhookSecret
          objectType: secret
        # The GitHub App PEM and the plugin-registry instance key. Both are referenced as
        # CSI-supplied by deploy/helm (values.yaml → secrets.memex_portal.GitHub__App__PrivateKey
        # and PluginCatalog__RegistryToken, each emitted ONLY when non-empty so this mount stays
        # authoritative) — but until now no SecretProviderClass declared them, so the "leave it ""
        # in values, Key Vault supplies it" path the chart describes did not exist. The only way
        # to wire either was a hand-applied `kubectl set env` that no redeploy reproduces and the
        # next `helm upgrade` reverts. Declaring them here is what makes the chart's comment true.
        - |
          objectName: github-app-privatekey
          objectType: secret
        - |
          objectName: PluginCatalog-RegistryToken
          objectType: secret
  # Sync the mounted KV secrets into a K8s Secret the portal envFrom's. The secret KEY is the env
  # var name → config key: AzureFoundry__ApiKey → AzureFoundry:ApiKey (the AzureFoundry factory key),
  # Ai__KeyProtection__MasterKey → Ai:KeyProtection:MasterKey (the at-rest envelope key — MUST equal
  # the value the deployment already uses, or stored enc: provider keys become undecryptable).
  secretObjects:
    - secretName: memex-portal-ai-secrets
      type: Opaque
      data:
        - objectName: AzureFoundry-ApiKey
          key: AzureFoundry__ApiKey
        - objectName: Ai-KeyProtection-MasterKey
          key: Ai__KeyProtection__MasterKey
        # Stripe (the Store plugin's payment gateway): the server API secret and the
        # webhook endpoint's signing secret — Commerce:Stripe:* in configuration.
        - objectName: Stripe-SecretKey
          key: Commerce__Stripe__SecretKey
        - objectName: Stripe-WebhookSecret
          key: Commerce__Stripe__WebhookSecret
        # GitHub App identity (machine credential for PRIVATE repos): every server-side GitHub
        # read — StoreManifestSource's package feed, the Store card's Provision → Import phase,
        # module discovery, _GitSync — uses this App's INSTALLATION token. Without it those reads
        # fall back to ANONYMOUS, and anonymous against a private repo is a 404 that surfaces as
        # an EMPTY STORE, never as an error. Pairs with config GitHub__App__ClientId; the token
        # service needs BOTH and throws "The GitHub App is not configured" with only one.
        - objectName: github-app-privatekey
          key: GitHub__App__PrivateKey
        # Plugin catalog CONSUMER credential: the mwi_ instance key this install was issued when
        # it registered, sent as `Authorization: Bearer` to the registry's /api/plugins.
        # 🚨 Losing it no longer merely disables the registry. Plugins #460 makes the Store fall
        # back to GIT sources when NO registry is configured (by design — with no registry there
        # is no alternative supply), so an install that drops this key re-enables the
        # unauthenticable git source and the 404 poll comes back.
        - objectName: PluginCatalog-RegistryToken
          key: PluginCatalog__RegistryToken
