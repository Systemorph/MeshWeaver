# FIXTURE for check-chart-invariants.sh — the NodeType bake gate ARMED (MeshWeaver#4588, #5544).
#
# Invariant 10b asserts that an armed PreWarm__GateReadiness has a READER and nothing that can kill
# the pod: its verdict is a roll gate, read by the readinessProbe on /ready alone and excluded from
# the startup probe's /health status (policy bake-gate-readiness-only). A render that arms the gate
# while readiness points elsewhere has a gate that is registered, never read, and permanently
# green — the exact outcome the gate exists to prevent. It also asserts the rollout deadline covers
# a cold bake, because the gate holds readiness AFTER the pod has started.
#
# The invariant needs a render that arms the gate or it would check nothing on every combination
# here. No environment in THIS repository arms it, so this fixture is the subject. It carries only
# what arming the gate means: the gate itself, and the sweep it reads — a gate without
# PreWarm__DynamicTypes is registered, permanently green and protects nothing, which
# Memex.Portal.Distributed says at Critical.
#
# 🚨 It deliberately does NOT raise probes.startup. Until #5544 arming the gate meant raising the
# startup budget to cover a cold bake, and that pairing is what let a refusal kill every container
# at the end of the budget. The chart's defaults must be enough; the bake's time reaches the
# rollout deadline through probes.rollGate.bakeSeconds, which the template adds when the gate is
# armed in the render.
config:
  memex_portal:
    PreWarm__GateReadiness: "true"
    PreWarm__DynamicTypes: "true"
