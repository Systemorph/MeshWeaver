# The standing build hosts ON (Doc/Architecture/BuildHosts): the only combination that renders
# templates/build-host/. Both channels, a stated seccomp profile and the registry bundle index, so every
# branch of the template renders somewhere. Neutral sample names; no credential.
buildHosts:
  enabled: true
  apiUrl: "http://memex-portal-service:8080/api/builds/"
  runnerRepository: "cr.example.com/mw-build-host"
  testerRepository: "cr.example.com/mw-plugin-test"
  portalRepository: "cr.example.com/memex-portal-ai"
  imagePullSecret: "registry-pull"
  pluginsRegistry: "cr.example.com"
  workloadIdentity:
    clientId: "00000000-0000-0000-0000-000000000001"
  sandbox:
    seccompProfile: "Unconfined"
  artifactStore:
    claimName: "ci-artifacts"
  registry:
    url: "https://portal.example.com"
    instanceKeySecret:
      name: "build-registry-key"
  latest:
    enabled: true
    maxReplicas: 2
    platformVersion: "3.1.10412"
    testerDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    portalDigest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
    runnerDigest: "sha256:5555555555555555555555555555555555555555555555555555555555555555"
  stable:
    enabled: true
    maxReplicas: 1
    platformVersion: "3.1.10388"
    testerDigest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
    portalDigest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"
    runnerDigest: "sha256:6666666666666666666666666666666666666666666666666666666666666666"
