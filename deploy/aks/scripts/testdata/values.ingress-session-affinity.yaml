# Cookie session affinity as the RECORD renders it (MeshWeaver#6825): MeshWeaver.Plugins
# HelmValues.IngressValues writes the record's typed affinity under ingress.sessionAffinity.*, never
# into ingress.annotations. Until the chart read that block, a record-only render dropped cookie
# affinity from every multi-replica Blazor portal. The evidence check in check-chart-invariants.sh
# reads this render by name and asserts the merge order: `affinity: cookie` and the cookie name
# from the typed fields, nginxAnnotations over both, ingress.annotations over everything.
#
# Also the plugin-registry identity the record renders from registryInstanceId: the chart maps
# pluginCatalog.instanceId to PluginCatalog__InstanceId and derives PluginCatalog__HomeUrl from
# the host.
ingress:
  enabled: true
  className: "webapprouting.kubernetes.azure.com"
  host: "instance.example.com"
  tlsSecret: "instance-tls"
  clusterIssuer: "letsencrypt-prod"
  annotations:
    # A hand-written annotation wins over the typed affinity block on a clash.
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
  sessionAffinity:
    enabled: true
    cookieName: "MEMEX_AFFINITY"
    nginxAnnotations:
      nginx.ingress.kubernetes.io/affinity-mode: "persistent"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    # Recorded intent for an Application Gateway controller; the chart's ingresses are nginx-shaped
    # and must NOT carry it.
    agicAnnotations:
      appgw.ingress.kubernetes.io/cookie-based-affinity: "true"
pluginCatalog:
  instanceId: "instance-at-registry"
