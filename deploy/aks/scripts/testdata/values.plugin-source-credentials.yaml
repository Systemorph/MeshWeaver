# FIXTURE for check-chart-invariants.sh — a git plugin source's OWN credential, by reference
# (Doc/Architecture/PluginSourceCredentials). Five sources, one per shape the template must tell
# apart, because the difference between them is which identity reads a private repository:
#   0  no credential stated        → no TokenKey, no InstallationOwner (the instance's own App)
#   1  tokenKey stated             → emitted, trimmed
#   2  installationOwner stated    → emitted, trimmed
#   3  tokenKey stated and BLANK   → emitted BLANK: a declaration the portal refuses by name;
#                                    dropping it would read the repository with the instance's
#                                    App or anonymously
#   4  tokenKey null               → not emitted (null is "not stated")
pluginCatalog:
  sources:
    - name: "Plugins"
      repoPath: "https://github.com/Systemorph/MeshWeaver.Plugins"
    - name: "Extensions"
      repoPath: "https://github.com/northwind/extensions"
      tokenKey: "  PluginCatalog:SourceTokens:Extensions  "
    - name: "Modules"
      repoPath: "https://github.com/fabrikam/modules"
      installationOwner: "  fabrikam  "
    - name: "Blank"
      repoPath: "https://github.com/fabrikam/blank"
      tokenKey: ""
    - name: "Unstated"
      repoPath: "https://github.com/fabrikam/unstated"
      tokenKey: null
