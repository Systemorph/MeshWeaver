# Values for the `grafana/loki-stack` install (see install-observability.sh).
#
# 🚨 WHY THIS FILE EXISTS — the chart defaults make the log store the FIRST casualty of the very
# incident you need it for. On memex-cloud 2026-08-12 a NodeType-recompile storm drove the portal to
# 20.3 GiB (Burstable: requests 10Gi, limit 28Gi, pinned `workload=silos`). Loki had NO resource
# requests at all, so it was **BestEffort** — the class the kubelet evicts FIRST under node memory
# pressure — and it had NO nodeSelector, so it had been scheduled onto a *silos* node: the one pool
# licensed to balloon to 28 GiB. It was evicted, and because its `storage` volume was an **emptyDir**
# the eviction did not cost the last few minutes of head chunks, it cost THE WHOLE STORE. Promtail
# then logged `connect: connection refused` for minutes and dropped the batches it was holding.
#
# Net effect: the entire incident window is unqueryable, and `mw-log-watcher` — which reads FROM Loki
# (`LogWatcher__LokiUrl`) — went blind at the same moment, so the red-log ticketing filed nothing for
# the storm that needed it. The detector and the evidence shared a fate with the thing they observe.
#
# The three changes below break that chain. They are containment, not the cure: the portal's 20 GiB
# is a NodeType-recompile AssemblyLoadContext leak and that is fixed separately. Never "fix" this by
# raising the portal's memory limit or the node size — that only moves the ceiling.

loki:
  # 1. OUT OF BestEffort. Requests are what the eviction ranking reads: a pod inside its requests is
  #    protected relative to any BestEffort pod on the node. Sized from observed steady state
  #    (~150-300Mi), with headroom for query bursts rather than for retained data (that is the PVC).
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 3Gi

  # 2. OFF THE WORKLOAD POOL. The portal pins to `workload=silos` and is allowed to burst to 28 GiB
  #    there; observability must not be its co-tenant. The system pool has two nodes and carries no
  #    taints (verified 2026-08-12), so a plain nodeSelector is enough — no tolerations needed.
  nodeSelector:
    agentpool: system

  # 3. DURABLE STORE. With the default emptyDir, ANY reschedule — eviction, node upgrade, a chart
  #    upgrade — silently wipes every log the cluster has. This is the single change that would have
  #    preserved the 2026-08-12 window.
  persistence:
    enabled: true
    size: 30Gi
    storageClassName: default

promtail:
  # Deliberately NO nodeSelector: Promtail is a DaemonSet and must run on EVERY node, including the
  # silos pool, or those nodes' logs are never shipped. Only the QoS class changes.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  # 🚨 NOT DONE HERE — Promtail's WAL, which is what would stop a Loki outage from DROPPING the
  # batches Promtail is holding (it retried `connect: connection refused` for minutes on 2026-08-12
  # and then discarded them). The binary supports it (3.5.1; WAL landed in 2.8) and `/run/promtail`
  # is already a writable hostPath, so the mechanism is there — but this DEPRECATED loki-stack chart
  # does not pass a `promtail.config.wal` block through to the rendered config. VERIFIED, not
  # assumed: rendering with `--set promtail.config.wal.enabled=true` yields ZERO occurrences of
  # "wal" in the output. Setting it anyway would be a silent no-op that reads like coverage.
  #
  # Getting it needs either a full `promtail.config.file` override or migrating off loki-stack to the
  # maintained grafana/loki + grafana/promtail charts (`helm template` also warns "This chart is
  # deprecated"). That migration is its own operation — do it deliberately, not folded into this.

grafana:
  nodeSelector:
    agentpool: system
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

prometheus:
  server:
    nodeSelector:
      agentpool: system
  alertmanager:
    nodeSelector:
      agentpool: system

  # 🚨 ALERT ON THE PIPELINE ITSELF. Silent log loss is the worst failure mode there is: you discover
  # it during the incident review that needs the logs. On 2026-08-12 Loki was down from 05:35 and
  # nothing said so — the outage was found hours later, by hand, while reconstructing the timeline.
  # These fire on the log path being broken, not on anything the log path reports.
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: log-pipeline
          rules:
            - alert: LokiDown
              expr: up{job=~".*loki.*"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Loki is down — logs are being dropped, and mw-log-watcher is blind
                description: >-
                  The log store is unreachable, so Promtail is buffering in memory and will discard
                  batches, and mw-log-watcher (which reads FROM Loki) files no incidents while this
                  lasts. Check whether Loki was evicted: it must not be BestEffort and must not run
                  on the `workload=silos` pool.
            - alert: PromtailDroppingLogs
              expr: rate(promtail_dropped_bytes_total[5m]) > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Promtail is discarding log lines — the window being dropped is unrecoverable
                description: >-
                  Dropped bytes are gone for good: this chart cannot enable Promtail's WAL (see the
                  promtail section), and once a pod is deleted its node-local log files go with it.
            - alert: PromtailNotShipping
              expr: rate(promtail_sent_entries_total[10m]) == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Promtail has shipped nothing for 10 minutes
                description: >-
                  Either every watched pod is genuinely silent, or the pipeline is broken upstream of
                  Loki. mw-log-watcher cannot tell those apart from an empty query result.

        # 🚨 ALERT ON A REPLICA THAT DEGRADES WHILE STAYING READY (MeshWeaver#2194, items 4-5).
        # 2026-08-25, ns memex-cloud: two portal pods climbed 2.7 GB → 17.2 and 20.4 GB over four
        # hours of sync/bake recompile waves, pegged ~4 cores in GC, and served hung pages for THREE
        # AND A HALF HOURS. No OOMKill, no probe failure (both post-startup probes watch /alive, and
        # what /alive measures is a property of the deployed image, not of this chart), and no alert
        # — so nothing pulled them from the Service endpoints and nobody knew until a human ran
        # `kubectl top`. The memory curve was the only witness and it alerted nobody; this is that
        # witness, wired up.
        #
        # 🚨 WHY NO OOMKILL IS STRUCTURAL, NOT LUCK (measured 2026-09-04, both namespaces).
        # Nothing sets DOTNET_GCHeapHardLimit[Percent] — not the inline env:, not memex-portal-config,
        # not any envFrom Secret — so .NET's container default applies: the GC's heap hard limit is
        # 75% of the container memory limit. At `limits.memory: 16Gi` that is 12 GiB, FOUR GIBIBYTES
        # BELOW the limit the kubelet would kill at. The runtime therefore refuses to cross 12 GiB and
        # pays for it with back-to-back blocking gen2 — working set plateaus under 16 GiB and the
        # kubelet never has cause to act. The GC converts a memory shortage (which Kubernetes can fix
        # in one second, by restarting) into CPU starvation inside a process that still answers TCP
        # (about which Kubernetes has no opinion at all). Measured: pause share 0.66 sustained for
        # 2 h 15 on 2026-09-03 while /alive answered Healthy. Full derivation:
        # Doc/Architecture/WhyAGcBoundPodStaysInRotation.
        #
        # These are DETECTION, not the fix. This matters because "a pod degrades while passing both
        # probes" has more than one cause: on 2026-09-04 the 28h-old replicas held a 10 GB managed
        # heap with ZERO publications, bakes, recompiles or stale-build offers in their entire life,
        # so convergence (Modules:AutoRecycleOnStaleBuild, enabled fleet-wide) had nothing to converge.
        # Two shapes are needed because they are loud at opposite ends of the same incident — see the
        # comment on each rule.
        - name: portal-degraded
          rules:
            - alert: PortalReplicaWorkingSetDiverged
              # THE EARLY SHAPE: one replica has run ahead of its siblings. Three conjuncts:
              #   • ratio     — the signature is DIVERGENCE, not absolute size.
              #   • floor     — below 8 GiB the ratio is noise (a just-started pod is legitimately a
              #                 fraction of a warm one), and nothing was wrong at 2.7 GB.
              #   • replicas  — with one replica max == min, so the ratio is 1 and this can never
              #                 fire; the guard states that rather than relying on it.
              #
              # 🚨 THIS RULE GOES BLIND AS THE INCIDENT SPREADS, AND THAT IS NOT FIXABLE HERE.
              # This comment used to argue that "a namespace whose replicas all sit at 12 GB is a
              # sizing question, not this incident". Measured on 2026-09-04, that premise is false:
              # ns memex ran two 28h-old replicas at 9936Mi and 9409Mi — ratio 1.06 against a
              # threshold of 3 — with BOTH at ~80% of the 12 GiB GC hard limit and both on the curve
              # that produced the 2026-09-03 outage. Replicas converge on the same ceiling with age,
              # so the ratio is HIGHEST during the warning and LOWEST during the incident. A detector
              # built only on divergence is loudest early and silent at the end.
              #
              # Do NOT "fix" that by lowering the 3× — a namespace legitimately runs a cold pod beside
              # warm ones on every rollout, and this rule earns its keep on the asymmetric case (it
              # read 7.22× on 2026-09-01). The terminal case needs an ABSOLUTE reading, which a ratio
              # cannot express at all: PortalHeapEnteringGcDefenceBand below covers it.
              expr: >-
                (
                  max by (namespace) (container_memory_working_set_bytes{container="memex-portal"})
                  > 3 * min by (namespace) (container_memory_working_set_bytes{container="memex-portal"})
                )
                and
                (max by (namespace) (container_memory_working_set_bytes{container="memex-portal"}) > 8e9)
                and
                (count by (namespace) (container_memory_working_set_bytes{container="memex-portal"}) > 1)
              # 15m, not 2m: a rollout legitimately runs a cold pod beside warm ones, and a replacement
              # takes minutes to reach its steady state. The incident held this shape for hours.
              for: 15m
              labels:
                severity: warning
              annotations:
                # 🚨 No Go-template placeholders here. Some revisions of the upstream prometheus chart
                # run `tpl` over serverFiles, which would try to resolve `{{ $labels.… }}` at HELM
                # render time and fail (or silently blank it) — and every existing alert in this file
                # is placeholder-free for the same reason. The namespace label is on the alert itself,
                # so Alertmanager shows it regardless.
                summary: >-
                  A portal replica is far heavier than its siblings — suspect a Ready-but-degraded pod,
                  not a global wedge
                description: >-
                  One replica's working set is more than 3× the lightest in the same namespace and above
                  8 GB. That replica is accumulating retained memory faster than its siblings and will go
                  GC-bound while still answering /alive, so it stays in the Service endpoints serving hung
                  and garbled requests. Confirm with `kubectl top pods -n <ns>`; the immediate remediation
                  is `kubectl delete pod` on the outliers (they grace-drain and the deployment replaces
                  them), which buys hours, not days. To tell the causes apart before acting, grep the
                  pod's whole life for `Stale-build convergence` and `self-heal recompile` — if both are
                  zero, no build was ever superseded and Modules:AutoRecycleOnStaleBuild is not the lane;
                  then read `adopted=N uncovered=M of T` from its boot line, because a replica that booted
                  with low bundle coverage compiles the uncovered types lazily on first access and pins
                  each one for the life of the process. See Doc/Architecture/WhyAGcBoundPodStaysInRotation.

            - alert: PortalHeapEnteringGcDefenceBand
              # THE TERMINAL SHAPE, and the case the divergence rule above structurally cannot see:
              # every replica heavy at once. No sibling comparison, so a fleet-wide degradation makes
              # this LOUDER rather than silent.
              #
              # The threshold is derived, not chosen. .NET's default GC heap hard limit in a container
              # is 75% of the memory limit, and it caps the MANAGED HEAP ONLY — the remaining 25% is the
              # margin the default reserves for native memory. So working set ≥ 0.75 × limit is the point
              # at which the process as a whole has reached the numeric value the GC is willing to let the
              # managed heap alone occupy: from there, further managed growth has to come out of a reserve
              # that is already spent. Measured on the degraded replica: working set 14096Mi − managed
              # 10065Mi = ~4031Mi native, i.e. the entire 4 GiB margin, while the heap still had ~2 GiB of
              # its own budget to grow into. container_spec_memory_limit_bytes is the same cAdvisor series
              # family as the working-set metric, so this needs no kube-state-metrics and no new scrape.
              #
              # 🚨 VERIFIED AGAINST THE LIVE PROMETHEUS before commit — an alert that cannot fire is worse
              # than no alert. `count(container_spec_memory_limit_bytes{container="memex-portal"})` → 9
              # series, and this exact expression evaluated to memex-cloud 0.851 / memex 0.605 on
              # 2026-09-04. It DISCRIMINATES: memex-cloud (14 GB replicas, `Platform stalled` in its log)
              # is above the threshold and memex is below it, so this is not a rule that fires on
              # everything. 🚨 That is evidence about the EXPRESSION, not about arming: on 2026-09-01 the
              # live Prometheus answered `rule groups: 0` with the loki release still on its 31 May
              # revision, so the rule above had been merged for a week and was watching nothing. The only
              # evidence a rule is armed is GET /api/v1/rules naming it.
              #
              # ⚠️ Working set ≥ 0.75 × limit does NOT by itself mean the MANAGED heap has reached the
              # hard limit — working set also carries native memory, loaded assemblies and stacks, so
              # this fires EARLIER than the spiral. That is deliberate for a warning. Reading the
              # managed heap directly would need dotnet_gc_heap_size, which the portal already emits
              # via AddRuntimeInstrumentation() and which the OTel collector currently exports ONLY to
              # a node-local JSON file (see manifests/observability/otel-collector-config.yaml) — so
              # Prometheus cannot see it. Until that pipeline reaches Prometheus, working set over the
              # container limit is the honest best available proxy.
              expr: >-
                max by (namespace) (
                  container_memory_working_set_bytes{container="memex-portal"}
                  / container_spec_memory_limit_bytes{container="memex-portal"}
                ) > 0.75
              # 30m, not 15m: this rule has no sibling comparison to protect it from a rollout, and a
              # replica legitimately touches a high working set briefly during a cold bake. The measured
              # incidents held this band for hours.
              for: 30m
              labels:
                severity: warning
              annotations:
                # No Go-template placeholders — see the note on the rule above.
                summary: >-
                  A portal replica has crossed its GC hard limit band — it will degrade instead of being
                  restarted
                description: >-
                  Working set has been above 75% of the container memory limit for 30 minutes. That is
                  where .NET's default container GC heap hard limit sits, and it is BELOW the limit the
                  kubelet would OOMKill at — so from here the runtime defends memory with back-to-back
                  blocking gen2 rather than letting the pod restart, and the pod degrades while passing
                  every probe. Measured on 2026-09-03: GC pause share 0.66 sustained for 2 h 15 with
                  /alive answering Healthy throughout. Confirm the process is GC-bound rather than merely
                  large by grepping the pod for `Platform stalled` — pause ÷ stall above ~0.6 sustained,
                  with gen2 climbing while the reported managed MB does not fall, is retention. Unlike
                  PortalReplicaWorkingSetDiverged this fires when EVERY replica is heavy, which is the
                  state the divergence ratio cannot represent. See
                  Doc/Architecture/WhyAGcBoundPodStaysInRotation.
