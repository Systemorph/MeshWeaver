# ===========================================================================
# values.aks.yaml — AKS overlay for the existing ../helm chart (deploy/helm).
#
# Apply with:
#   helm install memex ../helm -f ../helm/values.yaml -f values.aks.yaml \
#     --namespace memex --create-namespace
#
# This file ONLY sets the keys that the existing chart templates consume
# (config.* / secrets.*). The chart's templates currently hardcode the image,
# replica count, volumes (emptyDir) and have no ingress/storageClass plumbing,
# so the genuinely AKS-specific pieces — RWX PVCs, ingress with cookie session
# affinity, HA replicas, and the pgBackRest PITR sidecar/CronJob — are shipped
# as standalone manifests under ./manifests and applied alongside the release.
# See ./README.md "Helm + manifests layering" for the exact order.
#
# The annotated blocks at the bottom (ingress:, persistence:, replicas:,
# pgbackrest:) are the values the manifests read AND a forward-looking contract:
# if/when the ../helm chart is extended to template these, this overlay already
# carries the AKS-correct values.
# ===========================================================================

# --- Postgres password ------------------------------------------------------
# Replace with your own secret BEFORE installing, or (recommended) pass via
# `--set-file` / an external secret store (CSI Secrets Store add-on is enabled
# in aks.bicep). Never commit a real password to git.
secrets:
  memex_postgres:
    memex_postgres_password: "CHANGE_ME_strong_password"
  memex_migration:
    ConnectionStrings__memex: ""   # chart builds this from the password if blank
    memex_postgres_password: "CHANGE_ME_strong_password"
    MEMEX_URI: ""
  memex_portal:
    ConnectionStrings__memex: ""
    memex_postgres_password: "CHANGE_ME_strong_password"
    MEMEX_URI: ""
    # ---- OAuth client SECRETS (portal.example.com sign-in) ----------------
    # Client SECRETS belong in the secret, not the configmap. Pass via
    # `--set secrets.memex_portal.Authentication__Microsoft__ClientSecret=...`
    # or (recommended) Key Vault via the CSI Secrets Store add-on. NEVER commit
    # real secrets. The matching non-secret ClientId / TenantId live under
    # config.memex_portal below.
    Authentication__Microsoft__ClientSecret: "CHANGE_ME_aad_client_secret"
    Authentication__Google__ClientSecret: "CHANGE_ME_google_client_secret"
    Authentication__LinkedIn__ClientSecret: "CHANGE_ME_linkedin_client_secret"
    # ---- AI provider keys ---------------------------------------------------
    # Never commit a real key. The chart emits each secret key ONLY when non-empty, so leaving
    # these empty means "don't manage / preserve whatever is set out-of-band". Inject the real
    # AzureFoundry key (your Foundry account's key1) at deploy via Key Vault CSI
    # (envs/<env>/secretproviderclass.yaml — template in envs/example/) or
    # `--set secrets.memex_portal.AzureFoundry__ApiKey=...`.
    AzureFoundry__ApiKey: ""
    # Ai__KeyProtection__MasterKey: intentionally UNSET — it is provided out-of-band, and overriding
    # it makes stored enc: provider keys undecryptable. If you DO manage it via the chart, point it
    # at the SAME Key Vault secret the deployment already uses (a different value breaks decryption).
    Ai__KeyProtection__MasterKey: ""

config:
  memex_postgres:
    POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    POSTGRES_USER: "postgres"
  memex_migration:
    MEMEX_HOST: "memex-postgres-service"
    MEMEX_PORT: "5432"
    MEMEX_USERNAME: "postgres"
    MEMEX_JDBCCONNECTIONSTRING: "jdbc:postgresql://memex-postgres-service:5432/memex"
    MEMEX_DATABASENAME: "memex"
  memex_portal:
    MEMEX_HOST: "memex-postgres-service"
    MEMEX_PORT: "5432"
    MEMEX_USERNAME: "postgres"
    MEMEX_JDBCCONNECTIONSTRING: "jdbc:postgresql://memex-postgres-service:5432/memex"
    MEMEX_DATABASENAME: "memex"
    ASPNETCORE_HTTP_PORTS: "8080"
    # ---- Webhook inbox targets ---------------------------------------------
    # 🚨 The generic inbox (POST /api/hooks/{target}) is FAIL-CLOSED: a target that is not
    # listed here answers 404 — byte-identical to a target that does not exist. So an
    # unlisted target does not look misconfigured, it looks like a wrong URL, which is how
    # the platform-build notification went unnoticed: CD posted, memex 404'd, and the whole
    # self-update chain simply never received a release event.
    #
    # Hosting/PlatformBuilds is the platform-build fact CD's notify-platform-update posts
    # after every promoted build; the Hosting package's PlatformBuildInboxWatcher verifies
    # its HMAC (Hosting:PlatformWebhookSecret) and drives the roll. The package must be
    # provisioned for anything to read the inbox — an allowlisted target with no watcher
    # stores deliveries nobody consumes.
    WebhookInbox__Targets__0: "Hosting/PlatformBuilds"
    # A deployment that ALSO needs a second inbox target (e.g. memex-cloud additionally listens
    # on Store/Payments for Stripe) sets __1 too — never a second writer of __0. See #2235: a
    # hand-set `kubectl set env WebhookInbox__Targets__0=...` on the live Deployment permanently
    # shadows whatever this ConfigMap renders for that SAME name (explicit `env:` beats `envFrom`),
    # so the platform-build target silently never took effect even though the ConfigMap was
    # correct. Leave empty when only one target is needed.
    WebhookInbox__Targets__1: ""
    # ---- Instance branding (per-env) ----------------------------------------
    # Large Safari bookmark / Start-Page / Add-to-Dock tile (apple-touch-icon, 180×180 PNG).
    # This ships the PROJECT's own mark (Systemorph builds MeshWeaver — the chart's
    # default registry is ghcr.io/systemorph too), which is why it is not a
    # CHANGE_ME: it is a working default, not a placeholder. Override it per
    # environment at deploy (`brand/<env>-180.png`, an asset your own deployment
    # supplies); empty leaves Safari's letter-tile fallback.
    Portal__AppleTouchIcon: "_content/Memex.Portal.Shared/brand/systemorph-180.png"
    Deployment__Backend: "Filesystem"
    # /data holds ONLY framework caches now: DataProtection keys
    # (/data/dataprotection-keys), the NodeType assembly-cache, and the NuGet
    # package-cache. The content collection moved off /data onto its own Azure
    # Files drive (/mnt/content) — see Storage__BasePath below.
    Deployment__DataRoot: "/data"
    # ---- HA: multiple portal replicas REQUIRE AdoNet Orleans clustering -----
    # With more than one portal replica the Orleans silos must form a cluster
    # via the shared Postgres (AdoNet), NOT "Localhost" (single-process). This
    # mirrors deploy/compose-ha. If you keep replicas: 1 you may leave this as
    # "Localhost".
    Deployment__Orleans__Clustering: "AdoNet"
    # ---- Content collection -> its own mountable Azure Files drive ----------
    # The portal reads `Storage:BasePath` as the FileSystem content-collection
    # root (MemexConfiguration.ConfigureMemexMesh -> contentStorageConfig). Each
    # node hub gets a per-node subdirectory under it: {BasePath}/content/{nodePath}.
    # We point it at the dedicated /mnt/content drive (memex-content PVC) so user
    # content lives on its own share, separate from the framework caches on /data.
    Storage__Name: "content"
    Storage__SourceType: "FileSystem"
    Storage__BasePath: "/mnt/content"
    # ---- Attachments drive (forward-looking) --------------------------------
    # The portal also maps an "attachments" collection
    # (MemexConfiguration: MapContentCollection("attachments","storage",
    # "attachments/{nodePath}")). In THIS (Distributed / Filesystem) backend the
    # "storage" SOURCE collection is not separately registered — only the Monolith
    # registers it — so attachments has NO independently env-repointable base path
    # today: there is no `Storage__Attachments__BasePath` knob in the app. We mount
    # /mnt/attachments anyway (memex-attachments PVC) so the drive exists and is
    # ready: if the app later registers a filesystem "storage" source collection
    # rooted here (e.g. a Storage2/attachments section), no manifest change is
    # needed. The REAL functional change in this overlay is Storage__BasePath above.
    #
    # If you ALSO run the Monolith image (which DOES register the "storage" source
    # from the Storage section), set Storage__BasePath=/mnt/attachments to root the
    # attachments mapping there — but then content + attachments share one drive.
    # For the HA Distributed portal, keep Storage__BasePath=/mnt/content.
    Graph__Storage__Type: "PostgreSql"
    Graph__Storage__BasePath: "/data/graph"
    # ---- NodeType bake at deploy time (managed envs: ON) --------------------
    # Every image roll changes the framework identity, which misses the whole
    # /data assembly cache BY DESIGN — so without a deploy-time bake, dynamic
    # NodeTypes recompile lazily on user requests after the pod is already
    # serving, and a type that no request happens to touch stays "no
    # definition" until its pages hang (a production install, 2026-07-30: every
    # post on one content type burned the 60 s SubscribeRequest timeout all
    # morning). The pre-warm sweep
    # compiles EVERY dynamic NodeType at pod start, and the readiness gate holds
    # /health red until they are built against THIS image — with the deployment's
    # maxSurge 1 / maxUnavailable 0, a regressed type stalls the ROLLOUT (old
    # image keeps serving) instead of surfacing as user-facing errors.
    #
    # ✅ Gate ON. It was enabled 2026-08-02 and reverted the same day: the first
    # gated roll stalled with "7 NodeType(s) regressed on this
    # image", and every one was FALSE — no CS#### diagnostic anywhere in the pod
    # log, only cross-silo subscribe timeouts from the sweep,
    #   No response received in hub cache/… within 00:01:00 for request
    #   SubscribeRequest → target Claims / Reinsurance / SocialMedia /
    #   ClaimsDeepfield / RiskTransfer
    # During a roll the baking pod and the serving pod are two silos, and the
    # sweep cannot always resolve shared sources across that boundary (core #694
    # residue). The types compiled fine; the sweep could not reach them.
    #
    # What changed — the gate no longer treats "no answer" as "it broke":
    #   • A TIMEOUT IS NOT A VERDICT. NodeTypeBakeGateState.MarkOutcome files a
    #     TimedOut outcome under "unevaluated" and it can never set Regressed.
    #     Every one of the 7 false regressions was this shape.
    #   • That leniency now survives the CASCADE. A dependent of an unevaluated
    #     upstream is reported UpstreamUnevaluated (also non-gating) instead of
    #     UpstreamFailed — without that, one timed-out shared source still gated
    #     through its dependents and the same stall returned one hop downstream.
    #   • Only a real verdict on a previously-healthy type gates: a CompileError
    #     (Roslyn rejected it on THIS image) or an UpstreamFailed cascading from
    #     one. A type already broken before the deploy never gates, so one
    #     abandoned NodeType cannot freeze every future rollout.
    # Non-blocking is not invisible: unevaluated types are named in the /health
    # payload, so a swallowed timeout still shows up rather than hiding a real
    # regression. (Pinned by NodeTypeBakeGateStateTest + DynamicTypePreWarmerTest.)
    #
    # ⚠️ THREE prerequisites, all of which must be true in the LIVE namespace —
    # verify, do not assume, because two of the three portals had drifted:
    #   1. probes.startup raised to cover a full COLD bake (below: 10 × 180 = 30 min).
    #      Without it Kubernetes kills the pod mid-bake, every time, forever.
    #   2. The startupProbe must actually EXIST and point at /health — that probe
    #      is the only thing that reads this gate. A namespace with no startupProbe
    #      (or one probing /alive, /ready or /healthz) ignores the gate completely.
    #   3. strategy.maxUnavailable MUST be 0. The gate protects a portal only by
    #      making the new pod refuse readiness; at maxUnavailable:1 with replicas:1
    #      the serving pod can be deleted first, so the gate reports and the outage
    #      happens anyway — false confidence.
    # The chart renders 1 and 3 correctly; a per-env patch or a hand `kubectl` can
    # still override them, so CHECK before trusting the gate (README.md, "Operating it").
    #
    # Failure mode if the gate DOES fire on a real regression: a stalled rollout
    # with the old image still serving — no outage, but self-update stops
    # advancing, so a stalled roll must be investigated, not waited out.
    # ---- 2026-08-17: the boot-time bake is RETIRED on the fleet too ----------
    # Everything above describes the compiling sweep and the gate that rode on it.
    # Both are now OFF, deliberately, and this is the reasoning — read it before
    # turning either back on.
    #
    # WHY. Adoption made the sweep redundant. Once the four satellite repos
    # published under the live framework identity, a prod boot measured
    # `compiled=0 alreadyBaked=84` — the sweep compiled NOTHING and still charged
    # 32.1 s of warm-up (64.8 s when adoption was broken). What it did on a MISS
    # was worse than useless: it blocked readiness on compiling types no user had
    # asked for. Adoption + the coverage report still run on every boot (they no
    # longer sit behind PreWarm__DynamicTypes); what is left uncovered compiles on
    # first access, when someone actually reaches it — measured at ~2.4 s per type
    # on the fleet, paid once, by that type's first visitor.
    #
    # WHAT READINESS MEANS NOW — say it out loud, because it is strictly weaker.
    # The gate certified a bake by COMPILING every type and refusing readiness if
    # one that USED to build no longer did. With nothing compiling at boot there is
    # no such verdict to reach, so the gate is turned OFF rather than left armed:
    # armed-with-nothing-behind-it reports healthy on every rollout and protects
    # NOTHING, which is the failure it exists to prevent. (The portal already
    # screams that combination at Critical — Memex.Portal.Distributed/Program.cs.)
    #
    # WHAT WE GIVE UP, precisely: a NodeType that regresses on a new image is no
    # longer caught at rollout. It now surfaces when a user first reaches it. That
    # is the trade this change makes knowingly.
    #
    # WHAT REPLACES IT: the boot coverage report. Every uncovered type is named at
    # warning with WHY, so "the bake lane broke" (an identity mismatch declines
    # every bundle wholesale — #1725) shows up as a coverage collapse in the logs
    # on the FIRST pod of a bad roll, before users meet it.
    #
    # 🚨 Do NOT "fix" this by gating on full adoption coverage. Uncovered>0 is the
    # normal steady state of a real portal: users author NodeTypes in their own
    # partitions and those have no CI bake by construction (the live memex share
    # holds two such types under `rbuergi`). A coverage gate would never go ready.
    PreWarm__DynamicTypes: "false"
    PreWarm__GateReadiness: "false"
    # A sweep that ERRORED verified nothing, so it refuses readiness like a regression does —
    # the guard the retired pre-run bake Job enforced from outside ("FINDING NOTHING IS NOT
    # PASSING"), restored on the surviving path. Note "empty" is NOT "unproven": a mesh with no
    # dynamic NodeTypes enumerates fine and serves. Flip to "true" ONLY to roll forward past an
    # environment that cannot answer the enumeration, accepting lazy compilation; it can never
    # waive a real regression, and /health keeps reporting the bake as unproven.
    PreWarm__AllowUnprovenBake: "false"
    # ---- CI-published bake bundles (#1660 WS3) -----------------------------
    # main-cd's publish-bake job copies the Build-and-Test run's baked NodeType assemblies onto
    # this portal's /data share as prebuilt-bundles/<framework-identity>/<source>/*.zip; the pod
    # seeds its OWN identity's directory before the sweep (ShippedPrebuiltBundles.
    # SeedPublishedRoot), so shipped content boots with zero Roslyn. CI builds are
    # deterministic (API-surface identity), so the identity CI baked under equals this image's —
    # and survives internal-only merges, so most rolls find the bundles already there. Inert while CI
    # has published nothing (the directory is simply absent and the sweep compiles as before).
    # Producer side: repo variable BAKE_PUBLISH_TARGETS must name this share
    # (.github/scripts/publish-bake-bundles.sh).
    PreWarm__PrebuiltBundleRoot: "/data/prebuilt-bundles"
    # ---- Assembly-cache retention ------------------------------------------
    # Every roll above writes a WHOLE NEW GENERATION of NodeType assemblies into
    # /data/assembly-cache (the framework MVID changes per image, by design), and
    # nothing ever removed one: 7817 DLLs across 93 generations, 3.2 GB of the
    # 16 GiB share on 2026-08-12, of which 1% was loadable by the running pod.
    # /data also holds the DataProtection key ring, so this share filling is not a
    # contained failure.
    #
    # The pod always claims the generation it runs and always logs what is
    # collectable. Flip this to "true" to let it collect — after reading one
    # report and confirming the kept set (own framework + anything claimed in the
    # last 24 h + the 3 newest + anything under 7 days old) covers your roll
    # cadence and your rollback headroom.
    AssemblyCache__Retention__Delete: "false"
    # ---- Platform self-update cadence --------------------------------------
    # The check is EVENT-DRIVEN (#1773): one pass at startup, then a check per
    # published build of the platform or of any module this environment deploys.
    # SelfUpdate__PollInterval is gone — it was renamed and this key sat here inert,
    # reading like a live daily throttle while binding to nothing (#1778).
    #
    # 🚨 There IS a SAFETY NET, and it is not the old poll (#2494). Every event
    # reaches an install across a chain nothing re-verifies — a GitHub webhook, a
    # WebhookInbox allowlist slot, an HMAC secret that must match byte-for-byte —
    # and every joint of it fails SILENTLY. An install whose event channel is dead
    # is indistinguishable from one that is up to date: healthy pods, no errors, a
    # check that simply never runs. memex sat three builds behind for 7 h exactly
    # so. SelfUpdate__SafetyNetCheckInterval bounds how long that can hide. It
    # cannot change the ROLL cadence — a safety-net check passes through the floor
    # below like any other — so it only ever shortens DISCOVERY.
    # 🚨 "00:00:00" disables it; NEVER "". Like MinRollInterval this binds to a
    # TimeSpan, and an empty string aborts the host in the configuration binder
    # (the chart renders a real default for exactly that reason).
    #
    # What this number now sets is the floor between two AUTOMATIC rolls. It is a
    # RESTART budget, not a delivery speed: a roll restarts the pod and drops every
    # live circuit on it. The trade, so this can be changed by editing one number:
    #
    #     24h  ->  <=1 restart/day,     a merged fix reaches prod the NEXT DAY
    #      6h  ->  <=4 restarts/day,    same working day
    #      1h  ->  <=24 restarts/day,   ~1.5 h after merge   <-- current
    #
    # 1h matches CD's reconcile tick, so hourly publication actually means hourly
    # delivery. The former 24h is deliberately NOT restored: it predates
    # adopt-before-compile (a prod roll went from 80 compiles / 64.8 s to 0
    # compiles / 32.1 s), so the compile-cost half of its 2026-08-10 rationale is
    # gone, and "tomorrow" is the answer that prompted the faster tick in the first
    # place. What remains true is the restart cost, which is what this bounds.
    #
    # Neither extreme delays an URGENT fix: `kubectl rollout restart` takes the
    # newest image immediately (the startup pass), and `gh workflow run
    # main-cd.yml --ref main` bypasses the batch window.
    SelfUpdate__MinRollInterval: "01:00:00"
    # The SAFETY NET (#2494): the longest this install may go without ASKING. It is
    # not the old poll — it cannot roll anything the floor above would refuse; it
    # only bounds how long a silently-broken event channel can keep an install
    # behind while looking perfectly healthy. "00:00:00" disables it, which is a
    # deliberate choice to make an install's freshness depend entirely on a chain
    # of configuration that fails without saying so.
    SelfUpdate__SafetyNetCheckInterval: "01:00:00"
    # Converge instances onto every newly published NodeType build (MeshWeaver#2192).
    # A prod portal's invariant is "after an update, everything serves the new build" —
    # leaving the banner default meant every publication wave stacked one more rooted
    # assembly generation on the type-hosting silos until they went GC-bound at 17-20 GB
    # while still Ready (2026-08-25, MeshWeaver#2194). Applies fleet-wide: every AKS
    # portal self-updates its catalog, so every one needs the convergence policy.
    Modules__AutoRecycleOnStaleBuild: "true"
    Mcp__BaseUrl: "http://memex-portal-service:8080"
    # ---- AI model providers (templated by the chart) ------------------------
    # These seed the system model catalog on deploy (BuiltInLanguageModelProvider
    # scans {Section}:Models/:Endpoint → nodeType:LanguageModel nodes the picker shows).
    # Only the AzureFoundry (open-weight /models) provider is configured via Helm.
    # Section name "AzureFoundry" is what the code binds (NOT "AzureAIS" — dead section).
    # Anthropic/Claude is intentionally NOT wired here — add it node-based later (a
    # ModelProvider node with the /anthropic endpoint). Key is in secrets.memex_portal
    # below (source from Key Vault via the CSI add-on). Full guide: Doc/AI/ModelProviderSetup.
    AzureFoundry__Endpoint: "https://CHANGE_ME_foundry_account.services.ai.azure.com/models"
    AzureFoundry__Models__0: "DeepSeek-V4-Pro"
    AzureFoundry__Models__1: "DeepSeek-V3-0324"
    AzureFoundry__Models__2: "DeepSeek-V4-Flash"
    # MoonshotAI Kimi — newest general Kimi on the Foundry account
    # (no K3 in the catalog as of 2026-07; K2.7-Code exists for code-heavy use).
    # Deployment cap 20K TPM = the account's full Kimi-K2.6 quota.
    AzureFoundry__Models__3: "Kimi-K2.6"
    # 🕰️ DEPRECATED tier → model keys. Open-weight DeepSeek ladder, all on one Foundry account.
    # Still read (Heavy → coding, Standard → reasoning, Light → chat, Utility → utility) so this
    # environment keeps its mapping, but they now sit BELOW the `tier` label on the model NODES —
    # label the nodes (Doc/AI/ModelTiers) and these can go.
    ModelTier__Heavy: "DeepSeek-V4-Pro"
    ModelTier__Standard: "DeepSeek-V3-0324"
    ModelTier__Light: "DeepSeek-V4-Flash"
    ModelTier__Utility: "DeepSeek-V4-Flash"
    # Per-user Claude Code config root → the RWX /mnt/users share (mounted by the portal deployment).
    # Lets each user connect Claude Code under their own dir; pairs with the PTY login fix.
    ClaudeCode__ConfigDirRoot: "/mnt/users"
    # ---- OpenTelemetry: export to the in-cluster OTel Collector -------------
    # ServiceDefaults.AddOpenTelemetryExporters() calls UseOtlpExporter() when
    # OTEL_EXPORTER_OTLP_ENDPOINT is set — this is the only telemetry path
    # (Azure Application Insights has been discontinued; observability is the
    # Prometheus / Grafana / Loki stack). The collector Service
    # (manifests/observability/otel-collector.yaml) listens on 4317 (gRPC) /
    # 4318 (HTTP). UseOtlpExporter defaults to gRPC, so the :4317 endpoint is
    # correct; OTEL_EXPORTER_OTLP_PROTOCOL is set explicitly for clarity.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    # ---- Sign-in: your AAD as HOME tenant + Google + LinkedIn ---------------
    # The portal's auth pipeline (AuthenticationBuilderExtensions) reads these
    # Authentication:* keys. Any provider with a ClientId set is offered on the
    # login page; "Microsoft" with a real TenantId pins the HOME (primary) AAD.
    #
    # Provider mode: setting any external-provider ClientId flips the portal into
    # multi-provider "Custom" mode automatically (HasExternalProviders == true) —
    # dev login is already disabled in the Distributed image (Program.cs). We set
    # it explicitly for clarity. Public host = portal.example.com.
    Authentication__Provider: "Custom"
    Authentication__EnableDevLogin: "false"
    # -- Microsoft / Entra ID (HOME tenant) -----------------------------------
    # TenantId MUST be a real AAD tenant GUID (NOT "common"/"organizations")
    # so that AAD is the home directory. ClientId = the app registration's
    # Application (client) ID. Add redirect URI https://portal.example.com/signin-microsoft
    # to that app registration. ClientSecret is in secrets.memex_portal above.
    # Your AAD home tenant (usually the subscription's own):
    #   az account show --query tenantId -o tsv
    Authentication__Microsoft__TenantId: "CHANGE_ME_aad_tenant_id"
    Authentication__Microsoft__ClientId: "CHANGE_ME_aad_application_client_id"
    # -- Google (other accounts) ----------------------------------------------
    # Redirect URI: https://portal.example.com/signin-google
    Authentication__Google__ClientId: "CHANGE_ME_google_oauth_client_id"
    # -- LinkedIn (other accounts) --------------------------------------------
    # Redirect URI: https://portal.example.com/signin-linkedin
    Authentication__LinkedIn__ClientId: "CHANGE_ME_linkedin_oauth_client_id"

# ===========================================================================
# AKS-specific values consumed by ./manifests (and a chart-extension contract).
# ===========================================================================

# --- Self-update (in-pod patch + ACR polling) -------------------------------
# Set azureClientId to the client id of the user-assigned managed identity federated to the
# memex-portal-sa service account (subject system:serviceaccount:<ns>:memex-portal-sa) and granted
# AcrPull on the registry. This arms ACR polling AND opts the pod into the workload-identity webhook.
# The in-cluster deployment PATCH (RBAC) works regardless; this is only needed to authenticate the
# ACR tag-list call. See Doc/Architecture/ReleaseStrategy → "AKS prerequisites".
#
# The value is the `portalIdentityClientId` output of infra/main.bicep (modules/portal-identity.bicep
# provisions the shared portal UAMI + a federated credential per namespace). The SAME client id is
# used for EVERY portal namespace — one shared UAMI, one AcrPull grant.
# Inject it at `helm upgrade` time rather than committing it: put the real id in the git-ignored
# values.deploy.yaml (see scripts/values.deploy.example.yaml), pass
# `--set selfUpdate.azureClientId=<portalIdentityClientId>`, or set it in that environment's
# git-ignored envs/<env>/values.<env>.yaml. See Doc/Architecture/DeploymentAKS → "Portal self-update".
selfUpdate:
  azureClientId: ""   # set per-env from the portalIdentityClientId bicep output

# --- Platform-admin Instances overview ---------------------------------------
# portal.example.com is the company/control instance — the ONE install that gets the Instances
# admin tab (Settings ▸ Administration ▸ Instances) and the cluster-scoped read RBAC behind it.
# clusterRead drives BOTH: the RBAC grant and Instances__Enabled (the menu item's existence).
# Every other install must NOT set this — their overlays inherit the chart default (false), so the
# tab does not exist there at all.
instancesAdmin:
  clusterRead: true
  # In-cluster Grafana (loki-stack, `monitoring` ns) has no public host yet — set this to the
  # Grafana base URL once it is exposed to get per-instance Loki log deep links on the tab.
  grafanaBaseUrl: ""

# --- Container images -------------------------------------------------------
# Default = pull straight from GHCR (no ACR needed). To use the private ACR,
# `az acr import` the images (see README) and set registry to the ACR login
# server, e.g. <aks>acrxxxx.azurecr.io. The chart currently hardcodes the
# ghcr.io path; ./manifests/portal-ingress.yaml and the README's
# `helm upgrade --set` examples show how to repoint it.
image:
  registry: "ghcr.io/systemorph"      # or "<acrName>.azurecr.io"
  # Sizable image: memex-portal-ai is the FULL AI-enabled portal (co-hosted
  # Claude Code / Copilot CLIs, all providers) — the heavyweight variant, as
  # opposed to the lean `memex-portal`. Paired with the larger resources block
  # below + portal-ha-patch.yaml so each replica gets a few CPUs and a bit of RAM.
  portal: "memex-portal-ai"
  migration: "memex-migration"
  tag: "latest"
  pullPolicy: "IfNotPresent"

# --- Portal pod resources (GENEROUS — sizable AI image on 32 GiB nodes) ------
# Applied to each replica. The actual requests/limits land on the container via
# manifests/portal-ha-patch.yaml (kept in sync with these). The AI image is
# memory-hungry (NodeType compile cache, agent runtimes), so on the Standard_D8s_v5
# nodes (8 vCPU / 32 GiB) we give it generous headroom — 2 replicas + system pods
# still fit comfortably per node.
resources:
  portal:
    requests:
      cpu: "4"         # a few CPUs
      memory: "8Gi"    # a bit of RAM
    limits:
      cpu: "6"         # generous CPU ceiling
      memory: "16Gi"   # generous memory ceiling (half a 32 GiB node)

# --- HA / replicas ----------------------------------------------------------
# Launch 2 portal replicas (needs cookie session affinity + AdoNet Orleans
# clustering + RWX on every claim; all three are configured below and asserted
# at render time by .github/workflows/chart-gate.yml).
#
# ⚠️ Read ONLY when keda.enabled is false. With KEDA on — which is this file's
# default — the HPA owns spec.replicas and the chart renders no such field, so
# the floor that actually applies is keda.minReplicas below. This key is the
# no-autoscaler fallback, kept equal to that floor so the two never disagree.
#
# 🚨 Until 2026-08-14 the chart consumed NEITHER: templates/memex-portal/
# deployment.yaml hard-coded `replicas: 1`, so this value had sat here inert
# since 2026-07-13 while a production install served every request from one pod
# whose loss was a multi-minute 503.
replicas:
  portal: 2        # fallback when keda.enabled is false; KEDA's minReplicas owns it otherwise
  postgres: 1      # self-managed pg StatefulSet stays single-writer

# --- KEDA autoscaling (portal) ---------------------------------------------
# Event-driven autoscaling for the portal. Requires the KEDA operator — enable
# the AKS managed add-on once per cluster:
#   az aks update -g <aks-resource-group> -n <aks-cluster> --enable-keda
# metrics-server is already present. Once the ScaledObject exists, its HPA owns
# the replica count, so the fixed `replicas.portal` above and any env
# portal-patch.json replica override become moot. min=2 keeps HA + seeds the
# Orleans cluster; it scales toward 4 under a class-sized load and up to 8 at
# peak. Scale-down is deliberately slow (stateful Blazor circuits + Orleans
# membership churn) — see the ScaledObject template.
keda:
  enabled: true
  minReplicas: 2        # baseline floor (HA + Orleans cluster seed); bursts to max under load
  maxReplicas: 8
  cpuTarget: 70
  memoryTarget: 80

# --- Persistence (Azure Files CSI for ReadWriteMany) ------------------------
# Blazor Server portal replicas share every /data + /mnt/* path, so those PVCs
# MUST be ReadWriteMany. They use the custom `azurefile-memex` StorageClass
# (manifests/storageclass-azurefile.yaml) which pins uid/gid=1654 so the non-root
# portal user can write. The Postgres data volume is single-writer and uses
# managed-csi (Premium SSD) for IOPS. ./manifests/portal-pvcs.yaml (or
# aks-extras.yaml on the memex ns) creates the PVCs; the CHART mounts every
# entry with a claimName — a plain `helm upgrade` renders the PVC volumes
# directly, no post-apply kubectl patch needed (the old bolt-on patches meant
# any unpatched apply silently reverted /data to emptyDir and every restart
# wiped the assembly/nuget/DataProtection caches).
#
# One Azure Files "drive" per concern, mounted at an explicit path:
#   data        -> /data            framework caches only (DP keys, asm + nuget cache)
#   content     -> /mnt/content     the content collection (Storage__BasePath)
#   attachments -> /mnt/attachments dedicated attachments drive (opt-in — claimName
#                                   stays empty here; the env patch adds it where used)
#   users       -> /mnt/users       co-hosted CLI configs
persistence:
  data:
    claimName: "memex-data"           # chart-mounted at /data
    storageClass: "azurefile-memex"   # RWX, uid/gid 1654
    accessMode: "ReadWriteMany"
    mountPath: "/data"
    size: "16Gi"                      # shrunk: content moved off /data
  content:
    claimName: "memex-content"        # chart-mounted at mountPath
    storageClass: "azurefile-memex"   # RWX, uid/gid 1654
    accessMode: "ReadWriteMany"
    mountPath: "/mnt/content"
    size: "128Gi"
  attachments:
    storageClass: "azurefile-memex"   # RWX, uid/gid 1654
    accessMode: "ReadWriteMany"
    mountPath: "/mnt/attachments"
    size: "64Gi"
  users:
    claimName: "memex-users"          # chart-mounted at /mnt/users
    storageClass: "azurefile-memex"   # RWX, uid/gid 1654
    accessMode: "ReadWriteMany"
    mountPath: "/mnt/users"
    size: "32Gi"
  postgres:
    storageClass: "managed-csi"       # RWO, Premium SSD
    accessMode: "ReadWriteOnce"
    size: "128Gi"

# --- Startup-probe budget (paired with the pod-side NodeType bake) ----------
# ⚠️ PAIRED with PreWarm__GateReadiness above: the gate holds /health red while
# the pod bakes, and a cold bake (fresh framework identity, empty cache for it)
# is strictly sequential. The default budget (5 s × 60 = 5 min) kills the pod
# mid-bake, on every attempt, forever.
#
# ⏱️ DERIVED from the MEASURED per-type cost, 2026-08-10 (production Loki, three
# installations on one image): ~2.4 s per NodeType, within 3% across a 10x spread
# in mesh size — 22-36 types / 68 s at the small end, 237-241 / 567 s at the large
# end. Per-installation figures live with the deployments they describe.
#
#   largest measured       ~240 types x 2.4 s  ~= 570 s  (~10 min)
#   + plain cold boot      schema provisioning + static import
#   worst realistic startup                    ~= 870 s  (~15 min)
#   x2 headroom             10 s x 180          = 1800 s (30 min)
#
# Covers ~750 types, 3x the largest measured mesh, so growth has room.
#
# 🚨 Was 10 × 1080 = 3 h until 2026-08-10, sized from a "~90 s per NodeType"
# estimate measurement showed to be 37x too high. A stuck bake now trips this in
# 30 min instead of hiding inside a 3-hour window that detected nothing.
probes:
  startup:
    periodSeconds: 10
    failureThreshold: 180

# --- Ingress with cookie session affinity (Blazor Server is sticky) ---------
# Blazor Server holds a per-circuit SignalR connection; without sticky sessions
# a reconnect can land on a different replica and drop the circuit. Pick ONE
# ingress controller (see README for AGIC vs ingress-nginx trade-offs); both
# annotation sets are provided in ./manifests/portal-ingress.yaml.
ingress:
  enabled: true
  className: "webapprouting.kubernetes.azure.com"  # AKS app routing (managed nginx)
  host: "portal.example.com"
  tls:
    enabled: true
    secretName: "memex-tls"
  sessionAffinity:
    enabled: true
    cookieName: "MEMEX_AFFINITY"
    # nginx ("webapprouting"/"ingress-nginx") cookie-affinity annotations:
    nginxAnnotations:
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/affinity-mode: "persistent"
      nginx.ingress.kubernetes.io/session-cookie-name: "MEMEX_AFFINITY"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"      # long-lived SignalR
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # AGIC (Application Gateway Ingress Controller) cookie-affinity annotations:
    agicAnnotations:
      appgw.ingress.kubernetes.io/cookie-based-affinity: "true"
      appgw.ingress.kubernetes.io/request-timeout: "3600"

# --- pgBackRest PITR sidecar (self-managed Postgres backup to Azure Blob) ---
# Toggle for the ./manifests/pgbackrest resources. Disable if you migrate to
# Azure Database for PostgreSQL Flexible Server (managed PITR — recommended for
# turnkey prod; see README).
pgbackrest:
  enabled: true
  # Values from the storage.bicep outputs:
  azure:
    account: "<aks>bkpXXXX"          # backupStorageAccount output
    container: "pgbackrest"             # backupContainerName output
    # Workload Identity client id (backupIdentityClientId output). Keyless.
    workloadIdentityClientId: "00000000-0000-0000-0000-000000000000"
    # Alternatively set a storage account key here and switch repo auth in the
    # pgbackrest config (see manifests/pgbackrest/configmap.yaml).
    accountKey: ""
  serviceAccount: "pgbackrest-sa"
  retention:
    full: 4        # keep 4 full backups
    diff: 6        # keep 6 differentials
  schedule:
    full: "0 2 * * 0"     # weekly full,  Sun 02:00 UTC
    diff: "0 2 * * 1-6"   # daily diff,   Mon-Sat 02:00 UTC
