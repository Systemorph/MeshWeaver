<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Default font families for the headless browser.

  🚨 Without this the image renders NOTHING IN BOLD, silently.

  Chromium's font set here comes from Playwright's dependency list, which installs a broad
  CJK/Thai/Cyrillic collection so any content prints. One of those, WenQuanYi Zen Hei, claims
  the generic `sans-serif` and `system-ui` families in its own fontconfig snippet — and it
  ships a Regular face ONLY. So `font-weight: 700` matched a family with no bold, Chromium did
  not synthesise one, and every heading, table header and **bold** run printed at regular
  weight. Measured before this file existed: `fc-match "sans-serif:bold"` answered
  "WenQuanYi Zen Hei Regular".

  `prefer` puts a Latin family with a complete weight range at the FRONT of the match list
  without removing anything, so per-glyph fallback still reaches the CJK fonts for characters
  Liberation does not carry. Coverage is unchanged; only the default changes.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>FreeSans</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>FreeSans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>FreeSerif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Liberation Mono</family>
      <family>FreeMono</family>
    </prefer>
  </alias>
</fontconfig>
