{{- /*
The AppArmor profile the build hosts run under, LOADED by the chart (`buildHosts.sandbox.appArmorLoader`).
A kernel with apparmor_restrict_unprivileged_userns=1 (Ubuntu 24.04's default) denies bwrap's user
namespace to every process whose profile does not grant `userns` — RuntimeDefault and Unconfined
included. The narrow answer is a profile that grants it to the build host's container ALONE, instead
of the node-wide sysctl that would grant it to every pod on the CI pools.

The profile is unconfined apart from granting userns: containerd's RuntimeDefault denies `mount`,
which bwrap needs inside its namespaces, so a confining profile would break the sandbox it exists to
allow. The host's isolation is unchanged from RuntimeDefault in every other respect that matters
here — seccomp, dropped capabilities, no privilege escalation, non-root, the egress policy.

The loader is a DaemonSet on the build hosts' pools: it runs the runner image's apparmor_parser
(`apparmor` ≥ 4, asserted in deploy/build-host/Dockerfile) once, privileged, against the node's
securityfs, then sleeps; it is ready only once the profile is loaded. A profile lives until the node
reboots, and the DaemonSet's restart on that node loads it again. A host pod scheduled before the
load fails container creation and is retried by the kubelet — it never runs without the profile.
*/ -}}
{{- $b := include "memex.buildHosts" . | fromYaml }}
{{- if and $b.enabled $b.sandbox.appArmorLoader }}
{{- $runner := (index $b.channels 0).runner }}
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "build-host-apparmor"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "build-host-apparmor"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  mw-build-host: |
    abi <abi/4.0>,
    include <tunables/global>

    profile mw-build-host flags=(unconfined) {
      userns,
    }
---
apiVersion: "apps/v1"
kind: "DaemonSet"
metadata:
  name: "build-host-apparmor"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "build-host-apparmor"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: "build-host-apparmor"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "build-host-apparmor"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
      annotations:
        checksum/profile: {{ "mw-build-host-userns-v1" | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $b.imagePullSecret }}
      imagePullSecrets: [{ name: {{ $b.imagePullSecret | quote }} }]
      {{- end }}
      containers:
        - name: "load"
          image: {{ $runner | quote }}
          command: ["/bin/sh", "-c", "set -e; apparmor_parser --replace --skip-cache /profiles/mw-build-host; echo 'loaded mw-build-host'; touch /tmp/loaded; exec sleep infinity"]
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "test -f /tmp/loaded"] }
            periodSeconds: 10
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: "profiles", mountPath: "/profiles", readOnly: true }
            - { name: "securityfs", mountPath: "/sys/kernel/security" }
      volumes:
        - name: "profiles"
          configMap: { name: "build-host-apparmor" }
        - name: "securityfs"
          hostPath: { path: "/sys/kernel/security", type: "Directory" }
{{- end }}
