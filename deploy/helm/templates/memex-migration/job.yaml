---
# Run-once migration JOB.
#
# 🚨 This WAS a Deployment (replicas: 1) — which re-ran the migration FOREVER: every time the
# migration process exited 0, the Deployment restarted it, and each run rebuilds the
# public.top_level_index materialized view across EVERY partition schema (CPU-heavy). Over a day
# that was 310 restarts pegging a full core — the "benign CrashLoopBackOff" the docs assumed was
# actually a CPU storm. A Job runs to completion and STOPS.
#
# The name embeds .Release.Revision so a fresh Job is created on every `helm upgrade` (so a NEW
# migration still runs), and ttlSecondsAfterFinished auto-cleans the completed Job. The config +
# secret stay regular (non-hook) resources, so there is no pre-hook ordering problem — they are
# applied with the chart and available when the Job runs.
apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "memex-migration-{{ .Release.Revision }}"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-migration"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  {{- /* 🚨 The migration has a BUDGET, enforced twice from one number (maintainer, 2026-09-07).
         Inside the process MIGRATION_BUDGET_MINUTES (below) makes the runner fail RED, naming
         the step, when a repair or phase outlives it; outside, activeDeadlineSeconds makes
         Kubernetes kill the Job at the same budget plus one minute of grace for the process to
         report. Default 10 minutes. A deployment that needs more sets migration.budgetMinutes
         EXPLICITLY in its overlay — the whole point is that nobody gets more by accident.
         The Job that made the rule: memex-cloud, 3.0.0-ci.8009, 4 h 30 min into a row-at-a-time
         embedding backfill, its deploy long since reported failed, nothing naming the cause. */}}
  activeDeadlineSeconds: {{ add (mul (int .Values.migration.budgetMinutes) 60) 60 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "memex-migration"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      restartPolicy: "Never"
      initContainers:
        # Postgres and the migration can start concurrently on a fresh install; gate on Postgres
        # TCP readiness so the migration doesn't fail-fast before the DB accepts connections.
        - name: "wait-for-postgres"
          image: "busybox:1.36"
          command:
            - "sh"
            - "-c"
            {{- $pgHost := .Values.postgres.enabled | ternary "memex-postgres-service" (.Values.config.memex_migration.MEMEX_HOST | default "memex-postgres-service") }}
            {{- $pgPort := .Values.postgres.enabled | ternary "5432" (.Values.config.memex_migration.MEMEX_PORT | default "5432") }}
            - "until nc -z {{ $pgHost }} {{ $pgPort }}; do echo 'waiting for postgres'; sleep 2; done"
        {{- /* 🚨 REHEARSAL BEFORE EXECUTION (maintainer, 2026-09-07: "we must first test the
               migration process and only then execute"). The SAME image with the SAME env as the
               migration container, asked what it would do: MIGRATION_MODE=rehearse reads the
               current version, counts what every pending rehearsable repair would touch, executes
               nothing and exits — non-zero when a plan fails to count. An init container that
               fails never lets the migration container start, so "tested first, then executed"
               is the pod's own ordering, not a convention. Hand-written repairs (≤ V55) are named
               as uncountable and run under the budget only. Disable with migration.rehearse: false
               — an image older than MeshWeaver.Plugins#1489 ignores the mode and would run the
               whole migration twice, which is why the chart default follows that image. */}}
        {{- if .Values.migration.rehearse }}
        - name: "memex-migration-rehearsal"
          image: "{{ .Values.migration.image }}"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: "MIGRATION_MODE"
              value: "rehearse"
            - name: "MIGRATION_BUDGET_MINUTES"
              value: {{ .Values.migration.budgetMinutes | int | quote }}
          envFrom:
            - configMapRef:
                name: "memex-migration-config"
            - secretRef:
                name: "memex-migration-secrets"
            {{- range $class := (include "memex.keyVaultClasses" . | fromYamlArray) }}
            - secretRef:
                name: "{{ $class.syncedSecret }}"
                optional: true
            {{- end }}
          {{- $rehearsalClasses := (include "memex.keyVaultClasses" . | fromYamlArray) }}
          {{- if $rehearsalClasses }}
          volumeMounts:
            {{- range $class := $rehearsalClasses }}
            - name: "{{ $class.volumeName }}"
              mountPath: "{{ $class.mountPath }}"
              readOnly: true
            {{- end }}
          {{- end }}
        {{- end }}
      containers:
        - image: "{{ .Values.migration.image }}"
          name: "memex-migration"
          env:
            - name: "MIGRATION_BUDGET_MINUTES"
              value: {{ .Values.migration.budgetMinutes | int | quote }}
          envFrom:
            - configMapRef:
                name: "memex-migration-config"
            - secretRef:
                name: "memex-migration-secrets"
            {{- /* The Key Vault CSI-synced secrets, exactly as the portal consumes them
                   (memex-portal/deployment.yaml). WITHOUT this the migration cannot receive
                   `Embedding__ApiKey`, and `MeshNodeEmbeddingBackfill` — which is the ONLY thing
                   that embeds rows written before a provider existed — skips every row.

                   Measured on the `memex` release 2026-09-06, migration job memex-migration-32:
                       [DocBackfill] 1242 documentation pages found (embeddings OFF — FTS only)
                       [DocBackfill] done: 161 upserted (0 embedded), 1081 unchanged, 1242 total
                       [EmbeddingBackfill] no embedding provider configured — skipped
                       Database migration completed. Version: 55
                   A green migration that embedded nothing: search stays lexical-only for every
                   pre-existing row, and nothing in the run says the index is empty.

                   `optional: true` because the CSI driver only materialises the synced Secret
                   while a pod mounts the SecretProviderClass volume — on a FIRST install no portal
                   pod has started yet, and a missing non-optional secretRef would keep the Job
                   from starting at all. Skipping is safe there and only there: a first install has
                   no pre-existing rows to backfill, and the run still says so out loud via
                   `[EmbeddingBackfill] … skipped` plus EmbeddingCapabilityReporter.

                   🚨 The envFrom alone gives the Job a value, not a CURRENT value — which is why
                   the volumeMounts below are not optional decoration. See their comment. */}}
            {{- range $class := (include "memex.keyVaultClasses" . | fromYamlArray) }}
            - secretRef:
                name: "{{ $class.syncedSecret }}"
                optional: true
            {{- end }}
            {{- /* ⚠️ LEGACY ESCAPE HATCH — the SAME env sources the portal Deployment renders
                   (memex-portal/deployment.yaml), and for the SAME reason the block above exists
                   (MeshWeaver#3595).

                   The block above covers only the classes the CHART owns. An environment whose
                   SecretProviderClass is HAND-MADE attaches it by name through `.Values.extraEnvFrom`
                   instead — the shape values.yaml calls "the memex-cloud AI-keys shape" — and until
                   this block existed the Job rendered NONE of it. That is a different defect from
                   #3548, which was STALENESS: for a key delivered this way the Job had no value at
                   all, so `MeshNodeEmbeddingBackfill` took the not-configured path, logged-and-
                   skipped every row, and the Job still reported `Database migration completed`.
                   Same green run, same silent outcome, different mechanism.

                   VERBATIM, and deliberately NOT `optional: true`. The chart-owned entries above
                   are optional because the chart RENDERS their SecretProviderClass and knows a
                   first install has no pre-existing rows to backfill. The chart owns nothing here:
                   the operator declared this source, and the volumes below are what materialise it
                   before this container starts. Marking it optional would recreate the very defect
                   this block closes — an absent value read as "not configured", green and silent.
                   The portal Deployment has identical semantics for the identical entries, so an
                   env whose Secret is genuinely missing already fails there. */}}
            {{- range .Values.extraEnvFrom }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          imagePullPolicy: "IfNotPresent"
          {{- /* 🚨 THE JOB MOUNTS THE SPC ITSELF — this is what makes the values above CURRENT
                 (MeshWeaver#3548).

                 The synced Secret the envFrom reads is materialised and rotated by the CSI driver
                 FOR THE PODS THAT MOUNT THE SecretProviderClass VOLUME. Until this block existed
                 that was the portal pods and nobody else: the Job mounted nothing, started the
                 instant `helm upgrade` applied, and `envFrom` is resolved once at container start.
                 So on any deploy that CHANGES an SPC mapping, the Job read the value from BEFORE
                 the change — and the backfill logs-and-skips per row rather than failing.

                 Measured on the `memex` release 2026-09-07, job memex-migration-33, the deploy that
                 repointed `Embedding__ApiKey` from the Azure object to the OpenRouter one:
                     [DocBackfill] 1274 documentation pages found (embeddings ON)
                     EmbeddingRequestException: … HTTP 401 (Unauthorized) — the bearer was
                       rejected …                                              × 1260
                     [DocBackfill] done: 1274 upserted (0 embedded), 0 unchanged, 1274 total
                     Database migration completed.
                 1,260 refusals and a GREEN Job. A portal pod that started minutes later held the
                 SAME key name and got 200s, so the vault was right and the Job's copy was stale.

                 A CSI mount is set up before ANY container in the pod starts, and NodePublishVolume
                 fetches the objects from the vault at that moment — so the driver refreshes the
                 synced Secret before the kubelet resolves this container's envFrom. The Job then
                 gets the current objects BY CONSTRUCTION, independent of the portal pods' rotation
                 poll. That is the whole point: not a retry, not a second `helm upgrade`, an
                 ordering that cannot be lost.

                 Same volumeName/mountPath as the portal, from the one `memex.keyVaultClasses`
                 block, so the class, the volume, the mount and the envFrom can never disagree on a
                 name. Rendered only when a class is declared — a namespace with no Key Vault gets
                 the pod spec it had before. */}}
          {{- $keyVaultClasses := (include "memex.keyVaultClasses" . | fromYamlArray) }}
          {{- if or $keyVaultClasses .Values.extraVolumeMounts }}
          volumeMounts:
            {{- range $class := $keyVaultClasses }}
            - name: "{{ $class.volumeName }}"
              mountPath: "{{ $class.mountPath }}"
              readOnly: true
            {{- end }}
            {{- /* ⚠️ LEGACY: the mount half of the escape hatch, and the half that carries the
                   whole freshness argument above for a HAND-MADE SecretProviderClass. The envFrom
                   entry names the synced Secret; THIS is what makes the CSI driver fetch the vault
                   objects and write that Secret before any container in this pod starts. Without
                   it the Job would free-ride on the portal pods' mount — #3548's defect, in
                   escape-hatch clothing. KeyVaultEscapeHatchParityGuard asserts the pair. */}}
            {{- range .Values.extraVolumeMounts }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- end }}
      {{- if or $keyVaultClasses .Values.extraVolumes }}
      volumes:
        {{- range $class := $keyVaultClasses }}
        - name: "{{ $class.volumeName }}"
          csi:
            driver: "secrets-store.csi.k8s.io"
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ $class.name }}"
        {{- end }}
        {{- /* ⚠️ LEGACY: the volume half — typically the secrets-store CSI volume behind a
               hand-made SecretProviderClass. Verbatim Volume objects, mounted by
               .Values.extraVolumeMounts above. */}}
        {{- range .Values.extraVolumes }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      {{- end }}
