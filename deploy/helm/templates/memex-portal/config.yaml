---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "memex-portal-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  MEMEX_HOST: "{{ .Values.config.memex_portal.MEMEX_HOST }}"
  MEMEX_PORT: "{{ .Values.config.memex_portal.MEMEX_PORT }}"
  MEMEX_USERNAME: "{{ .Values.config.memex_portal.MEMEX_USERNAME }}"
  MEMEX_JDBCCONNECTIONSTRING: "{{ .Values.config.memex_portal.MEMEX_JDBCCONNECTIONSTRING }}"
  MEMEX_DATABASENAME: "{{ .Values.config.memex_portal.MEMEX_DATABASENAME }}"
  ASPNETCORE_HTTP_PORTS: "{{ .Values.config.memex_portal.ASPNETCORE_HTTP_PORTS }}"
{{- if (.Values.grpc).enabled }}
  # ---- Native gRPC (HTTP/2) — see .Values.grpc ------------------------------
  # Explicit Kestrel endpoints (these OVERRIDE ASPNETCORE_HTTP_PORTS, so the web port is
  # restated): the web port stays HTTP/1.1+2 defaults; the gRPC port is h2c (Http2-only —
  # cleartext HTTP/2 needs prior knowledge, which requires a dedicated endpoint); the trusted
  # port binds loopback so ONLY same-pod containers (the shipped gates) can reach it.
  ASPNETCORE_Kestrel__Endpoints__Http__Url: "http://0.0.0.0:{{ .Values.config.memex_portal.ASPNETCORE_HTTP_PORTS | default 8080 }}"
  ASPNETCORE_Kestrel__Endpoints__Grpc__Url: "http://0.0.0.0:{{ .Values.grpc.port }}"
  ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: "Http2"
  ASPNETCORE_Kestrel__Endpoints__GrpcTrusted__Url: "http://127.0.0.1:{{ .Values.grpc.trustedPort }}"
  ASPNETCORE_Kestrel__Endpoints__GrpcTrusted__Protocols: "Http2"
  # The server-side trust discriminator (GrpcOptions): a connection whose local port is this one
  # authenticates as a trusted co-deployed service.
  Grpc__TrustedPort: "{{ .Values.grpc.trustedPort }}"
{{- end }}
  Deployment__Backend: "{{ .Values.config.memex_portal.Deployment__Backend }}"
  Deployment__DataRoot: "{{ .Values.config.memex_portal.Deployment__DataRoot }}"
  # The writable root the store-installed `modules/` tree lives under (ModuleRoot.ConfigKey).
  # 🚨 It MUST be templated here to exist at all: this ConfigMap names every key explicitly and
  #   the Deployment's only env path is `envFrom` — so a values file that sets a key this
  #   template does not render produces nothing, silently. That is precisely how it "kept
  #   vanishing" (Memex#53 set it in three AKS values files; none of them could reach a
  #   container).
  # 🚨 Blank is NOT the same as unset-but-harmless: ModuleRoot treats blank as absent and falls
  #   back to AppContext.BaseDirectory (/app), which is READ-ONLY in the container — so the
  #   module lane cannot land anything and every store-installed module's routes stay unmapped.
  #   Default it to the deployment's data root, which is the shared writable volume by
  #   construction, rather than emitting an empty string.
  Modules__Root: "{{ .Values.config.memex_portal.Modules__Root | default .Values.config.memex_portal.Deployment__DataRoot }}"
  # ---- NodeType bake ------------------------------------------------------
  # 🚨 ADOPTION IS NOT CONFIGURED HERE — it is unconditional. Every boot seeds the prebuilt
  #   bundles (PreWarm__PrebuiltBundleRoot below, plus the image's own prebuilt/ directory) and
  #   logs what that covered, naming every type it did not. The keys below control only whether
  #   the LEFTOVER is also compiled at boot. They used to gate the seeding too, which meant the
  #   default deployment (DynamicTypes=false) adopted nothing at all.
  # PreWarm__DynamicTypes: ALSO compile every uncovered dynamic NodeType at startup, sequentially
  #   and in dependency order, RESUMING from the shared assembly cache under Deployment__DataRoot.
  #   Off (the default, and now the fleet's setting too) → whatever adoption did not cover
  #   compiles on first access, i.e. when a user reaches that type — ~2.4 s once, for that type's
  #   first visitor, instead of a boot-time sweep of everything nobody asked for.
  # PreWarm__GateReadiness: hold /health RED until that bake is green. With the
  #   startupProbe on /health and maxUnavailable:0, a NodeType that REGRESSED on the new
  #   image stalls the rollout with the previous image still serving, instead of erroring
  #   in front of users. Only a type that WAS working can gate — a pre-existing broken type
  #   is logged and skipped, so one abandoned NodeType can't freeze every future deploy.
  #   And only a real VERDICT gates: a compile error, or a dependent blocked by one. A type
  #   the sweep could not evaluate (a timeout — or a dependent of something that timed out)
  #   is reported as unevaluated and named in the /health payload, never counted as a
  #   regression. That distinction is what makes the gate safe to arm while cross-silo
  #   source resolution (core #694) is still imperfect.
  #
  # ⚠️ GateReadiness has THREE prerequisites; missing any one makes it silently useless:
  #    1. PreWarm__DynamicTypes must ALSO be true — the gate reads state only the sweep
  #       writes, so gate-without-sweep is permanently green. The portal logs that
  #       combination at Critical on startup.
  #    2. A startupProbe ON /health with a budget covering a full COLD bake (~2.4 s per
  #       NodeType, sequential, measured 2026-08-10 — ~10 min on the largest mesh we run).
  #       See probes.startup in values — turning the gate on without raising it means
  #       Kubernetes kills the pod mid-bake, every time, forever. Nothing else reads the
  #       gate: a namespace probing /alive, /ready or /healthz ignores it entirely.
  #    3. strategy.maxUnavailable: 0 — the gate works by making the NEW pod refuse
  #       readiness, which protects nothing if the serving pod was already deleted.
  # PreWarm__AllowUnprovenBake: the escape hatch for the one condition that is NOT a verdict —
  #   the sweep ERRORED (enumeration threw or timed out) and so verified nothing. That refuses
  #   readiness by default, because a gate that certifies "I verified nothing" is worse than no
  #   gate: it was the retired pre-run bake Job's Bake__AllowEmpty guard ("FINDING NOTHING IS NOT
  #   PASSING", exit 3), lost when #1357 retired the Job and now enforced on the surviving path.
  #   Set true only to roll forward despite an environment that cannot answer the enumeration,
  #   accepting lazy compilation — never to quiet a recurring fault, which is a defect to find.
  #   It can NEVER waive a real regression, and /health keeps reporting the bake as unproven.
  #   ⚠️ Note "empty" is NOT "unproven": a mesh that genuinely has no dynamic NodeTypes enumerates
  #   successfully, completes, and serves. Only the inability to obtain an answer gates.
  PreWarm__DynamicTypes: "{{ .Values.config.memex_portal.PreWarm__DynamicTypes }}"
  PreWarm__GateReadiness: "{{ .Values.config.memex_portal.PreWarm__GateReadiness }}"
  PreWarm__AllowUnprovenBake: "{{ .Values.config.memex_portal.PreWarm__AllowUnprovenBake }}"
  {{- /* PreWarm__BuildProtocol: coordinate the bake through the Build nodes (Admin/Build claim +
         chunk activities + the per-fingerprint GO) instead of the file lease and the follower's
         share poll — Doc/Architecture/BuildCoordination. Execution is the same sweep either way.
         This key must exist HERE or it is silently dropped: the configmap lists keys explicitly
         rather than iterating .Values.config, so an un-templated key never reaches the pod. */}}
  PreWarm__BuildProtocol: "{{ .Values.config.memex_portal.PreWarm__BuildProtocol }}"
  {{- /* PreWarm__BatchBake: one linked batch build instead of per-type hub activations. Gated
         pods batch by default in code; this key is the explicit override — and it was declared
         in the AKS gate values for months while NOT templated here, i.e. silently dropped
         (it only "worked" because the gate made batch the code default). Ungated hosts that
         want the fast path (memex-local) need it to actually render. */}}
  PreWarm__BatchBake: "{{ .Values.config.memex_portal.PreWarm__BatchBake }}"
  {{- /* PreWarm__BetweenTypes: pacing between types on the activation path. Gated pods sweep at
         full speed by default; ungated pods keep a serving-friendly trickle unless this says
         otherwise ("00:00:00" = full speed — right for a single-replica local install where
         nothing is serving during startup anyway). Empty renders harmlessly: the host skips
         blank values without a warning. */}}
  PreWarm__BetweenTypes: "{{ .Values.config.memex_portal.PreWarm__BetweenTypes }}"
  {{- /* PreWarm__PrebuiltBundleRoot: where CI's published NodeType bake is mounted
         (<root>/<framework-identity>/<source>/*.zip). The pod seeds its OWN identity's
         subdirectory before deciding what to build, so shipped content boots with zero Roslyn.

         🚨 THIS KEY MUST BE TEMPLATED TO EXIST. This configmap enumerates keys explicitly — it
         does NOT iterate .Values.config — so a key set in a values file but missing HERE is
         silently dropped, with no warning anywhere. That is exactly what happened to this one:
         values.aks.yaml has set it since #1660 WS3 while the configmap never rendered it, so
         every chart-deployed portal ran with the CI-bake lane inert and compiled content CI had
         already baked. Adding a PreWarm key to a values file is only half the change.

         Empty renders harmlessly: the host skips blank values, and the seeding logs "no published
         bundle root configured" at debug and stays inert. */}}
  PreWarm__PrebuiltBundleRoot: "{{ .Values.config.memex_portal.PreWarm__PrebuiltBundleRoot }}"
  # ---- Assembly-cache retention -------------------------------------------
  # The bake writes one WHOLE GENERATION of NodeType assemblies per image, because the store
  # keys every file by the MeshWeaver.Graph MVID and a CI build changes it on every publish.
  # That is deliberate ABI safety (a new image must never load the previous image's bytes);
  # what was missing is anything that removes an old generation. Measured on memex 2026-08-12:
  # 7817 DLLs / 93 generations / 3.2 GB of a 16 GiB share — 1% of it loadable — on the SAME
  # share as the DataProtection key ring, so filling it takes auth-adjacent state with it.
  #
  # The pod always CLAIMS the generation it runs (that claim, not an age or a count, is what
  # proves a generation is still referenced) and always REPORTS what is collectable. This key
  # arms the deletion. Off by default deliberately: read one report, confirm the kept set
  # matches your roll cadence, then arm it — a first run that deletes on unexamined defaults is
  # the one mistake here that cannot be undone.
  #
  # A generation is kept if ANY of these holds: it is the pod's own framework, a claim younger
  # than 24 h names it, it is one of the 3 most recently written, or its newest file is under
  # 7 days old. Nothing outside the per-NodeType directories is ever touched, and any error
  # reading the cache aborts the sweep with nothing collected.
  AssemblyCache__Retention__Delete: "{{ .Values.config.memex_portal.AssemblyCache__Retention__Delete | default "false" }}"
  {{- /* Notification retention (Doc/Architecture/NotificationRetention, MeshWeaver#3250). A pass
         that runs per signing-in user over that user's own partition — plus Admin for a global
         admin — removing notifications whose node has gone MaxAge without being written.

         ARMED by default, in the CODE: NotificationRetention.FromConfiguration starts from
         NotificationRetention.Default and overrides a field only when its key PARSES. So an empty
         or absent value here changes nothing — a values file predating these keys renders "" for
         them and the portal still runs 90 days / 200 per run, armed. The Helm `default`s are NOT
         what arms the pass; they exist so the RENDERED ConfigMap states the effective policy an
         operator is running instead of three empty strings, and they mirror
         NotificationRetention.Default so the two can never disagree. Turning the pass off is an
         explicit "false", never an omission.

         The window is clamped to a 7-day floor in code, so a "0.00:00:00" typo here cannot empty
         a bell; an unparseable value keeps the 90-day default. MaxDeletionsPerRun is the bound on
         ONE logon's housekeeping — a partition with a backlog drains over successive logons. */}}
  Notifications__Retention__Enabled: "{{ .Values.config.memex_portal.Notifications__Retention__Enabled | default "true" }}"
  Notifications__Retention__MaxAge: "{{ .Values.config.memex_portal.Notifications__Retention__MaxAge | default "90.00:00:00" }}"
  Notifications__Retention__MaxDeletionsPerRun: "{{ .Values.config.memex_portal.Notifications__Retention__MaxDeletionsPerRun | default "200" }}"
  {{- /* The model-credit FX rate feed (MeshWeaver.Plugins, AI/ModelCreditRateFeed). A daily
         download that keeps Admin/ModelCredit/_Rate-{FROM}-{TO} current from a published reference
         feed, so the credit meter can fold a USD-priced round against a CHF allowance.

         🚨 THESE KEYS MUST EXIST HERE OR THEY ARE SILENTLY DROPPED. This ConfigMap names every key
         explicitly and the Deployment's only env path is envFrom, so a values file that sets a key
         this template does not render produces NOTHING — the Memex#53 shape. That failure is
         especially bad for this feature: the operator sets Enabled=true, the key never reaches a
         pod, the feed reads "absent" and stays disarmed, and the knob LOOKS set. Which is exactly
         the class of silence the feed's own configuration reader was written to refuse.

         DISARMED by default, and unlike notification retention that is deliberate: a wrong answer
         there deletes a three-month-old pointer, a wrong answer here writes a NUMBER THE PLATFORM
         BILLS AGAINST — at a margin (Stripe's currency-conversion fee) nobody has verified for this
         account. So no Helm `default` arms it, and the empty string these render while unset is
         what the reader treats as absent.

         🚨 An EMPTY value means absent; a value an operator TYPED but that is not a value makes the
         service REFUSE TO ARM and log which key and which value. "Margin: 0,015" is not 0.015. */}}
  ModelCredit__RateFeed__Enabled: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__Enabled | default "" }}"
  ModelCredit__RateFeed__Margin: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__Margin | default "" }}"
  ModelCredit__RateFeed__Pairs: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__Pairs | default "" }}"
  ModelCredit__RateFeed__Url: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__Url | default "" }}"
  ModelCredit__RateFeed__IntervalHours: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__IntervalHours | default "" }}"
  ModelCredit__RateFeed__InitialDelaySeconds: "{{ .Values.config.memex_portal.ModelCredit__RateFeed__InitialDelaySeconds | default "" }}"
  {{- /* Commit-pinned source replica (GitModuleReplica). Point Root at a DEDICATED persistent mount —
         see .Values.persistence for the volume. Empty means "unset": the option then falls back to a
         temp subdir, which on a pod is ephemeral and re-clones the repo on every restart. This key
         must exist HERE or it is silently dropped: this configmap lists keys explicitly rather than
         iterating .Values.config, so an un-templated key never reaches the pod. */}}
  SourceReplica__Root: "{{ .Values.config.memex_portal.SourceReplica__Root }}"
  SourceReplica__KeepCommitsPerRepo: "{{ .Values.config.memex_portal.SourceReplica__KeepCommitsPerRepo }}"
  Deployment__Orleans__Clustering: "{{ .Values.config.memex_portal.Deployment__Orleans__Clustering }}"
  Storage__Name: "{{ .Values.config.memex_portal.Storage__Name }}"
  Storage__SourceType: "{{ .Values.config.memex_portal.Storage__SourceType }}"
  Storage__BasePath: "{{ .Values.config.memex_portal.Storage__BasePath }}"
  {{- /* 🚨 EMITTED ONLY WHEN SET, and that is what makes the first-run setup wizard reachable
         on a Helm-deployed portal at all. This ConfigMap lists keys explicitly, so an
         unconditional line here emits Graph__Storage__Type="" for a values file that states
         nothing — and an EMPTY section is not an ABSENT one: GetSection("Graph:Storage").Get<T>()
         answers a non-null object with Type="", so MemexConfiguration never reaches
         MarkAwaitingSetup and AddPersistence throws "Unknown storage type: ''" instead. Every
         existing deployment sets these in values.yaml and is byte-identical; only a deployment
         that deliberately leaves them blank — a fresh install meant to be configured through the
         wizard — sees a difference.

         🚨 `if`, never `with`: `with` rebinds the dot, so the emitting line stops NAMING the key —
         and "the chart names every config key explicitly" is the premise
         check-values-are-read.sh rests on to decide whether a values key is read by anything. It
         refuses a chart that breaks that premise rather than emitting findings it cannot stand
         behind, which is the right call and cost one red run to learn. */}}
  {{- if .Values.config.memex_portal.Graph__Storage__Type }}
  Graph__Storage__Type: "{{ .Values.config.memex_portal.Graph__Storage__Type }}"
  {{- end }}
  {{- if .Values.config.memex_portal.Graph__Storage__BasePath }}
  Graph__Storage__BasePath: "{{ .Values.config.memex_portal.Graph__Storage__BasePath }}"
  {{- end }}
  Mcp__BaseUrl: "{{ .Values.config.memex_portal.Mcp__BaseUrl }}"
  # ---- Public base URL — the instance's own https host --------------------
  # Used to build ABSOLUTE links in outbound email (access-granted notifications,
  # invitations) — without it the "Open {space}" button is omitted and the email
  # ships linkless (the #1 complaint: a first-contact invite with no way in). Read
  # by NotificationService/InvitationEmailSender via Portal:BaseUrl.
  # DERIVED by default from the ingress host (https://{ingress.host}) — the SAME
  # host OAuth redirect_uri is built from — so every instance with a public host
  # gets correct email links with NO per-env config. An explicit
  # config.memex_portal.Portal__BaseUrl overrides (e.g. a vanity domain that
  # differs from the ingress host).
{{- $portalBaseUrl := .Values.config.memex_portal.Portal__BaseUrl }}
{{- if and (not $portalBaseUrl) (.Values.ingress).enabled (.Values.ingress).host }}
{{-   $portalBaseUrl = printf "https://%s" .Values.ingress.host }}
{{- end }}
  Portal__BaseUrl: "{{ $portalBaseUrl | default "" }}"
  # ---- Instance identity (tab title + favicon badge) — optional -------------
  # When InstanceName is set, the browser tab title becomes that name and the
  # favicon becomes a distinct colored badge (instance initial), so Local / Test /
  # Prod tabs are obvious at a glance. Empty (prod) = default Memex branding.
  # InstanceColor is the badge fill (hex, e.g. "#f59e0b"); empty = amber default.
  Portal__InstanceName: "{{ .Values.config.memex_portal.Portal__InstanceName | default "" }}"
  Portal__InstanceColor: "{{ .Values.config.memex_portal.Portal__InstanceColor | default "" }}"
  # AppleTouchIcon is the LARGE Safari bookmark / Start-Page / Add-to-Dock tile (180×180 PNG) —
  # the favicon doesn't drive it, so with none set Safari draws its own letter tile. A URL or
  # app-relative path; empty = none. Per-install brand assets ship at
  # _content/Memex.Portal.Shared/brand/{systemorph,prod,local}-180.png (or a mesh asset / absolute URL).
  Portal__AppleTouchIcon: "{{ .Values.config.memex_portal.Portal__AppleTouchIcon | default "" }}"
{{- if (.Values.instancesAdmin).clusterRead }}
  # ---- Platform-admin Instances overview (see .Values.instancesAdmin) -------
  # The SAME flag that grants the cluster-read RBAC also enables the Settings tab, so the
  # Instances menu item exists ONLY on the company/control instance.
  Instances__Enabled: "true"
{{- if (.Values.instancesAdmin).grafanaBaseUrl }}
  # Per-instance Grafana Explore (Loki) log deep links on the Instances tab.
  Instances__GrafanaBaseUrl: "{{ .Values.instancesAdmin.grafanaBaseUrl }}"
{{- end }}
{{- end }}
{{- /* ---- Instance lifecycle operator (the Hosting plugin) — OFF unless declared ----

  🚨 THESE KEYS WERE TEMPLATED BY NOTHING UNTIL NOW, and that is the whole reason this block exists.
  The ConfigMap names every key explicitly and the Deployment's only env path is `envFrom` on it, so
  a key no template mentions reaches NO container. memex's overlay declared
  `Hosting__Operator__Enabled: "true"` under a "THE CONTROL INSTANCE, and only here" comment, and
  the live ConfigMap carried zero `Hosting__*` keys — so HostingOperator.Resolve reported
  "instance actions are disabled on this installation" on the one installation that is supposed to
  run them. Exactly the `Modules__Root` defect (Memex#53), which is invariant 8 of
  check-chart-invariants.

  🚨 OFF BY DEFAULT, AND THAT IS A SECURITY PROPERTY, not a convenience. The identity this arms can
  delete namespaces and drop databases across the fleet. An installation that does not declare
  `hostingOperator.enabled` renders `false` and cannot be talked into provisioning anything. */}}
  Hosting__Operator__Enabled: "{{ (.Values.hostingOperator).enabled | default "false" }}"
{{- if (.Values.hostingOperator).enabled }}
{{- if not (.Values.hostingOperator).image }}
{{- fail "hostingOperator.enabled is true but hostingOperator.image is unset. The operator runs every lifecycle action as a Job from that image; without it HostingOperator.Resolve refuses with 'no operator image configured' and every action on this installation fails at the point of use rather than here. Set hostingOperator.image to the hosting-operator build this fleet runs." }}
{{- end }}
  # The ops namespace the Jobs run in, and the POWERFUL ServiceAccount they run as. Both are
  # matched by NAME in the federated credential's subject (system:serviceaccount:<ns>:<sa>), so
  # changing either here means changing it in manifests/hosting-operator/ and in backups.bicep.
  Hosting__Operator__Namespace: "{{ (.Values.hostingOperator).namespace | default "memex-ops" }}"
  Hosting__Operator__ServiceAccount: "{{ (.Values.hostingOperator).serviceAccount | default "hosting-operator" }}"
  # The operator image IS the chart version it deploys (the chart is baked into it), so pin it like
  # any other image and bump it deliberately.
  Hosting__Operator__Image: "{{ .Values.hostingOperator.image }}"
  # Deliberately NOT the pod's own projected token: a second identity has to arrive as a mounted
  # Secret, and that indirection is the point — this capability is removed by deleting one volume
  # mount, without touching the portal's identity or its self-update permissions. Mount it with
  # .Values.extraVolumes / .Values.extraVolumeMounts.
  Hosting__Operator__TokenFile: "{{ (.Values.hostingOperator).tokenFile | default "/var/run/secrets/hosting-operator/token" }}"
  # Read with int.TryParse, which falls back to 3600 — but a PARSEABLE default is emitted anyway,
  # per the rule stated at OpenAICompatible__DiscoverModels: `default ""` is safe only for strings.
  Hosting__Operator__DeadlineSeconds: "{{ (.Values.hostingOperator).deadlineSeconds | default 3600 }}"
{{- /* Named keys, not an indexed list: HostingOperator.ReadEnvironment turns a non-numeric child
       key into `KEY=VALUE` itself, so the values file stays readable as a map. These reach every
       operator Job as environment — AZ_RESOURCE_GROUP, AZ_PORTAL_IDENTITY, AZ_OIDC_ISSUER,
       AZ_DNS_RESOURCE_GROUP, INGRESS_IP, PAYWALL_URL, VALUES_FILE, CATALOG_CONFIG. A step that
       needs one and does not get it refuses BY NAME (hosting::need_env). */}}
{{- range $key, $value := (.Values.hostingOperator).environment }}
  Hosting__Operator__Environment__{{ $key }}: "{{ $value }}"
{{- end }}
{{- end }}
{{- if (.Values.portalNext).enabled }}
  # ---- Next.js React frontend (FEATURE-FLAGGED — see .Values.portalNext) -----
  # Non-empty ReactAppUrl is what enables FrontendSelection: it shows the user
  # menu's "Try the new frontend" entry, activates the /frontend/{react|blazor}
  # toggle, and arms the UseFrontendSelection redirect (page navigations bounce to
  # /next only when the user's mw-frontend cookie / Portal:Frontend is React). The
  # deployment DEFAULT stays Blazor — we deliberately leave Portal:Frontend unset —
  # so enabling the flag is opt-in per user, fully reversible.
  Portal__ReactAppUrl: "/next"
{{- end }}
  # ---- Embeddings (vector search + content indexing) — optional -------------
  # With an Endpoint set, the portal registers the embedding provider: search-bar queries hit
  # the HNSW vector index AND the content-indexing pipeline activates (chunk→embed→store in the
  # SEPARATE `contentindex` database on the same Postgres server). Empty = full-text (ILIKE)
  # search only, content indexing inert. See PostgreSqlExtensions.
  #   Provider="AzureFoundry" (default) → Cohere embed-v4 (needs ApiKey from secrets.yaml).
  #   Provider="Ollama"                 → local on-host /v1/embeddings (bge-m3 etc., no key).
  # Dimensions auto-derive from the model (bge-m3=1024, nomic-embed-text=768, embed-v-4-0=1536);
  # changing them re-migrates the pgvector column + HNSW index on next startup.
  Embedding__Provider: "{{ .Values.config.memex_portal.Embedding__Provider | default "" }}"
  Embedding__Endpoint: "{{ .Values.config.memex_portal.Embedding__Endpoint | default "" }}"
  Embedding__Model: "{{ .Values.config.memex_portal.Embedding__Model | default "" }}"
  # ---- AI model providers (non-secret: endpoints + model catalog) ----------
  # BuiltInLanguageModelProvider scans {Section}:Models / :Endpoint and emits the
  # nodeType:LanguageModel mesh nodes the chat picker shows. Section names are the
  # ones the catalog sources actually bind: "Anthropic" (claude) and "AzureFoundry"
  # (open-weight multi-model /models endpoint). NOTE: NOT "AzureAIS" — nothing binds
  # that section (the AppHost's AzureAIS__* env is dead config). Keys come from
  # secrets.yaml. Leave a Models slot blank to drop that model.
  Anthropic__Endpoint: "{{ .Values.config.memex_portal.Anthropic__Endpoint }}"
  Anthropic__Models__0: "{{ .Values.config.memex_portal.Anthropic__Models__0 }}"
  Anthropic__Models__1: "{{ .Values.config.memex_portal.Anthropic__Models__1 }}"
  Anthropic__Models__2: "{{ .Values.config.memex_portal.Anthropic__Models__2 }}"
  AzureFoundry__Endpoint: "{{ .Values.config.memex_portal.AzureFoundry__Endpoint }}"
  # ── OpenRouter models ────────────────────────────────────────────────────────
  # 🚨 The FOURTH occurrence of the defect this file already warns about two blocks below
  # (#1925, and #1778/#1780 before it): every OpenRouter__Models__N was set in both
  # overlays and rendered by NOTHING, so the keys reached no container and no error was
  # raised anywhere. The catalog is seeded from these keys by BuiltInLanguageModelProvider
  # (an IStaticNodeProvider), so the effect was a portal whose model list silently did not
  # match the reviewed configuration — and, worse, a re-render would have DROPPED the two
  # models that were live, leaving no OpenRouter models at all.
  #
  # Written out INDEX BY INDEX, never a range, per this ConfigMap's contract: it names every
  # key explicitly so that what reaches a container is reviewable here. Adding a model means
  # adding a line — that cost is the point.
  #
  # An unset index renders "" and is inert: the seeder skips empty entries, so the list may
  # be shorter than the slots. Extend the range when an environment needs more.
  OpenRouter__Models__0: "{{ .Values.config.memex_portal.OpenRouter__Models__0 }}"
  OpenRouter__Models__1: "{{ .Values.config.memex_portal.OpenRouter__Models__1 }}"
