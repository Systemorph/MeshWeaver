  # ---- Sign-in (non-secret: provider client ids + mode) ---------------------
  # A provider's button shows iff its ClientId is non-empty (AuthenticationBuilder
  # no-ops on empty). Set a ClientId to "" to DISABLE that provider even when the
  # image's appsettings.json ships a default (env overrides appsettings). Secrets
  # (client secrets) come from the SecretProviderClass, not here.
  {{- /* 🚨 The sign-in keys the SETUP WIZARD owns are emitted only when this deployment states
         them. An always-emitted key WINS over the instance manifest (which is layered under the
         host's own configuration sources by design), so an unconditional
         Authentication__EnableDevLogin="false" would silently discard the operator's answer and
         leave a freshly set-up instance with no way in. Absent and "" are indistinguishable to
         every reader — AuthenticationOptions.EnableDevLogin already defaults to false and
         SignInProviderCatalog treats blank as unset — so a deployment that states these is
         unaffected. */}}
  {{- if .Values.config.memex_portal.Authentication__Provider }}
  Authentication__Provider: "{{ .Values.config.memex_portal.Authentication__Provider }}"
  {{- end }}
  {{- if .Values.config.memex_portal.Authentication__EnableDevLogin }}
  Authentication__EnableDevLogin: "{{ .Values.config.memex_portal.Authentication__EnableDevLogin }}"
  {{- end }}
  {{- /* DevLogin is a PAIR. EnableDevLogin turns the built-in developer login on; DevAdminUsers is
         the comma-separated list of ids that get platform admin when they sign in that way
         (DevAuthController.IsConfiguredDevAdmin -> UserOnboardingService.GrantPlatformAdmin).
         Templating one without the other yields a portal you can log into and then administer
         nothing on — and it fails SILENTLY, because a key this configmap does not list never
         reaches a container while helm reports success. Same defect as Modules__Root (#1924) and
         Modules__Required__N (#2104). */}}
  {{- if .Values.config.memex_portal.Authentication__DevAdminUsers }}
  Authentication__DevAdminUsers: "{{ .Values.config.memex_portal.Authentication__DevAdminUsers }}"
  {{- end }}
  {{- if .Values.config.memex_portal.Authentication__Microsoft__ClientId }}
  Authentication__Microsoft__ClientId: "{{ .Values.config.memex_portal.Authentication__Microsoft__ClientId }}"
  {{- end }}
  {{- /* 🚨 Never an EMPTY default here: an env var cannot be null, so "" reached the portal as a
         tenant and the OIDC authority became login.microsoftonline.com//v2.0 — every Microsoft
         sign-in 500-ed on memex-cloud (2026-08-28, #2621). The multi-tenant sign-in app the
         onboarding doc prescribes uses `organizations`; an env that needs a single tenant sets
         its id explicitly. */}}
  {{- /* The tenant default is meaningful only ALONGSIDE a client id, so it rides with one. On its
         own it would override a wizard-configured tenant with "organizations". */}}
  {{- if .Values.config.memex_portal.Authentication__Microsoft__ClientId }}
  Authentication__Microsoft__TenantId: "{{ .Values.config.memex_portal.Authentication__Microsoft__TenantId | default "organizations" }}"
  {{- end }}
  {{- if .Values.config.memex_portal.Authentication__Google__ClientId }}
  Authentication__Google__ClientId: "{{ .Values.config.memex_portal.Authentication__Google__ClientId }}"
  {{- end }}
  {{- if .Values.config.memex_portal.Authentication__LinkedIn__ClientId }}
  Authentication__LinkedIn__ClientId: "{{ .Values.config.memex_portal.Authentication__LinkedIn__ClientId }}"
  {{- end }}
  # Apple: ClientId is the Services ID; TeamId/KeyId identify the Sign in with Apple key
  # whose private key (the secret) is Authentication__Apple__PrivateKey in secrets.yaml.
  Authentication__Apple__ClientId: "{{ .Values.config.memex_portal.Authentication__Apple__ClientId | default "" }}"
  Authentication__Apple__TeamId: "{{ .Values.config.memex_portal.Authentication__Apple__TeamId | default "" }}"
  Authentication__Apple__KeyId: "{{ .Values.config.memex_portal.Authentication__Apple__KeyId | default "" }}"
  Social__LinkedIn__ClientId: "{{ .Values.config.memex_portal.Social__LinkedIn__ClientId | default "" }}"
  # ---- GitHub App identity (the MACHINE credential, not the sign-in OAuth app) ----
  # GitHub__OAuth__* above signs USERS in. This is the separate GitHub APP whose installation
  # token every SERVER-SIDE GitHub read uses: the store's package feed (StoreManifestSource),
  # the Store card's Provision → Import phase (UpdateToLatestFromGitHub), module discovery and
  # _GitSync. The PEM key is the secret half, in secrets.yaml / the Key Vault CSI mount.
  #
  # These were un-templated, so an env overlay that set them was SILENTLY DROPPED and the only
  # way to wire them was a hand-applied `kubectl set env` that no redeploy reproduces — and that
  # a `helm upgrade` then reverts. Same defect the plugin-catalog keys below carried, with a
  # nastier symptom: a missing App identity does not error, it makes every GitHub read fall back
  # to ANONYMOUS, and anonymous against a PRIVATE repo is a 404 — which renders as an EMPTY
  # STORE. One portal sat exactly there (private Systemorph/MeshWeaver.Plugins, no App identity):
  # zero catalog entries, and every Provision click failing at the Import phase, leaving a
  # content-less stub root behind.
  GitHub__App__ClientId: "{{ .Values.config.memex_portal.GitHub__App__ClientId | default "" }}"
  GitHub__App__InstallationOwner: "{{ .Values.config.memex_portal.GitHub__App__InstallationOwner | default "" }}"
  GitHub__App__InstallationId: "{{ .Values.config.memex_portal.GitHub__App__InstallationId | default "" }}"
  # ---- Onboarding: invitation-only gate (first user always bootstraps) ------
  Features__Onboarding__InvitationOnly: "{{ .Values.config.memex_portal.Features__Onboarding__InvitationOnly | default "false" }}"
  # One-shot first-admin bootstrap secret. Empty = endpoint disabled. Set it, POST
  # /bootstrap/first-admin?secret=...&email=..., then clear it. (Self-host / local only.)
  Bootstrap__Secret: "{{ .Values.config.memex_portal.Bootstrap__Secret | default "" }}"
  # ---- Static-repo → DB sync: which partitions are materialized into + served from the DB
  # (instead of the in-memory static provider). Default = Doc, Agent, Provider, Harness, Skill.
  # (The model catalog — providers + models + policy — imports into the top-level "Provider"
  # partition; "Model" is kept as a legacy alias slot for backwards-compatible configs.) Override
  # per-env by setting these keys (empty string disables a slot). See Doc/Architecture/StaticRepoImport.md.
  Features__StaticRepoSync__Partitions__0: "{{ .Values.config.memex_portal.Features__StaticRepoSync__Partitions__0 | default "Doc" }}"
  Features__StaticRepoSync__Partitions__1: "{{ .Values.config.memex_portal.Features__StaticRepoSync__Partitions__1 | default "Agent" }}"
  Features__StaticRepoSync__Partitions__2: "{{ .Values.config.memex_portal.Features__StaticRepoSync__Partitions__2 | default "Provider" }}"
  Features__StaticRepoSync__Partitions__3: "{{ .Values.config.memex_portal.Features__StaticRepoSync__Partitions__3 | default "Harness" }}"
  Features__StaticRepoSync__Partitions__4: "{{ .Values.config.memex_portal.Features__StaticRepoSync__Partitions__4 | default "Skill" }}"
  # ---- Plugin auto-update: the PLATFORM default is explicit opt-in (no unattended installs), but
  # OUR deployments track the plugin repos continuously — a fresh install record is seeded opted-in,
  # so a plugin repo's green build reaches these portals with nobody clicking Update. Install-time
  # seed only; a record's own AutoUpdate flag stays the runtime authority thereafter.
  # See Doc/Architecture/PluginUpdateOnGreenBuild.md.
  PluginCatalog__AutoUpdateByDefault: "{{ .Values.config.memex_portal.PluginCatalog__AutoUpdateByDefault | default "true" }}"
  # ---- Plugin catalog: which registry this install CONSUMES, and (on a registry install) which
  # git repos it SERVES. Both were previously un-templated, so an env overlay that set them was
  # silently dropped — the catalog then reads "not configured" with the values file looking right,
  # and the only way to wire it was a hand-applied `kubectl set env` that no redeploy reproduces.
  # Tokens are secrets and live in secrets.yaml / the Key Vault CSI mount, never here.
  # See Doc/Architecture/PluginRegistry.md.
  PluginCatalog__RequireInstanceKey: "{{ .Values.pluginCatalog.requireInstanceKey | default true }}"
  PluginCatalog__RegistryUrl: "{{ .Values.pluginCatalog.registryUrl | default "" }}"
  PluginCatalog__RegistryRef: "{{ .Values.pluginCatalog.registryRef | default "HEAD" }}"
  {{- range $i, $r := .Values.pluginCatalog.registries }}
  PluginCatalog__Registries__{{ $i }}__Name: "{{ $r.name }}"
  PluginCatalog__Registries__{{ $i }}__Url: "{{ $r.url }}"
  PluginCatalog__Registries__{{ $i }}__Ref: "{{ $r.ref | default "HEAD" }}"
  {{- end }}
  {{- range $i, $s := .Values.pluginCatalog.sources }}
  PluginCatalog__Sources__{{ $i }}__Name: "{{ $s.name }}"
  PluginCatalog__Sources__{{ $i }}__RepoPath: "{{ $s.repoPath }}"
  PluginCatalog__Sources__{{ $i }}__Ref: "{{ $s.ref | default "main" }}"
  PluginCatalog__Sources__{{ $i }}__Format: "{{ $s.format | default "node-repo" }}"
  {{- end }}
  {{- range $i, $g := .Values.pluginCatalog.defaultGrants }}
  PluginCatalog__DefaultGrants__{{ $i }}: "{{ $g }}"
  {{- end }}
  {{- range $i, $p := .Values.pluginCatalog.installByDefault }}
  PluginCatalog__InstallByDefault__{{ $i }}: "{{ $p }}"
  {{- end }}
  {{- /* The platform's own baseline (packages whose manifest declares preInstalled), reconciled on
         every boot. Defaults to true in code; templated HERE because it was one of the keys this
         configmap did not list, i.e. an env overlay that set it was SILENTLY DROPPED and the
         documented opt-out could not be exercised per environment at all. */}}
  {{- if kindIs "bool" .Values.pluginCatalog.installPreInstalledPackages }}
  PluginCatalog__InstallPreInstalledPackages: "{{ .Values.pluginCatalog.installPreInstalledPackages }}"
  {{- end }}
  # ---- Per-environment composition: FEATURE FLAGS ---------------------------
  # An enabled flag INSTALLS the packages it names (reconciled on every boot — unlike
  # installByDefault above, which seeds once and can therefore say nothing about an
  # already-populated portal); a declared-but-DISABLED flag EXCLUDES them, and the exclusion wins
  # over every other selection signal. That is what makes "all of Plugins, without the games" one
  # line in an environment's values file on top of a shared declaration. A flag with no packages is
  # a plain named boolean. See Doc/Architecture/EnvironmentComposition.
  {{- range $name, $flag := .Values.features }}
  {{- if kindIs "bool" $flag }}
  {{- /* The LEAF form — `betaChat: true` — a plain named boolean with no content behind it. It
         must be handled explicitly: `hasKey`/field access on a bool aborts the whole render
         ("wrong type for value; expected map[string]interface {}; got bool"), which would make the
         documented shorthand break every deploy that used it. */}}
  Features__Flags__{{ $name }}: "{{ $flag }}"
  {{- else }}
  {{- if hasKey $flag "enabled" }}
  Features__Flags__{{ $name }}__Enabled: "{{ $flag.enabled }}"
  {{- end }}
  {{- if $flag.description }}
  Features__Flags__{{ $name }}__Description: "{{ $flag.description }}"
  {{- end }}
  {{- range $i, $p := $flag.packages }}
  Features__Flags__{{ $name }}__Packages__{{ $i }}: "{{ $p }}"
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.pluginCatalog.instanceId }}
  # First-startup auto-registration identity (pairs with the PluginCatalog__BootstrapKey secret).
  PluginCatalog__InstanceId: "{{ .Values.pluginCatalog.instanceId }}"
  {{- if .Values.pluginCatalog.homeUrl }}
  PluginCatalog__HomeUrl: "{{ .Values.pluginCatalog.homeUrl }}"
  {{- else if .Values.ingress.host }}
  PluginCatalog__HomeUrl: "https://{{ .Values.ingress.host }}"
  {{- end }}
  {{- end }}
  # ---- System email (Microsoft Graph) — BIDIRECTIONAL. Outbound invitations + notifications
  # (/sendMail, Mail.Send app permission) AND optional inbound email→agent channel (inbox
  # change-notification subscription, Mail.ReadWrite app permission). Non-secret here;
  # Email__ClientSecret comes from the SecretProviderClass. When Email__Enabled is empty/false
  # the portal uses the NoOp sender (no mail sent).
  Email__Enabled: "{{ .Values.config.memex_portal.Email__Enabled | default "false" }}"
  # The mailbox the portal sends AND receives AS (a real/shared mailbox the app may send-as).
  # NOTE: binds EmailOptions.MailboxAddress — the old key Email__NoReplyAddress no longer binds.
  Email__MailboxAddress: "{{ .Values.config.memex_portal.Email__MailboxAddress | default "" }}"
  Email__TenantId: "{{ .Values.config.memex_portal.Email__TenantId | default "" }}"
  Email__ClientId: "{{ .Values.config.memex_portal.Email__ClientId | default "" }}"
  Email__UseManagedIdentity: "{{ .Values.config.memex_portal.Email__UseManagedIdentity | default "false" }}"
  # Inbound email→agent channel (optional). Requires Mail.ReadWrite + a public WebhookBaseUrl;
  # the webhook is {WebhookBaseUrl}/api/email. SubscriptionClientState is a per-deployment random
  # value echoed by Graph on every notification (the webhook rejects mismatches).
  Email__InboundEnabled: "{{ .Values.config.memex_portal.Email__InboundEnabled | default "false" }}"
  Email__WebhookBaseUrl: "{{ .Values.config.memex_portal.Email__WebhookBaseUrl | default "" }}"
  Email__SubscriptionClientState: "{{ .Values.config.memex_portal.Email__SubscriptionClientState | default "" }}"
  # Where the inbound triage lane's Forward action sends a mail (MeshWeaver #2656). Binds
  # InboundMailOptions.ForwardAddress (Email:Inbound:ForwardAddress). Empty is the default and
  # makes the action report itself UNAVAILABLE rather than silently drop a message — so this
  # key is what turns Forward on, and an untemplated key here would ship the feature inert.
  Email__Inbound__ForwardAddress: "{{ .Values.config.memex_portal.Email__Inbound__ForwardAddress | default "" }}"
