  # 🚨 A values key this template omits reaches NO container, with no error anywhere: the
  # ConfigMap names every key explicitly, there is no catch-all range over config.memex_portal,
  # and the Deployment's only env path is envFrom on this ConfigMap. Both keys below were set in
  # values.aks.yaml and rendered by nothing (#1925) — SelfUpdate__MinRollInterval is the restart
  # BUDGET from #1780, which AGENTS.md documents as the fix for restart churn and which sat inert;
  # its predecessor SelfUpdate__PollInterval had the identical defect until #1778.
  # 🚨 …and the OPPOSITE defect bites too: this key binds to a TimeSpan, so rendering it as ""
  # when an env's values do not define it ABORTS the host at startup (FormatException in the
  # configuration binder → SIGABRT loop on the new RS while the old pods keep serving). That is
  # exactly how the 2026-08-23 memex operator-enablement deploy wedged. A typed key needs a real
  # default; "empty = inert" is only true for strings.
  SelfUpdate__MinRollInterval: "{{ .Values.config.memex_portal.SelfUpdate__MinRollInterval | default "01:00:00" }}"
  # #2494's safety net. Same typed-key rule as the line above: a real default, never "" — this
  # binds to a TimeSpan and an empty string aborts the host in the configuration binder.
  SelfUpdate__SafetyNetCheckInterval: "{{ .Values.config.memex_portal.SelfUpdate__SafetyNetCheckInterval | default "01:00:00" }}"
  WebhookInbox__Targets__0: "{{ .Values.config.memex_portal.WebhookInbox__Targets__0 | default "" }}"
  # 🚨 #3312 — how a target says it is AUTHENTICATED, paired with the slot it authenticates.
  # Names the CONFIGURATION KEY holding that target's shared HMAC (never the secret itself), and
  # when set the inbox verifies X-Hub-Signature-256 over the raw body and answers 401 instead of
  # storing a delivery it cannot verify. Empty = the original dumb contract, which is the ONLY safe
  # default here: this slot is not always Hosting/PlatformBuilds, and declaring a GitHub-style HMAC
  # on a Stripe target would 401 every Stripe delivery (Stripe signs `Stripe-Signature`, which this
  # endpoint does not speak). Set it in the same overlay that sets the slot, never separately.
  WebhookInbox__Targets__0__SecretConfigKey: "{{ .Values.config.memex_portal.WebhookInbox__Targets__0__SecretConfigKey | default "" }}"
  # 🚨 #2235: a SECOND slot, because index 0 is not this template's alone to give. memex-cloud
  # hand-set WebhookInbox__Targets__0=Store/Payments directly on the Deployment (kubectl set env,
  # unrecorded, pre-dating this chart key) BEFORE the platform-release broadcast existed. Explicit
  # `env:` entries win over the SAME-named var sourced via `envFrom` (this ConfigMap), so that
  # stray override silently shadows whatever this template renders for __0 forever — the overlay
  # correctly set Targets__0=Hosting/PlatformBuilds, helm reported success, the ConfigMap held the
  # right value, and the live pod still ran with Store/Payments. CD's notify-platform-update then
  # 404'd on every promoted build with no error anywhere until #2268 made the 404 fail loud. A
  # deployment needing more than one inbox target sets __0 AND __1 (not two writers of __0).
  WebhookInbox__Targets__1: "{{ .Values.config.memex_portal.WebhookInbox__Targets__1 | default "" }}"
  # The __1 pairing of the declaration above. 🚨 It matters most HERE: on the deployment whose __0
  # is permanently shadowed, __1 is the slot that actually carries Hosting/PlatformBuilds, so its
  # overlay is the one that must set this — otherwise the inbox keeps accepting release events
  # unverified and CD reports `signature: not-required` on every publish.
  WebhookInbox__Targets__1__SecretConfigKey: "{{ .Values.config.memex_portal.WebhookInbox__Targets__1__SecretConfigKey | default "" }}"
  # ---- Framework-release broadcast: NO subscriber slots (retired 2026-09-03) --------------
  # FrameworkBroadcast__Subscribers__0..3 used to be rendered here as the release wave's
  # subscriber list. The set is DATA IN THE MESH now — every repository a Hosting/Deployment
  # record on the control instance serves as a registry source (pluginRepos[].isRegistrySource),
  # derived by the Hosting module's PlatformBuildInboxWatcher at broadcast time — so there is no
  # key to render and nothing here to leave blank (Memex#140: the four slots rendered blank for a
  # week while nothing was red). An overlay that still sets them sets env nothing reads.
  # The MODULES a deployment refuses to run without (MeshBuilderModuleActivation.RequiredKey).
  # The image ships a baseline list in appsettings; a deployment OVERRIDES an entry here and
  # blanks one it cannot satisfy.
  #
  # 🚨 It overrides BY INDEX, and it never APPENDS. Configuration merges an array element per
  # key, so Modules__Required__5 REPLACES whatever the image baseline holds at index 5 — it does
  # not add a sixth requirement. The baseline is 7 entries today (0..6: Radzen, Analysis,
  # EntityViews, GoogleMaps, Speech, Social, AI), so an overlay ADDING a module must start at the
  # first index PAST it, and an overlay that restates the baseline must restate all of it.
  #
  # 🚨 Un-templated, an override is silently dropped and the health check wins anyway — the #1925
  # defect, third occurrence. Not cosmetic here: `required_modules` reports Unhealthy, /health
  # answers 503, the startup probe never passes and the ROLLOUT TIMES OUT with the portal never
  # serving. That is memex-local on 2026-08-23, once the Blazor view packs and Speech became
  # modules (#1974/#2018/#2081/#2085): the image stopped shipping five DLLs its own Required list
  # still named, and a laptop has no registry to land them from.
  #
  # 🚨 Written out INDEX BY INDEX, never a range: this ConfigMap's contract is that it names every
  # key explicitly, and EveryConfigKeySetInAValuesFile_IsBoundInTheConfigMap enforces exactly that
  # by looking for the key. A range renders correctly and is invisible to the guard — which is how
  # the first draft of this block passed helm and failed the test, correctly.
  #
  # 🚨 THE CEILING IS 9 — the block renders 0..9 and NOTHING ABOVE. A ceiling is not an oversight
  # here, it is the price of the literal-key contract above: a bounded list is what the guard can
  # check, and an unbounded `range` is what it cannot. So the ceiling has to be stated where it is
  # raised, because twice now an overlay declared the first index past it and the key reached no
  # container at all — Memex#128/#131 (MeshWeaver.Mcp, /mcp answering 404 with Mcp__BaseUrl
  # configured beside it) and Memex#129. Why 9 and not 7: the baseline consumes 0..6, so a ceiling
  # of 7 leaves exactly ONE appendable slot; ten slots leave three. RAISING IT is one hasKey block
  # per index and nothing else — do that rather than reusing a baseline index.
  #
  # Two guards in test/MeshWeaver.Documentation.Test/PlatformBakeLaneGuard.cs hold this shape:
  # ModulesRequired_IsRenderedAsAContiguousRangeFromZero (a gap silently truncates nothing and
  # drops exactly the missing index) and NoValuesFile_DeclaresAModulesRequiredIndexAboveTheCeiling
  # (whose failure message names the ceiling, so the next person is told the number).
  #
  # Each index is emitted only when a deployment sets it, so an install that overrides nothing
  # keeps the image's own list rather than blanking entry 0.
  {{- if hasKey .Values.config.memex_portal "Modules__Required__0" }}
