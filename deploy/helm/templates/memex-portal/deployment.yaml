---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "memex-portal-deployment"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "memex-portal"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        {{- with .Values.selfUpdate }}
        {{- if .azureClientId }}
        # Opt the pod into the Azure workload-identity webhook (injects the federated token so the
        # self-updater can list ACR tags). Only when a client id is configured.
        azure.workload.identity/use: "true"
        {{- end }}
        {{- end }}
      annotations:
        # Keep the STATEFUL portal (live Blazor circuits + an Orleans silo) off the cluster
        # autoscaler's scale-down list. Draining a portal pod for node consolidation tore its silo
        # down mid-flight, and each abrupt departure left a ZOMBIE entry in the Orleans membership
        # table: the cluster kept placing new grain activations on the dead silo, so writes timed out
        # ("no initial state arrived within 30s") mesh-wide — which surfaced as GitSync imports
        # reporting "Imported Failed (0 nodes)" and flaky reads. Pods still move on a rollout or a
        # node image-upgrade, but gracefully and one at a time (the PDB beside this file + the 120s
        # terminationGracePeriod above), never on every autoscaler bin-packing pass.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # The in-pod self-updater patches this deployment via the Kubernetes API using this SA's
      # projected token (RBAC in rbac.yaml). See Doc/Architecture/ReleaseStrategy.
      serviceAccountName: "memex-portal-sa"
      # Graceful drain budget: the host's ShutdownTimeout is 90s (Memex.Portal.Distributed
      # Program.cs) and the preStop below waits for this pod's SESSIONS to end — the k8s default
      # of 30s SIGKILLed the portal mid-drain on every rollout (circuits and the Orleans silo torn
      # down abruptly). A ceiling, not a delay: a pod with no circuits still exits in seconds.
      #
      # 🚨 This number is now the answer to "how long may a user keep working on the OLD build
      # after a roll?", because preStop blocks until the last circuit closes. Sized for a working
      # session, not for a request: at 120s a rollout still cut people off mid-task, which is the
      # complaint this closes. Grains follow the same budget for free — MessageHubGrain is
      # [PreferLocalPlacement], so a circuit's hubs live on the pod serving that circuit, and a pod
      # that stays alive keeps them running against the code they activated with.
      terminationGracePeriodSeconds: {{ .Values.portal.drainSeconds | default 1800 }}
      initContainers:
        # Postgres and the portal start concurrently on a fresh install; the portal's hub
        # init FAILS (and the host aborts) if Postgres isn't yet accepting connections.
        # Gate startup on Postgres TCP readiness so the ordering is deterministic.
        - name: "wait-for-postgres"
          image: "busybox:1.36"
          command:
            - "sh"
            - "-c"
            - "until nc -z memex-postgres-service 5432; do echo 'waiting for postgres'; sleep 2; done"
      containers:
        - image: "{{ .Values.portal.image }}"
          name: "memex-portal"
          # Two drains, in order, and they are not the same thing:
          #
          #  1. 15s — the INGRESS drain. Endpoint removal reaches the ingress-nginx upstreams
          #     asynchronously; without this window the pod stops accepting the instant it is
          #     SIGTERMed and in-flight/new requests hit a dead socket (the deploy 502 blip).
          #
          #  2. /drain — the SESSION drain. This was the missing half: after those 15 seconds the
          #     host shut down and every Blazor circuit still open on this pod died mid-sentence,
          #     taking its grains with it ([PreferLocalPlacement] puts a circuit's hubs on the pod
          #     serving it). New sessions already go to the new pod — it is in the Service, this
          #     pod is not — so waiting costs the rollout nothing and costs a working user nothing.
          #     Poll until the pod reports "drained", i.e. its last circuit closed.
          #
          # Bounded by terminationGracePeriodSeconds above: a forgotten open tab delays the pod's
          # exit, it cannot block the rollout for ever — k8s SIGKILLs at the ceiling.
          #
          # 🚨 curl, NOT wget: the base image installs curl (deploy/base-images/portal-ai/Dockerfile)
          # and has no wget. Reaching for the missing one is not a typo you notice — `until wget …`
          # fails with 127 on every iteration, so the loop never ends and EVERY roll would sit out
          # the full grace period before being SIGKILLed. Verified in the image:
          # `command -v curl` → /usr/bin/curl, `command -v wget` → missing.
          #
          # -f makes the 503 ("still open") a failure, so the loop continues; the 200 exits it.
          lifecycle:
            preStop:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - >-
                    sleep 15;
                    until curl -fsS -m 5 http://127.0.0.1:8080/drain >/dev/null 2>&1; do
                      sleep 5;
                    done
          envFrom:
            - configMapRef:
                name: "memex-portal-config"
            - secretRef:
                name: "memex-portal-secrets"
          env:
            # 🩺 Crash diagnostics. We hit a native SIGSEGV (exit 139) in the Npgsql → SslStream TLS
            # read path: the process dies with NO managed exception, so the logs show nothing useful.
            # Write a dump to /data/dumps (the dedicated memex-dumps emptyDir below — createdump does
            # NOT create directories, so the target dir MUST be a mount) so the next crash — and the
            # heap, to confirm/refute the suspected leak — is analyzable. Type 2 = heap: ~heap-sized
            # output (tens of GB at the pod's memory limit), which is why it gets its own size-bounded
            # volume instead of the /data PVC. Dumps only appear on crash.
            - name: "DOTNET_DbgEnableMiniDump"
              value: "1"
            - name: "DOTNET_DbgMiniDumpType"
              value: "2"
            - name: "DOTNET_DbgMiniDumpName"
              value: "/data/dumps/coredump.%p.%t"
            - name: "DOTNET_CreateDumpDiagnostics"
              value: "1"
          {{- with .Values.selfUpdate }}
          {{- if .azureClientId }}
            # Explicit AZURE_CLIENT_ID for the self-updater's ACR credential (the workload-identity
            # webhook also injects this; set here so it's correct even without the webhook).
            - name: "AZURE_CLIENT_ID"
              value: "{{ .azureClientId }}"
          {{- end }}
          {{- end }}
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 8080
{{- if (.Values.grpc).enabled }}
            # Public h2c gRPC (the trusted port binds 127.0.0.1 and is same-pod only — not listed).
            - name: "grpc"
              protocol: "TCP"
              containerPort: {{ .Values.grpc.port }}
{{- end }}
          volumeMounts:
            - name: "memex-data"
              mountPath: "/data"
            - name: "memex-users"
              mountPath: "/mnt/users"
{{- /* Local plugin-repo checkouts (dev only): lets pluginCatalog.sources point at a path INSIDE
       the container, so a local registry serves the node-native plugin repos with no GitHub
       credential. Read-only — the registry reads a checkout, it never writes one. */}}
{{- range $i, $m := .Values.pluginCatalog.localRepoMounts }}
            - name: "plugin-repo-{{ $i }}"
              mountPath: "{{ $m.mountPath }}"
              readOnly: true
{{- end }}
{{- /* Extra persistent mounts (content, attachments, workspace, …) declared under
       .Values.persistence. data + users are mounted above at fixed paths — their
       persistence entries only supply the claim for the volumes below. */}}
{{- range $name, $spec := .Values.persistence }}
{{- if and $spec $spec.claimName $spec.mountPath (ne $name "data") (ne $name "users") }}
            - name: "memex-{{ $name }}"
              mountPath: "{{ $spec.mountPath }}"
{{- end }}
{{- end }}
            - name: "memex-dumps"
              mountPath: "/data/dumps"
          imagePullPolicy: "IfNotPresent"
          # 🚦 Zero-502 rollouts. Without a readiness probe a pod counts as "Ready" the moment its
          # container starts — long before the app serves (Orleans + mesh + static-repo import take
          # tens of seconds) — so a rollout sends traffic to a still-booting pod → 502. /health
          # (all health checks pass) is the "actually serving" signal; combined with maxUnavailable:0
          # below the old pod is kept until the new one passes /health.
          startupProbe:
            # Generous window for a cold boot (schema provisioning + static import). While this is
            # failing, readiness/liveness are suspended, so a slow boot is never flagged unhealthy.
            #
            # ⚠️ This budget is what bounds a NodeType BAKE (PreWarm__GateReadiness). A cold compile
            # is ~2.4 s per NodeType and the sweep is strictly sequential (measured 2026-08-10), so
            # the largest mesh we run (~240 types) needs ~10 min of bake on top of a plain cold boot.
            # periodSeconds × failureThreshold is the ceiling: the default 5 × 60 = 5 minutes is
            # right for a plain boot and too small for a cold bake — turning the gate on without
            # raising this kills the pod mid-bake, every time. Paired setting and full derivation:
            # values.yaml (probes.startup) — 10 × 180 = 30 min.
            httpGet: { path: /health, port: 8080 }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            # ⚠️ /alive (light: process-up), NOT /health (heavy: DB + mesh checks). /health as the
            # readiness probe is the "probe death-spiral": under load a heavy /health times out (5s) →
            # 3 fails → the pod is yanked from the Service endpoints → 503 flapping, and the connection
            # churn that follows aggravates the SslStream SIGSEGV. The rollout gate stays correct
            # because the STARTUP probe below already holds readiness on /health until the mesh is up
            # (so no 502 to a booting pod); once up, /alive keeps a serving pod in rotation and never
            # flaps it out. (Fixed live 2026-07-21; it regressed because the fix wasn't in this chart.)
            httpGet: { path: /alive, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Self-heal a genuinely wedged pod (the connection-exhaustion wedge we hit). Conservative
            # — only a sustained /alive failure restarts it, so a transient blip never loops.
            httpGet: { path: /alive, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
{{- range $lang, $gate := (.Values.grpc).gates }}
{{- if and $gate.enabled $gate.image }}
        # ---- {{ $lang }} gate (TRUSTED co-deployed participant — see .Values.grpc.gates) ----------
        # Same pod ⇒ shares the network namespace ⇒ reaches the portal's 127.0.0.1-bound trusted gRPC
        # endpoint. That reachability IS the authentication (no token). Executes `{{ $lang }}` Code
        # nodes exactly as the in-process Roslyn kernel executes C# ones. Rendered only when the
        # language is enabled AND an image is supplied.
        - name: "{{ $lang }}-gate"
          image: "{{ $gate.image }}"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: "MESH_GRPC_URL"
              value: "http://127.0.0.1:{{ $.Values.grpc.trustedPort }}"
            - name: "MESH_GATE_ADDRESS"
              value: "{{ $gate.address }}"
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { memory: "256Mi" }
          securityContext:
            # The image already runs as a non-root uid; harden the rest.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
{{- end }}
{{- end }}
      volumes:
{{- /* hostPath is deliberate and dev-only: the "host" must be the developer's own machine
       (Colima/k3s/minikube run the node there), which is exactly where the plugin checkout
       lives. Empty on a real cluster — there, sources are URLs served via the GitHub App. */}}
{{- range $i, $m := .Values.pluginCatalog.localRepoMounts }}
        - name: "plugin-repo-{{ $i }}"
          hostPath:
            path: "{{ $m.hostPath }}"
            type: Directory
{{- end }}
        # 💾 /data holds the framework caches that MUST survive restarts and be SHARED across
        # replicas (DataProtection keys, the NodeType assembly cache, the NuGet package cache).
        # Priority: persistence.data.claimName (a pre-created RWX PVC — the production path,
        # rendered by the CHART so a plain `helm upgrade` never reverts /data to ephemeral;
        # previously this was bolted on by per-env kubectl JSON patches, and any unpatched
        # apply silently ran emptyDir — every restart wiped the caches) → persistDataVolume
        # (single-node k3s hostPath) → emptyDir (dev/tests only).
        - name: "memex-data"
{{- if ((.Values.persistence).data).claimName }}
          persistentVolumeClaim:
            claimName: "{{ .Values.persistence.data.claimName }}"
{{- else if .Values.persistDataVolume }}
          # Local dev only: keep /data (the DataProtection keys under /data/dataprotection-keys, plus the
          # nuget/compile caches) on a node hostPath so a pod restart does NOT wipe the keys and invalidate
          # every session (the "have to refresh / Anonymous resubscribe loop" churn). Single-node k3s;
          # multiple pods during a rollout share the same node dir.
          hostPath:
            path: /var/lib/memex-portal-data
            type: DirectoryOrCreate
{{- else }}
          emptyDir: {}
{{- end }}
        - name: "memex-users"
{{- if ((.Values.persistence).users).claimName }}
          persistentVolumeClaim:
            claimName: "{{ .Values.persistence.users.claimName }}"
{{- else }}
          emptyDir: {}
{{- end }}
{{- /* Extra persistent volumes declared under .Values.persistence (content, attachments,
       workspace, …). Rendered between users and dumps so the historical volume order
       (data=0, users=1) stays stable for any remaining per-env index patches. */}}
{{- range $name, $spec := .Values.persistence }}
{{- if and $spec $spec.claimName $spec.mountPath (ne $name "data") (ne $name "users") }}
        - name: "memex-{{ $name }}"
          persistentVolumeClaim:
            claimName: "{{ $spec.claimName }}"
{{- end }}
{{- end }}
        # 🩺 Crash-dump target (DOTNET_DbgMiniDumpName=/data/dumps/…). createdump does NOT create
        # directories — without this mount every crash failed with "Could not create output file …:
        # No such file or directory", destroying its own evidence (and burning ~6s + a ~350k-line
        # createdump log storm on the way down; seen on memex-cloud 2026-07-23). A dedicated emptyDir
        # both guarantees the directory exists and keeps heap-sized dumps off the /data volume.
        # sizeLimit ≈ the pod's memory limit (a type-2 heap dump is ~heap-sized); if a dump would
        # exceed it kubelet evicts the pod instead of filling the node disk. Trade-off: emptyDir
        # survives container restarts (the crash → restart-in-place case we analyze) but not pod
        # rescheduling — acceptable for diagnostics. ⚠️ Keep this AFTER memex-data/memex-users: the
        # AKS env patches (deploy/aks/envs/*/portal-patch.json) replace volumes 0 and 1 BY INDEX.
        - name: "memex-dumps"
          emptyDir:
            sizeLimit: "30Gi"
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "memex-portal"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: 1
  revisionHistoryLimit: 3
  # ⏱️ How long a rollout may be "not progressing" before k8s marks it ProgressDeadlineExceeded.
  #
  # 🚨 The k8s DEFAULT IS 600s, and against this deployment that default is simply WRONG: the
  # startupProbe budget above is periodSeconds × failureThreshold, which managed envs set to
  # 10 × 180 = 30 MINUTES to cover a cold NodeType bake. A legitimately-baking pod is therefore
  # declared failed after 10 minutes — and `kubectl rollout status` reports a perfectly healthy
  # long bake as a failed rollout, which is exactly the signal an operator would act on by
  # rolling back the good image.
  #
  # DERIVED, never a second free-standing number: it is the full startup budget plus headroom for
  # image pull + the wait-for-postgres initContainer. Tying it to the same two values means raising
  # probes.startup can never silently leave the deadline behind it.
  progressDeadlineSeconds: {{ add (mul .Values.probes.startup.periodSeconds .Values.probes.startup.failureThreshold) 600 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      # 🚨 0 is load-bearing — do NOT raise it, and do not let a per-env patch raise it.
      #
      # 0 → SURGE-FIRST: the OLD pod keeps serving until the NEW pod passes its probes. With a
      # single replica this is what turns a rollout from "brief outage" into zero-downtime: traffic
      # only moves once the replacement actually serves. (If the new pod can't come up — e.g. the PG
      # connection-exhaustion wedge — the rollout simply stalls with the old pod still serving, no 502.)
      #
      # It is also the ENTIRE mechanism behind the NodeType bake gate (PreWarm__GateReadiness): the
      # gate protects a portal only by making the new pod refuse readiness, and "refuse readiness"
      # is worth nothing if k8s already deleted the pod that was serving. At maxUnavailable:1 with
      # replicas:1 the only serving pod can go away before the replacement is ready, so a gated
      # rollout there buys FALSE CONFIDENCE — the gate reports, and the outage happens anyway.
      maxUnavailable: 0
    type: "RollingUpdate"
