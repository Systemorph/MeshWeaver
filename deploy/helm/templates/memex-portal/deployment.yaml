---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "memex-portal-deployment"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "memex-portal"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        {{- with .Values.selfUpdate }}
        {{- if .azureClientId }}
        # Opt the pod into the Azure workload-identity webhook (injects the federated token so the
        # self-updater can list ACR tags). Only when a client id is configured.
        azure.workload.identity/use: "true"
        {{- end }}
        {{- end }}
      annotations:
        # Keep the STATEFUL portal (live Blazor circuits + an Orleans silo) off the cluster
        # autoscaler's scale-down list. Draining a portal pod for node consolidation tore its silo
        # down mid-flight, and each abrupt departure left a ZOMBIE entry in the Orleans membership
        # table: the cluster kept placing new grain activations on the dead silo, so writes timed out
        # ("no initial state arrived within 30s") mesh-wide — which surfaced as GitSync imports
        # reporting "Imported Failed (0 nodes)" and flaky reads. Pods still move on a rollout or a
        # node image-upgrade, but gracefully and one at a time (the PDB beside this file + the 120s
        # terminationGracePeriod above), never on every autoscaler bin-packing pass.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        # 🚨 A ConfigMap or Secret change is delivered as ENV at pod START, so without these two
        # hashes `helm upgrade` reports "deployed", the rendered objects carry the new value, and
        # no running process ever reads it — the "we set it and it vanished" shape helm-release.yml
        # warns about, now measured: memex-cloud revision 21 (2026-08-30 16:13Z) rendered
        # PluginCatalog__OpenRegistration__Key into memex-portal-secrets and both pods kept
        # answering 401, because the image was unchanged and nothing told the Deployment to roll.
        # Hashing the rendered config + secrets templates into the pod template turns a
        # configuration change into the SAME rollout an image change gets — graceful, one pod at a
        # time under the PDB and the drain budget below — and into nothing when nothing changed:
        # both templates render deterministically from values (no rand/now/lookup), so a re-render
        # with the same values yields the same hash.
        checksum/config: {{ include (print $.Template.BasePath "/memex-portal/config.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/memex-portal/secrets.yaml") . | sha256sum }}
    spec:
      # The in-pod self-updater patches this deployment via the Kubernetes API using this SA's
      # projected token (RBAC in rbac.yaml). See Doc/Architecture/ReleaseStrategy.
      serviceAccountName: "memex-portal-sa"
      # Graceful drain budget: the host's ShutdownTimeout is 90s (Memex.Portal.Distributed
      # Program.cs) and the preStop below waits for this pod's SESSIONS to end — the k8s default
      # of 30s SIGKILLed the portal mid-drain on every rollout (circuits and the Orleans silo torn
      # down abruptly). A ceiling, not a delay: a pod with no circuits still exits in seconds.
      #
      # 🚨 This number is now the answer to "how long may a user keep working on the OLD build
      # after a roll?", because preStop blocks until the last circuit closes. Sized for a working
      # session, not for a request: at 120s a rollout still cut people off mid-task, which is the
      # complaint this closes. Grains follow the same budget for free — MessageHubGrain is
      # [PreferLocalPlacement], so a circuit's hubs live on the pod serving that circuit, and a pod
      # that stays alive keeps them running against the code they activated with.
      terminationGracePeriodSeconds: {{ .Values.portal.drainSeconds | default 1800 }}
      initContainers:
        # Postgres and the portal start concurrently on a fresh install; the portal's hub
        # init FAILS (and the host aborts) if Postgres isn't yet accepting connections.
        # Gate startup on Postgres TCP readiness so the ordering is deterministic.
        - name: "wait-for-postgres"
          image: "busybox:1.36"
          command:
            - "sh"
            - "-c"
            {{- $pgHost := .Values.postgres.enabled | ternary "memex-postgres-service" (.Values.config.memex_portal.MEMEX_HOST | default "memex-postgres-service") }}
            {{- $pgPort := .Values.postgres.enabled | ternary "5432" (.Values.config.memex_portal.MEMEX_PORT | default "5432") }}
            - "until nc -z {{ $pgHost }} {{ $pgPort }}; do echo 'waiting for postgres'; sleep 2; done"
      containers:
        - image: "{{ .Values.portal.image }}"
          name: "memex-portal"
          # Two drains, in order, and they are not the same thing:
          #
          #  1. 15s — the INGRESS drain. Endpoint removal reaches the ingress-nginx upstreams
          #     asynchronously; without this window the pod stops accepting the instant it is
          #     SIGTERMed and in-flight/new requests hit a dead socket (the deploy 502 blip).
          #
          #  2. /drain — the SESSION drain. This was the missing half: after those 15 seconds the
          #     host shut down and every Blazor circuit still open on this pod died mid-sentence,
          #     taking its grains with it ([PreferLocalPlacement] puts a circuit's hubs on the pod
          #     serving it). New sessions already go to the new pod — it is in the Service, this
          #     pod is not — so waiting costs the rollout nothing and costs a working user nothing.
          #     Poll until the pod reports "drained", i.e. its last circuit closed.
          #
          # 🚨 …and the SESSION drain has its OWN deadline, short of the grace ceiling (#1971).
          # It used to poll forever and rely on terminationGracePeriodSeconds to stop it — which
          # means the pod was SIGKILLed WITH A LIVE ORLEANS SILO whenever a session outlived the
          # grace: preStop never returned, so the host's 90 s ShutdownTimeout never ran,
          # ApplicationStopping never fired, and the silo never departed membership. The
          # safe-to-evict annotation on this deployment records the cost — "each abrupt departure
          # left a ZOMBIE entry in the Orleans membership table: the cluster kept placing new grain
          # activations on the dead silo, so writes timed out mesh-wide".
          #
          # Riding to the ceiling was the NORMAL outcome of a roll, not the exception (memex,
          # 2026-08-21: a terminating pod still executing application code 68 s before the ceiling,
          # while a serving pod had five circuits open at an arbitrary moment). So the roll design
          # was protecting users from the FAST teardown by guaranteeing the ABRUPT one.
          #
          # Now the loop stops at (drainSeconds − shutdownMarginSeconds) and RETURNS, so SIGTERM is
          # delivered with the margin still available to shut down in. The trade is made
          # explicitly — cut off the last stragglers, logged and counted, rather than keep everyone
          # and then die abruptly — instead of by accident. `date +%s` is POSIX and present in
          # every base image this chart can run on; if it were somehow absent the guard below falls
          # back to the previous unbounded behaviour rather than skipping the drain entirely.
          #
          # Bounded by terminationGracePeriodSeconds above as well: a forgotten open tab delays the
          # pod's exit, it cannot block the rollout for ever.
          #
          # 🚨 The probe tool is `curl`, and that is MEASURED, not assumed. This block previously
          # used `wget` on the reasoning "curl is not in the base image; wget is (Debian aspnet)" —
          # which is false for the image this chart actually deploys (`memex-portal-ai-base`).
          # Checked inside the running container 2026-08-13: `curl` present, `wget` absent.
          #
          # That mattered far more than a swapped binary name. `while ! wget …` with no wget can
          # never succeed, so the loop would spin until terminationGracePeriodSeconds (1800s) and
          # then SIGKILL — turning every single pod termination into a 30-minute hang, strictly
          # worse than the abrupt teardown this block exists to prevent. It was never observed
          # because the live Deployment still carried the old `sleep 15`: a chart change does not
          # reach the cluster on an image-tag roll, only on a `helm upgrade`.
          #
          # Hence the `command -v` guard: if the probe tool is ever missing again, the drain is
          # SKIPPED and termination proceeds as it did before. Losing the session drain costs one
          # rollout's open circuits; hanging every pod to the ceiling costs every rollout. Fail
          # open here, deliberately.
          lifecycle:
            preStop:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - >-
                    sleep 15;
                    command -v curl >/dev/null 2>&1 || exit 0;
                    DEADLINE={{ sub (.Values.portal.drainSeconds | default 1800) (.Values.portal.shutdownMarginSeconds | default 120) }};
                    START=$(date +%s 2>/dev/null || echo 0);
                    while ! curl -sf -m 5 -o /dev/null http://127.0.0.1:8080/drain; do
                      NOW=$(date +%s 2>/dev/null || echo 0);
                      if [ "$START" -gt 0 ] && [ $((NOW - START)) -ge "$DEADLINE" ]; then
                        exit 0;
                      fi;
                      sleep 5;
                    done
          envFrom:
            - configMapRef:
                name: "memex-portal-config"
            - secretRef:
                name: "memex-portal-secrets"
            {{- /* The Key Vault secrets DECLARED in .Values.keyVaultSecrets: the Secret the CSI
                   driver syncs from the chart-rendered SecretProviderClass
                   (secretproviderclass.yaml). Listed AFTER the chart's own sources so a vault value
                   wins over a chart-rendered blank for the same key — k8s keeps the LAST envFrom
                   on a clash. Rendered only when secrets are declared; the values file says why
                   the declaration lives here and not on the cluster. */}}
            {{- with .Values.keyVaultSecrets }}
            {{- if .secrets }}
            - secretRef:
                name: "{{ .syncedSecret | default (.name | default "memex-portal-keyvault") }}"
            {{- end }}
            {{- end }}
            {{- /* ⚠️ LEGACY: the block below is the escape hatch for an environment whose
                   SecretProviderClass is still HAND-MADE. Declare the secrets under
                   .Values.keyVaultSecrets instead — that renders the SecretProviderClass AND this
                   envFrom from one declaration. */}}
            # 🚨 Extra env sources the chart does not own — typically a Key Vault CSI-synced
            # secret (secrets-store SecretProviderClass → k8s Secret). Without this key such a
            # source can only be wired by a live kubectl patch on the Deployment, which the next
            # `helm upgrade` silently DROPS — memex-cloud runs exactly that shape today
            # (memexcloud-portal-ai-secrets carrying its AI provider keys), so its first
            # repo-driven release would detach every provider key. Entries are verbatim
            # EnvFromSource objects: {secretRef: {name: …}} or {configMapRef: {name: …}}.
            {{- range .Values.extraEnvFrom }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          env:
            # 🩺 Crash diagnostics. We hit a native SIGSEGV (exit 139) in the Npgsql → SslStream TLS
            # read path: the process dies with NO managed exception, so the logs show nothing useful.
            # Write a dump to /data/dumps (the dedicated memex-dumps emptyDir below — createdump does
            # NOT create directories, so the target dir MUST be a mount) so the next crash — and the
            # heap, to confirm/refute the suspected leak — is analyzable. Type 2 = heap: ~heap-sized
            # output (tens of GB at the pod's memory limit), which is why it gets its own size-bounded
            # volume instead of the /data PVC. Dumps only appear on crash.
            - name: "DOTNET_DbgEnableMiniDump"
              value: "1"
            - name: "DOTNET_DbgMiniDumpType"
              value: "2"
            - name: "DOTNET_DbgMiniDumpName"
              value: "/data/dumps/coredump.%p.%t"
            - name: "DOTNET_CreateDumpDiagnostics"
              value: "1"
          {{- with .Values.selfUpdate }}
          {{- if .azureClientId }}
            # Explicit AZURE_CLIENT_ID for the self-updater's ACR credential (the workload-identity
            # webhook also injects this; set here so it's correct even without the webhook).
            - name: "AZURE_CLIENT_ID"
              value: "{{ .azureClientId }}"
          {{- end }}
          {{- end }}
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 8080
{{- if (.Values.grpc).enabled }}
            # Public h2c gRPC (the trusted port binds 127.0.0.1 and is same-pod only — not listed).
            - name: "grpc"
              protocol: "TCP"
              containerPort: {{ .Values.grpc.port }}
{{- end }}
          volumeMounts:
            - name: "memex-data"
              mountPath: "/data"
            - name: "memex-users"
              mountPath: "/mnt/users"
{{- /* Local plugin-repo checkouts (dev only): lets pluginCatalog.sources point at a path INSIDE
       the container, so a local registry serves the node-native plugin repos with no GitHub
       credential. Read-only — the registry reads a checkout, it never writes one. */}}
{{- range $i, $m := .Values.pluginCatalog.localRepoMounts }}
            - name: "plugin-repo-{{ $i }}"
              mountPath: "{{ $m.mountPath }}"
              readOnly: true
{{- end }}
{{- /* Extra persistent mounts (content, attachments, workspace, …) declared under
       .Values.persistence. data + users are mounted above at fixed paths — their
       persistence entries only supply the claim for the volumes below. */}}
{{- range $name, $spec := .Values.persistence }}
{{- if and $spec $spec.claimName $spec.mountPath (ne $name "data") (ne $name "users") }}
            - name: "memex-{{ $name }}"
              mountPath: "{{ $spec.mountPath }}"
{{- end }}
{{- end }}
{{- /* The mount of the DECLARED Key Vault CSI volume (.Values.keyVaultSecrets). The mount is what
       makes the driver fetch the vault objects, create the synced Secret and keep rotating it — a
       SecretProviderClass with no mounting pod syncs nothing, with no error anywhere. */}}
{{- with .Values.keyVaultSecrets }}
{{- if .secrets }}
            - name: "{{ .volumeName | default "kv-secrets" }}"
              mountPath: "{{ .mountPath | default "/mnt/secrets-store" }}"
              readOnly: true
{{- end }}
{{- end }}
{{- /* ⚠️ LEGACY: extra mounts the chart does not own — the mount half of .Values.extraVolumes
       (typically a HAND-MADE secrets-store CSI volume, whose mount is what makes the driver sync
       its k8s Secret and keep rotating it). Prefer .Values.keyVaultSecrets, which renders the
       mount above. Verbatim VolumeMount objects. */}}
{{- range .Values.extraVolumeMounts }}
            - {{ toYaml . | nindent 14 | trim }}
{{- end }}
            - name: "memex-dumps"
              mountPath: "/data/dumps"
          imagePullPolicy: "IfNotPresent"
{{- /* 🚨 The RAM/CPU envelope — the first thing an operator sizes — was a DEAD KEY until 2026-08-29:
       every overlay and values.aks.yaml declared resources.portal, no template read it, and the
       live envelope came from an out-of-band kubectl patch (portal-patch.json) that the next
       `helm upgrade` silently dropped. An instance with no envelope runs BestEffort and can OOM the
       node its neighbours share. Rendered only when declared, so a self-host that says nothing
       keeps the chart's previous behaviour. */}}
{{- with ((.Values.resources).portal) }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
          # 🚦 Zero-502 rollouts. Without a readiness probe a pod counts as "Ready" the moment its
          # container starts — long before the app serves (Orleans + mesh + static-repo import take
          # tens of seconds) — so a rollout sends traffic to a still-booting pod → 502. /health
          # (all health checks pass) is the "actually serving" signal; combined with maxUnavailable:0
          # below the old pod is kept until the new one passes /health.
          startupProbe:
            # Generous window for a cold boot (schema provisioning + static import). While this is
            # failing, readiness/liveness are suspended, so a slow boot is never flagged unhealthy.
            #
            # ⚠️ This budget is what bounds a NodeType BAKE (PreWarm__GateReadiness). A cold compile
            # is ~2.4 s per NodeType and the sweep is strictly sequential (measured 2026-08-10), so
            # the largest mesh we run (~240 types) needs ~10 min of bake on top of a plain cold boot.
            # periodSeconds × failureThreshold is the ceiling. What this chart SHIPS, and what
            # every environment in the fleet runs today, is the ungated default — right for a plain
            # boot and far too small for a cold bake, so turning the gate on without raising it in
            # the SAME change kills the pod mid-bake, every time, for ever. The paired setting and
            # the full derivation live in values.yaml (probes.startup); PreWarmGateReadinessGuard
            # enforces the coupling, so this comment can no longer drift away from what ships.
            httpGet: { path: /health, port: 8080 }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            # ⚠️ /ready (light: the trivial process-up check, tag `ready`), NOT /health (heavy: DB +
            # mesh checks). /health as the readiness probe is the "probe death-spiral": under load a
            # heavy /health times out (5s) → 3 fails → the pod is yanked from the Service endpoints →
            # 503 flapping, and the connection churn that follows aggravates the SslStream SIGSEGV.
            # The rollout gate stays correct because the STARTUP probe above already holds readiness
            # on /health until the mesh is up (so no 502 to a booting pod); once up, /ready keeps a
            # serving pod in rotation and never flaps it out.
            # (Fixed live 2026-07-21; it regressed because the fix wasn't in this chart.)
            #
            # 🚨 THIS PATH MUST NEVER BE THE LIVENESS PATH. That is not style — it is #3330, and the
            # chart carried the hazard here as an open warning until it fired.
            # Both probes used to be `/alive`, and what /alive MEASURES is a property of the deployed
            # image, not of this chart: core registers the trivial "self" check, while a
            # PROGRESS-AWARE handler is registered by the HOST (ProcessProgressHealthCheck, in
            # MeshWeaver.Plugins#1234) under the same `live` tag. The moment that shipped (merged
            # 2026-09-03) readiness became progress-aware too — and readiness trips FIRST:
            # 10s x 3 = 30s here, against liveness's 15s x 6 = 90s. So a GC-bound replica left the
            # Service a full minute before anything restarted it, and for that minute its traffic
            # landed on siblings converging on the SAME memory ceiling with age (measured 2026-09-04:
            # ns memex, two 28h replicas at 9936Mi and 9409Mi, ratio 1.06). One sick replica became a
            # cascade: the 2026-07-21 death-spiral, rebuilt out of the #2194 item-4 fix. Confirmed
            # live on 2026-09-05 — both probes on /alive, readiness 30s, liveness 90s.
            #
            # The fix is SEPARATE PATHS, so the two probes can be given the different SEMANTICS they
            # have always been documented as having. /ready runs only checks tagged `ready` — an
            # ALLOW-list, deliberately: a deny-list (everything not tagged `live`) would sweep the
            # untagged DB and mesh checks into readiness and rebuild the 2026-07-21 spiral instead.
            # Tag a check `ready` only when failing it should hand this pod's traffic to its
            # siblings; tag it `live` when failing it should restart this pod. See
            # memex/aspire/Memex.Portal.ServiceDefaults/ProbeEndpoints.cs (the paths and the tags are
            # declared there, once) and Doc/Architecture/ProbeSemantics.
            # ProbeSemanticsGuard and ProbeSeparationTest hold this chart and that file to each other.
            #
            # 🚨 ROLLOUT ORDER: THE IMAGE FIRST, THE CHART SECOND. /ready is mapped by the portal
            # IMAGE (MapDefaultEndpoints), so `helm upgrade` with this chart against a pod running an
            # image from before 2026-09-05 probes a path that 404s — and a 404 readiness probe takes
            # EVERY replica out of the Service. The fleet's normal order is already the safe one (CD
            # rolls images continuously with `set image`; a helm upgrade is always a deliberate human
            # action, and self-update cannot run one), but confirm the running image is at or past
            # the commit that added /ready before upgrading a namespace that has been pinned.
            #   kubectl -n <ns> exec deploy/memex-portal-deployment -- \
            #     curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/ready
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Self-heal a genuinely wedged pod (the connection-exhaustion wedge we hit). Conservative
            # — only a sustained /alive failure restarts it, so a transient blip never loops.
            #
            # 🚨 WHAT /alive MEASURES IS NOT DECIDED HERE, AND THIS CHART MUST NOT CLAIM IT IS.
            # An earlier revision of this comment asserted that "/alive answers 503 once GC pause
            # share has stayed above 60% for five consecutive checks", while the readinessProbe
            # comment ten lines above called a progress-aware check an open design item. Both were
            # committed at once and a status report quoted the stale half as current. The truth is
            # image-dependent: core registers ONLY the trivial "self" check (tags `live` + `ready`);
            # any progress-aware handler comes from the host (Memex.Portal.Distributed, in
            # MeshWeaver.Plugins). Measured 2026-09-04: /alive answered `Healthy` on a replica
            # holding a 10 065 MiB managed heap — which is consistent with either handler, since its
            # pause share was low at that moment, so it is not evidence about the image.
            #
            # 🚨 readinessProbe IS NOT pointed here, and MUST NOT BE (#3330 — it was, from the
            # 2026-07-21 fix until 2026-09-05). A readiness check that fails under load removes the
            # pod, and the survivors inherit its traffic (the 2026-07-21 death-spiral). Liveness
            # restarting ONE pegged replica has no such feedback loop — but liveness and readiness
            # cannot be given different SEMANTICS while they share a PATH, so pointing readiness
            # here converts every progress-aware verdict into an eviction 60 s before the restart it
            # is supposed to trigger. Readiness has its own path (/ready) and its own tag; keep it
            # that way. ProbeSemanticsGuard fails the build if these two paths are ever equal.
            #
            # Ready-but-degraded triage: `kubectl top pods -n <ns>`. Two alerts in
            # values.observability.yaml watch for it and they are loud at opposite ends of the
            # incident — PortalReplicaWorkingSetDiverged (one replica ahead of its siblings; goes
            # blind once they converge) and PortalHeapEnteringGcDefenceBand (working set past 75% of
            # the container limit, i.e. the GC's own hard limit; no sibling comparison, so it gets
            # LOUDER as the incident spreads). 🚨 Neither is armed until values.observability.yaml is
            # applied — on 2026-09-01 the live Prometheus held ZERO rule groups.
            #
            # The lane that removes the cause rather than detecting it is prebuilt-only modules
            # (Modules:RequirePrebuilt): a replica that boots having adopted 9 of 377 dynamic
            # NodeTypes compiles the other 368 lazily on first access and pins each result for the
            # life of the process. Convergence (Modules:AutoRecycleOnStaleBuild, on fleet-wide) is a
            # different lane — it moves instances OFF superseded builds, and on 2026-09-04 the 28h
            # replicas had logged ZERO stale-build offers in their entire life, so it had nothing to
            # converge. Doc/Architecture/WhyAGcBoundPodStaysInRotation has the measurement.
            #
            # 🚨 NO initialDelaySeconds HERE, AND NONE ON readinessProbe ABOVE — DELIBERATE, and it
            # keeps being "corrected" by people reading Chart Drift. Kubernetes SUSPENDS liveness and
            # readiness entirely until the startupProbe succeeds, and that probe owns the whole boot
            # window (periodSeconds x failureThreshold — 300 s on the shipped values, hours on an
            # environment running a gated bake). A delay measured from container start can therefore
            # never be what protects a slow boot: the startup probe already did.
            #
            # MeshWeaver#2355 reported `DIFFERS livenessProbe/readinessProbe` against memex for a
            # week — live carried initialDelaySeconds 60/20, this chart carries none — and concluded
            # three times that "live is authoritative, add them to the chart". Adding them would
            # enshrine dead config and make this chart the more dangerous side of the comparison.
            # Two measurements settle it (2026-09-03): memex-cloud runs this exact probe block with
            # NO initialDelaySeconds and is healthy, and a `helm upgrade` does not remove a live
            # delay anyway (three-way merge preserves it — see check-chart-drift.sh's header). So
            # the drift is real but inert, and the chart is the authoritative side.
            httpGet: { path: /alive, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
{{- range $lang, $gate := (.Values.grpc).gates }}
{{- if and $gate.enabled $gate.image }}
        # ---- {{ $lang }} gate (TRUSTED co-deployed participant — see .Values.grpc.gates) ----------
        # Same pod ⇒ shares the network namespace ⇒ reaches the portal's 127.0.0.1-bound trusted gRPC
        # endpoint. That reachability IS the authentication (no token). Executes `{{ $lang }}` Code
        # nodes exactly as the in-process Roslyn kernel executes C# ones. Rendered only when the
        # language is enabled AND an image is supplied.
        - name: "{{ $lang }}-gate"
          image: "{{ $gate.image }}"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: "MESH_GRPC_URL"
              value: "http://127.0.0.1:{{ $.Values.grpc.trustedPort }}"
            - name: "MESH_GATE_ADDRESS"
              value: "{{ $gate.address }}"
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { memory: "256Mi" }
          securityContext:
            # The image already runs as a non-root uid; harden the rest.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
{{- end }}
{{- end }}
      volumes:
{{- /* hostPath is deliberate and dev-only: the "host" must be the developer's own machine
       (Colima/k3s/minikube run the node there), which is exactly where the plugin checkout
       lives. Empty on a real cluster — there, sources are URLs served via the GitHub App. */}}
{{- range $i, $m := .Values.pluginCatalog.localRepoMounts }}
        - name: "plugin-repo-{{ $i }}"
          hostPath:
            path: "{{ $m.hostPath }}"
            type: Directory
{{- end }}
        # 💾 /data holds the framework caches that MUST survive restarts and be SHARED across
        # replicas (DataProtection keys, the NodeType assembly cache, the NuGet package cache).
        # Priority: persistence.data.claimName (a pre-created RWX PVC — the production path,
        # rendered by the CHART so a plain `helm upgrade` never reverts /data to ephemeral;
        # previously this was bolted on by per-env kubectl JSON patches, and any unpatched
        # apply silently ran emptyDir — every restart wiped the caches) → persistDataVolume
        # (single-node k3s hostPath) → emptyDir (dev/tests only).
        - name: "memex-data"
{{- if ((.Values.persistence).data).claimName }}
          persistentVolumeClaim:
            claimName: "{{ .Values.persistence.data.claimName }}"
{{- else if .Values.persistDataVolume }}
          # Local dev only: keep /data (the DataProtection keys under /data/dataprotection-keys, plus the
          # nuget/compile caches) on a node hostPath so a pod restart does NOT wipe the keys and invalidate
          # every session (the "have to refresh / Anonymous resubscribe loop" churn). Single-node k3s;
          # multiple pods during a rollout share the same node dir.
          hostPath:
            path: /var/lib/memex-portal-data
            type: DirectoryOrCreate
{{- else }}
          emptyDir: {}
{{- end }}
        - name: "memex-users"
{{- if ((.Values.persistence).users).claimName }}
          persistentVolumeClaim:
            claimName: "{{ .Values.persistence.users.claimName }}"
{{- else }}
          emptyDir: {}
{{- end }}
{{- /* Extra persistent volumes declared under .Values.persistence (content, attachments,
       workspace, …). Rendered between users and dumps so the historical volume order
       (data=0, users=1) stays stable for any remaining per-env index patches. */}}
{{- range $name, $spec := .Values.persistence }}
{{- if and $spec $spec.claimName $spec.mountPath (ne $name "data") (ne $name "users") }}
        - name: "memex-{{ $name }}"
          persistentVolumeClaim:
            claimName: "{{ $spec.claimName }}"
{{- end }}
{{- end }}
{{- /* The DECLARED Key Vault CSI volume (.Values.keyVaultSecrets) — the volume half of the
       SecretProviderClass the chart renders in secretproviderclass.yaml. Same block, so the
       SecretProviderClass, the volume, its mount and the envFrom can never disagree on a name. */}}
{{- with .Values.keyVaultSecrets }}
{{- if .secrets }}
        - name: "{{ .volumeName | default "kv-secrets" }}"
          csi:
            driver: "secrets-store.csi.k8s.io"
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .name | default "memex-portal-keyvault" }}"
{{- end }}
{{- end }}
{{- /* ⚠️ LEGACY: extra volumes the chart does not own — typically the secrets-store CSI volume
       behind a HAND-MADE SecretProviderClass. Prefer .Values.keyVaultSecrets, which renders the
       SecretProviderClass itself and this volume from one declaration. Kept because without the
       chart rendering the volume at all, it exists only as a live kubectl patch, the next
       `helm upgrade` drops it, the CSI driver stops syncing/rotating its k8s Secret, and every
       key it feeds goes stale (the memex-cloud AI-keys shape, paired with .Values.extraEnvFrom).
       Verbatim Volume objects; mount them via .Values.extraVolumeMounts. */}}
{{- range .Values.extraVolumes }}
        - {{ toYaml . | nindent 10 | trim }}
{{- end }}
        # 🩺 Crash-dump target (DOTNET_DbgMiniDumpName=/data/dumps/…). createdump does NOT create
        # directories — without this mount every crash failed with "Could not create output file …:
        # No such file or directory", destroying its own evidence (and burning ~6s + a ~350k-line
        # createdump log storm on the way down; seen on memex-cloud 2026-07-23). A dedicated emptyDir
        # both guarantees the directory exists and keeps heap-sized dumps off the /data volume.
        # sizeLimit ≈ the pod's memory limit (a type-2 heap dump is ~heap-sized); if a dump would
        # exceed it kubelet evicts the pod instead of filling the node disk. Trade-off: emptyDir
        # survives container restarts (the crash → restart-in-place case we analyze) but not pod
        # rescheduling — acceptable for diagnostics. ⚠️ Keep this AFTER memex-data/memex-users: the
        # AKS env patches (deploy/aks/envs/*/portal-patch.json) replace volumes 0 and 1 BY INDEX.
        - name: "memex-dumps"
          emptyDir:
            sizeLimit: "30Gi"
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "memex-portal"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  # 🚨 Replicas are OWNED BY THE AUTOSCALER when KEDA is on — so the chart must not render this
  # field there at all.
  #
  # This used to be a hard-coded `replicas: 1`, and that one line is why memex-cloud could not
  # survive a pod loss. Everything else the HA shape needs was already true in that namespace —
  # AdoNet Orleans clustering, a `ConnectionStrings:orleans` pointing at the Flexible Server, RWX
  # Azure Files on every claim, a KEDA ScaledObject with minReplicaCount 2 — and the Deployment
  # still declared ONE pod, because the chart had no way to say otherwise. `replicas.portal: 2` sat
  # in deploy/aks/values.aks.yaml since 2026-07-13 consumed by NOTHING.
  #
  # Rendering it under KEDA would be worse than useless: helm and the HPA would then fight over the
  # same field, and every `helm upgrade` would yank a scaled-out deployment back to the chart's
  # number until the HPA pushed it out again. Omitting it is what hands ownership over cleanly —
  # the HPA sets it, helm never touches it, and `minReplicaCount` (values: keda.minReplicas) is the
  # single place the floor is written.
  #
  # Without KEDA the chart is the only writer, so it renders the value: 1 for a single-replica
  # self-host (the default), higher for a fixed-size install that wants HA without an autoscaler.
  # ⚠️ Above 1 the same prerequisites apply as for KEDA — AdoNet clustering and RWX on every claim
  # (values.yaml → persistence). helm-template asserts both; see .github/workflows/chart-gate.yml.
{{- if not (.Values.keda).enabled }}
  replicas: {{ (.Values.replicas).portal | default 1 }}
{{- end }}
  revisionHistoryLimit: 3
  # ⏱️ How long a rollout may be "not progressing" before k8s marks it ProgressDeadlineExceeded.
  #
  # 🚨 The k8s DEFAULT IS 600s, and against this deployment that default is simply WRONG: the
  # startupProbe budget above is periodSeconds × failureThreshold, which an environment running a
  # gated cold NodeType bake must raise to tens of minutes. A legitimately-baking pod would then be
  # declared failed after 10 minutes — and `kubectl rollout status` would report a perfectly healthy
  # long bake as a failed rollout, which is exactly the signal an operator would act on by
  # rolling back the good image.
  #
  # DERIVED, never a second free-standing number: it is the full startup budget plus headroom for
  # image pull + the wait-for-postgres initContainer. Tying it to the same two values means raising
  # probes.startup can never silently leave the deadline behind it.
  progressDeadlineSeconds: {{ add (mul .Values.probes.startup.periodSeconds .Values.probes.startup.failureThreshold) 600 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      # 🚨 0 is load-bearing — do NOT raise it, and do not let a per-env patch raise it.
      #
      # 0 → SURGE-FIRST: the OLD pod keeps serving until the NEW pod passes its probes. With a
      # single replica this is what turns a rollout from "brief outage" into zero-downtime: traffic
      # only moves once the replacement actually serves. (If the new pod can't come up — e.g. the PG
      # connection-exhaustion wedge — the rollout simply stalls with the old pod still serving, no 502.)
      #
      # It is also the ENTIRE mechanism behind the NodeType bake gate (PreWarm__GateReadiness): the
      # gate protects a portal only by making the new pod refuse readiness, and "refuse readiness"
      # is worth nothing if k8s already deleted the pod that was serving. At maxUnavailable:1 with
      # replicas:1 the only serving pod can go away before the replacement is ready, so a gated
      # rollout there buys FALSE CONFIDENCE — the gate reports, and the outage happens anyway.
      maxUnavailable: 0
    type: "RollingUpdate"
