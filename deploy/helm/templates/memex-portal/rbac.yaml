---
# Least-privilege RBAC for the in-pod self-updater: it may GET and PATCH ONLY the portal + migration
# deployments (scoped by resourceNames), nothing else. This is what lets the portal "change the image
# version from inside the memex" (ReleaseStrategy.md). Without this the PATCH returns 403 and the
# poller logs + keeps ticking (no crash).
#
# 🚨 batch/jobs is what lets a self-update MOVE THE SCHEMA before it moves the image. The migration
# is a run-once Job (memex-migration/job.yaml) that only `helm upgrade` used to mint; a self-update
# that rolled the portal across a db_version boundary without it left the new pods refusing to start
# (DbVersionGate) behind a portal that still answered 200 — memex and memex-cloud, 2026-09-03, seven
# hours. The self-updater now creates `memex-migration-su-<tag>` and waits for it BEFORE the PATCH
# (Doc/Architecture/DatabaseMigrationProcedure). Jobs cannot be scoped by resourceNames (the name
# carries the tag), so the rule is namespace-wide on jobs only. Until a `helm upgrade` has applied
# this rule the Job POST answers 403, and the self-updater says so at Warning on every roll.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "memex-portal-self-update"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "memex-portal-deployment"
      - "memex-migration-deployment"
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "memex-portal-self-update"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "memex-portal-self-update"
subjects:
  - kind: ServiceAccount
    name: "memex-portal-sa"
