{{- /*
The portal's Key Vault secrets, rendered from .Values.keyVaultSecrets — the DECLARATION the chart
owns, replacing the hand-made SecretProviderClass every namespace used to carry.

🚨 WHY THIS TEMPLATE EXISTS. Until 2026-08-30 no SecretProviderClass came from the chart. Each one
was `kubectl apply`-ed once from a laptop (deploy/aks/envs/example/secretproviderclass.yaml was the
copy-and-edit template), so which vault objects a pod carried, and under which env keys, was
knowable ONLY from the cluster. The values file could point at that object by name (extraEnvFrom /
extraVolumes) but could not say what was in it. The memex install crashed at boot that day with
EmailConfigurationGuard (Email:Enabled=true, Email:ClientId unset): its Email configuration existed
TWICE on the live pod — the chart's ConfigMap rendering the defaults, and a hand-made Secret patched
onto the live Deployment as explicit `env` entries in a different letter case — and .NET's
case-insensitive environment provider let enumeration order pick the winner on every pod start.
Nothing in any repository could see either half.

Rendered ONLY when `secrets` is non-empty, so every environment that has not opted in renders
byte-identically. With any entry, the vault, tenant and identity are REQUIRED: a half-declared
block fails `helm template` here, naming the key, instead of rendering a SecretProviderClass that
syncs nothing (the CSI driver reports that as a pod stuck in ContainerCreating, not as an error
that names this file).

The three halves the pod needs — the CSI volume, its mount, and the envFrom on the synced Secret —
are derived from the SAME block in deployment.yaml, so a declared secret cannot be half-wired.

NAMES ONLY: `vaultSecret` is the vault object's name, `key` the env key it lands as. No value is
ever in values, and no value is ever in this render — the driver fetches them at pod start.
*/ -}}
{{- with .Values.keyVaultSecrets }}
{{- if .secrets }}
{{- $vault := required "keyVaultSecrets.vaultName is required when keyVaultSecrets.secrets is non-empty" .vaultName }}
{{- $tenant := required "keyVaultSecrets.tenantId is required when keyVaultSecrets.secrets is non-empty" .tenantId }}
{{- $identity := required "keyVaultSecrets.identityClientId is required when keyVaultSecrets.secrets is non-empty (the Key Vault Secrets Provider add-on's user-assigned identity client id)" .identityClientId }}
{{- $name := .name | default "memex-portal-keyvault" }}
{{- $synced := .syncedSecret | default $name }}
---
apiVersion: "secrets-store.csi.x-k8s.io/v1"
kind: "SecretProviderClass"
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $.Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
spec:
  provider: "azure"
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ $identity }}"
    keyvaultName: "{{ $vault }}"
    tenantId: "{{ $tenant }}"
    objects: |
      array:
{{- range .secrets }}
        - |
          objectName: {{ required "every keyVaultSecrets.secrets entry needs a vaultSecret (the vault object's name)" .vaultSecret }}
          objectType: secret
{{- end }}
  # The synced Kubernetes Secret: one key per declared secret, named as the env key the portal
  # reads. deployment.yaml loads it via envFrom, AFTER the chart's own ConfigMap and Secret, so a
  # vault-supplied value wins over a chart-rendered blank for the same key.
  secretObjects:
    - secretName: "{{ $synced }}"
      type: "Opaque"
      data:
{{- range .secrets }}
        - objectName: {{ .vaultSecret }}
          key: {{ required "every keyVaultSecrets.secrets entry needs a key (the Section__Key it lands as)" .key }}
{{- end }}
{{- end }}
{{- end }}
