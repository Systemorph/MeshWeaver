---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "memex-portal-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  # 🚨 An EXTERNAL Postgres must be able to flow in from values, and until now it could not.
  #
  # This line used to hard-code the in-cluster StatefulSet unconditionally. Every AKS namespace
  # runs against the Azure Postgres FLEXIBLE SERVER instead (`memex-postgres-statefulset` is scaled
  # to 0/0 there), so each env's deploy.sh had to `kubectl patch` the rendered value back out again
  # afterwards — the "chart connection string" entry under deploy/aks/README.md's "Known gaps / follow-ups".
  #
  # The patch-afterwards dance is not merely untidy, it is a live outage waiting on the next
  # `helm upgrade`: helm REPLACES a Secret wholesale, so the render overwrites the working
  # connection string and the portal points at a Postgres that is not running until the patch
  # re-lands. And the `orleans` string below was never patched by anything at all — a
  # `helm upgrade` on an AdoNet namespace pointed cluster membership at a dead host, which fails
  # the silo at startup. Take the value from `secrets.memex_portal.ConnectionStrings__memex` when
  # it is supplied; keep the in-cluster default when it is not (local k3s, compose, e2e).
  ConnectionStrings__memex: {{ .Values.secrets.memex_portal.ConnectionStrings__memex | default (printf "Host=memex-postgres-service;Port=5432;Username=postgres;Password=%s;Database=memex" .Values.secrets.memex_portal.memex_postgres_password) | quote }}
  # Content indexing writes its tables into per-partition schemas in THIS same mesh database
  # (content_chunks/content_files alongside each partition's mesh_nodes) — no separate connection.
  MEMEX_PASSWORD: "{{ .Values.secrets.memex_portal.memex_postgres_password }}"
  MEMEX_URI: {{ .Values.secrets.memex_portal.MEMEX_URI | default (printf "postgresql://postgres:%s@memex-postgres-service:5432/memex" .Values.secrets.memex_portal.memex_postgres_password) | quote }}
  # ---- Orleans AdoNet clustering (HA / multi-replica) ----------------------
  # The silo THROWS at startup when Deployment:Orleans:Clustering=AdoNet but
  # ConnectionStrings:orleans is unset — so this MUST accompany the AdoNet flag.
  # TWO supported shapes, both seeded by the migration's OrleansClusteringSetup:
  #   * explicit — whatever ConnectionStrings__orleans says (e.g. a dedicated `orleans`
  #     database on the same server); it always wins;
  #   * derived  — the mesh connection plus `Search Path=orleans`: the SAME database as the
  #     mesh/graph data, isolated in its own schema. This is the default for an external
  #     mesh database, so a multi-pod deployment is never left on Localhost membership.
  # Emitted ONLY for AdoNet; Localhost single-replica deployments omit it entirely.
  {{- if eq ((.Values.config.memex_portal).Deployment__Orleans__Clustering | default "Localhost") "AdoNet" }}
  {{- $orleans := .Values.secrets.memex_portal.ConnectionStrings__orleans }}
  {{- if and (not $orleans) .Values.secrets.memex_portal.ConnectionStrings__memex }}
  {{- /*
       EXTERNAL mesh database, no explicit orleans string: DERIVE one from the mesh connection by
       adding `Search Path=orleans`. Same server, same DATABASE as the mesh/graph data, isolated in
       its own SCHEMA — the migration's OrleansClusteringSetup creates that schema and the tables.

       This used to `fail` at template time, which was right about the danger and wrong about the
       remedy: it demanded a second secret nobody had, so every external-Postgres deployment stayed
       on Localhost clustering. That is not a safe default — it is single-process membership, so a
       multi-pod deployment silently becomes N one-silo clusters, each running every singleton and
       none able to reach the others' grains (memex-cloud + systemorph, measured 2026-08-25).

       Deriving is safe on the one axis that matters: ClusterId is the fixed constant "Memex", so
       isolation has to come from the STORE. Each instance's mesh database is already its own, so a
       schema inside it can never merge two deployments into one cluster — which a shared `orleans`
       database on a shared server could.
  */}}
  {{- $orleans = printf "%s;Search Path=orleans" (trimSuffix ";" .Values.secrets.memex_portal.ConnectionStrings__memex) }}
  {{- end }}
  ConnectionStrings__orleans: {{ $orleans | default (printf "Host=memex-postgres-service;Port=5432;Username=postgres;Password=%s;Database=orleans" .Values.secrets.memex_portal.memex_postgres_password) | quote }}
  {{- end }}
  # ---- AI provider keys (secret) -------------------------------------------
  # Conditionally emitted: a key is set ONLY when its value is non-empty, so the chart never
  # overwrites a value injected out-of-band (Key Vault CSI / kubectl). This matters most for
  # Ai__KeyProtection__MasterKey — overwriting it makes every stored enc: provider key
  # undecryptable. Source real values from Key Vault via the CSI add-on; never commit them.
  {{- if .Values.secrets.memex_portal.Anthropic__ApiKey }}
  Anthropic__ApiKey: "{{ .Values.secrets.memex_portal.Anthropic__ApiKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.AzureFoundry__ApiKey }}
  AzureFoundry__ApiKey: "{{ .Values.secrets.memex_portal.AzureFoundry__ApiKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.OpenRouter__ApiKey }}
  OpenRouter__ApiKey: "{{ .Values.secrets.memex_portal.OpenRouter__ApiKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.OpenAICompatible__ApiKey }}
  OpenAICompatible__ApiKey: "{{ .Values.secrets.memex_portal.OpenAICompatible__ApiKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.Embedding__ApiKey }}
  Embedding__ApiKey: "{{ .Values.secrets.memex_portal.Embedding__ApiKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.Ai__KeyProtection__MasterKey }}
  Ai__KeyProtection__MasterKey: "{{ .Values.secrets.memex_portal.Ai__KeyProtection__MasterKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.Authentication__Microsoft__ClientSecret }}
  Authentication__Microsoft__ClientSecret: "{{ .Values.secrets.memex_portal.Authentication__Microsoft__ClientSecret }}"
  {{- end }}
  # Sign in with Apple: the .p8 key content (PEM; literal \n or base64 both accepted —
  # the portal normalizes). With it the portal mints the ES256 client-secret JWT itself;
  # Apple issues no static client secret.
  {{- if .Values.secrets.memex_portal.Authentication__Apple__PrivateKey }}
  Authentication__Apple__PrivateKey: "{{ .Values.secrets.memex_portal.Authentication__Apple__PrivateKey }}"
  {{- end }}
  # ---- GitHub App identity (secret half) -------------------------------------
  # The App's PEM private key. Pairs with config.memex_portal.GitHub__App__ClientId — the
  # token service needs BOTH, and with only one it throws "The GitHub App is not configured".
  # Normally injected from the Key Vault CSI mount (objectName github-app-privatekey) and left
  # empty here; the conditional means the chart never overwrites a CSI-supplied value.
  {{- if .Values.secrets.memex_portal.GitHub__App__PrivateKey }}
  GitHub__App__PrivateKey: "{{ .Values.secrets.memex_portal.GitHub__App__PrivateKey }}"
  {{- end }}
  # Inbound webhook HMAC (/webhooks/github) — only for an install that registers its own hooks.
  {{- if .Values.secrets.memex_portal.GitHub__Webhook__Secret }}
  GitHub__Webhook__Secret: "{{ .Values.secrets.memex_portal.GitHub__Webhook__Secret }}"
  {{- end }}
  # ---- Plugin catalog tokens ------------------------------------------------
  # CONSUMER: the instance key this install was issued when it registered with the registry, sent
  # as `Authorization: Bearer`. Labelled the "legacy single-registry" key in PluginCatalogOptions
  # and superseded in SHAPE by the per-registry PluginCatalogConsumerRegistryTokens below — but it
  # is fully READ and is what memex authenticates with today, and RegistryTokenResolver's
  # LegacyTokenFallback deliberately keeps it working for a sole/matching registry. Not deprecated;
  # do not delete it. See Doc/Architecture/PluginRegistry.md.
  {{- if .Values.secrets.memex_portal.PluginCatalog__RegistryToken }}
  PluginCatalog__RegistryToken: "{{ .Values.secrets.memex_portal.PluginCatalog__RegistryToken }}"
  {{- end }}
  {{- /* 🚨 The REGISTRY-side `PluginCatalog__RegistryTokens` list that used to live here is GONE,
         and removing it is the point rather than tidiness. It bound to NOTHING: there is no
         RegistryTokens property on PluginCatalogOptions, and PluginRegistryTokens.SectionName /
         .Validate are both [Obsolete] — the registry resolves an instance key to a
         MeshWeaverInstance + its admin-owned PluginGrant (InstanceRegistryAuthenticator) instead.
         The comment that shipped with it was worse than the key: it told operators that "a
         registry with an EMPTY token list answers ANY anonymous caller … configure tokens on
         every production registry", so anyone acting on it would have provisioned this list,
         believed the registry was locked down, and changed nothing at all. That flat allowlist is
         exactly what served this registry's private sources anonymously until 2026-08-06. What
         actually gates a production registry is RequireInstanceKey plus issued instance keys. */}}
  {{- /* Per-registry CONSUMER tokens, index-aligned with pluginCatalog.registries — the vault
         half carries secrets.memex_portal.PluginCatalogConsumerRegistryTokens as a list. */}}
  {{- range $i, $t := .Values.secrets.memex_portal.PluginCatalogConsumerRegistryTokens }}
  PluginCatalog__Registries__{{ $i }}__Token: "{{ $t }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.PluginCatalog__BootstrapKey }}
  # Registration bootstrap key (mwr_) — first-startup auto-registration: the install registers
  # itself at the registry and persists the issued instance key; no per-instance token copying.
  # Requires pluginCatalog.instanceId. See Doc/Architecture/PluginRegistry.md.
  PluginCatalog__BootstrapKey: "{{ .Values.secrets.memex_portal.PluginCatalog__BootstrapKey }}"
  {{- end }}
  {{- if .Values.secrets.memex_portal.PluginCatalog__OpenRegistration__Key }}
  # REGISTRY: OPEN registration — the registration key (mwr_, minted for the plan un-keyed callers
  # enrol into, normally `free`) a POST /api/instances/register WITHOUT a key is treated as
  # presenting. Absent = open registrations are refused (401). Revoke the key to close the lane.
  # See Doc/Architecture/PluginRegistry.md → Plans.
  PluginCatalog__OpenRegistration__Key: "{{ .Values.secrets.memex_portal.PluginCatalog__OpenRegistration__Key }}"
  {{- end }}
type: "Opaque"
