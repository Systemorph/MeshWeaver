---
# Service account the portal pod runs as. On AKS, the azure.workload.identity/client-id annotation
# federates this SA to a UAMI (AcrPull on the registry) so the pod can list ACR tags. It carries NO
# Kubernetes right by default (MeshWeaver#4098): the self-patch Role in rbac.yaml is rendered only
# with selfUpdate.canPatch=true, for a standalone install; a fleet portal hands a detected release
# to the control instance instead. Empty client id (local/self-host) → no annotation; ACR polling
# then won't authenticate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "memex-portal-sa"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-portal"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  {{- with .Values.selfUpdate }}
  {{- if .azureClientId }}
  annotations:
    azure.workload.identity/client-id: "{{ .azureClientId }}"
  {{- end }}
  {{- end }}
