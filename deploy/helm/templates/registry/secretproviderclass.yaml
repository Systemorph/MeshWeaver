{{- if (.Values.registry).enabled }}
{{- $r := include "memex.registry" . | fromYaml }}
# ---- Registry secrets: Key Vault → CSI mount + synced Secret --------------
# The token-signing certificate and key (docker_auth SIGNS with them, distribution VERIFIES
# against the certificate), distribution's http.secret, and — only when notifications are on —
# the bearer the registry presents to the event listener. Same provider, identity and idiom as
# the portal's SecretProviderClass (memex-portal/secretproviderclass.yaml).
#
# Two ways out of the vault, deliberately: the CSI MOUNT at /etc/registry/token, under the
# aliases distribution's and docker_auth's configs name (cert.pem / key.pem), and the SYNCED
# Secret `memex-registry-secrets`, which is how a value becomes an ENV (REGISTRY_HTTP_SECRET).
# The CSI driver only syncs a Secret while a pod mounts the volume, so BOTH deployments mount it.
---
apiVersion: "secrets-store.csi.x-k8s.io/v1"
kind: "SecretProviderClass"
metadata:
  name: "memex-registry-keyvault"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "memex-registry"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  provider: "azure"
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ $r.identityClientId }}"
    keyvaultName: "{{ $r.vaultName }}"
    tenantId: "{{ $r.tenantId }}"
    objects: |
      array:
        - |
          objectName: {{ $r.certObject }}
          objectType: secret
          objectAlias: cert.pem
        - |
          objectName: {{ $r.keyObject }}
          objectType: secret
          objectAlias: key.pem
        - |
          objectName: {{ $r.httpSecretObject }}
          objectType: secret
          objectAlias: http-secret
{{- if $r.notificationSecretObject }}
        - |
          objectName: {{ $r.notificationSecretObject }}
          objectType: secret
          objectAlias: notification-authorization
{{- end }}
  secretObjects:
    - secretName: "memex-registry-secrets"
      type: "Opaque"
      data:
        - objectName: cert.pem
          key: cert.pem
        - objectName: key.pem
          key: key.pem
        - objectName: http-secret
          key: http-secret
{{- if $r.notificationSecretObject }}
        - objectName: notification-authorization
          key: notification-authorization
{{- end }}
{{- end }}
