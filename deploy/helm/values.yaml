parameters: {}
# Local dev only (memex-local sets this true via --set): persist /data — the DataProtection keys under
# /data/dataprotection-keys plus the nuget/compile caches — on a node hostPath, so a pod restart does NOT
# wipe the keys and invalidate every session (the "have to refresh / Anonymous resubscribe loop" churn).
# Prod (AKS) leaves this false and mounts PVCs via `persistence:` below instead.
persistDataVolume: false
# ---- Persistent volumes (production) ----------------------------------------
# Pre-created PVC claim names the CHART mounts directly — the single source of truth for durable
# storage. When a claimName is set the deployment renders a persistentVolumeClaim volume for it;
# empty claimNames fall back to persistDataVolume (data) / emptyDir. `data` and `users` mount at
# fixed paths (/data, /mnt/users); any other entry needs BOTH claimName and mountPath and is
# rendered as an extra volume + mount (content, attachments, workspace, …). With multiple portal
# replicas every claim MUST be ReadWriteMany — all replicas share /data (DataProtection keys, the
# NodeType assembly cache, the NuGet cache); a per-pod /data forces a full recompile storm per pod.
# PVC creation stays out of the chart (deploy/aks/manifests/portal-pvcs.yaml or aks-extras.yaml) so
# a `helm uninstall` can never take the data with it. Previously these mounts were bolted on by
# per-env kubectl JSON patches AFTER helm — any unpatched `helm upgrade` silently reverted /data to
# emptyDir, wiping the caches on every restart.
# 🚨 The chart renders NO PersistentVolumeClaim unless an entry says `create: true`. Every claim
# named above on memex / memex-cloud was applied BY HAND from deploy/aks/manifests/portal-pvcs.yaml
# and is unmanaged by helm — so `create` MUST stay absent/false on those environments: a chart
# that started rendering `memex-data` there would fail the next upgrade on "resource already
# exists". A record-driven Provision of a NEW instance (MeshWeaver#3353, the Hosting operator) is
# the case `create: true` exists for: without it a new namespace gets emptyDir (no claimName → the
# Memex#134 data-loss shape) or pods stuck Pending on a claim nothing created.
#
# With `create: true` the chart renders one PersistentVolumeClaim per entry (templates/memex-portal/
# pvc.yaml), named `claimName`, with `size` and `storageClass` REQUIRED (a missing one fails the
# render naming the entry — never a claim of chart-default size on the wrong class), `accessMode`
# defaulting to ReadWriteMany (every portal claim is shared across replicas), and annotated
# `helm.sh/resource-policy: keep`, so an uninstall never takes the data with it. `mountPath` keeps
# its meaning from above; an entry with no claimName is never rendered.
#
#   content:
#     claimName: "memex-content"
#     create: true
#     size: "128Gi"
#     storageClass: "azurefile-memex"
#     accessMode: "ReadWriteMany"
#     mountPath: "/mnt/content"
persistence:
  data:
    claimName: ""
  users:
    claimName: ""
# ---- Self-update (in-pod patch of the portal's own deployment) -------------
# The portal polls the registry and, on Kubernetes, patches its own deployment to a newer image per
# the Admin/UpdatePolicy node (see Doc/Architecture/ReleaseStrategy). The chart always creates the
# ServiceAccount + RBAC so the pod CAN patch its own deployments (works on local k3s too). For ACR
# polling on AKS, set azureClientId to the workload-identity UAMI client id (AcrPull on the registry);
# leave empty for local/self-host (the in-cluster patch still works; ACR polling just won't auth).
selfUpdate:
  azureClientId: ""
  # 🚨 WHERE THIS INSTALLATION PULLS ITS PLATFORM IMAGES FROM, AND LISTS THEM (MeshWeaver#3353).
  # Empty (the default) keeps SelfUpdate__Registry at the image's own default — the upstream Azure
  # Container Registry, listed through ACR's API with the workload identity above. A registry
  # login-server host here — `memex.meshweaver.cloud`, the read-through mirror another
  # installation serves at /v2 — makes the self-updater list tags through the OCI Distribution API
  # instead, authenticated with THIS installation's plugin-registry instance key (the mirror host
  # must equal a pluginCatalog registry's host; no second secret), and roll to images named on
  # that host. Every installation EXCEPT the one serving the mirror sets this — the mirror instance
  # cannot serve the image that boots it (Doc/Architecture/ContainerRegistryInMemex).
  #
  # 🚨 PAIRED with portal.imagePullSecret below: the images the updater rolls to are named on this
  # host, so the kubelet needs a credential for it. AcrPull on the node identity covers ACR only.
  registry: ""
# ---- Container image mirror (the /v2 pull surface THIS installation serves) -----------------
# The read-through OCI mirror (src/MeshWeaver.ContainerImages, MeshWeaver#3353): this installation
# proxies container images from an upstream registry with ONE credential it holds, while every
# caller — a satellite's CI, another installation's self-updater — authenticates with the plugin-
# registry instance key it already carries. ONLY the mirror instance (memex.meshweaver.cloud)
# sets this block; every other installation is a CONSUMER and sets selfUpdate.registry +
# portal.imagePullSecret instead.
#
# Rendered ONLY when `upstream` is set, and then key by key into the portal ConfigMap as
# ContainerImages__Upstream / __Username / __ImageRoot / __CacheDirectory / __CacheMaxBytes and
# ContainerImages__Repositories__<i>. Absent block ⇒ no key rendered ⇒ the mirror is OFF and every
# /v2 route answers 404 (never a partial service). 🚨 `ContainerImages__Password` is a SECRET and
# is NOT rendered from values: it arrives through the Key Vault CSI mapping like every other
# credential —
#   keyVaultSecrets.# ---- Required secrets (Systemorph/Memex#204) ---------------------------------
# Per-key statement of whether an EMPTY value is legal. EMPTY BY DEFAULT — this enforces exactly
# what a deployment declares and nothing otherwise.
#
# 🚨 The defect it closes: a Secret key rendered EMPTY is invisible to a `keys[]` audit — it reads
# as configured. `MEMEX_PASSWORD` sat at base64 length 0 on memex-cloud in both the portal and the
# migration Secret for exactly that reason, and an unconfigured credential then fails at CONNECT
# time in a running portal rather than at render time.
#
# 🚨 NOT a blanket `required`: which optional providers a deployment must have is policy that varies
# by shape and role, and `Ai__KeyProtection__MasterKey` is stateful (fine until the first `enc:` key
# is stored, fatal after). Declare per deployment, in that deployment's values file.
#
#   requiredSecrets:
#     - key: Anthropic__ApiKey
#       because: this deployment routes the `heavy` tier to Anthropic.
#     - key: memex_postgres_password
#       component: memex_migration     # memex_portal (default) | memex_migration
#     - key: GitHub__App__PrivateKey
#       when: false                    # a BOOLEAN a values file sets; Helm has no `eval` here
#
# See templates/_required-secrets.tpl for the full contract.
requiredSecrets: []

secrets:
#     - vaultSecret: <prefix>ContainerImages-Password
#       key: ContainerImages__Password
# The mirror is off unless Upstream, Username AND Password are all present.
containerImages:
  # The upstream registry login server, e.g. meshweaver.azurecr.io. Empty ⇒ the block is inert.
  upstream: ""
  # The upstream pull credential's username (an ACR token name). Its password comes from Key Vault.
  username: ""
  # 🚨 The ALLOWLIST of repositories this mirror serves. EMPTY MEANS NONE — without it one upstream
  # credential becomes an open read proxy for the whole registry.
  repositories: []
  #   - memex-portal-ai
  #   - memex-migration
  #   - mw-plugin-test
  # Where every served manifest is recorded as a ContainerImage node (the node must exist).
  # Empty ⇒ recording is off; the mirror still proxies.
  imageRoot: ""
  # The digest-keyed read-through cache. Empty ⇒ off, the mirror proxies every pull. On a
  # multi-replica installation this must be a SHARED (ReadWriteMany) mount, e.g. under /data.
  cacheDirectory: ""
  # The cache's byte budget (an integer). Empty ⇒ the image default (20 GiB). Rendered only when
  # set: it binds to a long, and a blank string fails the binder at startup.
  cacheMaxBytes: ""
# ---- Plugin catalog ---------------------------------------------------------
# Plugins are folders of mesh nodes in (usually private) git repos. ONE install acts as the
# REGISTRY: it alone holds the git credential, reads the repos listed in `sources`, and re-serves
# the catalog over HTTP at /api/plugins. Every other install is a CONSUMER — it sets `registryUrl`
# (or `registries` for several) and needs NO git access. npm/NuGet-style credential encapsulation.
#
# Tokens are secrets: set them under secrets.memex_portal — PluginCatalog__RegistryToken on a
# consumer (or PluginCatalogConsumerRegistryTokens, index-aligned with pluginCatalog.registries) —
# or inject them from the Key Vault CSI mount.
#
# 🚨 There is no longer a REGISTRY-side token list here. `PluginCatalog__RegistryTokens` bound to
# nothing (no such property on PluginCatalogOptions; PluginRegistryTokens.SectionName/.Validate are
# [Obsolete]) and this paragraph used to tell operators to configure it — advice that produced a
# comfortable belief and no access control. A registry is gated by RequireInstanceKey plus the
# instance keys it issues, each resolving to a MeshWeaverInstance and its admin-owned PluginGrant.
#
# See Doc/Architecture/PluginRegistry.md.
pluginCatalog:
  # REGISTRY: require a registered instance key on /api/plugins. Defaults to TRUE — a registry that
  # configures nothing refuses anonymous callers instead of serving them every source. Set false
  # ONLY for local dev / the e2e stub; the portal then warns on every anonymous request.
  requireInstanceKey: true
  # CONSUMER: base URL of the registry install (e.g. https://memex.meshweaver.cloud).
  # Empty = no remote catalog (the admin tab shows "not configured").
  registryUrl: ""
  registryRef: "HEAD"
  # CONSUMER, multi-registry alternative to registryUrl — [{name, url, ref}].
  registries: []
  # REGISTRY: the git repos whose plugins this install serves — [{name, repoPath, ref, format}].
  # format: node-repo (default, <Folder>/index.json Space root) | package-json.
  # A repoPath may be a URL (needs the GitHub App identity) OR an absolute LOCAL path that exists
  # INSIDE the container — see localRepoMounts below, which is how a local-dev registry serves
  # plugins with no GitHub credential at all.
  sources: []
  # REGISTRY (local/dev): host directories to mount so `sources` can point at a local checkout —
  # [{name, hostPath, mountPath}]. Only meaningful where the node's filesystem is the developer's
  # (Colima/k3s/minikube); leave empty on a real cluster, where sources are URLs served through the
  # GitHub App. Example:
  #   localRepoMounts: [{name: plugins, hostPath: /Users/me/code/MeshWeaver.Plugins, mountPath: /plugin-repos/plugins}]
  #   sources: [{name: Plugins, repoPath: /plugin-repos/plugins, format: node-repo}]
  localRepoMounts: []
  # REGISTRY: Source/Package entries every NEW instance registration is seeded with, e.g.
  # ["Plugins/*"] so a fresh install gets the platform plugin repo without an admin grant step.
  # Registration writes them into the instance's Admin/_PluginGrant node, so admins can still
  # revoke per instance. Empty = strict default: registering grants nothing. Never list
  # private/paid sources here. An entry may name a PLAN — "Plugins/*@free" — and then grants the
  # packages of that source the plan covers (Doc/Architecture/PluginRegistry → Plans).
  defaultGrants: []
  # REGISTRY: OPEN registration — a registration WITHOUT a bootstrap key (a Homebrew install that
  # names only its instance id). Mint a registration key for the plan such callers enrol into
  # (normally `free`) and put it in secrets.memex_portal.PluginCatalog__OpenRegistration__Key; the
  # registry then treats an un-keyed registration as presenting that key. Unset (the default) =
  # open registrations are refused with 401, exactly like an invalid key.
  # CONSUMER: first-startup auto-registration. Set the logical App ID here and the mwr_ bootstrap
  # key as secrets.memex_portal.PluginCatalog__BootstrapKey — on first boot the install registers
  # itself at the registry and stores the issued instance key; no token copying. Empty = manual
  # registration (the mwi_ key goes in PluginCatalog__RegistryToken as before).
  instanceId: ""
  # CONSUMER: this install's public URL recorded on the instance node; defaults to the ingress host.
  homeUrl: ""
  # CONSUMER: what a FRESH install installs by itself on first startup, in the same Source/Package
  # notation as the grants. "Plugins/*" = the whole platform plugin repo (which carries the Store),
  # so a new deployment comes up usable instead of with an empty-but-authorized catalog. Deliberately
  # source-scoped: an install also granted paid course content must NOT auto-install it. Empty =
  # install nothing (the platform default; an admin installs by hand).
  installByDefault: ["Plugins/*"]
  # CONSUMER: the platform's own baseline — packages whose manifest declares `preInstalled`, the
  # Agents/Skills libraries and Essentials. Reconciled on EVERY boot (that is what heals an instance
  # whose baseline partition was lost) and ON by default in code. Set false only for an air-gapped or
  # hand-curated install that manages its own content. Rendered only when set, so the code default
  # stands otherwise.
  # installPreInstalledPackages: true

# ---- Per-environment composition: FEATURE FLAGS ------------------------------
# A named switch this environment turns on or off, optionally carrying the packages the environment
# ALWAYS has — reconciled on every boot, unlike pluginCatalog.installByDefault, which seeds once and
# is therefore a no-op on an already-populated portal.
#
#   • an ENABLED flag INSTALLS the packages it names
#   • a declared-but-DISABLED flag EXCLUDES them, and the exclusion wins over every other signal
#   • a flag with no packages is a plain named boolean, and may be written as a bare bool:
#       features:
#         betaChat: true
#
# Declare the flags once in a shared values file, then let each environment flip `enabled` — the
# per-environment delta is one line. "All of Plugins, without the games and fun stuff":
#
#   features:
#     plugins:
#       description: "The whole platform plugin repo."
#       packages: ["Plugins/*"]
#     games:
#       description: "Games and demos — Chess, the pendulums, the fractals."
#       packages: ["Plugins/Chess", "Plugins/DoublePendulum", "Plugins/FractalStars", "Plugins/ThreeBody"]
#
# …and, in the values file of the environment that does not want them:
#
#   features:
#     games:
#       enabled: false
#
# See Doc/Architecture/EnvironmentComposition.
features: {}
# ---- Platform-admin Instances overview -------------------------------------
# The admin "Instances" tab lists every portal on the cluster by querying the k8s API. Reading
# deployments/ingresses ACROSS namespaces needs a cluster-scoped read grant — enable it ONLY on the
# company/control instance, never on public or customer instances (a tenant pod must not be able to
# enumerate the whole cluster). Off by default; the company env sets clusterRead: true.
# clusterRead also drives Instances__Enabled — the SAME flag both grants the RBAC and makes the
# Settings menu item exist, so on every other instance the tab never appears at all.
instancesAdmin:
  clusterRead: false
  # Grafana base URL for the per-instance log deep links (Grafana Explore / Loki) on the
  # Instances tab (→ Instances__GrafanaBaseUrl). Empty = the tab shows a configure-me hint
  # instead of links. Only meaningful where clusterRead is true (the company instance).
  grafanaBaseUrl: ""
# ---- Instance lifecycle operator (the Hosting plugin) ----------------------
# Arms self-service instance provisioning, suspension, backup, restore and teardown. The identity
# this reaches can DELETE NAMESPACES and DROP DATABASES across the fleet, so it is off here and
# enabled on the CONTROL INSTANCE only.
#
# 🚨 Enabling this is four things, not one, and three of them are outside the chart:
#   1. `kubectl apply -f deploy/aks/manifests/hosting-operator/` (ops namespace, the two
#      ServiceAccounts, the jobrunner Role + token Secret)
#   2. a federated credential on the operator managed identity for
#      system:serviceaccount:<namespace>:<serviceAccount>
#   3. the hosting-operator image built and pushed (deploy/aks/operator/)
#   4. the jobrunner token mounted into the portal at tokenFile, via extraVolumes /
#      extraVolumeMounts below
# With `enabled: true` and any of those missing, HostingOperator.Resolve refuses and names what it
# could not find — by design: an unconfigured mesh cannot be talked into provisioning.
hostingOperator:
  enabled: false
  # The ops namespace and the Job's (powerful) ServiceAccount. Both appear VERBATIM in the
  # federated credential's subject, which Azure matches as a string — rename either and the token
  # exchange fails at run time with an error naming neither.
  namespace: "memex-ops"
  serviceAccount: "hosting-operator"
  # REQUIRED when enabled — the chart fails the render without it rather than letting every action
  # refuse later. The chart is baked into this image, so its tag is also the chart version a
  # provision deploys.
  image: ""
  # Where the portal reads the jobrunner bearer token. Deliberately not the pod's own projected
  # token: this capability is meant to be removable by deleting one volume mount.
  tokenFile: "/var/run/secrets/hosting-operator/token"
  deadlineSeconds: 3600
  # Environment handed to every operator Job. Named keys — the plugin turns each into KEY=VALUE.
  # A step that needs one it did not get refuses by name, so an incomplete map fails loudly at the
  # step rather than producing a half-provisioned instance.
  environment: {}
  #   AZ_RESOURCE_GROUP:     memex-aks-rg
  #   AZ_DNS_RESOURCE_GROUP: dns
  #   AZ_PORTAL_IDENTITY:    <portal user-assigned identity name>
  #   AZ_OIDC_ISSUER:        <az aks show --query oidcIssuerProfile.issuerURL -o tsv>
  #   INGRESS_IP:            <the ingress controller's public IP>
  #   PAYWALL_URL:           https://<control instance>/suspended
  #   CATALOG_CONFIG:        /tmp/hosting-catalog-config
  #   HOSTING_VALUES_FILE:   /tmp/hosting-values.yaml   (where run.sh materialises the RECORD-rendered values)
  # ── The SECRET half of that environment (Memex#132) ────────────────────────────────────────
  # `environment` above renders into the portal's ConfigMap, one plaintext key each. That is right
  # for AZ_RESOURCE_GROUP or INGRESS_IP and WRONG for a credential: PGPASSWORD is the shared
  # `memexadmin` password for the flexible server, i.e. the one credential that reaches EVERY
  # instance database on it. Putting it in `environment` means a ConfigMap readable by anything with
  # configmap read in the namespace, and git if committed. Declaring it here instead renders a
  # SecretProviderClass and a CSI-synced Secret in the OPERATOR's namespace (memex-ops), which is
  # where the Jobs run and where a portal-namespace Secret is not visible.
  #
  # NAMES ONLY — `<ENV KEY>: <Key Vault object name>`. No value ever enters values or the render.
  secretEnvironment: {}
  #   PGPASSWORD: memex-postgres-password
  #
  # Vault coordinates. Each falls back to the portal's .Values.keyVaultSecrets, so an environment
  # that already declares those needs only `secretEnvironment` above.
  keyVault: {}
  #   vaultName:        Systemorph
  #   tenantId:         <tenant guid>
  #   identityClientId: <the Key Vault Secrets Provider add-on's user-assigned identity>
  #   name:             hosting-operator-keyvault   (the SecretProviderClass; also the synced Secret)
  #   syncedSecret:     hosting-operator-keyvault
  #   mountPath:        /mnt/operator-secrets
  #
  # 🚨 The Job must MOUNT the class — a SecretProviderClass with no mounting pod syncs nothing, with
  # no error anywhere. The three coordinates are published as Hosting__Operator__SecretProviderClass
  # / __SecretName / __SecretMountPath so HostingOperator.Resolve can attach volume, mount and env.
  # Reading the file under the mount path is the ordering-safe form; an envFrom on the synced Secret
  # only works once something has already mounted the class at least once.
# ---- Fixed replica count (portal) ------------------------------------------
# Read ONLY when keda.enabled is false — with KEDA on, the HPA owns spec.replicas and the chart
# deliberately renders no such field (see templates/memex-portal/deployment.yaml).
#
# 1 is the self-host default. Raising it is an HA decision with two hard prerequisites, because a
# second replica is a second Orleans SILO and a second writer on every volume:
#   * config.memex_portal.Deployment__Orleans__Clustering must be "AdoNet" (or "AzureTables").
#     "Localhost" clustering is single-process membership — two Localhost silos do not form one
#     mesh, they form two, and grain calls resolve against whichever pod the request landed on.
#   * every persistence.* claim must be ReadWriteMany. /data is shared state (DataProtection key
#     ring, the NodeType assembly cache, the NuGet cache); a ReadWriteOnce claim either pins both
#     pods to one node or leaves the second pod unschedulable.
# Both are asserted at render time by .github/workflows/chart-gate.yml, so a values file that
# raises this without them fails the build instead of the deployment.
replicas:
  portal: 1
# ---- Key Vault secrets, DECLARED (renders the SecretProviderClass) ---------
# The portal's secrets live in Azure Key Vault and reach the pod through the
# secrets-store CSI driver: a SecretProviderClass names the vault objects, the
# driver mounts them and syncs them into a Kubernetes Secret, and the pod reads
# that Secret via envFrom. Until 2026-08-30 the SecretProviderClass was a
# HAND-MADE object in every namespace — `kubectl apply`-ed once, present in no
# repo, rendered by nothing — and the values file could only point at it by
# name (extraEnvFrom / extraVolumes below). So which secrets a pod carried was
# knowable only from the cluster, and the memex install ended up with its
# Email configuration TWICE: the chart's ConfigMap said Email__Enabled=false,
# a hand-made Secret patched onto the live Deployment as explicit env said
# EMAIL__ENABLED=true, and because .NET's environment provider is case-
# insensitive, which copy won was decided by enumeration order at each pod
# start. A coin toss per boot, invisible from any file; it crashed the portal
# with EmailConfigurationGuard on 2026-08-30.
#
# This block is the declaration. The chart renders from it, in one place:
#   * templates/memex-portal/secretproviderclass.yaml — the SecretProviderClass
#     (every `secrets[]` entry as a vault object AND as a key of the synced
#     Secret), and
#   * templates/memex-portal/deployment.yaml — the CSI volume, its mount (the
#     mount is what makes the driver sync and keep rotating), and the envFrom
#     on the synced Secret. Nothing else needs to be patched onto the pod.
#
# EMPTY `secrets` ⇒ NOTHING renders, so an environment that has not opted in
# is byte-identical to before. With any entry, `vaultName`, `tenantId` and
# `identityClientId` are REQUIRED — a half-declared block fails the render
# rather than producing a SecretProviderClass that syncs nothing.
#
# 🚨 NAMES ONLY. `vaultSecret` is the vault OBJECT'S name and `key` is the
# environment key it lands as (`Section__Key` ↔ `Section:Key`). No value ever
# appears here — the value stays in the vault, and this file stays committable.
# Fleet convention for the vault name: `<keyVaultSecretPrefix><Section>-<Key>`
# (memexcloud-Email-ClientSecret ↔ Email__ClientSecret); the Hosting plugin's
# Deployment record derives it from the key when the record leaves it blank.
#
# 🚨 A declared object that does NOT exist in the vault fails the whole mount:
# the pod stays ContainerCreating and the rollout stalls while the OLD pod
# keeps serving. Create the vault secret BEFORE declaring it here. Since
# MeshWeaver#3548 the run-once migration Job mounts these classes too — it
# CONSUMES their values, so it must be the one that fetches them — which means
# a missing vault object stalls the migration as well, loudly, instead of
# letting it run green against whatever the last mount left behind.
#
# 🚨 A new or changed vault value needs the pod to RESTART (the driver reads
# the vault at pod start) — see Doc/Architecture/DeploymentAKS → "KeyVault CSI
# env timing": a synced Secret populated by pod A is read by pod B.
keyVaultSecrets:
  # The vault, its tenant, and the client id of the identity that READS it —
  # the Key Vault Secrets Provider add-on's user-assigned identity:
  #   az aks show -g <rg> -n <cluster> \
  #     --query addonProfiles.azureKeyvaultSecretsProvider.identity.clientId -o tsv
  # That identity needs secret GET on the vault (role "Key Vault Secrets User").
  vaultName: ""
  tenantId: ""
  identityClientId: ""
  # The SecretProviderClass's name, and the Kubernetes Secret it syncs into
  # (blank ⇒ the same name). An environment adopting a hand-made SPC states
  # the live names here so `helm-release adopt` stamps ownership on the
  # existing objects instead of creating a second pair beside them.
  name: "memex-portal-keyvault"
  syncedSecret: ""
  # The CSI volume's name and mount path inside the portal container.
  volumeName: "kv-secrets"
  mountPath: "/mnt/secrets-store"
  # The secrets, by name. Example:
  #   secrets:
  #     - vaultSecret: memexcloud-Email-ClientSecret
  #       key: Email__ClientSecret
  #     - vaultSecret: memexcloud-Authentication-Microsoft-ClientSecret
  #       key: Authentication__Microsoft__ClientSecret
  #
  # 🚨 ONE VAULT OBJECT MAY SERVE SEVERAL KEYS. A key has exactly one home; an
  # object may be read under as many names as the portal looks for. `memex`
  # reads its registry credential as BOTH `PluginCatalog__RegistryToken` (the
  # legacy single-registry key) and `PluginCatalog__Registries__0__Token` (the
  # per-registry key of the named registry) from the one object
  # `PluginCatalog-RegistryToken` — that second mapping IS the fix for
  # MeshWeaver#3201 / Memex#164, and it must stay expressible.
  secrets: []
# ---- ADDITIONAL Key Vault secret classes (a namespace that reads more than one)
# The block above holds ONE SecretProviderClass. A namespace whose pod reads two
# vault-secret sets — `memex` runs the hand-made `memex-kv` (13 keys: the
# connection string, the GitHub App key, the AI provider keys) alongside the
# chart-owned `memex-portal-keyvault` (the plugin-registry token) — declares the
# rest here. Same shape as `keyVaultSecrets`, one entry per class.
#
# 🚨 WHY IT EXISTS. With one slot, a record or overlay describing this namespace
# had to CHOOSE which class to state, and whichever it chose, a re-render dropped
# the other. On 2026-09-06 the `memex` record described `memex-kv` while the
# deployed overlay described `memex-portal-keyvault`: a re-render would have
# removed the class that had just fixed the registry poll AND rendered one for
# `memex-kv` naming a vault object that does not exist — a failed mount, i.e. a
# portal that cannot start.
#
# ORDER IS PRECEDENCE. The classes are appended to `envFrom` after the chart's
# ConfigMap and Secret, in this order; Kubernetes keeps the LAST entry on a key
# clash, so a later class wins over an earlier one for a shared key.
#
# `name`, `volumeName` and `mountPath` are REQUIRED on every entry — a second
# class falling back to the first's defaults would collide on all three (two pod
# volumes of one name is an invalid spec; two classes syncing into one Secret
# race each other). `syncedSecret` still defaults to the class's own name, and
# the vault coordinates fall back to `keyVaultSecrets` above.
#
#   keyVaultSecretClasses:
#     - name: "memex-kv"
#       syncedSecret: "memex-kv-secrets"
#       volumeName: "kv-secrets"
#       mountPath: "/mnt/kv-secrets"
#       secrets:
#         - vaultSecret: memex-connectionstring
#           key: ConnectionStrings__memex
keyVaultSecretClasses: []
# ---- Extra env sources for the portal AND the migration Job ----
# (verbatim EnvFromSource objects)
# 🚨 BOTH workloads render these, and that parity is the point (#3595):
# the migration Job rendered none of it until then, so a key delivered this way
# reached the portal and NOT the backfill — which logged-and-skipped every row
# and still reported `Database migration completed`. KeyVaultEscapeHatchParityGuard
# holds the two renders together.
# ⚠️ LEGACY ESCAPE HATCH — kept for environments whose SecretProviderClass is
# still hand-made. Declare the secrets under `keyVaultSecrets` above instead;
# that renders the SecretProviderClass AND the envFrom, so the pod's secret
# set is readable from the values file. For env the chart does not own —
# typically a Key Vault CSI-synced Secret (SecretProviderClass → k8s Secret).
# Without this key such a source can only be attached by a live kubectl
# patch, which the next `helm upgrade` silently drops (the memex-cloud
# AI-keys shape). Example:
#   extraEnvFrom:
#     - secretRef:
#         name: memexcloud-portal-ai-secrets
extraEnvFrom: []
# ---- Extra volumes/mounts for the portal AND the migration Job ----
# (verbatim Volume/VolumeMount)
# ⚠️ LEGACY ESCAPE HATCH — see extraEnvFrom; `keyVaultSecrets` renders the
# CSI volume and its mount too. The volume-shaped twin of extraEnvFrom, for
# resources the chart does not own — typically the secrets-store CSI volume
# behind a SecretProviderClass: the MOUNT is what makes the CSI driver sync
# (and keep rotating) the k8s Secret that extraEnvFrom then reads. 🚨 So a
# workload that lists the Secret in extraEnvFrom must also carry the volume and
# its mount, or it free-rides on another pod's mount and reads a value that is
# stale or absent (#3548 / #3595). Example:
#   extraVolumes:
#     - name: kv-ai-secrets
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes:
#           secretProviderClass: memexcloud-portal-ai-secrets
#   extraVolumeMounts:
#     - name: kv-ai-secrets
#       mountPath: /mnt/secrets-store
#       readOnly: true
extraVolumes: []
extraVolumeMounts: []
# ---- KEDA autoscaling (portal) --------------------------------------------
# HA deployments autoscale the portal via a KEDA ScaledObject (templates/
# memex-portal/scaledobject.yaml) instead of a fixed replica count. Off by
# default (single-replica installs); the AKS overlay enables it. Scale-UP is
# fast, scale-DOWN is deliberately slow — a Blazor Server circuit is stateful
# (killing a pod drops its users' sessions) and every silo add/remove churns
# the Orleans cluster, so we shed load gently. Requires the KEDA operator
# (AKS managed add-on: `az aks update --enable-keda`) + metrics-server, and
# AdoNet Orleans clustering (Localhost cannot span the replicas KEDA adds).
keda:
  enabled: false
  minReplicas: 2          # HA floor (also the Orleans cluster seed)
  maxReplicas: 8
  cpuTarget: 70           # % CPU utilization — scale up past this
  memoryTarget: 80        # % memory utilization
  cooldownPeriod: 300     # seconds idle before scaling toward min
  scaleDownStabilizationSeconds: 600   # 10 min of calm before removing a pod
# ---- External Ollama (local self-host) ------------------------------------
# Front a host-native Ollama with an in-cluster Service so the portal addresses
# it by name (http://ollama:11434/v1) instead of a host-gateway IP. On macOS the
# GPU is reachable only from host processes (Docker/k8s have no Metal passthrough),
# so Ollama runs on the host and `host` is the cluster's host gateway (Colima:
# 192.168.5.2). Disabled by default (neutral chart); a local overlay turns it on.
ollama:
  external:
    enabled: false
    host: ""        # cluster host-gateway IP of the host running Ollama
    port: 11434
# ---- Native gRPC (HTTP/2) for foreign-language participants ---------------
# The mesh gRPC service (meshweaver.v1.Mesh/Open — the bidi participant connection the Python /
# Node SDKs use) needs real HTTP/2 end-to-end; the browser path (HTTP/1.1 + gRPC-web) is not
# enough. Enabled: Kestrel gets TWO extra endpoints beside the 8080 web port —
#   * port (8081): PUBLIC h2c gRPC, exposed via the service and (when ingress.enabled) a same-host
#     ingress whose /meshweaver.v1.Mesh path proxies with backend-protocol GRPC — so participants
#     connect to the ordinary portal URL over TLS, no extra DNS or certs.
#   * trustedPort (8082): TRUSTED endpoint bound to 127.0.0.1 — reachable ONLY from containers in
#     the portal's own pod (the shipped node / bun / python gates). Reachability IS the
#     authentication: no API token, nothing to rotate; deliveries may carry through the requesting
#     user's AccessContext (see GrpcOptions.TrustedPort).
# ---- Images --------------------------------------------------------------------------------------
# Defaults are the published tags, so an unchanged install behaves exactly as before. They are
# overridable so a local or CI cluster can run images built from a working tree WITHOUT `docker tag`
# -ing over the shared ghcr names — retagging those is global to the Docker daemon, so it silently
# swaps whatever else on the machine is already running them at its next restart.
portal:
  image: "ghcr.io/systemorph/memex-portal-ai:latest"
  # The NAME of a kubernetes.io/dockerconfigjson Secret in this namespace, rendered as
  # `imagePullSecrets` on the portal Deployment's pod spec AND the migration Job's — the two pods
  # that pull the platform images. Empty (the default) renders nothing, and the AKS kubelet's
  # AcrPull keeps working exactly as today. Set it on an installation whose selfUpdate.registry
  # is the mirror: the operator's `hosting-pull-secret` creates the Secret from the instance key in
  # Key Vault (deploy/aks/manifests/hosting-operator/README.md). MeshWeaver#3353.
  imagePullSecret: ""
  # How long a rolled-out pod may keep serving the sessions it already has. The container's preStop
  # drains the ingress (15s) and then waits on /drain until its last Blazor circuit closes, so this
  # is the ceiling on "how long may someone keep working on the OLD build after a roll" — not a
  # delay: a pod with no circuits exits in seconds. It also bounds how long a second silo lives
  # alongside the new one, which matters because both hold their own set of compiled NodeType
  # assemblies. 30 minutes covers a working session; lower it where memory is tighter than
  # continuity.
  drainSeconds: 1800
  # 🚨 The tail of drainSeconds RESERVED for the process's own shutdown — NOT part of the session
  # drain. preStop stops polling at (drainSeconds − shutdownMarginSeconds) and returns, so SIGTERM
  # is delivered while there is still grace left to shut down IN.
  #
  # Without it the whole grace was spent waiting, and a pod whose sessions outlived it was SIGKILLed
  # WITH A LIVE ORLEANS SILO: the host's 90 s ShutdownTimeout never ran, ApplicationStopping never
  # fired, and the silo never departed membership. This deployment's own
  # `cluster-autoscaler.kubernetes.io/safe-to-evict: "false"` annotation records the cost — "each
  # abrupt departure left a ZOMBIE entry in the Orleans membership table: the cluster kept placing
  # new grain activations on the dead silo, so writes timed out mesh-wide". And riding to the
  # ceiling was the NORMAL outcome of a roll, not the exception (measured on memex 2026-08-21: a
  # terminating pod still executing application code at 09:09:44Z, gone at the ceiling 09:10:52Z,
  # while a serving pod had five circuits open at an arbitrary moment) — so the roll design was
  # protecting users from the FAST teardown by guaranteeing the ABRUPT one. See #1971.
  #
  # 120 s: comfortably above the host's own 90 s ShutdownTimeout (Memex.Portal.Distributed
  # Program.cs), which is the budget this margin exists to make room for.
  #
  # The trade this makes EXPLICIT rather than by accident: at the deadline the last stragglers are
  # cut off — deliberately, logged, naming the count — instead of everyone being kept and the
  # process then dying abruptly. Raise drainSeconds if sessions that long are expected; do not
  # shrink this below the host's ShutdownTimeout.
  shutdownMarginSeconds: 120
# ---- Plugin bundles from the fleet registry (Doc/Architecture/PluginBundlesInTheRegistry) -------
# The `bundle-fetch` init container: before the portal starts, it pulls the sealed publication
# of every source below for THIS image's framework identity from the fleet registry
# (`<registry>/plugins/<source>:<identity>`, an OCI image index) with ORAS and lays it out under
# the directory the pre-warm reads — `<root>/<identity>/<source>/…`, `_complete` gating each
# source — exactly as CI's share copy is laid out, so the portal keeps reading a filesystem and
# needs no registry client to seed. Off by default (registry empty ⇒ nothing renders). When on,
# every key below is asserted by templates/memex-portal/_bundles.tpl, and portal.imagePullSecret
# must be set: the init container authenticates with that Secret's docker config, so the key
# that pulls the platform image pulls the bundles and there is no second credential.
#
# A source whose tag is absent for the identity is UNSEALED: the init container logs it, writes
# nothing for that source and exits 0 — the pre-warm compiles that source as it does today. Any
# other failure (a denied pull, a network error, a torn publication) exits 1 and holds the pod.
bundles:
  registry: ""                    # e.g. cr.meshweaver.cloud — set ⇒ the init container renders
  sources: []                     # source names as the publisher named them, e.g. [plugins]
  # The framework identity to pull — the identity of portal.image (the bake lane prints it as
  # `baked identity:`, and the publication it registered carries it). A roll that changes the
  # image without a `helm upgrade` leaves this stale: the pre-warm then finds no directory for
  # its own identity and compiles — inert, never wrong. Either this or identityFile.
  identity: ""
  identityFile: ""                # a file INSIDE the init container (under /data) holding it
  # ORAS, pinned by digest. Resolved 2026-09-08 with `crane digest` (multi-arch index digest).
  image: "ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179"
  root: ""                        # defaults to config.memex_portal.PreWarm__PrebuiltBundleRoot
  resources:
    requests: {cpu: "50m", memory: "64Mi"}
    limits: {memory: "256Mi"}
migration:
  image: "ghcr.io/systemorph/memex-migration:latest"
  # The migration run's wall-clock BUDGET in minutes — every versioned repair and every always-on
  # phase together. The runner fails RED, naming the step, when one outlives it
  # (MIGRATION_BUDGET_MINUTES), and the Job's activeDeadlineSeconds is this plus one minute so
  # Kubernetes enforces the same number from outside. 🚨 Ten minutes is the default on purpose and
  # more is an EXPLICIT decision in the deployment's overlay: a migration that needs longer is not
  # a migration to make room for, it is one to rewrite as bulk work (one set-based statement per
  # partition, never a request per row). Measured 2026-09-07: a row-at-a-time embedding backfill
  # held the memex-cloud Job for 4 h 30 min with its deploy reported failed and nothing naming why.
  budgetMinutes: 10
  # Rehearse before executing: an init container runs the same image with MIGRATION_MODE=rehearse
  # and counts what the pending repairs would touch — executes nothing — before the migration
  # container may start. A rehearsal that fails stops the deploy before the run. Needs an image
  # that knows the mode (MeshWeaver.Plugins#1489 or later); an older image would run the whole
  # migration twice, so set this to false only for such an image.
  rehearse: true

# ---- Startup probe budget ------------------------------------------------------------------------
# periodSeconds × failureThreshold is the HARD ceiling on how long a pod may take to serve /health
# before Kubernetes kills it. Defaults (5 × 60) = 5 minutes: right for a plain cold boot (schema
# provisioning + static import).
#
# ⚠️ If you enable config.memex_portal.PreWarm__GateReadiness, raise failureThreshold in the SAME
# change — the gate holds /health red for the whole bake. Suggested paired setting:
#   periodSeconds: 10, failureThreshold: 180   →  1800 s = 30 min
#
# ⏱️ DERIVED from the MEASURED per-type bake cost (2026-08-10, production Loki):
#   ~2.4 s per NodeType, sequential — memex-cloud 237-241 types / 567 s, memex 72-81 / 179 s.
#
#   largest production mesh   ~240 types x 2.4 s  ~= 570 s   (~10 min)
#   + plain cold boot         schema provisioning + static import (the ungated 5 min budget)
#   worst realistic startup                       ~= 870 s   (~15 min)
#   x2 headroom                                    = 1800 s  (30 min)
#
# 1800 s also covers ~750 types — 3x the largest mesh we run — so growth has room without another
# resize. Under-budgeting here is not a slow rollout: it is a pod killed mid-bake that never
# converges, on every single attempt.
#
# 🚨 The suggestion here was 10 x 1080 (3 h) until 2026-08-10, sized from a "~90 s per NodeType"
# estimate that measurement showed to be 37x too high. The point of this budget is that a genuinely
# STUCK bake is DETECTED, and at 3 h it could not be: every real bake finishes inside 10 min, so the
# remaining 2h50m distinguished nothing — a wedged pod and a healthy one are indistinguishable for
# the rest of that window. See deploy/CHANGE-PROPAGATION.md#the-bake-tax.
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60

grpc:
  enabled: true
  port: 8081
  trustedPort: 8082
  # ---- Gates (TRUSTED co-deployed participant sidecars) ------------------------------------------
  # A gate is a participant sidecar in the portal pod that connects to the trusted loopback endpoint
  # above (127.0.0.1:{trustedPort}) — reachability across the shared pod network namespace IS the
  # authentication, no token. Two kinds:
  #   • LANGUAGE gates (python, node) — foreign-language counterparts of the in-process Roslyn kernel:
  #     a Code node whose Language routes to the matching gate (CodeNodeType.ResolveKernelAddress),
  #     runs, and writes its result back onto the run's Activity node.
  #   • EXAMPLE participants (pandas) — a long-lived stateful participant the docs drive (the pandas
  #     node holds a live DataFrame at py/pandas for Doc/DataMesh/PythonPandasNode).
  #
  # FEATURE FLAG per gate: by default ALL are INCLUDED (enabled: true) — set enabled:false to opt out.
  # A gate actually RUNS when it is enabled AND its image is supplied (built from
  # deploy/{python,node,pandas}-gate/Dockerfile, pushed to a registry the cluster can pull); image
  # left empty ⇒ no sidecar, so a bare install never crash-loops on a missing image.
  gates:
    python:
      enabled: true
      image: ""
      address: "py/python-kernel"
    node:
      enabled: true
      image: ""
      address: "node/node-kernel"
    pandas:
      enabled: true
      image: ""
      address: "py/pandas"
# ---- Portal Ingress (TLS via an ingress controller) -----------------------
# Off by default (cloud envs wire ingress/TLS their own way). A self-host overlay
# enables it with a hostname + a pre-created TLS secret. The proxy-*-timeout
# annotations keep the Blazor Server SignalR circuit (WebSocket) alive.
ingress:
  enabled: false
  className: "nginx"
  host: ""          # e.g. memex.localtest.me (resolves to 127.0.0.1)
  tlsSecret: ""     # name of a kubernetes.io/tls secret in this namespace
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 🚨 The browser's live connection is gRPC-WEB server-streaming (meshweaver.v1.Mesh/Connect,
    # mesh→client) over THIS web ingress — not the native /Open path. nginx buffers proxied responses
    # by DEFAULT, which holds a streaming response until its buffer fills or the upstream closes: the
    # browser then receives only a truncated SUBSET of frames and the stream dies
    # (ERR_CONNECTION_CLOSED) — the "page renders a random subset / stops prematurely" bug. The
    # stream must flush frame-by-frame, so response buffering MUST be off.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # 🚨 MODULE BUNDLES ARE POSTED THROUGH THIS INGRESS. /api/plugins/bundles/{package} is the
    # registry's acquisition half (ModulePublish → ModuleLandingService.ShelveModule), and a real
    # bundle is tens of MB — DefaultViews is ~19 MB with its 254 static assets. nginx's DEFAULT
    # body limit is 1 MB, so without this the route answers 413 before the request ever reaches
    # the portal, and no module can ever be published to a chart-deployed registry. The MCP
    # ingress has carried this for its own uploads since it was written; the portal ingress —
    # which is the one serving /api — did not, so the two disagreed about how big a POST may be.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # 🚨 SIGN-IN 502s WITHOUT THIS. proxy-body-size above bounds how big a REQUEST may be;
    # this bounds how big a RESPONSE HEADER may be, and the sign-in callback's is large by
    # construction. ASP.NET Core serialises the whole authentication ticket — the external
    # identity's claims — into the auth cookie and splits anything past ~4 KB into numbered
    # chunks (MemexAuthC1, MemexAuthC2, …), each its own Set-Cookie header; the same response
    # also deletes the OIDC correlation and nonce cookies, whose NAMES alone are ~380 chars.
    # nginx's DEFAULT proxy_buffer_size is 4 KB, so it discards its own upstream's answer with
    # "upstream sent too big header" and serves the user 502 Bad Gateway — while the portal's
    # logs show the callback handled successfully, because the response died one hop later.
    # Developer login writes a small cookie and passes, so a deployment looks healthy while
    # EVERY external provider is broken. Observed on a chart-deployed portal, 2026-08-31.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
# ---- Next.js React portal (experimental frontend — FEATURE-FLAGGED) --------
# When enabled, a Next.js streaming-SSR build of the React GUI (clients/portal-next)
# runs as its OWN Deployment beside memex-portal, and the portal ingress gains a
# `/next` path routed to it (nginx longest-prefix: /next/* → portal-next, everything
# else — incl. /api, gRPC-web, _blazor the React app calls same-origin — falls through
# to the Blazor portal). The Blazor shell also gets Portal:ReactAppUrl=/next injected
# (see the portal ConfigMap), which lights up the reversible PER-USER toggle: the user
# menu's "Try the new frontend" → GET /frontend/react sets the mw-frontend cookie and
# redirects to /next; "Back to classic" → /frontend/blazor reverses it. The DEPLOYMENT
# DEFAULT frontend stays Blazor (Portal:Frontend is left unset) — this is opt-in, not a
# forced switch. Off by default (neutral chart): prod/AKS is unaffected until an overlay
# sets portalNext.enabled=true with an image the cluster can pull. Locally, memex-local
# builds the image and flips this on automatically. See clients/portal-next/DEPLOY.md.
portalNext:
  enabled: false
  # Container image. memex-local builds + tags this into Colima's Docker store and k3s
  # loads it IfNotPresent. For AKS, push to ACR and override this + enabled in an overlay.
  image: "meshweaver/portal-next:local"
  replicas: 1
  # Server-side (SSR) token mint + snapshot fetch go straight to the portal Service,
  # skipping the ingress round-trip. The BROWSER still talks same-origin (cookies +
  # gRPC-web are ingress-routed), so this only affects SSR.
  portalOrigin: "http://memex-portal-service:8080"
# ---- The fleet's own container registry (cr.meshweaver.cloud) ----------------
# A SEPARATE service beside the portal — its own pods, host and blob container — built from two
# off-the-shelf images and no registry code of ours: CNCF `distribution` (the registry, storage
# driver `azure` as the namespace's workload identity) and `cesanta/docker_auth` (the token
# server: ONE static publisher account by bcrypt hash, every other password validated as a
# MeshWeaver instance key against the portal). One Ingress on `host` routes /auth → docker_auth
# and everything else → distribution. Off by default (neutral chart): nothing under
# templates/registry/ renders until `enabled: true`, and then EVERY key marked (required) must
# be set or `helm template` fails naming it — there is no half-rendered registry.
#
# NAMES ONLY: the keyVault.* entries are vault OBJECT NAMES the CSI driver fetches at pod start.
# The one value that is a credential is `publisher.passwordBcrypt`, and it is a HASH
# (`htpasswd -nB publisher`, then paste the part after the colon) — committable.
#
# Design: Doc/Architecture/ContainerRegistryInMemex → "The registry as a separate service".
# A complete, renderable example: deploy/helm/values.registry.example.yaml (the chart gate
# renders it on every pull request).
registry:
  enabled: false
  host: ""                        # (required) e.g. cr.meshweaver.cloud — NOT an Azure name
  # Both images pinned BY DIGEST, so what runs is what was reviewed. Resolved 2026-09-08 with
  # `docker buildx imagetools inspect` (multi-arch index digests):
  #   ghcr.io/distribution/distribution:3.1.1@sha256:bca24727f4002e51f959c18c42e816e4d1078198081a9837e16b8b7d7e43ebf8
  #   cesanta/docker_auth:1.14.0@sha256:98e0307e0d2dcbafe10098814a97d248143b78ca478693f78c3c0d67fe776ab4
  # 🚨 docker_auth must be ≥ 1.14.0: distribution 3 looks tokens up by RFC 7638 thumbprint and
  # 1.14.0 is the first release that can emit one (token.disable_legacy_key_id, set in the
  # rendered config). 1.13.0 signs with the libtrust key id only and EVERY login is refused.
  # 🚨 BOOTSTRAP: these two are the only images an installation pulls from OUTSIDE its own
  # registry — the registry cannot serve the image that boots it (ghcr.io and Docker Hub).
  image: ""                       # (required) distribution, pinned
  authImage: ""                   # (required) docker_auth, pinned
  issuer: "memex-registry"        # token issuer — docker_auth signs it, distribution checks it
  replicas: 1
  storage:
    accountName: ""               # (required) the Azure Storage account; the workload identity
                                  #            needs Storage Blob Data Contributor on it
    container: "registry"
  # The namespace's workload-identity service account (the portal's, by default): the pods carry
  # `azure.workload.identity/use: "true"` and the storage driver authenticates as it.
  serviceAccount: "memex-portal-sa"
  keyVault:
    name: ""                      # (required) the vault
    tenantId: ""                  # falls back to keyVaultSecrets.tenantId
    identityClientId: ""          # falls back to keyVaultSecrets.identityClientId
    certObject: ""                # (required) vault secret: token-signing certificate, PEM
    keyObject: ""                 # (required) vault secret: its private key, PEM
    httpSecretObject: ""          # (required) vault secret: distribution's http.secret
    notificationSecretObject: ""  # required iff notifications.url — the Authorization header
                                  # value sent with every event (e.g. "Bearer <key>")
  publisher:
    username: "publisher"
    passwordBcrypt: ""            # (required) bcrypt HASH — `htpasswd -nB publisher`
  # Where an instance key is validated — a POST with an empty JSON body and the key as a bearer:
  # any 200 authenticates, 401/403 denies, anything else is an error (never a pass). The default
  # is the public portal's key→token exchange, which answers in ~0.2 s; the plugin catalog is not
  # a validator (it renders in full, measured 14–18 s, past the validator's 10 s cap).
  validationUrl: "https://memex.meshweaver.cloud/api/instances/token"
  notifications:
    url: ""                       # registry events are POSTed here when set
  ingress:
    className: "nginx"
    clusterIssuer: ""             # cert-manager ClusterIssuer; empty = tlsSecret is pre-created
    tlsSecret: "memex-registry-tls"
  resources:
    registry:
      requests: {cpu: "50m", memory: "128Mi"}
      limits: {memory: "512Mi"}
    auth:
      requests: {cpu: "20m", memory: "32Mi"}
      limits: {memory: "128Mi"}
secrets:
  # ---- Database connection strings -------------------------------------------
  # Leave EMPTY to use the chart's in-cluster Postgres (memex-postgres-service) — the self-host /
  # local-k3s / compose default. Set them to point at an EXTERNAL server (Azure Postgres Flexible
  # Server, RDS, …); the chart then renders exactly what you supply, and the deployment no longer
  # needs a post-`helm upgrade` `kubectl patch` to undo a hard-coded host.
  #
  # ConnectionStrings__orleans is the Orleans membership store — a dedicated `orleans` database on
  # the SAME server, created by the migration's OrleansClusteringSetup. It is emitted only when
  # config.memex_portal.Deployment__Orleans__Clustering is "AdoNet", and the chart REFUSES to
  # render (helm `fail`) if you supply an external ConnectionStrings__memex without it — silently
  # defaulting membership to an in-cluster host the deployment does not run is how an upgrade
  # takes the whole namespace down.
  memex_postgres:
    memex_postgres_password: ""
  memex_migration:
    ConnectionStrings__memex: ""
    ConnectionStrings__orleans: ""
    memex_postgres_password: ""
    MEMEX_URI: ""
  memex_portal:
    ConnectionStrings__memex: ""
    ConnectionStrings__orleans: ""
    memex_postgres_password: ""
    MEMEX_URI: ""
    # AI provider keys — empty by default (neutral chart). Set in an overlay
    # (e.g. values.aks.yaml) or via --set / Key Vault CSI. Empty = no system
    # catalog seeded for that provider.
    Anthropic__ApiKey: ""
    AzureFoundry__ApiKey: ""
    # 🚨 Encryption-at-rest master key. Empty here is the NEUTRAL-CHART default, not a
    # supported deployment state: with no master key an install cannot store ANY
    # credential — provider key, GitHub PAT, registry sync-token signing key, Entra
    # credential — it refuses rather than persisting one in plaintext. Every real
    # deployment must set it in an overlay / --set / Key Vault CSI.
    Ai__KeyProtection__MasterKey: ""
    # Deployment inventory signing key (Doc/Architecture/DeploymentInventory): the reporter signs
    # with it, the control instance verifies with it. Per-deployment keys on the control instance
    # go in the map: {memex-cloud: "<key>"} → Hosting__ModuleReportSecret__memex-cloud.
    Hosting__ModuleReportSecret: ""
    Hosting__ModuleReportSecrets: {}
    # ---- Plugin catalog credentials -------------------------------------------
    # CONSUMER ONLY. There is no registry-side token allowlist here any more: the
    # `PluginCatalog__RegistryTokens` list this block used to advertise bound to nothing (no such
    # property on PluginCatalogOptions; PluginRegistryTokens.SectionName/.Validate are [Obsolete]),
    # so the "empty list = serves ANY anonymous caller, configure it in production" advice it
    # carried bought a belief in an access control and no access control. A registry is gated by
    # RequireInstanceKey plus the instance keys it issues, each resolving to a MeshWeaverInstance
    # and its admin-owned PluginGrant.
    #
    # The instance key THIS install presents, as `Authorization: Bearer`. Labelled the legacy
    # single-registry key and superseded in SHAPE by the per-registry list below, but fully read
    # and what memex authenticates with today (RegistryTokenResolver.LegacyTokenFallback keeps it
    # working for a sole or URL-matching registry) — not deprecated.
    PluginCatalog__RegistryToken: ""
    # Per-registry consumer keys, INDEX-ALIGNED with pluginCatalog.registries — rendered as
    # PluginCatalog__Registries__<i>__Token. Declared here (empty) so `helm show values` reveals
    # the supported surface; a list entry is a secret, so set it from an overlay or the Key Vault
    # CSI mount, never in a committed values file.
    PluginCatalogConsumerRegistryTokens: []
    # ---- GitHub App identity (the machine credential for PRIVATE repos) -------
    # PEM private key of the GitHub App whose INSTALLATION TOKEN every server-side GitHub read
    # uses: the store's package feed (StoreManifestSource), the Store card's Provision → Import
    # phase (UpdateToLatestFromGitHub), module discovery, and _GitSync.
    # 🚨 Without it those reads fall back to ANONYMOUS. On a PUBLIC repo that still works, so the
    # gap hides; on a PRIVATE one GitHub answers 404, which surfaces as an EMPTY STORE rather than
    # as an error. Pairs with config.memex_portal.GitHub__App__ClientId below — the key alone is
    # not enough, GitHubAppTokenService requires BOTH.
    # Emitted only when non-empty, so a Key Vault CSI mount (objectName github-app-privatekey)
    # stays authoritative and this can be left "" on every cluster deployment.
    GitHub__App__PrivateKey: ""
    # HMAC secret for INBOUND GitHub webhooks (/webhooks/github). Only an install that registers
    # its own hooks on the plugin repos needs it; a registry CONSUMER does not.
    GitHub__Webhook__Secret: ""
# ---- In-cluster Postgres ----------------------------------------------------
# enabled: true renders the memex-postgres StatefulSet/Service/Config/Secret (the self-host
# default). Set false on environments that run an EXTERNAL Postgres (the AKS namespaces use the
# Azure flexible server): the in-cluster resources are not rendered, and the portal's
# wait-for-postgres init probes the EXTERNAL host from config.memex_portal.MEMEX_HOST instead —
# a probe against the unrendered in-cluster service would wait forever (memex, 2026-08-20:
# every new pod stuck Init:0/1 while the old one kept serving).
postgres:
  enabled: true

config:
  memex_postgres:
    POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    POSTGRES_USER: "postgres"
  memex_migration:
    MEMEX_HOST: "memex-postgres-service"
    MEMEX_PORT: "5432"
    MEMEX_USERNAME: "postgres"
    MEMEX_JDBCCONNECTIONSTRING: "jdbc:postgresql://memex-postgres-service:5432/memex"
    MEMEX_DATABASENAME: "memex"
  memex_portal:
    MEMEX_HOST: "memex-postgres-service"
    MEMEX_PORT: "5432"
    MEMEX_USERNAME: "postgres"
    MEMEX_JDBCCONNECTIONSTRING: "jdbc:postgresql://memex-postgres-service:5432/memex"
    MEMEX_DATABASENAME: "memex"
    ASPNETCORE_HTTP_PORTS: "8080"
    Deployment__Backend: "Filesystem"
    Deployment__DataRoot: "/data"
    # ---- Deployment inventory (Doc/Architecture/DeploymentInventory) -------------------------
    # This instance's id in the fleet — MUST equal its Hosting/Deployment record id on the control
    # instance. Empty = the instance reports nothing. The control instance sets its id and leaves
    # Hosting__ReportTo empty (it files its own record); every other instance points ReportTo at
    # the control instance's base URL and carries the signing key as a SECRET (below).
    Hosting__Deployment: ""
    Hosting__ReportTo: ""
    Hosting__ReportInterval: "01:00:00"
    # The writable root for store-installed modules (ModuleRoot.ConfigKey). Empty here means
    # "follow Deployment__DataRoot", which the template applies — a deployment only sets this
    # when its module tree must live somewhere other than the data root.
    Modules__Root: ""
    # 🔗 ONE setting in two keys — they are not independent, and the gate is worthless
    # without the sweep. GateReadiness gates on state that ONLY the sweep writes, and the
    # health check reports Healthy while the sweep has not started (by design: a config
    # mistake must never black-hole a pod). So GateReadiness=true with DynamicTypes=false
    # is a gate that is registered, permanently green, and protects NOTHING — silently.
    # The portal now logs that combination at Critical on startup rather than letting a
    # deployment believe it is gated ("NodeType bake gate requested but the sweep is off").
    #
    # Both stay OFF by default — a considered decision, not an oversight:
    #   • The sweep enumerates EVERY NodeType across EVERY partition and activates and
    #     compiles each dynamic one. On a large mesh that is a boot-time subscribe/compile
    #     storm that starves the hubs; multi-silo it starved the Orleans membership probes
    #     into the "I have been told I am dead" restart loop (memex, 2026-07-22). Turning
    #     that on for every chart consumer — including single-node k3s, e2e and dev
    #     instances — would ship a known incident by default.
    #   • Correctness never needs it: types compile lazily on first access. The sweep buys
    #     deploy-time latency and a gateable signal, which is an operational trade a MANAGED
    #     env makes knowingly (see deploy/aks/values.aks.yaml, where both are "true").
    #   • The gate additionally needs a startupProbe on /health with a budget covering a full
    #     cold bake (~2.4 s per type, sequential — ~10 min on the largest mesh we run;
    #     measured 2026-08-10) and strategy.maxUnavailable:0. Defaulting it on with the
    #     chart's 5-minute startup budget would kill every pod mid-bake, forever.
    # An instance that wants the protection turns BOTH on and raises probes.startup in the
    # same change; progressDeadlineSeconds follows probes.startup automatically. See
    # config.yaml for what each key does.
    PreWarm__DynamicTypes: "false"
    PreWarm__GateReadiness: "false"
    # Operator escape hatch: serve even when the sweep ERRORED and therefore proved nothing.
    # Leave "false" — an unproven bake is not a passed bake, which is the guard the retired
    # pre-run bake Job used to enforce from outside the portal as Bake__AllowEmpty. It never
    # relaxes a real regression, and the /health payload keeps saying the bake was unproven.
    PreWarm__AllowUnprovenBake: "false"
    # Mount point of CI's published bake, consumed as <root>/<framework-identity>/<source>/*.zip.
    # Empty = the lane is inert and every dynamic type is compiled/lazily built as before.
    PreWarm__PrebuiltBundleRoot: ""
    # Arms DELETION in the retention sweep over that store (the scan, the plan and the ledger
    # line happen regardless). Off here deliberately, and note the CODE default is the opposite
    # (PrebuiltBundleRetention.Delete = true) — THIS line is what makes the fleet report-only,
    # which is why it must stay declared even though it looks like a no-op. Read one ledger line,
    # confirm the protected set covers every instance and every CI gate that pins an older
    # platform build, then arm it per instance. See Doc/Architecture/PrebuiltBundleRetention.
    PreWarm__PrebuiltBundleRetention__Delete: "false"
    # Arms DELETION of framework generations nothing is running any more (the claim + the
    # report happen regardless). Off by default — see config.yaml for what is kept and why
    # this is a decision taken against a report rather than a default.
    AssemblyCache__Retention__Delete: "false"
    # ---- Notification retention (Doc/Architecture/NotificationRetention) --------
    # Notifications are the most perishable rows on the platform — read within minutes or not at
    # all, linked to by nothing, and their subject outlives them. Until #3250 nothing ever removed
    # one: memex-cloud measured 4 476 of them on 2026-09-03, including the pre-addressing tail the
    # bell deliberately stopped reading rather than migrating.
    #
    # ARMED by default, unlike AssemblyCache__Retention__Delete above, and the asymmetry is
    # deliberate: that one deletes bytes a running portal is executing, this one deletes a
    # three-month-old pointer to a node that still exists — while a retention pass that ships
    # disarmed reproduces the very defect it was written for, since nobody arms a knob they have
    # never heard of. Set "false" to turn the pass into a complete no-op.
    Notifications__Retention__Enabled: "true"
    # A notification is removed once its node has gone this long without being written. A TimeSpan
    # ("d.hh:mm:ss"), matching AssemblyCache__Retention__MinimumAge. CLAMPED to a 7-day floor, so a
    # "0.00:00:00" typo cannot empty a bell. An unparseable value keeps the 90-day default.
    Notifications__Retention__MaxAge: "90.00:00:00"
    # The hard cap on how many notifications ONE run may remove. The pass runs per signing-in user,
    # over that user's own partition (plus Admin for a global admin) — so this is the bound on a
    # single logon's housekeeping, and a partition with a large backlog drains over successive
    # logons rather than in one mass delete.
    Notifications__Retention__MaxDeletionsPerRun: "200"
    Deployment__Orleans__Clustering: "Localhost"
    Storage__Name: "content"
    Storage__SourceType: "FileSystem"
    Storage__BasePath: "/data/content"
    Graph__Storage__Type: "PostgreSql"
    Graph__Storage__BasePath: "/data/graph"
    Mcp__BaseUrl: "http://memex-portal-service:8080"
    # Public https host of THIS instance — builds the "Open" links in outbound email
    # (invitations / access-granted). Leave empty to DERIVE it from ingress.host
    # (https://{ingress.host}); set only to override with a vanity domain.
    Portal__BaseUrl: ""
    # AI model catalog — empty by default. An overlay sets endpoints + model
    # lists (+ keys in secrets above) to seed the system catalog on deploy.
    Anthropic__Endpoint: ""
    Anthropic__Models__0: ""
    Anthropic__Models__1: ""
    Anthropic__Models__2: ""
    AzureFoundry__Endpoint: ""
    AzureFoundry__Models__0: ""
    AzureFoundry__Models__1: ""
    AzureFoundry__Models__2: ""
    ModelTier__Heavy: ""
    ModelTier__Standard: ""
    ModelTier__Light: ""
    ModelTier__Utility: ""
    ClaudeCode__ConfigDirRoot: ""
    # ---- System email (Microsoft Graph) — BIDIRECTIONAL. Off by default; an
    # overlay turns it on per environment by setting Email__Enabled + the env's
    # own MailboxAddress / TenantId / ClientId (+ WebhookBaseUrl for inbound).
    # The secret Email__ClientSecret comes from the SecretProviderClass.
    Email__Enabled: "false"
    Email__MailboxAddress: ""
    Email__TenantId: ""
    Email__ClientId: ""
    Email__UseManagedIdentity: "false"
    Email__InboundEnabled: "false"
    Email__WebhookBaseUrl: ""
    # Shared webhook-guard value Graph echoes on every inbound notification; the
    # /api/email webhook rejects mismatches. Global (same across envs is fine —
    # each deployment validates against its own configured value).
    Email__SubscriptionClientState: "meshweaver-emailhook-7f3c9a21e84b46d2b1c05e9af6d3"
    # ---- What the Executive Assistant may SEND as the user (Mail module, MeshWeaver.Plugins).
    # Empty = the module's safe default (mail: DraftOnly; Teams posting: Off). The ONLY value
    # that opens a gate is the word "Send". Set per environment in the overlay.
    Email__AgentSend: ""
    Teams__AgentSend: ""
    # ---- GitHub App identity (non-secret half) --------------------------------
    # The App's client id, and which installation to use when the App is installed on more
    # than one account. The PEM key is the secret half (secrets.memex_portal.GitHub__App__
    # PrivateKey, normally injected from Key Vault) — GitHubAppTokenService needs BOTH and
    # throws "The GitHub App is not configured" with only one.
    # Empty on a deployment that reads no private repo. Set them on any install whose store
    # feed or plugin imports point at a PRIVATE repo, otherwise those reads go ANONYMOUS and
    # a private repo answers 404 — which renders as an EMPTY STORE, never as an error.
    GitHub__App__ClientId: ""
    # Pin the installation when the App has several: by owner (login) or by numeric id.
    # Neither set + multiple installations = the FIRST one is used and a warning is logged.
    GitHub__App__InstallationOwner: ""
    GitHub__App__InstallationId: ""
