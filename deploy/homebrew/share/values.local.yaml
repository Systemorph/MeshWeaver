# =============================================================================
# memex-local — local Helm overlay for Colima k3s (Mac)
# =============================================================================
# This file is the LOCAL OVERLAY layered on top of the neutral chart defaults
# (deploy/helm/values.yaml). It is the 1:1 automation of the overlay shown in
# LocalColimaMac.md §4. `memex-local up` copies this template to
#   ~/.memex-local/values.local.yaml
# on first run, substituting freshly generated secrets for the __TOKENS__ below.
# It answers NEITHER the database question NOR the sign-in question — the portal's
# first-run setup wizard asks those (`memex-local setup`). Edit
# ~/.memex-local/values.local.yaml (NOT this template) only to PIN an answer and
# skip the wizard; re-run `memex-local up` to apply.
#
# Helm invocation (see `memex-local up`, maps to LocalColimaMac.md §4):
#   helm upgrade --install memex deploy/helm \
#     -f deploy/helm/values.yaml \
#     -f ~/.memex-local/values.local.yaml \
#     -n memex --create-namespace
#
# NOTE on logging: the chart's portal ConfigMap is a fixed allow-list and the
# chart templates are source-of-truth (we never edit them), so the verbose log
# level declared here under config.memex_portal.Logging__LogLevel__Default is
# ALSO applied by `memex-local up` as a deployment-config override via
# `kubectl set env` (the override wins over envFrom). We never touch any
# committed appsettings*.json. See deploy/homebrew/README.md → "Full logging".
# =============================================================================

# ---- Postgres (in-cluster StatefulSet on a 10Gi PVC — pgvector/pgvector:pg17)
# The password is generated once by `memex-local up` and reused across the three
# secret groups. The chart's secrets templates BUILD the connection strings from
# memex_postgres_password, so only the password is strictly required here.
secrets:
  memex_postgres:
    memex_postgres_password: "__PG_PASSWORD__"
  memex_migration:
    memex_postgres_password: "__PG_PASSWORD__"
    ConnectionStrings__memex: "Host=memex-postgres-service;Port=5432;Database=memex;Username=postgres;Password=__PG_PASSWORD__"
  memex_portal:
    memex_postgres_password: "__PG_PASSWORD__"
    ConnectionStrings__memex: "Host=memex-postgres-service;Port=5432;Database=memex;Username=postgres;Password=__PG_PASSWORD__"
    # AI key-protection master key (encrypts stored provider keys). Generated once.
    Ai__KeyProtection__MasterKey: "__AI_MASTER_KEY__"
    # Microsoft Entra client secret — NOT set here any more. The setup wizard
    # collects it and stores it enc:v1:-encrypted in the instance manifest on the
    # /data PVC, under the master key below. Uncomment only to PIN it from the
    # deployment (an unattended install), in which case it outranks the manifest.
    # Authentication__Microsoft__ClientSecret: "<entra-client-secret>"
    # OpenAI-compatible (Ollama) API key — any non-empty token; "ollama" per doc §10.
    OpenAICompatible__ApiKey: "ollama"

config:
  memex_portal:
    # ---- Auth and database: ASKED, not baked --------------------------------
    # 🚨 These keys are deliberately EMPTY, and that is what makes `memex-local up`
    # land on the first-run SETUP WIZARD instead of a portal someone else's choices
    # already configured. This file used to answer both questions for you: dev login
    # on, a placeholder admin username you had to remember to edit, and a commented
    # block of Entra lines to uncomment if you wanted the OAuth flow. That is a
    # deployment making an identity decision on the operator's behalf — and getting
    # it wrong in both directions, since a laptop that wants Entra had to hand-edit
    # YAML while a laptop that wanted dev login shipped with `<your-username>` as its
    # only administrator.
    #
    # Now the portal asks: which database, which logins, which model keys, which
    # modules. Run `memex-local setup` after `up` for the URL and the one-time token.
    #
    # Empty means UNSET here, not "off": the chart emits these keys only when they
    # carry a value, so the instance manifest the wizard writes is what answers them.
    # Setting one back to a real value makes THIS FILE the answer again — deployment
    # configuration always outranks the manifest — which is exactly how you pin an
    # unattended install (see `memex-local up --unattended`).
    Authentication__EnableDevLogin: ""
    Authentication__DevAdminUsers: ""
    Authentication__Provider: ""
    Authentication__Microsoft__ClientId: ""
    Authentication__Microsoft__TenantId: ""
    # Using Entra locally? The wizard asks for the client id, tenant and secret — but
    # Entra still needs to know where to send you back, so register BOTH redirect URIs
    # on the app registration before you answer:
    #   https://memex.localhost:8443/signin-microsoft
    #   https://memex.localhost/signin-microsoft
    # Choosing it also moves the sign-out path from /dev/logout to /auth/logout.
    # ---- Database: the wizard's question, not this file's answer -------------
    # Blank ⇒ the chart omits Graph__Storage__* ⇒ the portal has no storage ⇒ it
    # serves the setup wizard. The chart still deploys its Postgres StatefulSet, so
    # BOTH answers work: pick SQLite (a single file on the /data PVC, nothing else
    # running) or PostgreSQL and paste the connection string `memex-local setup`
    # prints for you.
    Graph__Storage__Type: ""
    Graph__Storage__BasePath: ""

    # ---- Instance identity (tab title + favicon badge — LocalColimaMac.md §12)
    Portal__InstanceName: "Local"
    Portal__InstanceColor: "#f59e0b"
    # Large Safari bookmark / Start-Page tile (apple-touch-icon) — the yellow "L" tile.
    Portal__AppleTouchIcon: "_content/Memex.Portal.Shared/brand/local-180.png"

    # ---- Local LLM via host-native Ollama (LocalColimaMac.md §10) ------------
    OpenAICompatible__Endpoint: "http://ollama:11434/v1"
    OpenAICompatible__Models__0: "qwen3.6-code"
    # Auto-discover the endpoint's model list instead of the static Models[] above.
    # Read as a Boolean — must be "true"/"false", never left empty (issue #352).
    OpenAICompatible__DiscoverModels: "false"

    # NOTE: behaviour defaults that should FOLLOW the product (e.g. the startup
    # bake) are NOT in this template — they live in the tracked layer
    # share/values.local.defaults.yaml, which `memex-local up` passes before
    # this overlay, so existing installs pick them up on `brew upgrade` without
    # regenerating this file. Override any of them here the normal helm way
    # (this file wins — it is passed last).

    # ---- Full logging (verbose) — see header note. Declared here for
    # visibility; ALSO applied by `memex-local up` via `kubectl set env`
    # because the chart's ConfigMap is a fixed allow-list. Set to Trace for
    # maximum verbosity. We never edit committed appsettings*.json.
    Logging__LogLevel__Default: "Debug"

# ---- Portal Ingress (TLS via ingress-nginx — LocalColimaMac.md §5/§6) -------
ingress:
  enabled: true
  host: "memex.localhost"
  tlsSecret: "memex-portal-tls"

# ---- External Ollama, fronted by an in-cluster Service (LocalColimaMac.md §10)
# host = Colima's host-gateway IP (the host where `ollama serve` runs).
ollama:
  external:
    enabled: true
    host: "192.168.5.2"
    port: 11434
