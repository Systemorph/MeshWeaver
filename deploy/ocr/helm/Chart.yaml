apiVersion: v2
name: ocr
description: >-
  A stateless OCR service: Tesseract 5 with the eng, deu, fra, ita and ind packs and osd baked into the
  image, cluster-internal only, no egress. Answers POST /ocr with {text, languages, engine}, the contract
  MeshWeaver.Plugins' MeshWeaver.Ocr HttpService engine speaks. Renders NOTHING unless `enabled: true`.
  See deploy/ocr/.
type: application
version: 0.1.0
# The engine the image bakes in (deploy/ocr/Dockerfile).
appVersion: "tesseract-5.5"
