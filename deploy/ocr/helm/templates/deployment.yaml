{{- if .Values.enabled }}
{{- if not .Values.image.repository }}
{{- fail "image.repository is required (<registry>/ocr) — the image carries the language packs" }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag is required — name the immutable tesseract-5.5-<short sha> tag, never the moving line" }}
{{- end }}
{{- /* Only the SHA-suffixed tag CI publishes is immutable; `tesseract-5.5`, `latest` or any other moving
       tag under pullPolicy IfNotPresent lets two nodes run two different cached builds. */}}
{{- if not (regexMatch "^tesseract-[0-9]+\\.[0-9]+-[0-9a-f]{7,40}$" (toString .Values.image.tag)) }}
{{- fail (printf "image.tag %q is not an immutable tesseract-<line>-<short sha> tag (e.g. tesseract-5.5-0a81895) — a moving tag runs whatever build a node cached" (toString .Values.image.tag)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocr.fullname" . }}
  labels:
    {{- include "ocr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ocr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocr.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The service calls nothing — not even the API server — so it carries no token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      # No volume over /usr/share/tesseract-ocr: the packs are BAKED INTO THE IMAGE.
      containers:
        - name: ocr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: OCR_MAX_BYTES
              value: {{ .Values.limits.maxBytes | int64 | quote }}
            - name: OCR_MAX_PIXELS
              value: {{ .Values.limits.maxPixels | int64 | quote }}
            - name: OCR_TIMEOUT_SECONDS
              value: {{ .Values.limits.timeoutSeconds | int64 | quote }}
            - name: OCR_CONCURRENCY
              value: {{ .Values.limits.concurrency | int64 | quote }}
            - name: OCR_MAX_ADMITTED
              value: {{ .Values.limits.maxAdmitted | int64 | quote }}
            {{- if .Values.defaultLanguages }}
            - name: OCR_DEFAULT_LANGUAGES
              value: {{ .Values.defaultLanguages | quote }}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: OCR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.secretKey | quote }}
            {{- end }}
            - name: OMP_THREAD_LIMIT
              value: "1"
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Startup and liveness ask whether the PROCESS is up (/healthz); /readyz gates traffic on the
          # engine and packs having been found at start.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            {{- with .Values.startupProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            {{- with .Values.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            {{- with .Values.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
