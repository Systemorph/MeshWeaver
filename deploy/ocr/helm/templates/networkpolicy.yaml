{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Ingress only from the named namespaces, on the service port only. Egress: NONE — the service reads
# the image it is sent with the packs it carries and calls nothing (no DNS, no API server, no registry).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ocr.fullname" . }}
  labels:
    {{- include "ocr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ocr.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    {{- if .Values.networkPolicy.allowedNamespaces }}
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
