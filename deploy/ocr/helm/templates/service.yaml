{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocr.fullname" . }}
  labels:
    {{- include "ocr.labels" . | nindent 4 }}
spec:
  {{- if ne .Values.service.type "ClusterIP" }}
  {{- fail "ocr is cluster-internal: service.type must be ClusterIP" }}
  {{- end }}
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ocr.selectorLabels" . | nindent 4 }}
{{- end }}
