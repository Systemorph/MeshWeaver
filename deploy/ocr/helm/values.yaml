# Values for ocr (deploy/ocr/Dockerfile). ClusterIP only, never an Ingress, and no egress at all.

# 🚨 DISABLED BY DEFAULT: the chart renders nothing until an estate's values file sets this. Turning
# OCR on for an instance is a deployment-record change the owner approves (deploy/ocr/README.md →
# "Enabling it on an instance"), never a default.
enabled: false

replicaCount: 1

image:
  # Built and pushed by CI (.github/workflows/ocr-image.yml):
  #   meshweaver.azurecr.io/ocr:tesseract-5.5-<short sha>   immutable — what an estate overlay names
  #   meshweaver.azurecr.io/ocr:tesseract-5.5               moving — a laptop `docker pull` only
  repository: ""        # required: <registry>/ocr
  tag: ""               # required: the immutable tesseract-5.5-<short sha> tag (the chart refuses any other shape)
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The NetworkPolicy admits TCP 8080 only from these namespaces (matched by the
# kubernetes.io/metadata.name label every namespace carries), and denies ALL egress: the service needs
# nothing beyond its listening socket. Empty allowedNamespaces ⇒ nothing is admitted.
networkPolicy:
  enabled: true
  allowedNamespaces: []

# Optional shared key (the client's Ocr:HttpService:ApiKey, sent as `Authorization: Bearer …`), read
# from an EXISTING Secret — never a value in this file. Unset ⇒ the NetworkPolicy is the boundary.
auth:
  existingSecret: ""
  secretKey: api-key

# Languages read when a caller sends no hints (ISO 639-1, comma-separated). Empty ⇒ every baked pack
# (de,en,fr,id,it). A caller's hints may still name any baked pack.
defaultLanguages: ""

limits:
  maxBytes: 20971520        # 20 MiB — the client's Ocr:MaxImageBytes default
  maxPixels: 40000000       # an A4 page at 600 dpi is ~35 MP
  timeoutSeconds: 150       # slot wait + read, per image; under the client's 180 s Ocr:TimeoutSeconds
  concurrency: 2            # Tesseract processes at once per pod; the rest wait inside the deadline
  maxAdmitted: 8            # requests whose body is held at once (≥ concurrency); the next is 503, unread.
                            # Bounds buffered bodies to maxAdmitted × maxBytes (8 × 20 MiB) under the memory limit

service:
  type: ClusterIP
  port: 8080

# Tesseract on CPU, one thread per process (OMP_THREAD_LIMIT=1), `limits.concurrency` processes.
# Measured locally: a 1200x444 page with all five packs reads in ~0.6 s.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

startupProbe:
  failureThreshold: 12
  periodSeconds: 5
readinessProbe:
  periodSeconds: 15
  timeoutSeconds: 5
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
