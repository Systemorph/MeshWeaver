apiVersion: v1
kind: Service
metadata:
  name: {{ include "s1.fullname" . }}
  labels:
    {{- include "s1.labels" . | nindent 4 }}
spec:
  {{- if ne .Values.service.type "ClusterIP" }}
  {{- fail "s1-extract is cluster-internal: service.type must be ClusterIP" }}
  {{- end }}
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "s1.selectorLabels" . | nindent 4 }}
