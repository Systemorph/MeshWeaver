apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "s1.fullname" . }}
  labels:
    {{- include "s1.labels" . | nindent 4 }}
---
# TokenReview is how the service validates a caller's projected token; creating one is exactly what
# the built-in system:auth-delegator ClusterRole grants, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-auth-delegator" .Release.Namespace (include "s1.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "s1.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "s1.fullname" . }}
    namespace: {{ .Release.Namespace }}
