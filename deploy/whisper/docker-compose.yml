# The centralized Swiss-German Whisper container. Bring it up, then point the portal at it:
#   Speech:Endpoint = http://localhost:8080   (or http://whisper:8080 from another compose service)
#   Speech:Enabled  = true
#
# 🚨 The model is BAKED at build time, not mounted. The DEFAULT build needs nothing in ./models/: it
# fetches the Apache-2.0 Flix-AI/flix-swissgerman-full model from a pinned Hugging Face revision and
# converts it to GGML q8_0 (see the Dockerfile). The NON-commercial Flurin17 model is opt-in —
# put it at ./models/model.bin and set `args: { MODEL_SOURCE: context }` under `build:`.
# Licence reasoning: /Doc/Architecture/VoiceModelDistribution.
#
# 🚨 And do NOT bind-mount ./models over /models — an empty or stale host directory SHADOWS the model
# baked into the image, and whisper-server then starts with nothing to load.

services:
  whisper:
    build: .
    image: meshweaver/whisper-swiss-german:latest
    ports:
      - "8080:8080"
    environment:
      WHISPER_MODEL: /models/model.bin
      WHISPER_LANGUAGE: de   # Swiss German transcribes OUT as Standard German
      WHISPER_THREADS: 4
    restart: unless-stopped
    healthcheck:
      # whisper.cpp server answers /inference; a bare GET returns a non-5xx once it's up + the model loaded.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s   # model load can take a while on first start
