# Values for the centralized Swiss-German whisper.cpp server (deploy/whisper/Dockerfile).
# The container is cluster-internal: the portal reaches it at http://<release>-whisper-swiss-german:8080
# and forwards audio via ISpeechTranscriber. Point the portal at it with:
#   Speech__Endpoint = http://<release>-whisper-swiss-german:8080
#   Speech__Enabled  = true

replicaCount: 1

image:
  # 🚨 The image CARRIES THE MODEL, and CI builds it: .github/workflows/whisper-image.yml pushes
  #   meshweaver.azurecr.io/whisper-swiss-german:1.7.4-flix-large-v3-q8-<short sha>
  # on every main change to deploy/whisper/Dockerfile — whisper.cpp v1.7.4 (static, portable CPU build) +
  # the APACHE-2.0 Flix-AI/flix-swissgerman-full large-v3 fine-tune, GGML q8_0, converted in the build from
  # a pinned Hugging Face revision. That is the model a COMMERCIAL estate may serve.
  # An estate overlay names the IMMUTABLE <line>-<sha> tag (an approved ApplyChart then binds the bytes).
  # 🚨 `1.7.4` and `1.7.4-static` (hand-built 2026-08-18) contain NO model — measured 2026-09-30 — and a
  # pod on either never gets Ready. Never name them. The CC BY-NC Flurin17 build (MODEL_SOURCE=context)
  # is non-commercial only and never built by CI.
  repository: meshweaver.azurecr.io/whisper-swiss-german
  tag: ""   # REQUIRED — set the immutable 1.7.4-flix-large-v3-q8-<sha> tag in the estate overlay
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The whisper model IS baked into the image, at /models/model.bin (~1.7 GB for the default q8_0).
#
# 🚨 There is no `model.url` any more, and that is the fix for #3906 — not an oversight. The key used
# to point an initContainer at a GitHub release on THIS repo; #2593 moved that asset to the PRIVATE
# MeshWeaver.Plugins repo and left the pin behind, so the URL 404'd and every pod died in Init:Error
# before the server ever ran. Nothing is fetched at run time any more: the registry this pod already
# authenticates to for its image is the channel that costs nothing new, for the Apache-2.0 default and
# the NC model alike.
# Why those two alternatives lost, in full: /Doc/Architecture/VoiceModelDistribution.
model:
  # Whisper language hint. "de" transcribes Swiss German OUT as Standard German (best for strong
  # dialect); "auto" detects (en/de/…) at some accuracy cost on heavy dialect.
  language: "de"
  threads: 4

service:
  type: ClusterIP
  port: 8080

# whisper.cpp (CPU large-v3-turbo q5) wants a few cores + RAM for the model + compute buffers.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 6Gi

# Model load + first request take time; probes are generous so the pod isn't killed while warming.
startupProbe:
  # Gates readiness/liveness until the server answers — covers the 547 MB model LOAD (no download).
  failureThreshold: 60
  periodSeconds: 10
readinessProbe:
  periodSeconds: 15
  timeoutSeconds: 5
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
