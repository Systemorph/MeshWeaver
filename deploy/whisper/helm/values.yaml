# Values for the centralized Swiss-German whisper.cpp server (deploy/whisper/Dockerfile).
# The container is cluster-internal: the portal reaches it at http://<release>-whisper-swiss-german:8080
# and forwards audio via ISpeechTranscriber. Point the portal at it with:
#   Speech__Endpoint = http://<release>-whisper-swiss-german:8080
#   Speech__Enabled  = true

replicaCount: 1

image:
  # 🚨 The image CARRIES THE MODEL — put it in the build context BEFORE building, or the build fails
  # naming the file (deploy/whisper/Dockerfile):
  #   gh release download voice-model-swiss-german --repo Systemorph/MeshWeaver.Plugins \
  #     --pattern 'ggml-swiss-german-turbo-q5_0.bin' --output deploy/whisper/models/model.bin
  #   az acr build -r meshweaver -t whisper-swiss-german:1.7.4 deploy/whisper
  # The tag names the whisper.cpp release the binary is built from (v1.7.4), not the model; a model
  # swap is a rebuild under a tag of your choosing. An image built before 2026-09-10 has NO model in
  # it and will start with nothing to load — rebuild before rolling this chart.
  repository: meshweaver.azurecr.io/whisper-swiss-german
  tag: "1.7.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The ~547 MB whisper model IS baked into the image, at /models/model.bin.
#
# 🚨 There is no `model.url` any more, and that is the fix for #3906 — not an oversight. The key used
# to point an initContainer at a GitHub release on THIS repo; #2593 moved that asset to the PRIVATE
# MeshWeaver.Plugins repo and left the pin behind, so the URL 404'd and every pod died in Init:Error
# before the server ever ran. There is nothing to repoint it AT: the model is a CC BY-NC-4.0
# derivative that must not be published for anonymous download, and a cluster secret able to read the
# private repo would buy one 547 MB blob with read access to the whole private fleet source. The
# registry this pod already authenticates to for its image is the channel that costs nothing new.
# Why those two alternatives lost, in full: /Doc/Architecture/VoiceModelDistribution.
model:
  # Whisper language hint. "de" transcribes Swiss German OUT as Standard German (best for strong
  # dialect); "auto" detects (en/de/…) at some accuracy cost on heavy dialect.
  language: "de"
  threads: 4

service:
  type: ClusterIP
  port: 8080

# whisper.cpp (CPU large-v3-turbo q5) wants a few cores + RAM for the model + compute buffers.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 6Gi

# Model load + first request take time; probes are generous so the pod isn't killed while warming.
startupProbe:
  # Gates readiness/liveness until the server answers — covers the 547 MB model LOAD (no download).
  failureThreshold: 60
  periodSeconds: 10
readinessProbe:
  periodSeconds: 15
  timeoutSeconds: 5
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
